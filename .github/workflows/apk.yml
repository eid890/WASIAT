# Membangun aplikasi Android WASIAT (APK) dan menaruhnya di situs: /unduh/WASIAT.apk
# Berjalan otomatis bila isi folder android/ berubah, atau manual lewat tab Actions > Run workflow.
#
# Kunci tanda tangan APK (opsional tetapi disarankan): simpan di Settings > Secrets and variables >
# Actions dengan nama WASIAT_KEYSTORE (isi berkas .jks dalam base64) dan WASIAT_KEY_PASS (sandinya).
# Tanpa kunci tersebut APK tetap dibuat dengan kunci sementara, tetapi pembaruan APK berikutnya
# harus dipasang dengan menghapus aplikasi lama lebih dulu.
name: Bangun APK WASIAT

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-wasiat
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Susun proyek Android
        run: bash android/susun.sh build-android

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.WASIAT_KEYSTORE }}
          KEY_PASS: ${{ secrets.WASIAT_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kunci.jks"
            echo "KS_PASS=$KEY_PASS" >> "$GITHUB_ENV"
            echo "KUNCI=tetap" >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/kunci.jks" -alias wasiat -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=WASIAT, O=Pondok Pesantren Wihdatul Ummah, L=Poso, C=ID"
            echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
            echo "KUNCI=sementara" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/kunci.jks" >> "$GITHUB_ENV"

      - name: Bangun APK
        working-directory: build-android
        run: gradle --no-daemon assembleRelease -PkodeVersi=${{ github.run_number }}

      - name: Taruh APK di situs (/unduh)
        run: |
          mkdir -p unduh
          cp build-android/app/build/outputs/apk/release/app-release.apk unduh/WASIAT.apk
          UKURAN=$(stat -c %s unduh/WASIAT.apk)
          cat > unduh/versi.json <<JSON
          {"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}", "tanggal": "$(date -u +%Y-%m-%d)", "ukuran": $UKURAN, "kunci": "$KUNCI"}
          JSON
          git config user.name "WASIAT Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unduh/WASIAT.apk unduh/versi.json
          git commit -m "APK WASIAT versi 1.0.${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: WASIAT-apk
          path: unduh/WASIAT.apk
          retention-days: 30
