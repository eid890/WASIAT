  // ---------------- PEMILIK BARANG (fondasi -- fitur kantin lengkap menyusul) ----------------
  var kantinCart = []; // keranjang sementara (di memori, reset tiap buka halaman Kasir)

  // ---- Kunci PIN untuk menu sensitif Pemilik Barang ----
  // HP kasir sering dipinjamkan ke santri untuk mengecek saldo/akunnya. Tanpa kunci,
  // santri bisa membuka "Barang Jualan Saya" dan mengubah harga produk, atau
  // mengajukan penarikan saldo pemilik. Menu yang menyangkut uang dan harga karena
  // itu dikunci dengan PIN login pemilik.
  //
  // Menu Kasir dan Cek Akun Santri SENGAJA tidak dikunci -- itu justru yang perlu
  // dipakai santri saat meminjam HP.
  var MENU_PERLU_PIN = ['barang','saldo','omzet','riwsaldo','riwayat'];
  var _pinPemilikTerbukaSampai = 0;   // waktu kedaluwarsa verifikasi (di memori saja)

  function pinPemilikMasihBerlaku(){ return Date.now() < _pinPemilikTerbukaSampai; }

  // Minta PIN sekali, lalu berlaku 5 menit supaya pemilik tidak perlu mengetik
  // berulang kali saat berpindah antar menu. Disimpan di memori, BUKAN localStorage,
  // sehingga hilang begitu aplikasi ditutup atau dimuat ulang.
  function mintaPinPemilik(lanjut){
    if (pinPemilikMasihBerlaku()) { lanjut(); return; }
    var fields =
      warnBox('Menu ini berisi harga produk dan saldo Anda. Masukkan PIN login Anda untuk membukanya.') +
      '<label>PIN Login Anda</label><input type="password" id="pinPemilikInput" inputmode="numeric" placeholder="PIN akun Anda" autocomplete="off">';
    var modal = openModal('Verifikasi Pemilik', fields, function(m){
      var pin = m.querySelector('#pinPemilikInput').value.trim();
      if (!pin) { alert('PIN wajib diisi.'); return false; }
      return api('validasiPinPengguna', {nama: STATE.user.nama, pin: pin}).then(function(r){
        if (!r.ok) { alert(r.error); throw new Error(r.error); }
        _pinPemilikTerbukaSampai = Date.now() + 5 * 60 * 1000;
        lanjut();
      });
    });
    // Kalau dibatalkan, kembalikan ke Kasir supaya layar tidak tertinggal kosong
    modal.querySelector('#modalBatal').addEventListener('click', function(){
      dashboardPemilikBarang('kasir');
    });
    setTimeout(function(){
      var el = modal.querySelector('#pinPemilikInput');
      if (el) el.focus();
    }, 100);
  }

  function dashboardPemilikBarang(activeKey){
    STATE._contentId = 'dp-content';
    var navItems = [
      {key:'kasir',   label:'Kasir (Jual)',      icon:'&#128717;'},
      {key:'barang',  label:'Barang Jualan Saya &#128274;', icon:'&#128230;'},
      {key:'riwayat', label:'Riwayat Transaksi &#128274;', icon:'&#128203;'},
      {key:'omzet',   label:'Laporan Omzet &#128274;',     icon:'&#128200;'},
      {key:'saldo',   label:'Saldo &amp; Tarik &#128274;', icon:'&#128176;'},
      {key:'riwsaldo',label:'Riwayat Saldo &#128274;',     icon:'&#128337;'}
    ];
    var map = {kasir:pemilikKasir, barang:pemilikKelolaBarang, riwayat:pemilikRiwayat, omzet:pemilikOmzet, saldo:pemilikSaldo, riwsaldo:pemilikRiwayatSaldo};
    activeKey = activeKey && map[activeKey] ? activeKey : 'kasir';

    // Bungkus pembukaan menu: yang sensitif diminta PIN dulu.
    function buka(key){
      if (MENU_PERLU_PIN.indexOf(key) !== -1) mintaPinPemilik(function(){ map[key](); });
      else map[key]();
    }

    renderSidebarShell({title:'Dashboard Pemilik Barang', navItems:navItems, activeKey:activeKey, contentId:'dp-content', onSelect:buka});
    buka(activeKey);
  }

  function pemilikKasir(){
    var c = getContentEl();
    c.innerHTML = '<p>Memuat menu...</p>';
    kantinCart = [];
    api('getBarangSaya', {pemilik: STATE.user.nama}).then(function(res){
      if(!res.ok){ c.innerHTML = errBox(res.error); return; }
      var tombolCekSantri = '<div class="card"><button class="secondary" id="btnCekAkunSantri">&#128100; Cek Akun Santri</button>' +
        '<p class="muted" style="margin-top:6px">Pinjamkan layar ini ke santri untuk cek saldo/riwayatnya sendiri (pakai PIN Transaksi miliknya).</p></div>';
      if(!res.data.length){ c.innerHTML = tombolCekSantri + '<div class="card">'+warnBox('Anda belum punya barang jualan. Buka menu "Barang Jualan Saya" di sebelah kiri untuk menambahkannya sendiri.')+'</div>'; ikatCekAkunSantri(); return; }
      var barangList = res.data;
      // Mode tampilan bisa dipilih kasir dan diingat. Kalau koneksi sedang lambat,
      // mode "Daftar" (tanpa foto) membuat halaman terbuka seketika.
      // Tombol pilihan SELALU tersedia -- sejak ada gambar default, produk tanpa foto
      // pun tetap tampil rapi dalam mode kartu, jadi tidak perlu lagi memaksa mode
      // daftar hanya karena belum ada foto yang diunggah.
      var modeMenu = 'foto';
      try { modeMenu = localStorage.getItem('wasiatModeMenuKantin') || 'foto'; } catch(e){}

      function htmlKartuBarang(b, i){
        if (modeMenu === 'teks') {
          return '<div class="menu-item-teks">' +
            '<div><b>'+esc(b.nama)+'</b><div class="menu-harga">Rp'+b.harga.toLocaleString('id-ID')+'</div></div>' +
            '<button class="small btnTambahKantinCart" data-i="'+i+'">+</button></div>';
        }
        // loading="lazy" + fotoUkuran(240): foto hanya diunduh saat kartunya terlihat,
        // dan yang diunduh adalah versi kecil dari server Google -- bukan foto penuh.
        var gambar = '<img src="'+esc(gambarProduk(b.foto, b.nama, 240))+'" alt="'+esc(b.nama)+'" loading="lazy" decoding="async">';
        return '<div class="menu-kartu">' + gambar +
          '<div class="menu-isi"><b>'+esc(b.nama)+'</b>' +
          '<div class="menu-harga">Rp'+b.harga.toLocaleString('id-ID')+'</div>' +
          '<button class="small btnTambahKantinCart" data-i="'+i+'">+ Keranjang</button></div></div>';
      }

      c.innerHTML = tombolCekSantri + '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<h3 style="margin:0">Menu Jualan Saya</h3>' +
          '<button class="secondary small" id="btnModeMenu">'+(modeMenu==='foto'?'&#9776; Tampilan Daftar':'&#128444; Tampilan Foto')+'</button>' +
        '</div>' +
        '<div id="menuKantinWrap" class="'+(modeMenu==='foto'?'menu-grid':'menu-list')+'" style="margin-top:12px">' +
        barangList.map(htmlKartuBarang).join('') + '</div></div>' +
        '<div class="card" id="kantinCartWrap" style="display:none"><h3>Keranjang</h3><div id="kantinCartList"></div>' +
        '<p style="font-size:18px;font-weight:700;text-align:right;margin-top:8px">Total: <span id="kantinCartTotal">Rp0</span></p>' +
        '<button id="btnBayarKantin">Proses Pembayaran</button> <button class="secondary" id="btnKosongkanKantin">Kosongkan</button></div>';
      ikatCekAkunSantri();

      function renderCart(){
        var wrap = document.getElementById('kantinCartWrap');
        if (!kantinCart.length) { wrap.style.display = 'none'; return; }
        wrap.style.display = 'block';
        var total = 0;
        document.getElementById('kantinCartList').innerHTML = kantinCart.map(function(it,idx){
          var sub = it.harga*it.jumlah; total += sub;
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e2e8f0">' +
            '<span>'+esc(it.nama)+' x'+it.jumlah+'</span><span>Rp'+sub.toLocaleString('id-ID')+' <button class="small danger btnHapusKantinItem" data-idx="'+idx+'">&times;</button></span></div>';
        }).join('');
        document.getElementById('kantinCartTotal').textContent = 'Rp'+total.toLocaleString('id-ID');
        document.querySelectorAll('.btnHapusKantinItem').forEach(function(btn){
          btn.onclick = function(){ kantinCart.splice(Number(btn.dataset.idx),1); renderCart(); };
        });
      }
      function ikatTombolKeranjang(){
        document.querySelectorAll('.btnTambahKantinCart').forEach(function(btn){
          btn.onclick = function(){
            var b = barangList[Number(btn.dataset.i)];
            var existing = kantinCart.find(function(x){return x.nama===b.nama;});
            if (existing) existing.jumlah++;
            else kantinCart.push({nama:b.nama, harga:b.harga, potongan:b.potongan, jumlah:1});
            renderCart();
            getarkanHp([40]); // umpan balik singkat supaya kasir yakin barang masuk
          };
        });
      }
      ikatTombolKeranjang();

      var btnMode = document.getElementById('btnModeMenu');
      if (btnMode) btnMode.onclick = function(){
        modeMenu = (modeMenu === 'foto') ? 'teks' : 'foto';
        try { localStorage.setItem('wasiatModeMenuKantin', modeMenu); } catch(e){}
        var wrap = document.getElementById('menuKantinWrap');
        wrap.className = (modeMenu === 'foto') ? 'menu-grid' : 'menu-list';
        wrap.innerHTML = barangList.map(htmlKartuBarang).join('');
        btnMode.innerHTML = (modeMenu === 'foto') ? '&#9776; Tampilan Daftar' : '&#128444; Tampilan Foto';
        ikatTombolKeranjang(); // tombol baru perlu dipasangi ulang
      };
      document.getElementById('btnKosongkanKantin').onclick = function(){ kantinCart = []; renderCart(); };
      document.getElementById('btnBayarKantin').onclick = function(){
        if (!kantinCart.length) return;
        var totalBelanja = kantinCart.reduce(function(s,it){return s+(it.harga*it.jumlah);},0);
        api('getSantriUntukTransaksiKantin', {}).then(function(resSantri){
          if(!resSantri.ok){ alert(resSantri.error); return; }
          var daftarSantri = resSantri.data;
          var fieldsHtml =
            '<div style="background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:10px">Total belanja: <b style="font-size:15px;color:#0f766e">Rp'+totalBelanja.toLocaleString('id-ID')+'</b></div>' +
            // Hanya NISN atau scan QR -- sengaja tidak ada daftar nama.
            // Santri wajib tahu NISN-nya sendiri atau punya kartu QR.
            fieldNisnSantri('ktSantri', {label:'NISN Santri (atau scan kartu QR)'}) +
            '<div id="warnSaldoKasir" style="display:none;background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px"></div>'+
            '<label>PIN Transaksi Santri</label><input type="password" id="ktPin" inputmode="numeric" placeholder="PIN Transaksi milik santri">';
          var pilihKt = null;
          var modal = openModal('Konfirmasi Pembayaran', fieldsHtml, function(m){
            var found = pilihKt.nilai();
            if (!found) { alert('Masukkan NISN santri yang valid, atau scan kartu QR-nya.'); return false; }
            if (found.saldo < totalBelanja) { alert('Saldo tidak cukup!\nSaldo: Rp'+found.saldo.toLocaleString('id-ID')+'\nBelanja: Rp'+totalBelanja.toLocaleString('id-ID')); return false; }
            var pin = m.querySelector('#ktPin').value.trim();
            if (!pin) { alert('PIN Transaksi wajib diisi.'); return false; }
            return api('prosesTransaksiKantin', {nisn: found.nisn, pinTransaksi: pin, pemilik: STATE.user.nama, noWaPemilik: STATE.user.noWa, items: kantinCart}).then(function(res){
              if(!res.ok){ alert(res.error); throw new Error(res.error); }
              var konfirm = confirm('✅ Berhasil!\nSantri: '+res.namaSantri+'\nTotal: Rp'+res.total.toLocaleString('id-ID')+'\nSisa saldo: Rp'+res.saldoSekarang.toLocaleString('id-ID')+'\n\nCetak struk?');
              if (konfirm) cetakStrukKasir({namaSantri:res.namaSantri,namaPemilik:STATE.user.nama,items:kantinCart,total:res.total,saldoSekarang:res.saldoSekarang,tanggal:todayStr()});
              pemilikKasir();
            });
          });
          // Peringatan saldo kurang ditampilkan begitu santri dipilih, supaya kasir
          // tahu sebelum meminta santri memasukkan PIN.
          pilihKt = ikatNisnSantri(modal, 'ktSantri', daftarSantri, {
            tampilSaldo: true,
            onPilih: function(s){
              var we = modal.querySelector('#warnSaldoKasir');
              if (s.saldo < totalBelanja) {
                we.style.display = 'block';
                we.innerHTML = '&#9888;&#65039; Saldo kurang Rp' + (totalBelanja - s.saldo).toLocaleString('id-ID') + '. Transaksi tidak bisa diproses.';
              } else {
                we.style.display = 'none';
                modal.querySelector('#ktPin').focus();
              }
            }
          });
        });
      };
      renderCart();
    });
  }

  // Tombol "Cek Akun Santri" -- santri masuk pakai PIN Transaksi miliknya sendiri
  // (bukan PIN login orang tua), lalu layar sepenuhnya berpindah ke Akun Santri.
  function ikatCekAkunSantri(){
    var btn = document.getElementById('btnCekAkunSantri');
    if (!btn) return;
    btn.onclick = function(){
      api('getSantriUntukTransaksiKantin', {}).then(function(resSantri){
        if(!resSantri.ok){ alert(resSantri.error); return; }
        var daftarSantri = resSantri.data;
        // Memakai pemilih santri yang sama persis dengan kasir: daftar langsung
        // terlihat, bisa dicari, bisa dipindai lewat QR.
        var fieldsHtml = fieldNisnSantri('casSantri', {label:'NISN Santri (atau scan kartu QR)'}) +
          '<label>PIN Transaksi Santri</label><input type="password" id="casPin" inputmode="numeric" placeholder="PIN Transaksi milik santri">';
        var pilihCas = null;
        var modalCas = openModal('Masuk Akun Santri', fieldsHtml, function(m){
          var found = pilihCas.nilai();
          if (!found) { alert('Masukkan NISN santri yang valid, atau scan kartu QR-nya.'); return false; }
          var pin = m.querySelector('#casPin').value.trim();
          if (!pin) { alert('PIN Transaksi wajib diisi.'); return false; }
          // WAJIB di-return: tanpa ini modal langsung tertutup walau PIN salah,
          // sehingga kasir harus mengulang dari awal setiap kali salah ketik.
          return api('validasiPinTransaksiSantri', {nisn: found.nisn, pin: pin}).then(function(res){
            if(!res.ok){ alert(res.error); throw new Error(res.error); }
            tampilkanAkunSantri(found.nisn, res.nama);
          });
        });
        pilihCas = ikatNisnSantri(modalCas, 'casSantri', daftarSantri, {
          tampilSaldo: true,
          onPilih: function(){ modalCas.querySelector('#casPin').focus(); }
        });
      });
    };
  }

  // Tampilan "Akun Santri" -- memakai ulang komponen rekap yang sama seperti dashboard
  // Wali Santri (hafalan, pelanggaran, absensi, nilai, saldo & riwayat kantin), tapi
  // hanya boleh ganti PIN Transaksi miliknya sendiri. Tombol Kembali menutup akses ini
  // sepenuhnya dan mengembalikan ke Menu Jualan Pemilik Barang.
  function tampilkanAkunSantri(nisn, namaSantri){
    // Santri akan memegang HP ini. Cabut verifikasi PIN pemilik supaya begitu
    // layar kembali ke Kasir, menu yang menyangkut harga dan saldo terkunci lagi
    // dan santri tidak bisa menyelinap masuk memakai sisa waktu verifikasi tadi.
    _pinPemilikTerbukaSampai = 0;
    render(
      '<div class="topbar"><div class="brand"><div><h2 style="margin:0">Akun Santri: '+esc(namaSantri)+'</h2>' +
      '<span class="muted">Mode pinjam layar -- hanya lihat data &amp; ganti PIN Transaksi sendiri</span></div></div>' +
      '<div><button id="btnKembaliKasir">&#8592; Kembali ke Kasir</button></div></div>' +
      '<div id="as-ganti-pin"></div>' +
      '<div id="as-rekap"></div>'
    );
    document.getElementById('btnKembaliKasir').onclick = function(){ dashboardPemilikBarang('kasir'); };

    document.getElementById('as-ganti-pin').innerHTML = '<div class="card"><h3>Ganti PIN Transaksi Saya</h3>' +
      warnBox('PIN ini terpisah dari PIN login akun orang tua -- hanya dipakai untuk konfirmasi belanja/cek akun di kantin.') +
      '<label>PIN Transaksi Lama</label><input type="password" id="pinLamaSantri" placeholder="PIN yang sekarang dipakai">' +
      '<label>PIN Transaksi Baru</label><input type="password" id="pinBaruSantri" placeholder="PIN baru">' +
      '<label>Ulangi PIN Baru</label><input type="password" id="pinUlangSantri" placeholder="Ketik PIN baru sekali lagi">' +
      '<button id="btnSimpanPinSantri">Simpan PIN Baru</button><div id="pesanPinSantri"></div></div>';
    document.getElementById('btnSimpanPinSantri').onclick = function(){
      var pinLama  = document.getElementById('pinLamaSantri').value.trim();
      var pinBaru  = document.getElementById('pinBaruSantri').value.trim();
      var pinUlang = document.getElementById('pinUlangSantri').value.trim();
      var pesan    = document.getElementById('pesanPinSantri');
      if (!pinLama)  { pesan.innerHTML = errBox('Isi PIN lama terlebih dahulu.'); return; }
      if (!pinBaru)  { pesan.innerHTML = errBox('Isi PIN baru.'); return; }
      if (pinBaru !== pinUlang) { pesan.innerHTML = errBox('PIN baru dan ulangi PIN tidak sama.'); return; }
      if (pinBaru === pinLama)  { pesan.innerHTML = errBox('PIN baru tidak boleh sama dengan PIN lama.'); return; }
      // Validasi PIN lama dulu ke backend sebelum ganti
      api('validasiPinTransaksiSantri', {nisn: nisn, pin: pinLama}).then(function(res){
        if (!res.ok) { pesan.innerHTML = errBox('PIN lama salah: ' + res.error); return; }
        api('gantiPinTransaksiSantri', {nisn: nisn, pinBaru: pinBaru}).then(function(res2){
          if (res2.ok) {
            pesan.innerHTML = '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px;color:#16a34a">&#10003; PIN berhasil diganti. Gunakan PIN baru saat belanja berikutnya.</div>';
            document.getElementById('pinLamaSantri').value = '';
            document.getElementById('pinBaruSantri').value = '';
            document.getElementById('pinUlangSantri').value = '';
          } else { pesan.innerHTML = errBox(res2.error); }
        });
      });
    };

    renderRekapLengkapSantri('as-rekap', nisn, {showSaldo:true});
  }

  function pemilikRiwayat(){
    var c = getContentEl();
    c.innerHTML = '<div class="card"><h3>Riwayat Transaksi</h3>' +
      '<div class="grid2"><div><label>Dari Tanggal</label><input type="date" id="rtDari"></div><div><label>Sampai Tanggal</label><input type="date" id="rtSampai"></div></div>' +
      '<button id="btnCariRiwayatKantin">Cari</button><div id="riwayatKantinWrap"></div></div>';
    function cari(){
      document.getElementById('riwayatKantinWrap').innerHTML = 'Memuat...';
      api('getRiwayatTransaksiPemilik', {pemilik: STATE.user.nama, tglMulai: document.getElementById('rtDari').value, tglAkhir: document.getElementById('rtSampai').value}).then(function(res){
        if(!res.ok){ document.getElementById('riwayatKantinWrap').innerHTML = errBox(res.error); return; }
        if(!res.data.length){ document.getElementById('riwayatKantinWrap').innerHTML = '<p class="muted">Belum ada transaksi.</p>'; return; }
        var hariIni = todayStr(); var totalHariIni = 0;
        var html = '<table><tr><th>Tanggal</th><th>Waktu</th><th>Santri</th><th>Barang</th><th>Jml</th><th>Nominal</th><th>Masuk ke Saya</th></tr>';
        res.data.forEach(function(r){
          if (r.tanggal === hariIni) totalHariIni += r.masuk;
          html += '<tr><td>'+esc(r.tanggal)+'</td><td>'+fmtWaktu(r.waktu)+'</td><td>'+esc(r.namaSantri)+'</td><td>'+esc(r.namaBarang)+'</td><td>'+r.jumlah+'</td><td>Rp'+r.nominal.toLocaleString('id-ID')+'</td><td>Rp'+r.masuk.toLocaleString('id-ID')+'</td></tr>';
        });
        html += '</table>';
        document.getElementById('riwayatKantinWrap').innerHTML = '<p style="font-weight:700;margin-bottom:8px">Total Masuk Hari Ini: Rp'+totalHariIni.toLocaleString('id-ID')+'</p>' + html;
      });
    }
    document.getElementById('btnCariRiwayatKantin').onclick = cari;
    cari();
  }

        var fields =

        var modalTarik = openModal('Konfirmasi Penarikan', fields, function(m){
          var pin = m.querySelector('#pinTarikInput').value.trim();
          if (!pin) { alert('PIN wajib diisi.'); return false; }
          return api('validasiPinPengguna', {nama: STATE.user.nama, pin: pin}).then(function(rp){
            if (!rp.ok) { alert(rp.error); throw new Error(rp.error); }
            return api('ajukanPenarikanSaldo', {pemilik: STATE.user.nama, noWa: STATE.user.noWa, nominal: nominal});
          }).then(function(res){
            if(!res.ok){ alert(res.error); throw new Error(res.error); }
            document.getElementById('pesanTarik').innerHTML = '<div class="warn" style="background:#dcfce7;border-color:#86efac;color:#166534">&#9989; Pengajuan terkirim, menunggu persetujuan Bendahara/Mudir.</div>';
            document.getElementById('tarikNominal').value = '';

        }, 100);

  function pemilikOmzet(){
    var c = getContentEl();
    var bt = bulanTahunSaatIni();
    var tglMulai = bt.tahun+'-'+String(bt.bulan).padStart(2,'0')+'-01';
    c.innerHTML = '<div class="card"><h3>&#128200; Laporan Omzet</h3>' +
      '<div class="grid2">' +
      '<div><label>Dari Tanggal</label><input type="date" id="omzetDari" value="'+tglMulai+'"></div>' +
      '<div><label>Sampai Tanggal</label><input type="date" id="omzetSampai" value="'+todayStr()+'"></div>' +
      '</div>' +
      '<button id="btnCariOmzet">Tampilkan</button> ' +
      '<button class="secondary" id="btnCetakOmzet">&#128424; Cetak</button>' +
      '</div><div id="omzetResult" style="margin-top:10px">Klik Tampilkan untuk memuat.</div>';

    function muat(){
      var dari = document.getElementById('omzetDari').value;
      var sampai = document.getElementById('omzetSampai').value;
      document.getElementById('omzetResult').innerHTML = '<p>Memuat...</p>';
      api('getRiwayatTransaksiPemilik', {pemilik: STATE.user.nama, tglMulai: dari, tglAkhir: sampai}).then(function(res){
        if(!res.ok){ document.getElementById('omzetResult').innerHTML = errBox(res.error); return; }
        var data = res.data;
        if(!data.length){ document.getElementById('omzetResult').innerHTML = '<div class="card"><p class="muted">Tidak ada transaksi pada periode ini.</p></div>'; return; }

        // Hitung ringkasan
        var totalOmzet=0, totalPotongan=0, totalBersih=0;
        var perBarang = {};
        data.forEach(function(t){
          totalOmzet += t.nominal;
          totalPotongan += t.potongan||0;
          totalBersih += t.masuk||0;
          var key = t.namaBarang||'Lainnya';
          if (!perBarang[key]) perBarang[key] = {nama:key, qty:0, omzet:0, potongan:0, bersih:0};
          perBarang[key].qty += Number(t.jumlah)||1;
          perBarang[key].omzet += t.nominal;
          perBarang[key].potongan += t.potongan||0;
          perBarang[key].bersih += t.masuk||0;
        });

        document.getElementById('omzetResult').innerHTML =
          '<div class="ringkasan-grid" style="margin-bottom:12px">' +
          '<div class="ringkasan-tile warna-hijau"><div class="ico">&#128717;</div><div class="nilai">'+rupiah(totalOmzet)+'</div><div class="label">Total Omzet</div></div>' +
          '<div class="ringkasan-tile warna-merah"><div class="ico">&#9986;</div><div class="nilai">'+rupiah(totalPotongan)+'</div><div class="label">Potongan Pondok</div></div>' +
          '<div class="ringkasan-tile"><div class="ico">&#128176;</div><div class="nilai">'+rupiah(totalBersih)+'</div><div class="label">Saldo Bersih Anda</div></div>' +
          '</div>' +
          '<div class="card"><h4>Rekap per Barang</h4>' +
          '<table><tr><th>Nama Barang</th><th>Qty Terjual</th><th>Omzet</th><th>Potongan</th><th>Bersih</th></tr>' +
          Object.values(perBarang).sort(function(a,b){return b.omzet-a.omzet;}).map(function(b){
            return '<tr><td><b>'+esc(b.nama)+'</b></td><td style="text-align:center">'+b.qty+'</td>' +
              '<td>'+rupiah(b.omzet)+'</td><td style="color:#dc2626">'+rupiah(b.potongan)+'</td>' +
              '<td style="color:#16a34a;font-weight:600">'+rupiah(b.bersih)+'</td></tr>';
          }).join('') + '</table></div>' +
          '<div class="card"><h4>Detail Transaksi ('+data.length+' baris)</h4>' +
          '<table><tr><th>Tanggal</th><th>Santri</th><th>Barang</th><th>Qty</th><th>Omzet</th><th>Bersih</th></tr>' +
          data.map(function(t){
            return '<tr><td>'+esc(t.tanggal)+'</td><td>'+esc(t.namaSantri)+'</td><td>'+esc(t.namaBarang)+'</td>' +
              '<td style="text-align:center">'+esc(String(t.jumlah||1))+'</td>' +
              '<td>'+rupiah(t.nominal)+'</td><td style="color:#16a34a">'+rupiah(t.masuk||0)+'</td></tr>';
          }).join('')+'</table></div>';

        document.getElementById('btnCetakOmzet').onclick = function(){
          var nama = STATE.user.nama;
          var namaSekolah = STATE.pengaturan.NamaPesantren||'Pondok Pesantren';
          var win = window.open('','_blank');
          win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Laporan Omzet</title>' +
            '<style>body{font-family:Arial,sans-serif;max-width:800px;margin:16px auto;font-size:11px}' +
            'h1{font-size:13px;text-align:center}table{width:100%;border-collapse:collapse;margin-top:8px}' +
            'td,th{border:1px solid #888;padding:4px 6px}th{background:#eee}.right{text-align:right}.bold{font-weight:700}' +
            '@media print{@page{margin:10mm}}</style></head><body>' +
            '<h1>LAPORAN OMZET KANTIN<br><small>'+esc(namaSekolah)+' &mdash; Pemilik: '+esc(nama)+'</small></h1>' +
            '<p style="text-align:center">Periode: '+esc(dari)+' s/d '+esc(sampai)+'</p>' +
            '<p><b>Total Omzet: '+rupiah(totalOmzet)+'</b> | Potongan Pondok: '+rupiah(totalPotongan)+' | Saldo Bersih: <b>'+rupiah(totalBersih)+'</b></p>' +
            '<table><tr><th>No</th><th>Tanggal</th><th>Santri</th><th>Barang</th><th>Qty</th><th class="right">Omzet</th><th class="right">Bersih</th></tr>' +
            data.map(function(t,i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(t.tanggal)+'</td><td>'+esc(t.namaSantri)+'</td><td>'+esc(t.namaBarang)+'</td><td style="text-align:center">'+esc(String(t.jumlah||1))+'</td><td class="right">'+rupiah(t.nominal)+'</td><td class="right">'+rupiah(t.masuk||0)+'</td></tr>'; }).join('') +
            '<tr class="bold"><td colspan="5">TOTAL</td><td class="right">'+rupiah(totalOmzet)+'</td><td class="right">'+rupiah(totalBersih)+'</td></tr>' +
            '</table></body></html>');
          win.document.close();
        };
      });
    }
    document.getElementById('btnCariOmzet').onclick = muat;
    muat();
  }

  function muatKantinWali(nisn, opts){
    opts = opts || {};
    var izinTopUp = opts.izinTopUp !== false;
    var izinGantiLimit = opts.izinGantiLimit !== false;
    var wrap = document.getElementById('dw-kantin');
    wrap.innerHTML = '<div class="card"><h3>Saldo Kantin</h3><p>Memuat...</p></div>';
    Promise.all([
      api('getSaldoSantriKantin', {nisn:nisn}),
      api('get5TransaksiTerbaruSantri', {nisn:nisn})
    ]).then(function(hasil){
      var resSaldo = hasil[0], res5 = hasil[1];
      var saldo = resSaldo.ok ? resSaldo.data.saldo : 0;
      var limit = resSaldo.ok ? resSaldo.data.limit : 0;
      var namaSantri = resSaldo.ok ? resSaldo.data.nama : '';

      var html = '<div class="card"><h3>Saldo Kantin</h3>' +
        '<p style="font-size:28px;font-weight:800;color:#0d9488;margin:6px 0">'+rupiah(saldo)+'</p>' +
        (limit>0?'<p class="muted" style="font-size:12.5px">Limit harian: '+rupiah(limit)+'</p>':'')+
        (izinTopUp ? '<button id="btnTambahSaldoWali">+ Tambah Saldo</button><div id="pesanTambahSaldo"></div>' : '') +
        '</div>' +
        (izinGantiLimit ?
          '<div class="card"><h3>Limit Belanja Harian</h3>' +
          warnBox('Batasi berapa banyak anak Anda boleh belanja di kantin per hari. Isi 0 untuk tanpa batas.') +
          '<label>Limit Harian (Rp)</label><input type="number" id="limitHarianWali" value="'+(limit>0?limit:'')+'" placeholder="0 = tanpa batas">' +
          '<button id="btnSimpanLimit">Simpan Limit</button><div id="pesanLimit"></div></div>'
          : '') +
        '<div class="card"><h3>5 Transaksi Terbaru</h3>' +
        (res5.ok && res5.data.length ?
          renderTabelTransaksiWali(res5.data) +
          '<button class="secondary small" id="btnLihatSemuaTrx" style="margin-top:10px;width:100%">Lihat Semua Riwayat</button>'
          : '<p class="muted">Belum ada transaksi.</p>') +
        '</div>';

      wrap.innerHTML = html;

      var btnLimit = document.getElementById('btnSimpanLimit');
      if (btnLimit) {
        btnLimit.onclick = function(){
          var nilai = document.getElementById('limitHarianWali').value.trim();
          api('setLimitHarianSantri', {nisn:nisn, limit: nilai||0}).then(function(res){
            document.getElementById('pesanLimit').innerHTML = res.ok ? '<p class="muted">Tersimpan.</p>' : errBox(res.error);
          });
        };
      }

      var btnSemuaTrx = document.getElementById('btnLihatSemuaTrx');
      if (btnSemuaTrx) {
        btnSemuaTrx.onclick = function(){
          btnSemuaTrx.disabled=true; btnSemuaTrx.textContent='Memuat...';
          api('getAllTransaksiSantri',{nisn:nisn}).then(function(r){
            btnSemuaTrx.style.display='none';
            if(!r.ok){ wrap.insertAdjacentHTML('beforeend',errBox(r.error)); return; }
            var div=document.createElement('div');
            div.className='card';
            div.innerHTML='<h3>Semua Riwayat ('+r.data.length+' transaksi)</h3>'+renderTabelTransaksiWali(r.data);
            wrap.appendChild(div);
          });
        };
      }

      document.getElementById('btnTambahSaldoWali').onclick = function(){
        var fieldsHtml = '<label>Nominal yang ingin ditambahkan (Rp)</label>' +
          '<input type="number" id="tsNominal" placeholder="Contoh: 50000">' +
          '<p class="muted" style="margin-top:8px">Pesan WhatsApp ke Bendahara akan otomatis tersusun.</p>';
        var modal = openModal('Tambah Saldo Kantin', fieldsHtml, function(m){
          var nominal = Number(m.querySelector('#tsNominal').value.trim());
          if (!nominal || nominal <= 0) { alert('Isi nominal yang valid.'); return false; }
          var btn = modal.querySelector('#modalSimpan'); btn.disabled=true; btn.innerText='Mengirim...';
          api('ajukanTopUpSaldo', {nisn:nisn, namaSantri:namaSantri, nominal:nominal, noWaWali:STATE.user.noWa}).then(function(res){
            if(!res.ok){ alert(res.error); btn.disabled=false; btn.innerText='Kirim WA ke Bendahara'; return false; }
            if (res.noWaBendahara) {
              var noWa = res.noWaBendahara.replace(/[^0-9]/g,'');
              if (noWa.charAt(0)==='0') noWa='62'+noWa.substring(1);
              var pesan = 'Assalamualaikum, saya ingin mengajukan tambah saldo kantin.\n\nNama Santri: '+namaSantri+'\nNominal: '+rupiah(nominal)+'\n\nBukti transfer akan segera saya kirimkan. Terima kasih.';
              window.open('https://wa.me/'+noWa+'?text='+encodeURIComponent(pesan), '_blank');
            }
            if (modal && modal.remove) modal.remove();
            document.getElementById('pesanTambahSaldo') && (document.getElementById('pesanTambahSaldo').innerHTML = '<p class="muted">Pengajuan terkirim, menunggu persetujuan Bendahara.</p>');
          });
          return false;
        });
        modal.querySelector('#modalSimpan').textContent = 'Kirim WA ke Bendahara';
      };
    });
  }

  function renderTabelTransaksiWali(data){
    return '<div style="overflow-x:auto"><table>' +
      '<tr><th>Tanggal</th><th>Keterangan</th><th style="text-align:right">Nominal</th><th style="text-align:right">Sisa Saldo</th></tr>' +
      data.map(function(r){
        var isTopUp = r.kategori==='Top Up Saldo';
        var isPenarikan = r.kategori==='Penarikan';
        var isBelanja = !isTopUp && !isPenarikan;
        var warna = isTopUp ? '#16a34a' : '#dc2626';
        var prefix = isTopUp ? '+' : '-';
        var label = isTopUp
          ? '💰 Tambah Saldo' + (r.keterangan ? ' — '+r.keterangan : '')
          : isPenarikan
          ? '🏧 Tarik Saldo' + (r.keterangan ? ' — '+r.keterangan : '')
          : '🛒 ' + esc(r.keterangan||'Belanja');
        var bgSaldo = isBelanja ? '#fff7ed' : (isTopUp ? '#f0fdf4' : '#fef2f2');
        return '<tr>' +
          '<td style="font-size:11.5px;white-space:nowrap;padding:6px 8px">' +
            esc(r.tanggal)+'<br><span class="muted" style="font-size:10px">'+esc(r.waktu)+'</span>' +
          '</td>' +
          '<td style="padding:6px 8px">'+label+'</td>' +
          '<td style="color:'+warna+';font-weight:700;text-align:right;white-space:nowrap;padding:6px 8px">'+prefix+rupiah(r.nominal)+'</td>' +
          '<td style="text-align:right;white-space:nowrap;padding:6px 8px;background:'+bgSaldo+';font-weight:700;font-size:13px;color:#0f766e">'+rupiah(r.saldoSekarang)+'</td>' +
          '</tr>';
      }).join('') + '</table></div>';
  }

  // ---- Riwayat Mutasi Saldo (Tarik & Tambah) di tab terpisah ----
  function renderRiwayatMutasiSaldo(nisn, containerId){
    var wrap = document.getElementById(containerId);
    if (!wrap) return;
    wrap.innerHTML = '<div class="card"><h3>💰 Riwayat Tarik & Tambah Saldo</h3><p class="muted">Semua transaksi penambahan dan penarikan saldo.</p><div id="mutasiSaldoTable">Memuat...</div></div>';

    function muat(tglMulai, tglAkhir){
      document.getElementById('mutasiSaldoTable').innerHTML = 'Memuat...';
      api('getRiwayatMutasiSaldoSantri', {nisn: nisn, tglMulai: tglMulai||'', tglAkhir: tglAkhir||''}).then(function(res){
        if (!document.getElementById('mutasiSaldoTable')) return;
        if (!res.ok){ document.getElementById('mutasiSaldoTable').innerHTML = errBox(res.error); return; }
        if (!res.data.length){
          document.getElementById('mutasiSaldoTable').innerHTML = '<p class="muted">Belum ada riwayat tarik/tambah saldo.</p>'; return;
        }
        var html = '<div style="overflow-x:auto"><table>' +
          '<tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Dicatat Oleh</th><th style="text-align:right">Nominal</th><th style="text-align:right">Saldo Sebelum</th><th style="text-align:right;background:#f0fdf4">Sisa Saldo</th></tr>';
        res.data.forEach(function(r){
          var isTopUp = r.kategori === 'Top Up Saldo';
          var warna = isTopUp ? '#16a34a' : '#dc2626';
          var prefix = isTopUp ? '+' : '-';
          var ikon = isTopUp ? '💰' : '🏧';
          var label = isTopUp ? 'Tambah Saldo' : 'Tarik Saldo';
          html += '<tr>' +
            '<td style="font-size:11.5px;white-space:nowrap">'+esc(r.tanggal)+'<br><span class="muted" style="font-size:10px">'+fmtWaktu(r.waktu)+'</span></td>' +
            '<td><span style="color:'+warna+';font-weight:600">'+ikon+' '+esc(label)+'</span></td>' +
            '<td style="font-size:12px;color:#475569">'+esc(r.keterangan||'-')+'</td>' +
            '<td style="font-size:11px;color:#94a3b8">'+esc(r.dicatatOleh||'-')+'</td>' +
            '<td style="color:'+warna+';font-weight:700;text-align:right;white-space:nowrap">'+prefix+rupiah(r.nominal)+'</td>' +
            '<td style="text-align:right;color:#64748b;font-size:12px;white-space:nowrap">'+rupiah(r.saldoSebelum)+'</td>' +
            '<td style="text-align:right;font-weight:800;font-size:13px;color:#0f766e;background:#f0fdf4;white-space:nowrap">'+rupiah(r.saldoSekarang)+'</td>' +
            '</tr>';
        });
        html += '</table></div>';
        // Ringkasan
        var totalTambah = res.data.filter(function(r){return r.kategori==='Top Up Saldo';}).reduce(function(a,r){return a+r.nominal;},0);
        var totalTarik = res.data.filter(function(r){return r.kategori==='Penarikan';}).reduce(function(a,r){return a+r.nominal;},0);
        html = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
          '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 14px;font-size:13px;flex:1">💰 Total Tambah: <b style="color:#16a34a">+'+rupiah(totalTambah)+'</b></div>' +
          '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 14px;font-size:13px;flex:1">🏧 Total Tarik: <b style="color:#dc2626">-'+rupiah(totalTarik)+'</b></div>' +
          '</div>' + html;
        document.getElementById('mutasiSaldoTable').innerHTML = html;
      });
    }

    // Tambah filter tanggal
    var filterHtml = '<div class="grid2" style="margin-bottom:10px">' +

  function renderProgressHafalanWali(nisn, containerId){
    var c = document.getElementById(containerId);
    if (!c) return;
    c.innerHTML = '<div class="card"><h4>&#128218; Progres Hafalan</h4><p class="muted">Memuat...</p></div>';

    api('getProgressHafalan', {nisn:nisn}).then(function(res){
      if (!res.ok || !res.data) {
        c.innerHTML = '<div class="card"><h4>&#128218; Progres Hafalan</h4><p class="muted">Belum ada catatan hafalan.</p></div>';
        return;
      }
      var d = res.data;
      c.innerHTML = renderKartuProgressHafalan(d, true);
    }).catch(function(){
      c.innerHTML = '';
    });
  }

  // Render kartu progress hafalan (dipakai wali & rekap)
  // detail = true → tampilkan grid 30 juz
  function renderKartuProgressHafalan(d, detail){
    var persenWarna = d.persen >= 50 ? '#16a34a' : d.persen >= 25 ? '#0891b2' : d.persen >= 10 ? '#d97706' : '#64748b';

    var html = '<div class="card">' +
      '<h4>&#128218; Progres Hafalan Al-Qur\'an</h4>' +
      // Ringkasan angka besar
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0">' +
      '<div style="flex:1;min-width:120px;background:'+persenWarna+'15;border:2px solid '+persenWarna+';border-radius:12px;padding:14px;text-align:center">' +
      '<div style="font-size:36px;font-weight:800;color:'+persenWarna+';line-height:1">'+d.totalJuzSelesai+'</div>' +
      '<div style="font-size:11px;color:'+persenWarna+';text-transform:uppercase;letter-spacing:.5px;margin-top:4px">Juz Selesai</div>' +
      '</div>' +
      '<div style="flex:1;min-width:120px;background:#f1f5f9;border-radius:12px;padding:14px;text-align:center">' +
      '<div style="font-size:24px;font-weight:700;color:#334155;line-height:1">'+d.totalHalamanTersetor+'<span style="font-size:14px;color:#94a3b8;font-weight:400">/604</span></div>' +
      '<div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">Halaman Sabaq</div>' +
      '</div>' +
      '<div style="flex:1;min-width:120px;background:#f1f5f9;border-radius:12px;padding:14px;text-align:center">' +
      '<div style="font-size:24px;font-weight:700;color:#334155;line-height:1">'+d.persen+'%</div>' +
      '<div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">Total Al-Qur\'an</div>' +
      '</div>' +
      '</div>' +

      // Progress bar
      '<div style="background:#f1f5f9;border-radius:20px;height:8px;overflow:hidden;margin-bottom:12px">' +
      '<div style="width:'+d.persen+'%;height:100%;background:linear-gradient(90deg,'+persenWarna+',#0891b2);border-radius:20px;transition:width .8s"></div>' +
      '</div>' +

      // Ringkasan teks
      '<div style="font-size:13px;color:#475569;line-height:1.5;padding:8px 0">'+esc(d.ringkasan)+'</div>';

    if (detail) {
      // Grid 30 juz — hijau=selesai, kuning=proses, abu=belum
      html += '<div style="margin-top:12px">' +
        '<div style="font-size:11px;color:#64748b;margin-bottom:6px">Status Setiap Juz:</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px">';
      for (var j = 1; j <= 30; j++) {
        var det = d.detailJuz[j] || {selesai:false, persenJuz:0, halamanAwal:0, halamanAkhir:0};
        var bg, color, label;
        if (det.selesai) { bg = '#16a34a'; color = '#fff'; label = '✓'; }
        else if (det.persenJuz > 0) { bg = '#fed7aa'; color = '#c2410c'; label = det.persenJuz+'%'; }
        else { bg = '#f1f5f9'; color = '#94a3b8'; label = '·'; }
        var tooltip = 'Juz '+j+' (hal '+det.halamanAwal+'-'+det.halamanAkhir+') · '+
          (det.selesai?'SELESAI':(det.persenJuz+'% ('+det.halamanTersetor+'/'+det.totalHalaman+' hal)'));
        html += '<div title="'+esc(tooltip)+'" style="background:'+bg+';color:'+color+';border-radius:6px;padding:6px 2px;text-align:center;font-size:10px;font-weight:700;line-height:1.2">' +
          '<div style="font-size:9px;opacity:.75;font-weight:400">J'+j+'</div>'+label+'</div>';
      }
      html += '</div>' +
        '<div style="display:flex;gap:10px;font-size:10px;color:#64748b;margin-top:8px;flex-wrap:wrap">' +
        '<span><span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:2px;vertical-align:middle"></span> Selesai</span>' +
        '<span><span style="display:inline-block;width:10px;height:10px;background:#fed7aa;border-radius:2px;vertical-align:middle"></span> Sedang Dihafal</span>' +
        '<span><span style="display:inline-block;width:10px;height:10px;background:#f1f5f9;border-radius:2px;vertical-align:middle;border:1px solid #cbd5e1"></span> Belum</span>' +
        '</div></div>';
    }

    html += '<p style="font-size:10px;color:#94a3b8;margin-top:10px;font-style:italic">*Deteksi juz selesai: halaman awal &amp; akhir juz keduanya sudah pernah disetor Sabaq. Standar Mushaf Madinah (604 halaman).</p>' +
      '</div>';
    return html;
  }

  // ============================================================
  // PROGRESS HAFALAN — halaman rekap untuk Admin/Mudir/Guru
  // opts: {gender:'Putra'|'Putri'|'', pengampu:'Nama Guru'|null}

  // ============================================================
  function renderRekapProgressHafalan(opts){
    // Kompat: kalau opts adalah string, treat as gender (backward compat)
    if (typeof opts === 'string') opts = {gender: opts};
    opts = opts || {};
    var gender = opts.gender || '';
    var pengampu = opts.pengampu || '';
    var c = getContentEl();
    var labelG = gender==='Putra'?'👦 Putra':gender==='Putri'?'👧 Putri':'Semua Santri';
    var judulExtra = pengampu ? ' — Halaqoh Saya' : '';
    c.innerHTML = '<div class="card"><h3>📊 Rekap Progres Hafalan'+judulExtra+' — '+labelG+'</h3>' +
      '<p class="muted">' + (pengampu
        ? 'Menampilkan santri di halaqoh yang Anda ampu.'
        : 'Deteksi otomatis juz selesai dari halaman awal &amp; akhir yang disetor Sabaq, ditambah input progres awal (baseline).') +
      '</p>' +
      '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">' +
      '<button id="phTabRekap">📊 Rekap Progres</button>' +
      '<button id="phTabInputAwal">✏️ Input Progres Awal</button>' +
      '</div>' +
      '<div id="phSecRekap"></div>' +
      '<div id="phSecInputAwal" style="display:none"></div>' +
      '</div>';

    function setTab(t){
      var el1 = document.getElementById('phTabRekap'), el2 = document.getElementById('phTabInputAwal');
      el1.style.cssText = t==='rekap'
        ? 'background:#0d9488;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer'
        : 'background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:8px 16px;cursor:pointer';
      el2.style.cssText = t==='input'
        ? 'background:#0d9488;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer'
        : 'background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:8px 16px;cursor:pointer';
      document.getElementById('phSecRekap').style.display = t==='rekap'?'':'none';
      document.getElementById('phSecInputAwal').style.display = t==='input'?'':'none';
      if (t==='input') renderFormInputProgresAwal(gender, pengampu);
    }

    document.getElementById('phTabInputAwal').onclick = function(){ setTab('input'); };

    // ISI TAB REKAP

    wrapRekap.innerHTML = '<button id="btnMuatProgress" class="secondary">🔄 Muat Data</button>' +
      '<div id="progressWrap" style="margin-top:12px"></div>';

    document.getElementById('btnMuatProgress').onclick = function(){
      var btn = this;
      loadingBtn(btn, 'Memuat...');
      api('getProgressHafalanMassal', {gender:gender, pengampu:pengampu}).then(function(res){
        resetBtn(btn, '🔄 Muat Data');
        if (!res.ok) { document.getElementById('progressWrap').innerHTML = errBox(res.error); return; }
        if (!res.data.length) { document.getElementById('progressWrap').innerHTML = warnBox('Belum ada data.'); return; }

        var totalSelesai = res.data.reduce(function(s,x){ return s + x.totalJuzSelesai; }, 0);
        var rataJuz = Math.round((totalSelesai / res.data.length) * 10) / 10;
        var yangSudahMulai = res.data.filter(function(x){ return x.totalHalamanTersetor > 0; }).length;

        var html = '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">' +
          '<div style="flex:1;min-width:110px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px;text-align:center">' +
          '<div style="font-size:22px;font-weight:800;color:#16a34a">'+totalSelesai+'</div>' +
          '<div style="font-size:11px;color:#166534">Total Juz Selesai</div></div>' +
          '<div style="flex:1;min-width:110px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px;text-align:center">' +
          '<div style="font-size:22px;font-weight:800;color:#2563eb">'+rataJuz+'</div>' +
          '<div style="font-size:11px;color:#1e40af">Rata-rata Juz/Santri</div></div>' +
          '<div style="flex:1;min-width:110px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;text-align:center">' +
          '<div style="font-size:22px;font-weight:800;color:#d97706">'+yangSudahMulai+'<span style="font-size:12px;color:#94a3b8">/'+res.data.length+'</span></div>' +
          '<div style="font-size:11px;color:#9a3412">Santri Aktif</div></div>' +
          '</div>' +
          '<div style="display:flex;justify-content:flex-end;margin-bottom:8px">' +
          '<button id="btnExcelProgress" class="secondary small">📄 Export Excel</button></div>' +
          '<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse">' +
          '<thead><tr style="background:#0d9488;color:#fff">' +
          '<th style="padding:8px;text-align:center;width:36px">No</th>' +
          '<th style="padding:8px;text-align:left">Nama Santri</th>' +
          '<th style="padding:8px;text-align:center;width:80px">Juz Selesai</th>' +
          '<th style="padding:8px;text-align:center;width:80px">Halaman</th>' +
          '<th style="padding:8px;text-align:left">Juz yang Sudah Selesai</th>' +
          '<th style="padding:8px;text-align:center;width:80px">% Total</th>' +
          '</tr></thead><tbody>';
        res.data.forEach(function(s, i){
          var warna = s.totalJuzSelesai >= 5 ? '#16a34a' : s.totalJuzSelesai >= 1 ? '#0891b2' : '#94a3b8';
          html += '<tr style="background:'+(i%2===0?'#fff':'#f8fafc')+'">' +
            '<td style="padding:6px 8px;text-align:center;color:#94a3b8">'+(i+1)+'</td>' +
            '<td style="padding:6px 8px;font-weight:600">'+esc(s.nama)+
              (s.punyaProgresAwal?' <span style="background:#e0e7ff;color:#4338ca;padding:1px 5px;border-radius:8px;font-size:9px">📋 baseline</span>':'')+
              '</td>' +
            '<td style="padding:6px 8px;text-align:center;font-size:16px;font-weight:800;color:'+warna+'">'+s.totalJuzSelesai+'</td>' +
            '<td style="padding:6px 8px;text-align:center;color:#64748b">'+s.totalHalamanTersetor+'/604</td>' +
            '<td style="padding:6px 8px;font-size:11px;color:#475569">'+
              (s.juzSelesai.length ? 'Juz '+s.juzSelesai.join(', ') : '<span style="color:#94a3b8">-</span>')+
              (s.juzInProgress.length ? '<br><span style="color:#d97706;font-size:10px">Proses: '+s.juzInProgress.map(function(j){return j+' ('+s.detailJuz[j].persenJuz+'%)'}).join(', ')+'</span>' : '')+
            '</td>' +
            '<td style="padding:6px 8px;text-align:center;font-weight:700;color:'+warna+'">'+s.persen+'%</td>' +
            '</tr>';
        });
        html += '</tbody></table></div>';
        document.getElementById('progressWrap').innerHTML = html;

        document.getElementById('btnExcelProgress').onclick = function(){
          var bom = '\uFEFF';
          var header = ['No','Nama','Total Juz Selesai','Halaman Tersetor','% Total','Juz Selesai','Juz Sedang Dihafal'];
          var rows = res.data.map(function(s,i){
            return [i+1, s.nama, s.totalJuzSelesai, s.totalHalamanTersetor+'/604', s.persen+'%',
              s.juzSelesai.join(', '), s.juzInProgress.map(function(j){return 'J'+j+':'+s.detailJuz[j].persenJuz+'%'}).join(', ')];
          });
          var csv = bom + [header].concat(rows).map(function(r){
            return r.map(function(v){ var s=String(v||''); return s.includes(',')?'"'+s+'"':s; }).join(',');
          }).join('\n');
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
          a.download = 'Rekap_Progres_Hafalan_'+todayStr()+'.csv';
          a.click();
        };
      });
    };
  }

      ? 'Hanya santri di halaqoh yang Anda ampu yang bisa dipilih.'
      : 'Isi juz yang sudah dihafal santri SEBELUM aplikasi ini digunakan.';
    wrap.innerHTML = '<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px;margin-bottom:12px">' +
      '<b>📋 Input Progres Awal Hafalan</b><br>' +
      '<small style="color:#1e40af">'+subInfo+' Data ini akan digabungkan dengan setoran Sabaq via aplikasi.</small>' +
      '</div>' +
      '<label>Pilih Santri</label>' +
      '<input id="phInpSantri" placeholder="Ketik nama santri..." autocomplete="off">' +
      '<div id="phFormInput" style="margin-top:12px;display:none"></div>';

    // Kalau pengampu diisi, ambil santri dari halaqoh guru itu
    // Kalau tidak, ambil semua santri sesuai gender
    var loadPromise;
    if (pengampu) {
      loadPromise = api('getSantriHalaqohGuru', {pengampu: pengampu}).then(function(resH){
        if (!resH.ok || !resH.data.length) return {ok:true, data:[]};
        // Perlu ambil detail santri dari getHalaqohList — fallback ke getSantriHarian jika perlu
        return api('getProgressHafalanMassal', {gender:gender, pengampu:pengampu}).then(function(res){
          if (!res.ok) return {ok:true, data:[]};
          // Konversi format: {nisn, nama}
          return {ok:true, data: res.data.map(function(s){ return {nisn:s.nisn, nama:s.nama}; })};
        });
      });
    } else {
      loadPromise = api('getSantriHarian', {gender:gender});
    }

    loadPromise.then(function(res){
      if (!res.ok) return;
      var inp = document.getElementById('phInpSantri');
      var dl = document.createElement('datalist');
      dl.id = 'phInpSantriDL';
      res.data.forEach(function(s){ var o=document.createElement('option'); o.value=s.nisn+' - '+s.nama; dl.appendChild(o); });
      inp.parentNode.appendChild(dl);
      inp.setAttribute('list', 'phInpSantriDL');
      inp._daftar = res.data;

      inp.addEventListener('change', function(){
        var raw = inp.value.trim();
        var found = res.data.find(function(s){ return (s.nisn+' - '+s.nama)===raw || s.nama===raw || s.nisn===raw; });
        if (!found) { document.getElementById('phFormInput').style.display = 'none'; return; }
        renderFormJuzUntukSantri(found.nisn, found.nama);
      });
    });
  }

  // Form checklist 30 juz + proses
  function renderFormJuzUntukSantri(nisn, nama){
    var form = document.getElementById('phFormInput');
    form.style.display = '';
    form.innerHTML = '<p class="muted">Memuat progres tersimpan...</p>';

    api('getProgresAwal', {nisn:nisn}).then(function(res){
      var data = res.ok ? res.data : {juzSelesai:[], juzProses:[]};
      var juzSelesaiSet = new Set(data.juzSelesai);
      var juzProsesMap = {};
      (data.juzProses||[]).forEach(function(x){ juzProsesMap[x.juz] = x.persen; });

      var html = '<div class="card"><h4>✏️ Progres Awal: '+esc(nama)+'</h4>' +
        '<p style="font-size:12px;color:#64748b">Centang juz yang sudah SELESAI, atau isi persentase untuk juz yang sedang dihafal.</p>' +

        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:10px">';

      for (var j=1;j<=30;j++) {
        var selesai = juzSelesaiSet.has(j);
        var persen = juzProsesMap[j] || 0;
        html += '<div style="border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;background:'+(selesai?'#f0fdf4':(persen>0?'#fff7ed':'#fff'))+'">' +
          '<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;cursor:pointer">' +
          '<input type="checkbox" class="phJuzSelesai" data-juz="'+j+'"'+(selesai?' checked':'')+' style="width:16px;height:16px">' +
          '<span>Juz '+j+'</span>' +
          (selesai?'<span style="color:#16a34a;font-size:11px;margin-left:auto">✓ Selesai</span>':'')+
          '</label>' +
          '<div class="phProsesWrap" style="margin-top:6px;display:'+(selesai?'none':'')+'">' +
          '<div style="display:flex;align-items:center;gap:6px">' +
          '<input type="range" class="phJuzPersen" data-juz="'+j+'" min="0" max="99" step="5" value="'+persen+'" style="flex:1">' +
          '<span class="phPersenLabel" style="font-size:12px;font-weight:600;min-width:36px;text-align:right;color:#d97706">'+persen+'%</span>' +
          '</div></div></div>';
      }

      html += '</div>' +
        '<label style="margin-top:12px;display:block">Catatan (opsional)</label>' +
        '<textarea id="phCatatan" rows="2" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:8px" placeholder="Contoh: Data dari kartu hafalan lama tanggal 1 Sep 2026"></textarea>' +
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
        '<button id="btnSimpanProgresAwal">💾 Simpan Progres Awal</button>' +
        '<button class="secondary" id="btnHapusProgresAwal">🗑️ Hapus Semua</button>' +
        '</div>' +
        '<div id="phPesanSimpan" style="margin-top:8px"></div></div>';

      form.innerHTML = html;

      // Update label persen live + toggle proses saat selesai dicentang
      form.querySelectorAll('.phJuzSelesai').forEach(function(cb){
        cb.onchange = function(){
          var parent = cb.closest('div[style*="border:1px"]');
          var proses = parent.querySelector('.phProsesWrap');
          if (cb.checked) {
            proses.style.display = 'none';
            parent.style.background = '#f0fdf4';
            parent.querySelector('.phJuzPersen').value = 0;
            parent.querySelector('.phPersenLabel').textContent = '0%';
          } else {
            proses.style.display = '';
            parent.style.background = '#fff';
          }
        };
      });
      form.querySelectorAll('.phJuzPersen').forEach(function(range){
        range.oninput = function(){
          var v = Number(range.value);
          var parent = range.closest('div[style*="border:1px"]');
          parent.querySelector('.phPersenLabel').textContent = v + '%';
          parent.style.background = v > 0 ? '#fff7ed' : '#fff';
        };
      });

      // Simpan
      document.getElementById('btnSimpanProgresAwal').onclick = function(){
        var btn = this;
        var juzSelesai = [];
        var juzProses = [];
        form.querySelectorAll('.phJuzSelesai').forEach(function(cb){
          var j = Number(cb.dataset.juz);
          if (cb.checked) juzSelesai.push(j);
        });
        form.querySelectorAll('.phJuzPersen').forEach(function(r){
          var j = Number(r.dataset.juz);
          var p = Number(r.value);
          if (p > 0 && juzSelesai.indexOf(j) === -1) juzProses.push({juz:j, persen:p});
        });

        loadingBtn(btn, 'Menyimpan...');
        api('simpanProgresAwal', {
          nisn: nisn, nama: nama,
          juzSelesai: juzSelesai, juzProses: juzProses,
          catatan: document.getElementById('phCatatan').value,
          diisiOleh: STATE.user.nama,
        }).then(function(r){
          resetBtn(btn, '💾 Simpan Progres Awal');
          if (!r.ok) { document.getElementById('phPesanSimpan').innerHTML = errBox(r.error); return; }
          document.getElementById('phPesanSimpan').innerHTML =
            '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;color:#16a34a">' +
            '✅ Tersimpan! ' + juzSelesai.length + ' juz selesai, ' + juzProses.length + ' juz proses.</div>';
        });
      };

      // Hapus
      document.getElementById('btnHapusProgresAwal').onclick = function(){
        if (!confirm('Hapus semua progres awal santri ini?')) return;
        api('hapusProgresAwal', {nisn:nisn}).then(function(r){
          if (r.ok) renderFormJuzUntukSantri(nisn, nama);
        });
      };
    });
  }

  // ============================================================
  // PERIZINAN SANTRI
  // ============================================================
  function pembinaPerizinan(gender){
    var c = getContentEl();
    var labelG = gender==='Putra'?'👦 Putra':gender==='Putri'?'👧 Putri':'Semua';
    c.innerHTML = '<div id="izinStatusPondok"></div>';
    widgetStatusPondok('izinStatusPondok', gender);

    // Tab: Daftar Izin | Ajukan Baru
    var tabAktif = 'daftar';
    function renderTabIzin(tab){
      tabAktif = tab;
      ['daftar','baru'].forEach(function(t){
        var el = document.getElementById('izTab_'+t);
        if(el) el.style.cssText = t===tab
          ? 'background:#0d9488;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer'
          : 'background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer';
        var sec = document.getElementById('izSec_'+t);
        if(sec) sec.style.display = t===tab?'':'none';
      });
    }

    c.innerHTML += '<div class="card"><h3>📋 Perizinan Santri — '+labelG+'</h3>' +
      '<div style="display:flex;gap:8px;margin-bottom:16px">' +
      '<button id="izTab_daftar">📋 Daftar Izin</button>' +
      '<button id="izTab_baru">➕ Ajukan Izin Baru</button>' +
      '</div>' +

      // Seksi Daftar Izin
      '<div id="izSec_daftar">' +
      '<div class="grid2" style="margin-bottom:10px">' +
      '<div><label>Filter Status</label>' +
      '<select id="izFilterStatus" style="width:100%">' +
      '<option value="">Semua Status</option>' +
      '<option value="Menunggu">⏳ Menunggu</option>' +
      '<option value="Disetujui">✅ Disetujui</option>' +
      '<option value="Ditolak">❌ Ditolak</option>' +
      '<option value="Sudah Kembali">🏠 Sudah Kembali</option>' +
      '</select></div>' +
      '<div><label>Filter Jenis</label>' +
      '<select id="izFilterJenis" style="width:100%">' +
      '<option value="">Semua Jenis</option>' +
      '<option value="Tidak Bermalam">Tidak Bermalam</option>' +
      '<option value="Bermalam">Bermalam</option>' +
      '</select></div>' +
      '</div>' +
      '<button id="btnIzMuat" class="secondary">🔄 Muat / Refresh</button>' +
      '<button id="btnIzCetakPDF" class="secondary" style="margin-left:6px">🖨 Cetak PDF</button>' +
      '<button id="btnIzExcel" class="secondary" style="margin-left:6px">📄 Export Excel</button>' +
      '<div id="izDaftarWrap" style="margin-top:12px"></div>' +
      '</div>' +

      // Seksi Ajukan Baru
      '<div id="izSec_baru" style="display:none">' +
      '<div class="grid2">' +
      '<div><label>Nama Santri *</label><input id="izNama" placeholder="Ketik nama santri..." autocomplete="off"></div>' +
      '<div><label>Jenis Izin *</label>' +
      '<select id="izJenis" style="width:100%">' +
      '<option value="Tidak Bermalam">Tidak Bermalam (hari yang sama)</option>' +
      '<option value="Bermalam">Bermalam (lebih dari 1 malam)</option>' +
      '</select></div>' +
      '</div>' +
      '<label>Keperluan / Alasan *</label>' +
      '<textarea id="izKeperluan" rows="2" placeholder="Contoh: Ke dokter, acara pernikahan kakak, dll." style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:8px"></textarea>' +
      '<div class="grid2">' +
      '<div><label>Tanggal Keluar *</label><input type="date" id="izTglKeluar" value="'+todayStr()+'"></div>' +
      '<div><label>Jam Keluar</label><input type="time" id="izJamKeluar" value="07:00"></div>' +
      '</div>' +
      '<div class="grid2">' +
      '<div><label>Tanggal Kembali (Rencana) *</label><input type="date" id="izTglKembali" value="'+todayStr()+'"></div>' +
      '<div><label>Jam Kembali</label><input type="time" id="izJamKembali" value="17:00"></div>' +
      '</div>' +
      '<button id="btnIzAjukan">📤 Ajukan Izin</button>' +
      '<div id="izPesanBaru" style="margin-top:8px"></div>' +
      '</div></div>';

    // Init tab
    document.getElementById('izTab_daftar').onclick = function(){ renderTabIzin('daftar'); };
    document.getElementById('izTab_baru').onclick = function(){ renderTabIzin('baru'); };
    renderTabIzin('daftar');

    // Autocomplete nama santri untuk form baru
    api('getSantriHarian', {gender:gender}).then(function(res){
      if (!res.ok) return;
      var inp = document.getElementById('izNama');
      if (!inp) return;
      var dl = document.createElement('datalist');
      dl.id = 'izNamaDL';
      res.data.forEach(function(s){ var o=document.createElement('option'); o.value=s.nisn+' - '+s.nama; dl.appendChild(o); });
      inp.parentNode.appendChild(dl);
      inp.setAttribute('list','izNamaDL');
      inp._daftar = res.data;
    });

    // Muat daftar
    function muatDaftar(){
      var wrap = document.getElementById('izDaftarWrap');
      if (!wrap) return;
      wrap.innerHTML = '<p class="muted">Memuat...</p>';
      var status = document.getElementById('izFilterStatus').value;
      var jenis  = document.getElementById('izFilterJenis').value;
      api('getDaftarIzin', {status:status, jenisIzin:jenis}).then(function(res){
        if (!res.ok){ wrap.innerHTML = errBox(res.error); return; }
        if (!res.data.length){ wrap.innerHTML = '<p class="muted" style="padding:16px 0">Belum ada data perizinan.</p>'; return; }

        var html = '';
        res.data.forEach(function(iz){
          var badgeColor = iz.status==='Menunggu'?'#d97706':iz.status==='Disetujui'?'#16a34a':iz.status==='Ditolak'?'#dc2626':'#64748b';
          var badgeBg = iz.status==='Menunggu'?'#fef9c3':iz.status==='Disetujui'?'#f0fdf4':iz.status==='Ditolak'?'#fee2e2':'#f1f5f9';
          html += '<div style="border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px">' +
            '<div>' +
            '<div style="font-weight:700;font-size:14px">'+esc(iz.nama)+' <span style="font-weight:400;color:#64748b;font-size:12px">'+esc(iz.kelas)+'</span></div>' +
            '<div style="font-size:12px;color:#64748b;margin-top:2px">'+esc(iz.jenisIzin)+' · '+esc(iz.keperluan)+'</div>' +
            '<div style="font-size:11px;color:#94a3b8;margin-top:2px">'+
            '📅 '+esc(iz.tglKeluar)+' '+esc(iz.jamKeluar)+' → '+esc(iz.tglKembaliRencana)+' '+esc(iz.jamKembaliRencana)+
            (iz.tglKembaliAktual?' · ✅ Kembali: '+esc(iz.tglKembaliAktual):'')+
            '</div>' +
            '</div>' +
            '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">' +
            '<span style="background:'+badgeBg+';color:'+badgeColor+';padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600">'+esc(iz.status)+'</span>' +
            '</div></div>' +
            // Tombol aksi
            '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">' +
            (iz.status==='Menunggu' ?
              '<button class="small btnIzSetujui" data-id="'+esc(iz.id)+'" style="background:#16a34a;color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer">✅ Setujui</button>'+
              '<button class="small btnIzTolak" data-id="'+esc(iz.id)+'" style="background:#dc2626;color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer">❌ Tolak</button>' : '')+
            (iz.status==='Disetujui' && !iz.tglKembaliAktual ?
              '<button class="small btnIzKembali" data-id="'+esc(iz.id)+'" data-nama="'+esc(iz.nama)+'" style="background:#2563eb;color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer">🏠 Konfirmasi Kembali</button>' : '')+
            '<span style="font-size:11px;color:#94a3b8;padding:5px 0">Ref: '+esc(iz.id)+'</span>' +
            '</div></div>';
        });
        wrap.innerHTML = html;

        // Binding tombol
        wrap.querySelectorAll('.btnIzSetujui').forEach(function(btn){
          btn.onclick = function(){
            if (!confirm('Setujui izin ini?')) return;
            loadingBtn(btn,'...');
            api('approveIzin',{id:btn.dataset.id, oleh:STATE.user.nama}).then(function(r){
              resetBtn(btn,'✅ Setujui');
              if(r.ok) muatDaftar(); else alert(r.error);
            });
          };
        });
        wrap.querySelectorAll('.btnIzTolak').forEach(function(btn){
          btn.onclick = function(){
            var alasan = prompt('Alasan penolakan (opsional):','');
            if (alasan === null) return;
            loadingBtn(btn,'...');
            api('tolakIzin',{id:btn.dataset.id, oleh:STATE.user.nama, alasan:alasan}).then(function(r){
              resetBtn(btn,'❌ Tolak');
              if(r.ok) muatDaftar(); else alert(r.error);
            });
          };
        });
        wrap.querySelectorAll('.btnIzKembali').forEach(function(btn){
          btn.onclick = function(){
            var catatan = prompt('Catatan kembali (opsional, contoh: kondisi baik):', '');
            if (catatan === null) return;
            loadingBtn(btn,'...');
            api('konfirmasiKembali',{id:btn.dataset.id, oleh:STATE.user.nama, catatan:catatan}).then(function(r){
              resetBtn(btn,'🏠 Kembali');
              if(r.ok){ widgetStatusPondok('izinStatusPondok', gender); muatDaftar(); }
              else alert(r.error);
            });
          };
        });
      });
    }

    document.getElementById('btnIzMuat').onclick = muatDaftar;

    // Cetak PDF rekap perizinan
    document.getElementById('btnIzCetakPDF').onclick = function(){
      var status = document.getElementById('izFilterStatus').value;
      var jenis  = document.getElementById('izFilterJenis').value;
      var btn = this;
      loadingBtn(btn, 'Memuat...');
      api('getDaftarIzin', {status:status, jenisIzin:jenis}).then(function(res){
        resetBtn(btn, '🖨 Cetak PDF');
        if (!res.ok || !res.data.length){ alert('Tidak ada data untuk dicetak.'); return; }
        cetakPDFPerizinan(res.data, {
          judul: 'Rekap Perizinan Santri',
          subJudul: (labelG!=='Semua'?'Gender: '+labelG+' · ':'')+(status?'Status: '+status+' · ':'')+(jenis?'Jenis: '+jenis:''),
          namaPesantren: STATE.pengaturan.NamaPesantren||'Pondok Pesantren',
          dicetak: STATE.user.nama,
        });
      });
    };

    // Export Excel (CSV)
    document.getElementById('btnIzExcel').onclick = function(){
      var status = document.getElementById('izFilterStatus').value;
      var jenis  = document.getElementById('izFilterJenis').value;
      var btn = this;
      loadingBtn(btn, 'Memuat...');
      api('getDaftarIzin', {status:status, jenisIzin:jenis}).then(function(res){
        resetBtn(btn, '📄 Export Excel');
        if (!res.ok || !res.data.length){ alert('Tidak ada data untuk diekspor.'); return; }
        var bom = '\uFEFF';
        var header = ['No','Nama Santri','Kelas','Jenis Izin','Keperluan','Tgl Keluar','Jam Keluar','Tgl Kembali (Rencana)','Jam Kembali','Status','Diajukan Oleh','Tgl Kembali (Aktual)'];
        var rows = res.data.map(function(iz,i){
          return [i+1, iz.nama, iz.kelas, iz.jenisIzin, iz.keperluan,
            iz.tglKeluar, iz.jamKeluar, iz.tglKembaliRencana, iz.jamKembaliRencana,
            iz.status, iz.diajukanOleh, iz.tglKembaliAktual||'-'];
        });
        var csv = bom + [header].concat(rows).map(function(r){
          return r.map(function(v){ var s=String(v||''); return s.includes(',')?'"'+s+'"':s; }).join(',');
        }).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
        a.download = 'Rekap_Perizinan_'+todayStr()+'.csv';
        a.click();
      });
    };
    muatDaftar();

    // Ajukan izin baru
    document.getElementById('btnIzAjukan').onclick = function(){
      var btn = this;
      var rawNama = document.getElementById('izNama').value.trim();
      var inp = document.getElementById('izNama');
      // Cari NISN dari daftar santri
      var nisn = '', namaSantri = rawNama;
      if (inp._daftar) {
        var found = inp._daftar.find(function(s){ return (s.nisn+' - '+s.nama)===rawNama || s.nama===rawNama || s.nisn===rawNama; });
        if (found){ nisn=found.nisn; namaSantri=found.nama; }
      }
      if (!nisn && !rawNama){ document.getElementById('izPesanBaru').innerHTML=errBox('Pilih nama santri.'); return; }
      var keperluan = document.getElementById('izKeperluan').value.trim();
      if (!keperluan){ document.getElementById('izPesanBaru').innerHTML=errBox('Keperluan wajib diisi.'); return; }
      var tglKeluar = document.getElementById('izTglKeluar').value;
      var tglKembali = document.getElementById('izTglKembali').value;
      if (!tglKeluar || !tglKembali){ document.getElementById('izPesanBaru').innerHTML=errBox('Tanggal keluar dan kembali wajib diisi.'); return; }

      loadingBtn(btn,'Mengajukan...');
      api('ajukanIzin',{
        nisn: nisn || rawNama, // kalau tidak ada NISN, kirim nama saja (backend cari)
        jenisIzin: document.getElementById('izJenis').value,
        keperluan: keperluan,
        tglKeluar: tglKeluar,
        jamKeluar: document.getElementById('izJamKeluar').value,
        tglKembaliRencana: tglKembali,
        jamKembaliRencana: document.getElementById('izJamKembali').value,
        diajukanOleh: STATE.user.nama,
      }).then(function(r){
        resetBtn(btn,'📤 Ajukan Izin');
        if(!r.ok){ document.getElementById('izPesanBaru').innerHTML=errBox(r.error); return; }
        document.getElementById('izPesanBaru').innerHTML =
          '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;color:#16a34a">'+
          '✅ Izin berhasil diajukan untuk <b>'+esc(r.namaSantri)+'</b>.<br>'+
          'Status: <b>Menunggu</b> · Ref: '+esc(r.id)+'<br>'+
          '<small>WA notifikasi telah dikirim ke wali santri.</small></div>';
        document.getElementById('izKeperluan').value = '';
        renderTabIzin('daftar');
        muatDaftar();
      }).catch(function(){ resetBtn(btn,'📤 Ajukan Izin'); });
    };
  }

  // Widget izin di dashboard Wali Santri -- rekap izin anak
  function renderIzinWaliSantri(nisn, containerId){
    var c = document.getElementById(containerId);
    if (!c) return;
    api('getIzinSantriSaya', {nisn:nisn}).then(function(res){
      if (!res.ok || !res.data.length){
        c.innerHTML = '<div class="card"><h4>📋 Riwayat Izin</h4><p class="muted">Belum ada riwayat perizinan.</p></div>';
        return;
      }
      var aktif = res.data.filter(function(iz){ return iz.status==='Disetujui'&&!iz.tglKembaliAktual; });
      var riwayat = res.data.slice(0,5);
      var html = '<div class="card"><h4>📋 Perizinan Santri</h4>';
      if (aktif.length) {
        html += '<div style="background:#fef9c3;border:1px solid #fde68a;border-radius:10px;padding:12px;margin-bottom:10px">'+
          '<b>⚠️ Sedang Izin Keluar</b><br>';
        aktif.forEach(function(iz){
          html += '<div style="font-size:13px;margin-top:4px">'+esc(iz.jenisIzin)+' · Kembali rencana: '+esc(iz.tglKembaliRencana)+' '+esc(iz.jamKembaliRencana)+'</div>';
        });
        html += '</div>';
      }
      html += '<div style="font-size:12px">';
      riwayat.forEach(function(iz){
        var color = iz.status==='Sudah Kembali'?'#16a34a':iz.status==='Disetujui'?'#2563eb':iz.status==='Ditolak'?'#dc2626':'#d97706';
        html += '<div style="border-left:3px solid '+color+';padding:6px 10px;margin-bottom:6px;background:#f8fafc;border-radius:0 8px 8px 0">'+
          '<div style="font-weight:600">'+esc(iz.jenisIzin)+' — '+esc(iz.keperluan)+'</div>'+
          '<div style="color:#64748b;font-size:11px">'+esc(iz.tglKeluar)+' → '+esc(iz.tglKembaliRencana)+
          (iz.tglKembaliAktual?' · Kembali: '+esc(iz.tglKembaliAktual):'')+
          ' · <span style="color:'+color+'">'+esc(iz.status)+'</span></div>'+
          '</div>';
      });
      html += '</div></div>';
      c.innerHTML = html;
    }).catch(function(){});
  }

                 roles.indexOf('PembinaPutri')!==-1 ? 'Putri' : '';

      {key:'tugasharian',      label:'Tugas Harian',                        icon:'&#9989;'},

      {key:'rekap_harian',     label:'Rekap Kehadiran',                     icon:'&#128202;'},
      {key:'perizinan',        label:'Perizinan Santri',                    icon:'&#128196;'},
      {key:'catatpelanggaran', label:'Catat Pelanggaran',                   icon:'&#128221;'},
      {key:'profilsaya',       label:'Profil Saya',                         icon:'&#128100;'}
    ];
    var map = {
      tugasharian:  function(){ pembinaTugasHarian(); },
      absen_harian: function(){ pembinaAbsenHarian(gender); },
      rekap_harian: function(){ pembinaRekapHarian(gender); },
      perizinan:    function(){ pembinaPerizinan(gender); },
      catatpelanggaran: function(){ renderFormCatatPelanggaran('dpb-content'); },
      profilsaya:   guruProfilSaya,
    };
    activeKey = activeKey && map[activeKey] ? activeKey : 'tugasharian';
    renderSidebarShell({title:'Dashboard Pembina'+(labelG?' '+labelG:''), navItems:navItems, activeKey:activeKey, contentId:'dpb-content', onSelect:function(key){ map[key](); }});
    map[activeKey]();
    // Widget progress tugas di sidebar (badge mini)
    setTimeout(function(){
      api('getTugasHariIni', {pembina: STATE.user.nama, tanggal: todayStr()}).then(function(res){
        if (!res.ok || !res.total) return;
        var badge = document.querySelector('[data-key="tugasharian"] .nav-badge');
        if (!badge) {
          var el = document.querySelector('[data-key="tugasharian"]');
          if (el) {
            var b = document.createElement('span');
            b.className = 'nav-badge';

          }

      });
