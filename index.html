        '<div class="card"><h3>Daftar Guru Pengganti Tercatat</h3><div id="daftarPenggantiWrap">Memuat...</div></div>';

      function muatFormSesi(){
        var jenis = document.getElementById('pgJenis').value;
        var guruAsli = resolveGuruExact(document.getElementById('pgGuruAsli').value.trim(), daftarNamaGuru);
        var wrap = document.getElementById('pgSesiWrap');
        if (!guruAsli) { wrap.innerHTML = '<p class="muted">Ketik nama Guru Asli yang valid dulu (pilih dari saran).</p>'; return; }
        wrap.innerHTML = '<p>Memuat jadwal...</p>';
        if (jenis === 'Mapel') {
          api('getMasterData', {sheet:'MataPelajaran'}).then(function(res){
            if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
            var daftar = res.data.data.filter(function(m){ return m.Pengampu === guruAsli; });
            if(!daftar.length){ wrap.innerHTML = warnBox('Guru ini tidak punya jadwal mata pelajaran.'); return; }
            window.__pgDaftarSesi = daftar;
            wrap.innerHTML = '<label>Pilih Sesi yang Digantikan</label><select id="pgSesiPilihan">' +
              daftar.map(function(m,i){ return '<option value="'+i+'">'+esc(m['Nama Mapel'])+' - '+esc(m.Kelas)+' ('+esc(m.Hari)+', Jam ke-'+esc(m['Jam Ke'])+')</option>'; }).join('') + '</select>';
          });
        } else {
          api('getHalaqohList', {}).then(function(res){
            if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
            var daftar = res.data.filter(function(h){ return h.pengampuList && h.pengampuList.indexOf(guruAsli) !== -1; });
            if(!daftar.length){ wrap.innerHTML = warnBox('Guru ini tidak punya jadwal halaqoh.'); return; }
            window.__pgDaftarSesi = daftar;
            wrap.innerHTML = '<label>Pilih Halaqoh yang Digantikan</label><select id="pgSesiPilihan">' +
              daftar.map(function(h,i){ return '<option value="'+i+'">'+esc(h.namaHalaqoh)+' ('+esc(h.waktu)+')</option>'; }).join('') + '</select>';
          });
        }
      }
      document.getElementById('pgJenis').onchange = muatFormSesi;
      document.getElementById('pgGuruAsli').addEventListener('input', muatFormSesi);

      function muatDaftarPengganti(){
        document.getElementById('daftarPenggantiWrap').innerHTML = 'Memuat...';
        api('getDaftarPenggantian', {}).then(function(res){
          if(!res.ok){ document.getElementById('daftarPenggantiWrap').innerHTML = errBox(res.error); return; }
          if(!res.data.length){ document.getElementById('daftarPenggantiWrap').innerHTML = '<p class="muted">Belum ada catatan guru pengganti.</p>'; return; }
          var html = '<table><tr><th>Tanggal</th><th>Jenis</th><th>Sesi</th><th>Guru Asli</th><th>Guru Pengganti</th><th>Ket</th><th>Aksi</th></tr>';
          res.data.sort(function(a,b){ return b.tanggal.localeCompare(a.tanggal); }).forEach(function(p){
            var sesiLabel = p.jenisSesi === 'Mapel' ? (p.mapel+' - '+p.kelas+' (Jam ke-'+p.jamKe+')') : (p.halaqoh+' ('+p.waktu+')');
            html += '<tr><td>'+esc(p.tanggal)+'</td><td>'+esc(p.jenisSesi)+'</td><td>'+esc(sesiLabel)+'</td><td>'+esc(p.guruAsli)+'</td><td>'+esc(p.guruPengganti)+'</td><td>'+esc(p.keterangan||'-')+'</td>' +
              '<td><button class="small danger btnHapusPengganti" data-row="'+p.rowIndex+'">Hapus</button></td></tr>';
          });
          html += '</table>';
          document.getElementById('daftarPenggantiWrap').innerHTML = html;
          document.querySelectorAll('.btnHapusPengganti').forEach(function(btn){
            btn.onclick = function(){ if(!confirm('Hapus catatan penggantian ini?')) return; api('hapusPenggantian', {rowIndex:Number(btn.dataset.row)}).then(muatDaftarPengganti); };
          });
        });
      }

      document.getElementById('btnSimpanPengganti').onclick = function(){
        var tanggal = document.getElementById('pgTanggal').value;
        var jenis = document.getElementById('pgJenis').value;
        var guruAsli = resolveGuruExact(document.getElementById('pgGuruAsli').value.trim(), daftarNamaGuru);
        var guruPengganti = resolveGuruExact(document.getElementById('pgGuruPengganti').value.trim(), daftarNamaGuru);
        var sesiSelect = document.getElementById('pgSesiPilihan');
        if (!tanggal || !guruAsli || !guruPengganti || !sesiSelect) { document.getElementById('pesanPengganti').innerHTML = errBox('Lengkapi semua isian, termasuk pilih sesi yang digantikan (nama guru harus dipilih dari saran).'); return; }
        if (guruAsli === guruPengganti) { document.getElementById('pesanPengganti').innerHTML = errBox('Guru Pengganti tidak boleh sama dengan Guru Asli.'); return; }
        var sesi = window.__pgDaftarSesi[Number(sesiSelect.value)];
        var payload = {tanggal:tanggal, jenisSesi:jenis, guruAsli:guruAsli, guruPengganti:guruPengganti, keterangan: document.getElementById('pgKeterangan').value.trim()};
        if (jenis === 'Mapel') { payload.mapel = sesi['Nama Mapel']; payload.kelas = sesi.Kelas; payload.jamKe = sesi['Jam Ke']; }
        else { payload.halaqoh = sesi.namaHalaqoh; payload.waktu = sesi.waktu; }
        api('tambahPenggantian', payload).then(function(res){
          if(!res.ok){ document.getElementById('pesanPengganti').innerHTML = errBox(res.error); return; }
          document.getElementById('pesanPengganti').innerHTML = '<p class="muted">Tersimpan.</p>';
          document.getElementById('pgKeterangan').value = '';
          muatDaftarPengganti();
        });
      };

      muatDaftarPengganti();
    });
  }

        ['0011229901','Contoh Nama Santri',2025,'Laki-laki','6281200000000','7A']];

      var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Template Santri'); XLSX.writeFile(wb, 'Template_Import_Santri.xlsx');

    document.getElementById('btnProsesImport').onclick = function(){
      var fileInput = document.getElementById('fileImport');
      if(!fileInput.files.length){ alert('Pilih file Excel terlebih dahulu.'); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        try {
          var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          var ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, {defval:''});
          var payload = rows.map(function(r){
            return { nisn: String(r['NISN']||'').trim(), nama: String(r['Nama']||'').trim(), tahunMasuk: String(r['Tahun Masuk']||'').trim(),
              jenisKelamin: String(r['Jenis Kelamin']||'').trim(), noWaOrtu: String(r['No WA Ortu']||'').trim(),
              kelas: String(r['Kelas (opsional, harus sama persis dgn nama Rombel yang sudah ada)'] || r['Kelas'] || '').trim() };
          }).filter(function(r){ return r.nisn; });
          if(!payload.length){ document.getElementById('hasilImport').innerHTML = errBox('Tidak ada baris data yang terbaca dari file.'); return; }
          document.getElementById('hasilImport').innerHTML = '<p class="muted">Mengimpor '+payload.length+' baris...</p>';
          api('importSantriMassal', {rows: payload}).then(function(res){
            if(!res.ok){ document.getElementById('hasilImport').innerHTML = errBox(res.error); return; }
            var html = '<p>Berhasil ditambah: <b>'+res.ditambah+'</b>, dilewati: <b>'+res.dilewati+'</b></p>';
            if(res.errors && res.errors.length){ html += '<div class="warn">' + res.errors.map(esc).join('<br>') + '</div>'; }
            document.getElementById('hasilImport').innerHTML = html;
            muatTabelSantri();
          });
        } catch(err){ document.getElementById('hasilImport').innerHTML = errBox('Gagal membaca file: ' + err.message); }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    };

    document.getElementById('btnExportSantri').onclick = function(){
      api('getSemuaSantri', {}).then(function(res){
        if(!res.ok){ alert(res.error); return; }
        var data = [['NISN','Nama','Tahun Masuk','Jenis Kelamin','No WA Ortu','Kelas Saat Ini','Halaqoh Saat Ini']];
        res.data.forEach(function(s){ data.push([s.nisn, s.nama, s.tahunMasuk, s.jenisKelamin, s.noWaOrtu, s.kelasSaatIni, s.halaqohSaatIni]); });
        var ws = XLSX.utils.aoa_to_sheet(data);
        var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data Santri'); XLSX.writeFile(wb, 'Data_Santri_Export.xlsx');
      });
    };

    function muatTabelSantri(){
      api('getSemuaSantri', {}).then(function(res){
        if(!res.ok){ document.getElementById('tabelSantri').innerHTML = errBox(res.error); return; }
        var html = '<table><tr><th>NISN</th><th>Nama</th><th>Tahun Masuk</th><th>Gender</th><th>No WA Ortu</th><th>Kelas</th><th>Halaqoh</th><th>Saldo Kantin</th><th>Limit Harian</th><th>Aksi Kantin</th></tr>';
        res.data.forEach(function(s){
          var saldo = s.saldoKantin!=null ? 'Rp'+Number(s.saldoKantin||0).toLocaleString('id-ID') : '-';
          var limit = s.limitHarian!=null && s.limitHarian>0 ? 'Rp'+Number(s.limitHarian).toLocaleString('id-ID') : 'Tanpa batas';
          html += '<tr><td>'+esc(s.nisn)+'</td><td>'+esc(s.nama)+'</td><td>'+esc(s.tahunMasuk)+'</td><td>'+esc(s.jenisKelamin)+'</td><td>'+esc(s.noWaOrtu)+'</td><td>'+esc(s.kelasSaatIni)+'</td><td>'+esc(s.halaqohSaatIni)+'</td>' +
            '<td>'+saldo+'</td><td>'+limit+'</td>' +
            '<td style="white-space:nowrap">' +
            '<button class="small btnTambahSaldo" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'">+Saldo</button> ' +
            '<button class="small secondary btnAturLimit" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'" data-limit="'+Number(s.limitHarian||0)+'">Limit</button>' +
            '</td></tr>';
        });
        html += '</table>';
        document.getElementById('tabelSantri').innerHTML = html;

        // Tombol Tambah Saldo Manual
        document.querySelectorAll('.btnTambahSaldo').forEach(function(btn){
          btn.onclick = function(){
            var fieldsHtml = '<p><b>'+esc(btn.dataset.nama)+'</b></p>' +
              '<label>Nominal Tambah Saldo (Rp)</label><input type="number" id="tsmNominal" placeholder="Contoh: 50000">';
            openModal('Tambah Saldo Kantin Manual', fieldsHtml, function(m){
              var nominal = m.querySelector('#tsmNominal').value.trim();
              if (!nominal || Number(nominal)<=0){ alert('Isi nominal yang valid.'); return false; }
              api('tambahSaldoSantriManual',{nisn:btn.dataset.nisn, nominal:nominal, oleh:STATE.user.nama}).then(function(r){
                if(!r.ok){ alert(r.error); return; }
                alert('Saldo '+r.nama+' berhasil ditambah. Saldo baru: Rp'+r.saldoBaru.toLocaleString('id-ID'));
                muatTabelSantri();
              });
            });
          };
        });

        // Tombol Atur Limit
        document.querySelectorAll('.btnAturLimit').forEach(function(btn){
          btn.onclick = function(){
            var fieldsHtml = '<p><b>'+esc(btn.dataset.nama)+'</b></p>' +
              '<label>Limit Belanja Harian (Rp, isi 0 untuk tanpa batas)</label>' +
              '<input type="number" id="alNominal" value="'+esc(btn.dataset.limit)+'" placeholder="0 = tanpa batas">';
            openModal('Atur Limit Harian Kantin', fieldsHtml, function(m){
              var limit = m.querySelector('#alNominal').value.trim();
              api('setLimitHarianAdmin',{nisn:btn.dataset.nisn, limit:limit||0}).then(function(r){
                if(!r.ok){ alert(r.error); return; }
                muatTabelSantri();
              });
            });
          };
        });
      });
    }
    muatTabelSantri();
  }

  // ---------------- DATA MASTER LAIN ----------------
  function adminDataMaster(){
    var c = document.getElementById(STATE._contentId||'da-content');
    var sheets = ['Guru','MataPelajaran','RoleAkses','JamPelajaran'];
    c.innerHTML = '<div class="card"><h3>Kelola Data Master</h3>' +
      '<select id="pilihSheet">' + sheets.map(function(s){return '<option value="'+s+'">'+(s==='JamPelajaran'?'Jam Pelajaran (acuan rekap jam mengajar)':s)+'</option>';}).join('') + '</select>' +
      '<div id="tabelMaster">Memuat...</div></div>';

    function muat(){
      var sheet = document.getElementById('pilihSheet').value;
      var fetchGuru = (sheet==='MataPelajaran') ? api('getMasterData', {sheet:'Guru'}) : Promise.resolve({ok:true,data:{data:[]}});
      var fetchKelas = (sheet==='MataPelajaran') ? api('getDaftarKelasRombel',{}) : Promise.resolve({ok:true,data:[]});
      var fetchSantri = (sheet==='RoleAkses') ? api('getSemuaSantri', {}) : Promise.resolve({ok:true,data:[]});
      Promise.all([api('getMasterData', {sheet:sheet}), fetchKelas, fetchGuru, fetchSantri])
        .then(function(hasil){
          var res = hasil[0], resKelas = hasil[1], resGuru = hasil[2], resSantri = hasil[3];
          if(!res.ok){ document.getElementById('tabelMaster').innerHTML = errBox(res.error); return; }
          var header = res.data.header;
          var daftarKelas = resKelas.data.map(function(k){return k.kelas;});
          var daftarNamaGuru = resGuru.ok ? resGuru.data.data.map(function(g){return g.Nama;}) : [];
          var daftarNamaMapel = []; var seenMapel = {};
          res.data.data.forEach(function(row){ var nm = row['Nama Mapel']; if(nm && !seenMapel[nm]){ seenMapel[nm]=true; daftarNamaMapel.push(nm); } });
          var daftarSantri = resSantri.ok ? resSantri.data : [];
          var html = '<table><tr>' + header.map(function(h){return '<th>'+esc(h)+'</th>';}).join('') + '<th>Aksi</th></tr>';
          res.data.data.forEach(function(row){
            html += '<tr>' + header.map(function(h){return '<td>'+esc(row[h]!==undefined?row[h]:'')+'</td>';}).join('') +
              '<td><button class="small btnEditM" data-row="'+row.rowIndex+'">Edit</button> <button class="small danger btnDelM" data-row="'+row.rowIndex+'">Hapus</button></td></tr>';
          });
          html += '</table><button id="btnTambahRow">+ Tambah Data</button>';
          document.getElementById('tabelMaster').innerHTML = html;

          function bukaForm(existing){
            var fieldsHtml = header.map(function(h){
              if(sheet==='MataPelajaran' && h==='Kelas') return fieldSelect('f_'+h,h,daftarKelas, existing?existing[h]:(daftarKelas[0]||''));
              if(sheet==='MataPelajaran' && h==='Hari') return fieldSelect('f_'+h,h,['Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu','Minggu'], existing?existing[h]:'Senin');
              if(sheet==='MataPelajaran' && h==='Pengampu') return fieldAutocomplete('f_'+h,h,daftarNamaGuru, existing?existing[h]:'', 'Ketik nama guru...');
              if(sheet==='MataPelajaran' && h==='Nama Mapel') return fieldAutocomplete('f_'+h,h,daftarNamaMapel, existing?existing[h]:'', 'Ketik nama mapel (boleh baru)...');
              if(sheet==='RoleAkses' && h==='Level') {
                var rolesTerpilih = existing && existing[h] ? String(existing[h]).split(',').map(function(s){return s.trim();}) : ['Guru'];
                return '<label>Level / Role (boleh pilih lebih dari satu)</label><div id="f_Level_wrap">' +
                  DAFTAR_ROLE.map(function(r){ return '<label style="display:inline-flex;align-items:center;gap:5px;font-weight:400;margin-right:12px;margin-bottom:4px"><input type="checkbox" class="roleChk" value="'+r.value+'" style="width:auto;margin:0" '+(rolesTerpilih.indexOf(r.value)!==-1?'checked':'')+'> '+esc(r.label)+'</label>'; }).join('') +
                  '</div>';
              }
              if(sheet==='RoleAkses' && h==='NISN Anak') return fieldAutocomplete('f_'+h,h,daftarSantri.map(labelSantri), existing?existing[h]:'', 'Ketik NISN/nama santri (khusus WaliSantri, kosongkan jika bukan)');
              if(sheet==='JamPelajaran' && h==='Jenis') return fieldSelect('f_'+h,h,['Halaqoh','Mapel'], existing?existing[h]:'Halaqoh');
              if(sheet==='JamPelajaran' && h==='Nama') return fieldText('f_'+h,'Nama (untuk Halaqoh isi nama Waktu: Subuh/Duha/Maghrib dst; untuk Mapel isi nama mata pelajaran)', existing?existing[h]:'');
              if(sheet==='JamPelajaran' && h==='Jumlah Jam') return fieldText('f_'+h,h, existing?existing[h]:'');
              return fieldText('f_'+h, h, existing?existing[h]:'');
            }).join('');
            openModal(existing? 'Edit Data' : 'Tambah Data', fieldsHtml, function(modal){
              var values = {}; var gagal = null;
              header.forEach(function(h){
                if (sheet==='RoleAkses' && h==='Level') {
                  var checked = Array.prototype.map.call(modal.querySelectorAll('.roleChk:checked'), function(el){return el.value;});
                  if (!checked.length) { gagal = 'Pilih minimal satu Level/Role.'; return; }
                  values[h] = checked.join(',');
                  return;
                }
                var raw = modal.querySelector('#f_'+h).value;
                if (sheet==='MataPelajaran' && h==='Pengampu') {
                  var pengampuValid = resolveGuruExact(raw, daftarNamaGuru);
                  if (!pengampuValid) { gagal = 'Nama guru pada Pengampu tidak dikenali. Pilih salah satu saran yang muncul saat mengetik.'; return; }
                  values[h] = pengampuValid;
                } else if (sheet==='RoleAkses' && h==='NISN Anak') {
                  if (!raw) { values[h] = ''; }
                  else {
                    var nisnValid = resolveSantriNisn(raw, daftarSantri);
                    if (!nisnValid) { gagal = 'Santri pada NISN Anak tidak ditemukan. Pilih salah satu saran yang muncul saat mengetik, atau kosongkan.'; return; }
                    values[h] = nisnValid;
                  }
                } else { values[h] = raw; }
              });
              if (gagal) { alert(gagal); return false; }
              return api('saveMasterRow', {sheet:sheet, rowIndex: existing? existing.rowIndex : 0, values: values}).then(function(r){
                if(!r.ok){ alert(r.error); throw new Error(r.error); }
                else muat();
              });
            });
          }
          document.getElementById('btnTambahRow').onclick = function(){ bukaForm(null); };
          document.querySelectorAll('.btnEditM').forEach(function(btn){ btn.onclick = function(){ bukaForm(res.data.data.find(function(r){return r.rowIndex===Number(btn.dataset.row);})); }; });
          document.querySelectorAll('.btnDelM').forEach(function(btn){ btn.onclick = function(){ if(!confirm('Hapus baris ini?')) return; api('deleteMasterRow', {sheet:sheet, rowIndex:Number(btn.dataset.row)}).then(muat); }; });
        });
    }
    document.getElementById('pilihSheet').onchange = muat;
    muat();
  }

        '<button id="btnLihatRapor">Tampilkan Rapor</button>' +
        '<button class="secondary" id="btnPdfRaporAdmin">Download PDF</button>' +
        '<button class="secondary" id="btnKirimRaporOrtu">Kirim ke Orang Tua (WA)</button>' +
        '<div id="hasilRapor"></div></div>';
      document.getElementById('btnRefreshRekapNilai').onclick = function(){
        var btn = document.getElementById('btnRefreshRekapNilai'); btn.disabled = true; btn.innerText = 'Memperbarui...';
        api('refreshRekapNilai', {}).then(function(res){
          btn.disabled = false; btn.innerText = 'Perbarui Sheet RekapNilai Sekarang';
          document.getElementById('pesanRefreshRekap').innerHTML = res.ok ? ('<p class="muted">Selesai. '+res.jumlahBaris+' baris tersimpan di sheet RekapNilai.</p>') : errBox(res.error);
        });
      };
      var lastRapor = null, lastNisn = null, lastNama = '';
      document.getElementById('btnLihatRapor').onclick = function(){
        var raw = document.getElementById('rpNisn').value.trim();
        var nisn = resolveSantriNisn(raw, daftarSantri);
        if (!nisn) { document.getElementById('hasilRapor').innerHTML = errBox('Santri tidak ditemukan. Pilih salah satu saran yang muncul saat mengetik.'); return; }
        lastNisn = nisn;
        var found = daftarSantri.find(function(s){return s.nisn===nisn;}); lastNama = found ? found.nama : nisn;
        document.getElementById('hasilRapor').innerHTML = 'Memuat...';
        api('getRaporSantri', {nisn:nisn}).then(function(res){
          if(!res.ok){ document.getElementById('hasilRapor').innerHTML = errBox(res.error); return; }
          lastRapor = res.data;
          if(!lastRapor.length){ document.getElementById('hasilRapor').innerHTML = '<p class="muted">Belum ada data nilai/absensi untuk santri ini.</p>'; return; }
          var html = '<table><tr><th>Mapel</th><th>Tugas</th><th>Kehadiran%</th><th>UTS</th><th>UAS</th><th>Pengetahuan</th><th>Sikap</th><th>Keterampilan</th></tr>' +
            lastRapor.map(function(r){return '<tr><td>'+esc(r.mapel)+'</td><td>'+(r.rataTugas!=null?r.rataTugas:'-')+'</td><td>'+(r.persenKehadiran!=null?r.persenKehadiran:'-')+'</td><td>'+(r.nilaiUTS!=null?r.nilaiUTS:'-')+'</td><td>'+(r.nilaiUAS!=null?r.nilaiUAS:'-')+'</td><td><b>'+(r.nilaiPengetahuan!=null?r.nilaiPengetahuan:'-')+'</b></td><td>'+(r.rataSikap!=null?r.rataSikap:'-')+'</td><td>'+(r.rataKeterampilan!=null?r.rataKeterampilan:'-')+'</td></tr>';}).join('') + '</table>' +
            '<p class="muted">Nilai Pengetahuan = Tugas 35% + UTS 25% + Kehadiran 10% + UAS 30%</p>';
          document.getElementById('hasilRapor').innerHTML = html;
        });
      };
      document.getElementById('btnPdfRaporAdmin').onclick = function(){
        if(!lastRapor || !lastRapor.length) return alert('Tampilkan rapor dulu.');
        api('generatePDF', {judul:'Rapor Akademik - '+(lastNama||lastNisn), kolom:['Mapel','Tugas','Kehadiran%','UTS','UAS','Pengetahuan','Sikap','Keterampilan'],
          baris: lastRapor.map(function(r){return [r.mapel, r.rataTugas, r.persenKehadiran, r.nilaiUTS, r.nilaiUAS, r.nilaiPengetahuan, r.rataSikap, r.rataKeterampilan];})
        }).then(unduhPdf);
      };
      document.getElementById('btnKirimRaporOrtu').onclick = function(){
        if(!lastRapor || !lastNisn) return alert('Tampilkan rapor dulu.');
        api('getMasterData', {sheet:'Santri'}).then(function(res){
          if(!res.ok) return alert(res.error);
          var s = res.data.data.find(function(x){return String(x.NISN)===String(lastNisn);});
          if(!s) return alert('Santri tidak ditemukan');
          var ringkas = lastRapor.map(function(r){return r.mapel+': '+(r.nilaiPengetahuan!=null?r.nilaiPengetahuan:'-');}).join(', ');
          var pesan = 'Rapor Akademik '+s.Nama+' - ' + ringkas;
          api('getWaLink', {noWa: s['No WA Ortu'], pesan: pesan}).then(function(res2){ if(!res2.ok) return alert(res2.error); window.open(res2.data, '_blank'); });
        });
      };
    });
  }

  function adminKelolaPelanggaran(){
    var c = document.getElementById(STATE._contentId||'da-content');
    c.innerHTML = '<p>Memuat...</p>';
    Promise.all([api('getPelanggaranSSList', {}), api('getPengaturan', {})]).then(function(hasil){
      var resList = hasil[0], resP = hasil[1];
      if (!resList.ok) { c.innerHTML = errBox(resList.error); return; }
      var daftarSS = resList.data;
      var aktifId = (daftarSS.find(function(s){return s.aktif;}) || {}).id || '';

      c.innerHTML =
        '<div class="card"><h3>Spreadsheet Pelanggaran</h3>' +
        warnBox('Spreadsheet Pelanggaran TERPISAH dari spreadsheet Absensi. Bisa buat baru kapan saja (misal data sudah terlalu besar) -- daftar jenis Pelanggaran/Prestasi otomatis disalin ke yang baru, tapi catatan & poin selalu mulai kosong. Spreadsheet lama tetap bisa dilihat riwayatnya lewat dropdown di bawah.') +
        '<input id="namaPelSSBaru" placeholder="Nama spreadsheet baru, contoh: Pelanggaran 2025/2026">' +
        '<button id="btnBuatPelSS">Buat Spreadsheet Baru</button><div id="pesanPelSS"></div>' +
        '<div id="listPelSS" style="margin-top:10px"></div></div>' +

        '<div class="card"><h3>Lihat Data Dari Spreadsheet</h3>' +
        '<label>Pilih Spreadsheet</label><select id="pelSSDipilih"></select></div>' +

        '<div class="card"><h3>Rekap Poin Bulan Ini</h3><div id="rekapPoinWrap">Memuat...</div></div>' +

        '<div class="card"><h3>Kelola Jenis Pelanggaran</h3><button class="small" id="btnTambahPel">+ Tambah</button><div id="listMasterPel">Memuat...</div></div>' +
        '<div class="card"><h3>Kelola Jenis Prestasi</h3><button class="small" id="btnTambahPres">+ Tambah</button><div id="listMasterPres">Memuat...</div></div>' +

        '<div class="card"><h3>Pengaturan Notifikasi WhatsApp Otomatis (Fonnte)</h3>' +
        warnBox('Kalau Token Fonnte diisi, notifikasi ke orang tua (saat ada pelanggaran & saat poin habis) terkirim OTOMATIS lewat WhatsApp tanpa perlu klik apapun.') +
        fieldText('pgFonnteToken','Token Fonnte', (resP.ok && resP.data.FonnteToken) || '') +
        fieldText('pgGrupWA','No/ID Grup WA Pengajar (opsional, notifikasi poin habis)', (resP.ok && resP.data.GrupPengajarWA) || '') +
        fieldText('pgModalPoin','Modal Poin Santri per Bulan', (resP.ok && resP.data.ModalPoinSantri) || '25') +
        '<button id="btnSimpanFonnte">Simpan</button><div id="pesanFonnte"></div></div>';

      function muatDaftarSS(){
        var html = '<table><tr><th>Nama</th><th>Aktif</th><th>Aksi</th></tr>';
        daftarSS.forEach(function(s){
          html += '<tr><td>'+esc(s.nama)+'</td><td>'+(s.aktif?'&#9989; Aktif':'-')+'</td>' +
            '<td>'+(s.aktif?'':'<button class="small btnAktifkanPelSS" data-id="'+esc(s.id)+'">Jadikan Aktif</button>')+'</td></tr>';
        });
        html += '</table>';
        document.getElementById('listPelSS').innerHTML = html;
        document.querySelectorAll('.btnAktifkanPelSS').forEach(function(btn){
          btn.onclick = function(){
            if(!confirm('Ganti spreadsheet Pelanggaran aktif? Pencatatan selanjutnya akan tersimpan di sini.')) return;
            api('setPelanggaranSSAktif', {id: btn.dataset.id}).then(function(res){ if(res.ok){ alert('Berhasil diganti.'); adminKelolaPelanggaran(); } else alert(res.error); });
          };
        });
        var selSS = document.getElementById('pelSSDipilih');
        selSS.innerHTML = daftarSS.map(function(s){ return '<option value="'+esc(s.id)+'" '+(s.id===aktifId?'selected':'')+'>'+esc(s.nama)+(s.aktif?' (Aktif)':'')+'</option>'; }).join('');
        selSS.onchange = function(){ muatRekap(); muatMaster(); };
      }
      document.getElementById('btnBuatPelSS').onclick = function(){
        var nama = document.getElementById('namaPelSSBaru').value.trim();
        if(!nama) return;
        var btn = document.getElementById('btnBuatPelSS'); btn.disabled=true; btn.innerText='Membuat...';
        api('buatPelanggaranSSBaru', {nama:nama}).then(function(res){
          btn.disabled=false; btn.innerText='Buat Spreadsheet Baru';
          if(res.ok){ alert('Spreadsheet "'+nama+'" dibuat. Jangan lupa "Jadikan Aktif" kalau ingin langsung dipakai.'); adminKelolaPelanggaran(); }
          else document.getElementById('pesanPelSS').innerHTML = errBox(res.error);
        });
      };

      function pelSSId(){ var el = document.getElementById('pelSSDipilih'); return el ? el.value : ''; }
      function sedangLihatAktif(){ return pelSSId() === aktifId; }

      function muatRekap(){
        document.getElementById('rekapPoinWrap').innerHTML = 'Memuat...';
        api('getRekapPoinSantri', {pelanggaranSSId: pelSSId()}).then(function(res){
          if(!res.ok){ document.getElementById('rekapPoinWrap').innerHTML = errBox(res.error); return; }
          var d = res.data;
          var html = '<p class="muted">Modal poin: '+d.modal+' | Aktif: '+d.totalAktif+' | Habis: '+d.totalHabis+'</p>';
          if (!d.data.length) { html += '<p class="muted">Belum ada catatan bulan ini.</p>'; }
          else {
            html += '<table><tr><th>NISN</th><th>Nama</th><th>Kelas</th><th>Poin</th><th>Status</th>' + (sedangLihatAktif() ? '<th>Aksi</th>' : '') + '</tr>';
            d.data.sort(function(a,b){ return a.poin-b.poin; }).forEach(function(s){
              html += '<tr><td>'+esc(s.nisn)+'</td><td>'+esc(s.nama)+'</td><td>'+esc(s.kelas)+'</td><td>'+s.poin+'/'+d.modal+'</td>' +
                '<td>'+(s.status==='Habis'?'&#9888;&#65039; Habis':'&#9989; Aktif')+'</td>' +
                (sedangLihatAktif() ? '<td><button class="small btnResetSatu" data-nisn="'+esc(s.nisn)+'">Reset</button></td>' : '') + '</tr>';
            });
            html += '</table>';
          }
          if (sedangLihatAktif()) html += '<button class="small danger" id="btnResetSemuaPoin" style="margin-top:8px">Reset Semua Poin Bulan Ini</button>';
          document.getElementById('rekapPoinWrap').innerHTML = html;
          document.querySelectorAll('.btnResetSatu').forEach(function(btn){
            btn.onclick = function(){ if(!confirm('Reset poin santri ini ke modal awal?')) return; api('resetPoinSatuSantri', {nisn:btn.dataset.nisn}).then(muatRekap); };
          });
          var btnAll = document.getElementById('btnResetSemuaPoin');
          if (btnAll) btnAll.onclick = function(){ if(!confirm('Reset SEMUA poin santri bulan ini ke modal awal?')) return; api('resetSemuaPoinSantri', {}).then(muatRekap); };
        });
      }

      function bukaFormMaster(jenis, existing){
        var fieldsHtml = fieldText('mpNama','Nama '+jenis, existing?existing.nama:'') + fieldText('mpPoin','Poin', existing?String(existing.poin):'');
        openModal(existing?('Edit '+jenis):('Tambah '+jenis), fieldsHtml, function(m){
          api('saveMasterPelPrestasi', {jenis:jenis, rowIndex: existing?existing.rowIndex:0, nama:m.querySelector('#mpNama').value.trim(), poin:m.querySelector('#mpPoin').value.trim()}).then(function(r){
            if(!r.ok) alert(r.error); else muatMaster();
          });
        });
      }
      document.getElementById('btnTambahPel').onclick = function(){ bukaFormMaster('Pelanggaran', null); };
      document.getElementById('btnTambahPres').onclick = function(){ bukaFormMaster('Prestasi', null); };

      function muatMaster(){
        api('getMasterPelanggaran', {pelanggaranSSId: pelSSId()}).then(function(res){
          if(!res.ok){ document.getElementById('listMasterPel').innerHTML = errBox(res.error); return; }
          var html = '<table><tr><th>Nama</th><th>Poin</th>'+(sedangLihatAktif()?'<th>Aksi</th>':'')+'</tr>' +
            res.data.map(function(x){ return '<tr><td>'+esc(x.nama)+'</td><td>-'+x.poin+'</td>' +
              (sedangLihatAktif() ? '<td><button class="small btnEditPel" data-row="'+x.rowIndex+'">Edit</button> <button class="small danger btnHapusPel" data-row="'+x.rowIndex+'">Hapus</button></td>' : '') + '</tr>'; }).join('') + '</table>';
          document.getElementById('listMasterPel').innerHTML = html;
          document.querySelectorAll('.btnEditPel').forEach(function(btn){ btn.onclick = function(){ bukaFormMaster('Pelanggaran', res.data.find(function(x){return x.rowIndex===Number(btn.dataset.row);})); }; });
          document.querySelectorAll('.btnHapusPel').forEach(function(btn){ btn.onclick = function(){ if(!confirm('Hapus?')) return; api('deleteMasterPelPrestasi', {jenis:'Pelanggaran', rowIndex:Number(btn.dataset.row)}).then(muatMaster); }; });
        });
        api('getMasterPrestasi', {pelanggaranSSId: pelSSId()}).then(function(res){
          if(!res.ok){ document.getElementById('listMasterPres').innerHTML = errBox(res.error); return; }
          var html = '<table><tr><th>Nama</th><th>Poin</th>'+(sedangLihatAktif()?'<th>Aksi</th>':'')+'</tr>' +
            res.data.map(function(x){ return '<tr><td>'+esc(x.nama)+'</td><td>+'+x.poin+'</td>' +
              (sedangLihatAktif() ? '<td><button class="small btnEditPres" data-row="'+x.rowIndex+'">Edit</button> <button class="small danger btnHapusPres" data-row="'+x.rowIndex+'">Hapus</button></td>' : '') + '</tr>'; }).join('') + '</table>';
          document.getElementById('listMasterPres').innerHTML = html;
          document.querySelectorAll('.btnEditPres').forEach(function(btn){ btn.onclick = function(){ bukaFormMaster('Prestasi', res.data.find(function(x){return x.rowIndex===Number(btn.dataset.row);})); }; });
          document.querySelectorAll('.btnHapusPres').forEach(function(btn){ btn.onclick = function(){ if(!confirm('Hapus?')) return; api('deleteMasterPelPrestasi', {jenis:'Prestasi', rowIndex:Number(btn.dataset.row)}).then(muatMaster); }; });
        });
      }

      document.getElementById('btnSimpanFonnte').onclick = function(){
        Promise.all([
          api('simpanPengaturan', {key:'FonnteToken', value: document.getElementById('pgFonnteToken').value.trim()}),
          api('simpanPengaturan', {key:'GrupPengajarWA', value: document.getElementById('pgGrupWA').value.trim()}),
          api('simpanPengaturan', {key:'ModalPoinSantri', value: document.getElementById('pgModalPoin').value.trim() || '25'})
        ]).then(function(){ document.getElementById('pesanFonnte').innerHTML = '<p class="muted">Tersimpan.</p>'; });
      };

      muatDaftarSS();
      muatRekap();
      muatMaster();
    });
  }

  function adminArtikel(){
    var c = document.getElementById(STATE._contentId||'da-content');
    c.innerHTML = '<div class="card"><h3>Artikel / Berita</h3>' +
      warnBox('Artikel berstatus "Published" akan tampil di halaman depan (Beranda) untuk umum, termasuk yang belum login. Status "Draft" hanya terlihat di sini.') +
      '<button class="small" id="btnTambahArtikel">+ Tulis Artikel Baru</button><div id="daftarArtikelWrap">Memuat...</div></div>';

    function bukaFormArtikel(existing, muatUlang){
      var fieldsHtml = fieldText('arJudul','Judul', existing?existing.judul:'') +
        fieldSelect('arKategori','Kategori', ['Berita','PPDB','Pengumuman','Kegiatan'], existing?existing.kategori:'Berita') +
        fieldText('arGambar','URL Gambar Sampul (opsional)', existing?existing.gambar:'') +
        '<label>Isi Artikel</label><textarea id="arKonten" rows="8" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:14px">'+esc(existing?existing.konten:'')+'</textarea>' +
        '<div class="grid2">' +
        '<div><label>Tanggal Publish</label><input type="date" id="arTanggal" value="'+(existing?existing.tanggalPublish:todayStr())+'"></div>' +
        '<div><label>Status</label><select id="arStatus"><option value="Draft" '+(!existing||existing.status==='Draft'?'selected':'')+'>Draft</option><option value="Published" '+(existing&&existing.status==='Published'?'selected':'')+'>Published (tampil publik)</option></select></div>' +
        '</div>';
      openModal(existing?'Edit Artikel':'Tulis Artikel Baru', fieldsHtml, function(m){
        var judul = m.querySelector('#arJudul').value.trim();
        if (!judul) { alert('Judul wajib diisi.'); return false; }
        api('saveArtikel', {rowIndex: existing?existing.rowIndex:0, judul:judul, konten:m.querySelector('#arKonten').value,
          gambar:m.querySelector('#arGambar').value.trim(), kategori:m.querySelector('#arKategori').value,
          tanggalPublish:m.querySelector('#arTanggal').value, status:m.querySelector('#arStatus').value, penulis:STATE.user.nama}).then(function(r){
            if(!r.ok) alert(r.error); else muatUlang();
          });
      });
    }
    document.getElementById('btnTambahArtikel').onclick = function(){ bukaFormArtikel(null, muatDaftarArtikel); };
    function muatDaftarArtikel(){
      api('getArtikelList', {}).then(function(res){
        if(!res.ok){ document.getElementById('daftarArtikelWrap').innerHTML = errBox(res.error); return; }
        if(!res.data.length){ document.getElementById('daftarArtikelWrap').innerHTML = '<p class="muted">Belum ada artikel. Klik "+ Tulis Artikel Baru".</p>'; return; }
        var html = '<table><tr><th>Judul</th><th>Kategori</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr>';
        res.data.forEach(function(a){
          html += '<tr><td>'+esc(a.judul)+'</td><td>'+esc(a.kategori)+'</td><td>'+esc(a.tanggalPublish)+'</td>' +
            '<td>'+(a.status==='Published'?'&#9989; Published':'&#9998;&#65039; Draft')+'</td>' +
            '<td><button class="small btnEditArtikel" data-row="'+a.rowIndex+'">Edit</button> <button class="small danger btnHapusArtikel" data-row="'+a.rowIndex+'">Hapus</button></td></tr>';
        });
        html += '</table>';
        document.getElementById('daftarArtikelWrap').innerHTML = html;
        document.querySelectorAll('.btnEditArtikel').forEach(function(btn){
          btn.onclick = function(){ bukaFormArtikel(res.data.find(function(a){return a.rowIndex===Number(btn.dataset.row);}), muatDaftarArtikel); };
        });
        document.querySelectorAll('.btnHapusArtikel').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Hapus artikel ini?')) return; api('deleteArtikel', {rowIndex:Number(btn.dataset.row)}).then(muatDaftarArtikel); };
        });
      });
    }
    muatDaftarArtikel();
  }

  function adminFiturBeranda(){
    var c = document.getElementById(STATE._contentId||'da-content');
    c.innerHTML = '<div class="card"><h3>Program Unggulan &amp; Fasilitas (Halaman Depan)</h3>' +
      warnBox('Tambahkan foto asli supaya halaman depan tampil seperti website sungguhan. Kalau foto tidak diisi, akan tampil ikon polos sebagai gantinya.') +
      '<button class="small" id="btnTambahFitur">+ Tambah Item</button>' +
      '<h4 style="margin-top:16px">Program Unggulan</h4><div id="listFiturProgram">Memuat...</div>' +
      '<h4 style="margin-top:16px">Fasilitas</h4><div id="listFiturFasilitas">Memuat...</div></div>';

    function bukaFormFitur(existing, muatUlang){
      var previewAwal = existing && existing.gambar ? '<img src="'+esc(existing.gambar)+'" style="height:60px;border-radius:6px;margin-top:4px;display:block">' : '';
      var fieldsHtml = fieldSelect('ffKategori','Kategori', ['Program','Fasilitas'], existing?existing.kategori:'Program') +
        fieldText('ffJudul','Judul', existing?existing.judul:'') +
        fieldText('ffDeskripsi','Deskripsi (opsional, untuk Fasilitas boleh dikosongkan)', existing?existing.deskripsi:'') +
        '<label>Foto</label><input type="file" id="ffFile" accept="image/*">' +
        '<p class="muted" style="margin-top:-6px">Pilih foto dari HP/komputer -- otomatis dikecilkan &amp; diunggah.</p>' +
        fieldText('ffGambar','URL Gambar (terisi otomatis setelah unggah, atau isi manual)', existing?existing.gambar:'') +
        '<div id="ffUploadStatus">'+previewAwal+'</div>' +
        fieldText('ffUrutan','Urutan (angka kecil tampil duluan)', existing?String(existing.urutan):'0');
      var modal = openModal(existing?'Edit Item':'Tambah Item', fieldsHtml, function(m){
        var judul = m.querySelector('#ffJudul').value.trim();
        if (!judul) { alert('Judul wajib diisi.'); return false; }
        api('saveFiturBeranda', {rowIndex: existing?existing.rowIndex:0, kategori:m.querySelector('#ffKategori').value,
          judul:judul, deskripsi:m.querySelector('#ffDeskripsi').value.trim(), gambar:m.querySelector('#ffGambar').value.trim(),
          urutan:m.querySelector('#ffUrutan').value.trim()}).then(function(r){
            if(!r.ok) alert(r.error); else muatUlang();
          });
      });
      modal.querySelector('#ffFile').onchange = function(e){
        var file = e.target.files[0];
        if (!file) return;
        var statusEl = modal.querySelector('#ffUploadStatus');
        statusEl.innerHTML = '<p class="muted">Memproses gambar...</p>';
        resizeImageFile(file, 1200, 0.8).then(function(hasil){
          statusEl.innerHTML = '<p class="muted">Mengunggah...</p>';
          api('uploadSlideImage', {base64: hasil.base64, mimeType: hasil.mimeType, fileName: file.name}).then(function(res){
            if(!res.ok){ statusEl.innerHTML = errBox(res.error); return; }
            modal.querySelector('#ffGambar').value = res.url;
            statusEl.innerHTML = '<p class="muted">Berhasil diunggah.</p><img src="'+esc(res.url)+'" style="height:60px;border-radius:6px;margin-top:4px;display:block">';
          });
        }).catch(function(){ statusEl.innerHTML = errBox('Gagal memproses gambar. Coba file lain.'); });
      };
    }
    document.getElementById('btnTambahFitur').onclick = function(){ bukaFormFitur(null, muatDaftarFitur); };

    function muatDaftarFitur(){
      api('getFiturBerandaList', {}).then(function(res){
        if(!res.ok){ document.getElementById('listFiturProgram').innerHTML = errBox(res.error); return; }
        function renderGrup(containerId, list){
          if (!list.length) { document.getElementById(containerId).innerHTML = '<p class="muted">Belum ada.</p>'; return; }
          var html = '<table><tr><th>Foto</th><th>Judul</th><th>Urutan</th><th>Aksi</th></tr>';
          list.forEach(function(f){

  function adminKelompokMapel(){
    var c = document.getElementById(STATE._contentId||'da-content');
    c.innerHTML='<p>Memuat...</p>';
    api('getKelompokMapelList',{}).then(function(res){
      if(!res.ok){c.innerHTML=errBox(res.error);return;}
      var data=res.data||[];

      function render(){
        var html='<div class="card"><h3>&#128204; Kelompok Mata Pelajaran Rapor</h3>'+
          warnBox('Pengelompokan ini menentukan tampilan rapor santri. '+
            'A = Umum, B = Kepesantrenan, C = Muatan Lokal. '+
            'Kode kelompok harus huruf kapital (A, B, atau C).')+
          '<button id="btnTambahKelompok" style="margin-top:8px">+ Tambah Mapel</button>'+
          '<table style="margin-top:10px">'+
          '<tr><th>Nama Mapel</th><th>Kode</th><th>Nama Kelompok</th><th>Urutan</th><th>Aksi</th></tr>'+
          data.map(function(d,i){
            var warna=d.kodeKelompok==='A'?'#dbeafe':d.kodeKelompok==='B'?'#dcfce7':'#fef9c3';
            return '<tr style="background:'+warna+'">'+
              '<td>'+esc(d.namaMapel)+'</td>'+
              '<td style="text-align:center;font-weight:700">'+esc(d.kodeKelompok)+'</td>'+
              '<td>'+esc(d.namaKelompok)+'</td>'+
              '<td style="text-align:center">'+d.urutan+'</td>'+
              '<td style="white-space:nowrap">'+
              '<button class="small btnEditKM" data-idx="'+i+'">Edit</button> '+
              '<button class="small danger btnHapusKM" data-row="'+d.rowIndex+'">Hapus</button>'+
              '</td></tr>';
          }).join('')+'</table></div>';
        c.innerHTML=html;
        bindKelompokEvents();
      }

      function bindKelompokEvents(){
        document.getElementById('btnTambahKelompok').onclick=function(){ bukaFormKelompok(null); };
        c.querySelectorAll('.btnEditKM').forEach(function(btn){
          btn.onclick=function(){ bukaFormKelompok(data[Number(btn.dataset.idx)]); };
        });
        c.querySelectorAll('.btnHapusKM').forEach(function(btn){
          btn.onclick=function(){
            if(!confirm('Hapus mapel ini dari kelompok rapor?'))return;
            api('deleteKelompokMapel',{rowIndex:Number(btn.dataset.row)}).then(function(r){
              if(!r.ok){alert(r.error);return;}
              api('getKelompokMapelList',{}).then(function(r2){data=r2.data||[];render();});
            });
          };
        });
      }

      function bukaFormKelompok(item){
        openModal(item?'Edit Kelompok Mapel':'Tambah Mapel ke Kelompok',
          '<div class="grid2">'+
          '<div><label>Nama Mapel *</label><input id="kmMapel" value="'+esc(item?item.namaMapel:'')+'" placeholder="Bahasa Indonesia"></div>'+
          '<div><label>Kode Kelompok *</label>'+
          '<select id="kmKode">'+
          ['A','B','C'].map(function(k){
            return '<option value="'+k+'"'+(item&&item.kodeKelompok===k?' selected':'')+'>'+k+'</option>';
          }).join('')+
          '</select></div></div>'+
          '<label>Nama Kelompok *</label>'+
          '<input id="kmNamaKelompok" value="'+esc(item?item.namaKelompok:'')+'" placeholder="Mata Pelajaran Umum">'+
          '<label>Urutan (dalam kelompok)</label>'+
          '<input id="kmUrutan" type="number" min="1" value="'+(item?item.urutan:1)+'" style="width:80px">',
          function(modal){
            var payload={
              namaMapel:modal.querySelector('#kmMapel').value.trim(),
              kodeKelompok:modal.querySelector('#kmKode').value,
              namaKelompok:modal.querySelector('#kmNamaKelompok').value.trim(),
              urutan:Number(modal.querySelector('#kmUrutan').value)||1
            };
            if(!payload.namaMapel||!payload.namaKelompok){alert('Isi semua field.');return false;}
            if(item) payload.rowIndex=item.rowIndex;
            return api('saveKelompokMapel',payload).then(function(r){
              if(!r.ok){alert(r.error);return;}
              return api('getKelompokMapelList',{}).then(function(r2){data=r2.data||[];render();});
            });
          });
      }

      render();
    });
  }

  function adminRekapHalaqoh(){
    var c = document.getElementById(STATE._contentId||'da-content');
    var bt = bulanTahunSaatIni();
    var tglMulai = bt.tahun+'-'+String(bt.bulan).padStart(2,'0')+'-01';

    c.innerHTML='<div class="card"><h3>&#127774; Rekap Halaqoh Maghrib</h3>'+
      '<div class="grid2">'+
      '<div><label>Dari Tanggal</label><input type="date" id="arDari" value="'+tglMulai+'"></div>'+
      '<div><label>Sampai Tanggal</label><input type="date" id="arSampai" value="'+todayStr()+'"></div>'+
      '</div>'+
      '<div class="grid2">'+
      '<div><label>Halaqoh (kosong = semua)</label><input id="arHalaqoh" placeholder="Nama halaqoh..."></div>'+
      '<div><label>Gender</label><select id="arGender"><option value="">Semua</option><option value="Putra">Putra</option><option value="Putri">Putri</option></select></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button id="btnCariAR">Tampilkan Rekap</button>'+
      '<button class="secondary" id="btnCetakAR">&#128424; Cetak</button>'+
      '<button class="secondary" id="btnExcelAR">&#128196; Unduh Excel</button>'+
      '</div></div>'+
      '<div id="arSemuaHalaqoh" style="margin-top:10px"></div>'+
      '<div id="arDetailContent" style="margin-top:10px"></div>';

    function muat(){
      var dari = document.getElementById('arDari').value;
      var sampai = document.getElementById('arSampai').value;
      var halaqoh = document.getElementById('arHalaqoh').value.trim();
      var gender = document.getElementById('arGender').value;

      if (halaqoh) {
        // Tampilkan rekap halaqoh spesifik
        document.getElementById('arDetailContent').innerHTML='<p>Memuat...</p>';
        document.getElementById('arSemuaHalaqoh').innerHTML='';
        api('getRekapAbsensiHalaqoh',{namaHalaqoh:halaqoh, waktuHalaqoh:'Maghrib', tglMulai:dari, tglAkhir:sampai, gender:gender}).then(function(r){
          if(!r.ok){ document.getElementById('arDetailContent').innerHTML=errBox(r.error); return; }
          tampilkanRekapHalaqoh(r.data, document.getElementById('arDetailContent'));
          document.getElementById('btnCetakAR').onclick=function(){ cetakRekapHalaqoh(r.data); };
          document.getElementById('btnExcelAR').onclick=function(){ unduhExcelRekap(r.data); };
        });
      } else {
        // Tampilkan ringkasan semua halaqoh
        document.getElementById('arSemuaHalaqoh').innerHTML='<p>Memuat semua halaqoh...</p>';
        document.getElementById('arDetailContent').innerHTML='';
        api('getRekapSemuaHalaqoh',{waktuHalaqoh:'Maghrib', tglMulai:dari, tglAkhir:sampai}).then(function(r){
          if(!r.ok){ document.getElementById('arSemuaHalaqoh').innerHTML=errBox(r.error); return; }
          if(!r.data.length){ document.getElementById('arSemuaHalaqoh').innerHTML='<div class="card"><p class="muted">Belum ada data absensi halaqoh pada periode ini.</p></div>'; return; }
          document.getElementById('arSemuaHalaqoh').innerHTML=
            '<div class="card"><h4>Ringkasan Semua Halaqoh</h4>'+
            warnBox('Klik nama halaqoh untuk lihat detail per santri.')+
            '<table><tr><th>Nama Halaqoh</th><th>Pengampu</th><th>Gender</th><th>Total Sesi</th><th>Santri</th><th>Rata % Hadir</th></tr>'+
            r.data.map(function(h){
              var w=h.rataHadir>=75?'#16a34a':'#dc2626';

          '<button id="btnUploadMA" style="margin-top:10px">&#128640; Upload Semua File ke Kelas Terpilih</button>' +
          '<div id="maProgressWrap" style="display:none;margin-top:10px">' +
          '<div style="background:#e2e8f0;border-radius:8px;height:12px"><div id="maProgressBar" style="background:#0d9488;width:0%;height:100%;border-radius:8px;transition:width .3s"></div></div>' +
          '<p id="maProgressText" class="muted" style="font-size:12px;margin-top:4px"></p>' +
          '</div></div>' +

          '<div class="card"><h3>Daftar File Modul Ajar</h3>' +
          '<div style="display:flex;gap:8px;margin-bottom:10px">' +
          '<input id="maFilterMapel" placeholder="Filter mapel..." style="flex:1">' +
          '<input id="maFilterKelas" placeholder="Filter kelas..." style="flex:1">' +
          '</div>' +
          '<div id="maDaftarWrap">' +
          (resMA.ok && resMA.data.length ?

            resMA.data.map(function(m){
              return '<tr class="maRow" data-mapel="'+esc(m.mapel.toLowerCase())+'" data-kelas="'+esc(m.kelas.toLowerCase())+'">'+
                '<td>'+esc(m.mapel)+'</td><td>'+esc(m.kelas)+'</td>' +
                '<td>'+esc(m.namaFile)+'</td><td>'+esc(m.kategori)+'</td>' +
                '<td style="font-size:12px">'+(m.ringkasanAI?'&#10004; Ada':'<span class="muted">-</span>')+'</td>' +
                '<td style="white-space:nowrap">'+
                '<button class="small btnLihatMA" data-row="'+m.rowIndex+'">Lihat</button> '+
                '<button class="small danger btnHapusMA" data-row="'+m.rowIndex+'">Hapus</button></td></tr>';
            }).join('') + '</table>'
            : '<p class="muted">Belum ada file modul ajar.</p>') +
          '</div></div>' +

          '<div class="card"><h3>RPP Pertemuan</h3>' +
          '<button class="small" id="btnTambahRPP">+ Tambah Pertemuan</button>' +
          (resRPP.ok && resRPP.data.length ?
            '<table style="margin-top:10px"><tr><th>Mapel</th><th>Kelas</th><th>Pertemuan</th><th>Topik</th><th>JP</th><th>Aksi</th></tr>' +
            resRPP.data.map(function(r){
              return '<tr><td>'+esc(r.mapel)+'</td><td>'+esc(r.kelas)+'</td><td>'+r.noPertemuan+'</td>'+
                '<td>'+esc(r.topik)+'</td><td>'+r.alokasiJP+'</td>' +
                '<td><button class="small btnEditRPP" data-row="'+r.rowIndex+'">Edit</button> '+
                '<button class="small danger btnHapusRPP" data-row="'+r.rowIndex+'">Hapus</button></td></tr>';

            : '<p class="muted">Belum ada RPP pertemuan.</p>') + '</div>';

        document.getElementById('maKelas').oninput = function(){

          document.getElementById('maKelasPreview').innerHTML = kelasList.map(function(k){
            return '<span style="background:#0d9488;color:#fff;border-radius:12px;padding:3px 10px;font-size:12px">'+esc(k)+'</span>';
          }).join('');
        };

        // Preview file yang dipilih
        document.getElementById('maFiles').onchange = function(){
          var files = Array.from(this.files);
          document.getElementById('maFileList').innerHTML = files.length ?
            '<div style="background:#f8fafc;border-radius:8px;padding:10px;font-size:13px">'+
            '<b>'+files.length+' file dipilih:</b><ul style="margin:6px 0 0 16px;padding:0">'+
            files.map(function(f){ return '<li>'+esc(f.name)+' <span class="muted">('+Math.round(f.size/1024)+'KB)</span></li>'; }).join('')+
            '</ul></div>' : '';
        };

        // Upload batch
        document.getElementById('btnUploadMA').onclick = function(){
          var files = Array.from(document.getElementById('maFiles').files);
          var mapel = document.getElementById('maMapel').value.trim();
          var kelasList = document.getElementById('maKelas').value.split(',').map(function(k){return k.trim();}).filter(Boolean);
          var kurikulum = document.getElementById('maKurikulum').value;
          var kategoriGlobal = document.getElementById('maKategori').value.trim();

          if (!files.length){ alert('Pilih minimal satu file.'); return; }
          if (!mapel){ alert('Isi Mata Pelajaran terlebih dahulu.'); return; }
          if (!kelasList.length){ alert('Isi Kelas Tujuan terlebih dahulu.'); return; }

          var btn = document.getElementById('btnUploadMA');
          btn.disabled = true;
          document.getElementById('maProgressWrap').style.display = 'block';

          var totalPekerjaan = files.length * kelasList.length;
          var selesai = 0;

          function updateProgress(pesan){
            selesai++;
            var pct = Math.round(selesai/totalPekerjaan*100);
            document.getElementById('maProgressBar').style.width = pct+'%';
            document.getElementById('maProgressText').textContent = pesan+' ('+selesai+'/'+totalPekerjaan+')';
          }

          // Proses file satu per satu secara berurutan
          function prosesFile(fileIdx){
            if (fileIdx >= files.length){
              btn.disabled = false;
              document.getElementById('maUploadStatus').innerHTML =
                '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:8px">'+
                '&#10004; Semua file berhasil diupload ke '+kelasList.length+' kelas!<br>'+
                '<span class="muted" style="font-size:12.5px">Total: '+files.length+' file × '+kelasList.length+' kelas = '+totalPekerjaan+' entri. Ringkasan AI sedang diproses di server.</span></div>';
              muat();
              return;
            }
            var file = files[fileIdx];
            var namaFile = file.name.replace(/\.[^.]+$/, ''); // Hapus ekstensi
            var kategori = kategoriGlobal || namaFile;

            // Baca file sebagai base64
            var reader = new FileReader();
            reader.onload = function(e){
              var base64 = e.target.result.split(',')[1];
              var mimeType = file.type || 'application/octet-stream';

              // Upload ke Drive sekali
              api('uploadFileKeDrive', {base64:base64, mimeType:mimeType, fileName:file.name}).then(function(resUp){
                if (!resUp.ok){
                  document.getElementById('maUploadStatus').innerHTML = errBox('Gagal upload '+file.name+': '+(resUp.error||'error'));
                  btn.disabled = false;
                  return;
                }
                var fileId = (resUp.url||'').match(/\/d\/([\w-]+)/);
                fileId = fileId ? fileId[1] : '';
                var urlAsli = resUp.url || '';

                // Daftarkan ke setiap kelas
                var promsKelas = kelasList.map(function(kelas){
                  return api('saveModulAjar',{
                    mapel:mapel, kelas:kelas, kurikulum:kurikulum,
                    kategori:kategori, namaFile:namaFile+' - '+kelas,
                    urlAsli:urlAsli, diuploadOleh:STATE.user.nama
                  }).then(function(resSave){
                    updateProgress('Mendaftarkan '+namaFile+' → Kelas '+kelas);
                    // Proses ringkasan AI (tidak tunggu selesai)
                    if (fileId && resSave.ok) {
                      api('prosesTeksModulAjar',{rowIndex:resSave.rowIndex, fileId:fileId}).catch(function(){});
                    }
                  });
                });

                Promise.all(promsKelas).then(function(){
                  prosesFile(fileIdx + 1);
                });
              });
            };
            reader.readAsDataURL(file);
          }

          prosesFile(0);
        };

        // Filter tabel modul ajar
        function filterMA(){
          var q1 = document.getElementById('maFilterMapel').value.toLowerCase();
          var q2 = document.getElementById('maFilterKelas').value.toLowerCase();
          document.querySelectorAll('.maRow').forEach(function(row){
            var ok = (!q1 || row.dataset.mapel.includes(q1)) && (!q2 || row.dataset.kelas.includes(q2));
            row.style.display = ok ? '' : 'none';
          });
        }
        document.getElementById('maFilterMapel').oninput = filterMA;
        document.getElementById('maFilterKelas').oninput = filterMA;

        // Tombol Lihat dan Hapus
        if (resMA.ok){
          document.querySelectorAll('.btnLihatMA').forEach(function(btn){
            var ma = resMA.data.find(function(m){return m.rowIndex===Number(btn.dataset.row);});
            btn.onclick = function(){ if(ma) tampilkanModulAjar(ma); };
          });
          document.querySelectorAll('.btnHapusMA').forEach(function(btn){
            btn.onclick = function(){
              if(!confirm('Hapus file ini?')) return;
              api('deleteModulAjar',{rowIndex:Number(btn.dataset.row)}).then(muat);
            };
          });
        }

        document.getElementById('btnTambahRPP').onclick = function(){ bukaFormRPP(null, resRPP.ok?resRPP.data:[], muat); };
        if (resRPP.ok){
          document.querySelectorAll('.btnEditRPP').forEach(function(btn){
            btn.onclick = function(){ bukaFormRPP(resRPP.data.find(function(r){return r.rowIndex===Number(btn.dataset.row);}), resRPP.data, muat); };
          });
          document.querySelectorAll('.btnHapusRPP').forEach(function(btn){
            btn.onclick = function(){ if(!confirm('Hapus pertemuan ini?')) return; api('deleteRPP',{rowIndex:Number(btn.dataset.row)}).then(muat); };
          });
        }
      });
    }
    muat();
  }

<script>
  // ============ PWA: daftarkan service worker ============
  // Dibungkus try/catch + .catch() supaya kalau gagal (misal dibuka lewat pratinjau
  // file yang bukan hosting asli/production), aplikasi tetap jalan normal -- cuma
  // fitur offline-nya saja yang tidak aktif di konteks itu, bukan error yang mengganggu.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      try {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {

          // Cek kalau ada SW baru yang menunggu (misal user buka tab lama setelah deploy)
          if (reg.waiting) {
            tampilkanNotifUpdate(reg.waiting);
          }

          // SW baru ditemukan — menunggu untuk aktif
          reg.addEventListener('updatefound', function() {
            var swBaru = reg.installing;
            if (!swBaru) return;
            swBaru.addEventListener('statechange', function() {
              if (swBaru.state === 'installed' && navigator.serviceWorker.controller) {
                tampilkanNotifUpdate(swBaru);
              }
            });
          });

        }).catch(function(err) {
          console.warn('Service worker tidak aktif:', err.message || err);
        });

        // Terima pesan dari SW (misal: SW_UPDATED setelah activate)
        navigator.serviceWorker.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'SW_UPDATED') {
            tampilkanNotifUpdate(null); // sudah aktif, langsung minta reload
          }
        });

        // Kalau SW controller berubah (versi baru aktif) → reload otomatis
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) { refreshing = true; window.location.reload(); }
        });

      } catch (err) { /* bukan fitur wajib */ }
    });
  }

  // Tampilkan banner di atas halaman: "Versi baru tersedia — Perbarui Sekarang"
  function tampilkanNotifUpdate(swMenunggu) {
    // Jangan tampilkan dua kali
    if (document.getElementById('bannerUpdate')) return;
    var banner = document.createElement('div');
    banner.id = 'bannerUpdate';
    banner.style.cssText = [
      'position:fixed;top:0;left:0;right:0;z-index:99999',
      'background:#0d9488;color:#fff',
      'padding:10px 16px',
      'display:flex;align-items:center;justify-content:space-between',
      'font-family:\'Segoe UI\',Arial,sans-serif;font-size:13px;font-weight:500',
      'box-shadow:0 2px 8px rgba(0,0,0,.25)'
    ].join(';');
    banner.innerHTML =
      '<span>&#127381; Versi baru WASIAT tersedia!</span>' +
      '<div style="display:flex;gap:8px">' +
      '<button id="btnUpdateSekarang" style="background:#fff;color:#0d9488;border:none;padding:5px 12px;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px">Perbarui Sekarang</button>' +
      '<button id="btnTutupBannerUpdate" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px">Nanti</button>' +
      '</div>';
    document.body.prepend(banner);

    document.getElementById('btnUpdateSekarang').onclick = function() {
      if (swMenunggu) {
        // Perintahkan SW yang menunggu untuk langsung aktif
        swMenunggu.postMessage({ type: 'SKIP_WAITING' });
        // controllerchange event akan reload otomatis
      } else {
        window.location.reload();
      }
    };
    document.getElementById('btnTutupBannerUpdate').onclick = function() {
      banner.remove();
    };
  }

  // ============ PWA: tombol Install ============
  // Sinyal "beforeinstallprompt" dari browser TIDAK SELALU bisa diandalkan untuk
  // MENAMPILKAN tombol (kadang lambat/tidak muncul walau aplikasinya sebenarnya
  // sudah siap diinstal). Jadi sekarang tombol TAMPIL DEFAULT, dan HANYA
  // disembunyikan kalau ada sinyal yang PASTI aplikasi memang sudah terpasang:
  // - sedang berjalan dalam mode standalone (dibuka dari ikon Layar Utama), atau
  // - event "appinstalled" baru saja terjadi (baru selesai diinstal).
  var _deferredInstallPrompt = null;
  var _isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  var _sudahStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function _tampilkanTombolInstall(){
    var btn = document.getElementById('btnInstallPWA');
    if (!btn || _sudahStandalone) return;
    btn.style.display = 'block';
  }
  function _sembunyikanTombolInstall(){
    var btn = document.getElementById('btnInstallPWA');
    if (btn) btn.style.display = 'none';
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    _deferredInstallPrompt = e; // simpan supaya tombol bisa pakai prompt instal ASLI bawaan browser
  });
  window.addEventListener('appinstalled', function(){
    _sudahStandalone = true;
    _deferredInstallPrompt = null;
    _sembunyikanTombolInstall();
  });

  document.getElementById('btnInstallPWA').addEventListener('click', function(){
    if (_deferredInstallPrompt) {
      _deferredInstallPrompt.prompt();
      _deferredInstallPrompt.userChoice.then(function(res){
        _deferredInstallPrompt = null;
        if (res && res.outcome === 'accepted') _sembunyikanTombolInstall();
      });
      return;
    }
    if (_isIOS) {
      alert('Cara install di iPhone/iPad:\n\n1. Tap ikon Share/Bagikan (kotak dengan panah ke atas) di bagian bawah layar Safari.\n2. Pilih "Add to Home Screen" / "Tambah ke Layar Utama".\n3. Tap "Add" / "Tambah" di pojok kanan atas.\n\nIkon WASIAT akan muncul di layar utama HP Anda seperti aplikasi biasa.');
      return;
    }
    alert('Cara install aplikasi ini:\n\nDi Android (Chrome): tap menu titik tiga (\u22EE) di pojok kanan atas browser, lalu pilih "Install app" atau "Tambah ke layar Utama".\n\nDi komputer (Chrome/Edge): cari ikon install (gambar layar dengan panah, atau tanda +) di sebelah kanan kolom alamat browser, lalu klik.\n\nKalau tidak menemukan opsi ini dalam beberapa detik, coba muat ulang halaman ini sekali.');
  });

  // Tampilkan default. Kalau ternyata sedang berjalan sebagai app terpasang
  // (standalone), _tampilkanTombolInstall() otomatis tidak melakukan apa-apa.
  _tampilkanTombolInstall();
</script>
</body>
</html>
