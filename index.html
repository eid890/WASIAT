  // ============================================================
  // ABSENSI HARIAN PEMBINA
  // (Menggantikan sistem absen halaqoh Maghrib lama untuk Pembina)
  // ============================================================
  function pembinaAbsenHarian(gender){
    var c = getContentEl();
    var labelGender = gender === 'Putra' ? '👦 Santri Putra' : gender === 'Putri' ? '👧 Santri Putri' : 'Semua Santri';
    c.innerHTML = '<div id="pbStatusPondok"></div>' +
      '<div class="card"><h3>📋 Absen Harian — '+labelGender+'</h3>' +
      '<div class="grid2" style="margin-bottom:12px">' +
      '<div><label>Tanggal</label><input type="date" id="pbTanggal" value="'+todayStr()+'"></div>' +
      '<div><label>Sesi</label><select id="pbSesi"><option>Harian</option><option>Pagi</option><option>Siang</option><option>Malam</option></select></div>' +
      '</div>' +
      '<button id="btnPbTampilkan">Tampilkan Santri</button>' +
      '<div id="pbFormAbsen" style="margin-top:14px"></div></div>';

    // Tampilkan status pondok segera
    widgetStatusPondok('pbStatusPondok', gender);

    document.getElementById('btnPbTampilkan').onclick = function(){
      widgetStatusPondok('pbStatusPondok', gender); // refresh status
      var btn = this;
      var tanggal = document.getElementById('pbTanggal').value;
      var sesi = document.getElementById('pbSesi').value;
      if (!tanggal) { alert('Pilih tanggal terlebih dahulu.'); return; }
      loadingBtn(btn, 'Memuat...');
      api('getSantriHarian', {gender: gender, sesi: sesi}).then(function(res){
        resetBtn(btn, 'Tampilkan Santri');
        if (!res.ok) { document.getElementById('pbFormAbsen').innerHTML = errBox(res.error); return; }
        if (!res.data.length) {
          document.getElementById('pbFormAbsen').innerHTML = warnBox('Tidak ada santri '+labelGender+' ditemukan.');
          return;
        }

        var sudah = res.sudahAbsen || {};
        var html = '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
          '<b>'+res.data.length+' Santri '+labelGender+'</b>' +
          '<div style="display:flex;gap:6px">' +
          '<button id="btnPbHadirSemua" class="secondary small">✅ Hadir Semua</button>' +
          '</div></div>' +
          '<div style="overflow-x:auto"><table style="width:100%;font-size:13px;border-collapse:collapse">' +
          '<thead><tr style="background:#f1f5f9">' +
          '<th style="padding:8px;text-align:left">No</th>' +
          '<th style="padding:8px;text-align:left">Nama Santri</th>' +
          '<th style="padding:8px;text-align:left">Kelas</th>' +
          '<th style="padding:8px;text-align:center">Status</th>' +
          '<th style="padding:8px;text-align:left">Keterangan</th>' +
          '</tr></thead><tbody>';

        res.data.forEach(function(s, i){
          var statusAwal = (sudah[s.nisn] && sudah[s.nisn].status) || 'Hadir';
          var ketAwal = (sudah[s.nisn] && sudah[s.nisn].ket) || '';
          var rowBg = i%2===0 ? '#fff' : '#f8fafc';
          html += '<tr style="background:'+rowBg+'" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'" data-kelas="'+esc(s.kelas)+'" data-nowa="'+esc(s.noWa)+'">' +
            '<td style="padding:7px 8px;color:#94a3b8">'+(i+1)+'</td>' +
            '<td style="padding:7px 8px;font-weight:600">'+esc(s.nama)+'</td>' +
            '<td style="padding:7px 8px;color:#64748b">'+esc(s.kelas)+'</td>' +
            '<td style="padding:7px 8px;text-align:center">' +
            '<select class="pbStatus" style="padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;width:90px">' +
            ['Hadir','Sakit','Izin','Izin Pulang','Alpa'].map(function(st){
              return '<option value="'+st+'"'+(st===statusAwal?' selected':'')+'>'+st+'</option>';
            }).join('') +
            '</select></td>' +
            '<td style="padding:7px 8px">' +
            '<input class="pbKet" value="'+esc(ketAwal)+'" placeholder="Ket. (opsional)" style="width:100%;padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px"></td>' +
            '</tr>';
        });

        html += '</tbody></table></div>' +
          '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button id="btnPbSimpan">💾 Simpan Absensi</button>' +
          '<button class="secondary" id="btnPbBatal">Batal</button>' +
          '</div><div id="pbPesan" style="margin-top:8px"></div></div>';

        document.getElementById('pbFormAbsen').innerHTML = html;

        // Hadir semua
        document.getElementById('btnPbHadirSemua').onclick = function(){
          document.querySelectorAll('.pbStatus').forEach(function(s){ s.value = 'Hadir'; });
        };

        document.getElementById('btnPbBatal').onclick = function(){
          document.getElementById('pbFormAbsen').innerHTML = '';
        };

        // Simpan absensi
        document.getElementById('btnPbSimpan').onclick = function(){
          var btn = this;
          var items = [];
          document.querySelectorAll('#pbFormAbsen tbody tr').forEach(function(row){
            items.push({
              nisn: row.dataset.nisn,
              nama: row.dataset.nama,
              kelas: row.dataset.kelas,
              noWa: row.dataset.nowa,
              status: row.querySelector('.pbStatus').value,
              keterangan: row.querySelector('.pbKet').value,
            });
          });
          loadingBtn(btn, 'Menyimpan...');
          document.getElementById('pbPesan').innerHTML = '';
          api('submitAbsensiHarian', {
            items: items,
            tanggal: tanggal,
            sesi: sesi,
            gender: gender,
            dicatatOleh: STATE.user.nama,
          }).then(function(r){
            resetBtn(btn, '💾 Simpan Absensi');
            if (!r.ok) { document.getElementById('pbPesan').innerHTML = errBox(r.error); return; }
            document.getElementById('pbPesan').innerHTML =
              '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;color:#16a34a;font-weight:600">' +
              '✅ Absensi tersimpan! Total: '+r.total+' santri' +
              (r.tidakHadir > 0 ? ', WA terkirim ke '+r.tidakHadir+' ortu (Alpa).' : '.') +
              '</div>';
          }).catch(function(){ resetBtn(btn, '💾 Simpan Absensi'); });
        };
      });
    };
  }

  // Rekap kehadiran harian
  function pembinaRekapHarian(gender){
    var c = getContentEl();
    var labelGender = gender === 'Putra' ? '👦 Putra' : gender === 'Putri' ? '👧 Putri' : 'Semua';
    c.innerHTML = '<div class="card"><h3>📊 Rekap Kehadiran Harian — '+labelGender+'</h3>' +
      '<div class="grid2" style="margin-bottom:12px">' +
      '<div><label>Dari Tanggal</label><input type="date" id="pbRDari"></div>' +
      '<div><label>Sampai Tanggal</label><input type="date" id="pbRSampai" value="'+todayStr()+'"></div>' +
      '</div>' +
      '<button id="btnPbRMuat">Tampilkan Rekap</button>' +
      '<div id="pbRekapWrap" style="margin-top:14px"></div></div>';

    document.getElementById('btnPbRMuat').onclick = function(){
      var btn = this;
      var dari = document.getElementById('pbRDari').value;
      var sampai = document.getElementById('pbRSampai').value;
      loadingBtn(btn, 'Memuat...');
      api('getRekapAbsensiHarian', {gender:gender, tglMulai:dari, tglAkhir:sampai}).then(function(res){
        resetBtn(btn, 'Tampilkan Rekap');
        if (!res.ok) { document.getElementById('pbRekapWrap').innerHTML = errBox(res.error); return; }
        if (!res.data.length) {
          document.getElementById('pbRekapWrap').innerHTML = warnBox('Belum ada data absensi harian untuk periode ini.');
          return;
        }

        var html = '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
          '<b>'+res.data.length+' Santri | Total '+res.totalHari+' Hari</b>' +
          '<button id="btnPbExcelRekap" class="secondary small">📄 Export Excel</button>' +
          '</div>' +
          '<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse">' +
          '<thead><tr style="background:#1e40af;color:#fff">' +
          '<th style="padding:8px">No</th><th style="padding:8px;text-align:left">Nama</th>' +
          '<th style="padding:8px">Kelas</th><th style="padding:8px">Hadir</th>' +
          '<th style="padding:8px">Sakit</th><th style="padding:8px">Izin</th>' +
          '<th style="padding:8px">Alpa</th><th style="padding:8px">%Hadir</th>' +
          '</tr></thead><tbody>';

        res.data.forEach(function(s, i){
          var warna = s.persen >= 80 ? '#f0fdf4' : s.persen >= 60 ? '#fefce8' : '#fef2f2';
          var warnaP = s.persen >= 80 ? '#16a34a' : s.persen >= 60 ? '#ca8a04' : '#dc2626';
          html += '<tr style="background:'+(i%2===0?'#fff':'#f8fafc')+'">' +
            '<td style="padding:6px 8px;text-align:center;color:#94a3b8">'+(i+1)+'</td>' +
            '<td style="padding:6px 8px;font-weight:600">'+esc(s.nama)+'</td>' +
            '<td style="padding:6px 8px;text-align:center;color:#64748b">'+esc(s.kelas)+'</td>' +
            '<td style="padding:6px 8px;text-align:center;color:#16a34a;font-weight:700">'+s.hadir+'</td>' +
            '<td style="padding:6px 8px;text-align:center;color:#d97706">'+s.sakit+'</td>' +
            '<td style="padding:6px 8px;text-align:center;color:#2563eb">'+s.izin+'</td>' +
            '<td style="padding:6px 8px;text-align:center;color:#dc2626;font-weight:700">'+s.alpa+'</td>' +
            '<td style="padding:6px 8px;text-align:center;font-weight:700;color:'+warnaP+';background:'+warna+'">'+s.persen+'%</td>' +
            '</tr>';
        });

        html += '</tbody></table></div></div>';
        document.getElementById('pbRekapWrap').innerHTML = html;

        // Export Excel
        document.getElementById('btnPbExcelRekap').onclick = function(){
          var bom = '\uFEFF';
          var header = ['No','Nama Santri','Kelas','Hadir','Sakit','Izin','Izin Pulang','Alpa','% Hadir'];
          var rows = res.data.map(function(s,i){
            return [i+1, s.nama, s.kelas, s.hadir, s.sakit, s.izin, s.alpa, s.persen+'%'];
          });
          var csv = bom + [header].concat(rows).map(function(r){
            return r.map(function(v){ var s=String(v||''); return s.includes(',')?'"'+s+'"':s; }).join(',');
          }).join('\n');
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
          a.download = 'Rekap_Kehadiran_'+labelGender.replace(/[^a-zA-Z]/g,'_')+'.csv';
          a.click();
        };
      });
    };
  }

  // Widget status pondok -- tampil di dashboard Pembina, Admin, Mudir
  function widgetStatusPondok(containerId, gender){
    var c = document.getElementById(containerId);
    if (!c) return;
    c.innerHTML = '<div style="background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:12px">' +
      '<div style="display:flex;align-items:center;gap:6px;color:#64748b;font-size:12px;margin-bottom:8px">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1.5s linear infinite"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' +
      'Memuat status pondok...</div></div>';

    api('getStatusPondok', {gender: gender||''}).then(function(res){
      if (!res.ok) { c.innerHTML = ''; return; }

      var tglLabel = res.hariIni ? 'Hari ini' : res.tanggal;
      var diPondok = gender==='Putra' ? res.putra.diPondok : gender==='Putri' ? res.putri.diPondok : res.diPondok;
      var izinPulang = gender==='Putra' ? res.putra.izinPulang : gender==='Putri' ? res.putri.izinPulang : res.izinPulang;
      var total = gender==='Putra' ? res.putra.total : gender==='Putri' ? res.putri.total : res.total;
      var labelG = gender==='Putra'?'Putra':gender==='Putri'?'Putri':'Santri';

      var html = '<div style="background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:14px;padding:16px;margin-bottom:12px;color:#fff">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">' +
        '<div>' +
        '<div style="font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.5px">🏡 Status Pondok · '+labelG+'</div>' +
        '<div style="font-size:11px;opacity:.55;margin-top:2px">'+tglLabel+(res.hariIni?'':' (terakhir)')+'</div>' +
        '</div>' +
        (res.sudahAbsen
          ? '<div style="background:rgba(34,197,94,.2);color:#4ade80;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600">● Absen tercatat</div>'
          : '<div style="background:rgba(239,68,68,.2);color:#f87171;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600">● Belum absen hari ini</div>') +
        '</div>' +

        // Angka utama
        '<div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap">' +
        _kartuStatus('🏠 Di Pondok', diPondok, total, '#22c55e', 'rgba(34,197,94,.15)') +
        _kartuStatus('🚪 Izin Pulang', izinPulang, total, '#fb923c', 'rgba(251,146,60,.15)') +
        '</div>' +

        // Detail per status (hanya kalau semua gender atau tidak difilter)
        (!gender && res.sudahAbsen ? (
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' +
          _pil('✅ Hadir', res.hadir, '#4ade80') +
          _pil('🤒 Sakit', res.sakit, '#fb923c') +
          _pil('📝 Izin', res.izin, '#60a5fa') +
          _pil('❌ Alpa', res.alpa, '#f87171') +
          '</div>'
        ) : '') +

        // Breakdown putra/putri (untuk admin/mudir)
        (!gender ? (
          '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">' +
          '<div style="flex:1;background:rgba(255,255,255,.07);border-radius:8px;padding:8px 10px;min-width:100px">' +
          '<div style="font-size:10px;opacity:.6">👦 Putra</div>' +
          '<div style="font-size:18px;font-weight:700;color:#4ade80">'+res.putra.diPondok+'</div>' +
          '<div style="font-size:10px;opacity:.5">dari '+res.putra.total+' · izin: '+res.putra.izinPulang+'</div>' +
          '</div>' +
          '<div style="flex:1;background:rgba(255,255,255,.07);border-radius:8px;padding:8px 10px;min-width:100px">' +
          '<div style="font-size:10px;opacity:.6">👧 Putri</div>' +
          '<div style="font-size:18px;font-weight:700;color:#f472b6">'+res.putri.diPondok+'</div>' +
          '<div style="font-size:10px;opacity:.5">dari '+res.putri.total+' · izin: '+res.putri.izinPulang+'</div>' +
          '</div></div>'
        ) : '') +

        // Daftar santri yang izin pulang
        (izinPulang > 0 ? (
          '<div style="margin-top:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:8px">' +
          '<div style="font-size:11px;opacity:.7;margin-bottom:6px">🚪 Sedang Izin Pulang'+
          (res.sumberIzinPulang ? ' (Pembina: '+res.sumberIzinPulang.pembina+' · Mapel: '+res.sumberIzinPulang.mapel+' · Halaqoh: '+res.sumberIzinPulang.halaqoh+')' : '')+
          ':</div>' +
          res.izinPulangList.filter(function(s){
            return !gender || s.jk===gender;
          }).map(function(s){
            var sBadge = s.sumber==='Guru Mapel'?'📖':s.sumber==='Guru Halaqoh'?'📿':'👨‍🏫';
            return '<div style="font-size:12px;background:rgba(255,255,255,.07);border-radius:6px;padding:4px 8px;margin-bottom:4px">'+

              '</div>';
          }).join('') +
          '</div>'
        ) : '') +

        '</div>';

      c.innerHTML = html;
    }).catch(function(){ c.innerHTML = ''; });
  }

  function _kartuStatus(label, angka, total, warna, bg){
    var persen = total>0 ? Math.round((angka/total)*100) : 0;
    return '<div style="flex:1;background:'+bg+';border-radius:10px;padding:10px 12px;min-width:90px">' +
      '<div style="font-size:11px;opacity:.7">'+label+'</div>' +
      '<div style="font-size:26px;font-weight:700;color:'+warna+'">'+angka+'</div>' +
      '<div style="font-size:10px;opacity:.55">dari '+total+' ('+persen+'%)</div>' +
      '</div>';
  }
  function _pil(label, angka, warna){
    return '<div style="background:rgba(255,255,255,.07);border-radius:6px;padding:4px 10px;font-size:12px;color:'+warna+'">'+label+' <b>'+angka+'</b></div>';
  }

  // ---- Helper: tampilkan rekap (dipakai Pembina dan Admin) ----
  function tampilkanRekapHalaqoh(d, container){
    if (!d || !d.santri || !d.santri.length){
      container.innerHTML='<div class="card"><p class="muted">Belum ada data absensi halaqoh pada periode ini.</p></div>';
      return;
    }
    var rataHadir = Math.round(d.santri.reduce(function(s,x){return s+x.persenHadir;},0)/d.santri.length);

  // ---- Unduh Excel Rekap (CSV yang bisa dibuka Excel) ----
  function unduhExcelRekap(d){
    var bom = '\uFEFF'; // BOM untuk Excel mengenali UTF-8
    var baris = [['No','Nama Santri','Hadir','Sakit','Izin','Izin Pulang','Alpa','% Hadir','Keterangan']];
    d.santri.forEach(function(s,i){
      var ket = s.persenHadir<75?'Perlu perhatian':s.persenHadir>=90?'Sangat baik':'Baik';
      baris.push([i+1, s.nama, s.hadir, s.sakit, s.izin, s.alpa, s.persenHadir+'%', ket]);
    });
    baris.push([]);
    baris.push(['Halaqoh', d.namaHalaqoh, '', 'Total Sesi', d.totalSesi]);
    baris.push(['Dicetak', new Date().toLocaleDateString('id-ID'), '', 'Pengampu', STATE.user.nama]);

    var csv = bom + baris.map(function(r){
      return r.map(function(v){
        var s = String(v==null?'':v);
        if (s.includes(',') || s.includes('"') || s.includes('\n')) s = '"'+s.replace(/"/g,'""')+'"';
        return s;
      }).join(',');
    }).join('\n');

    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Rekap_Halaqoh_'+d.namaHalaqoh.replace(/\s+/g,'_')+'_'+todayStr()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

          '<div id="logoTopWali"></div>' +

      if (r.ok && r.data.LogoUrl) {
        var el = document.getElementById('logoTopWali');
        if (el) el.innerHTML = '<img src="'+esc(r.data.LogoUrl)+'" style="height:28px;width:28px;object-fit:contain;border-radius:4px">';
      }
    });

    // Slideshow di bawah topbar (wadah terpisah agar tidak menimpa tombol Keluar)
    renderSlideBar('dw-slide');

    // Tab pilih anak
    if (listAnak.length > 1) {
      api('getMasterData', {sheet:'Santri'}).then(function(resNama){
        var namaMap = {};
        if (resNama.ok) resNama.data.data.forEach(function(s){ namaMap[String(s.NISN)] = s.Nama; });
        document.getElementById('dw-pilihanak').innerHTML =
          '<div style="padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f8fafc;border-bottom:1px solid #e2e8f0">' +
          '<span class="muted" style="font-size:12.5px">Anak:</span>' +
          listAnak.map(function(n){
            var aktif = n === activeNisn;
            return '<button class="anakTabBtn" data-nisn="'+esc(n)+'" style="padding:6px 14px;border-radius:18px;cursor:pointer;font-size:13px;font-weight:600;border:1.5px solid '+(aktif?'#0d9488':'#e2e8f0')+';background:'+(aktif?'#0d9488':'#fff')+';color:'+(aktif?'#fff':'#475569')+'">'+esc(namaMap[String(n)] || n)+'</button>';
          }).join('') + '</div>';
        document.querySelectorAll('.anakTabBtn').forEach(function(btn){
          btn.onclick = function(){ dashboardWali(btn.dataset.nisn); };
        });
      });
    }

    if (!activeNisn) {
      document.getElementById('dw-body').innerHTML = '<div class="card">'+warnBox('Akun ini belum terhubung ke data santri. Minta Admin mengisi NISN Anak di RoleAkses.')+'</div>';
      return;
    }

    // Baca pengaturan visibilitas dari Admin
    var WALI_KEYS = ['WaliTampilRingkasan','WaliTampilKehadiran','WaliTampilHafalan',
      'WaliTampilSPP','WaliTampilNilai','WaliTampilPelanggaran','WaliTampilKantin',
      'WaliTampilMutasiSaldo','WaliIzinAjukanTopUp','WaliIzinGantiLimit','WaliIzinLihatNilai',
      // Compat: kunci lama tetap dibaca supaya pengaturan yang ada tidak hilang
      'WaliTampilRekap','WaliTampilRapor','WaliTampilNotifAbsen','WaliTampilMutasiSaldo'];
    api('getPengaturanBatch', {keys: WALI_KEYS}).then(function(pwRes){
      var pw = pwRes.ok ? pwRes.data : {};
      function boleh(k){ return pw[k] !== false; }

      // Bangun daftar tab yang boleh ditampilkan
      var TABS = [
        {id:'ringkasan', label:'&#127968; Ringkasan',  aktif: boleh('WaliTampilRingkasan')},
        {id:'kehadiran', label:'&#128197; Kehadiran',   aktif: boleh('WaliTampilKehadiran') || boleh('WaliTampilRekap')},
        {id:'hafalan',   label:'&#128218; Hafalan',     aktif: boleh('WaliTampilHafalan')},
        {id:'nilai',     label:'&#128203; Nilai',       aktif: boleh('WaliTampilNilai') || boleh('WaliIzinLihatNilai') || boleh('WaliTampilRapor')},
        {id:'spp',       label:'&#128179; SPP',         aktif: true},
        {id:'keuangan',  label:'&#128176; Keuangan',    aktif: boleh('WaliTampilKantin') || boleh('WaliTampilMutasiSaldo')},
        {id:'pelanggaran',label:'&#9888;&#65039; Sikap',aktif: boleh('WaliTampilPelanggaran')},
      ].filter(function(t){ return t.aktif; });

      var activeTab = 'ringkasan';
      var _pw = pw;

      function renderNav(){
        document.getElementById('dw-nav').innerHTML =
          '<div style="display:flex;overflow-x:auto;gap:2px;padding:6px 0">' +
          TABS.map(function(t){
            var aktif = t.id === activeTab;

          }).join('') + '</div>';
        document.querySelectorAll('.waliTabBtn').forEach(function(btn){
          btn.onclick = function(){
            activeTab = btn.dataset.tab;
            renderNav();
            renderTab(activeTab);
          };
        });
      }

      function renderTab(tab){
        var body = document.getElementById('dw-body');
        body.innerHTML = '<div style="padding:16px"><p class="muted">Memuat...</p></div>';
        if (tab === 'ringkasan') renderTabRingkasan(activeNisn, body, _pw);
        else if (tab === 'kehadiran') renderTabKehadiran(activeNisn, body);
        else if (tab === 'hafalan') renderTabHafalan(activeNisn, body);
        else if (tab === 'nilai') renderTabNilai(activeNisn, body, {izinNilai:boleh('WaliIzinLihatNilai'), izinRapor:boleh('WaliTampilRapor')});
        else if (tab === 'spp') renderTabSPP(activeNisn, body);
        else if (tab === 'keuangan') renderTabKeuangan(activeNisn, body, {izinTopUp:boleh('WaliIzinAjukanTopUp'), izinGantiLimit:boleh('WaliIzinGantiLimit')});
        else if (tab === 'pelanggaran') renderTabPelanggaran(activeNisn, body);
      }

      renderNav();
      renderTab(activeTab);
    });
  }

  // ----- TAB RINGKASAN -----
  function renderTabRingkasan(nisn, body, pw){
    Promise.all([
      api('getJadwalSantri', {nisn:nisn}),
      api('getKehadiranHarianSantri', {nisn:nisn,
        tglMulai: tglNHariLalu(30), tglAkhir: todayStr()}),
      api('getSppSaya', {nisn:nisn}),
      api('getSaldoSantriKantin', {nisn:nisn})
    ]).then(function(hasil){
      var resJ=hasil[0], resK=hasil[1], resSppRaw=hasil[2], resSaldo=hasil[3];
      var d = resJ.ok ? resJ.data : {};
      var k = resK.ok ? resK.rekap : {hadir:0,sakit:0,izin:0,alpa:0,total:0,persen:0};
      // getSppSaya mengembalikan {ok, data:{adaSpp,biaya,bulanTunggakan,totalTunggakan}}
      var spp = (resSppRaw.ok && resSppRaw.data) ? resSppRaw.data : {adaSpp:false,totalTunggakan:0,bulanTunggakan:[]};
      // getSaldoSantriKantin mengembalikan {ok, data:{saldo,limit,nama}}
      var saldo = (resSaldo.ok && resSaldo.data) ? (resSaldo.data.saldo || 0) : 0;

      body.innerHTML =
        '<div style="padding:16px">' +
        '<div style="margin-bottom:6px"><h3 style="margin:0">'+esc(d.nama||'')+'</h3><p class="muted" style="margin:0">Kelas '+esc(d.kelas||'-')+(d.halaqoh?' &middot; Halaqoh '+esc(d.halaqoh):'')+'</p></div>' +

        // Kartu ringkasan 2-kolom
        '<div class="grid2" style="margin-top:12px">' +
          kartuRingkasan('&#128176;', rupiah(saldo), 'Saldo Kantin', '#0d9488') +
          kartuRingkasan('&#128197;', k.persen+'%', 'Kehadiran 30 Hari ('+(k.total||0)+' hari)', k.persen>=80?'#16a34a':k.persen>=60?'#d97706':'#dc2626') +
          (spp.bebas
            ? kartuRingkasan('&#127891;', 'Bebas SPP', 'Dibebaskan dari kewajiban SPP', '#16a34a')
            : kartuRingkasan('&#9888;&#65039;', spp.totalTunggakan>0?rupiah(spp.totalTunggakan):'Lunas', 'Tunggakan SPP', spp.totalTunggakan>0?'#dc2626':'#16a34a')) +
          (k.alpa>0 ? kartuRingkasan('&#128308;', k.alpa+' hari', 'Alpa 30 Hari', '#dc2626') :
           kartuRingkasan('&#128994;', 'Hadir '+k.hadir, 'dari '+k.total+' hari', '#16a34a')) +
        '</div>' +

        (!spp.bebas && spp.totalTunggakan > 0 ?
          '<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:13.5px">' +
          '&#128680; Tunggakan SPP: <b>'+rupiah(spp.totalTunggakan)+'</b> ('+spp.bulanTunggakan.join(', ')+'). '+
          'Harap segera diselesaikan di loket pembayaran.</div>' : '') +

        '<p class="muted" style="font-size:12px;margin-top:14px">Ketuk tab di atas untuk melihat detail kehadiran, hafalan, nilai, dan keuangan.</p>' +
        '</div>';
    });
  }

  function kartuRingkasan(ikon, angka, label, warna){
    return '<div style="background:'+warna+'12;border:1.5px solid '+warna+'33;border-radius:12px;padding:14px;text-align:center">' +
      '<div style="font-size:22px">'+ikon+'</div>' +
      '<div style="font-size:20px;font-weight:800;color:'+warna+';line-height:1.2;margin:4px 0">'+angka+'</div>' +
      '<div style="font-size:11.5px;color:#64748b;line-height:1.35">'+label+'</div>' +
      '</div>';
  }

  function tglNHariLalu(n){
    var d=new Date(); d.setDate(d.getDate()-n);
    return d.toISOString().slice(0,10);
  }

  // ----- TAB KEHADIRAN -----
  function renderTabKehadiran(nisn, body){
    var now = new Date();
    var bln = String(now.getMonth()+1).padStart(2,'0');
    var tglMulai = now.getFullYear()+'-'+bln+'-01';
    var tglAkhir = todayStr();

    body.innerHTML =
      '<div style="padding:16px">' +
      '<div class="card"><h3>&#128197; Kehadiran Harian</h3>' +
      warnBox('Diambil dari absensi harian yang dicatat Pembina, bukan dari absensi per mapel. Ini sumber paling akurat untuk mengetahui apakah santri benar-benar hadir di pondok.') +
      '<div class="grid2"><div><label>Dari Tanggal</label><input type="date" id="khMulai" value="'+esc(tglMulai)+'"></div>' +
      '<div><label>Sampai Tanggal</label><input type="date" id="khAkhir" value="'+esc(tglAkhir)+'"></div></div>' +
      '<button class="small" id="btnKhTampil" style="margin-top:8px">Tampilkan</button></div>' +
      '<div id="khRekap"></div>' +
      '<div id="khDetail"></div>' +
      '<div class="card"><h3>&#9888;&#65039; Tidak Hadir di Mapel/Halaqoh</h3>' +
      warnBox('Daftar ini menampilkan ketidakhadiran di kelas atau halaqoh yang TIDAK tercatat sebagai sakit/izin di absensi harian. Artinya santri tercatat hadir di pondok, tapi tidak hadir di sesi tersebut. Wajib diperhatikan.') +
      '<div id="khLaporan"><p class="muted">Pilih rentang tanggal lalu tekan Tampilkan.</p></div></div>' +
      '</div>';

    function muatKehadiran(){
      var m = document.getElementById('khMulai').value;
      var a = document.getElementById('khAkhir').value;
      var elRekap = document.getElementById('khRekap');
      var elDetail = document.getElementById('khDetail');
      var elLaporan = document.getElementById('khLaporan');
      elRekap.innerHTML = elDetail.innerHTML = elLaporan.innerHTML = '<p class="muted">Memuat...</p>';

      Promise.all([
        api('getKehadiranHarianSantri', {nisn:nisn, tglMulai:m, tglAkhir:a}),
        api('getKetidakhadiranMapel', {nisn:nisn, tglMulai:m, tglAkhir:a})
      ]).then(function(hasil){
        var resK = hasil[0], resL = hasil[1];
        if (!resK.ok){ elRekap.innerHTML = errBox(resK.error); return; }
        var k = resK.rekap;

        // Rekap angka
        elRekap.innerHTML =
          '<div class="card"><div class="grid2" style="gap:8px">' +
          kartuRingkasan('&#9989;', k.hadir+' hari', 'Hadir', '#16a34a') +
          kartuRingkasan('&#128164;', k.sakit+' hari', 'Sakit', '#0891b2') +
          kartuRingkasan('&#128203;', k.izin+' hari', 'Izin', '#d97706') +
          kartuRingkasan('&#128308;', k.alpa+' hari', 'Alpa', '#dc2626') +
          '</div>' +
          '<div style="margin-top:12px;background:#f1f5f9;border-radius:20px;height:12px;overflow:hidden">' +
          '<div style="width:'+k.persen+'%;height:100%;background:linear-gradient(90deg,#16a34a,#0891b2);border-radius:20px"></div></div>' +
          '<p style="text-align:center;font-size:13px;margin:6px 0">Kehadiran: <b>'+k.persen+'%</b> dari <b>'+k.total+'</b> hari</p></div>';

        // Detail hari
        if (resK.detailHari && resK.detailHari.length) {
          var warnaTd = {Hadir:'#16a34a', Sakit:'#0891b2', Izin:'#d97706', 'Izin Pulang':'#d97706', Alpa:'#dc2626'};
          elDetail.innerHTML =
            '<div class="card" style="overflow-x:auto"><h4>Riwayat Per Hari</h4><table>' +
            '<tr><th>Tanggal</th><th>Status</th><th>Catatan</th></tr>' +
            resK.detailHari.map(function(h){
              var w = warnaTd[h.status] || '#64748b';
              return '<tr><td>'+esc(h.tanggal)+'</td>' +
                '<td><b style="color:'+w+'">'+esc(h.status)+'</b></td>' +
                '<td>'+esc(h.catatan||'-')+'</td></tr>';
            }).join('') + '</table></div>';
        } else {
          elDetail.innerHTML = '<div class="card"><p class="muted">Tidak ada data kehadiran pada periode ini.</p></div>';
        }

        // Laporan ketidakhadiran mapel/halaqoh
        if (!resL.ok){ elLaporan.innerHTML = errBox(resL.error); return; }
        if (!resL.laporan.length) {
          elLaporan.innerHTML = '<p style="color:#16a34a;font-weight:600">&#9989; Tidak ada ketidakhadiran yang perlu dilaporkan pada periode ini.</p>';
        } else {
          elLaporan.innerHTML =
            '<div style="overflow-x:auto"><table><tr><th>Tanggal</th><th>Jenis</th><th>Nama</th><th>Status</th></tr>' +
            resL.laporan.map(function(l){
              return '<tr><td>'+esc(l.tanggal)+'</td><td>'+esc(l.jenis)+'</td><td>'+esc(l.nama)+'</td>' +
                '<td><b style="color:#dc2626">'+esc(l.status)+'</b></td></tr>';
            }).join('') + '</table></div>';
        }
      });
    }

    document.getElementById('btnKhTampil').onclick = muatKehadiran;
    muatKehadiran();
  }

        .map(function(m){ return '<option value="'+m[0]+'"'+(Number(m[0])===now.getMonth()+1?' selected':'')+'>'+m[1]+'</option>'; }).join('') +

        : '<div class="card"><p class="muted">Belum ada catatan hafalan.</p></div>';
    });

    var _hwData = [];
    var _hwNama = '';

    function muatRiwayat(){
      var bulan = document.getElementById('hwBulan').value;
      var tahun = document.getElementById('hwTahun').value;
      var el = document.getElementById('hwTabel');
      if (el) el.innerHTML = '<p class="muted">Memuat...</p>';
      api('getRiwayatHafalanBulan', {nisn:nisn, bulan:bulan, tahun:tahun}).then(function(res){

        _hwNama = res.ok ? res.namaSantri : '';
        if (!el) return;
        if (!_hwData.length){ el.innerHTML='<div class="card"><p class="muted">Tidak ada catatan hafalan pada bulan ini.</p></div>'; return; }
        el.innerHTML = '<div class="card" style="overflow-x:auto"><table>' +
          '<tr><th>Tanggal</th><th>Jenis</th><th>Detail</th><th>Nilai</th><th>Pengampu</th></tr>' +
          _hwData.map(function(r){
            // detailHafalan() mengharapkan field halamanKe, surah, ayat, juz
            var rr = {jenis:r.jenis, surah:r.surah, ayat:r.ayat, juz:r.juz, halamanKe:r.halaman};
            return '<tr><td>'+esc(r.tanggal)+'</td><td>'+badgeJenisHafalan(r.jenis)+'</td>' +
              '<td style="font-size:12px">'+detailHafalan(rr)+'</td>' +
              '<td><b>'+(r.nilai||'-')+'</b></td><td style="font-size:12px">'+esc(r.pengampu||'-')+'</td></tr>';
          }).join('') + '</table></div>';
      });
    }

    document.getElementById('btnHwTampil').onclick = muatRiwayat;
    document.getElementById('btnHwPdf').onclick = function(){ unduhPdfHafalan(_hwData, _hwNama); };
    muatRiwayat();
  }

  // Unduh PDF riwayat hafalan menggunakan fitur print browser (paling kompatibel,
  // tanpa memerlukan library tambahan yang memperlambat aplikasi).
  function unduhPdfHafalan(data, namaSantri){
    if (!data || !data.length){ alert('Tidak ada data hafalan untuk diunduh. Pilih bulan dan tekan Tampilkan terlebih dahulu.'); return; }
    var rows = data.map(function(r){
      var detail = [
        r.surah ? r.surah + (r.ayat ? ' : '+r.ayat : '') : '',
        r.juz ? 'Juz '+r.juz : '',
        r.halaman ? 'Hal '+r.halaman : ''
      ].filter(Boolean).join(', ') || '-';
      return '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.jenis)+'</td>' +
        '<td>'+esc(detail)+'</td>' +
        '<td>'+esc(r.nilai||'-')+'</td><td>'+esc(r.pengampu||'-')+'</td></tr>';
    }).join('');
    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Riwayat Hafalan</title>' +
      '<style>body{font-family:Arial,sans-serif;font-size:12px;padding:20px}' +
      'h2{color:#0d9488;margin-bottom:4px}h4{color:#475569;margin:0 0 16px}' +
      'table{width:100%;border-collapse:collapse}th,td{border:1px solid #e2e8f0;padding:6px 8px;text-align:left}' +
      'th{background:#f0fdfa;color:#0d9488;font-weight:700}' +
      'tr:nth-child(even){background:#f8fafc}' +
      '@media print{body{padding:0}}</style></head><body>' +
      '<h2>Riwayat Hafalan Al-Qur\'an</h2>' +
      '<h4>'+esc(namaSantri)+'</h4>' +
      '<table><tr><th>Tanggal</th><th>Jenis</th><th>Detail</th><th>Nilai</th><th>Pengampu</th></tr>' +
      rows + '</table>' +
      '<p style="margin-top:12px;color:#94a3b8;font-size:10px">Dicetak dari aplikasi WASIAT &mdash; PP Wihdatul Ummah Poso &mdash; '+todayStr()+'</p>' +
      '<script>window.onload=function(){window.print();}<\/script></body></html>';
    var w = window.open('','_blank');
    if (!w){ alert('Izinkan pop-up untuk mengunduh PDF.'); return; }
    w.document.write(html);
    w.document.close();
  }

  // ---------------- WIDGET REKAP JAM MENGAJAR SEMUA GURU (Admin/Mudir) ----------------
  // Tampil di halaman Ringkasan dashboard Admin/Mudir. Menampilkan daftar semua guru
  // beserta total jam mengajarnya bulan ini; diklik akan membuka rincian per sesi
  // untuk guru itu (tanggal, jenis, mapel/halaqoh, jam) tanpa berpindah halaman.
  function widgetJamMengajarSemuaGuru(containerId){
    var el = document.getElementById(containerId);
    if (!el) return;
    var now = new Date();
    var bulanAktif = now.getMonth()+1, tahunAktif = now.getFullYear();
    var NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    function muat(){
      el.innerHTML = '<div class="card"><h3>&#8987; Rekap Jam Mengajar Guru</h3><p class="muted">Memuat...</p></div>';
      // pengampu dikosongkan = mode ringkasan (semua guru)
      api('getRekapJamMengajarGuru', {pengampu:'', bulan:bulanAktif, tahun:tahunAktif}).then(function(res){
        if (!el) return;
        if (!res.ok){ el.innerHTML = '<div class="card">'+errBox(res.error)+'</div>'; return; }
        var d = res.data;
        var daftar = (d && d.daftar) ? d.daftar : [];
        var totalSemua = daftar.reduce(function(s,x){ return s + (x.totalJam||0); }, 0);

        el.innerHTML = '<div class="card"><h3>&#8987; Rekap Jam Mengajar Guru</h3>' +
          '<div class="grid2" style="margin-bottom:10px">' +
            '<div><label style="font-size:12.5px">Bulan</label><select id="wjBulan">' +
              NAMA_BULAN.map(function(n,i){ return '<option value="'+(i+1)+'"'+((i+1)===bulanAktif?' selected':'')+'>'+n+'</option>'; }).join('') +
            '</select></div>' +
            '<div><label style="font-size:12.5px">Tahun</label><input id="wjTahun" value="'+tahunAktif+'"></div>' +
          '</div>' +
          '<p class="muted" style="font-size:12.5px;margin-top:-2px">Dihitung otomatis dari absensi mapel &amp; isi hafalan yang diisi guru. Klik nama guru untuk melihat rinciannya.</p>' +
          (daftar.length
            ? ('<p style="margin:8px 0">Total keseluruhan: <b style="color:#0d9488;font-size:17px">'+totalSemua+' jam</b> dari <b>'+daftar.length+'</b> guru aktif</p>' +
               '<div style="overflow-x:auto"><table><tr><th>Nama Guru</th><th>Total Jam</th><th></th></tr>' +
               daftar.map(function(g,i){
                 return '<tr><td>'+esc(g.pengampu)+'</td>' +
                   '<td><b style="color:#0d9488">'+g.totalJam+' jam</b></td>' +
                   '<td><button class="small secondary btnDetilJamGuru" data-guru="'+esc(g.pengampu)+'">Rincian</button></td></tr>' +
                   '<tr id="wjDetil'+i+'" style="display:none"><td colspan="3" style="background:#f8fafc;padding:0"></td></tr>';
               }).join('') + '</table></div>')
            : '<p class="muted">Belum ada data mengajar pada bulan ini.</p>') +
          '</div>';

        // Ganti bulan/tahun -> muat ulang
        document.getElementById('wjBulan').onchange = function(){ bulanAktif = Number(this.value); muat(); };
        document.getElementById('wjTahun').onchange = function(){
          var t = Number(this.value);
          if (t > 2000 && t < 3000) { tahunAktif = t; muat(); }
        };

        // Klik "Rincian" -> ambil detail guru itu, tampilkan inline di baris bawahnya
        document.querySelectorAll('.btnDetilJamGuru').forEach(function(btn, i){
          btn.onclick = function(){
            var baris = document.getElementById('wjDetil'+i);
            if (!baris) return;
            // Kalau sudah terbuka, tutup saja (toggle) -- tidak perlu ambil data lagi
            if (baris.style.display !== 'none') { baris.style.display = 'none'; btn.textContent = 'Rincian'; return; }
            baris.style.display = 'table-row';
            btn.textContent = 'Tutup';
            var sel = baris.querySelector('td');
            if (sel.dataset.sudahMuat === '1') return; // sudah pernah dimuat, pakai yang ada
            sel.innerHTML = '<p class="muted" style="padding:10px;margin:0">Memuat rincian...</p>';
            api('getRekapJamMengajarGuru', {pengampu: btn.dataset.guru, bulan:bulanAktif, tahun:tahunAktif}).then(function(r2){
              if (!r2.ok){ sel.innerHTML = '<div style="padding:10px">'+errBox(r2.error)+'</div>'; return; }
              var dd = r2.data;
              if (!dd.riwayat || !dd.riwayat.length){
                sel.innerHTML = '<p class="muted" style="padding:10px;margin:0">Tidak ada sesi tercatat.</p>';
                sel.dataset.sudahMuat = '1'; return;
              }
              sel.innerHTML = '<div style="padding:10px">' +
                '<p style="margin:0 0 6px;font-size:12.5px">'+esc(btn.dataset.guru)+' &mdash; <b>'+dd.totalJam+' jam</b> dari '+dd.jumlahSesi+' sesi, '+Object.keys(dd.perHari||{}).length+' hari mengajar</p>' +
                '<table style="margin:0"><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Jam</th></tr>' +
                dd.riwayat.map(function(r){
                  return '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.jenis)+'</td><td>'+esc(r.keterangan)+'</td><td><b>'+r.jam+'</b></td></tr>';
                }).join('') + '</table></div>';
              sel.dataset.sudahMuat = '1';
            });
          };
        });
      }).catch(function(){
        if (el) el.innerHTML = '<div class="card">'+errBox('Gagal memuat rekap jam mengajar.')+'</div>';
      });
    }
    muat();
  }

      api('getTahunAjaranList', {}).then(function(res){

        if(!res.data.length){ document.getElementById('listSemester').innerHTML = '<p class="muted">Belum ada semester. Buat semester pertama di atas.</p>'; return; }
        var html = '<table><tr><th>Nama Semester</th><th>Status</th><th>Folder Drive</th><th>Aksi</th></tr>';
        res.data.forEach(function(t){
          var linkFolder = t.idFolder ?
            '<a href="https://drive.google.com/drive/folders/'+esc(t.idFolder)+'" target="_blank" rel="noopener" style="color:#0d9488">&#128193; Buka</a>' :
            '<span class="muted">-</span>';
          html += '<tr>' +
            '<td><b>'+esc(t.nama)+'</b></td>' +
            '<td>'+(t.aktif ? '<span style="background:#0d9488;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px">&#10004; Aktif</span>' : '<span class="muted">-</span>')+'</td>' +

        });

        document.getElementById('listSemester').innerHTML = html;
        document.querySelectorAll('.btnAktifkanSemester').forEach(function(btn){
          btn.onclick = function(){
            var namaSem = btn.closest('tr').querySelector('b').textContent;
            if(!confirm('Beralih ke "'+namaSem+'"?\n\nSemua input Absensi, Hafalan, Nilai, Kantin, Pelanggaran akan masuk ke semester ini.')) return;
            btn.disabled=true; btn.textContent='Mengaktifkan...';
            api('setTahunAjaranAktif', {id: btn.dataset.id}).then(function(res){
              if(res.ok){ alert('"'+namaSem+'" sekarang aktif.'); muat(); }
              else { alert(res.error); btn.disabled=false; btn.textContent='Jadikan Aktif'; }
            });
          };

    document.getElementById('btnBuatSemester').onclick = function(){

      var btn = document.getElementById('btnBuatSemester');
      btn.disabled = true; btn.textContent = 'Membuat folder & spreadsheet... (30-60 detik)';
      document.getElementById('pesanSemester').innerHTML = '<p class="muted">Sedang memproses, jangan tutup halaman ini...</p>';
      api('createTahunAjaran', {nama:nama}).then(function(res){
        btn.disabled = false; btn.textContent = 'Buat Semester Baru';
        if(res.ok){
          document.getElementById('pesanSemester').innerHTML =
            '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:8px">'+
            '&#10004; <b>'+esc(nama)+'</b> berhasil dibuat! Folder Drive dan 3 spreadsheet sudah tersedia. '+
            'Klik "Jadikan Aktif" untuk mulai menggunakannya.</div>';
          document.getElementById('namaSemesterBaru').value = '';
          muat();
        } else {
          document.getElementById('pesanSemester').innerHTML = errBox(res.error);
        }
      });
    };
    muat();
  }

  function lanjutkanAdminRombel(daftarNamaGuru){
    function muatDaftar(){
      api('getDaftarKelasRombel', {}).then(function(res){
        if(!res.ok){ document.getElementById('listRombel').innerHTML = errBox(res.error); return; }
        if(!res.data.length){ document.getElementById('listRombel').innerHTML = '<p class="muted">Belum ada rombel. Buat rombel dulu di atas.</p>'; return; }
        var html = '<table><tr><th>Kelas</th><th>Wali Kelas</th><th>Aksi</th></tr>';
        res.data.forEach(function(r){
          html += '<tr><td>'+esc(r.kelas)+'</td><td>'+esc(r.waliKelas)+'</td>' +
            '<td><button class="small btnLihatRombel" data-kelas="'+esc(r.kelas)+'">Lihat/Kelola Santri</button> ' +
            '<button class="small btnEditWali" data-kelas="'+esc(r.kelas)+'" data-wali="'+esc(r.waliKelas)+'">Edit Wali Kelas</button> ' +
            '<button class="small danger btnHapusRombel" data-kelas="'+esc(r.kelas)+'">Hapus Rombel</button></td></tr>';
        });
        html += '</table>';
        document.getElementById('listRombel').innerHTML = html;
        document.querySelectorAll('.btnLihatRombel').forEach(function(b){ b.onclick=function(){ tampilkanDetailRombel(b.dataset.kelas); }; });
        document.querySelectorAll('.btnEditWali').forEach(function(b){
          b.onclick = function(){
            openModal('Edit Wali Kelas untuk '+b.dataset.kelas, fieldAutocomplete('waliBaru','Wali Kelas', daftarNamaGuru, b.dataset.wali, 'Ketik nama guru...'), function(modal){
              return api('editWaliKelas', {kelas:b.dataset.kelas, waliKelasBaru: modal.querySelector('#waliBaru').value}).then(muatDaftar);
            });
          };
        });
        document.querySelectorAll('.btnHapusRombel').forEach(function(b){
          b.onclick = function(){
            if(!confirm('Hapus rombel "'+b.dataset.kelas+'" beserta semua keanggotaan santrinya? (Data santri di sheet Santri tidak akan terhapus)')) return;
            api('hapusRombel', {kelas:b.dataset.kelas}).then(function(){ document.getElementById('detailRombelWrap').innerHTML=''; muatDaftar(); });
          };
        });
      });
    }

    function tampilkanDetailRombel(kelas){
      var wrap = document.getElementById('detailRombelWrap');
      wrap.innerHTML = '<div class="card"><h3>Santri di '+esc(kelas)+'</h3><p>Memuat...</p></div>';
      Promise.all([api('getDetailRombel', {kelas:kelas}), api('getDaftarKelasRombel', {})]).then(function(hasil){
        var res = hasil[0], resKelas = hasil[1];
        if(!res.ok){ wrap.innerHTML = '<div class="card">'+errBox(res.error)+'</div>'; return; }
        var daftarKelasLain = resKelas.data.map(function(k){return k.kelas;});
        var html = '<div class="card"><h3>Santri di '+esc(kelas)+'</h3><button class="small" id="btnTambahSantriRombel">+ Tambah Santri ke Rombel Ini</button>';
        if(!res.data.length){ html += warnBox('Belum ada santri di rombel ini.'); }
        else {
          html += '<table><tr><th>NISN</th><th>Nama</th><th>Aksi</th></tr>';
          res.data.forEach(function(s){
            html += '<tr><td>'+esc(s.nisn)+'</td><td>'+esc(s.nama)+'</td>' +
              '<td><button class="small btnPindah" data-nisn="'+esc(s.nisn)+'">Pindah Rombel</button> ' +
              '<button class="small danger btnKeluarkan" data-nisn="'+esc(s.nisn)+'">Keluarkan</button></td></tr>';
          });
          html += '</table>';
        }
        html += '</div>';
        wrap.innerHTML = html;

        document.getElementById('btnTambahSantriRombel').onclick = function(){
          api('getSemuaSantri', {}).then(function(resSantri){
            if(!resSantri.ok){ alert(resSantri.error); return; }
            var opsi = resSantri.data.map(labelSantri);
            openModal('Tambah Santri ke '+kelas,
              fieldAutocomplete('cariSantriRombel','Cari Santri (ketik NISN atau nama)', opsi, '', 'Ketik NISN atau nama santri...'),
              function(modal){
                var raw = modal.querySelector('#cariSantriRombel').value;
                var nisn = resolveSantriNisn(raw, resSantri.data);
                if (!nisn) { alert('Santri tidak ditemukan. Pilih salah satu saran yang muncul saat mengetik.'); return false; }
                return api('tambahSantriKeRombel', {nisn: nisn, kelas:kelas}).then(function(r){ if(!r.ok) alert(r.error); else tampilkanDetailRombel(kelas); });
              });
          });
        };
        wrap.querySelectorAll('.btnPindah').forEach(function(b){
          b.onclick = function(){
            openModal('Pindah Rombel', fieldSelect('kelasTujuan','Pindah ke Kelas', daftarKelasLain, kelas), function(modal){
              return api('pindahSantriRombel', {nisn:b.dataset.nisn, kelasBaru: modal.querySelector('#kelasTujuan').value}).then(function(r){ if(!r.ok) alert(r.error); else tampilkanDetailRombel(kelas); });
            });
          };
        });
        wrap.querySelectorAll('.btnKeluarkan').forEach(function(b){
          b.onclick = function(){ if(!confirm('Keluarkan santri ini dari rombel?')) return; api('hapusSantriDariRombel', {nisn:b.dataset.nisn}).then(function(){ tampilkanDetailRombel(kelas); }); };
        });
      });
    }

    document.getElementById('btnBuatRombel').onclick = function(){
      var kelas = document.getElementById('namaRombelBaru').value.trim();
      var wali = document.getElementById('waliRombelBaru').value.trim();
      if(!kelas) return;
      api('buatRombelBaru', {kelas:kelas, waliKelas:wali}).then(function(res){
        if(!res.ok){ document.getElementById('pesanRombel').innerHTML = errBox(res.error); return; }
        document.getElementById('namaRombelBaru').value=''; document.getElementById('waliRombelBaru').value='';
        document.getElementById('pesanRombel').innerHTML = ''; muatDaftar();
      });
    };
    muatDaftar();
  }

        '<div id="pgSesiWrap"><p class="muted">Ketik nama Guru Asli dulu untuk melihat jadwalnya.</p></div>' +

        '<button id="btnSimpanPengganti">Simpan</button><div id="pesanPengganti"></div></div>' +

      function muatFormSesi(){
        var jenis = document.getElementById('pgJenis').value;
        var guruAsli = resolveGuruExact(document.getElementById('pgGuruAsli').value.trim(), daftarNamaGuru);
        var wrap = document.getElementById('pgSesiWrap');

        wrap.innerHTML = '<p>Memuat jadwal...</p>';
        if (jenis === 'Mapel') {
          api('getMasterData', {sheet:'MataPelajaran'}).then(function(res){
            if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
            var daftar = res.data.data.filter(function(m){ return m.Pengampu === guruAsli; });
            if(!daftar.length){ wrap.innerHTML = warnBox('Guru ini tidak punya jadwal mata pelajaran.'); return; }
            window.__pgDaftarSesi = daftar;
            wrap.innerHTML = '<label>Pilih Sesi yang Digantikan</label><select id="pgSesiPilihan">' +
              daftar.map(function(m,i){ return '<option value="'+i+'">'+esc(m['Nama Mapel'])+' - '+esc(m.Kelas)+' ('+esc(m.Hari)+', Jam ke-'+esc(m['Jam Ke'])+')</option>'; }).join('') + '</select>';
          });
        } else {
          api('getHalaqohList', {}).then(function(res){
            if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
            var daftar = res.data.filter(function(h){ return h.pengampuList && h.pengampuList.indexOf(guruAsli) !== -1; });
            if(!daftar.length){ wrap.innerHTML = warnBox('Guru ini tidak punya jadwal halaqoh.'); return; }
            window.__pgDaftarSesi = daftar;
            wrap.innerHTML = '<label>Pilih Halaqoh yang Digantikan</label><select id="pgSesiPilihan">' +
              daftar.map(function(h,i){ return '<option value="'+i+'">'+esc(h.namaHalaqoh)+' ('+esc(h.waktu)+')</option>'; }).join('') + '</select>';
          });
        }
      }
      document.getElementById('pgJenis').onchange = muatFormSesi;
      document.getElementById('pgGuruAsli').addEventListener('input', muatFormSesi);

      function muatDaftarPengganti(){
        document.getElementById('daftarPenggantiWrap').innerHTML = 'Memuat...';
        api('getDaftarPenggantian', {}).then(function(res){
          if(!res.ok){ document.getElementById('daftarPenggantiWrap').innerHTML = errBox(res.error); return; }
          if(!res.data.length){ document.getElementById('daftarPenggantiWrap').innerHTML = '<p class="muted">Belum ada catatan guru pengganti.</p>'; return; }
          var html = '<table><tr><th>Tanggal</th><th>Jenis</th><th>Sesi</th><th>Guru Asli</th><th>Guru Pengganti</th><th>Ket</th><th>Aksi</th></tr>';
          res.data.sort(function(a,b){ return b.tanggal.localeCompare(a.tanggal); }).forEach(function(p){
            var sesiLabel = p.jenisSesi === 'Mapel' ? (p.mapel+' - '+p.kelas+' (Jam ke-'+p.jamKe+')') : (p.halaqoh+' ('+p.waktu+')');
            html += '<tr><td>'+esc(p.tanggal)+'</td><td>'+esc(p.jenisSesi)+'</td><td>'+esc(sesiLabel)+'</td><td>'+esc(p.guruAsli)+'</td><td>'+esc(p.guruPengganti)+'</td><td>'+esc(p.keterangan||'-')+'</td>' +
              '<td><button class="small danger btnHapusPengganti" data-row="'+p.rowIndex+'">Hapus</button></td></tr>';
          });
          html += '</table>';
          document.getElementById('daftarPenggantiWrap').innerHTML = html;
          document.querySelectorAll('.btnHapusPengganti').forEach(function(btn){
            btn.onclick = function(){ if(!confirm('Hapus catatan penggantian ini?')) return; api('hapusPenggantian', {rowIndex:Number(btn.dataset.row)}).then(muatDaftarPengganti); };
          });
        });
      }

      document.getElementById('btnSimpanPengganti').onclick = function(){
        var tanggal = document.getElementById('pgTanggal').value;
        var jenis = document.getElementById('pgJenis').value;
        var guruAsli = resolveGuruExact(document.getElementById('pgGuruAsli').value.trim(), daftarNamaGuru);
        var guruPengganti = resolveGuruExact(document.getElementById('pgGuruPengganti').value.trim(), daftarNamaGuru);
        var sesiSelect = document.getElementById('pgSesiPilihan');
        if (!tanggal || !guruAsli || !guruPengganti || !sesiSelect) { document.getElementById('pesanPengganti').innerHTML = errBox('Lengkapi semua isian, termasuk pilih sesi yang digantikan (nama guru harus dipilih dari saran).'); return; }
        if (guruAsli === guruPengganti) { document.getElementById('pesanPengganti').innerHTML = errBox('Guru Pengganti tidak boleh sama dengan Guru Asli.'); return; }
        var sesi = window.__pgDaftarSesi[Number(sesiSelect.value)];
        var payload = {tanggal:tanggal, jenisSesi:jenis, guruAsli:guruAsli, guruPengganti:guruPengganti, keterangan: document.getElementById('pgKeterangan').value.trim()};
        if (jenis === 'Mapel') { payload.mapel = sesi['Nama Mapel']; payload.kelas = sesi.Kelas; payload.jamKe = sesi['Jam Ke']; }
        else { payload.halaqoh = sesi.namaHalaqoh; payload.waktu = sesi.waktu; }
        api('tambahPenggantian', payload).then(function(res){
          if(!res.ok){ document.getElementById('pesanPengganti').innerHTML = errBox(res.error); return; }
          document.getElementById('pesanPengganti').innerHTML = '<p class="muted">Tersimpan.</p>';
          document.getElementById('pgKeterangan').value = '';
          muatDaftarPengganti();
        });
      };

      muatDaftarPengganti();
    });
  }

  function lanjutkanAdminHalaqoh(daftarNamaGuru){

        if(!res.ok){ document.getElementById('listHalaqoh').innerHTML = errBox(res.error); return; }
        if(!res.data.length){ document.getElementById('listHalaqoh').innerHTML = '<p class="muted">Belum ada halaqoh.</p>'; return; }

          html += '<tr><td>'+esc(h.namaHalaqoh)+'</td><td>'+esc(h.pengampu)+'</td><td>'+esc(h.waktu)+'</td><td>'+esc(h.gender)+'</td>' +
            '<td><button class="small btnLihatHalaqoh" data-h="'+esc(h.namaHalaqoh)+'">Lihat/Kelola Santri</button> ' +
            '<button class="small btnEditHalaqoh" data-h="'+esc(h.namaHalaqoh)+'" data-p="'+esc(h.pengampu)+'" data-w="'+esc(h.waktu)+'" data-g="'+esc(h.gender)+'">Edit</button> ' +
            '<button class="small danger btnHapusHalaqoh" data-h="'+esc(h.namaHalaqoh)+'">Hapus</button></td></tr>';
        });
        html += '</table>';
        document.getElementById('listHalaqoh').innerHTML = html;
        document.querySelectorAll('.btnLihatHalaqoh').forEach(function(b){ b.onclick=function(){ tampilkanDetailHalaqoh(b.dataset.h); }; });
        document.querySelectorAll('.btnEditHalaqoh').forEach(function(b){
          b.onclick = function(){
            var pengampuTerpilihSaatIni = b.dataset.p.split(',').map(function(s){return s.trim();}).filter(Boolean);
            var fieldsPengampu = '<label>Pengampu (boleh pilih lebih dari satu)</label><div id="editPengampuWrap">' +
              daftarNamaGuru.map(function(g){ return '<label style="display:inline-flex;align-items:center;gap:5px;font-weight:400;margin-right:12px;margin-bottom:4px"><input type="checkbox" class="editPengampuChk" value="'+esc(g)+'" style="width:auto;margin:0" '+(pengampuTerpilihSaatIni.indexOf(g)!==-1?'checked':'')+'> '+esc(g)+'</label>'; }).join('') +
              '</div>';
            openModal('Edit Halaqoh '+b.dataset.h,
              fieldsPengampu +
              fieldSelect('editWaktu','Waktu', WAKTU_HALAQOH, b.dataset.w) +
              fieldSelect('editGender','Gender', ['Laki-laki','Perempuan'], b.dataset.g),
              function(modal){
                var pengampuBaru = Array.prototype.map.call(modal.querySelectorAll('.editPengampuChk:checked'), function(el){return el.value;}).join(', ');
                if (!pengampuBaru) { alert('Pilih minimal satu guru pengampu.'); return false; }
                return api('editHalaqoh', {namaHalaqoh:b.dataset.h, pengampu: pengampuBaru, waktu: modal.querySelector('#editWaktu').value, gender: modal.querySelector('#editGender').value}).then(muatDaftar);
              });

        document.querySelectorAll('.btnHapusHalaqoh').forEach(function(b){
          b.onclick = function(){ if(!confirm('Hapus halaqoh "'+b.dataset.h+'" beserta semua anggotanya?')) return; api('hapusHalaqoh', {namaHalaqoh:b.dataset.h}).then(function(){ document.getElementById('detailHalaqohWrap').innerHTML=''; muatDaftar(); }); };
        });
      });

    function tampilkanDetailHalaqoh(namaHalaqoh){
      var wrap = document.getElementById('detailHalaqohWrap');
      wrap.innerHTML = '<div class="card"><h3>Santri di '+esc(namaHalaqoh)+'</h3><p>Memuat...</p></div>';

        if(!res.ok){ wrap.innerHTML = '<div class="card">'+errBox(res.error)+'</div>'; return; }

          '<button class="small" id="btnTambahSantriHalaqoh">+ Tambah Santri</button>';
        if(!res.data.length){ html += warnBox('Belum ada santri di halaqoh ini.'); }
        else {
          html += '<table><tr><th>NISN</th><th>Nama</th><th>Aksi</th></tr>';
          res.data.forEach(function(s){
            html += '<tr><td>'+esc(s.nisn)+'</td><td>'+esc(s.nama)+'</td>' +
              '<td style="white-space:nowrap">'+
              '<button class="small btnPindahH" data-nisn="'+esc(s.nisn)+'">Pindah</button> ' +
              '<button class="small danger btnKeluarkanH" data-nisn="'+esc(s.nisn)+'">Keluarkan</button></td></tr>';
          });
          html += '</table>';
        }
        html += '</div>';
        wrap.innerHTML = html;

        document.getElementById('btnTambahSantriHalaqoh').onclick = function(){
          api('getSemuaSantri', {}).then(function(resSantri){
            if(!resSantri.ok){ alert(resSantri.error); return; }
            var opsi = resSantri.data.map(labelSantri);
            openModal('Tambah Santri ke Halaqoh '+namaHalaqoh,
              '<p class="muted" style="font-size:12.5px">Santri yang sudah di halaqoh lain tetap bisa ditambahkan ke halaqoh ini.</p>'+
              fieldAutocomplete('cariSantriHalaqoh','Cari Santri (ketik NISN atau nama)', opsi, '', 'Ketik NISN atau nama santri...'),
              function(modal){
                var raw = modal.querySelector('#cariSantriHalaqoh').value;
                var nisn = resolveSantriNisn(raw, resSantri.data);
                if (!nisn) { alert('Santri tidak ditemukan.'); return false; }
                return api('tambahSantriKeHalaqoh', {nisn:nisn, namaHalaqoh:namaHalaqoh}).then(function(r){
                  if(!r.ok) alert(r.error); else tampilkanDetailHalaqoh(namaHalaqoh);
                });
              });
          });
        };

        api('getHalaqohList', {}).then(function(resList){
          var daftarSemua = resList.ok ? resList.data.map(function(h){return h.namaHalaqoh;}) : [];
          wrap.querySelectorAll('.btnPindahH').forEach(function(b){
            b.onclick = function(){
              var daftarTujuan = daftarSemua.filter(function(h){ return h !== namaHalaqoh; });
              openModal('Pindah dari '+namaHalaqoh,
                fieldSelect('halaqohTujuan','Pindah ke Halaqoh', daftarTujuan, ''),
                function(modal){
                  return api('pindahSantriHalaqoh', {nisn:b.dataset.nisn, halaqohLama:namaHalaqoh, halaqohBaru:modal.querySelector('#halaqohTujuan').value})
                    .then(function(r){ if(!r.ok) alert(r.error); else tampilkanDetailHalaqoh(namaHalaqoh); });
                });
            };
          });
        });

        wrap.querySelectorAll('.btnKeluarkanH').forEach(function(b){
          b.onclick = function(){
            if(!confirm('Keluarkan santri ini dari halaqoh "'+namaHalaqoh+'"?\n\nHalaqoh lain yang diikuti santri ini tidak terpengaruh.')) return;
            api('hapusSantriDariHalaqoh', {nisn:b.dataset.nisn, namaHalaqoh:namaHalaqoh})
              .then(function(r){ if(!r.ok) alert(r.error); else tampilkanDetailHalaqoh(namaHalaqoh); });
          };
        });
      });
    }

    document.getElementById('btnBuatHalaqoh').onclick = function(){
      var nama = document.getElementById('namaHalaqohBaru').value.trim();
      if(!nama) return;
      var pengampu = Array.prototype.map.call(document.querySelectorAll('.pengampuHalaqohBaruChk:checked'), function(el){return el.value;}).join(', ');
      if (!pengampu) { document.getElementById('pesanHalaqoh').innerHTML = errBox('Pilih minimal satu guru pengampu.'); return; }
      api('buatHalaqohBaru', {namaHalaqoh:nama, pengampu: pengampu,
        waktu: document.getElementById('waktuHalaqohBaru').value, gender: document.getElementById('genderHalaqohBaru').value}).then(function(res){
        if(!res.ok){ document.getElementById('pesanHalaqoh').innerHTML = errBox(res.error); return; }
        document.getElementById('namaHalaqohBaru').value='';
        document.querySelectorAll('.pengampuHalaqohBaruChk:checked').forEach(function(el){ el.checked = false; });
        document.getElementById('pesanHalaqoh').innerHTML=''; muatDaftar();
      });
    };
    muatDaftar();
  }

    });

    document.getElementById('btnTambahSantri').onclick = function(){
      var payload = { nisn: document.getElementById('nsNisn').value.trim(), nama: document.getElementById('nsNama').value.trim(),
        tahunMasuk: document.getElementById('nsTahun').value.trim(), jenisKelamin: document.getElementById('nsGender').value,
        noWaOrtu: document.getElementById('nsWa').value.trim(), kelas: document.getElementById('nsKelas').value };

        ['0011229901','Contoh Nama Santri',2025,'Laki-laki','6281200000000','7A']];
      var ws = XLSX.utils.aoa_to_sheet(data);
      var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Template Santri'); XLSX.writeFile(wb, 'Template_Import_Santri.xlsx');
    };

    document.getElementById('btnProsesImport').onclick = function(){
      var fileInput = document.getElementById('fileImport');
      if(!fileInput.files.length){ alert('Pilih file Excel terlebih dahulu.'); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        try {
          var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          var ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, {defval:''});
          var payload = rows.map(function(r){
            return { nisn: String(r['NISN']||'').trim(), nama: String(r['Nama']||'').trim(), tahunMasuk: String(r['Tahun Masuk']||'').trim(),
              jenisKelamin: String(r['Jenis Kelamin']||'').trim(), noWaOrtu: String(r['No WA Ortu']||'').trim(),
              kelas: String(r['Kelas (opsional, harus sama persis dgn nama Rombel yang sudah ada)'] || r['Kelas'] || '').trim() };
          }).filter(function(r){ return r.nisn; });
          if(!payload.length){ document.getElementById('hasilImport').innerHTML = errBox('Tidak ada baris data yang terbaca dari file.'); return; }
          document.getElementById('hasilImport').innerHTML = '<p class="muted">Mengimpor '+payload.length+' baris...</p>';
          api('importSantriMassal', {rows: payload}).then(function(res){
            if(!res.ok){ document.getElementById('hasilImport').innerHTML = errBox(res.error); return; }
            var html = '<p>Berhasil ditambah: <b>'+res.ditambah+'</b>, dilewati: <b>'+res.dilewati+'</b></p>';
            if(res.errors && res.errors.length){ html += '<div class="warn">' + res.errors.map(esc).join('<br>') + '</div>'; }
            document.getElementById('hasilImport').innerHTML = html;
            muatTabelSantri();
          });
        } catch(err){ document.getElementById('hasilImport').innerHTML = errBox('Gagal membaca file: ' + err.message); }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    };

    document.getElementById('btnExportSantri').onclick = function(){
      api('getSemuaSantri', {}).then(function(res){

          var limit = s.limitHarian!=null && s.limitHarian>0 ? 'Rp'+Number(s.limitHarian).toLocaleString('id-ID') : 'Tanpa batas';

            '<td style="white-space:nowrap">' +
            '<button class="small btnTambahSaldo" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'">+Saldo</button> ' +
            '<button class="small secondary btnAturLimit" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'" data-limit="'+Number(s.limitHarian||0)+'">Limit</button>' +
            '</td></tr>';
        });
        html += '</table>';
        document.getElementById('tabelSantri').innerHTML = html;

        // Tombol Tambah Saldo Manual

              var nominal = m.querySelector('#tsmNominal').value.trim();

              api('tambahSaldoSantriManual',{nisn:btn.dataset.nisn, nominal:nominal, oleh:STATE.user.nama}).then(function(r){
                if(!r.ok){ alert(r.error); return; }
                alert('Saldo '+r.nama+' berhasil ditambah. Saldo baru: Rp'+r.saldoBaru.toLocaleString('id-ID'));
                muatTabelSantri();
              });
            });
          };
        });

        // Tombol Atur Limit
        document.querySelectorAll('.btnAturLimit').forEach(function(btn){
          btn.onclick = function(){
            var fieldsHtml = '<p><b>'+esc(btn.dataset.nama)+'</b></p>' +
              '<label>Limit Belanja Harian (Rp, isi 0 untuk tanpa batas)</label>' +
              '<input type="number" id="alNominal" value="'+esc(btn.dataset.limit)+'" placeholder="0 = tanpa batas">';
            openModal('Atur Limit Harian Kantin', fieldsHtml, function(m){
              var limit = m.querySelector('#alNominal').value.trim();
              api('setLimitHarianAdmin',{nisn:btn.dataset.nisn, limit:limit||0}).then(function(r){
                if(!r.ok){ alert(r.error); return; }
                muatTabelSantri();
              });
            });
          };
        });
      });
    }
    muatTabelSantri();
  }

    function muat(){
      var sheet = document.getElementById('pilihSheet').value;
      var fetchGuru = (sheet==='MataPelajaran') ? api('getMasterData', {sheet:'Guru'}) : Promise.resolve({ok:true,data:{data:[]}});
      var fetchKelas = (sheet==='MataPelajaran') ? api('getDaftarKelasRombel',{}) : Promise.resolve({ok:true,data:[]});
      var fetchSantri = (sheet==='RoleAkses') ? api('getSemuaSantri', {}) : Promise.resolve({ok:true,data:[]});
      Promise.all([api('getMasterData', {sheet:sheet}), fetchKelas, fetchGuru, fetchSantri])
        .then(function(hasil){
          var res = hasil[0], resKelas = hasil[1], resGuru = hasil[2], resSantri = hasil[3];
          if(!res.ok){ document.getElementById('tabelMaster').innerHTML = errBox(res.error); return; }
          var header = res.data.header;
          var daftarKelas = resKelas.data.map(function(k){return k.kelas;});
          var daftarNamaGuru = resGuru.ok ? resGuru.data.data.map(function(g){return g.Nama;}) : [];
          var daftarNamaMapel = []; var seenMapel = {};
          res.data.data.forEach(function(row){ var nm = row['Nama Mapel']; if(nm && !seenMapel[nm]){ seenMapel[nm]=true; daftarNamaMapel.push(nm); } });
          var daftarSantri = resSantri.ok ? resSantri.data : [];
          var html = '<table><tr>' + header.map(function(h){return '<th>'+esc(h)+'</th>';}).join('') + '<th>Aksi</th></tr>';
          res.data.data.forEach(function(row){
            html += '<tr>' + header.map(function(h){return '<td>'+esc(row[h]!==undefined?row[h]:'')+'</td>';}).join('') +
              '<td><button class="small btnEditM" data-row="'+row.rowIndex+'">Edit</button> <button class="small danger btnDelM" data-row="'+row.rowIndex+'">Hapus</button></td></tr>';
          });
          html += '</table><button id="btnTambahRow">+ Tambah Data</button>';
          document.getElementById('tabelMaster').innerHTML = html;

          function bukaForm(existing){
            var fieldsHtml = header.map(function(h){
              if(sheet==='MataPelajaran' && h==='Kelas') return fieldSelect('f_'+h,h,daftarKelas, existing?existing[h]:(daftarKelas[0]||''));
              if(sheet==='MataPelajaran' && h==='Hari') return fieldSelect('f_'+h,h,['Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu','Minggu'], existing?existing[h]:'Senin');
              if(sheet==='MataPelajaran' && h==='Pengampu') return fieldAutocomplete('f_'+h,h,daftarNamaGuru, existing?existing[h]:'', 'Ketik nama guru...');
              if(sheet==='MataPelajaran' && h==='Nama Mapel') return fieldAutocomplete('f_'+h,h,daftarNamaMapel, existing?existing[h]:'', 'Ketik nama mapel (boleh baru)...');
              if(sheet==='RoleAkses' && h==='Level') {
                var rolesTerpilih = existing && existing[h] ? String(existing[h]).split(',').map(function(s){return s.trim();}) : ['Guru'];
                return '<label>Level / Role (boleh pilih lebih dari satu)</label><div id="f_Level_wrap">' +
                  DAFTAR_ROLE.map(function(r){ return '<label style="display:inline-flex;align-items:center;gap:5px;font-weight:400;margin-right:12px;margin-bottom:4px"><input type="checkbox" class="roleChk" value="'+r.value+'" style="width:auto;margin:0" '+(rolesTerpilih.indexOf(r.value)!==-1?'checked':'')+'> '+esc(r.label)+'</label>'; }).join('') +
                  '</div>';
              }
              if(sheet==='RoleAkses' && h==='NISN Anak') return fieldMultiSantri('f_'+h,h+' (khusus WaliSantri, boleh lebih dari satu untuk wali dengan >1 anak)',daftarSantri, existing?existing[h]:'', 'Ketik NISN/nama santri lalu klik + Tambah Anak...');
              if(sheet==='JamPelajaran' && h==='Jenis') return fieldSelect('f_'+h,h,['Halaqoh','Mapel'], existing?existing[h]:'Halaqoh');
              if(sheet==='JamPelajaran' && h==='Nama') return fieldText('f_'+h,'Nama (untuk Halaqoh isi nama Waktu: Subuh/Duha/Maghrib dst; untuk Mapel isi nama mata pelajaran)', existing?existing[h]:'');
              if(sheet==='JamPelajaran' && h==='Jumlah Jam') return fieldText('f_'+h,h, existing?existing[h]:'');
              return fieldText('f_'+h, h, existing?existing[h]:'');
            }).join('');
            openModal(existing? 'Edit Data' : 'Tambah Data', fieldsHtml, function(modal){
              var values = {}; var gagal = null;
              header.forEach(function(h){
                if (sheet==='RoleAkses' && h==='Level') {
                  var checked = Array.prototype.map.call(modal.querySelectorAll('.roleChk:checked'), function(el){return el.value;});
                  if (!checked.length) { gagal = 'Pilih minimal satu Level/Role.'; return; }
                  values[h] = checked.join(',');
                  return;
                }
                // PENTING: id HTML tidak boleh ada spasi -- ganti spasi dengan underscore
                var safeId = 'f_' + h.replace(/\s+/g, '_');
                var el = modal.querySelector('#' + safeId);
                // Fallback: coba dengan id asli (spasi)
                if (!el) el = modal.querySelector('[id="f_' + h + '"]');
                var raw = el ? el.value : '';
                if (sheet==='MataPelajaran' && h==='Pengampu') {
                  var pengampuValid = resolveGuruExact(raw, daftarNamaGuru);
                  if (!pengampuValid) { gagal = 'Nama guru pada Pengampu tidak dikenali. Pilih salah satu saran yang muncul saat mengetik.'; return; }
                  values[h] = pengampuValid;
                } else if (sheet==='RoleAkses' && h==='NISN Anak') {
                  // NISN Anak hanya wajib valid kalau role WaliSantri. raw di sini adalah
                  // CSV NISN dari widget chip (fieldMultiSantri) -- 1 atau lebih anak.
                  var rolesYangDipilih = Array.prototype.map.call(modal.querySelectorAll('.roleChk:checked'), function(el){return el.value;});
                  var isWali = rolesYangDipilih.indexOf('WaliSantri') !== -1;
                  if (!raw) {
                    values[h] = '';
                  } else if (isWali) {
                    var tokenNisn = raw.split(',').map(function(t){return t.trim();}).filter(Boolean);
                    if (daftarSantri.length > 0) {
                      var tidakValid = tokenNisn.filter(function(t){ return !daftarSantri.some(function(s){ return String(s.nisn)===String(t); }); });
                      if (tidakValid.length) {
                        gagal = 'Santri dengan NISN ' + tidakValid.join(', ') + ' tidak ditemukan. Hapus chip yang bermasalah lalu pilih ulang dari saran.';
                        return;
                      }
                    }
                    values[h] = tokenNisn.join(',');
                  } else {
                    // Bukan WaliSantri: simpan apa adanya, tidak perlu validasi
                    values[h] = raw;
                  }
                } else { values[h] = raw; }
              });
              if (gagal) { alert(gagal); return false; }
              return api('saveMasterRow', {sheet:sheet, rowIndex: existing? existing.rowIndex : 0, values: values}).then(function(r){
                if(!r.ok){ alert(r.error); throw new Error(r.error); }
                else muat();
              });
            });
            if (sheet==='RoleAkses') bindTambahMultiSantri('f_NISN_Anak', daftarSantri);
          }
          document.getElementById('btnTambahRow').onclick = function(){ bukaForm(null); };
          document.querySelectorAll('.btnEditM').forEach(function(btn){ btn.onclick = function(){ bukaForm(res.data.data.find(function(r){return r.rowIndex===Number(btn.dataset.row);})); }; });
          document.querySelectorAll('.btnDelM').forEach(function(btn){ btn.onclick = function(){ if(!confirm('Hapus baris ini?')) return; api('deleteMasterRow', {sheet:sheet, rowIndex:Number(btn.dataset.row)}).then(muat); }; });
        });
    }
    document.getElementById('pilihSheet').onchange = muat;
    muat();
  }

      c.innerHTML = '<div class="card"><h3>Rekap Jam Mengajar Guru</h3>' +

        '<div class="grid2">' + fieldAutocomplete('rgGuru','Nama Guru (kosongkan untuk semua)', daftarNamaGuru, '', 'Ketik nama guru atau kosongkan...') +
        '<div><div class="grid2"><div><label>Bulan</label><select id="rgBulan">' +
          [['1','Januari'],['2','Februari'],['3','Maret'],['4','April'],['5','Mei'],['6','Juni'],['7','Juli'],['8','Agustus'],['9','September'],['10','Oktober'],['11','November'],['12','Desember']]
            .map(function(m){return '<option value="'+m[0]+'" '+(Number(m[0])===now.getMonth()+1?'selected':'')+'>'+m[1]+'</option>';}).join('') + '</select></div>' +
        '<div><label>Tahun</label><input id="rgTahun" value="'+now.getFullYear()+'"></div></div></div></div>' +
        '<button id="btnRekapGuru">Tampilkan</button><button class="secondary" id="btnPdfRekapGuru">Download PDF</button>' +
        '<div id="hasilRekapGuru"></div></div>';

      var lastHasil = null, lastLabel = '';
      function muatRekap(){
        var rawGuru = document.getElementById('rgGuru').value.trim();
        var guru = rawGuru ? resolveGuruExact(rawGuru, daftarNamaGuru) : '';
        if (rawGuru && !guru) { document.getElementById('hasilRekapGuru').innerHTML = errBox('Nama guru tidak dikenali. Pilih salah satu saran yang muncul saat mengetik, atau kosongkan untuk lihat semua guru.'); return; }
        var bulan = document.getElementById('rgBulan').value, tahun = document.getElementById('rgTahun').value;
        document.getElementById('hasilRekapGuru').innerHTML = 'Memuat...';
        api('getRekapJamMengajarGuru', {pengampu:guru, bulan:bulan, tahun:tahun}).then(function(res){
          if(!res.ok){ document.getElementById('hasilRekapGuru').innerHTML = errBox(res.error); return; }
          var d = res.data;
          lastHasil = d; lastLabel = (guru||'Semua Guru') + ' - Bulan ' + bulan + '/' + tahun;
          if (d.mode === 'detail') {
            var html = '<h4>Riwayat Mengajar: '+esc(d.pengampu)+'</h4>';
            if (!d.riwayat.length) html += '<p class="muted">Belum ada riwayat mengajar pada bulan ini.</p>';
            else html += '<table><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Jam</th></tr>' +
              d.riwayat.map(function(r){return '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.jenis)+'</td><td>'+esc(r.keterangan)+'</td><td>'+r.jam+'</td></tr>';}).join('') + '</table>';
            html += '<p style="font-size:16px;margin-top:10px">Total Jam Mengajar: <b>'+d.totalJam+' jam</b></p>';
            document.getElementById('hasilRekapGuru').innerHTML = html;
          } else {
            var html2 = '<h4>Total Jam Mengajar Semua Guru &mdash; ' + ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][Number(bulan)-1] + ' ' + tahun + '</h4>';
            if (!d.daftar.length) html2 += '<p class="muted">Belum ada data mengajar pada bulan ini.</p>';
            else html2 += '<table><tr><th>Nama Guru</th><th>Total Jam</th></tr>' +
              d.daftar.map(function(r){return '<tr><td>'+esc(r.pengampu)+'</td><td><b>'+r.totalJam+' jam</b></td></tr>';}).join('') + '</table>';
            document.getElementById('hasilRekapGuru').innerHTML = html2;
          }
        });
      }
      document.getElementById('btnRekapGuru').onclick = muatRekap;
      document.getElementById('btnPdfRekapGuru').onclick = function(){
        if (!lastHasil) return alert('Tampilkan rekap dulu.');
        if (lastHasil.mode === 'detail') {
          api('generatePDF', {judul:'Rekap Jam Mengajar - '+lastLabel, kolom:['Tanggal','Jenis','Keterangan','Jam'],
            baris: lastHasil.riwayat.map(function(r){return [r.tanggal,r.jenis,r.keterangan,r.jam];})
          }).then(unduhPdf);
        } else {
          api('generatePDF', {judul:'Rekap Jam Mengajar - '+lastLabel, kolom:['Nama Guru','Total Jam'],
            baris: lastHasil.daftar.map(function(r){return [r.pengampu,r.totalJam];})
          }).then(unduhPdf);
        }
      };
      // Muat otomatis begitu halaman dibuka (semua guru, bulan berjalan) -- Mudir
      // langsung melihat rekap tanpa perlu menekan Tampilkan dulu.
      muatRekap();
    });
  }
