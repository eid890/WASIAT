      if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
      if(!res.data.length){ wrap.innerHTML = warnBox(res.peringatan); return; }
      var datalistHtml = ''; // select dropdown}).join('') + '</datalist>';
      var opsiHalaman = Array.from({length:22},function(_,i){return i+1;});
      var opsiNilai = Array.from({length:10},function(_,i){return (i+1)*10;});
      var html = datalistHtml + '<h4>Halaqoh: '+esc(namaHalaqoh)+' (' + esc(waktu) + ')</h4>' +
        warnBox('Isian akan otomatis terisi mengikuti riwayat terakhir santri untuk jenis hafalan yang dipilih -- tinggal ubah bagian yang berbeda saja (misalnya Ayat).') +
        '<div id="formHafalan">';
      res.data.forEach(function(s){
        html += '<div class="santriRowHafalan" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'">' +
          '<b>'+esc(s.nama)+'</b> <span class="muted">('+esc(s.nisn)+')</span><br>' +
          '<p class="faded hintHafalan">Memuat riwayat...</p>' +
          '<label class="muted">Jenis Hafalan</label>' +
          '<select class="jenisSelect">' + JENIS_HAFALAN_ALL.map(function(j){return '<option value="'+j+'">'+j+'</option>';}).join('') + '</select>' +
          '<div class="detailHafalan">' +
          '<label class="muted">Nama Surah</label>' +
          '<div class="surahPickerWrap" style="position:relative">' +
          '<input class="surahCari" placeholder="&#128269; Ketik nomor atau nama surah..." autocomplete="off" style="width:100%;margin-bottom:4px">' +
          '<select class="surahInput" size="1" style="width:100%"><option value="">-- Ketik di atas untuk cari --</option>' + QURAN_DB.map(function(s){return '<option value="'+esc(s[1])+'">'+s[0]+'. '+esc(s[1])+'</option>';}).join('') + '</select>' +
          '</div>' +
          '<div class="grid2">' +
          '<div><label class="muted">Ayat Dari</label>' +
          '<input class="ayatAwalInput" type="number" min="1" placeholder="1" style="width:100%"></div>' +
          '<div><label class="muted">Ayat Sampai</label>' +
          '<input class="ayatAkhirInput" type="number" min="1" placeholder="39" style="width:100%"></div>' +
          '</div>' +
          '<div class="grid2">' +
          '<div><label class="muted">Juz <span class="muted" style="font-weight:400;font-size:11px">(otomatis terisi)</span></label>' +
          '<input class="juzInput" type="number" min="1" max="30" placeholder="?" style="width:100%;background:#f8fafc;font-weight:600;color:#0d9488"></div>' +
          '<div><label class="muted">Halaman Dari <span class="muted" style="font-weight:400;font-size:11px">(otomatis)</span></label>' +
          '<input class="halamanAwalInput" type="number" min="1" max="604" placeholder="?" style="width:100%;background:#f8fafc;font-weight:600;color:#0d9488"></div>' +
          '</div>' +
          '<div style="margin-bottom:6px"><label class="muted">Halaman Sampai <span class="muted" style="font-weight:400;font-size:11px">(otomatis, bisa diubah manual)</span></label>' +
          '<input class="halamanAkhirInput" type="number" min="1" max="604" placeholder="?" style="width:100%;background:#f8fafc;font-weight:600;color:#0d9488"></div>' +
          '<label class="muted">Nilai Hafalan</label>' +
          '<select class="nilaiSelect"><option value="">-- Pilih Nilai --</option>' + opsiNilai.map(function(n){return '<option value="'+n+'">'+n+'</option>';}).join('') + '</select>' +
          '</div></div>';
      });
      html += '</div><button type="button" id="btnSimpanHafalan">Simpan Hafalan</button>' +
        '<button type="button" class="secondary" id="btnBatalHafalan">Batal</button><div id="pesanSimpanHafalan"></div>';
      wrap.innerHTML = html;

      function toggleDetail(row){
        var jenis = row.querySelector('.jenisSelect').value;
        row.querySelector('.detailHafalan').style.display = JENIS_HAFALAN_SETOR.indexOf(jenis) === -1 ? 'none' : 'block';
      }
      // Isi ulang seluruh field (surah/ayat/juz/halaman/nilai) sesuai riwayat TERAKHIR
      // untuk jenis hafalan yang sedang dipilih -- supaya pengampu tinggal mengubah
      // bagian yang berbeda saja (biasanya cuma Ayat/Halaman).
      function terapkanRiwayat(row, jenis){
        var santri = res.data.find(function(d){ return d.nisn === row.dataset.nisn; });
        var t = santri && santri.terakhirPerJenis ? santri.terakhirPerJenis[jenis] : null;
        var hintEl = row.querySelector('.hintHafalan');
        hintEl.textContent = t
          ? ('Terakhir ('+jenis+', '+t.tanggal+'): '+(t.surah||'-')+' ayat '+(t.ayat||'-')+', Juz '+(t.juz||'-')+', Hal. '+(t.halamanKe||'-')+(t.nilai!=null&&t.nilai!==''?(', Nilai '+t.nilai):''))
          : ('Belum ada riwayat "'+jenis+'" untuk santri ini.');
        if (JENIS_HAFALAN_SETOR.indexOf(jenis) === -1) return;
        var ayatRange = parseRange(t ? t.ayat : '');
        var halamanRange = parseRange(t ? t.halamanKe : '');
        row.querySelector('.surahInput').value = t ? (t.surah||'') : '';
        // Sinkron search box dengan nilai dari riwayat
        var cariEl = row.querySelector('.surahCari');
        if (cariEl && t && t.surah) {
          var opsi = row.querySelector('.surahInput').options;
          var found = Array.from(opsi).find(function(o){return o.value===t.surah;});
          cariEl.value = found ? found.text : t.surah;
          cariEl.style.borderColor = found ? '#0d9488' : '';
        } else if (cariEl) { cariEl.value = ''; cariEl.style.borderColor=''; }
        row.querySelector('.ayatAwalInput').value = ayatRange.awal;
        row.querySelector('.ayatAkhirInput').value = ayatRange.akhir;
        // Isi juz dan halaman dari riwayat, tapi kalau ada data surah baru langsung hitung otomatis
        var juzInput = row.querySelector('.juzInput');
        var halAwalInput = row.querySelector('.halamanAwalInput');
        var halAkhirInput = row.querySelector('.halamanAkhirInput');
        if (t && t.juz) juzInput.value = String(t.juz);
        if (halamanRange.awal) halAwalInput.value = halamanRange.awal;
        if (halamanRange.akhir) halAkhirInput.value = halamanRange.akhir;
        row.querySelector('.nilaiSelect').value = (t && t.nilai!=null && t.nilai!=='') ? String(t.nilai) : '';
      }

      // ---- Fungsi auto-isi Juz dan Halaman ----
      function autoIsiJuzHalaman(row) {
        var surah = row.querySelector('.surahInput').value.trim();
        var ayatAwal = row.querySelector('.ayatAwalInput').value;
        var ayatAkhir = row.querySelector('.ayatAkhirInput').value;
        if (!surah) return;
        var juzInput = row.querySelector('.juzInput');
        var halAwalInput = row.querySelector('.halamanAwalInput');
        var halAkhirInput = row.querySelector('.halamanAkhirInput');

        // Hitung juz berdasarkan ayat awal
        if (ayatAwal) {
          var juz = hitungJuzDariAyat(surah, ayatAwal);
          if (juz) {
            juzInput.value = juz;
            juzInput.style.color = '#0d9488';
          }
        }
        // Hitung halaman berdasarkan ayat awal dan akhir
        if (ayatAwal) {
          var halAwal = hitungHalamanDariAyat(surah, ayatAwal);
          if (halAwal) {
            halAwalInput.value = halAwal;
            halAwalInput.style.color = '#0d9488';
          }
        }
        if (ayatAkhir) {
          var halAkhir = hitungHalamanDariAyat(surah, ayatAkhir);
          if (halAkhir) {
            halAkhirInput.value = halAkhir;
            halAkhirInput.style.color = '#0d9488';
          }
        }
        // Kalau halaman awal dan akhir sama, biarkan saja (1 halaman)
        // Kalau tidak ada surah yang cocok, biarkan input kosong untuk diisi manual
        // surah dipilih dari select -- selalu valid
      }

      wrap.querySelectorAll('.santriRowHafalan').forEach(function(row){
        var jenisAwal = row.querySelector('.jenisSelect').value;
        toggleDetail(row);
        terapkanRiwayat(row, jenisAwal);

        // Auto-isi saat surah atau ayat berubah
        var surahEl = row.querySelector('.surahInput');
        var surahCari = row.querySelector('.surahCari');
        var ayatAwalEl = row.querySelector('.ayatAwalInput');
        var ayatAkhirEl = row.querySelector('.ayatAkhirInput');
        function onSurahAyatChange(){ autoIsiJuzHalaman(row); }

        // Search filter surah real-time
        if (surahCari) {
          surahCari.addEventListener('input', function(){
            var q = this.value.toLowerCase().trim();
            var opsi = surahEl.options;
            var matches = [];
            for (var i=1;i<opsi.length;i++) {
              var teks = opsi[i].text.toLowerCase();
              var nilai = opsi[i].value.toLowerCase();
              var cocok = !q ||
                teks.indexOf(q) !== -1 ||
                teks.replace(/^\d+\.\s*/,'').indexOf(q) !== -1 ||
                nilai.indexOf(q) !== -1;
              opsi[i].hidden = !cocok;
              if (cocok) matches.push(i);
            }
            // Auto-pilih jika hanya 1 hasil cocok
            if (matches.length === 1) {
              surahEl.selectedIndex = matches[0];
              surahCari.style.borderColor = '#0d9488';
              surahCari.value = surahEl.options[matches[0]].text;
              onSurahAyatChange();
            } else {
              surahCari.style.borderColor = q && matches.length === 0 ? '#dc2626' : '';
              if (!q) { // Reset filter kalau kosong
                for (var i=1;i<opsi.length;i++) opsi[i].hidden = false;
              }
            }
          });
        }

        // Saat pilih dari select, sinkron ke search box
        surahEl.addEventListener('change', function(){
          if (this.value && surahCari) {
            var terpilih = surahEl.options[surahEl.selectedIndex];
            surahCari.value = terpilih ? terpilih.text : '';
            surahCari.style.borderColor = '#0d9488';
            // Reset hidden semua option
            Array.from(surahEl.options).forEach(function(o){o.hidden=false;});
          }
          onSurahAyatChange();
        });

        ayatAwalEl.addEventListener('input', onSurahAyatChange);
        ayatAkhirEl.addEventListener('input', onSurahAyatChange);

        row.querySelector('.jenisSelect').onchange = function(){
          toggleDetail(row);
          terapkanRiwayat(row, row.querySelector('.jenisSelect').value);
        };
      });

      // Pulihkan draft yang belum sempat tersimpan (kalau ada) -- didahulukan dari
      // isian riwayat otomatis di atas, karena draft berarti ada pekerjaan yang
      // sedang berjalan dan belum sempat diklik Simpan.
      var draftKey = draftHafalanKey(namaHalaqoh, waktu, tanggal, STATE.user.nama);
      var draft = ambilDraftHafalan(draftKey);
      if (draft) {
        wrap.querySelectorAll('.santriRowHafalan').forEach(function(row){
          var d = draft[row.dataset.nisn];
          if (!d) return;
          row.querySelector('.jenisSelect').value = d.jenis;
          toggleDetail(row);
          row.querySelector('.surahInput').value = d.surah || '';
          row.querySelector('.ayatAwalInput').value = d.ayatAwal || '';
          row.querySelector('.ayatAkhirInput').value = d.ayatAkhir || '';
          if (d.juz) if (d.juz) row.querySelector('.juzInput').value = d.juz;
          if (d.halamanAwal) row.querySelector('.halamanAwalInput').value = d.halamanAwal;
          if (d.halamanAkhir) row.querySelector('.halamanAkhirInput').value = d.halamanAkhir;
          row.querySelector('.nilaiSelect').value = d.nilai || '';
        });
        document.getElementById('pesanSimpanHafalan').innerHTML = warnBox('Isian yang belum sempat tersimpan sebelumnya berhasil dipulihkan otomatis. Silakan lanjutkan dan klik Simpan.');
      }

      // Simpan draft otomatis ke localStorage tiap ada perubahan pada form (di-debounce
      // 500ms supaya tidak menulis berkali-kali tiap ketikan) -- ini TIDAK mengirim apa
      // pun ke server, murni tersimpan di perangkat sendiri sampai benar-benar diklik
      // "Simpan Hafalan".
      var simpanDraftDebounced = debounce(function(){ simpanDraftHafalan(draftKey); }, 500);
      document.getElementById('formHafalan').addEventListener('input', simpanDraftDebounced);
      document.getElementById('formHafalan').addEventListener('change', simpanDraftDebounced);

      document.getElementById('btnBatalHafalan').onclick = function(){ hapusDraftHafalan(draftKey); guruIsiHafalan(); };
      document.getElementById('btnSimpanHafalan').onclick = function(){
        var items = [];
        var adaError = false;
        document.querySelectorAll('#formHafalan > div').forEach(function(row){
          var jenis = row.querySelector('.jenisSelect').value;
          var it = {nisn: row.dataset.nisn, nama: row.dataset.nama, jenisHafalan: jenis};
          if (JENIS_HAFALAN_SETOR.indexOf(jenis) !== -1) {
            var ayatAwal = row.querySelector('.ayatAwalInput').value.trim();
            var ayatAkhir = row.querySelector('.ayatAkhirInput').value.trim();
            if (ayatAwal && ayatAkhir && Number(ayatAkhir) < Number(ayatAwal)) { adaError = true; }
            it.surah = row.querySelector('.surahInput').value;
            it.ayat = ayatAwal && ayatAkhir ? (ayatAwal + ' - ' + ayatAkhir) : ayatAwal;
            it.juz = row.querySelector('.juzInput').value;
            it.nilai = row.querySelector('.nilaiSelect').value;
            var halamanAwal = row.querySelector('.halamanAwalInput').value;
            var halamanAkhir = row.querySelector('.halamanAkhirInput').value || halamanAwal;
            if (halamanAkhir && halamanAwal && Number(halamanAkhir) < Number(halamanAwal)) { adaError = true; }
            it.halamanKe = (!halamanAkhir || halamanAwal === halamanAkhir) ? halamanAwal : (halamanAwal + ' - ' + halamanAkhir);
          }
          items.push(it);
        });
        if (adaError) { document.getElementById('pesanSimpanHafalan').innerHTML = errBox('Ada isian rentang yang terbalik (nilai "sampai" lebih kecil dari "dari"). Periksa kembali Ayat dan Halaman sebelum menyimpan.'); return; }
        var btn = document.getElementById('btnSimpanHafalan'); btn.disabled = true; btn.innerText = 'Menyimpan...';
        api('submitHafalan', {tanggal: document.getElementById('hfTanggal').value, waktu: waktu, halaqoh: namaHalaqoh, pengampu: STATE.user.nama, items: items})
          .then(function(res2){
            if(!res2.ok){ document.getElementById('pesanSimpanHafalan').innerHTML = errBox(res2.error); btn.disabled=false; btn.innerText='Simpan Hafalan'; return; }
            if(res2.offline){ document.getElementById('pesanSimpanHafalan').innerHTML='<div style="background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:13px">'+res2.pesanOffline+'</div>'; btn.disabled=false; btn.innerText='Simpan Hafalan'; return; }
            hapusDraftHafalan(draftKey);
            alert('Hafalan tersimpan (baru: '+res2.ditambah+', diperbarui: '+res2.diupdate+').');
            guruIsiHafalan();
          });
      };
    });
  }

  // Modal untuk membetulkan kesalahan pencatatan hafalan (bukan menghapus & catat ulang)
  function bukaEditHafalan(row, muatUlang){
    var ayatRange = parseRange(row.ayat);
    var halamanRange = parseRange(row.halamanKe);
    var opsiHalaman = Array.from({length:22},function(_,i){return i+1;});
    var datalistHtml = '<datalist id="editDaftarSurah">' + DAFTAR_SURAH.map(function(s){return '<option value="'+esc(s)+'">';}).join('') + '</datalist>';
    var fieldsHtml = datalistHtml +
      fieldSelect('ehJenis','Jenis Hafalan', JENIS_HAFALAN_ALL, row.jenis) +
      '<div id="ehDetailWrap">' +
      '<label class="muted">Nama Surah</label><input id="ehSurah" list="editDaftarSurah" value="'+esc(row.surah||'')+'">' +
      '<div class="grid2">' +
      '<div><label class="muted">Ayat (dari - sampai)</label><div style="display:flex;align-items:center;gap:6px">' +
      '<input id="ehAyatAwal" type="number" min="1" style="flex:1" value="'+esc(ayatRange.awal)+'"><span>-</span><input id="ehAyatAkhir" type="number" min="1" style="flex:1" value="'+esc(ayatRange.akhir)+'"></div></div>' +
      '<div><label class="muted">Juz</label><select id="ehJuz">' + Array.from({length:30},function(_,i){return i+1;}).map(function(j){return '<option value="'+j+'" '+(Number(row.juz)===j?'selected':'')+'>'+j+'</option>';}).join('') + '</select></div>' +
      '</div>' +
      '<label class="muted">Halaman (dari - sampai)</label><div style="display:flex;align-items:center;gap:6px">' +
      '<select id="ehHalAwal">' + opsiHalaman.map(function(h){return '<option value="'+h+'" '+(String(h)===halamanRange.awal?'selected':'')+'>'+h+'</option>';}).join('') + '</select>' +
      '<span>-</span>' +
      '<select id="ehHalAkhir">' + opsiHalaman.map(function(h){return '<option value="'+h+'" '+(String(h)===halamanRange.akhir?'selected':'')+'>'+h+'</option>';}).join('') + '</select>' +
      '</div>' +
      '<label class="muted">Nilai Hafalan</label><select id="ehNilai"><option value="">-- Tidak diisi --</option>' +
      Array.from({length:10},function(_,i){return (i+1)*10;}).map(function(n){return '<option value="'+n+'" '+(String(row.nilai)===String(n)?'selected':'')+'>'+n+'</option>';}).join('') + '</select>' +
      '</div>';
    var modal = openModal('Edit Riwayat Hafalan - '+row.nama, fieldsHtml, function(m){
      var jenisBaru = m.querySelector('#ehJenis').value;
      var payload = {rowIndex: row.rowIndex, jenisHafalan: jenisBaru};
      if (JENIS_HAFALAN_SETOR.indexOf(jenisBaru) !== -1) {
        payload.surah = m.querySelector('#ehSurah').value;
        var aAwal = m.querySelector('#ehAyatAwal').value, aAkhir = m.querySelector('#ehAyatAkhir').value;
        payload.ayat = (aAwal && aAkhir) ? (aAwal+' - '+aAkhir) : aAwal;
        payload.juz = m.querySelector('#ehJuz').value;
        var hAwal = m.querySelector('#ehHalAwal').value, hAkhir = m.querySelector('#ehHalAkhir').value;
        payload.halamanKe = (hAwal === hAkhir) ? hAwal : (hAwal+' - '+hAkhir);
        payload.nilai = m.querySelector('#ehNilai').value;
      } else {
        payload.surah=''; payload.ayat=''; payload.juz=''; payload.halamanKe=''; payload.nilai='';
      }
      api('updateHafalan', payload).then(function(r){ if(!r.ok) alert(r.error); else muatUlang(); });
    });
    function toggleDetail(){
      var jenis = modal.querySelector('#ehJenis').value;
      modal.querySelector('#ehDetailWrap').style.display = JENIS_HAFALAN_SETOR.indexOf(jenis)===-1 ? 'none' : 'block';
    }
    modal.querySelector('#ehJenis').onchange = toggleDetail;
    toggleDetail();
  }

            res.data.map(function(d,i){return '<tr><td class="center">'+(i+1)+'</td><td>'+esc(d.nama)+'</td><td class="center">'+d.total+'</td><td class="center">'+d.hadir+'</td><td class="center">'+d.sakit+'</td><td class="center">'+d.izin+'</td><td class="center bold">'+d.alpa+'</td><td class="center bold">'+d.persenHadir+'%</td></tr>';}).join('')+

  // ---- Progress & Rekap Hafalan Halaqoh ----
  function guruProgressHafalan(){
    var c = document.getElementById(STATE._contentId||'dg-content');
    c.innerHTML='<p>Memuat...</p>';
    // Ambil halaqoh yang dimiliki guru ini
    api('getHalaqohGuru',{pengampu:STATE.user.nama, waktu:'Subuh'}).then(function(resH){
      // Coba semua waktu kalau subuh kosong
      api('getSantriHalaqohGuru',{pengampu:STATE.user.nama}).then(function(resHAll){
        var halaqohList = resHAll.ok ? resHAll.data : [];
        if (!halaqohList.length) { c.innerHTML='<div class="card">'+warnBox('Anda belum memiliki halaqoh. Hubungi Admin.')+'</div>'; return; }

        var html='<div class="card"><h3>&#128337; Progress Hafalan Halaqoh</h3>'+
          '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">';

        // Tab per halaqoh
        halaqohList.forEach(function(h,i){
          html+='<button class="'+(i===0?'':'secondary ')+'small btnTabHalaqoh" data-halaqoh="'+esc(h.namaHalaqoh)+'">'+esc(h.namaHalaqoh)+'</button>';
        });
        html+='</div></div><div id="progressHalaqohContent">Klik halaqoh untuk lihat.</div>';
        c.innerHTML=html;

        function muatProgress(namaHalaqoh){
          document.getElementById('progressHalaqohContent').innerHTML='<p>Memuat...</p>';
          Promise.all([
            api('getRingkasanHalaqohHariIni',{namaHalaqoh:namaHalaqoh}),
            api('getRekapHafalanHalaqoh',{namaHalaqoh:namaHalaqoh})
          ]).then(function(hasil){
            var resRing=hasil[0], resRekap=hasil[1];
            var ring=resRing.ok?resRing.data:{total:0,setor:0,belum:0,persen:0,daftarBelum:[]};
            var rekap=resRekap.ok?resRekap.data:[];

            var pct=ring.persen;
            var warnaBar=pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626';

            document.getElementById('progressHalaqohContent').innerHTML=
              '<div class="card"><h4>&#128337; Status Hari Ini &mdash; '+esc(namaHalaqoh)+'</h4>'+
              '<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px">'+
              '<span><b>'+ring.setor+'</b> dari <b>'+ring.total+'</b> santri sudah setor</span>'+
              '<span style="font-size:20px;font-weight:800;color:'+warnaBar+'">'+pct+'%</span></div>'+
              '<div style="background:#e2e8f0;border-radius:8px;height:14px"><div style="background:'+warnaBar+';width:'+pct+'%;height:100%;border-radius:8px;transition:width .5s"></div></div>'+
              (ring.daftarBelum.length?
                '<div style="margin-top:10px"><b style="font-size:13px">Belum setor hari ini:</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'+
                ring.daftarBelum.map(function(b){return '<span style="background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:3px 10px;font-size:12.5px">'+esc(b.nama)+'</span>';}).join('')+
                '</div></div>':
                '<p style="color:#16a34a;font-weight:600;margin-top:8px">&#10004; Semua santri sudah setor hari ini!</p>')+
              '</div>'+

              (rekap.length?
                '<div class="card"><h4>Rekap Progress Hafalan (Semua Waktu)</h4>'+
                '<table><tr><th>Nama Santri</th><th>Total Sesi</th><th>Setoran</th><th>Murojaah</th><th>Juz Terakhir</th><th>Surah Terakhir</th><th>Nilai Rata</th></tr>'+
                rekap.map(function(r){
                  var warnaS=r.nilaiRata>=80?'#16a34a':r.nilaiRata>=60?'#d97706':'#dc2626';
                  return '<tr><td><b>'+esc(r.nama)+'</b></td><td style="text-align:center">'+r.totalSesi+'</td>'+
                    '<td style="text-align:center;color:#0d9488">'+r.totalSetor+'</td>'+
                    '<td style="text-align:center;color:#64748b">'+r.totalMurojaah+'</td>'+
                    '<td style="text-align:center">'+esc(r.juzTerakhir?'Juz '+r.juzTerakhir:'-')+'</td>'+
                    '<td style="font-size:12px">'+esc(r.surahTerakhir||'-')+'</td>'+
                    '<td style="color:'+warnaS+';font-weight:700">'+esc(r.nilaiRata||'-')+'</td></tr>';
                }).join('')+'</table></div>':
                '<div class="card"><p class="muted">Belum ada data hafalan untuk halaqoh ini.</p></div>');
          });
        }

        // Binding tab
        c.querySelectorAll('.btnTabHalaqoh').forEach(function(btn){
          btn.onclick=function(){
            c.querySelectorAll('.btnTabHalaqoh').forEach(function(b){ b.classList.add('secondary'); });
            btn.classList.remove('secondary');
            muatProgress(btn.dataset.halaqoh);
          };
        });

        // Muat halaqoh pertama otomatis
        if (halaqohList.length) muatProgress(halaqohList[0].namaHalaqoh);
      });
    });
  }

  function guruRiwayatHafalan(){

      var daftarSantri = hasil[1].ok ? hasil[1].data : [];
      c.innerHTML = '<div class="card"><div class="grid2">' +
        '<div>' + fieldAutocomplete('filHalaqoh','Filter Halaqoh', daftarHalaqoh, '', 'kosongkan utk semua') + '</div>' +
        '<div>' + fieldAutocomplete('filNisnH','Filter Santri', daftarSantri.map(labelSantri), '', 'kosongkan utk semua') + '</div></div>' +

      function cari(){
        if (!setHtmlSafe('riwayatHTable', 'Memuat...')) return;
        var rawNisn = document.getElementById('filNisnH') ? document.getElementById('filNisnH').value : '';
        var nisnResolved = rawNisn ? (resolveSantriNisn(rawNisn, daftarSantri) || rawNisn) : '';
        api('getRiwayatHafalan', {pengampu: STATE.user.nama, halaqoh: document.getElementById('filHalaqoh') ? document.getElementById('filHalaqoh').value : '', nisn: nisnResolved})
          .then(function(res){
            if (!document.getElementById('riwayatHTable')) return;
            if(!res.ok){ setHtmlSafe('riwayatHTable', errBox(res.error)); return; }
            if(!res.data.length){ setHtmlSafe('riwayatHTable', '<p class="muted">Belum ada data.</p>'); return; }
            var html = '<table><tr><th>Tanggal</th><th>Waktu</th><th>Nama</th><th>Jenis</th><th>Surah/Ayat/Juz/Hal</th><th>Nilai</th><th>Aksi</th></tr>';
            res.data.forEach(function(r){
              var detail = JENIS_HAFALAN_SETOR.indexOf(r.jenis)!==-1 ? (esc(r.surah)+' : '+esc(r.ayat)+', Juz '+esc(r.juz)+', Hal '+esc(r.halamanKe)) : '-';
              html += '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.waktu)+'</td><td>'+esc(r.nama)+'</td><td>'+badgeJenisHafalan(r.jenis)+'</td><td>'+detail+'</td><td>'+(r.nilai!=null&&r.nilai!==''?esc(r.nilai):'-')+'</td>' +
                '<td><button class="small btnEditH" data-row="'+r.rowIndex+'">Edit</button> <button class="small danger btnHapusH" data-row="'+r.rowIndex+'">Hapus</button></td></tr>';
            });
            html += '</table>';
            if (!setHtmlSafe('riwayatHTable', html)) return;
            document.querySelectorAll('.btnEditH').forEach(function(btn){
              btn.onclick = function(){ bukaEditHafalan(res.data.find(function(r){return r.rowIndex===Number(btn.dataset.row);}), cari); };
            });
            document.querySelectorAll('.btnHapusH').forEach(function(btn){
              btn.onclick = function(){ if(!confirm('Hapus catatan hafalan ini?')) return; api('deleteHafalan', {rowIndex: Number(btn.dataset.row)}).then(cari); };
            });
          });
      }
      document.getElementById('btnCariRiwayatH').onclick = cari;
      cari();
    });
  }

  function muatFormNilai(mapel, kelas, jenisNilai, tanggal){
    var wrap = document.getElementById('formNilaiWrap');
    wrap.innerHTML = '<p>Memuat santri kelas '+esc(kelas)+'...</p>';
    api('getSantriUntukAbsen', {kelas: kelas}).then(function(res){
      if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
      if(!res.data.length){ wrap.innerHTML = warnBox(res.peringatan || ('Belum ada santri di kelas "'+kelas+'".')); return; }
      var html = '<h4>'+esc(mapel)+' - '+esc(kelas)+' ('+esc(jenisNilai)+')</h4><div id="formNilai">';
      res.data.forEach(function(s){
        html += '<div class="santriRowAbsen" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'">' +
          '<b>'+esc(s.nama)+'</b> <span class="muted">('+esc(s.nisn)+')</span><br>' +
          '<input type="number" class="nilaiInput" min="0" max="100" placeholder="Nilai 0-100">' +
          '</div>';
      });
      html += '</div><button type="button" id="btnSimpanNilai">Simpan Nilai</button>' +
        '<button type="button" class="secondary" id="btnBatalNilai">Batal</button><div id="pesanSimpanNilai"></div>';
      wrap.innerHTML = html;
      document.getElementById('btnBatalNilai').onclick = guruInputNilai;
      document.getElementById('btnSimpanNilai').onclick = function(){
        var items = [];
        document.querySelectorAll('#formNilai > div').forEach(function(row){
          var v = row.querySelector('.nilaiInput').value;
          if (v !== '') items.push({nisn: row.dataset.nisn, nama: row.dataset.nama, nilai: v});
        });
        if(!items.length){ alert('Isi minimal satu nilai santri.'); return; }
        var btn = document.getElementById('btnSimpanNilai'); btn.disabled = true; btn.innerText = 'Menyimpan...';

  // Export Excel (CSV)
  function excelRaporNilai(data, mapel, kelas, maxT, maxK){
    var bom='\uFEFF';
    var header1=['NO','Nama Santri'];
    for(var i=1;i<=maxT;i++) header1.push('T'+i);
    header1.push('Rata-Rata','UTS','Kehadiran','UAS','NPR');
    for(var i=1;i<=maxK;i++) header1.push('K'+i);
    header1.push('NKR','Total Sikap','Nilai Sikap','Rata Sikap','Huruf');

    var rows=[header1];
    data.forEach(function(d,i){
      var row=[i+1,d.nama];
      for(var j=0;j<maxT;j++) row.push(d.tugas[j]!==undefined?d.tugas[j]:'');
      row.push(d.ratatugas,d.uts,d.kehadiran,d.uas,d.npr);
      for(var j=0;j<maxK;j++) row.push(d.keterampilan[j]!==undefined?d.keterampilan[j]:'');
      row.push(d.nkr, d.totalPoinSikap||0, d.nilaiMax||0, d.nilaiSikapRapor||0, d.huruf);
      rows.push(row);
    });
    // Info tambahan di bawah
    rows.push([]);
    rows.push(['Mapel',mapel,'','Kelas',kelas,'','Pengampu',STATE.user.nama]);
    rows.push(['Formula NPR','Rata-Rata x35% + UTS x25% + UAS x30% + Kehadiran x10%']);

    var csv=bom+rows.map(function(r){
      return r.map(function(v){
        var s=String(v==null?'':v);
        if(s.includes(','))s='"'+s.replace(/"/g,'""')+'"';
        return s;
      }).join(',');
    }).join('\n');

    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='Rekap_Nilai_'+mapel.replace(/\s+/g,'_')+'_'+kelas+'_'+todayStr()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  // =====================================================================
  // DASHBOARD WALI SANTRI
  // =====================================================================
  // Kartu ringkasan paling atas dashboard Wali Santri -- 4 info penting sekaligus
  // (saldo kantin, persentase kehadiran 7 hari, pelanggaran 7 hari, tunggakan SPP)
  // supaya orang tua langsung tahu kondisi anaknya tanpa perlu scroll.
  function muatRingkasanWali(nisn){
    var wrap = document.getElementById('dw-ringkasan');
    wrap.innerHTML = '<div class="ringkasan-grid">' +
      '<div class="ringkasan-tile"><div class="ico">&#128176;</div><div class="nilai">...</div><div class="label">Saldo Kantin</div></div>' +
      '<div class="ringkasan-tile"><div class="ico">&#128202;</div><div class="nilai">...</div><div class="label">Kehadiran 7 Hari</div></div>' +
      '<div class="ringkasan-tile"><div class="ico">&#9888;&#65039;</div><div class="nilai">...</div><div class="label">Pelanggaran 7 Hari</div></div>' +
      '<div class="ringkasan-tile"><div class="ico">&#128179;</div><div class="nilai">...</div><div class="label">Tunggakan SPP</div></div>' +
      '</div>';

    Promise.all([
      api('getSaldoSantriKantin', {nisn:nisn}),
      api('getNotifikasiMingguan', {nisn:nisn}),
      api('getRiwayatPelanggaranSantri', {nisn:nisn}),
      api('getSppSaya', {nisn:nisn})
    ]).then(function(hasil){
      var resSaldo = hasil[0], resAbsen = hasil[1], resPel = hasil[2], resSpp = hasil[3];

      // -- Saldo Kantin --
      var saldoHtml, saldoWarna = '';
      if (resSaldo.ok) {
        saldoHtml = 'Rp'+resSaldo.data.saldo.toLocaleString('id-ID');
      } else { saldoHtml = '-'; }

      // -- Persentase Kehadiran 7 hari terakhir --
      var persenHtml = '-', persenWarna = '', subKehadiran = '';
      if (resAbsen.ok) {
        var r = resAbsen.data.rekap;
        var total = (r.Hadir||0)+(r.Sakit||0)+(r.Izin||0)+(r.Alpa||0);
        var persen = total>0 ? Math.round((r.Hadir||0)/total*100) : 0;
        persenHtml = persen+'%';
        persenWarna = persen>=90 ? 'warna-hijau' : (persen>=75 ? 'warna-amber' : 'warna-merah');
        subKehadiran = 'Hadir '+(r.Hadir||0)+' dari '+total+' hari';
      }

      // -- Pelanggaran 7 hari terakhir --
      var jmlPelMingguIni = 0, pelWarna = 'warna-hijau';
      if (resPel.ok) {
        var batas7Hari = new Date(); batas7Hari.setDate(batas7Hari.getDate()-7);
        var batas7Str = todayStrDari(batas7Hari);
        jmlPelMingguIni = resPel.data.filter(function(x){ return x.pelanggaran!=='-' && x.tanggal >= batas7Str; }).length;
        pelWarna = jmlPelMingguIni > 0 ? 'warna-merah' : 'warna-hijau';
      }

      // -- Tunggakan SPP --
      var tunggakanHtml = '-', tunggakanSub = '', sppWarna = 'warna-hijau';
      if (resSpp.ok) {
        if (!resSpp.data.adaSpp) { tunggakanHtml = '-'; tunggakanSub = 'Belum terdaftar SPP'; }
        else if (resSpp.data.bulanTunggakan.length === 0) { tunggakanHtml = 'Rp0'; tunggakanSub = 'Semua lunas &#10003;'; sppWarna = 'warna-hijau'; }
        else { tunggakanHtml = 'Rp'+resSpp.data.totalTunggakan.toLocaleString('id-ID'); tunggakanSub = resSpp.data.bulanTunggakan.length+' bulan menunggak'; sppWarna = 'warna-merah'; }
      }

      wrap.innerHTML = '<div class="ringkasan-grid">' +
        '<div class="ringkasan-tile"><div class="ico">&#128176;</div><div class="nilai">'+saldoHtml+'</div><div class="label">Saldo Kantin</div></div>' +
        '<div class="ringkasan-tile '+persenWarna+'"><div class="ico">&#128202;</div><div class="nilai">'+persenHtml+'</div><div class="label">Kehadiran 7 Hari</div><div class="sub">'+subKehadiran+'</div></div>' +
        '<div class="ringkasan-tile '+pelWarna+'"><div class="ico">&#9888;&#65039;</div><div class="nilai">'+jmlPelMingguIni+'</div><div class="label">Pelanggaran 7 Hari</div></div>' +
        '<div class="ringkasan-tile '+sppWarna+'"><div class="ico">&#128179;</div><div class="nilai">'+tunggakanHtml+'</div><div class="label">Tunggakan SPP</div><div class="sub">'+tunggakanSub+'</div></div>' +
        '</div>';
    });

  function todayStrDari(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  // ---------------- SPP SANTRI (dipakai Bendahara & Admin/Mudir) ----------------
  var BULAN_SINGKAT_SPP = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  function labelBulanSingkatSpp(idx, tahunMasuk){
    var yearOffset = Math.floor((idx-1)/12);
    var mi = (idx-1)%12;
    return BULAN_SINGKAT_SPP[mi] + " '" + String(parseInt(tahunMasuk)+yearOffset).slice(2);
  }
  function bulanJatuhTempoSppFE(tahunMasuk){
    var today = new Date(); var max = 0;
    for (var m=1; m<=36; m++){
      var d = new Date(parseInt(tahunMasuk), m-1, 1);
      if (d <= today) max = m; else break;
    }
    return max;
  }

  function renderSppSantri(containerId){
    var c = document.getElementById(containerId);
    c.innerHTML = '<p>Memuat data SPP...</p>';
    // Cek apakah ini dashboard Bendahara (tampilkan tab tambahan)
    var isBendahara = STATE.user && (STATE.user.level==='Bendahara'||STATE.user.level==='Admin'||STATE.user.level==='Mudir');

    Promise.all([api('getSppList', {}), api('getSantriUntukTransaksiKantin', {}), api('getTunggakanSantri',{})]).then(function(hasil){
      var res = hasil[0], resSantri = hasil[1], resTg = hasil[2];
      if(!res.ok){ c.innerHTML = errBox(res.error); return; }
      var data = res.data;
      var daftarSantri = resSantri.ok ? resSantri.data : [];
      var tunggakan = resTg.ok ? resTg.data : [];

      var totalSantri = data.length, totalDue = 0, totalPaid = 0, totalTunggakanRp = 0;
      data.forEach(function(s){
        var due = bulanJatuhTempoSppFE(s.tahunMasuk);
        for (var m=1; m<=due; m++){ totalDue++; if (s.months[m-1]) totalPaid++; else totalTunggakanRp += s.biaya; }
      });
      var pct = totalDue>0 ? Math.round((totalPaid/totalDue)*100) : 0;

      var html = '<div class="card"><h3>SPP Santri</h3>' +
        warnBox('Klik sel bulan pada tabel untuk menandai LUNAS / batalkan. WA konfirmasi otomatis terkirim ke wali santri.') +
        '<div class="ringkasan-grid" style="margin-top:10px">' +
        '<div class="ringkasan-tile warna-hijau"><div class="ico">&#128101;</div><div class="nilai">'+totalSantri+'</div><div class="label">Terdaftar SPP</div></div>' +
        '<div class="ringkasan-tile '+(pct>=80?'warna-hijau':'warna-amber')+'"><div class="ico">&#9989;</div><div class="nilai">'+pct+'%</div><div class="label">Lunas Bulan Berjalan</div></div>' +
        '<div class="ringkasan-tile warna-merah"><div class="ico">&#9888;&#65039;</div><div class="nilai">'+tunggakan.length+'</div><div class="label">Santri Menunggak</div></div>' +
        '<div class="ringkasan-tile warna-merah"><div class="ico">&#128179;</div><div class="nilai">'+rupiah(totalTunggakanRp)+'</div><div class="label">Total Tunggakan</div></div>' +
        '</div></div>';

      // Panel tunggakan dengan kirim WA (khusus Bendahara/Admin/Mudir)
      if (isBendahara && tunggakan.length) {
        html += '<div class="card"><h3>&#9888;&#65039; Daftar Santri Menunggak</h3>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
          '<input id="cariTunggakan" placeholder="Cari nama..." style="flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:8px">' +
          '<button class="secondary small" id="btnKirimWASemuaTunggak">&#128242; Kirim WA ke Semua Menunggak</button>' +
          '</div>' +
          '<div id="listTunggakan">' +
          '<table><tr><th>Nama</th><th>Jumlah Bulan</th><th>Total Tunggakan</th><th>Bulan</th><th>Aksi</th></tr>' +
          tunggakan.map(function(t){
            return '<tr class="rowTunggakan" data-nama="'+esc(t.nama.toLowerCase())+'">' +
              '<td><b>'+esc(t.nama)+'</b></td>' +
              '<td style="text-align:center">'+t.jumlahBulan+' bln</td>' +
              '<td style="color:#dc2626;font-weight:700">'+rupiah(t.tunggakanSPP)+'</td>' +
              '<td style="font-size:11.5px;color:#64748b">'+t.bulanTunggak.slice(0,3).join(', ')+(t.bulanTunggak.length>3?'...':'')+'</td>' +
              '<td><button class="small btnKirimWATunggak" data-nisn="'+esc(t.nisn)+'" data-nama="'+esc(t.nama)+'">&#128242; WA</button></td></tr>';
          }).join('')+'</table></div></div>';
      }

      // Form Atur Biaya + Import + Tabel 36 bulan (sudah ada sebelumnya, tetap ada)
      html += '<div class="card"><h3>Import Data SPP Massal (dari Excel/Sistem Lama)</h3>' +
        warnBox('Santri dicocokkan berdasarkan NAMA. Format: ID, NAMA, NoHP, BiayaSPP, TahunMasuk, 36 kolom bulan — atau format ringkas: NAMA, BiayaSPP, 36 kolom bulan.') +
        '<textarea id="sppImportTextarea" rows="4" placeholder="Tempel data di sini (hasil copy dari Excel, dipisah TAB)..." style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:monospace;font-size:11.5px;resize:vertical"></textarea>' +
        '<button id="btnImportSpp" style="margin-top:8px">Import / Perbarui Data</button><div id="pesanImportSpp"></div></div>' +

        '<div class="card"><h3>Atur Biaya SPP Santri</h3>' +
        '<div class="grid2">' + fieldAutocomplete('sppNisnBiaya','Nama Santri', daftarSantri.map(function(s){return s.nisn+' - '+s.nama;}), '', 'Ketik nama santri...') + fieldText('sppBiayaInput','Biaya SPP per Bulan (Rp)', '') + '</div>' +
        '<button id="btnSimpanBiayaSpp">Simpan Biaya SPP</button><div id="pesanBiayaSpp"></div></div>' +

        '<div class="card"><h3>Tabel Pembayaran (36 Bulan)</h3><div id="sppTableWrap" style="overflow-x:auto"></div></div>';
      c.innerHTML = html;

      // Binding tunggakan
      if (isBendahara && tunggakan.length) {
        document.getElementById('cariTunggakan').oninput = function(){
          var q = this.value.toLowerCase();
          document.querySelectorAll('.rowTunggakan').forEach(function(row){
            row.style.display = row.dataset.nama.includes(q) ? '' : 'none';
          });
        };
        document.querySelectorAll('.btnKirimWATunggak').forEach(function(btn){
          btn.onclick = function(){
            if(!confirm('Kirim WA tagihan ke wali '+btn.dataset.nama+'?')) return;
            btn.disabled=true; btn.textContent='Mengirim...';
            api('kirimTagihanSppSatuSantri',{nisn:btn.dataset.nisn}).then(function(r){
              btn.disabled=false; btn.textContent='&#128242; WA';
              if(r.ok) alert('WA tagihan terkirim ke wali '+btn.dataset.nama);
              else alert(r.error||'Gagal. Pastikan Fonnte Token sudah diatur.');
            });
          };
        });
        document.getElementById('btnKirimWASemuaTunggak').onclick = function(){
          if(!confirm('Kirim WA tagihan ke SEMUA '+tunggakan.length+' santri yang menunggak?')) return;
          var btn = document.getElementById('btnKirimWASemuaTunggak');
          btn.disabled=true; btn.textContent='Mengirim...';
          api('kirimTagihanSppMassal',{}).then(function(r){
            btn.disabled=false; btn.textContent='&#128242; Kirim WA ke Semua Menunggak';
            alert(r.ok ? 'WA terkirim ke '+r.terkirim+' wali santri.' : (r.error||'Gagal.'));
          });
        };
      }

      // Import massal
      document.getElementById('btnImportSpp').onclick = function(){
        var tsv = document.getElementById('sppImportTextarea').value;
        var toast = document.getElementById('pesanImportSpp');
        if (!tsv.trim()) { toast.innerHTML = errBox('Tempel data terlebih dahulu.'); return; }
        var btn = document.getElementById('btnImportSpp'); btn.disabled = true; btn.textContent = 'Mengimpor...';
        toast.innerHTML = '<p class="muted">Memproses...</p>';
        api('importSpp', {tsv: tsv}).then(function(r){
          btn.disabled = false; btn.textContent = 'Import / Perbarui Data';
          if(!r.ok){ toast.innerHTML = errBox(r.error); return; }
          var pesan = 'Berhasil: <b>'+r.ditambah+'</b> ditambahkan, <b>'+r.diperbarui+'</b> diperbarui.';
          if (r.dilewati > 0) pesan += '<br><b>'+r.dilewati+'</b> dilewati: '+r.alasanDilewati.map(esc).join('; ');
          toast.innerHTML = '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;font-size:13px">'+pesan+'</div>';
          document.getElementById('sppImportTextarea').value = '';
          renderSppSantri(containerId);
        });
      };

      // Atur biaya SPP
      document.getElementById('btnSimpanBiayaSpp').onclick = function(){
        var raw = document.getElementById('sppNisnBiaya').value.trim();
        var nisnDipilih = resolveSantriNisn(raw, daftarSantri);
        if (!nisnDipilih) { document.getElementById('pesanBiayaSpp').innerHTML = errBox('Pilih santri dari saran yang muncul.'); return; }
        var biaya = document.getElementById('sppBiayaInput').value.trim();
        if (!biaya || Number(biaya) <= 0) { document.getElementById('pesanBiayaSpp').innerHTML = errBox('Isi biaya SPP yang valid.'); return; }
        api('setBiayaSpp', {nisn: nisnDipilih, biaya: biaya}).then(function(r){
          if(!r.ok){ document.getElementById('pesanBiayaSpp').innerHTML = errBox(r.error); return; }
          document.getElementById('pesanBiayaSpp').innerHTML = '<p class="muted">Tersimpan.</p>';
          renderSppSantri(containerId);
        });
      };

      // Tabel 36 bulan
      if (!data.length) {
        document.getElementById('sppTableWrap').innerHTML = '<p class="muted">Belum ada santri terdaftar SPP.</p>';
        return;
      }

      var thead = '<tr><th style="position:sticky;left:0;background:#f1f5f9">Nama</th>';
      for (var m=1; m<=36; m++) thead += '<th>B'+m+'</th>';
      thead += '</tr>';

      var tbody = data.map(function(s){
        var due = bulanJatuhTempoSppFE(s.tahunMasuk);
        var row = '<td style="position:sticky;left:0;background:#fff;text-align:left;white-space:nowrap;font-weight:600">'+esc(s.nama)+'</td>';
        for (var m=1; m<=36; m++){
          var isFuture = m > due;
          var paid = !!s.months[m-1];
          var warna = isFuture ? '#94a3b8' : (paid ? '#16a34a' : '#d97706');
          var bg = isFuture ? '#f8fafc' : (paid ? '#eafaf0' : '#fff7ed');
          var label = paid ? 'L' : (isFuture ? '-' : '&middot;');
          var clickAttr = isFuture ? '' : ' class="sppCell" data-nisn="'+esc(s.nisn)+'" data-bulan="'+m+'"';
          row += '<td'+clickAttr+' style="cursor:'+(isFuture?'default':'pointer')+';color:'+warna+';background:'+bg+';font-weight:700;text-align:center;padding:6px 4px;border:1px solid #e2e8f0" title="'+esc(labelBulanSingkatSpp(m,s.tahunMasuk))+'">'+label+'</td>';
        }
        return '<tr>'+row+'</tr>';
      }).join('');

      document.getElementById('sppTableWrap').innerHTML = '<table style="border-collapse:collapse;font-size:12px"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>';

      document.querySelectorAll('.sppCell').forEach(function(td){
        td.onclick = function(){
          td.style.opacity = '.4';
          api('toggleSppBulan', {nisn: td.dataset.nisn, bulan: td.dataset.bulan}).then(function(r){
            td.style.opacity = '1';
            if(!r.ok){ alert(r.error); return; }
            var paid = !!r.nilaiBaru;
            td.style.color = paid ? '#16a34a' : '#d97706';
            td.style.background = paid ? '#eafaf0' : '#fff7ed';
            td.innerHTML = paid ? 'L' : '&middot;';
          });
        };
      });
    });
  }

        }
      };

      document.getElementById('btnTarikSaldo').onclick=function(){
        var raw=document.getElementById('tsNama').value.trim();
        var found=daftar.find(function(s){return (s.nisn+' - '+s.nama)===raw;});
        if(!found){document.getElementById('pesanTarik').innerHTML=errBox('Pilih santri dari daftar saran.');return;}
        var nominal=document.getElementById('tsNominal').value.trim();
        if(!nominal||Number(nominal)<=0){document.getElementById('pesanTarik').innerHTML=errBox('Isi nominal yang valid.');return;}
        var ketDropdown=document.getElementById('tsKetDropdown').value;
        var ket=ketDropdown==='Lainnya'?document.getElementById('tsKetTulis').value.trim():ketDropdown;
        if(!ket){document.getElementById('pesanTarik').innerHTML=errBox('Isi keterangan.');return;}
        if(!confirm('Tarik saldo '+found.nama+' sebesar '+rupiah(nominal)+'?\nKeterangan: '+ket)) return;
        var btn=document.getElementById('btnTarikSaldo');btn.disabled=true;btn.textContent='Memproses...';
        api('tarikSaldoSantriBendahara',{nisn:found.nisn,nominal:nominal,keterangan:ket,oleh:STATE.user.nama})
          .then(function(r){
            btn.disabled=false;btn.textContent='Tarik Saldo';
            if(!r.ok){document.getElementById('pesanTarik').innerHTML=errBox(r.error);return;}
            document.getElementById('pesanTarik').innerHTML=
              '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:8px">'+
              '&#10004; Berhasil! Saldo <b>'+esc(r.nama)+'</b> berkurang '+rupiah(nominal)+'.<br>'+
              'Saldo sebelum: '+rupiah(r.saldoSebelum)+' &rarr; Saldo sekarang: <b>'+rupiah(r.saldoSekarang)+'</b>'+
              '</div>';
            document.getElementById('tsNama').value='';
            document.getElementById('tsNominal').value='';
            document.getElementById('tsInfoSaldo').innerHTML='';
          });
      };
    });
  }

  // ---- CATAT TRANSAKSI ----
  function bendTransaksi(){
    var c=document.getElementById(STATE._contentId||'db-content');
    c.innerHTML='<p>Memuat...</p>';
    var bt=bulanTahunSaatIni();
    Promise.all([api('getKategoriKasList',{}), api('getKasUmumList',{bulan:bt.bulan,tahun:bt.tahun})]).then(function(hasil){
      var resKat=hasil[0], resList=hasil[1];
      var kategori=resKat.ok?resKat.data:[];
      var pemasukanKat=kategori.filter(function(k){return k.jenis==='Pemasukan';});
      var pengeluaranKat=kategori.filter(function(k){return k.jenis==='Pengeluaran';});

      var html='<div class="card"><h3>&#128221; Catat Transaksi Baru</h3>' +
        '<div class="grid2">' +
        '<div><label>Jenis</label><select id="trJenis" onchange="updateKatOptions()"><option value="Pemasukan">Pemasukan</option><option value="Pengeluaran">Pengeluaran</option></select></div>' +
        '<div><label>Kategori</label><select id="trKategori"><option value="">-- pilih --</option></select></div>' +
        '</div><div class="grid2">' +
        fieldText('trTanggal','Tanggal', todayStr()) +
        fieldText('trNominal','Nominal (Rp)','') +
        '</div>' +
        fieldText('trUraian','Uraian / Keterangan','') +
        '<div class="grid2">' +
        fieldText('trKelas','Kelas Santri (opsional, untuk SPP/DSP)','') +
        fieldText('trDicatatOleh','Dicatat Oleh', STATE.user.nama) +
        '</div>' +
        '<button id="btnSimpanTransaksi">Simpan Transaksi</button><div id="pesanTransaksi"></div></div>' +

        '<div class="card"><h3>Transaksi Bulan Ini</h3>' +
        '<div style="display:flex;gap:6px;margin-bottom:10px">' +
        '<select id="trFilterBulan">'+BULAN_INDO_B.map(function(b,i){return '<option value="'+(i+1)+'" '+(i+1===bt.bulan?'selected':'')+'>'+b+'</option>';}).join('')+'</select>' +
        '<select id="trFilterTahun">'+[bt.tahun-1,bt.tahun].map(function(t){return '<option value="'+t+'" '+(t===bt.tahun?'selected':'')+'>'+t+'</option>';}).join('')+'</select>' +
        '<button class="small" id="btnFilterTransaksi">Filter</button></div>' +
        '<div id="listTransaksi">Memuat...</div></div>';
      c.innerHTML=html;

      // Update opsi kategori sesuai jenis
      window.updateKatOptions=function(){
        var jenis=document.getElementById('trJenis').value;
        var list=jenis==='Pemasukan'?pemasukanKat:pengeluaranKat;
        document.getElementById('trKategori').innerHTML='<option value="">-- pilih --</option>'+
          list.map(function(k){return '<option value="'+esc(k.nama)+'">'+esc(k.nama)+'</option>';}).join('');
      };
      updateKatOptions();

      function muatListTransaksi(){
        var bulan=document.getElementById('trFilterBulan').value;
        var tahun=document.getElementById('trFilterTahun').value;
        document.getElementById('listTransaksi').innerHTML='<p>Memuat...</p>';
        api('getKasUmumList',{bulan:bulan,tahun:tahun}).then(function(r){
          if(!r.ok){document.getElementById('listTransaksi').innerHTML=errBox(r.error);return;}
          if(!r.data.length){document.getElementById('listTransaksi').innerHTML='<p class="muted">Belum ada transaksi pada periode ini.</p>';return;}
          var totalMasuk=0,totalKeluar=0;
          r.data.forEach(function(t){ if(t.jenis==='Pemasukan')totalMasuk+=t.nominal; else totalKeluar+=t.nominal; });
          document.getElementById('listTransaksi').innerHTML='<div style="display:flex;gap:10px;margin-bottom:8px;font-size:13px">' +
            '<span style="color:#16a34a;font-weight:600">&#11014; '+rupiah(totalMasuk)+'</span>' +
            '<span style="color:#dc2626;font-weight:600">&#11015; '+rupiah(totalKeluar)+'</span>' +
            '<span style="font-weight:600">Saldo: '+rupiah(totalMasuk-totalKeluar)+'</span></div>' +
            '<table><tr><th>Tgl</th><th>Jenis</th><th>Kategori</th><th>Uraian</th><th>Nominal</th><th>No. Ref</th><th>Aksi</th></tr>' +
            r.data.map(function(t){
              return '<tr><td>'+esc(t.tanggal)+'</td>' +
                '<td><span style="color:'+(t.jenis==='Pemasukan'?'#16a34a':'#dc2626')+';font-weight:600">'+esc(t.jenis)+'</span></td>' +
                '<td>'+esc(t.kategori)+'</td><td>'+esc(t.uraian)+'</td>' +
                '<td style="font-weight:600">'+rupiah(t.nominal)+'</td>' +
                '<td class="muted" style="font-size:11px">'+esc(t.noRef)+'</td>' +
                '<td><button class="small danger btnHapusTr" data-row="'+t.rowIndex+'">Hapus</button>' +
                ' <button class="small btnKwitansi" data-noref="'+esc(t.noRef)+'" data-row="'+t.rowIndex+'">Kwitansi</button></td></tr>';
            }).join('')+'</table>';
          document.querySelectorAll('.btnHapusTr').forEach(function(btn){
            btn.onclick=function(){ if(!confirm('Hapus transaksi ini?'))return; api('hapusTransaksiKas',{rowIndex:btn.dataset.row}).then(function(r){ if(r.ok)muatListTransaksi(); else alert(r.error); }); };
          });
          document.querySelectorAll('.btnKwitansi').forEach(function(btn){
            var tr=r.data.find(function(t){return t.rowIndex===Number(btn.dataset.row);});
            btn.onclick=function(){ if(tr) cetakKwitansi(tr); };
          });
        });
      }
      muatListTransaksi();
      document.getElementById('btnFilterTransaksi').onclick=muatListTransaksi;

      document.getElementById('btnSimpanTransaksi').onclick=function(){
        var nominal=document.getElementById('trNominal').value.trim();
        var uraian=document.getElementById('trUraian').value.trim();
        var kat=document.getElementById('trKategori').value;
        if(!nominal||!uraian||!kat){document.getElementById('pesanTransaksi').innerHTML=errBox('Isi semua field wajib.');return;}
        var btn=document.getElementById('btnSimpanTransaksi'); btn.disabled=true; btn.textContent='Menyimpan...';
        api('tambahTransaksiKas',{
          tanggal:document.getElementById('trTanggal').value,
          jenis:document.getElementById('trJenis').value,
          kategori:kat, uraian:uraian, nominal:nominal,
          kelas:document.getElementById('trKelas').value,
          dicatatOleh:document.getElementById('trDicatatOleh').value
        }).then(function(r){
          btn.disabled=false; btn.textContent='Simpan Transaksi';
          if(!r.ok){document.getElementById('pesanTransaksi').innerHTML=errBox(r.error);return;}
          document.getElementById('pesanTransaksi').innerHTML='<p class="muted">Tersimpan. No. Ref: '+r.noRef+'</p>';
          document.getElementById('trNominal').value='';
          document.getElementById('trUraian').value='';
          muatListTransaksi();
        });
      };
    });
  }

          '<td class="right bold">'+rupiah(b.saldoKumulatif)+'</td></tr>';
      }).join('') +
      '<tr class="bold"><td>TOTAL</td>' +
      '<td class="right">'+rupiah(data.reduce(function(s,b){return s+b.pemasukan;},0))+'</td>' +
      '<td class="right">'+rupiah(data.reduce(function(s,b){return s+b.pengeluaran;},0))+'</td>' +
      '<td></td><td class="right">'+rupiah(data[data.length-1]?data[data.length-1].saldoKumulatif:0)+'</td></tr>' +

  function pemilikKasir(){
    var c = document.getElementById(STATE._contentId||'dp-content');
    c.innerHTML = '<p>Memuat menu...</p>';
    kantinCart = [];
    api('getBarangSaya', {pemilik: STATE.user.nama}).then(function(res){
      if(!res.ok){ c.innerHTML = errBox(res.error); return; }
      var tombolCekSantri = '<div class="card"><button class="secondary" id="btnCekAkunSantri">&#128100; Cek Akun Santri</button>' +
        '<p class="muted" style="margin-top:6px">Pinjamkan layar ini ke santri untuk cek saldo/riwayatnya sendiri (pakai PIN Transaksi miliknya).</p></div>';
      if(!res.data.length){ c.innerHTML = tombolCekSantri + '<div class="card">'+warnBox('Anda belum punya barang jualan. Minta Admin menambahkan lewat menu Kelola Barang Kantin.')+'</div>'; ikatCekAkunSantri(); return; }
      var barangList = res.data;
      c.innerHTML = tombolCekSantri + '<div class="card"><h3>Menu Jualan Saya</h3><div class="fitur-grid">' +
        barangList.map(function(b,i){
          return '<div class="fitur-card"><h4>'+esc(b.nama)+'</h4><p style="font-size:16px;font-weight:700;color:#0d9488;margin:4px 0">Rp'+b.harga.toLocaleString('id-ID')+'</p>' +
            '<button class="small btnTambahKantinCart" data-i="'+i+'">+ Keranjang</button></div>';
        }).join('') + '</div></div>' +
        '<div class="card" id="kantinCartWrap" style="display:none"><h3>Keranjang</h3><div id="kantinCartList"></div>' +
        '<p style="font-size:18px;font-weight:700;text-align:right;margin-top:8px">Total: <span id="kantinCartTotal">Rp0</span></p>' +
        '<button id="btnBayarKantin">Proses Pembayaran</button> <button class="secondary" id="btnKosongkanKantin">Kosongkan</button></div>';
      ikatCekAkunSantri();

      function renderCart(){
        var wrap = document.getElementById('kantinCartWrap');
        if (!kantinCart.length) { wrap.style.display = 'none'; return; }
        wrap.style.display = 'block';
        var total = 0;
        document.getElementById('kantinCartList').innerHTML = kantinCart.map(function(it,idx){
          var sub = it.harga*it.jumlah; total += sub;
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e2e8f0">' +
            '<span>'+esc(it.nama)+' x'+it.jumlah+'</span><span>Rp'+sub.toLocaleString('id-ID')+' <button class="small danger btnHapusKantinItem" data-idx="'+idx+'">&times;</button></span></div>';
        }).join('');
        document.getElementById('kantinCartTotal').textContent = 'Rp'+total.toLocaleString('id-ID');
        document.querySelectorAll('.btnHapusKantinItem').forEach(function(btn){
          btn.onclick = function(){ kantinCart.splice(Number(btn.dataset.idx),1); renderCart(); };
        });
      }
      document.querySelectorAll('.btnTambahKantinCart').forEach(function(btn){
        btn.onclick = function(){
          var b = barangList[Number(btn.dataset.i)];
          var existing = kantinCart.find(function(x){return x.nama===b.nama;});
          if (existing) existing.jumlah++;
          else kantinCart.push({nama:b.nama, harga:b.harga, potongan:b.potongan, jumlah:1});
          renderCart();
        };
      });
      document.getElementById('btnKosongkanKantin').onclick = function(){ kantinCart = []; renderCart(); };
      document.getElementById('btnBayarKantin').onclick = function(){
        if (!kantinCart.length) return;
        api('getSantriUntukTransaksiKantin', {}).then(function(resSantri){
          if(!resSantri.ok){ alert(resSantri.error); return; }
          var daftarSantri = resSantri.data;
          var fieldsHtml = fieldAutocomplete('ktSantri','Nama Santri', daftarSantri.map(function(s){return s.nisn+' - '+s.nama;}), '', 'Ketik nama/NISN santri...') +
            '<label>PIN Transaksi Santri</label><input type="password" id="ktPin" placeholder="PIN">';
          openModal('Konfirmasi Pembayaran', fieldsHtml, function(m){
            var raw = m.querySelector('#ktSantri').value.trim();
            var found = daftarSantri.find(function(s){ return (s.nisn+' - '+s.nama) === raw; });
            if (!found) { alert('Pilih santri dari saran yang muncul saat mengetik.'); return false; }
            var pin = m.querySelector('#ktPin').value.trim();
            if (!pin) { alert('PIN Transaksi wajib diisi.'); return false; }
            api('prosesTransaksiKantin', {nisn: found.nisn, pinTransaksi: pin, pemilik: STATE.user.nama, noWaPemilik: STATE.user.noWa, items: kantinCart}).then(function(res){
              if(!res.ok){ alert(res.error); return; }
              // Tawari cetak struk
              var konfirm = confirm(
                '✅ Pembayaran berhasil!\n\n' +
                'Santri: ' + res.namaSantri + '\n' +
                'Total: Rp' + res.total.toLocaleString('id-ID') + '\n' +
                'Sisa saldo: Rp' + res.saldoSekarang.toLocaleString('id-ID') + '\n\n' +
                'Cetak struk sekarang?'
              );
              if (konfirm) {
                cetakStrukKasir({
                  namaSantri: res.namaSantri, namaPemilik: STATE.user.nama,
                  items: kantinCart, total: res.total, saldoSekarang: res.saldoSekarang,
                  tanggal: todayStr()
                });
              }
              pemilikKasir();
            });
          });
        });
      };
      renderCart();
    });
  }

  // Tombol "Cek Akun Santri" -- santri masuk pakai PIN Transaksi miliknya sendiri
  // (bukan PIN login orang tua), lalu layar sepenuhnya berpindah ke Akun Santri.
  function ikatCekAkunSantri(){
    var btn = document.getElementById('btnCekAkunSantri');
    if (!btn) return;
    btn.onclick = function(){
      api('getSantriUntukTransaksiKantin', {}).then(function(resSantri){
        if(!resSantri.ok){ alert(resSantri.error); return; }
        var daftarSantri = resSantri.data;
        var fieldsHtml = fieldAutocomplete('casSantri','Nama Santri', daftarSantri.map(function(s){return s.nisn+' - '+s.nama;}), '', 'Ketik nama/NISN santri...') +
          '<label>PIN Transaksi Santri</label><input type="password" id="casPin" placeholder="PIN">';
        openModal('Masuk Akun Santri', fieldsHtml, function(m){
          var raw = m.querySelector('#casSantri').value.trim();
          var found = daftarSantri.find(function(s){ return (s.nisn+' - '+s.nama) === raw; });
          if (!found) { alert('Pilih santri dari saran yang muncul saat mengetik.'); return false; }
          var pin = m.querySelector('#casPin').value.trim();
          if (!pin) { alert('PIN Transaksi wajib diisi.'); return false; }
          api('validasiPinTransaksiSantri', {nisn: found.nisn, pin: pin}).then(function(res){
            if(!res.ok){ alert(res.error); return; }
            tampilkanAkunSantri(found.nisn, res.nama);
          });
        });
      });
    };
  }

      api('getRiwayatTransaksiPemilik', {pemilik: STATE.user.nama, tglMulai: document.getElementById('rtDari').value, tglAkhir: document.getElementById('rtSampai').value}).then(function(res){

  // ---- Pemilik: Laporan Omzet per periode ----
  function pemilikOmzet(){
    var c = document.getElementById(STATE._contentId||'dp-content');
    var bt = bulanTahunSaatIni();
    var tglMulai = bt.tahun+'-'+String(bt.bulan).padStart(2,'0')+'-01';
    c.innerHTML = '<div class="card"><h3>&#128200; Laporan Omzet</h3>' +
      '<div class="grid2">' +
      '<div><label>Dari Tanggal</label><input type="date" id="omzetDari" value="'+tglMulai+'"></div>' +
      '<div><label>Sampai Tanggal</label><input type="date" id="omzetSampai" value="'+todayStr()+'"></div>' +
      '</div>' +
      '<button id="btnCariOmzet">Tampilkan</button> ' +
      '<button class="secondary" id="btnCetakOmzet">&#128424; Cetak</button>' +
      '</div><div id="omzetResult" style="margin-top:10px">Klik Tampilkan untuk memuat.</div>';

    function muat(){
      var dari = document.getElementById('omzetDari').value;
      var sampai = document.getElementById('omzetSampai').value;
      document.getElementById('omzetResult').innerHTML = '<p>Memuat...</p>';
      api('getRiwayatTransaksiPemilik', {pemilik: STATE.user.nama, tglMulai: dari, tglAkhir: sampai}).then(function(res){
        if(!res.ok){ document.getElementById('omzetResult').innerHTML = errBox(res.error); return; }
        var data = res.data;
        if(!data.length){ document.getElementById('omzetResult').innerHTML = '<div class="card"><p class="muted">Tidak ada transaksi pada periode ini.</p></div>'; return; }

        // Hitung ringkasan
        var totalOmzet=0, totalPotongan=0, totalBersih=0;
        var perBarang = {};
        data.forEach(function(t){
          totalOmzet += t.nominal;
          totalPotongan += t.potongan||0;
          totalBersih += t.masuk||0;
          var key = t.namaBarang||'Lainnya';
          if (!perBarang[key]) perBarang[key] = {nama:key, qty:0, omzet:0, potongan:0, bersih:0};
          perBarang[key].qty += Number(t.jumlah)||1;
          perBarang[key].omzet += t.nominal;
          perBarang[key].potongan += t.potongan||0;
          perBarang[key].bersih += t.masuk||0;
        });

        document.getElementById('omzetResult').innerHTML =
          '<div class="ringkasan-grid" style="margin-bottom:12px">' +
          '<div class="ringkasan-tile warna-hijau"><div class="ico">&#128717;</div><div class="nilai">'+rupiah(totalOmzet)+'</div><div class="label">Total Omzet</div></div>' +
          '<div class="ringkasan-tile warna-merah"><div class="ico">&#9986;</div><div class="nilai">'+rupiah(totalPotongan)+'</div><div class="label">Potongan Pondok</div></div>' +
          '<div class="ringkasan-tile"><div class="ico">&#128176;</div><div class="nilai">'+rupiah(totalBersih)+'</div><div class="label">Saldo Bersih Anda</div></div>' +
          '</div>' +
          '<div class="card"><h4>Rekap per Barang</h4>' +
          '<table><tr><th>Nama Barang</th><th>Qty Terjual</th><th>Omzet</th><th>Potongan</th><th>Bersih</th></tr>' +
          Object.values(perBarang).sort(function(a,b){return b.omzet-a.omzet;}).map(function(b){
            return '<tr><td><b>'+esc(b.nama)+'</b></td><td style="text-align:center">'+b.qty+'</td>' +
              '<td>'+rupiah(b.omzet)+'</td><td style="color:#dc2626">'+rupiah(b.potongan)+'</td>' +
              '<td style="color:#16a34a;font-weight:600">'+rupiah(b.bersih)+'</td></tr>';
          }).join('') + '</table></div>' +
          '<div class="card"><h4>Detail Transaksi ('+data.length+' baris)</h4>' +
          '<table><tr><th>Tanggal</th><th>Santri</th><th>Barang</th><th>Qty</th><th>Omzet</th><th>Bersih</th></tr>' +
          data.map(function(t){
            return '<tr><td>'+esc(t.tanggal)+'</td><td>'+esc(t.namaSantri)+'</td><td>'+esc(t.namaBarang)+'</td>' +
              '<td style="text-align:center">'+esc(String(t.jumlah||1))+'</td>' +
              '<td>'+rupiah(t.nominal)+'</td><td style="color:#16a34a">'+rupiah(t.masuk||0)+'</td></tr>';
          }).join('')+'</table></div>';

        document.getElementById('btnCetakOmzet').onclick = function(){
          var nama = STATE.user.nama;
          var namaSekolah = STATE.pengaturan.NamaPesantren||'Pondok Pesantren';
          var win = window.open('','_blank');
          win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Laporan Omzet</title>' +
            '<style>body{font-family:Arial,sans-serif;max-width:800px;margin:16px auto;font-size:11px}' +
            'h1{font-size:13px;text-align:center}table{width:100%;border-collapse:collapse;margin-top:8px}' +
            'td,th{border:1px solid #888;padding:4px 6px}th{background:#eee}.right{text-align:right}.bold{font-weight:700}' +
            '@media print{@page{margin:10mm}}</style></head><body>' +
            '<h1>LAPORAN OMZET KANTIN<br><small>'+esc(namaSekolah)+' &mdash; Pemilik: '+esc(nama)+'</small></h1>' +
            '<p style="text-align:center">Periode: '+esc(dari)+' s/d '+esc(sampai)+'</p>' +
            '<p><b>Total Omzet: '+rupiah(totalOmzet)+'</b> | Potongan Pondok: '+rupiah(totalPotongan)+' | Saldo Bersih: <b>'+rupiah(totalBersih)+'</b></p>' +
            '<table><tr><th>No</th><th>Tanggal</th><th>Santri</th><th>Barang</th><th>Qty</th><th class="right">Omzet</th><th class="right">Bersih</th></tr>' +
            data.map(function(t,i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(t.tanggal)+'</td><td>'+esc(t.namaSantri)+'</td><td>'+esc(t.namaBarang)+'</td><td style="text-align:center">'+esc(String(t.jumlah||1))+'</td><td class="right">'+rupiah(t.nominal)+'</td><td class="right">'+rupiah(t.masuk||0)+'</td></tr>'; }).join('') +
            '<tr class="bold"><td colspan="5">TOTAL</td><td class="right">'+rupiah(totalOmzet)+'</td><td class="right">'+rupiah(totalBersih)+'</td></tr>' +
            '</table><script>setTimeout(function(){window.print();},400);<\/script></body></html>');
          win.document.close();
        };
      });
    }
    document.getElementById('btnCariOmzet').onclick = muat;
    muat();
  }

  // ---- Pemilik: Riwayat Saldo Naik-Turun ----
  function pemilikRiwayatSaldo(){
    var c = document.getElementById(STATE._contentId||'dp-content');
    c.innerHTML = '<p>Memuat...</p>';
    api('getRiwayatSaldoPemilikSaya', {pemilik: STATE.user.nama}).then(function(res){
      if(!res.ok){ c.innerHTML = errBox(res.error); return; }
      c.innerHTML = '<div class="card"><h3>&#128337; Riwayat Saldo</h3>' +
        '<p class="muted">Histori lengkap naik-turun saldo Anda.</p>' +
        (res.data.length ?
          '<table><tr><th>Tanggal</th><th>Waktu</th><th>Jenis</th><th>Nominal</th><th>Saldo Sebelum</th><th>Saldo Sekarang</th><th>Keterangan</th></tr>' +
          res.data.map(function(r){
            var warna = r.jenis==='Masuk' ? '#16a34a' : '#dc2626';
            var prefix = r.jenis==='Masuk' ? '+' : '-';
            return '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.waktu)+'</td>' +
              '<td><span style="color:'+warna+';font-weight:600">'+esc(r.jenis)+'</span></td>' +
              '<td style="color:'+warna+';font-weight:600">'+prefix+rupiah(r.nominal)+'</td>' +

              '<td style="font-size:11.5px;color:#64748b">'+esc(r.keterangan)+'</td></tr>';
          }).join('') + '</table>'
          : '<p class="muted">Belum ada riwayat saldo.</p>') +

  function muatKantinWali(nisn){
    var wrap = document.getElementById('dw-kantin');
    wrap.innerHTML = '<div class="card"><h3>Saldo Kantin</h3><p>Memuat...</p></div>';
    Promise.all([
      api('getSaldoSantriKantin', {nisn:nisn}),
      api('get5TransaksiTerbaruSantri', {nisn:nisn})
    ]).then(function(hasil){
      var resSaldo = hasil[0], res5 = hasil[1];
      var saldo = resSaldo.ok ? resSaldo.data.saldo : 0;
      var limit = resSaldo.ok ? resSaldo.data.limit : 0;
      var namaSantri = resSaldo.ok ? resSaldo.data.nama : '';

      var html = '<div class="card"><h3>Saldo Kantin</h3>' +
        '<p style="font-size:28px;font-weight:800;color:#0d9488;margin:6px 0">'+rupiah(saldo)+'</p>' +
        (limit>0?'<p class="muted" style="font-size:12.5px">Limit harian: '+rupiah(limit)+'</p>':'')+
        '<button id="btnTambahSaldoWali">+ Tambah Saldo</button><div id="pesanTambahSaldo"></div></div>' +
        '<div class="card"><h3>Limit Belanja Harian</h3>' +
        warnBox('Batasi berapa banyak anak Anda boleh belanja di kantin per hari. Isi 0 untuk tanpa batas.') +
        '<label>Limit Harian (Rp)</label><input type="number" id="limitHarianWali" value="'+(limit>0?limit:'')+'" placeholder="0 = tanpa batas">' +
        '<button id="btnSimpanLimit">Simpan Limit</button><div id="pesanLimit"></div></div>' +
        '<div class="card"><h3>5 Transaksi Terbaru</h3>' +
        (res5.ok && res5.data.length ?
          renderTabelTransaksiWali(res5.data) +
          '<button class="secondary small" id="btnLihatSemuaTrx" style="margin-top:10px;width:100%">Lihat Semua Riwayat</button>'
          : '<p class="muted">Belum ada transaksi.</p>') +
        '</div>';

      wrap.innerHTML = html;

      document.getElementById('btnSimpanLimit').onclick = function(){
        var nilai = document.getElementById('limitHarianWali').value.trim();
        api('setLimitHarianSantri', {nisn:nisn, limit: nilai||0}).then(function(res){
          document.getElementById('pesanLimit').innerHTML = res.ok ? '<p class="muted">Tersimpan.</p>' : errBox(res.error);
        });
      };

      var btnSemuaTrx = document.getElementById('btnLihatSemuaTrx');
      if (btnSemuaTrx) {
        btnSemuaTrx.onclick = function(){
          btnSemuaTrx.disabled=true; btnSemuaTrx.textContent='Memuat...';
          api('getAllTransaksiSantri',{nisn:nisn}).then(function(r){
            btnSemuaTrx.style.display='none';
            if(!r.ok){ wrap.insertAdjacentHTML('beforeend',errBox(r.error)); return; }
            var div=document.createElement('div');
            div.className='card';
            div.innerHTML='<h3>Semua Riwayat ('+r.data.length+' transaksi)</h3>'+renderTabelTransaksiWali(r.data);
            wrap.appendChild(div);
          });
        };
      }

      document.getElementById('btnTambahSaldoWali').onclick = function(){
        var fieldsHtml = '<label>Nominal yang ingin ditambahkan (Rp)</label>' +
          '<input type="number" id="tsNominal" placeholder="Contoh: 50000">' +
          '<p class="muted" style="margin-top:8px">Pesan WhatsApp ke Bendahara akan otomatis tersusun.</p>';
        var modal = openModal('Tambah Saldo Kantin', fieldsHtml, function(m){
          var nominal = Number(m.querySelector('#tsNominal').value.trim());
          if (!nominal || nominal <= 0) { alert('Isi nominal yang valid.'); return false; }
          var btn = modal.querySelector('#modalSimpan'); btn.disabled=true; btn.innerText='Mengirim...';
          api('ajukanTopUpSaldo', {nisn:nisn, namaSantri:namaSantri, nominal:nominal, noWaWali:STATE.user.noWa}).then(function(res){
            if(!res.ok){ alert(res.error); btn.disabled=false; btn.innerText='Kirim WA ke Bendahara'; return false; }
            if (res.noWaBendahara) {
              var noWa = res.noWaBendahara.replace(/[^0-9]/g,'');
              if (noWa.charAt(0)==='0') noWa='62'+noWa.substring(1);
              var pesan = 'Assalamualaikum, saya ingin mengajukan tambah saldo kantin.\n\nNama Santri: '+namaSantri+'\nNominal: '+rupiah(nominal)+'\n\nBukti transfer akan segera saya kirimkan. Terima kasih.';
              window.open('https://wa.me/'+noWa+'?text='+encodeURIComponent(pesan), '_blank');
            }
            root.removeChild(modal);
            document.getElementById('pesanTambahSaldo') && (document.getElementById('pesanTambahSaldo').innerHTML = '<p class="muted">Pengajuan terkirim, menunggu persetujuan Bendahara.</p>');
          });
          return false;
        });
        modal.querySelector('#modalSimpan').textContent = 'Kirim WA ke Bendahara';
      };
    });
  }

  function renderTabelTransaksiWali(data){
    return '<div style="overflow-x:auto"><table><tr><th>Tanggal</th><th>Keterangan</th><th>Nominal</th><th>Saldo</th></tr>' +
      data.map(function(r){
        var isTopUp = r.kategori==='Top Up Saldo';
        var isPenarikan = r.kategori==='Penarikan';
        var warna = isTopUp ? '#16a34a' : '#dc2626';
        var prefix = isTopUp ? '+' : '-';
        var label = isTopUp ? 'Top Up Saldo' : (isPenarikan ? r.keterangan : 'Belanja: '+r.keterangan);
        return '<tr>' +
          '<td style="font-size:11.5px;white-space:nowrap">'+esc(r.tanggal)+'<br><span class="muted">'+esc(r.waktu)+'</span></td>' +
          '<td>'+esc(label)+'</td>' +
          '<td style="color:'+warna+';font-weight:600;white-space:nowrap">'+prefix+rupiah(r.nominal)+'</td>' +
          '<td style="white-space:nowrap">'+rupiah(r.saldoSekarang)+'</td></tr>';
      }).join('') + '</table></div>';
  }

  // ---- Unduh Excel Rekap (CSV yang bisa dibuka Excel) ----
  function unduhExcelRekap(d){
    var bom = '\uFEFF'; // BOM untuk Excel mengenali UTF-8
    var baris = [['No','Nama Santri','Hadir','Sakit','Izin','Alpa','% Hadir','Keterangan']];
    d.santri.forEach(function(s,i){
      var ket = s.persenHadir<75?'Perlu perhatian':s.persenHadir>=90?'Sangat baik':'Baik';
      baris.push([i+1, s.nama, s.hadir, s.sakit, s.izin, s.alpa, s.persenHadir+'%', ket]);
    });
    baris.push([]);
    baris.push(['Halaqoh', d.namaHalaqoh, '', 'Total Sesi', d.totalSesi]);
    baris.push(['Dicetak', new Date().toLocaleDateString('id-ID'), '', 'Pengampu', STATE.user.nama]);

    var csv = bom + baris.map(function(r){
      return r.map(function(v){
        var s = String(v==null?'':v);
        if (s.includes(',') || s.includes('"') || s.includes('\n')) s = '"'+s.replace(/"/g,'""')+'"';
        return s;
      }).join(',');
    }).join('\n');

    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Rekap_Halaqoh_'+d.namaHalaqoh.replace(/\s+/g,'_')+'_'+todayStr()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function adminPenggantian(){

    c.innerHTML = '<p>Memuat...</p>';

        '<label>Jenis Sesi</label><select id="pgJenis"><option value="Mapel">Mata Pelajaran</option><option value="Halaqoh">Halaqoh (Tahfidz)</option></select>' +
        fieldAutocomplete('pgGuruAsli','Guru Asli (yang berhalangan)', daftarNamaGuru, '', 'Ketik nama guru...') +
        '<div id="pgSesiWrap"><p class="muted">Ketik nama Guru Asli dulu untuk melihat jadwalnya.</p></div>' +
