<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WASIAT - Wihdatul Ummah Poso</title>
<meta name="description" content="Aplikasi Absensi & Hafalan Santri Pondok Pesantren Wihdatul Ummah Poso">

<!-- ============ PWA: manifest, ikon, warna tema ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASIAT">
</head>
<body style="margin:0;padding:0">

<!-- Tombol Install PWA (tersembunyi default -- hanya muncul kalau terdeteksi belum terpasang) -->
<button id="btnInstallPWA" style="display:none;position:fixed;left:14px;bottom:14px;z-index:99999;background:#0d9488;color:#fff;border:none;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(15,118,110,.35);cursor:pointer;font-family:'Segoe UI',Arial,sans-serif">
  &#128241; Instal Aplikasi WASIAT
</button>

<!-- Lencana status data offline (mengambang, hanya tampil kalau ada data belum tersinkron) -->
<div id="outboxBadge" style="display:none;position:fixed;right:14px;bottom:14px;z-index:99999;background:#f59e0b;color:#fff;padding:10px 14px;border-radius:24px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);align-items:center;gap:8px;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer" onclick="sinkronkanOutbox()">
  &#9203; <span id="outboxCount">0</span> data belum tersinkron -- tap untuk coba lagi
</div>

<!--
  ====================================================================
  WASIAT - Aplikasi Absensi & Hafalan Santri
  Pondok Pesantren Wihdatul Ummah Poso, Sulawesi Tengah
  Versi PWA (dihosting mandiri di Vercel) -- lihat README.md untuk cara deploy.
  ====================================================================
-->
<div id="absensi-app">
  <div style="text-align:center;padding:60px 20px;font-family:'Segoe UI',Arial,sans-serif;color:#0f766e">Memuat aplikasi...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  #absensi-app{
    max-width:1300px;margin:0 auto;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;
    --tema:#0d9488;--tema-dark:#0f766e;--tema-light:#ccfbf1;--sidebar-bg:#134e4a;background:#f1f5f9;
    overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  #absensi-app *{box-sizing:border-box;max-width:100%}
  #absensi-app img{max-width:100%;height:auto}

  /* ---- layout shell: sidebar geser (tersembunyi default) + konten utama ---- */
  #absensi-app .app-shell{display:flex;min-height:100vh;position:relative}
  #absensi-app .sidebar{
    width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar-bg),#0a2e2c);color:#e2f5f3;
    display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;overflow-y:auto;
    transform:translateX(-100%);transition:transform .25s ease;z-index:1000;box-shadow:2px 0 16px rgba(0,0,0,.25);
  }
  #absensi-app .sidebar.open{transform:translateX(0)}
  #absensi-app .sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  #absensi-app .sidebar-brand img{height:38px;width:38px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;flex-shrink:0}
  #absensi-app .sidebar-brand .nm{font-size:13px;font-weight:600;line-height:1.3}
  #absensi-app .sidebar-nav{flex:1;padding:10px 8px}
  #absensi-app .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;
    color:#c9e8e4;font-size:13.5px;margin-bottom:2px;white-space:nowrap;
  }
  #absensi-app .nav-item .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
  #absensi-app .nav-item:hover{background:rgba(255,255,255,.08)}
  #absensi-app .nav-item.active{background:var(--tema);color:#fff;font-weight:600}
  #absensi-app .sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
  #absensi-app .sidebar-user .nm{font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #absensi-app .sidebar-user .lvl{color:#9fd8d2;margin-bottom:8px}
  #absensi-app .sidebar-user button{width:100%;background:rgba(255,255,255,.14);margin:0}
  #absensi-app .sidebar-user button:hover{background:rgba(255,255,255,.24)}
  #absensi-app .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999}
  #absensi-app .sidebar-overlay.show{display:block}
  #absensi-app .main-content{flex:1;min-width:0;padding:0 22px 40px}
  #absensi-app .mobile-topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:sticky;top:0;background:#f1f5f9;padding:10px 0;z-index:50}
  #absensi-app .hamburger-btn{background:var(--tema);color:#fff;border:none;width:38px;height:38px;border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;margin:0}
  #absensi-app .mobile-title{font-size:15px;font-weight:600;color:var(--tema-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (max-width:860px){
    #absensi-app .main-content{padding:0 12px 32px}
  }

  /* ---- kartu, form, tombol ---- */
  #absensi-app .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,118,110,.07)}
  #absensi-app h2{margin:0 0 10px;color:#0f2f2d}
  #absensi-app h3{margin:0 0 10px;color:#0f2f2d;font-size:16px}
  #absensi-app h4{margin:10px 0 6px;color:#134e4a;font-size:13.5px}
  #absensi-app label{display:block;font-size:12.5px;color:#475569;margin-bottom:3px;font-weight:500}
  #absensi-app input,#absensi-app select,#absensi-app textarea{
    width:100%;padding:9px 10px;margin:0 0 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff;color:#1e293b;
  }
  #absensi-app input:focus,#absensi-app select:focus,#absensi-app textarea:focus{outline:none;border-color:var(--tema);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  #absensi-app button{background:var(--tema);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;margin-right:6px;margin-bottom:6px;transition:background .15s}
  #absensi-app button:hover{background:var(--tema-dark)}
  #absensi-app button.secondary{background:#64748b}
  #absensi-app button.secondary:hover{background:#475569}
  #absensi-app button.danger{background:#dc2626}
  #absensi-app button.danger:hover{background:#b91c1c}
  #absensi-app button.small{padding:6px 11px;font-size:12px}
  #absensi-app button:disabled{opacity:.55;cursor:not-allowed}

  /* ---- tabel: digeser ke samping, TIDAK ADA teks bertumpuk/wrap ---- */
  #absensi-app table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;white-space:nowrap}
  #absensi-app th,#absensi-app td{border:1px solid #e2e8f0;padding:7px 9px;text-align:left;white-space:nowrap}
  #absensi-app th{background:var(--tema-light);color:#0f4c4c;font-weight:600}

  #absensi-app .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  #absensi-app .tab-btn{background:#eef2f7;color:#334155;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap}
  #absensi-app .tab-btn.active{background:var(--tema);color:#fff}

  #absensi-app .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand{display:flex;align-items:center;gap:10px}
  #absensi-app .brand img{height:42px;width:42px;object-fit:contain;border-radius:8px}

  #absensi-app .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap}
  #absensi-app .badge.Hadir{background:#0d9488}
  #absensi-app .badge.Sakit{background:#f59e0b}
  #absensi-app .badge.Izin{background:#2563eb}
  #absensi-app .badge.Alpa{background:#dc2626}
  #absensi-app .badge-hafalan{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap}
  #absensi-app .badge-hafalan.sabaq{background:#0d9488}
  #absensi-app .badge-hafalan.sabqi{background:#0891b2}
  #absensi-app .badge-hafalan.manzil{background:#7c3aed}
  #absensi-app .badge-hafalan.murojaah{background:#0284c7}
  #absensi-app .badge-hafalan.tahsin{background:#16a34a}
  #absensi-app .badge-hafalan.tidaksetor{background:#64748b}
  #absensi-app .badge-hafalan.izin{background:#2563eb}
  #absensi-app .badge-hafalan.sakit{background:#f59e0b}
  #absensi-app .badge-hafalan.ghaib{background:#dc2626}
  #absensi-app .progress{background:#e2e8f0;border-radius:8px;overflow:hidden;height:14px;width:100%}
  #absensi-app .progress-bar{background:var(--tema);height:14px}

  #absensi-app .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #absensi-app .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  @media (max-width:560px){
    #absensi-app .grid2{grid-template-columns:1fr}
    #absensi-app .grid4{grid-template-columns:repeat(2,1fr)}
  }

  #absensi-app .muted{color:#64748b;font-size:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #absensi-app .faded{color:#94a3b8;font-size:11px;font-style:italic}
  #absensi-app .warn{background:#fffbeb;border:1px solid #fcd34d;padding:10px;border-radius:8px;color:#92400e;font-size:13px}
  #absensi-app .err{background:#fef2f2;border:1px solid #fca5a5;padding:10px;border-radius:8px;color:#b91c1c;font-size:13px}

  #absensi-app .overlay{position:fixed;inset:0;background:rgba(15,42,40,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
  #absensi-app .modal{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}

  #absensi-app .santriRowAbsen{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .santriRowHafalan{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .juzchip{display:inline-block;background:var(--tema);color:#fff;border-radius:20px;padding:4px 10px;margin:2px;font-size:12px}
  #absensi-app .juzchip.proses{background:#f59e0b}

  /* ---- slide pengumuman (ringan, tanpa library luar) ---- */
  #absensi-app .slidebar{position:relative;width:100%;aspect-ratio:16/6;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#e2e8f0;box-shadow:0 2px 10px rgba(15,118,110,.12)}
  #absensi-app .slidebar-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;}
  #absensi-app .slidebar-slide.active{opacity:1;z-index:1}
  #absensi-app .slidebar-slide img{width:100%;height:100%;object-fit:cover;display:block}
  #absensi-app .slidebar-caption{position:absolute;left:0;right:0;bottom:0;padding:10px 46px 10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;font-weight:600}
  #absensi-app .slidebar-dots{position:absolute;bottom:9px;right:10px;display:flex;gap:5px;z-index:2}
  #absensi-app .slidebar-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
  #absensi-app .slidebar-dot.active{background:#fff}
  #absensi-app .slidebar-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;margin:0;padding:0}
  #absensi-app .slidebar-arrow:hover{background:rgba(0,0,0,.55)}
  #absensi-app .slidebar-arrow.prev{left:8px}
  #absensi-app .slidebar-arrow.next{right:8px}
  @media (max-width:560px){ #absensi-app .slidebar{aspect-ratio:16/9} }

  /* ---- website depan (beranda publik) ---- */
  #absensi-app .site-nav{position:sticky;top:0;z-index:600;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand2{display:flex;align-items:center;gap:9px;flex-shrink:0;min-width:0}
  #absensi-app .brand2 img{height:42px;width:42px;min-width:42px;flex-shrink:0;display:block;object-fit:contain;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 2px 6px rgba(0,0,0,.08);background:#fff;padding:2px}
  #absensi-app .brand2 span{font-weight:800;color:#0f766e;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
  #absensi-app .site-nav-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #absensi-app .site-nav-links a{color:#334155;font-size:13.5px;font-weight:600;cursor:pointer}
  #absensi-app .site-nav-links a:hover{color:#0d9488}
  @media(min-width:480px){ #absensi-app .brand2 img{height:46px;width:46px;min-width:46px} #absensi-app .brand2 span{font-size:15px;max-width:none;white-space:normal} }
  #absensi-app .btn-masuk{background:var(--tema);color:#fff;border:none;padding:9px 20px;border-radius:20px;font-weight:700;cursor:pointer;font-size:13px;margin:0;width:auto}
  #absensi-app .hero{background:linear-gradient(150deg,#0f766e,#134e4a 65%,#0a2e2c);color:#fff;padding:50px 20px;text-align:center}
  #absensi-app .hero img{height:84px;width:84px;object-fit:contain;margin-bottom:14px;border-radius:14px;background:#fff;padding:8px}
  #absensi-app .hero h1{font-size:23px;margin-bottom:8px}
  #absensi-app .hero p{opacity:.92;max-width:560px;margin:0 auto;font-size:14px;line-height:1.6}
  #absensi-app .site-section{padding:36px 18px;max-width:900px;margin:0 auto}
  #absensi-app .site-section h2{font-size:19px;color:#0f766e;margin-bottom:14px;text-align:center}
  #absensi-app .artikel-grid{display:grid;grid-template-columns:1fr;gap:16px}
  #absensi-app .artikel-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s}
  #absensi-app .artikel-card:hover{transform:translateY(-3px)}
  #absensi-app .artikel-card img{width:100%;height:150px;object-fit:cover;display:block;background:#e2e8f0}
  #absensi-app .artikel-card-body{padding:13px}
  #absensi-app .artikel-card-kat{display:inline-block;background:rgba(13,148,136,.1);color:#0d9488;font-size:10px;font-weight:700;padding:2px 9px;border-radius:12px;margin-bottom:6px}
  #absensi-app .artikel-card h4{font-size:14px;margin-bottom:4px;color:#1e293b}
  #absensi-app .artikel-card p{font-size:12px;color:#64748b;margin:0}
  #absensi-app .site-footer{background:#0f172a;color:#94a3b8;padding:24px 18px;text-align:center;font-size:12px;line-height:1.8}

  /* ====== KAS KELAS ====== */
  #absensi-app .kas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
  #absensi-app .kas-kartu{border:1px solid #e2e8f0;border-radius:12px;padding:12px;cursor:pointer;background:#fff;transition:all .18s}
  #absensi-app .kas-kartu:hover{border-color:#5eead4}
  #absensi-app .kas-kartu.aktif{border-color:var(--tema);background:#f0fdfa;box-shadow:0 0 0 2px rgba(13,148,136,.15)}
  #absensi-app .kas-nama{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
  #absensi-app .kas-sisa{font-size:19px;font-weight:800;color:#0f766e;margin:3px 0}
  #absensi-app .kas-rinci{font-size:11px;color:#94a3b8}

  /* ====== MENU KANTIN (kartu produk berfoto) ====== */
  #absensi-app .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){ #absensi-app .menu-grid{grid-template-columns:repeat(3,1fr);gap:12px} }
  @media(min-width:980px){ #absensi-app .menu-grid{grid-template-columns:repeat(4,1fr)} }
  #absensi-app .menu-kartu{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  /* aspect-ratio menjaga tinggi kartu tetap sama SEBELUM foto selesai dimuat, supaya
     tata letak tidak melompat-lompat saat foto masuk satu per satu */
  #absensi-app .menu-kartu img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f1f5f9}
  #absensi-app .menu-noimg{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#f1f5f9;font-size:30px}
  #absensi-app .menu-isi{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
  #absensi-app .menu-isi b{font-size:13.5px;line-height:1.35;color:#0f172a}
  #absensi-app .menu-harga{font-size:14px;font-weight:800;color:#0d9488}
  #absensi-app .menu-isi button{margin-top:auto;width:100%}

  /* Mode daftar: tanpa foto, paling ringan dan paling cepat untuk kasir sibuk */
  #absensi-app .menu-list{display:flex;flex-direction:column;gap:6px}
  #absensi-app .menu-item-teks{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;background:#fff}
  #absensi-app .menu-item-teks b{font-size:14px}
  #absensi-app .menu-item-teks .menu-harga{font-size:13px}
  #absensi-app .menu-item-teks button{min-width:44px}

  /* ====== HALAMAN DEPAN: bagian tambahan (statistik, tentang, video, galeri) ====== */
  /* Animasi halus saat bagian halaman masuk ke layar -- memberi kesan modern tanpa
     library tambahan. Kalau JS gagal jalan, elemen tetap terlihat (kelas .tampil
     ditambahkan JS; default-nya sudah opacity 1 lewat aturan .no-anim di bawah). */
  #absensi-app .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
  #absensi-app .reveal.tampil{opacity:1;transform:none}
  #absensi-app .no-anim .reveal{opacity:1;transform:none}

  #absensi-app .site-section.lebar{max-width:1100px}
  #absensi-app .sec-head{text-align:center;margin-bottom:22px}
  #absensi-app .sec-eyebrow{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0d9488;background:rgba(13,148,136,.09);padding:5px 14px;border-radius:20px;margin-bottom:10px}
  #absensi-app .sec-head h2{margin-bottom:6px}
  #absensi-app .sec-head p{font-size:13.5px;color:#64748b;max-width:560px;margin:0 auto;line-height:1.7}

  /* Statistik angka */
  #absensi-app .stat-band{background:linear-gradient(135deg,#0f766e,#134e4a);padding:30px 18px}
  #absensi-app .stat-grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media(min-width:768px){ #absensi-app .stat-grid{grid-template-columns:repeat(4,1fr)} }
  #absensi-app .stat-item{text-align:center;color:#fff}
  #absensi-app .stat-item .angka{font-size:30px;font-weight:800;line-height:1.1;color:#5eead4}
  #absensi-app .stat-item .ket{font-size:11.5px;margin-top:5px;opacity:.85;text-transform:uppercase;letter-spacing:.08em}

  /* Tentang: foto + teks berdampingan */
  #absensi-app .tentang-wrap{display:grid;grid-template-columns:1fr;gap:22px;align-items:center}
  @media(min-width:860px){ #absensi-app .tentang-wrap{grid-template-columns:1fr 1fr;gap:34px} }
  #absensi-app .tentang-foto{width:100%;border-radius:18px;object-fit:cover;max-height:340px;box-shadow:0 14px 36px rgba(15,23,42,.16);display:block}

      if (noSurah === batasSurah && noAyat <= batasAyat) return juz;

  // Halaman mushaf dari nomor surah + nomor ayat -- hasil PASTI.
  function halamanDariSurahAyat(noSurah, noAyat){
    var t = _idxAyatGlobal(noSurah, noAyat);
    if (!t || t < 1 || t > 6236) return null;
    var lo = 0, hi = 603, ans = 1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (HAL_AWAL_ABS[mid] <= t) { ans = mid + 1; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  // Hitung halaman dari nama surah + nomor ayat.
  function hitungHalamanDariAyat(namaSurah, noAyat) {
    var d = hitungHalamanDetail(namaSurah, noAyat);
    return d ? d.halaman : null;
  }

  // Versi lengkap: {halaman, pasti}. Sejak memakai tabel eksak,
  // "pasti" selalu true -- field dipertahankan agar pemanggil lama tetap jalan.
  function hitungHalamanDetail(namaSurah, noAyat) {
    var surah = cariDataSurah(namaSurah);
    if (!surah) return null;
    noAyat = Math.max(1, Math.min(Number(noAyat) || 1, surah[2]));
    var hal = halamanDariSurahAyat(surah[0], noAyat);
    return hal ? {halaman: hal, pasti: true} : null;
  }

  // Rentang halaman untuk satu rentang ayat dalam satu surah.
  function hitungRentangHalaman(namaSurah, ayatAwal, ayatAkhir){
    var a = hitungHalamanDariAyat(namaSurah, ayatAwal);
    var b = hitungHalamanDariAyat(namaSurah, ayatAkhir || ayatAwal);
    if (!a) return null;
    if (!b || b < a) b = a;
    return {awal: a, akhir: b};
  }

  function kunciCacheBaca(action, payload){
    var p = '';
    try { p = JSON.stringify(payload || {}); } catch(e) { p = ''; }
    return action + '|' + p;
  }
  function bacaSemuaCache(){
    try { return JSON.parse(localStorage.getItem(CACHE_BACA_KEY) || '{}'); } catch(e){ return {}; }
  }
  function simpanCacheBaca(action, payload, hasil){
    if (AKSI_CACHE_BACA.indexOf(action) === -1) return;
    var semua;
    try { semua = bacaSemuaCache(); } catch(e){ return; }
    semua[kunciCacheBaca(action, payload)] = { waktu: Date.now(), hasil: hasil };
    function buangTerlama(sisakan){
      var kunci = Object.keys(semua);
      kunci.sort(function(a,b){ return (semua[a].waktu||0) - (semua[b].waktu||0); });
      kunci.slice(0, Math.max(0, kunci.length - sisakan)).forEach(function(k){ delete semua[k]; });
    }
    buangTerlama(CACHE_BACA_MAKS);
    try {
      localStorage.setItem(CACHE_BACA_KEY, JSON.stringify(semua));
    } catch(e) {
      // Penyimpanan HP penuh: buang separuh entri terlama lalu coba sekali lagi,
      // supaya data yang baru diunduh tetap tersimpan (bukan gagal diam-diam).
      try {
        buangTerlama(Math.floor(Object.keys(semua).length / 2));
        localStorage.setItem(CACHE_BACA_KEY, JSON.stringify(semua));
      } catch(e2) { /* tetap gagal: cache bersifat bonus, jangan ganggu aplikasi */ }
    }
  }
  function ambilCacheBaca(action, payload){
    if (AKSI_CACHE_BACA.indexOf(action) === -1) return null;
    var entri = bacaSemuaCache()[kunciCacheBaca(action, payload)];
    return entri ? entri : null;
  }

  // ---------------- NOTIFIKASI PUSH (OneSignal) ----------------
  // SDK hanya dimuat kalau Admin sudah mengisi App ID -- kalau belum, tidak ada
  // apa pun yang dimuat, jadi aplikasi tetap ringan dan tidak ada error.
  //
  // PENTING: serviceWorkerPath & serviceWorkerParam sengaja diarahkan ke folder
  // /push/onesignal/ supaya service worker OneSignal TIDAK bertabrakan dengan /sw.js
  // milik aplikasi (yang mengurus mode offline). Kalau keduanya dipasang di root,
  // salah satu akan menonaktifkan yang lain.
  var _osSiap = false;
  var _osDimuat = false;

  function muatOneSignal(){
    var appId = STATE.pengaturan.OneSignalAppId;
    if (!appId) return Promise.resolve(false);
    if (_osDimuat) return Promise.resolve(_osSiap);
    _osDimuat = true;
    return new Promise(function(resolve){
      var s = document.createElement('script');
      s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
      s.defer = true;
      s.onerror = function(){ resolve(false); };
      document.head.appendChild(s);
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function(OneSignal){
        OneSignal.init({
          appId: appId,
          serviceWorkerPath: 'push/onesignal/OneSignalSDKWorker.js',
          serviceWorkerParam: { scope: '/push/onesignal/' },
          autoResubscribe: true,
          // Tombol bawaan OneSignal dimatikan: kita pakai tombol sendiri di dalam
          // aplikasi, supaya guru tidak langsung diberondong permintaan izin.
          notifyButton: { enable: false }
        }).then(function(){
          _osSiap = true;
          daftarkanIdentitasPush();
          resolve(true);
        }).catch(function(){ resolve(false); });
      });
    });
  }

  // Daftarkan pengguna dengan External ID = namanya. Ini yang membuat backend bisa
  // mengirim push ke orang tertentu ("kirim ke guru bernama X"), karena nama itu juga
  // yang dipakai di kolom Pengampu jadwal dan di RoleAkses.
  function daftarkanIdentitasPush(){
    if (!_osSiap || !STATE.user || !window.OneSignal) return;
    try {
      window.OneSignal.login(String(STATE.user.nama));
      var roles = (STATE.user.roles || []).join(',');
      if (window.OneSignal.User && window.OneSignal.User.addTags) {
        window.OneSignal.User.addTags({ role: roles });
      }
    } catch(e) { /* bukan fitur wajib, jangan ganggu aplikasi */ }
  }

  function statusIzinNotif(){
    if (!('Notification' in window)) return 'tidak-didukung';
    return Notification.permission; // 'granted' | 'denied' | 'default'
  }

  function mintaIzinNotif(){
    if (!STATE.pengaturan.OneSignalAppId) {
      return Promise.resolve({ok:false, error:'App ID OneSignal belum diatur oleh Admin (menu Notifikasi Push).'});
    }
    return muatOneSignal().then(function(siap){
      if (!siap || !window.OneSignal) {
        return {ok:false, error:'Layanan notifikasi gagal dimuat. Periksa koneksi internet lalu coba lagi.'};
      }
      return window.OneSignal.Notifications.requestPermission().then(function(){
        daftarkanIdentitasPush();
        var izin = statusIzinNotif();
        if (izin === 'granted') return {ok:true};
        if (izin === 'denied') return {ok:false, error:'Izin notifikasi ditolak. Aktifkan lewat browser: tekan ikon kunci/gembok di sebelah alamat situs > Notifikasi > Izinkan.'};
        return {ok:false, error:'Izin notifikasi belum diberikan.'};
      }).catch(function(e){
        return {ok:false, error:'Gagal meminta izin: ' + (e && e.message ? e.message : 'tidak diketahui')};
      });
    });
  }

    document.body.appendChild(el);
    el.querySelector('#notifAktifkan').onclick = function(){
      var btn = this; btn.disabled = true; btn.textContent = 'Memproses...';
      mintaIzinNotif().then(function(r){
        if (r.ok) { getarkanHp(); el.remove(); }
        else { btn.disabled = false; btn.textContent = 'Aktifkan'; el.querySelector('#notifPesanTawaran').innerHTML = errBox(r.error); }
      });
    };
    el.querySelector('#notifNanti').onclick = function(){
      try { localStorage.setItem(TAWARAN_NOTIF_KEY, String(Date.now())); } catch(e){}
      el.remove();
    };
  }

  // ---------------- SIAPKAN OFFLINE (pra-unduh semua data fitur harian) ----------------
  // Menarik semua data yang dibutuhkan fitur sehari-hari lalu menyimpannya ke cache,
  // supaya saat offline halamannya benar-benar bisa dibuka dan diisi.
  //
  // PENTING: kunci cache = nama aksi + payload. Jadi payload di sini HARUS sama persis
  // dengan yang dipakai fiturnya (lihat komentar tiap baris), kalau tidak cache-nya
  // tidak akan terpakai. Setiap perubahan payload di fitur harus diikuti di sini.
  var SIAP_OFFLINE_KEY = 'wasiatTerakhirSiapOfflineV1';

  function jalankanSiapkanOffline(lapor){
    if (!navigator.onLine) return Promise.resolve({ok:false, error:'Tidak ada koneksi internet. Sambungkan internet dulu untuk menyiapkan data offline.'});
    var nama = STATE.user ? STATE.user.nama : '';
    var roles = (STATE.user && STATE.user.roles) ? STATE.user.roles : [];
    var punya = function(r){ return roles.indexOf(r) !== -1; };
    var isGuru = punya('Guru') || punya('Admin') || punya('Mudir');

    // Tahap 1: data dasar yang tidak bergantung data lain
    var tahap1 = [
      {label:'Pengaturan aplikasi', aksi:'getPengaturan', p:{}},
      {label:'Daftar seluruh santri', aksi:'getSemuaSantri', p:{}},
      {label:'Daftar kelas', aksi:'getDaftarKelasRombel', p:{}},
      {label:'Daftar halaqoh', aksi:'getHalaqohList', p:{}},
      {label:'Jenis pelanggaran', aksi:'getMasterPelanggaran', p:{}},
      {label:'Jenis prestasi', aksi:'getMasterPrestasi', p:{}},
      {label:'Panduan SOP', aksi:'getSOPList', p:{}},
      {label:'SOP mengajar', aksi:'getSOPList', p:{kategori:'Mengajar'}},
      {label:'Data santri (master)', aksi:'getMasterData', p:{sheet:'Santri'}},
      {label:'Data guru (master)', aksi:'getMasterData', p:{sheet:'Guru'}},
      {label:'Data mata pelajaran', aksi:'getMasterData', p:{sheet:'MataPelajaran'}}
    ];
    if (isGuru && nama) {
      tahap1.push({label:'Jadwal mengajar Anda', aksi:'getJadwalGuru', p:{pengampu:nama}});
      tahap1.push({label:'Mata pelajaran Anda', aksi:'getMapelGuru', p:{pengampu:nama}});
      tahap1.push({label:'Santri halaqoh Anda', aksi:'getSantriHalaqohGuru', p:{pengampu:nama}});
      tahap1.push({label:'Jurnal mengajar hari ini', aksi:'getJurnalHariIni', p:{tanggal:todayStr(), pengampu:nama}});
      ['Subuh','Maghrib'].forEach(function(w){
        tahap1.push({label:'Halaqoh '+w, aksi:'getHalaqohGuru', p:{pengampu:nama, waktu:w}});
      });
    }
    if (punya('PembinaPutra') || punya('PembinaPutri')) {
      var gender = punya('PembinaPutra') ? 'Putra' : 'Putri';
      tahap1.push({label:'Santri asrama '+gender, aksi:'getSantriHarian', p:{gender:gender}});
      tahap1.push({label:'Daftar tugas harian', aksi:'getDaftarTugasPembina', p:{}});
      tahap1.push({label:'Tugas hari ini', aksi:'getTugasHariIni', p:{pembina:nama, tanggal:todayStr()}});
    }
    if (punya('WaliSantri')) {
      daftarNisnAnakWali().forEach(function(n){
        tahap1.push({label:'Jadwal anak', aksi:'getJadwalSantri', p:{nisn:n}});
        tahap1.push({label:'Rekap anak', aksi:'getRekapSantri', p:{nisn:n}});
      });
    }

    var total = tahap1.length, selesai = 0, gagal = 0;
    function ambilSatu(item){
      // apiJaringan langsung (bukan api()) supaya tidak terpengaruh jalur cache,
      // lalu hasil suksesnya disimpan ke cache dengan kunci yang sama.
      return apiJaringan(item.aksi, item.p).then(function(res){
        if (res && res.ok) simpanCacheBaca(item.aksi, item.p, res); else gagal++;
        selesai++;
        if (lapor) lapor(selesai, total, item.label);
        return res;
      }).catch(function(){ gagal++; selesai++; if (lapor) lapor(selesai, total, item.label); return null; });
    }

    // Dijalankan berurutan 3-3 (bukan semua sekaligus) supaya Apps Script tidak
    // kebanjiran permintaan dan gagal karena batas kuota bersamaan.
    function prosesBerkelompok(daftar){
      var i = 0;
      function lanjut(){
        if (i >= daftar.length) return Promise.resolve();
        var kelompok = daftar.slice(i, i+3);
        i += 3;
        return Promise.all(kelompok.map(ambilSatu)).then(lanjut);
      }
      return lanjut();
    }

    return prosesBerkelompok(tahap1).then(function(){
      // Tahap 2: data yang baru diketahui SETELAH tahap 1 (daftar kelas & jadwal)
      var tahap2 = [];
      var jadwal = ambilCacheBaca('getJadwalGuru', {pengampu:nama});
      if (jadwal && jadwal.hasil && jadwal.hasil.data) {
        var sudah = {};
        jadwal.hasil.data.forEach(function(j){
          if (!j.kelas || sudah['k'+j.kelas]) return;
          sudah['k'+j.kelas] = 1;
          tahap2.push({label:'Santri kelas '+j.kelas, aksi:'getSantriUntukAbsen', p:{kelas:j.kelas}});
        });
        jadwal.hasil.data.forEach(function(j){
          if (!j.mapel || !j.kelas) return;
          var k = 'm'+j.mapel+'|'+j.kelas;
          if (sudah[k]) return; sudah[k] = 1;
          tahap2.push({label:'RPP '+j.mapel, aksi:'getRPPList', p:{mapel:j.mapel, kelas:j.kelas}});
          tahap2.push({label:'Modul Ajar '+j.mapel, aksi:'getModulAjarList', p:{mapel:j.mapel, kelas:j.kelas}});
          tahap2.push({label:'Jurnal default '+j.mapel, aksi:'getDefaultJurnal', p:{mapel:j.mapel}});
        });
      }
      // Daftar santri per halaqoh untuk input hafalan hari ini
      ['Subuh','Maghrib'].forEach(function(w){
        var h = ambilCacheBaca('getHalaqohGuru', {pengampu:nama, waktu:w});
        if (h && h.hasil && h.hasil.data) {
          (h.hasil.data || []).forEach(function(x){
            var namaHalaqoh = x.namaHalaqoh || x.nama || x;
            if (!namaHalaqoh) return;
            tahap2.push({label:'Santri halaqoh '+namaHalaqoh, aksi:'getSantriUntukHafalan',
              p:{namaHalaqoh:namaHalaqoh, waktu:w, tanggal:todayStr(), pengampu:nama}});
          });
        }
      });
      if (!tahap2.length) return;
      total += tahap2.length;
      if (lapor) lapor(selesai, total, 'Menyiapkan data kelas & halaqoh...');
      return prosesBerkelompok(tahap2);
    }).then(function(){
      try { localStorage.setItem(SIAP_OFFLINE_KEY, String(Date.now())); } catch(e){}
      // Catat juga versi data saat ini: data yang baru saja diunduh sudah versi
      // terbaru, jadi jangan sampai notifikasi "tersedia pembaruan" langsung muncul
      // untuk perubahan yang sudah ikut terunduh tadi.
      return apiJaringan('getVersiData', {}).then(function(rv){
        if (rv && rv.ok && rv.versi && typeof rv.versi === 'object') {
          try { localStorage.setItem(VERSI_DATA_KEY, JSON.stringify(rv.versi)); } catch(e){}
        }
        return {ok:true, total:total, gagal:gagal};
      }).catch(function(){ return {ok:true, total:total, gagal:gagal}; });
    });
  }

    var wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = '<div class="modal" style="max-width:440px">' +

      '<div id="soProgresWrap" style="display:none;margin:14px 0">' +
        '<div style="background:#e2e8f0;border-radius:20px;height:10px;overflow:hidden"><div id="soBar" style="height:100%;width:0;background:var(--tema);transition:width .25s"></div></div>' +
        '<p class="muted" id="soTeks" style="margin-top:8px;font-size:12.5px">Memulai...</p>' +
      '</div>' +
      '<div id="soHasil"></div>' +
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
        '<button id="soMulai">Mulai Unduh</button>' +
        '<button class="secondary" id="soTutup">Tutup</button>' +

    root.appendChild(wrap);
    var btnTutup = wrap.querySelector('#soTutup');
    btnTutup.onclick = function(){ if (wrap && wrap.remove) wrap.remove(); };
    wrap.querySelector('#soMulai').onclick = function(){
      var btn = this;
      btn.disabled = true; btn.textContent = 'Mengunduh...';
      wrap.querySelector('#soProgresWrap').style.display = 'block';
      jalankanSiapkanOffline(function(selesai, total, label){
        var persen = Math.round(selesai/total*100);
        var bar = wrap.querySelector('#soBar'); if (bar) bar.style.width = persen+'%';
        var teks = wrap.querySelector('#soTeks');

      }).then(function(hasil){
        btn.disabled = false; btn.textContent = 'Unduh Ulang';

        elHasil.innerHTML = hasil.gagal
          ? warnBox('Selesai, tapi '+hasil.gagal+' dari '+hasil.total+' bagian gagal diunduh. Fitur yang datanya gagal mungkin belum bisa dibuka offline. Coba "Unduh Ulang" saat koneksi lebih stabil.')
          : '<div class="warn" style="background:#dcfce7;border-color:#86efac;color:#166534">&#9989; Siap! Semua data berhasil disimpan. Aplikasi sekarang bisa dipakai offline.</div>';
      });
    };
  }

  function waktuSiapOfflineTerakhir(){
    try {
      var t = Number(localStorage.getItem(SIAP_OFFLINE_KEY) || 0);
      if (!t) return '';
      var jam = Math.round((Date.now() - t) / 3600000);
      if (jam < 1) return 'baru saja';
      if (jam < 24) return jam + ' jam lalu';
      return Math.round(jam/24) + ' hari lalu';
    } catch(e){ return ''; }
  }

  // Tawaran otomatis setelah login: muncul kalau data offline belum pernah disiapkan,
  // atau sudah lewat 3 hari (kemungkinan besar sudah tertinggal). Sengaja berupa banner
  // yang bisa ditutup, BUKAN dialog paksa, supaya guru yang langsung mau mengisi
  // absensi tidak terhalang.
  var TAWARAN_SO_KEY = 'wasiatTawaranSiapOfflineDitutupV1';
  function tawarkanSiapkanOffline(){
    if (!navigator.onLine || !STATE.user) return;
    if (document.getElementById('tawaranSiapOffline')) return;
    var umur = 0, ditutup = 0;
    try {
      umur = Number(localStorage.getItem(SIAP_OFFLINE_KEY) || 0);
      ditutup = Number(localStorage.getItem(TAWARAN_SO_KEY) || 0);
    } catch(e){}
    var sudahLama = !umur || (Date.now() - umur > 3 * 24 * 3600 * 1000);
    // Kalau user baru menutup tawaran ini dalam 24 jam terakhir, jangan ganggu lagi.
    if (!sudahLama || (Date.now() - ditutup < 24 * 3600 * 1000)) return;

    var el = document.createElement('div');
    el.id = 'tawaranSiapOffline';
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9996;background:#fff;border:1px solid #e2e8f0;border-left:4px solid var(--tema);border-radius:12px;padding:13px 15px;box-shadow:0 10px 30px rgba(15,23,42,.18);max-width:min(420px,92vw);font-size:13px;line-height:1.6';
    el.innerHTML =
      '<b style="display:block;margin-bottom:4px">&#128229; Siapkan aplikasi untuk offline?</b>' +
      '<span class="muted">' + (umur ? 'Data offline terakhir disiapkan '+waktuSiapOfflineTerakhir()+'.' : 'Unduh data absensi, hafalan, nilai, jurnal, dan pelanggaran sekarang agar tetap bisa dipakai tanpa internet.') + '</span>' +
      '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">' +
        '<button id="soTawarMulai" style="padding:7px 14px;font-size:12.5px">Siapkan Sekarang</button>' +
        '<button class="secondary" id="soTawarNanti" style="padding:7px 14px;font-size:12.5px">Nanti</button>' +
      '</div>';
    document.body.appendChild(el);
    el.querySelector('#soTawarMulai').onclick = function(){ el.remove(); bukaDialogSiapkanOffline(); };
    el.querySelector('#soTawarNanti').onclick = function(){
      try { localStorage.setItem(TAWARAN_SO_KEY, String(Date.now())); } catch(e){}
      el.remove();
    };
  }


  var _timerBannerOffline = null;
  function tandaiSedangPakaiDataTersimpan(waktuCache){
    var el = document.getElementById('bannerOffline');
    if (!el) {
      el = document.createElement('div');
      el.id = 'bannerOffline';
      el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9998;background:#475569;color:#fff;padding:9px 14px;font-size:12.5px;text-align:center;box-shadow:0 -2px 8px rgba(0,0,0,.15)';
      document.body.appendChild(el);
    }
    var teksWaktu = '';
    if (waktuCache) {
      var menit = Math.round((Date.now() - waktuCache) / 60000);
      teksWaktu = menit < 1 ? ' (baru saja)' : (menit < 60 ? ' ('+menit+' menit lalu)' : ' ('+Math.round(menit/60)+' jam lalu)');
    }
    el.innerHTML = '&#128225; Mode offline &mdash; menampilkan data tersimpan di perangkat' + teksWaktu + '. Data baru akan dimuat saat internet kembali.';
    el.style.display = 'block';
    // Sembunyikan otomatis kalau beberapa detik berikutnya tidak ada lagi pembacaan
    // dari cache (artinya koneksi sudah normal kembali).
    if (_timerBannerOffline) clearTimeout(_timerBannerOffline);
    _timerBannerOffline = setTimeout(function(){
      if (navigator.onLine) { var e2 = document.getElementById('bannerOffline'); if (e2) e2.style.display='none'; }
    }, 8000);
  }

  // ---------------- NOTIFIKASI: tersedia pembaruan data ----------------
  // Dicek berkala ke server. Kalau penanda versi data spreadsheet berubah (misal Admin
  // mengubah data santri/jadwal, atau guru lain menginput sesuatu), tampilkan tombol
  // "Muat Ulang" -- TIDAK me-refresh paksa, supaya tidak mengganggu guru yang sedang
  // mengisi absensi/hafalan dan datanya belum sempat tersimpan.
  var VERSI_DATA_KEY = 'wasiatVersiDataTerakhirV2';
  var _cekVersiJalan = false;
  var _waktuSimpanTerakhirSendiri = 0; // diisi tiap user ini berhasil menyimpan data

  // Kelompok data yang berkaitan dengan pekerjaan masing-masing role. Notifikasi
  // pembaruan hanya muncul kalau kelompok yang RELEVAN dengan role yang sedang dipakai
  // yang berubah -- jadi guru tidak diganggu oleh perubahan tugas pembina, dan wali
  // tidak diganggu oleh perubahan daftar guru.
  var KELOMPOK_PER_ROLE = {
    'Admin':        ['santri','guru','mapel','kelas','halaqoh','jadwal','roleakses','tugaspembina','pengaturan','sop'],
    'Mudir':        ['santri','guru','mapel','kelas','halaqoh','jadwal','roleakses','tugaspembina','pengaturan','sop'],
    'Guru':         ['santri','guru','mapel','kelas','halaqoh','jadwal','sop'],
    'PembinaPutra': ['santri','kelas','halaqoh','tugaspembina','sop'],
    'PembinaPutri': ['santri','kelas','halaqoh','tugaspembina','sop'],
    'WaliSantri':   ['santri','kelas','halaqoh','jadwal','pengaturan'],
    'Bendahara':    ['santri','kelas','pengaturan'],
    'PemilikBarang':['santri','pengaturan']
  };
  // Nama yang ditampilkan ke user, supaya notifikasinya menjelaskan apa yang berubah.
  var LABEL_KELOMPOK = {
    santri:'data santri', guru:'data guru', mapel:'mata pelajaran', kelas:'kelas/rombel',
    halaqoh:'halaqoh', jadwal:'jadwal pelajaran', roleakses:'hak akses pengguna',
    tugaspembina:'daftar tugas pembina', pengaturan:'pengaturan aplikasi', sop:'panduan SOP'
  };

  function kelompokRelevanUntukUser(){
    var roles = (STATE.user && STATE.user.roles) ? STATE.user.roles : [];
    var hasil = {};
    roles.forEach(function(r){
      (KELOMPOK_PER_ROLE[r] || []).forEach(function(k){ hasil[k] = 1; });
    });
    var daftar = Object.keys(hasil);
    // Role yang tidak dikenali: pakai kelompok inti supaya tetap dapat pemberitahuan
    // untuk perubahan data paling dasar, bukan tidak dapat apa-apa.
    return daftar.length ? daftar : ['santri','kelas','halaqoh'];
  }

  function cekPembaruanData(){
    if (_cekVersiJalan || !navigator.onLine || !STATE.user) return;
    _cekVersiJalan = true;
    apiJaringan('getVersiData', {}).then(function(res){
      _cekVersiJalan = false;
      if (!res || !res.ok || !res.versi || typeof res.versi !== 'object') return;
      var versiBaru = res.versi;
      var tersimpan = {};
      try { tersimpan = JSON.parse(localStorage.getItem(VERSI_DATA_KEY) || '{}'); } catch(e){}

      // Belum ada catatan sama sekali (pertama kali setelah pembaruan aplikasi):
      // simpan sebagai acuan, jangan langsung memunculkan notifikasi.
      if (!Object.keys(tersimpan).length) {
        try { localStorage.setItem(VERSI_DATA_KEY, JSON.stringify(versiBaru)); } catch(e){}
        return;
      }

      var relevan = kelompokRelevanUntukUser();
      var berubah = relevan.filter(function(k){
        return versiBaru[k] !== undefined && tersimpan[k] !== undefined && versiBaru[k] !== tersimpan[k];
      });

      // Kelompok yang TIDAK relevan tetap dicatat diam-diam, supaya perubahannya tidak
      // menumpuk lalu memunculkan notifikasi di lain waktu tanpa sebab yang jelas.
      if (!berubah.length) {
        try { localStorage.setItem(VERSI_DATA_KEY, JSON.stringify(versiBaru)); } catch(e){}
        return;
      }

      // Perubahan tak lama setelah user ini sendiri menyimpan data biasanya berasal
      // dari simpanannya sendiri -- catat diam-diam, jangan munculkan notifikasi yang
      // membingungkan.
      if (Date.now() - _waktuSimpanTerakhirSendiri < 4 * 60 * 1000) {
        try { localStorage.setItem(VERSI_DATA_KEY, JSON.stringify(versiBaru)); } catch(e){}
        return;
      }

      tampilkanNotifPembaruan(versiBaru, berubah);
    }).catch(function(){ _cekVersiJalan = false; });
  }

  function tampilkanNotifPembaruan(versiBaru, kelompokBerubah){
    if (document.getElementById('notifPembaruan')) return; // sudah tampil, jangan dobel
    var daftarLabel = (kelompokBerubah || []).map(function(k){ return LABEL_KELOMPOK[k] || k; });
    var keterangan = daftarLabel.length
      ? ('Ada perubahan pada ' + (daftarLabel.length > 2
          ? (daftarLabel.slice(0,2).join(', ') + ' dan ' + (daftarLabel.length-2) + ' data lain')
          : daftarLabel.join(' dan ')) + '.')
      : 'Ada pembaruan data terbaru.';
    // Kalau user sudah pernah menyiapkan data offline, tawarkan sekalian memperbarui
    // unduhannya -- kalau tidak, data offline-nya akan tetap memakai data lama.
    var pernahSiapOffline = false;
    try { pernahSiapOffline = !!Number(localStorage.getItem(SIAP_OFFLINE_KEY) || 0); } catch(e){}

    var el = document.createElement('div');
    el.id = 'notifPembaruan';
    el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9999;background:#0f766e;color:#fff;padding:13px 15px;border-radius:12px;font-size:13px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:min(430px,92vw)';
    el.innerHTML =
      '<b style="display:block;margin-bottom:3px">&#128260; Tersedia pembaruan</b>' +
      '<span style="opacity:.92">'+esc(keterangan)+' Muat ulang agar aplikasi memakai data terbaru.</span>' +
      '<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">' +
        '<button id="btnMuatUlangData" style="background:#fff;color:#0f766e;border:none;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12.5px">Muat Ulang</button>' +
        (pernahSiapOffline ? '<button id="btnPerbaruiOffline" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:12.5px">Perbarui Data Offline</button>' : '') +
        '<button id="btnTutupNotifBaru" style="background:transparent;color:#fff;border:none;cursor:pointer;font-size:12.5px;opacity:.85">Nanti</button>' +
      '</div>';
    document.body.appendChild(el);

    function catatVersi(){ try { localStorage.setItem(VERSI_DATA_KEY, JSON.stringify(versiBaru)); } catch(e){} }

    document.getElementById('btnMuatUlangData').onclick = function(){
      catatVersi();
      // Cache TIDAK dihapus: setelah reload user sedang online, sehingga setiap
      // pembacaan otomatis mengambil data terbaru dari jaringan dan sekaligus
      // memperbarui cache. Menghapusnya hanya akan membuang hasil "Siapkan Offline".
      location.reload();
    };
    var btnOffline = document.getElementById('btnPerbaruiOffline');
    if (btnOffline) btnOffline.onclick = function(){
      catatVersi();
      el.remove();

  // Kirim request ke Google Apps Script Web App
  function apiJaringan(action, payload){
    if (!WEBAPP_URL || WEBAPP_URL.indexOf('PASTE_URL_WEBAPP') === 0) {
      return Promise.resolve({ok:false, error:'URL Web App belum diisi. Buka index.html dan isi WEBAPP_URL.'});
    }
    return fetch(WEBAPP_URL, {
      method:'POST',
      body: JSON.stringify({action:action, payload:payload||{}})
    })
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(txt){
        try { return JSON.parse(txt); }
        catch(e) { throw new Error('Respon server tidak valid'); }
      })
      .catch(function(err){
        var pesan = (typeof navigator !== 'undefined' && navigator.onLine === false)
          ? 'Tidak ada koneksi internet.'
          : 'Gagal terhubung ke server. Periksa koneksi internet Anda.';
        return {ok:false, error:pesan, _jaringanGagal:true};
      });
  }

  function api(action, payload){
    var bisaDiantre = AKSI_BISA_OFFLINE.indexOf(action) !== -1;
    var bisaDiCache = AKSI_CACHE_BACA.indexOf(action) !== -1;

    // Offline: langsung antre
    if (bisaDiantre && typeof navigator !== 'undefined' && navigator.onLine === false) {
      return _antrePesan(action, payload, 'offline');
    }

    // Offline + aksi baca: langsung pakai data tersimpan di perangkat kalau ada,
    // supaya halaman (Absensi, Hafalan, Jadwal, dsb) tetap bisa dibuka tanpa internet.
    if (bisaDiCache && typeof navigator !== 'undefined' && navigator.onLine === false) {
      var entriOffline = ambilCacheBaca(action, payload);
      if (entriOffline) {
        tandaiSedangPakaiDataTersimpan(entriOffline.waktu);
        return Promise.resolve(Object.assign({}, entriOffline.hasil, {_dariCache:true, _waktuCache:entriOffline.waktu}));
      }
    }

    return apiJaringan(action, payload).then(function(res){
      // Gagal karena jaringan (bukan error logika): antre kalau bisa
      if (bisaDiantre && !res.ok && res._jaringanGagal) {
        return _antrePesan(action, payload, 'jaringan_gagal');
      }
      // Gagal jaringan pada aksi baca: jatuh ke data tersimpan kalau ada
      if (bisaDiCache && !res.ok && res._jaringanGagal) {
        var entri = ambilCacheBaca(action, payload);
        if (entri) {
          tandaiSedangPakaiDataTersimpan(entri.waktu);
          return Object.assign({}, entri.hasil, {_dariCache:true, _waktuCache:entri.waktu});
        }
      }
      // Sukses & layak di-cache: simpan untuk dipakai saat offline nanti
      if (bisaDiCache && res && res.ok) simpanCacheBaca(action, payload, res);
      // Catat waktu penyimpanan sendiri -- dipakai supaya notifikasi "ada pembaruan
      // data" tidak muncul hanya karena perubahan yang dia sendiri buat.
      // Cache TIDAK dibuang di sini: selama online, api() selalu mengambil dari
      // jaringan lebih dulu (cache hanya dipakai kalau jaringan gagal), jadi data
      // basi tidak akan tampil. Membuangnya justru akan menghapus hasil
      // "Siapkan Offline" hanya karena user menyimpan satu absensi.
      if (bisaDiantre && res && res.ok && !res.offline) {
        _waktuSimpanTerakhirSendiri = Date.now();
      }
      return res;
    });
  }

  function _antrePesan(action, payload, alasan){
    var outbox = getOutbox();
    outbox.push({
      action:action, payload:payload,
      waktu:new Date().toISOString(),
      alasan:alasan, retryCount:0
    });
    setOutbox(outbox);
    var jumlah = payload && payload.items ? payload.items.length : 1;
    return Promise.resolve({
      ok:true, offline:true,
      ditambah:jumlah, diupdate:0,
      pesanOffline:'&#128225; Sedang offline — '+jumlah+' data tersimpan di perangkat dan akan otomatis dikirim saat online kembali.'
    });
  }

  // Kirim ulang semua data tertunda — dipanggil otomatis saat online
  var SEDANG_SINKRON = false;
  function sinkronkanOutbox(){
    if (SEDANG_SINKRON || !navigator.onLine) return;
    var sisa = getOutbox();
    if (!sisa.length) return;
    SEDANG_SINKRON = true;

    // Update badge — tampilkan progress
    var elBadge = document.getElementById('outboxBadge');
    if (elBadge) {
      elBadge.innerHTML = '&#9203; Mengirim '+sisa.length+' data tersimpan...';
      elBadge.style.display = 'flex';
      elBadge.style.background = '#2563eb';
    }

    function prosesSatu(arr, berhasil, gagal){
      if (!arr.length){
        // Selesai
        SEDANG_SINKRON = false;
        // Simpan yang masih gagal
        var sisaGagal = gagal.map(function(x){
          x.retryCount = (x.retryCount||0)+1;
          return x;
        }).filter(function(x){ return x.retryCount < 5; }); // hapus kalau sudah 5x gagal
        setOutbox(sisaGagal);
        if (berhasil > 0) {
          // Tampilkan notif sukses singkat
          var elB = document.getElementById('outboxBadge');
          if (elB) {
            elB.innerHTML = '&#10003; '+berhasil+' data berhasil dikirim!';
            elB.style.background = '#16a34a';
            elB.style.display = 'flex';
            setTimeout(function(){ perbaruiLencanaOutbox(); }, 3000);
          }
        } else {
          perbaruiLencanaOutbox();
        }
        return;
      }
      var item = arr[0];
      var sisa2 = arr.slice(1);
      apiJaringan(item.action, item.payload).then(function(res){
        if (res.ok) prosesSatu(sisa2, berhasil+1, gagal);
        else prosesSatu(sisa2, berhasil, gagal.concat([item]));
      }).catch(function(){
        SEDANG_SINKRON = false;
        // Koneksi putus lagi saat sinkron -- simpan sisa dan berhenti
        setOutbox(arr.concat(gagal));
        perbaruiLencanaOutbox();
      });
    }
    prosesSatu(sisa, 0, []);
  }

  // Cocokkan input santri (format tampilan "NISN - Nama") kembali ke NISN yang valid.

  function resolveSantriNisn(raw, santriList){
    raw = String(raw||'').trim();
    if (!raw) return null;
    var m = santriList.find(function(s){ return (s.nisn+' - '+s.nama) === raw; });
    if (m) return m.nisn;
    m = santriList.find(function(s){ return s.nisn === raw; });

    m = santriList.find(function(s){ return s.nama.toLowerCase() === raw.toLowerCase(); });
    return m ? m.nisn : null;

  // Format string waktu dari backend menjadi "HH:mm" yang ringkas.
  // Backend sudah menggunakan formatWaktu(), tapi fungsi ini dipasang
  // sebagai pelapis kedua di sisi klien supaya tidak ada format ganjil
  // yang lolos tampil ke pengguna, termasuk data lama yang mungkin masih
  // tersimpan di cache offline.
  function fmtWaktu(str){
    var s = String(str || '').trim();
    if (!s) return '';
    // Format Date penuh (ciri khas bug 1899): ambil jam:menit dari string
    if (s.length > 10 && s.indexOf(':') > 5) {
      var m = s.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
      return m ? m[1].padStart(2,'0') + ':' + m[2] : s;
    }
    // Format "HH:mm:ss" atau "HH:mm": ambil dua segmen pertama
    var parts = s.split(':');
    if (parts.length >= 2) return parts[0].padStart(2,'0') + ':' + parts[1];
    return s;
  }

  var WARNA_DEFAULT_PRODUK = [

  function parseRange(raw){

  function terapkanPengaturan(res){
    if (res.ok && res.data) {
      // Salin SEMUA pengaturan apa adanya dari server lebih dulu, baru timpa dengan
      // nilai default untuk field yang memang butuh default. Sebelumnya daftar field
      // ditulis satu per satu di sini, sehingga setiap pengaturan baru (video profil,

  function loadPengaturanLaluTampilkanLogin(){
    // Mode pratinjau: dibuka dari Admin > Website Builder ("Buka Pratinjau Halaman Depan")
    // supaya Admin bisa melihat tampilan publik yang sebenarnya walau sedang login (sesi
    // tersimpan biasanya langsung lompat ke dashboard, bukan ke halaman depan). Sama sekali
    // tidak memengaruhi alur login/sesi normal -- hanya aktif kalau parameter ini ada di URL.
    var modePratinjau = /[?&]preview=beranda(&|$)/.test(location.search);
    var sesiTersimpan = modePratinjau ? null : ambilSesiTersimpan();
    if (sesiTersimpan) {
      STATE.user = sesiTersimpan;
      lanjutkanKeDashboard();
      // Di background: perbarui pengaturan tampilan dan validasi sesi masih valid
      api('getPengaturan', {}).then(terapkanPengaturan);
      // Kalau online, verifikasi akun masih aktif di server (role bisa saja diubah Admin)
      // Kalau gagal (offline), biarkan sesi lama — tidak logout paksa saat offline
      if (navigator.onLine) {
        api('cekSesiAktif', {nama: sesiTersimpan.nama, noWa: sesiTersimpan.noWa}).then(function(res){
          if (!res.ok || res.nonaktif) {
            // Akun dinonaktifkan atau dihapus Admin — logout
            STATE.user = null; hapusSesiTersimpan(); showBeranda(true, res.pesan || 'Sesi Anda telah berakhir. Silakan login kembali.');
          } else if (res.user) {
            // Update data user terbaru (misal role berubah) tanpa refresh halaman
            STATE.user = res.user; simpanSesi();
          }
        }).catch(function(){}); // gagal (offline) → biarkan sesi lama
      }
      return;
    }
    render('<div style="text-align:center;padding:30px">Memuat...</div>');
    api('getPengaturan', {}).then(function(res){
      terapkanPengaturan(res);
      showBeranda();
    });

  // Ubah link video (YouTube biasa/share/Shorts, Google Drive, atau file .mp4 langsung)
  // menjadi HTML pemutar yang siap ditanam. Mengembalikan '' kalau link tidak dikenali,
  // supaya bagian video otomatis tidak ditampilkan daripada menampilkan kotak rusak.
  function htmlPemutarVideo(url){
    var u = String(url||'').trim();
    if (!u) return '';
    var m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
    if (m) return '<iframe src="https://www.youtube.com/embed/'+esc(m[1])+'?rel=0" title="Video Profil" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe>';
    var mDrive = u.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/);
    if (mDrive) return '<iframe src="https://drive.google.com/file/d/'+esc(mDrive[1])+'/preview" title="Video Profil" allow="autoplay" allowfullscreen loading="lazy"></iframe>';
    if (/\.(mp4|webm|ogg)(\?|$)/i.test(u)) return '<video src="'+esc(u)+'" controls preload="metadata" playsinline></video>';
    return '';
  }

  // Animasi "muncul saat di-scroll" untuk elemen ber-class .reveal. Kalau browser tidak
  // mendukung IntersectionObserver, semua langsung ditampilkan supaya tidak ada bagian
  // halaman yang tersembunyi permanen.
  function aktifkanAnimasiScroll(){
    var elemen = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      elemen.forEach(function(el){ el.classList.add('tampil'); });
      return;
    }
    var pengamat = new IntersectionObserver(function(entri){
      entri.forEach(function(e){
        if (e.isIntersecting) { e.target.classList.add('tampil'); pengamat.unobserve(e.target); }
      });
    }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
    elemen.forEach(function(el){ pengamat.observe(el); });
  }

        if (wrapFasilitas) wrapFasilitas.innerHTML = '<p class="muted" style="text-align:center;grid-column:1/-1">Belum diatur.</p>';
        return;
      }
      var program = res.data.filter(function(f){ return f.kategori === 'Program'; });
      var fasilitas = res.data.filter(function(f){ return f.kategori === 'Fasilitas'; });
      var galeri = res.data.filter(function(f){ return f.kategori === 'Galeri' && f.gambar; });
      if (wrapProgram) wrapProgram.innerHTML = program.length ? program.map(kartuFitur).join('') : '<p class="muted" style="text-align:center;grid-column:1/-1">Belum ada.</p>';
      if (wrapFasilitas) wrapFasilitas.innerHTML = fasilitas.length ? fasilitas.map(kartuFitur).join('') : '<p class="muted" style="text-align:center;grid-column:1/-1">Belum ada.</p>';

      // Galeri: seluruh bagian disembunyikan kalau Admin belum mengisi foto apa pun,
      // supaya halaman depan tidak menampilkan kotak kosong.
      var secGaleri = document.getElementById('sec-galeri');
      var wrapGaleri = document.getElementById('berandaGaleriWrap');
      if (secGaleri && wrapGaleri) {
        if (galeri.length) {
          secGaleri.style.display = '';
          wrapGaleri.innerHTML = galeri.map(function(g, i){
            return '<div class="galeri-item reveal" data-i="'+i+'"><img src="'+esc(g.gambar)+'" alt="'+esc(g.judul)+'" loading="lazy">' +
              (g.judul ? '<div class="cap">'+esc(g.judul)+'</div>' : '') + '</div>';
          }).join('');
          wrapGaleri.querySelectorAll('.galeri-item').forEach(function(el){
            el.onclick = function(){ var g = galeri[Number(el.dataset.i)]; bukaLightboxGaleri(g.gambar, g.judul); };
          });
        } else {
          secGaleri.style.display = 'none';
        }
      }
      aktifkanAnimasiScroll(); // kartu yang baru dirender ikut dianimasikan
    });

    if (bukaLoginOtomatis) bukaLoginDrawer(errMsg);
  }

  function bukaLoginDrawer(errMsg, modeKhusus){
    var drawer = document.getElementById('loginDrawer');
    var bg = document.getElementById('loginDrawerBg');
    if (!drawer || !bg) return;
    var logo = logoSrc();
    var judul = modeKhusus === 'kantin' ? 'Masuk Kantin' : 'Masuk';
    var subjudul = modeKhusus === 'kantin' ? 'Khusus Pemilik Barang -- masukkan No WA & PIN Anda' : esc(STATE.pengaturan.NamaPesantren);
    drawer.innerHTML = '<button class="login-drawer-close" id="tutupLoginDrawer">&times;</button>' +
      (logo?'<img src="'+esc(logo)+'" style="height:54px;width:54px;object-fit:contain;margin-bottom:10px">':'') +
      '<h3 style="color:#0f766e">'+esc(judul)+'</h3><p class="muted" style="margin-top:-8px">'+subjudul+'</p>' +
      (errMsg? errBox(errMsg) : '') +
      '<label>Nama / No WA</label><input id="loginId" placeholder="Nama atau No WA">' +
      '<label>PIN</label><input id="loginPin" type="password" placeholder="PIN">' +
      '<button id="btnLogin" style="width:100%;margin-top:6px">Masuk</button>';
    drawer.classList.add('show'); bg.classList.add('show');
    document.getElementById('tutupLoginDrawer').onclick = tutupLoginDrawer;
    document.getElementById('btnLogin').onclick = function(){
      var id = document.getElementById('loginId').value.trim();
      var pin = document.getElementById('loginPin').value.trim();
      if(!id || !pin){ bukaLoginDrawer('Isi nama/No WA dan PIN', modeKhusus); return; }
      var btn = document.getElementById('btnLogin'); btn.disabled = true; btn.innerText = 'Memeriksa...';
      api('login', {loginId:id, pin:pin}).then(function(res){
        if(!res.ok){ bukaLoginDrawer(res.error, modeKhusus); return; }
        if (modeKhusus === 'kantin' && res.user.roles.indexOf('PemilikBarang') === -1) {
          bukaLoginDrawer('Akun ini bukan akun Pemilik Barang. Gunakan tombol "Masuk" biasa untuk akses lain.', modeKhusus);
          return;
        }
        STATE.user = res.user;
        if (modeKhusus === 'kantin') { STATE.user.level = 'PemilikBarang'; simpanSesi(); lanjutkanKeDashboard(); return; }
        simpanSesi(); // simpan sesi supaya tidak perlu login ulang saat buka app lagi
        lanjutkanKeDashboard();
      });
    };
  }

  function lanjutkanKeDashboard(){
    simpanSesi();
    // Cek sekali beberapa detik setelah masuk (jangan langsung, biar tidak menambah
    // beban saat halaman baru dirender). Berikutnya ditangani interval berkala.
    setTimeout(cekPembaruanData, 6000);
    setTimeout(tawarkanSiapkanOffline, 9000);
    // Kalau izin notifikasi sudah pernah diberikan, muat SDK diam-diam supaya
    // perangkat ini tetap terdaftar dengan nama pengguna yang sedang login
    // (penting saat satu HP dipakai berganti akun).
    if (statusIzinNotif() === 'granted') setTimeout(muatOneSignal, 3000);
    else setTimeout(tawarkanAktifkanNotif, 14000);
    var roles = STATE.user.roles || [STATE.user.level];
    // WaliSantri (orang tua) selalu dashboard sendiri
    if (roles.length === 1 && roles[0] === 'WaliSantri') return dashboardWali();
    // Admin/Mudir dengan SATU role saja → dashboard Admin penuh
    var isAdminOnly = (roles.length === 1 && (roles[0] === 'Admin' || roles[0] === 'Mudir'));
    if (isAdminOnly) return dashboardAdmin();
    // PembinaPutra/Putri → multi-tab seperti role lain
    dashboardMultiRole(roles);
  }

    activeRoleTab = activeRoleTab || validRoles[0];
    STATE._contentId = 'multi-content';

    activeMenuKey = activeMenuKey || (menuAktif[0] && menuAktif[0].key) || '';

      '</div>';

  // ================= PEMILIH SANTRI (dipakai bersama) =================
  // Mengganti <datalist> yang tidak dapat diandalkan di HP: di banyak browser
  // Android, saran datalist baru muncul setelah beberapa huruf diketik, dan kadang
  // tidak muncul sama sekali -- kasir jadi tidak tahu ada daftar santri di sana.
  //
  // Komponen ini menampilkan daftar santri LANGSUNG tanpa perlu mengetik, bisa
  // disaring dengan mengetik, bisa dipilih dengan sekali ketuk, dan bisa diisi
  // lewat pindai QR. Dipakai di kasir kantin, cek akun santri, dan kas kelas
  // supaya cara memilih santri sama persis di semua tempat.
  //
  //   id          : awalan id elemen (harus unik dalam satu modal)
  //   label       : judul di atas kotak
  //   daftarSantri: [{nisn, nama, saldo?}]
  //   opts.tampilSaldo : tampilkan saldo di tiap baris
  function fieldPilihSantri(id, label, daftarSantri, opts){
    opts = opts || {};
    return '<label>'+esc(label)+'</label>' +
      '<div id="'+id+'_terpilih" style="display:none;background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13.5px"></div>' +
      '<div style="display:flex;gap:6px;margin-bottom:6px">' +
        '<input id="'+id+'_cari" placeholder="Ketik nama atau NISN..." autocomplete="off" style="flex:1;margin:0">' +
        '<button type="button" class="secondary" id="'+id+'_scan" title="Pindai kartu QR santri" style="padding:0 12px;margin:0">&#128247;</button>' +
      '</div>' +
      '<div id="'+id+'_daftar" style="max-height:210px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:10px"></div>' +
      '<input type="hidden" id="'+id+'" value="">';
  }

  // Pasang perilakunya setelah modal dirender. Mengembalikan objek dengan
  // .nilai() untuk mengambil santri yang sedang terpilih.
  function ikatPilihSantri(modal, id, daftarSantri, opts){
    opts = opts || {};
    var elCari = modal.querySelector('#'+id+'_cari');
    var elDaftar = modal.querySelector('#'+id+'_daftar');
    var elHidden = modal.querySelector('#'+id);
    var elTerpilih = modal.querySelector('#'+id+'_terpilih');
    var terpilih = null;

    function gambarDaftar(){
      var kata = elCari.value.toLowerCase().trim();
      var hasil = kata
        ? daftarSantri.filter(function(s){
            return (String(s.nama) + ' ' + String(s.nisn)).toLowerCase().indexOf(kata) !== -1;
          })
        : daftarSantri;
      // Dibatasi 60 baris supaya daftar panjang tidak membuat HP tersendat.
      // Kalau yang dicari belum kelihatan, mengetik akan mempersempitnya.
      var dipotong = hasil.length > 60;
      hasil = hasil.slice(0, 60);

      if (!hasil.length) {
        elDaftar.innerHTML = '<p class="muted" style="padding:12px;margin:0;font-size:13px">Tidak ada santri yang cocok.</p>';
        return;
      }
      elDaftar.innerHTML = hasil.map(function(s){
        var infoSaldo = (opts.tampilSaldo && s.saldo !== undefined)
          ? '<span style="font-size:12px;color:#0f766e;font-weight:600">Rp'+Number(s.saldo||0).toLocaleString('id-ID')+'</span>' : '';
        return '<div class="pilihSantriBaris" data-nisn="'+esc(s.nisn)+'" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer">' +
          '<div><b style="font-size:13.5px">'+esc(s.nama)+'</b><br><span class="muted" style="font-size:11.5px">'+esc(s.nisn)+'</span></div>' +
          infoSaldo + '</div>';
      }).join('') + (dipotong ? '<p class="muted" style="padding:8px 12px;margin:0;font-size:12px">Menampilkan 60 teratas &mdash; ketik untuk mempersempit.</p>' : '');

      elDaftar.querySelectorAll('.pilihSantriBaris').forEach(function(baris){
        baris.onclick = function(){ pilih(baris.dataset.nisn); };
      });
    }

    function pilih(nisn){
      var s = daftarSantri.find(function(x){ return String(x.nisn) === String(nisn); });
      if (!s) return;
      terpilih = s;
      elHidden.value = s.nisn;
      elTerpilih.style.display = 'block';
      elTerpilih.innerHTML = '&#9989; <b>'+esc(s.nama)+'</b> <span class="muted">('+esc(s.nisn)+')</span>' +
        ((opts.tampilSaldo && s.saldo !== undefined) ? '<br>Saldo: <b>Rp'+Number(s.saldo||0).toLocaleString('id-ID')+'</b>' : '');
      elCari.value = '';
      gambarDaftar();
      if (opts.onPilih) opts.onPilih(s);
    }

    elCari.oninput = gambarDaftar;
    modal.querySelector('#'+id+'_scan').onclick = function(){
      bukaPemindaiQR(function(teks){
        var s = cariSantriDariQR(teks, daftarSantri);
        if (!s) { alert('Santri tidak ditemukan dari QR: ' + teks); return; }
        pilih(s.nisn);
      });
    };
    gambarDaftar();

    return {
      nilai: function(){ return terpilih; },
      pilih: pilih
    };
  }

  // ================= INPUT NISN SANTRI (TRANSAKSI) =================
  // Dipakai di kasir kantin dan cek akun santri -- tempat di mana SANTRI SENDIRI
  // yang mengoperasikan HP atau kartu QR-nya.
  //
  // Sengaja TIDAK memakai daftar nama: kalau nama bisa dipilih bebas dari dropdown,
  // santri bisa memilih nama teman lalu memotong saldo milik orang lain -- penipuan
  // yang tidak terdeteksi karena tidak ada PIN di layar kasir.
  //
  // Satu-satunya cara masuk: ketik NISN sendiri (yang hanya santri itu tahu)
  // ATAU scan kartu QR santri yang memuat NISN-nya.
  // PIN Transaksi tetap diminta setelahnya sebagai lapisan kedua.
  function fieldNisnSantri(id, opts){
    opts = opts || {};
    return '<label>'+(opts.label||'NISN Santri')+'</label>' +
      '<div style="display:flex;gap:6px;margin-bottom:6px">' +
        '<input id="'+id+'_nisn" inputmode="numeric" placeholder="Ketik NISN santri..." autocomplete="off" style="flex:1;margin:0">' +
        '<button type="button" class="secondary" id="'+id+'_scan" title="Pindai kartu QR santri" style="padding:0 12px;margin:0">&#128247;</button>' +
      '</div>' +
      '<div id="'+id+'_info" style="min-height:32px;font-size:13px;padding:6px 0"></div>' +
      '<input type="hidden" id="'+id+'" value="">';
  }

  // Pasang perilaku: cari santri dari NISN yang diketik, tunjukkan namanya
  // sebagai konfirmasi (supaya santri bisa memastikan NISN yang diketik benar),
  // lalu simpan NISN di hidden input.
  // Mengembalikan objek dengan .nilai() untuk mengambil santri yang terpilih.
  function ikatNisnSantri(modal, id, daftarSantri, opts){
    opts = opts || {};
    var elNisn = modal.querySelector('#'+id+'_nisn');
    var elInfo = modal.querySelector('#'+id+'_info');
    var elHidden = modal.querySelector('#'+id);
    var terpilih = null;

    function cariDariNisn(){
      var nisn = elNisn.value.trim();
      if (!nisn) { elInfo.innerHTML=''; elHidden.value=''; terpilih=null; return; }
      var s = daftarSantri.find(function(x){ return String(x.nisn)===nisn; });
      if (s) {
        terpilih = s;
        elHidden.value = s.nisn;
        elInfo.innerHTML = '&#9989; <b>'+esc(s.nama)+'</b>' +
          ((opts.tampilSaldo && s.saldo !== undefined)
            ? ' &nbsp;&mdash;&nbsp; Saldo: <b style="color:#0f766e">Rp'+Number(s.saldo||0).toLocaleString('id-ID')+'</b>' : '');
        if (opts.onPilih) opts.onPilih(s);
      } else {
        terpilih = null; elHidden.value = '';
        elInfo.innerHTML = nisn.length >= 4
          ? '<span style="color:#dc2626;font-size:12.5px">&#10006; NISN tidak ditemukan. Periksa kembali nomor yang diketik.</span>'
          : '';
      }
    }

    elNisn.oninput = cariDariNisn;
    modal.querySelector('#'+id+'_scan').onclick = function(){
      bukaPemindaiQR(function(teks){
        var s = cariSantriDariQR(teks, daftarSantri);
        if (!s) { alert('Santri tidak ditemukan dari QR: '+teks); return; }
        elNisn.value = String(s.nisn);
        cariDariNisn();
        // Pindahkan fokus ke PIN supaya santri tinggal mengetik PIN-nya
        var elPin = modal.querySelector('[type="password"]');
        if (elPin) setTimeout(function(){ elPin.focus(); }, 100);
      });
    };

    return {
      nilai: function(){ return terpilih; },
      isi: function(nisn){
        elNisn.value = String(nisn);
        cariDariNisn();
      }
    };
  }

  // ================= PEMINDAI QR SANTRI =================
  // Dipakai untuk mencari santri dengan cepat di kasir kantin, menggantikan
  // pengetikan nama. Kamera BELAKANG yang dipakai (facingMode 'environment'),
  // karena kartu santri dipindai dari sisi depan HP.
  //
  // Pembacaan QR memakai BarcodeDetector bawaan browser kalau tersedia (paling
  // ringan, tanpa unduhan apa pun). Kalau browsernya belum mendukung, barulah
  // pustaka jsQR dimuat dari CDN -- hanya saat fitur ini dipakai, sehingga
  // pengguna yang tidak memakai pemindai tidak menanggung bebannya.

  var _jsQRDimuat = null;
  function muatJsQR(){
    if (window.jsQR) return Promise.resolve(true);
    if (_jsQRDimuat) return _jsQRDimuat;
    _jsQRDimuat = new Promise(function(resolve){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      s.onload = function(){ resolve(!!window.jsQR); };
      s.onerror = function(){ resolve(false); };
      document.head.appendChild(s);
    });
    return _jsQRDimuat;
  }

  // Buka pemindai. onHasil(teks) dipanggil sekali saat QR terbaca.
  function bukaPemindaiQR(onHasil){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Kamera tidak didukung di browser ini. Pastikan situs dibuka lewat HTTPS.');
      return;
    }
    var wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML =
      '<div class="modal" style="max-width:460px">' +
        '<h3>&#128247; Pindai QR Santri</h3>' +
        '<div style="position:relative;background:#000;border-radius:10px;overflow:hidden">' +
          '<video id="qrVideo" playsinline muted style="width:100%;display:block"></video>' +
          '<div style="position:absolute;inset:12% 12%;border:3px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none"></div>' +
        '</div>' +
        '<p class="muted" id="qrStatus" style="margin-top:8px">Menyalakan kamera...</p>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="secondary" id="qrGantiKamera">Ganti Kamera</button>' +
          '<button class="secondary" id="qrTutup">Tutup</button>' +
        '</div>' +
      '</div>';
    root.appendChild(wrap);

    var video = wrap.querySelector('#qrVideo');
    var status = wrap.querySelector('#qrStatus');
    var stream = null, berjalan = true, detector = null, kanvas = null, ctx = null;
    var pakaiBelakang = true;

    function berhenti(){
      berjalan = false;
      if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
      if (wrap && wrap.remove) wrap.remove();
    }
    wrap.querySelector('#qrTutup').onclick = berhenti;
    wrap.querySelector('#qrGantiKamera').onclick = function(){
      pakaiBelakang = !pakaiBelakang;
      if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
      mulaiKamera();
    };

    function mulaiKamera(){
      // 'environment' = kamera belakang. Sebagian HP hanya menurut kalau diminta
      // sebagai 'ideal', jadi dipakai bentuk ini supaya tidak gagal total di HP
      // yang cuma punya satu kamera.
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: pakaiBelakang ? {ideal:'environment'} : {ideal:'user'} },
        audio: false
      }).then(function(s){
        stream = s;
        video.srcObject = s;
        video.play();
        status.textContent = 'Arahkan kamera ke QR code santri...';
        mulaiPembacaan();
      }).catch(function(e){
        status.innerHTML = '<span style="color:#dc2626">Kamera tidak bisa dibuka: ' + esc(e.message || 'izin ditolak') +
          '. Pastikan Anda mengizinkan akses kamera dan situs dibuka lewat HTTPS.</span>';
      });
    }

    function selesai(teks){
      if (!berjalan) return;
      getarkanHp([60]);
      berhenti();
      onHasil(String(teks || '').trim());
    }

    function mulaiPembacaan(){
      if ('BarcodeDetector' in window) {
        try {
          detector = new window.BarcodeDetector({formats: ['qr_code']});
        } catch(e) { detector = null; }
      }
      if (detector) { bacaDenganDetector(); return; }
      muatJsQR().then(function(ok){
        if (!ok) {
          status.innerHTML = '<span style="color:#dc2626">Pembaca QR gagal dimuat. Periksa koneksi internet, atau cari santri dengan mengetik namanya.</span>';
          return;
        }
        kanvas = document.createElement('canvas');
        ctx = kanvas.getContext('2d', {willReadFrequently:true});
        bacaDenganJsQR();
      });
    }

    function bacaDenganDetector(){
      if (!berjalan) return;
      detector.detect(video).then(function(hasil){
        if (hasil && hasil.length) { selesai(hasil[0].rawValue); return; }
        if (berjalan) requestAnimationFrame(bacaDenganDetector);
      }).catch(function(){
        if (berjalan) requestAnimationFrame(bacaDenganDetector);
      });
    }

    function bacaDenganJsQR(){
      if (!berjalan) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        kanvas.width = video.videoWidth;
        kanvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, kanvas.width, kanvas.height);
        try {
          var data = ctx.getImageData(0, 0, kanvas.width, kanvas.height);
          var kode = window.jsQR(data.data, data.width, data.height, {inversionAttempts:'dontInvert'});
          if (kode && kode.data) { selesai(kode.data); return; }
        } catch(e) { /* frame gagal dibaca, lanjut ke frame berikutnya */ }
      }
      requestAnimationFrame(bacaDenganJsQR);
    }

    mulaiKamera();
  }

  // Cocokkan hasil pindaian ke daftar santri.
  // QR bisa berisi NISN polos, atau teks yang memuat NISN di dalamnya -- keduanya
  // ditangani supaya kartu santri yang sudah terlanjur dicetak tetap bisa dipakai.
  function cariSantriDariQR(teks, daftarSantri){
    var bersih = String(teks || '').trim();
    if (!bersih) return null;
    var tepat = daftarSantri.find(function(s){ return String(s.nisn) === bersih; });
    if (tepat) return tepat;
    // Cari NISN yang tertanam di dalam teks (misal "NISN:20250031" atau berupa link)
    var angka = bersih.match(/\d{4,}/g) || [];
    for (var i = 0; i < angka.length; i++) {
      var cocok = daftarSantri.find(function(s){ return String(s.nisn) === angka[i]; });
      if (cocok) return cocok;
    }
    // Terakhir: cocokkan dengan nama (kalau QR berisi nama santri)
    var kecil = bersih.toLowerCase();
    return daftarSantri.find(function(s){ return String(s.nama).toLowerCase() === kecil; }) || null;
  }

  // Cara kerja singkat:
  // 1. Semua gambar (template & foto santri) diambil lewat server sebagai base64.
  //    Ini WAJIB -- kalau gambar dimuat langsung dari URL Google, canvas menjadi
  //    "tercemar" dan tombol unduh akan gagal total.
  // 2. Preview memakai satu <canvas> yang digambar ulang tiap ada perubahan.
  //    Pendekatan canvas dipilih (bukan menumpuk elemen HTML) supaya yang dilihat
  //    di layar benar-benar sama dengan yang diunduh -- tidak ada selisih font
  //    atau posisi seperti kalau memakai screenshot HTML.
  // 3. Unduhan digambar ulang pada ukuran penuh template, jadi hasilnya tajam
  //    untuk dicetak meski preview di layar kecil.

  // Ambil gambar lewat server sebagai base64 lalu muat jadi objek Image.
  function muatGambarAman(url){
    return api('gambarKeBase64', {url:url}).then(function(r){
      if (!r.ok) throw new Error(r.error);
      return new Promise(function(resolve, reject){
        var img = new Image();
        img.onload = function(){ resolve(img); };
        img.onerror = function(){ reject(new Error('Gambar gagal dibaca.')); };
        img.src = r.dataUri;
      });
    });
  }

  // Muat file dari perangkat langsung jadi Image (tanpa lewat server).
  function fileKeImage(file, maksLebar){
    return resizeImageFile(file, maksLebar || 1000, 0.92).then(function(hasil){
      return new Promise(function(resolve, reject){
        var img = new Image();
        img.onload = function(){ resolve(img); };
        img.onerror = function(){ reject(new Error('Foto gagal dibaca.')); };
        img.src = 'data:' + hasil.mimeType + ';base64,' + hasil.base64;
      });
    });
  }
