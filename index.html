      function muatDaftarSS(){
        var html = '<table><tr><th>Nama</th><th>Aktif</th><th>Aksi</th></tr>';
        daftarSS.forEach(function(s){
          html += '<tr><td>'+esc(s.nama)+'</td><td>'+(s.aktif?'&#9989; Aktif':'-')+'</td>' +
            '<td>'+(s.aktif?'':'<button class="small btnAktifkanPelSS" data-id="'+esc(s.id)+'">Jadikan Aktif</button>')+'</td></tr>';
        });
        html += '</table>';
        document.getElementById('listPelSS').innerHTML = html;
        document.querySelectorAll('.btnAktifkanPelSS').forEach(function(btn){
          btn.onclick = function(){
            if(!confirm('Ganti spreadsheet Pelanggaran aktif? Pencatatan selanjutnya akan tersimpan di sini.')) return;
            api('setPelanggaranSSAktif', {id: btn.dataset.id}).then(function(res){ if(res.ok){ alert('Berhasil diganti.'); adminKelolaPelanggaran(); } else alert(res.error); });
          };
        });
        var selSS = document.getElementById('pelSSDipilih');
        selSS.innerHTML = daftarSS.map(function(s){ return '<option value="'+esc(s.id)+'" '+(s.id===aktifId?'selected':'')+'>'+esc(s.nama)+(s.aktif?' (Aktif)':'')+'</option>'; }).join('');
        selSS.onchange = function(){ muatRekap(); muatMaster(); };
      }
      document.getElementById('btnBuatPelSS').onclick = function(){
        var nama = document.getElementById('namaPelSSBaru').value.trim();
        if(!nama) return;
        var btn = document.getElementById('btnBuatPelSS'); btn.disabled=true; btn.innerText='Membuat...';
        api('buatPelanggaranSSBaru', {nama:nama}).then(function(res){
          btn.disabled=false; btn.innerText='Buat Spreadsheet Baru';
          if(res.ok){ alert('Spreadsheet "'+nama+'" dibuat. Jangan lupa "Jadikan Aktif" kalau ingin langsung dipakai.'); adminKelolaPelanggaran(); }
          else document.getElementById('pesanPelSS').innerHTML = errBox(res.error);
        });
      };

      function pelSSId(){ var el = document.getElementById('pelSSDipilih'); return el ? el.value : ''; }
      function sedangLihatAktif(){ return pelSSId() === aktifId; }

      function muatRekap(){
        document.getElementById('rekapPoinWrap').innerHTML = 'Memuat...';
        api('getRekapPoinSantri', {pelanggaranSSId: pelSSId()}).then(function(res){
          if(!res.ok){ document.getElementById('rekapPoinWrap').innerHTML = errBox(res.error); return; }
          var d = res.data;
          var html = '<p class="muted">Modal poin: '+d.modal+' | Aktif: '+d.totalAktif+' | Habis: '+d.totalHabis+'</p>';
          if (!d.data.length) { html += '<p class="muted">Belum ada catatan bulan ini.</p>'; }
          else {
            html += '<table><tr><th>NISN</th><th>Nama</th><th>Kelas</th><th>Poin</th><th>Status</th>' + (sedangLihatAktif() ? '<th>Aksi</th>' : '') + '</tr>';
            d.data.sort(function(a,b){ return a.poin-b.poin; }).forEach(function(s){
              html += '<tr><td>'+esc(s.nisn)+'</td><td>'+esc(s.nama)+'</td><td>'+esc(s.kelas)+'</td><td>'+s.poin+'/'+d.modal+'</td>' +
                '<td>'+(s.status==='Habis'?'&#9888;&#65039; Habis':'&#9989; Aktif')+'</td>' +
                (sedangLihatAktif() ? '<td><button class="small btnResetSatu" data-nisn="'+esc(s.nisn)+'">Reset</button></td>' : '') + '</tr>';
            });
            html += '</table>';
          }
          if (sedangLihatAktif()) html += '<button class="small danger" id="btnResetSemuaPoin" style="margin-top:8px">Reset Semua Poin Bulan Ini</button>';
          document.getElementById('rekapPoinWrap').innerHTML = html;
          document.querySelectorAll('.btnResetSatu').forEach(function(btn){
            btn.onclick = function(){ if(!confirm('Reset poin santri ini ke modal awal?')) return; api('resetPoinSatuSantri', {nisn:btn.dataset.nisn}).then(muatRekap); };
          });
          var btnAll = document.getElementById('btnResetSemuaPoin');
          if (btnAll) btnAll.onclick = function(){ if(!confirm('Reset SEMUA poin santri bulan ini ke modal awal?')) return; api('resetSemuaPoinSantri', {}).then(muatRekap); };
        });
      }

      function bukaFormMaster(jenis, existing){
        var fieldsHtml = fieldText('mpNama','Nama '+jenis, existing?existing.nama:'') + fieldText('mpPoin','Poin', existing?String(existing.poin):'');
        openModal(existing?('Edit '+jenis):('Tambah '+jenis), fieldsHtml, function(m){
          api('saveMasterPelPrestasi', {jenis:jenis, rowIndex: existing?existing.rowIndex:0, nama:m.querySelector('#mpNama').value.trim(), poin:m.querySelector('#mpPoin').value.trim()}).then(function(r){
            if(!r.ok) alert(r.error); else muatMaster();
          });
        });
      }
      document.getElementById('btnTambahPel').onclick = function(){ bukaFormMaster('Pelanggaran', null); };
      document.getElementById('btnTambahPres').onclick = function(){ bukaFormMaster('Prestasi', null); };

      function muatMaster(){
        api('getMasterPelanggaran', {pelanggaranSSId: pelSSId()}).then(function(res){
          if(!res.ok){ document.getElementById('listMasterPel').innerHTML = errBox(res.error); return; }
          var html = '<table><tr><th>Nama</th><th>Poin</th>'+(sedangLihatAktif()?'<th>Aksi</th>':'')+'</tr>' +
            res.data.map(function(x){ return '<tr><td>'+esc(x.nama)+'</td><td>-'+x.poin+'</td>' +
              (sedangLihatAktif() ? '<td><button class="small btnEditPel" data-row="'+x.rowIndex+'">Edit</button> <button class="small danger btnHapusPel" data-row="'+x.rowIndex+'">Hapus</button></td>' : '') + '</tr>'; }).join('') + '</table>';
          document.getElementById('listMasterPel').innerHTML = html;
          document.querySelectorAll('.btnEditPel').forEach(function(btn){ btn.onclick = function(){ bukaFormMaster('Pelanggaran', res.data.find(function(x){return x.rowIndex===Number(btn.dataset.row);})); }; });
          document.querySelectorAll('.btnHapusPel').forEach(function(btn){ btn.onclick = function(){ if(!confirm('Hapus?')) return; api('deleteMasterPelPrestasi', {jenis:'Pelanggaran', rowIndex:Number(btn.dataset.row)}).then(muatMaster); }; });
        });
        api('getMasterPrestasi', {pelanggaranSSId: pelSSId()}).then(function(res){
          if(!res.ok){ document.getElementById('listMasterPres').innerHTML = errBox(res.error); return; }
          var html = '<table><tr><th>Nama</th><th>Poin</th>'+(sedangLihatAktif()?'<th>Aksi</th>':'')+'</tr>' +
            res.data.map(function(x){ return '<tr><td>'+esc(x.nama)+'</td><td>+'+x.poin+'</td>' +
              (sedangLihatAktif() ? '<td><button class="small btnEditPres" data-row="'+x.rowIndex+'">Edit</button> <button class="small danger btnHapusPres" data-row="'+x.rowIndex+'">Hapus</button></td>' : '') + '</tr>'; }).join('') + '</table>';
          document.getElementById('listMasterPres').innerHTML = html;
          document.querySelectorAll('.btnEditPres').forEach(function(btn){ btn.onclick = function(){ bukaFormMaster('Prestasi', res.data.find(function(x){return x.rowIndex===Number(btn.dataset.row);})); }; });
          document.querySelectorAll('.btnHapusPres').forEach(function(btn){ btn.onclick = function(){ if(!confirm('Hapus?')) return; api('deleteMasterPelPrestasi', {jenis:'Prestasi', rowIndex:Number(btn.dataset.row)}).then(muatMaster); }; });
        });
      }

      document.getElementById('btnSimpanFonnte').onclick = function(){
        Promise.all([
          api('simpanPengaturan', {key:'FonnteToken', value: document.getElementById('pgFonnteToken').value.trim()}),
          api('simpanPengaturan', {key:'GrupPengajarWA', value: document.getElementById('pgGrupWA').value.trim()}),
          api('simpanPengaturan', {key:'ModalPoinSantri', value: document.getElementById('pgModalPoin').value.trim() || '25'})
        ]).then(function(){ document.getElementById('pesanFonnte').innerHTML = '<p class="muted">Tersimpan.</p>'; });
      };

      muatDaftarSS();
      muatRekap();
      muatMaster();
    });

  // ---------------- DIAGNOSTIK UKURAN DATA (Admin/Mudir, murni informasi) ----------------
  // Halaman ini HANYA membaca jumlah baris tiap sheet -- tidak ada tombol simpan, hapus,
  // atau ubah apa pun. Tujuannya semata memantau pertumbuhan data dari waktu ke waktu,
  // supaya kalau suatu saat ada yang menumpuk tidak wajar (misal karena bug), Admin
  // melihatnya lebih awal -- jauh sebelum itu terasa sebagai aplikasi melambat.
  function adminDiagnostikData(){
    var c = getContentEl();
    c.innerHTML = '<div class="card"><p class="muted">Memeriksa ukuran data...</p></div>';
    api('getDiagnostikUkuranData', {oleh: STATE.user.nama}).then(function(res){
      if (!res.ok){ c.innerHTML = '<div class="card">'+errBox(res.error)+'</div>'; return; }

      // Ambang batas HANYA untuk pewarnaan informatif -- tidak membatasi atau memblokir
      // apa pun. Sekadar isyarat visual: hijau = aman, kuning = mulai besar, merah =
      // sebaiknya diperiksa (biasanya tanda ada yang tidak wajar, bukan otomatis error).
      function warna(n){
        if (n === null) return '#94a3b8';
        if (n < 5000) return '#16a34a';
        if (n < 20000) return '#d97706';
        return '#dc2626';
      }
      function labelJumlah(n){
        return n === null ? '<span class="muted">sheet tidak ditemukan</span>' : n.toLocaleString('id-ID') + ' baris';
      }

      var html = '<div class="card"><h3>&#128202; Diagnostik Ukuran Data</h3>' +
        warnBox('Halaman ini hanya MEMBACA jumlah baris tiap sheet, tidak pernah mengubah data apa pun. Gunakan untuk memantau pertumbuhan data dari waktu ke waktu -- terutama sheet yang sengaja dibiarkan tumbuh lintas semester (SPP, RiwayatTasmi\', SaldoPemilik).') +
        '<p class="muted" style="font-size:12px">Diperiksa pada: '+esc(res.dicekPada)+' &middot; <button class="small secondary" id="btnMuatUlangDiag">Periksa Ulang</button></p>' +
        '</div>';

      res.kelompok.forEach(function(grp){
        if (grp.error) {
          html += '<div class="card"><h4>'+esc(grp.kelompok)+'</h4>'+errBox('Gagal diperiksa: '+grp.error)+'</div>';
          return;
        }
        html += '<div class="card"><h4 style="margin-bottom:2px">'+esc(grp.kelompok)+'</h4>' +
          (grp.catatan ? '<p class="muted" style="font-size:12px;margin-top:0">'+esc(grp.catatan)+'</p>' : '') +
          '<table><tr><th>Sheet</th><th>Jumlah Baris</th></tr>' +
          grp.baris.map(function(b){
            return '<tr><td>'+esc(b.sheet)+'</td>' +
              '<td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+warna(b.jumlah)+';margin-right:7px;vertical-align:middle"></span>' +
              '<b>'+labelJumlah(b.jumlah)+'</b></td></tr>';
          }).join('') + '</table></div>';
      });

      c.innerHTML = html;
      document.getElementById('btnMuatUlangDiag').onclick = adminDiagnostikData;
    }).catch(function(){
      c.innerHTML = '<div class="card">'+errBox('Gagal memuat diagnostik. Periksa koneksi lalu coba lagi.')+'</div>';
    });
  }

  // ---------------- WEBSITE BUILDER (satu halaman terpadu untuk atur tampilan depan) ----------------
  // Menggabungkan pengaturan yang sebelumnya tersebar di beberapa menu (Info Website,
  // bagian branding di Tampilan/Logo, Kelola Artikel, Fitur Halaman Depan) jadi satu
  // halaman bertab dengan tombol pratinjau langsung ke halaman depan sungguhan.
  // Tab "Program & Fasilitas" dan "Berita & Artikel" MEMAKAI ULANG adminFiturBeranda()/
  // adminArtikel() yang sudah ada (dialihkan lewat STATE._contentId) -- supaya tidak ada
  // logika CRUD yang diduplikasi/berisiko meleset dari aslinya. Menu lama (Info Website,
  // Kelola Artikel, Fitur Halaman Depan) sengaja tetap ada di kode (map di dashboardAdmin)
  // walau tidak lagi ditampilkan di sidebar, supaya tidak ada risiko apa pun yang patah.
  function adminWebsiteBuilder(sub){
    STATE._wbTab = sub || STATE._wbTab || 'identitas';
    var tabs = [
      {key:'identitas', label:'Identitas & Warna'},
      {key:'hero', label:'Hero & Tentang'},
      {key:'profilvideo', label:'Profil, Video & Statistik'},
      {key:'ppdbkontak', label:'PPDB & Kontak'},
      {key:'ikon', label:'Ikon Menu Melayang'},
      {key:'program', label:'Program, Fasilitas & Galeri'},
      {key:'berita', label:'Berita & Artikel'}
    ];
    var c = getContentEl();
    var urlPratinjau = location.origin + location.pathname + '?preview=beranda';
    c.innerHTML =
      '<div class="card" style="padding:14px 16px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
          '<h3 style="margin:0">&#127760; Website Builder &mdash; Atur Halaman Depan</h3>' +
          '<a href="'+esc(urlPratinjau)+'" target="_blank" rel="noopener" style="text-decoration:none;background:var(--tema);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px">Buka Pratinjau &#8599;</a>' +
        '</div>' +
        '<p class="muted" style="margin-top:6px;margin-bottom:0">Semua perubahan di sini langsung tampil di halaman depan publik setelah disimpan. Klik &quot;Buka Pratinjau&quot; kapan saja untuk melihat hasilnya di tab baru.</p>' +
      '</div>' +
      '<div class="card" style="padding:0;overflow:hidden">' +
        '<div style="display:flex;flex-wrap:wrap;border-bottom:1px solid #e2e8f0">' +
        tabs.map(function(t){
          var aktif = t.key === STATE._wbTab;
          return '<button class="wbTabBtn" data-tab="'+t.key+'" style="flex:1 1 140px;padding:12px 6px;border:none;border-bottom:3px solid '+(aktif?'var(--tema)':'transparent')+';background:'+(aktif?'#f0fdfa':'#fff')+';color:'+(aktif?'var(--tema)':'#475569')+';cursor:pointer;font-weight:700;font-size:12.5px">'+esc(t.label)+'</button>';
        }).join('') +
        '</div>' +
        '<div id="wbTabContent" style="padding:16px">Memuat...</div>' +
      '</div>';
    document.querySelectorAll('.wbTabBtn').forEach(function(btn){
      btn.onclick = function(){ adminWebsiteBuilder(btn.dataset.tab); };
    });

    // Tab Program&Fasilitas dan Berita cukup dialihkan ke fungsi admin yang sudah ada dan
    // sudah teruji -- tidak ditulis ulang di sini.
    if (STATE._wbTab === 'program') { STATE._contentId = 'wbTabContent'; adminFiturBeranda(); STATE._contentId = 'da-content'; return; }
    if (STATE._wbTab === 'berita')  { STATE._contentId = 'wbTabContent'; adminArtikel();      STATE._contentId = 'da-content'; return; }

    var target = document.getElementById('wbTabContent');
    api('getPengaturan', {}).then(function(res){
      var d = res.ok ? res.data : {};
      if (STATE._wbTab === 'hero') renderWbHero(target, d);
      else if (STATE._wbTab === 'profilvideo') renderWbProfilVideo(target, d);
      else if (STATE._wbTab === 'ppdbkontak') renderWbPpdbKontak(target, d);
      else if (STATE._wbTab === 'ikon') renderWbIkon(target, d);
      else renderWbIdentitas(target, d);
    });
  }

  // Helper upload gambar generik dipakai semua tab Website Builder -- sama persis polanya
  // dengan yang sudah dipakai di adminInfoWebsite/adminFiturBeranda (resizeImageFile lalu
  // uploadSlideImage), supaya perilaku unggah gambar konsisten di seluruh aplikasi.
  function ikatUploadWb(fileId, statusId, urlId, maxLebar, tampilBulat){
    var fileEl = document.getElementById(fileId);
    if (!fileEl) return;
    fileEl.onchange = function(e){
      var file = e.target.files[0];
      if (!file) return;
      var statusEl = document.getElementById(statusId);
      var gaya = tampilBulat ? 'height:50px;width:50px;border-radius:50%;object-fit:cover;margin-top:4px;display:block' : 'height:70px;border-radius:6px;margin-top:4px;display:block';
      statusEl.innerHTML = '<p class="muted">Memproses gambar...</p>';
      resizeImageFile(file, maxLebar||1200, 0.8).then(function(hasil){
        statusEl.innerHTML = '<p class="muted">Mengunggah...</p>';
        api('uploadSlideImage', {base64: hasil.base64, mimeType: hasil.mimeType, fileName: file.name}).then(function(res){
          if(!res.ok){ statusEl.innerHTML = errBox(res.error); return; }
          document.getElementById(urlId).value = res.url;
          statusEl.innerHTML = '<p class="muted">Berhasil diunggah.</p><img src="'+esc(res.url)+'" style="'+gaya+'">';
        });
      }).catch(function(){ statusEl.innerHTML = errBox('Gagal memproses gambar. Coba file lain.'); });
    };
  }

  function adminArtikel(){
    var c = getContentEl();
    c.innerHTML = '<div class="card"><h3>Artikel / Berita</h3>' +
      warnBox('Artikel berstatus "Published" akan tampil di halaman depan (Beranda) untuk umum, termasuk yang belum login. Status "Draft" hanya terlihat di sini.') +
      '<button class="small" id="btnTambahArtikel">+ Tulis Artikel Baru</button><div id="daftarArtikelWrap">Memuat...</div></div>';

    function bukaFormArtikel(existing, muatUlang){
      var fieldsHtml = fieldText('arJudul','Judul', existing?existing.judul:'') +
        fieldSelect('arKategori','Kategori', ['Berita','PPDB','Pengumuman','Kegiatan'], existing?existing.kategori:'Berita') +
        fieldText('arGambar','URL Gambar Sampul (opsional)', existing?existing.gambar:'') +
        '<label>Isi Artikel</label><textarea id="arKonten" rows="8" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:14px">'+esc(existing?existing.konten:'')+'</textarea>' +
        '<div class="grid2">' +
        '<div><label>Tanggal Publish</label><input type="date" id="arTanggal" value="'+(existing?existing.tanggalPublish:todayStr())+'"></div>' +
        '<div><label>Status</label><select id="arStatus"><option value="Draft" '+(!existing||existing.status==='Draft'?'selected':'')+'>Draft</option><option value="Published" '+(existing&&existing.status==='Published'?'selected':'')+'>Published (tampil publik)</option></select></div>' +
        '</div>';
      openModal(existing?'Edit Artikel':'Tulis Artikel Baru', fieldsHtml, function(m){
        var judul = m.querySelector('#arJudul').value.trim();
        if (!judul) { alert('Judul wajib diisi.'); return false; }
        api('saveArtikel', {rowIndex: existing?existing.rowIndex:0, judul:judul, konten:m.querySelector('#arKonten').value,
          gambar:m.querySelector('#arGambar').value.trim(), kategori:m.querySelector('#arKategori').value,
          tanggalPublish:m.querySelector('#arTanggal').value, status:m.querySelector('#arStatus').value, penulis:STATE.user.nama}).then(function(r){
            if(!r.ok) alert(r.error); else muatUlang();
          });
      });
    }
    document.getElementById('btnTambahArtikel').onclick = function(){ bukaFormArtikel(null, muatDaftarArtikel); };
    function muatDaftarArtikel(){
      api('getArtikelList', {}).then(function(res){
        if(!res.ok){ document.getElementById('daftarArtikelWrap').innerHTML = errBox(res.error); return; }
        if(!res.data.length){ document.getElementById('daftarArtikelWrap').innerHTML = '<p class="muted">Belum ada artikel. Klik "+ Tulis Artikel Baru".</p>'; return; }
        var html = '<table><tr><th>Judul</th><th>Kategori</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr>';
        res.data.forEach(function(a){
          html += '<tr><td>'+esc(a.judul)+'</td><td>'+esc(a.kategori)+'</td><td>'+esc(a.tanggalPublish)+'</td>' +
            '<td>'+(a.status==='Published'?'&#9989; Published':'&#9998;&#65039; Draft')+'</td>' +
            '<td><button class="small btnEditArtikel" data-row="'+a.rowIndex+'">Edit</button> <button class="small danger btnHapusArtikel" data-row="'+a.rowIndex+'">Hapus</button></td></tr>';
        });
        html += '</table>';
        document.getElementById('daftarArtikelWrap').innerHTML = html;
        document.querySelectorAll('.btnEditArtikel').forEach(function(btn){
          btn.onclick = function(){ bukaFormArtikel(res.data.find(function(a){return a.rowIndex===Number(btn.dataset.row);}), muatDaftarArtikel); };
        });
        document.querySelectorAll('.btnHapusArtikel').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Hapus artikel ini?')) return; api('deleteArtikel', {rowIndex:Number(btn.dataset.row)}).then(muatDaftarArtikel); };
        });
      });
    }
    muatDaftarArtikel();
  }

  function adminFiturBeranda(){
    var c = getContentEl();
    c.innerHTML = '<div class="card"><h3>Program Unggulan &amp; Fasilitas (Halaman Depan)</h3>' +
      warnBox('Tambahkan foto asli supaya halaman depan tampil seperti website sungguhan. Kalau foto tidak diisi, akan tampil ikon polos sebagai gantinya.') +
      '<button class="small" id="btnTambahFitur">+ Tambah Item</button>' +
      '<h4 style="margin-top:16px">Program Unggulan</h4><div id="listFiturProgram">Memuat...</div>' +
      '<h4 style="margin-top:16px">Fasilitas</h4><div id="listFiturFasilitas">Memuat...</div>' +
      '<h4 style="margin-top:16px">Galeri Kegiatan</h4>' +
      '<p class="muted" style="margin-top:-4px">Foto wajib diisi. Item galeri tanpa foto tidak akan tampil di halaman depan.</p>' +
      '<button class="small" id="btnTambahGaleri">+ Tambah Foto Galeri</button>' +
      '<div id="listFiturGaleri" style="margin-top:8px">Memuat...</div></div>';

    function bukaFormFitur(existing, muatUlang, kategoriAwal){
      var previewAwal = existing && existing.gambar ? '<img src="'+esc(existing.gambar)+'" style="height:60px;border-radius:6px;margin-top:4px;display:block">' : '';
      var katDefault = existing ? existing.kategori : (kategoriAwal || 'Program');
      var fieldsHtml = fieldSelect('ffKategori','Kategori', ['Program','Fasilitas','Galeri'], katDefault) +
        fieldText('ffJudul','Judul (untuk Galeri: dipakai sebagai keterangan foto)', existing?existing.judul:'') +
        fieldText('ffDeskripsi','Deskripsi (opsional, untuk Fasilitas boleh dikosongkan)', existing?existing.deskripsi:'') +
        '<label>Foto</label><input type="file" id="ffFile" accept="image/*">' +
        '<p class="muted" style="margin-top:-6px">Pilih foto dari HP/komputer -- otomatis dikecilkan &amp; diunggah. <b>Tunggu sampai muncul tulisan &quot;Berhasil diunggah&quot;</b> sebelum menekan Simpan.</p>' +
        fieldText('ffGambar','URL Gambar (terisi otomatis setelah unggah, atau isi manual)', existing?existing.gambar:'') +
        '<div id="ffUploadStatus">'+previewAwal+'</div>' +
        fieldText('ffUrutan','Urutan (angka kecil tampil duluan)', existing?String(existing.urutan):'0');

      var sedangUnggah = false; // dipakai untuk mencegah Simpan saat unggah belum selesai

      var modal = openModal(existing?'Edit Item':'Tambah Item', fieldsHtml, function(m){
        var judul = m.querySelector('#ffJudul').value.trim();
        if (!judul) { alert('Judul wajib diisi.'); return false; }
        // Foto masih diunggah: kalau diteruskan, item tersimpan tanpa foto.
        if (sedangUnggah) { alert('Foto masih diunggah. Tunggu sampai muncul "Berhasil diunggah", lalu tekan Simpan.'); return false; }
        var kategori = m.querySelector('#ffKategori').value;
        var gambar = m.querySelector('#ffGambar').value.trim();
        // Galeri tanpa foto tidak akan pernah tampil di halaman depan (memang disaring),
        // jadi lebih baik dicegah di sini daripada tersimpan tapi tidak kelihatan.
        if (kategori === 'Galeri' && !gambar) {
          alert('Item Galeri wajib punya foto. Pilih foto dulu dan tunggu sampai selesai diunggah.');
          return false;
        }
        // WAJIB di-return: tanpa ini modal langsung tertutup sebelum penyimpanan
        // selesai, sehingga kegagalan simpan tidak pernah terlihat oleh pengguna.
        return api('saveFiturBeranda', {rowIndex: existing?existing.rowIndex:0, kategori:kategori,
          judul:judul, deskripsi:m.querySelector('#ffDeskripsi').value.trim(), gambar:gambar,
          urutan:m.querySelector('#ffUrutan').value.trim()}).then(function(r){
            if(!r.ok){ alert(r.error); throw new Error(r.error); }
            muatUlang();
          });
      });
      modal.querySelector('#ffFile').onchange = function(e){
        var file = e.target.files[0];
        if (!file) return;
        var statusEl = modal.querySelector('#ffUploadStatus');
        sedangUnggah = true;
        statusEl.innerHTML = '<p class="muted">Memproses gambar...</p>';
        resizeImageFile(file, 1200, 0.8).then(function(hasil){
          statusEl.innerHTML = '<p class="muted">Mengunggah... mohon tunggu.</p>';
          api('uploadSlideImage', {base64: hasil.base64, mimeType: hasil.mimeType, fileName: file.name}).then(function(res){
            sedangUnggah = false;
            if(!res.ok){ statusEl.innerHTML = errBox(res.error); return; }
            modal.querySelector('#ffGambar').value = res.url;
            statusEl.innerHTML = '<p style="color:#16a34a;font-weight:600;margin:6px 0">&#9989; Berhasil diunggah.</p><img src="'+esc(res.url)+'" style="height:60px;border-radius:6px;margin-top:4px;display:block">';
          }).catch(function(){
            sedangUnggah = false;
            statusEl.innerHTML = errBox('Gagal mengunggah. Periksa koneksi lalu coba lagi.');
          });
        }).catch(function(){
          sedangUnggah = false;
          statusEl.innerHTML = errBox('Gagal memproses gambar. Coba file lain.');
        });
      };
    }
    document.getElementById('btnTambahFitur').onclick = function(){ bukaFormFitur(null, muatDaftarFitur); };
    document.getElementById('btnTambahGaleri').onclick = function(){ bukaFormFitur(null, muatDaftarFitur, 'Galeri'); };

    function muatDaftarFitur(){
      api('getFiturBerandaList', {}).then(function(res){
        if(!res.ok){ document.getElementById('listFiturProgram').innerHTML = errBox(res.error); return; }
        function renderGrup(containerId, list){
          if (!list.length) { document.getElementById(containerId).innerHTML = '<p class="muted">Belum ada.</p>'; return; }
          var html = '<table><tr><th>Foto</th><th>Judul</th><th>Urutan</th><th>Aksi</th></tr>';
          list.forEach(function(f){
            html += '<tr><td>'+(f.gambar?('<img src="'+esc(f.gambar)+'" style="width:60px;height:36px;object-fit:cover;border-radius:4px">'):'-')+'</td>' +
              '<td>'+esc(f.judul)+'</td><td>'+f.urutan+'</td>' +
              '<td><button class="small btnEditFitur" data-row="'+f.rowIndex+'">Edit</button> <button class="small danger btnHapusFitur" data-row="'+f.rowIndex+'">Hapus</button></td></tr>';
          });
          html += '</table>';
          document.getElementById(containerId).innerHTML = html;
        }
        var program = res.data.filter(function(f){ return f.kategori==='Program'; });
        var fasilitas = res.data.filter(function(f){ return f.kategori==='Fasilitas'; });
        var galeri = res.data.filter(function(f){ return f.kategori==='Galeri'; });
        renderGrup('listFiturProgram', program);
        renderGrup('listFiturFasilitas', fasilitas);
        renderGrup('listFiturGaleri', galeri);
        document.querySelectorAll('.btnEditFitur').forEach(function(btn){
          btn.onclick = function(){ bukaFormFitur(res.data.find(function(f){return f.rowIndex===Number(btn.dataset.row);}), muatDaftarFitur); };
        });
        document.querySelectorAll('.btnHapusFitur').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Hapus item ini?')) return; api('deleteFiturBeranda', {rowIndex:Number(btn.dataset.row)}).then(muatDaftarFitur); };
        });
      });
    }
    muatDaftarFitur();
  }

          BrosurPPDBURL: document.getElementById('wBrosurPPDB').value.trim(),
          VideoPPDBURL: document.getElementById('wVideoPPDB').value.trim(),
          AlamatPesantren: document.getElementById('wAlamat').value.trim(),
          NoTeleponPesantren: document.getElementById('wTelp').value.trim(),
          EmailPesantren: document.getElementById('wEmail').value.trim()
        };
        Promise.all(Object.keys(data).map(function(k){ return api('simpanPengaturan', {key:k, value:data[k]}); })).then(function(){
          Object.assign(STATE.pengaturan, data);
          document.getElementById('pesanWebsite').innerHTML = '<p class="muted">Tersimpan.</p>';
        });
      };
    });
  }

  // ---------------- KELOLA BARANG KANTIN ----------------
  // ---------------- FORM BARANG KANTIN (dipakai bersama Admin & Pemilik Barang) ----------------
  // Satu form untuk dua peran, supaya aturan harga/potongan tidak pernah berbeda
  // antara yang diisi Admin dan yang diisi pemilik sendiri.
  //   opts.pemilikTetap : kalau diisi, kolom Pemilik dikunci ke nama itu (mode Pemilik Barang)
  //   opts.daftarPemilik: pilihan nama pemilik (mode Admin)
  //   opts.aksiSimpan   : 'saveBarang' (Admin) atau 'saveBarangSaya' (Pemilik)
  var PERSEN_POTONGAN_KANTIN = 10; // disegarkan dari server saat halaman dibuka

  function hitungPotonganLokal(hargaBersih){
    var b = Number(hargaBersih) || 0;
    if (b <= 0) return 0;
    return Math.round(b * PERSEN_POTONGAN_KANTIN / 100);
  }

  function bukaFormBarangKantin(existing, opts, muatUlang){
    opts = opts || {};
    // Kolom Harga di data = harga jual ke santri (sudah termasuk potongan). Yang diisi
    // di form adalah harga bersih, jadi untuk item lama dihitung mundur dari keduanya.
    var bersihAwal = existing ? Math.max(0, (existing.harga||0) - (existing.potongan||0)) : '';
    var previewFoto = existing && existing.foto
      ? '<img src="'+esc(fotoUkuran(existing.foto, 160))+'" style="height:70px;border-radius:8px;margin-top:4px;display:block;object-fit:cover">' : '';

    var fieldPemilik = opts.pemilikTetap
      ? '<label>Pemilik</label><input value="'+esc(opts.pemilikTetap)+'" disabled style="background:#f1f5f9">'
      : fieldAutocomplete('bPemilik','Pemilik', opts.daftarPemilik || [], existing?existing.pemilik:'', 'Ketik nama pemilik...');

    // Mode potongan yang sedang berlaku untuk barang ini, dibaca balik dari datanya.
    var modeAwal = 'otomatis';
    if (existing) {
      var potLama = existing.potongan || 0, hargaLama = existing.harga || 0;
      if (potLama > 0 && potLama === hargaLama) modeAwal = 'pondok';
      else if (potLama === 0) modeAwal = 'nol';
      else if (potLama !== hitungPotonganLokal(hargaLama - potLama)) modeAwal = 'manual';
    }

    // Pilihan mode potongan HANYA ditampilkan untuk Admin/Mudir. Pemilik barang selalu
    // memakai hitungan otomatis yang seragam (server juga menolak kalau dipaksakan).
    var blokPotongan = opts.bolehAturPotongan ? (
      '<label>Potongan untuk Pondok</label>' +
      '<select id="bModePotongan">' +
        '<option value="otomatis"'+(modeAwal==='otomatis'?' selected':'')+'>Otomatis ('+PERSEN_POTONGAN_KANTIN+'% dari harga)</option>' +
        '<option value="manual"'+(modeAwal==='manual'?' selected':'')+'>Manual (isi nominal sendiri)</option>' +
        '<option value="nol"'+(modeAwal==='nol'?' selected':'')+'>Tanpa potongan (pemilik terima penuh)</option>' +
        '<option value="pondok"'+(modeAwal==='pondok'?' selected':'')+'>Barang milik pondok (semua masuk pondok)</option>' +
      '</select>' +
      '<div id="bWrapManual" style="display:none">' +
        '<label>Nominal Potongan per Item (Rp)</label>' +
        '<input id="bPotonganManual" inputmode="numeric" value="'+(modeAwal==='manual'?String(existing.potongan):'')+'" placeholder="contoh: 200">' +
      '</div>'
    ) : '';

    var fieldsHtml =
      fieldText('bNama','Nama Barang', existing?existing.nama:'') +
      '<label id="bLabelHarga">Harga Bersih yang Anda Terima (Rp)</label>' +
      '<input id="bHargaBersih" inputmode="numeric" value="'+esc(String(bersihAwal))+'" placeholder="contoh: 1000">' +
      blokPotongan +
      '<div id="bHitungan" style="background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.7;margin-bottom:10px"></div>' +
      fieldPemilik +
      fieldText('bNoWa','No WA Pemilik (opsional, notifikasi)', existing?existing.noWaPemilik:'') +
      '<label>Foto Produk (opsional)</label><input type="file" id="bFile" accept="image/*">' +
      '<p class="muted" style="margin-top:-6px">Boleh dikosongkan. Foto otomatis dikecilkan supaya aplikasi tetap ringan. <b>Tunggu sampai muncul &quot;Berhasil diunggah&quot;</b> sebelum menekan Simpan.</p>' +
      fieldText('bFoto','URL Foto (terisi otomatis setelah unggah)', existing?existing.foto:'') +
      '<div id="bUploadStatus">'+previewFoto+'</div>';

    var sedangUnggah = false;

    var modal = openModal(existing?'Edit Barang':'Tambah Barang', fieldsHtml, function(m){
      var nama = m.querySelector('#bNama').value.trim();
      if (!nama) { alert('Nama barang wajib diisi.'); return false; }
      var bersih = Number(String(m.querySelector('#bHargaBersih').value).replace(/[^\d]/g,''));
      if (!(bersih > 0)) { alert('Harga bersih wajib diisi dan lebih dari 0.'); return false; }
      if (sedangUnggah) { alert('Foto masih diunggah. Tunggu sampai selesai, lalu tekan Simpan.'); return false; }

      var pemilik = opts.pemilikTetap || m.querySelector('#bPemilik').value.trim();
      if (!pemilik) { alert('Pemilik wajib diisi.'); return false; }

      // Harga jual & potongan akhir dihitung SERVER, supaya seragam dan tidak bisa
      // diakali dari perangkat. Di sini hanya dikirim pilihannya.
      var kirim = {
        rowIndex: existing?existing.rowIndex:0, nama:nama, hargaBersih:bersih,
        pemilik:pemilik, noWaPemilik:m.querySelector('#bNoWa').value.trim(),
        foto:m.querySelector('#bFoto').value.trim()
      };
      if (opts.bolehAturPotongan) {
        kirim.oleh = STATE.user.nama; // diverifikasi ulang di server
        kirim.modePotongan = m.querySelector('#bModePotongan').value;
        kirim.potonganManual = Number(String(m.querySelector('#bPotonganManual').value).replace(/[^\d]/g,'')) || 0;
        if (kirim.modePotongan === 'manual' && !(kirim.potonganManual > 0)) {
          alert('Nominal potongan wajib diisi untuk mode Manual.'); return false;
        }
      }
      return api(opts.aksiSimpan || 'saveBarang', kirim).then(function(r){
        if(!r.ok){ alert(r.error); throw new Error(r.error); }
        muatUlang();
      });
    });

    // Pratinjau perhitungan langsung saat mengetik -- supaya pemilik melihat persis
    // berapa yang dia terima dan berapa yang dibayar santri, tanpa perlu menghitung.
    function perbaruiHitungan(){
      var nilai = Number(String(modal.querySelector('#bHargaBersih').value).replace(/[^\d]/g,'')) || 0;
      var elMode = modal.querySelector('#bModePotongan');
      var mode = elMode ? elMode.value : 'otomatis';
      var elLabel = modal.querySelector('#bLabelHarga');
      var elManual = modal.querySelector('#bWrapManual');
      if (elManual) elManual.style.display = (mode === 'manual') ? 'block' : 'none';
      // Pada mode "milik pondok" tidak ada pemilik yang menerima uang, jadi yang diisi
      // adalah harga jual apa adanya -- labelnya ikut berubah supaya tidak salah isi.
      if (elLabel) elLabel.textContent = (mode === 'pondok')
        ? 'Harga Jual ke Santri (Rp)' : 'Harga Bersih yang Diterima Pemilik (Rp)';

      var el = modal.querySelector('#bHitungan');
      if (nilai <= 0) { el.innerHTML = '<span class="muted">Isi harga untuk melihat perhitungannya.</span>'; return; }

      var potongan, jual, terima;
      if (mode === 'pondok')      { jual = nilai; potongan = nilai; terima = 0; }
      else if (mode === 'nol')    { potongan = 0; jual = nilai; terima = nilai; }
      else if (mode === 'manual') {
        potongan = Number(String(modal.querySelector('#bPotonganManual').value).replace(/[^\d]/g,'')) || 0;
        jual = nilai + potongan; terima = nilai;
      } else { potongan = hitungPotonganLokal(nilai); jual = nilai + potongan; terima = nilai; }

      el.innerHTML =
        'Pemilik terima: <b>Rp'+terima.toLocaleString('id-ID')+'</b><br>' +
        'Masuk ke pondok: <b>Rp'+potongan.toLocaleString('id-ID')+'</b>' +
        (mode==='pondok' ? ' <span class="muted">(barang milik pondok)</span>' : '') + '<br>' +
        '<span style="color:#0f766e">Santri membayar: <b style="font-size:15px">Rp'+jual.toLocaleString('id-ID')+'</b></span>';
    }
    modal.querySelector('#bHargaBersih').oninput = perbaruiHitungan;
    if (modal.querySelector('#bModePotongan')) modal.querySelector('#bModePotongan').onchange = perbaruiHitungan;
    if (modal.querySelector('#bPotonganManual')) modal.querySelector('#bPotonganManual').oninput = perbaruiHitungan;
    perbaruiHitungan();

    modal.querySelector('#bFile').onchange = function(e){
      var file = e.target.files[0];
      if (!file) return;
      var statusEl = modal.querySelector('#bUploadStatus');
      sedangUnggah = true;
      statusEl.innerHTML = '<p class="muted">Memproses gambar...</p>';
      resizeImageFile(file, 600, 0.72).then(function(hasil){
        statusEl.innerHTML = '<p class="muted">Mengunggah... mohon tunggu.</p>';
        api('uploadSlideImage', {base64: hasil.base64, mimeType: hasil.mimeType, fileName: file.name}).then(function(res){
          sedangUnggah = false;
          if(!res.ok){ statusEl.innerHTML = errBox(res.error); return; }
          modal.querySelector('#bFoto').value = res.url;
          statusEl.innerHTML = '<p style="color:#16a34a;font-weight:600;margin:6px 0">&#9989; Berhasil diunggah.</p><img src="'+esc(fotoUkuran(res.url,160))+'" style="height:70px;border-radius:8px;margin-top:4px;display:block;object-fit:cover">';
        }).catch(function(){
          sedangUnggah = false;
          statusEl.innerHTML = errBox('Gagal mengunggah. Periksa koneksi lalu coba lagi.');
        });
      }).catch(function(){
        sedangUnggah = false;
        statusEl.innerHTML = errBox('Gagal memproses gambar. Coba file lain.');
      });
    };
    return modal;
  }

  // Tabel daftar barang yang dipakai bersama Admin & Pemilik.
  function htmlTabelBarang(list, opts){
    opts = opts || {};
    var html = '<table><tr><th>Foto</th><th>Nama</th><th>Diterima</th><th>Potongan</th><th>Harga Santri</th>' +
      (opts.tampilkanPemilik ? '<th>Pemilik</th>' : '') + '<th>Aksi</th></tr>';
    list.forEach(function(b){
      var bersih = Math.max(0, (b.harga||0) - (b.potongan||0));
      // Penanda supaya barang yang diatur khusus langsung terlihat tanpa dibuka satu per satu
      var tanda = '';
      if ((b.potongan||0) > 0 && b.potongan === b.harga) tanda = ' <span style="background:#ede9fe;color:#5b21b6;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:10px">MILIK PONDOK</span>';
      else if ((b.potongan||0) === 0) tanda = ' <span style="background:#fef3c7;color:#92400e;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:10px">TANPA POTONGAN</span>';
      else if (b.potongan !== hitungPotonganLokal(bersih)) tanda = ' <span style="background:#e0f2fe;color:#075985;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:10px">MANUAL</span>';
      html += '<tr>' +
        '<td><img src="'+esc(gambarProduk(b.foto, b.nama, 80))+'" loading="lazy" style="width:44px;height:44px;object-fit:cover;border-radius:6px;display:block"></td>' +
        '<td>'+esc(b.nama)+tanda+'</td>' +
        '<td>Rp'+bersih.toLocaleString('id-ID')+'</td>' +
        '<td>Rp'+(b.potongan||0).toLocaleString('id-ID')+'</td>' +
        '<td><b>Rp'+(b.harga||0).toLocaleString('id-ID')+'</b></td>' +
        (opts.tampilkanPemilik ? ('<td>'+esc(b.pemilik)+'</td>') : '') +
        '<td><button class="small btnEditBarang" data-row="'+b.rowIndex+'">Edit</button> ' +
        '<button class="small danger btnHapusBarang" data-row="'+b.rowIndex+'">Hapus</button></td></tr>';
    });
    return html + '</table>';
  }

  // Segarkan persen potongan dari server (dipanggil saat halaman kelola barang dibuka)
  function muatPersenPotongan(){
    return api('getPersenPotonganKantin', {}).then(function(r){
      if (r && r.ok && r.persen > 0) PERSEN_POTONGAN_KANTIN = r.persen;
    }).catch(function(){});
  }

  // Panel perbaikan kolom Kategori di sheet TransaksiKantin.
  // Ditampilkan HANYA kalau benar-benar ada baris yang kategorinya kosong, supaya
  // tidak menjadi tombol berbahaya yang menganggur di layar Admin selamanya.
  function cekDanTampilkanPerbaikanKategori(){
    var wrap = document.getElementById('panelPerbaikanKategori');
    if (!wrap) return;
    api('cekKategoriKosong', {}).then(function(r){
      if (!r.ok || !r.kosong) { wrap.innerHTML = ''; return; }
      wrap.innerHTML =
        '<div class="card" style="border-left:4px solid #d97706">' +
          '<h4 style="margin-top:0">&#9888;&#65039; Perlu Perbaikan Data Transaksi</h4>' +
          '<p style="line-height:1.7;margin:6px 0"><b>' + r.kosong + ' dari ' + r.total + '</b> baris transaksi belum punya Kategori. ' +
          'Kolom ini dipakai untuk menyaring, bukan sekadar label &mdash; selama kosong, ' +
          '<b>limit jajan harian santri tidak berfungsi</b> dan <b>Riwayat Mutasi Saldo tampil kosong</b>.</p>' +
          '<p class="muted" style="font-size:12.5px">Perbaikan mengisi kategori berdasarkan isi transaksinya (ada pemilik barang &rarr; Kantin, berisi &quot;Top Up&quot; &rarr; Top Up Saldo, dan seterusnya). Baris yang kategorinya sudah terisi tidak akan diubah.</p>' +
          '<button id="btnPerbaikiKategori">Perbaiki Sekarang</button>' +
          '<div id="hasilPerbaikanKategori"></div>' +
        '</div>';
      document.getElementById('btnPerbaikiKategori').onclick = function(){
        if (!confirm('Isi Kategori untuk ' + r.kosong + ' baris yang masih kosong?\n\nBaris yang sudah terisi tidak akan diubah.')) return;
        var btn = this; btn.disabled = true; btn.textContent = 'Memperbaiki...';
        var el = document.getElementById('hasilPerbaikanKategori');
        el.innerHTML = '<p class="muted">Sedang memperbaiki, mohon tunggu...</p>';
        api('perbaikiKategoriTransaksi', {oleh: STATE.user.nama}).then(function(h){
          btn.disabled = false; btn.textContent = 'Perbaiki Sekarang';
          if (!h.ok) { el.innerHTML = errBox(h.error); return; }
          var rincian = Object.keys(h.rincian || {}).map(function(k){
            return k + ': ' + h.rincian[k];
          }).join(' &middot; ');
          el.innerHTML = '<div class="warn" style="background:#dcfce7;border-color:#86efac;color:#166534">' +
            '&#9989; Selesai. ' + h.diperbaiki + ' baris diperbaiki dari ' + h.diperiksa + ' yang diperiksa.' +
            (rincian ? '<br><span style="font-size:12.5px">' + rincian + '</span>' : '') + '</div>';
          setTimeout(cekDanTampilkanPerbaikanKategori, 2000);
        });
      };
    });
  }

  function adminBarangKantin(){
    var c = getContentEl();
    c.innerHTML = '<p>Memuat...</p>';
    Promise.all([api('getMasterData', {sheet:'Guru'}), muatPersenPotongan()]).then(function(hasil){
      var resGuru = hasil[0];
      var daftarNamaGuru = resGuru.ok ? resGuru.data.data.map(function(g){return g.Nama;}) : [];
      c.innerHTML = '<div id="panelPerbaikanKategori"></div>' +
        '<div class="card"><h3>Barang Kantin (Semua Pemilik)</h3>' +
        warnBox('Isi harga BERSIH yang ingin diterima pemilik -- potongan pondok ('+PERSEN_POTONGAN_KANTIN+'%) ditambahkan otomatis di atasnya. Khusus Admin/Mudir, potongan bisa diatur sendiri: dibebaskan, diisi nominal khusus, atau ditandai sebagai barang milik pondok (seluruh hasil penjualan masuk ke pondok). Pemilik barang tidak bisa mengubah pengaturan ini.') +
        '<button class="small" id="btnTambahBarang">+ Tambah Barang</button>' +
        '<div style="margin-top:10px"><input id="cariBarangAdmin" placeholder="Cari nama barang / pemilik..."></div>' +
        '<div id="daftarBarangWrap">Memuat...</div></div>';

      document.getElementById('btnTambahBarang').onclick = function(){
        bukaFormBarangKantin(null, {daftarPemilik: daftarNamaGuru, aksiSimpan:'saveBarang', bolehAturPotongan:true}, muatDaftarBarang);
      };

      var semuaBarang = [];
      function gambarTabel(){
        var kata = (document.getElementById('cariBarangAdmin').value || '').toLowerCase().trim();
        var list = kata
          ? semuaBarang.filter(function(b){ return (b.nama+' '+b.pemilik).toLowerCase().indexOf(kata) !== -1; })
          : semuaBarang;
        var wrap = document.getElementById('daftarBarangWrap');
        if (!list.length) { wrap.innerHTML = '<p class="muted">Tidak ada barang yang cocok.</p>'; return; }
        wrap.innerHTML = htmlTabelBarang(list, {tampilkanPemilik:true});
        document.querySelectorAll('.btnEditBarang').forEach(function(btn){
          btn.onclick = function(){
            bukaFormBarangKantin(
              semuaBarang.find(function(b){return b.rowIndex===Number(btn.dataset.row);}),
              {daftarPemilik: daftarNamaGuru, aksiSimpan:'saveBarang', bolehAturPotongan:true}, muatDaftarBarang);
          };
        });
        document.querySelectorAll('.btnHapusBarang').forEach(function(btn){
          btn.onclick = function(){
            if(!confirm('Hapus barang ini?')) return;
            api('deleteBarang', {rowIndex:Number(btn.dataset.row)}).then(muatDaftarBarang);
          };
        });
      }
      document.getElementById('cariBarangAdmin').oninput = gambarTabel;

      // Panel perbaikan kolom Kategori -- hanya muncul kalau memang ada yang kosong.
      cekDanTampilkanPerbaikanKategori();

      function muatDaftarBarang(){
        api('getBarangList', {}).then(function(res){
          if(!res.ok){ document.getElementById('daftarBarangWrap').innerHTML = errBox(res.error); return; }
          semuaBarang = res.data;
          if(!semuaBarang.length){ document.getElementById('daftarBarangWrap').innerHTML = '<p class="muted">Belum ada barang. Klik "+ Tambah Barang".</p>'; return; }
          gambarTabel();
        });
      }
      muatDaftarBarang();
    });
  }

  // ---------------- PEMILIK BARANG: kelola dagangan sendiri ----------------
  function pemilikKelolaBarang(){
    var c = getContentEl();
    c.innerHTML = '<p>Memuat...</p>';
    muatPersenPotongan().then(function(){
      c.innerHTML = '<div class="card"><h3>Barang Jualan Saya</h3>' +
        warnBox('Isi harga BERSIH yang ingin Anda terima. Potongan untuk pondok ('+PERSEN_POTONGAN_KANTIN+'%) ditambahkan otomatis ke harga yang dibayar santri -- jadi uang yang masuk ke Anda tetap sebesar harga bersih yang Anda isi. Foto boleh dikosongkan.') +
        '<button class="small" id="btnTambahBarangSaya">+ Tambah Barang</button>' +
        '<div id="daftarBarangSayaWrap" style="margin-top:10px">Memuat...</div></div>';

      document.getElementById('btnTambahBarangSaya').onclick = function(){
        bukaFormBarangKantin(null, {pemilikTetap: STATE.user.nama, aksiSimpan:'saveBarangSaya'}, muatBarangSaya);
      };

      function muatBarangSaya(){
        api('getBarangSaya', {pemilik: STATE.user.nama}).then(function(res){
          var wrap = document.getElementById('daftarBarangSayaWrap');
          if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
          if(!res.data.length){ wrap.innerHTML = '<p class="muted">Belum ada barang. Klik "+ Tambah Barang" untuk mulai berjualan.</p>'; return; }
          wrap.innerHTML = htmlTabelBarang(res.data, {tampilkanPemilik:false});
          document.querySelectorAll('.btnEditBarang').forEach(function(btn){
            btn.onclick = function(){
              bukaFormBarangKantin(
                res.data.find(function(b){return b.rowIndex===Number(btn.dataset.row);}),
                {pemilikTetap: STATE.user.nama, aksiSimpan:'saveBarangSaya'}, muatBarangSaya);
            };
          });
          document.querySelectorAll('.btnHapusBarang').forEach(function(btn){
            btn.onclick = function(){
              if(!confirm('Hapus barang ini?')) return;
              api('deleteBarangSaya', {rowIndex:Number(btn.dataset.row), pemilik: STATE.user.nama}).then(function(r){
                if(!r.ok){ alert(r.error); return; }
                muatBarangSaya();
              });
            };
          });
        });
      }
      muatBarangSaya();
    });
  }

        '</div><div id="raporContent" style="margin-top:10px"></div>';

  // ============ ADMIN: KELOLA KELOMPOK MATA PELAJARAN ============
  function adminKelompokMapel(){
    var c = getContentEl();
    c.innerHTML='<p>Memuat...</p>';
    api('getKelompokMapelList',{}).then(function(res){
      if(!res.ok){c.innerHTML=errBox(res.error);return;}
      var data=res.data||[];

      function render(){
        var html='<div class="card"><h3>&#128204; Kelompok Mata Pelajaran Rapor</h3>'+
          warnBox('Pengelompokan ini menentukan tampilan rapor santri. '+
            'A = Umum, B = Kepesantrenan, C = Muatan Lokal. '+
            'Kode kelompok harus huruf kapital (A, B, atau C).')+
          '<button id="btnTambahKelompok" style="margin-top:8px">+ Tambah Mapel</button>'+
          '<table style="margin-top:10px">'+
          '<tr><th>Nama Mapel</th><th>Kode</th><th>Nama Kelompok</th><th>Urutan</th><th>Aksi</th></tr>'+
          data.map(function(d,i){
            var warna=d.kodeKelompok==='A'?'#dbeafe':d.kodeKelompok==='B'?'#dcfce7':'#fef9c3';
            return '<tr style="background:'+warna+'">'+
              '<td>'+esc(d.namaMapel)+'</td>'+
              '<td style="text-align:center;font-weight:700">'+esc(d.kodeKelompok)+'</td>'+
              '<td>'+esc(d.namaKelompok)+'</td>'+
              '<td style="text-align:center">'+d.urutan+'</td>'+
              '<td style="white-space:nowrap">'+
              '<button class="small btnEditKM" data-idx="'+i+'">Edit</button> '+
              '<button class="small danger btnHapusKM" data-row="'+d.rowIndex+'">Hapus</button>'+
              '</td></tr>';
          }).join('')+'</table></div>';
        c.innerHTML=html;
        bindKelompokEvents();
      }

      function bindKelompokEvents(){
        document.getElementById('btnTambahKelompok').onclick=function(){ bukaFormKelompok(null); };
        c.querySelectorAll('.btnEditKM').forEach(function(btn){
          btn.onclick=function(){ bukaFormKelompok(data[Number(btn.dataset.idx)]); };
        });
        c.querySelectorAll('.btnHapusKM').forEach(function(btn){
          btn.onclick=function(){
            if(!confirm('Hapus mapel ini dari kelompok rapor?'))return;
            api('deleteKelompokMapel',{rowIndex:Number(btn.dataset.row)}).then(function(r){
              if(!r.ok){alert(r.error);return;}
              api('getKelompokMapelList',{}).then(function(r2){data=r2.data||[];render();});
            });
          };
        });
      }

      function bukaFormKelompok(item){
        openModal(item?'Edit Kelompok Mapel':'Tambah Mapel ke Kelompok',
          '<div class="grid2">'+
          '<div><label>Nama Mapel *</label><input id="kmMapel" value="'+esc(item?item.namaMapel:'')+'" placeholder="Bahasa Indonesia"></div>'+
          '<div><label>Kode Kelompok *</label>'+
          '<select id="kmKode">'+
          ['A','B','C'].map(function(k){
            return '<option value="'+k+'"'+(item&&item.kodeKelompok===k?' selected':'')+'>'+k+'</option>';
          }).join('')+
          '</select></div></div>'+
          '<label>Nama Kelompok *</label>'+
          '<input id="kmNamaKelompok" value="'+esc(item?item.namaKelompok:'')+'" placeholder="Mata Pelajaran Umum">'+
          '<label>Urutan (dalam kelompok)</label>'+
          '<input id="kmUrutan" type="number" min="1" value="'+(item?item.urutan:1)+'" style="width:80px">',
          function(modal){
            var payload={
              namaMapel:modal.querySelector('#kmMapel').value.trim(),
              kodeKelompok:modal.querySelector('#kmKode').value,
              namaKelompok:modal.querySelector('#kmNamaKelompok').value.trim(),
              urutan:Number(modal.querySelector('#kmUrutan').value)||1
            };
            if(!payload.namaMapel||!payload.namaKelompok){alert('Isi semua field.');return false;}
            if(item) payload.rowIndex=item.rowIndex;
            return api('saveKelompokMapel',payload).then(function(r){
              if(!r.ok){alert(r.error);return;}
              return api('getKelompokMapelList',{}).then(function(r2){data=r2.data||[];render();});
            });
          });
      }

      render();
    });
  }

    var c = getContentEl();

    c.innerHTML='<div class="card"><h3>&#128218; Rekap Halaqoh Al-Qur\'an</h3>'+

      '</div>'+

      '<div id="arSemuaHalaqoh" style="margin-top:10px"></div>'+
      '<div id="arDetailContent" style="margin-top:10px"></div>';

    function muat(){
      var dari = document.getElementById('arDari').value;
      var sampai = document.getElementById('arSampai').value;
      var halaqoh = document.getElementById('arHalaqoh').value.trim();
      var gender = document.getElementById('arGender').value;

      if (halaqoh) {
        // Tampilkan rekap halaqoh spesifik
        document.getElementById('arDetailContent').innerHTML='<p>Memuat...</p>';
        document.getElementById('arSemuaHalaqoh').innerHTML='';
        api('getRekapAbsensiHalaqoh',{namaHalaqoh:halaqoh, waktuHalaqoh:'Maghrib', tglMulai:dari, tglAkhir:sampai, gender:gender}).then(function(r){

          tampilkanRekapHalaqoh(r.data, document.getElementById('arDetailContent'));
          document.getElementById('btnCetakAR').onclick=function(){ cetakRekapHalaqoh(r.data); };
          document.getElementById('btnExcelAR').onclick=function(){ unduhExcelRekap(r.data); };
        });
      } else {
        // Tampilkan ringkasan semua halaqoh
        document.getElementById('arSemuaHalaqoh').innerHTML='<p>Memuat semua halaqoh...</p>';
        document.getElementById('arDetailContent').innerHTML='';
        api('getRekapSemuaHalaqoh',{waktuHalaqoh:'Maghrib', tglMulai:dari, tglAkhir:sampai}).then(function(r){
          if(!r.ok){ document.getElementById('arSemuaHalaqoh').innerHTML=errBox(r.error); return; }
          if(!r.data.length){ document.getElementById('arSemuaHalaqoh').innerHTML='<div class="card"><p class="muted">Belum ada data absensi halaqoh pada periode ini.</p></div>'; return; }
          document.getElementById('arSemuaHalaqoh').innerHTML=
            '<div class="card"><h4>Ringkasan Semua Halaqoh</h4>'+
            warnBox('Klik nama halaqoh untuk lihat detail per santri.')+
            '<table><tr><th>Nama Halaqoh</th><th>Pengampu</th><th>Gender</th><th>Total Sesi</th><th>Santri</th><th>Rata % Hadir</th></tr>'+
            r.data.map(function(h){
              var w=h.rataHadir>=75?'#16a34a':'#dc2626';
              return '<tr><td><b class="btnDetailHalaqoh" data-nama="'+esc(h.namaHalaqoh)+'" style="color:#0d9488;cursor:pointer;text-decoration:underline">'+esc(h.namaHalaqoh)+'</b></td>'+
                '<td>'+esc(h.pengampu)+'</td><td>'+esc(h.gender)+'</td>'+
                '<td style="text-align:center">'+h.totalSesi+'</td>'+
                '<td style="text-align:center">'+h.jumlahSantri+'</td>'+
                '<td style="color:'+w+';font-weight:700;text-align:center">'+h.rataHadir+'%</td></tr>';
            }).join('')+'</table></div>';

          document.querySelectorAll('.btnDetailHalaqoh').forEach(function(btn){
            btn.onclick=function(){
              document.getElementById('arHalaqoh').value=btn.dataset.nama;
              document.getElementById('btnCariAR').click();
            };
          });
        });
      }
    }
    document.getElementById('btnCariAR').onclick=muat;
    muat();
  }

  function pembinaTugasHarian(){
    var c = getContentEl();
    c.innerHTML = '<p>Memuat...</p>';
    var namaPembina = STATE.user.nama;
    var tanggalHariIni = todayStr();

    function muat(tanggal){
      api('getTugasHariIni', {pembina: namaPembina, tanggal: tanggal}).then(function(res){
        if (!res.ok){ c.innerHTML = errBox(res.error); return; }
        var d = res;
        var persen = d.persen;
        var warnaBar = persen===100?'#16a34a':persen>=60?'#f59e0b':'#ef4444';

        var html = '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
          '<h3 style="margin:0">&#9989; Tugas Harian — '+esc(d.hari)+', '+esc(tanggal)+'</h3>' +
          (STATE.pengaturan.IzinkanGantiTanggal ?
            '<input type="date" id="tgTanggal" value="'+esc(tanggal)+'" style="padding:5px 8px;border-radius:6px;border:1px solid #e2e8f0">' : '') +
          '</div>' +
          // Progress bar
          '<div style="margin:12px 0">' +
          '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">' +
          '<span>Progress: <b>'+d.selesai+'/'+d.total+'</b> tugas selesai</span>' +
          '<span style="font-weight:700;color:'+warnaBar+'">'+persen+'%</span></div>' +
          '<div style="height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden">' +
          '<div style="height:100%;width:'+persen+'%;background:'+warnaBar+';border-radius:99px;transition:.3s"></div></div></div>';

        if (!d.data.length){
          html += warnBox('Tidak ada tugas yang ditetapkan untuk hari '+d.hari+'. Hubungi Admin/Mudir untuk menambahkan tugas.');
        } else {
          html += '<div id="tugasChecklist">';
          // Kelompokkan per kategori
          var kategoriMap = {};
          d.data.forEach(function(t){
            var kat = t.kategori || 'Umum';
            if (!kategoriMap[kat]) kategoriMap[kat] = [];
            kategoriMap[kat].push(t);
          });
          Object.keys(kategoriMap).sort().forEach(function(kat){
            html += '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">'+esc(kat)+'</div>';
            kategoriMap[kat].forEach(function(t){
              var done = t.selesai;
              var borderKiri = done ? '4px solid #16a34a' : '4px solid #e2e8f0';
              var bg = done ? '#f0fdf4' : '#fff';
              html += '<div class="tugasItem" data-id="'+esc(t.id)+'" data-done="'+(done?'1':'0')+'" data-wajib-foto="'+(t.wajibFoto?'1':'0')+'" data-foto-url="'+esc(t.fotoUrl||'')+'" data-ri-real="'+(t.rowIndexReal||0)+'"'+
                ' style="border:1px solid #e2e8f0;border-left:'+borderKiri+';background:'+bg+';border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:.2s">' +
                '<div style="display:flex;align-items:center;gap:10px">' +
                '<div class="tugasCekBulat" style="width:24px;height:24px;border-radius:50%;border:2px solid '+(done?'#16a34a':'#cbd5e1')+';background:'+(done?'#16a34a':'transparent')+';display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
                (done?'<span style="color:#fff;font-size:14px">&#10003;</span>':'') +
                '</div>' +
                '<div style="flex:1">' +
                '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="font-weight:600;'+(done?'text-decoration:line-through;color:#94a3b8':'')+'">' + esc(t.nama) + '</span>' +
                (t.wajibFoto ? '<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:99px;white-space:nowrap">📷 Wajib Foto</span>' : '') +
                '</div>' +
                (t.berlaku !== 'Setiap Hari' ? '<div style="font-size:10px;color:#64748b">'+esc(t.berlaku)+'</div>' : '') +
                (t.waktu ? '<div style="font-size:11px;color:#16a34a">&#10003; Selesai pukul '+esc(t.waktu)+'</div>' : '') +
                '</div>' +
                '<div style="font-size:11px;color:#94a3b8">' + (done ? '&#9989;' : '&#9898;') + '</div>' +
                '</div>' +
                // Catatan
                '<div class="tugasCatatanWrap" style="display:'+(done?'block':'none')+';margin-top:8px;padding-top:8px;border-top:1px solid #e2e8f0">' +
                '<input class="tugasCatatan" placeholder="Catatan (opsional)..." value="'+esc(t.catatan)+'" style="width:100%;padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px">' +
                '</div>' +
                // Foto (hanya kalau wajib foto)
                (t.wajibFoto ? (
                  '<div class="tugasFotoWrap" style="display:'+(done?'block':'none')+';margin-top:8px;padding-top:8px;border-top:1px solid #e2e8f0">' +
                  (t.fotoUrl ?
                    '<div style="font-size:12px;color:#16a34a">&#10003; Foto sudah diupload &nbsp;' +
                    '<a href="'+esc(t.fotoUrl)+'" target="_blank" style="color:#0d9488">Lihat Foto</a>' +
                    '<span style="font-size:10px;color:#94a3b8"> (otomatis dihapus setelah 5 hari)</span></div>' :
                    '<label class="tugasFotoBtn" style="display:inline-flex;align-items:center;gap:6px;background:#0d9488;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px">'+
                    '&#128247; Upload Foto Bukti'+
                    '<input type="file" class="tugasFotoInput" accept="image/*" capture="environment" style="display:none">'+
                    '</label>' +
                    '<div class="tugasFotoProgress" style="display:none;font-size:12px;color:#64748b;margin-top:4px">&#9203; Mengupload foto...</div>'
                  ) +
                  '</div>'
                ) : '') +
                '</div>';
            });
            html += '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
        if (!setHtmlSafe(c.id||'main-content', html)) { c.innerHTML = html; }
        if (STATE.pengaturan.IzinkanGantiTanggal) {
          var inp = document.getElementById('tgTanggal');
          if (inp) inp.onchange = function(){ muat(this.value); };
        }

        // Event: klik item tugas → toggle centang
        document.querySelectorAll('.tugasItem').forEach(function(item){
          item.onclick = function(e){
            if (e.target.classList.contains('tugasCatatan')) return;
            if (e.target.classList.contains('tugasFotoInput')) return;
            if (e.target.closest('.tugasFotoWrap')) return;
            var id = item.dataset.id;
            var done = item.dataset.done === '1';
            var wajibFoto = item.dataset.wajibFoto === '1';
            var catWrap = item.querySelector('.tugasCatatanWrap');
            var catInput = item.querySelector('.tugasCatatan');
            var fotoWrap = item.querySelector('.tugasFotoWrap');

            if (!done) {
              // Tandai selesai
              if (catWrap) catWrap.style.display = 'block';
              if (wajibFoto && fotoWrap) {
                fotoWrap.style.display = 'block';
                // Jika wajib foto dan belum ada foto, minta upload dulu
                var fotoInput = item.querySelector('.tugasFotoInput');
                var sudahAdaFoto = item.dataset.fotoUrl && item.dataset.fotoUrl.length > 0;
                if (!sudahAdaFoto) {
                  fotoInput.click();
                  return; // Tunggu foto diupload dulu
                }
              }
            }
            var catatan = catInput ? catInput.value.trim() : '';
            api('centangTugas', {idTugas:id, pembina:namaPembina, tanggal:tanggal,
                                  selesai: !done, catatan: catatan}).then(function(r){
              if (!r.ok){ alert(r.error); return; }
              muat(tanggal);
            });
          };

          // Catatan: stop propagation
          var catInput = item.querySelector('.tugasCatatan');
          if (catInput) {
            catInput.addEventListener('click', function(e){ e.stopPropagation(); });
            catInput.addEventListener('change', function(){
              var id = item.dataset.id;
              if (item.dataset.done === '1') {
                api('centangTugas', {idTugas:id, pembina:namaPembina, tanggal:tanggal,
                                      selesai:true, catatan: this.value.trim()}).then(function(){});
              }
            });
          }

          // Foto: input file change
          var fotoInput = item.querySelector('.tugasFotoInput');
          if (fotoInput) {
            fotoInput.addEventListener('click', function(e){ e.stopPropagation(); });
            fotoInput.addEventListener('change', function(){
              var file = this.files[0];
              if (!file) return;
              if (file.size > 5*1024*1024) { alert('Ukuran foto maksimal 5 MB.'); this.value=''; return; }
              var reader = new FileReader();
              var btn = item.querySelector('.tugasFotoBtn');
              var progress = item.querySelector('.tugasFotoProgress');
              if (progress) progress.style.display = 'block';
              if (btn) btn.textContent = '⏳ Mengupload...';
              reader.onload = function(ev){
                var base64 = ev.target.result.split(',')[1];
                var mime = file.type || 'image/jpeg';
                var ri = item.dataset.riReal || '0';
                // Centang dulu, lalu upload foto
                var id = item.dataset.id;
                var catInput2 = item.querySelector('.tugasCatatan');
                var catatan = catInput2 ? catInput2.value.trim() : '';
                api('centangTugas', {idTugas:id, pembina:namaPembina, tanggal:tanggal,
                                      selesai:true, catatan: catatan}).then(function(r2){
                  if (!r2.ok){ alert(r2.error); return; }
                  api('uploadFotoTugas', {imageBase64:base64, mimeType:mime,
                    namaFile:'Tugas_'+namaPembina+'_'+tanggal+'_'+id+'.jpg',
                    idTugas:id, pembina:namaPembina, tanggal:tanggal,
                    rowIndexReal: Number(ri)}).then(function(ru){
                    if (progress) progress.style.display = 'none';
                    if (btn) btn.textContent = '📷 Foto Terkirim ✓';
                    if (!ru.ok){ alert('Foto gagal upload: '+ru.error+'\nTugas tetap ditandai selesai.'); }
                    muat(tanggal);
                  });
                });
              };
              reader.readAsDataURL(file);
            });
          }
        });
      });
    }
    muat(tanggalHariIni);
  }

              if(!r.ok){ alert(r.error); return; } muat();
            });
          };
        });
      });
    }
    muat();
  }

  // ---- UI MUDIR: Rekap + History Tugas Semua Pembina ----
  function adminRekapTugasPembina(){
    var c = getContentEl();
    c.innerHTML = '<p>Memuat...</p>';

    function muatRekap(tanggal){
      api('getRekapTugasPembina', {tanggal: tanggal}).then(function(res){
        if (!res.ok){ document.getElementById('rekapTugasWrap').innerHTML = errBox(res.error); return; }
        var d = res;
        var html = '<div style="margin-bottom:16px"><b>'+esc(d.hari)+', '+esc(d.tanggal)+'</b> — '+d.totalTugas+' tugas aktif hari ini</div>';
        if (!d.data.length){
          html += '<p class="muted">Belum ada data Pembina.</p>';
        } else {
          d.data.forEach(function(pb){
            var warna = pb.persen===100?'#16a34a':pb.persen>=60?'#f59e0b':'#ef4444';
            html += '<div style="margin-bottom:10px;padding:12px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:10px">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
              '<b>'+esc(pb.pembina)+'</b>' +
              '<span style="font-weight:700;font-size:15px;color:'+warna+'">'+pb.persen+'%</span></div>' +
              '<div style="height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden">' +
              '<div style="height:100%;width:'+pb.persen+'%;background:'+warna+';border-radius:99px;transition:.3s"></div></div>' +
              '<div style="font-size:12px;color:#64748b;margin-top:4px">'+pb.selesai+'/'+pb.total+' tugas selesai</div>' +
              '</div>';
          });
        }
        document.getElementById('rekapTugasWrap').innerHTML = html;
      });
    }

    function muatHistory(){
      var tglMulai = document.getElementById('htMulai') ? document.getElementById('htMulai').value : '';
      var tglAkhir = document.getElementById('htAkhir') ? document.getElementById('htAkhir').value : '';
      var pembinaF = document.getElementById('htPembina') ? document.getElementById('htPembina').value.trim() : '';
      document.getElementById('historyTugasWrap').innerHTML = 'Memuat...';
      api('getHistoryTugasPembina',{tglMulai:tglMulai, tglAkhir:tglAkhir, pembina:pembinaF}).then(function(res){
        if (!res.ok){ document.getElementById('historyTugasWrap').innerHTML = errBox(res.error); return; }
        var data = res.data;
        if (!data.length){ document.getElementById('historyTugasWrap').innerHTML = '<p class="muted">Tidak ada data pada rentang ini.</p>'; return; }
        // Pivot: baris = tanggal+pembina, kolom = status per tugas
        var html = '<div style="overflow-x:auto"><table style="font-size:12px"><tr>' +
          '<th>Tanggal</th><th>Pembina</th><th>Tugas</th><th>Status</th><th>Catatan</th><th>Waktu</th></tr>';
        data.forEach(function(r){
          var badge = r.status==='Selesai' ?
            '<span style="color:#16a34a;font-weight:700">&#9989; Selesai</span>' :
            '<span style="color:#94a3b8">&#9898; Belum</span>';
          html += '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.pembina)+'</td><td>'+esc(r.namaTugas)+'</td>' +
            '<td>'+badge+'</td><td>'+esc(r.catatan||'-')+'</td><td>'+esc(r.waktu||'-')+'</td></tr>';
        });
        html += '</table></div>';
        // Export Excel
        html += '<button id="btnExportHistory" class="secondary" style="margin-top:10px">&#128196; Export Excel</button>';
        document.getElementById('historyTugasWrap').innerHTML = html;
        document.getElementById('btnExportHistory').onclick = function(){
          var bom = '\uFEFF';
          var header = ['Tanggal','Pembina','Tugas','Status','Catatan','Waktu'];
          var rows = data.map(function(r){return [r.tanggal,r.pembina,r.namaTugas,r.status,r.catatan||'',r.waktu||''];});
          var csv = bom+[header].concat(rows).map(function(r){
            return r.map(function(v){var s=String(v||'');return s.includes(',')?'"'+s+'"':s;}).join(',');
          }).join('\n');
          var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
          a.download='HistoryTugasPembina_'+todayStr()+'.csv'; a.click();
        };
      });
    }

    var now = new Date();
    var tglHariIni = todayStr();
    var tgl7Lalu = new Date(now - 7*24*3600*1000);
    var tgl7LaluStr = tgl7Lalu.getFullYear()+'-'+String(tgl7Lalu.getMonth()+1).padStart(2,'0')+'-'+String(tgl7Lalu.getDate()).padStart(2,'0');

    c.innerHTML = '<div class="card"><h3>&#128202; Rekap Tugas Harian Pembina</h3>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">' +
      '<input type="date" id="rekapTanggal" value="'+tglHariIni+'" style="padding:5px 8px;border-radius:6px;border:1px solid #e2e8f0">' +
      '<button id="btnMuatRekap">Tampilkan</button></div>' +
      '<div id="rekapTugasWrap">Memuat...</div></div>' +
      '<div class="card" style="margin-top:12px"><h3>&#128203; History Lengkap</h3>' +
      '<div class="grid2" style="margin-bottom:8px">' +
      '<div><label class="muted">Dari Tanggal</label><input type="date" id="htMulai" value="'+tgl7LaluStr+'"></div>' +
      '<div><label class="muted">Sampai Tanggal</label><input type="date" id="htAkhir" value="'+tglHariIni+'"></div></div>' +
      '<div style="margin-bottom:8px"><label class="muted">Filter Pembina (kosongkan = semua)</label>' +
      '<input id="htPembina" placeholder="Nama pembina..." style="width:100%"></div>' +
      '<button id="btnCariHistory">Cari History</button>' +
      '<div id="historyTugasWrap" style="margin-top:12px"></div></div>';

    muatRekap(tglHariIni);
    document.getElementById('btnMuatRekap').onclick = function(){
      muatRekap(document.getElementById('rekapTanggal').value || tglHariIni);
    };
    document.getElementById('btnCariHistory').onclick = muatHistory;
    muatHistory();
  }

          '<div id="maUploadStatus"></div>' +
          '<button id="btnUploadMA" style="margin-top:10px">&#128640; Upload Semua File ke Kelas Terpilih</button>' +
          '<div id="maProgressWrap" style="display:none;margin-top:10px">' +
          '<div style="background:#e2e8f0;border-radius:8px;height:12px"><div id="maProgressBar" style="background:#0d9488;width:0%;height:100%;border-radius:8px;transition:width .3s"></div></div>' +
          '<p id="maProgressText" class="muted" style="font-size:12px;margin-top:4px"></p>' +
          '</div></div>' +

          '<div class="card"><h3>Daftar File Modul Ajar</h3>' +
          '<div style="display:flex;gap:8px;margin-bottom:10px">' +

            resMA.data.map(function(m){
              return '<tr class="maRow" data-mapel="'+esc(m.mapel.toLowerCase())+'" data-kelas="'+esc(m.kelas.toLowerCase())+'">'+
                '<td>'+esc(m.mapel)+'</td><td>'+esc(m.kelas)+'</td>' +

                '<button class="small danger btnHapusMA" data-row="'+m.rowIndex+'">Hapus</button></td></tr>';
            }).join('') + '</table>'
            : '<p class="muted">Belum ada file modul ajar.</p>') +
          '</div></div>' +

          '<div class="card"><h3>RPP Pertemuan</h3>' +
          '<button class="small" id="btnTambahRPP">+ Tambah Pertemuan</button>' +
          (resRPP.ok && resRPP.data.length ?
            '<table style="margin-top:10px"><tr><th>Mapel</th><th>Kelas</th><th>Pertemuan</th><th>Topik</th><th>JP</th><th>Aksi</th></tr>' +
            resRPP.data.map(function(r){
              return '<tr><td>'+esc(r.mapel)+'</td><td>'+esc(r.kelas)+'</td><td>'+r.noPertemuan+'</td>'+
                '<td>'+esc(r.topik)+'</td><td>'+r.alokasiJP+'</td>' +
                '<td><button class="small btnEditRPP" data-row="'+r.rowIndex+'">Edit</button> '+
                '<button class="small danger btnHapusRPP" data-row="'+r.rowIndex+'">Hapus</button></td></tr>';
            }).join('') + '</table>'
            : '<p class="muted">Belum ada RPP pertemuan.</p>') + '</div>';

        // Preview kelas saat diketik
