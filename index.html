  // ---- Kanvas ----
  function siapkanKanvas(){
    var kanvas = document.getElementById('flKanvas');
    if (!kanvas || !FL.templateImg) return;
    // Kanvas dibuat seukuran template aslinya supaya hasil unduhan tajam.
    // CSS yang mengecilkan tampilannya di layar, bukan resolusinya.
    kanvas.width = FL.templateImg.naturalWidth;
    kanvas.height = FL.templateImg.naturalHeight;
  }

  function gambarFlyer(){
    var kanvas = document.getElementById('flKanvas');
    if (!kanvas || !FL.templateImg) return;
    var ctx = kanvas.getContext('2d');
    var W = kanvas.width, H = kanvas.height;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(FL.templateImg, 0, 0, W, H);

    // Foto santri
    if (FL.fotoImg){
      var lebarFoto = W * (FL.foto.lebar / 100);
      var skala = lebarFoto / FL.fotoImg.naturalWidth;
      var tinggiFoto = FL.fotoImg.naturalHeight * skala;
      var px = W * (FL.foto.x / 100) - lebarFoto / 2;
      var py = H * (FL.foto.y / 100) - tinggiFoto / 2;
      ctx.drawImage(FL.fotoImg, px, py, lebarFoto, tinggiFoto);
    }

    // Teks -- ukuran dinyatakan dalam persen lebar template supaya proporsional
    Object.keys(FL.teks).forEach(function(k){
      var t = FL.teks[k];
      if (!t.tampil || !t.isi) return;
      var ukuranPx = W * (t.ukuran / 100);
      ctx.font = (t.tebal ? 'bold ' : '') + ukuranPx + 'px Arial, sans-serif';
      ctx.fillStyle = t.warna;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Garis luar tipis supaya teks tetap terbaca di atas latar terang maupun gelap
      ctx.lineWidth = Math.max(1, ukuranPx * 0.055);
      ctx.strokeStyle = 'rgba(0,0,0,.45)';
      var x = W * (t.x / 100), y = H * (t.y / 100);
      ctx.strokeText(t.isi, x, y);
      ctx.fillText(t.isi, x, y);
    });
  }

  // ---- Geser (drag) untuk memindahkan bagian aktif ----
  function pasangGeser(){
    var kanvas = document.getElementById('flKanvas');
    if (!kanvas) return;
    var sedangGeser = false;

    function posisiPersen(ev){
      var r = kanvas.getBoundingClientRect();
      var titik = ev.touches ? ev.touches[0] : ev;
      return {
        x: Math.max(0, Math.min(100, ((titik.clientX - r.left) / r.width) * 100)),
        y: Math.max(0, Math.min(100, ((titik.clientY - r.top) / r.height) * 100))
      };
    }
    function mulai(ev){ sedangGeser = true; pindah(ev); }
    function pindah(ev){
      if (!sedangGeser) return;
      ev.preventDefault();
      var p = posisiPersen(ev);
      var a = FL.pilihAktif;
      if (a === 'foto') { FL.foto.x = p.x; FL.foto.y = p.y; }
      else { FL.teks[a].x = p.x; FL.teks[a].y = p.y; }
      gambarFlyer();
    }
    function selesai(){ sedangGeser = false; }

    kanvas.addEventListener('pointerdown', mulai);
    kanvas.addEventListener('pointermove', pindah);
    window.addEventListener('pointerup', selesai);
  }

  // ---- Hapus latar belakang foto ----
  // Memakai model segmentasi orang dari MediaPipe yang berjalan DI PERANGKAT
  // (tidak mengirim foto santri ke layanan pihak ketiga -- penting untuk privasi).
  // Modelnya diunduh hanya saat fitur ini dipakai, jadi tidak membebani aplikasi
  // untuk pengguna yang tidak membuat flyer.
  var _segmentasi = null;
  function muatModelSegmentasi(){
    if (_segmentasi) return Promise.resolve(_segmentasi);
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js';
      s.onload = function(){
        try {
          var seg = new window.SelfieSegmentation({locateFile: function(f){
            return 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/' + f;
          }});
          seg.setOptions({modelSelection: 1});
          _segmentasi = seg;
          resolve(seg);
        } catch(e){ reject(e); }
      };
      s.onerror = function(){ reject(new Error('Gagal memuat model. Periksa koneksi internet.')); };
      document.head.appendChild(s);
    });
  }

  function hapusLatarBelakang(img){
    if (!navigator.onLine) {
      return Promise.resolve({img: img, berhasil: false});
    }
    return muatModelSegmentasi().then(function(seg){
      return new Promise(function(resolve){
        var selesai = false;
        // Batas waktu: kalau model tidak merespons, jangan biarkan pengguna menunggu
        // tanpa kepastian -- pakai foto aslinya saja.
        var waktuHabis = setTimeout(function(){
          if (!selesai) { selesai = true; resolve({img: img, berhasil: false}); }
        }, 15000);

        seg.onResults(function(hasil){
          if (selesai) return;
          selesai = true; clearTimeout(waktuHabis);
          try {
            var k = document.createElement('canvas');
            k.width = img.naturalWidth; k.height = img.naturalHeight;
            var ctx = k.getContext('2d');
            ctx.drawImage(hasil.segmentationMask, 0, 0, k.width, k.height);
            ctx.globalCompositeOperation = 'source-in';
            ctx.drawImage(img, 0, 0, k.width, k.height);
            var out = new Image();
            out.onload = function(){ resolve({img: out, berhasil: true}); };
            out.onerror = function(){ resolve({img: img, berhasil: false}); };
            out.src = k.toDataURL('image/png');
          } catch(e){ resolve({img: img, berhasil: false}); }
        });
        seg.send({image: img}).catch(function(){
          if (!selesai) { selesai = true; clearTimeout(waktuHabis); resolve({img: img, berhasil: false}); }
        });
      });
    }).catch(function(){
      return {img: img, berhasil: false};
    });
  }

  // ---- Unduh & cetak ----
  function unduhFlyer(){
    var kanvas = document.getElementById('flKanvas');
    var pesan = document.getElementById('flPesan');
    if (!kanvas || !FL.templateImg){ pesan.innerHTML = errBox('Template belum dimuat.'); return; }
    if (!FL.teks.nama.isi){ pesan.innerHTML = errBox('Pilih santri dulu sebelum mengunduh.'); return; }
    try {
      // Canvas tidak tercemar karena semua gambar dimuat sebagai base64 dari server,
      // jadi toDataURL aman dipanggil.
      var dataUrl = kanvas.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'Tasmi_' + String(FL.teks.nama.isi).replace(/[^\w]+/g,'_') + '_' + todayStr() + '.png';
      a.click();
      pesan.innerHTML = '<p style="color:#16a34a;font-weight:600">&#9989; Flyer diunduh.</p>';
      getarkanHp([50]);
      catatRiwayatDariFlyer(pesan);
    } catch(e){
      pesan.innerHTML = errBox('Gagal mengunduh: ' + e.message + '. Coba muat ulang halaman lalu ulangi.');
    }
  }

  // Simpan ke Riwayat Tasmi' setelah flyer diunduh. Ditandai supaya menekan unduh
  // beberapa kali untuk santri yang sama (misal setelah memperbaiki posisi teks)
  // tidak membuat catatan ganda.
  function catatRiwayatDariFlyer(elPesan){
    if (!FL || FL._sudahDicatat === FL.nisnAktif) return;
    if (!FL.nisnAktif) return;
    api('simpanRiwayatTasmi', {
      tanggal: todayStr(), nisn: FL.nisnAktif, nama: FL.teks.nama.isi,
      kelas: String(FL.teks.kelas.isi).replace(/^Kelas\s*/i,''),
      juz: FL.teks.juz.isi, rincian: FL.teks.rincian.isi, nilai: FL.teks.nilai.isi,
      pengampu: STATE.user.nama, sumber: 'Flyer'
    }).then(function(r){
      if (r.ok) {
        FL._sudahDicatat = FL.nisnAktif;
        if (elPesan) elPesan.innerHTML += '<p class="muted" style="font-size:12.5px">Tercatat di Riwayat Tasmi\'.</p>';
      }
    });
  }

  function cetakFlyer(){
    var kanvas = document.getElementById('flKanvas');
    if (!kanvas || !FL.templateImg) return;
    var w = window.open('', '_blank');

  // ================= RIWAYAT TASMI' HAFALAN =================
  // Berisi catatan santri yang sudah tasmi': otomatis dari pembuatan flyer, dan
  // bisa ditambahkan manual untuk melengkapi data tasmi' sebelum aplikasi dipakai.
  var _rtFilter = {tglMulai:'', tglAkhir:'', hanyaSaya:false, cari:''};

  function halamanRiwayatTasmi(){
    var c = getContentEl();
    c.innerHTML = '<div class="card"><p>Memuat riwayat...</p></div>';
    muatRiwayatTasmi();
  }

  function muatRiwayatTasmi(){
    var c = getContentEl();
    Promise.all([
      api('getRiwayatTasmi', {oleh: STATE.user.nama, tglMulai:_rtFilter.tglMulai,
                              tglAkhir:_rtFilter.tglAkhir, hanyaSaya:_rtFilter.hanyaSaya}),
      api('getSantriUntukFlyer', {oleh: STATE.user.nama})
    ]).then(function(hasil){
      var res = hasil[0];
      var daftarSantri = hasil[1].ok ? hasil[1].data : [];
      if (!res.ok){ c.innerHTML = '<div class="card">'+errBox(res.error)+'</div>'; return; }

      var data = res.data;
      var kata = _rtFilter.cari.toLowerCase().trim();
      if (kata) {
        data = data.filter(function(x){
          return (x.nama+' '+x.kelas+' '+x.juz+' '+x.rincian+' '+x.nilai+' '+x.pengampu).toLowerCase().indexOf(kata) !== -1;
        });
      }

      var ringkasNilai = Object.keys(res.perNilai).map(function(n){
        return '<span style="background:#f1f5f9;border-radius:12px;padding:3px 10px;font-size:12px;margin-right:5px;display:inline-block;margin-bottom:4px">'+esc(n)+': <b>'+res.perNilai[n]+'</b></span>';
      }).join('');

      c.innerHTML =
        '<div class="card"><h3>&#128218; Riwayat Tasmi\' Hafalan</h3>' +
          '<div class="stat-ringkas" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px">' +
            '<div><div class="muted" style="font-size:11.5px">TOTAL CATATAN</div><b style="font-size:20px;color:#0f766e">'+res.totalCatatan+'</b></div>' +
            '<div><div class="muted" style="font-size:11.5px">SANTRI BERBEDA</div><b style="font-size:20px;color:#0f766e">'+res.jumlahSantri+'</b></div>' +
          '</div>' +
          (ringkasNilai ? ('<div style="margin-bottom:10px">'+ringkasNilai+'</div>') : '') +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            '<button class="small" id="btnTambahTasmi">+ Tambah Catatan Manual</button>' +
            (data.length ? '<button class="small secondary" id="btnEksporTasmi">&#11015; Ekspor CSV</button>' : '') +
          '</div>' +
        '</div>' +

        '<div class="card"><h4>Filter</h4>' +
          '<div class="grid2">' +
            '<div><label>Dari Tanggal</label><input type="date" id="rtMulai" value="'+esc(_rtFilter.tglMulai)+'"></div>' +
            '<div><label>Sampai Tanggal</label><input type="date" id="rtAkhir" value="'+esc(_rtFilter.tglAkhir)+'"></div>' +
          '</div>' +
          '<input id="rtCari" placeholder="Cari nama santri / juz / nilai..." value="'+esc(_rtFilter.cari)+'">' +
          (res.bolehSemua ? '' :
            '<label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="rtSaya" '+(_rtFilter.hanyaSaya?'checked':'')+' style="width:auto"> Hanya catatan yang saya buat</label>') +
          '<div style="display:flex;gap:8px;margin-top:10px"><button class="small" id="btnTerapkanFilter">Terapkan</button>' +
          '<button class="small secondary" id="btnResetFilter">Reset</button></div>' +
        '</div>' +

        '<div class="card"><h4>Daftar Catatan ('+data.length+')</h4>' +
          (data.length
            ? ('<div style="overflow-x:auto"><table><tr><th>Tanggal</th><th>Santri</th><th>Juz</th><th>Nilai</th><th>Pengampu</th><th>Aksi</th></tr>' +
               data.map(function(x){
                 var lencana = x.sumber === 'Manual'
                   ? ' <span style="background:#fef3c7;color:#92400e;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px">MANUAL</span>' : '';
                 return '<tr>' +
                   '<td>'+esc(x.tanggal)+'</td>' +
                   '<td><b>'+esc(x.nama)+'</b>'+lencana+(x.kelas?('<br><span class="muted" style="font-size:11px">'+esc(x.kelas)+'</span>'):'')+'</td>' +
                   '<td><b>'+esc(x.juz)+'</b>'+(x.rincian?('<br><span class="muted" style="font-size:11px">'+esc(x.rincian)+'</span>'):'')+'</td>' +
                   '<td>'+esc(x.nilai||'-')+'</td>' +
                   '<td style="font-size:12px">'+esc(x.pengampu||'-')+'</td>' +
                   '<td><button class="small btnEditTasmi" data-row="'+x.rowIndex+'">Edit</button> ' +
                   '<button class="small danger btnHapusTasmi" data-row="'+x.rowIndex+'">Hapus</button></td></tr>';
               }).join('') + '</table></div>')
            : '<p class="muted">Belum ada catatan yang cocok dengan filter.</p>') +
        '</div>';

      document.getElementById('btnTambahTasmi').onclick = function(){ formRiwayatTasmi(null, daftarSantri); };
      document.getElementById('btnTerapkanFilter').onclick = function(){
        _rtFilter.tglMulai = document.getElementById('rtMulai').value;
        _rtFilter.tglAkhir = document.getElementById('rtAkhir').value;
        _rtFilter.cari = document.getElementById('rtCari').value;
        var s = document.getElementById('rtSaya');
        _rtFilter.hanyaSaya = s ? s.checked : false;
        muatRiwayatTasmi();
      };
      document.getElementById('btnResetFilter').onclick = function(){
        _rtFilter = {tglMulai:'', tglAkhir:'', hanyaSaya:false, cari:''};
        muatRiwayatTasmi();
      };
      var btnEks = document.getElementById('btnEksporTasmi');
      if (btnEks) btnEks.onclick = function(){ eksporRiwayatTasmi(data); };

      document.querySelectorAll('.btnEditTasmi').forEach(function(b){
        b.onclick = function(){
          formRiwayatTasmi(data.find(function(x){ return x.rowIndex === Number(b.dataset.row); }), daftarSantri);
        };
      });
      document.querySelectorAll('.btnHapusTasmi').forEach(function(b){
        b.onclick = function(){
          if (!confirm('Hapus catatan tasmi\' ini?')) return;
          api('hapusRiwayatTasmi', {rowIndex:Number(b.dataset.row), oleh:STATE.user.nama}).then(function(r){
            if (!r.ok){ alert(r.error); return; }
            muatRiwayatTasmi();
          });
        };
      });
    });
  }

  function formRiwayatTasmi(existing, daftarSantri){
    var opsi = daftarSantri.map(function(s){ return s.nisn + ' - ' + s.nama; });
    var nilaiSantri = existing ? ((existing.nisn ? existing.nisn + ' - ' : '') + existing.nama) : '';
    var fields =
      '<label>Tanggal Tasmi\'</label><input type="date" id="rtfTgl" value="'+esc(existing?existing.tanggal:todayStr())+'">' +
      fieldAutocomplete('rtfSantri','Santri', opsi, nilaiSantri, 'Ketik nama atau NISN santri...') +
      '<p class="muted" style="margin-top:-6px">Kalau santrinya tidak ada di daftar (misal sudah lulus), tulis saja namanya langsung.</p>' +
      fieldText('rtfKelas','Kelas', existing?existing.kelas:'') +
      '<div class="grid2">' +
        '<div>'+fieldText('rtfJuz','Jumlah Juz (contoh: 5 Juz)', existing?existing.juz:'')+'</div>' +
        '<div><label>Nilai</label><select id="rtfNilai">' +
          ['','Mumtaz','Jayyid','Jayyidah','Jayyid Jiddan','Jayyidah Jiddan'].map(function(n){
            return '<option value="'+esc(n)+'"'+((existing && existing.nilai===n)?' selected':'')+'>'+(n||'-- pilih --')+'</option>';
          }).join('') + '</select></div>' +
      '</div>' +
      fieldText('rtfRincian','Rincian Juz (contoh: Juz 1, 2, 3, 29, 30)', existing?existing.rincian:'') +
      fieldText('rtfPengampu','Pengampu', existing?existing.pengampu:STATE.user.nama) +
      fieldText('rtfCatatan','Catatan (opsional)', existing?existing.catatan:'');

    openModal(existing?'Edit Catatan Tasmi\'':'Tambah Catatan Tasmi\'', fields, function(m){
      var isiSantri = m.querySelector('#rtfSantri').value.trim();
      if (!isiSantri){ alert('Nama santri wajib diisi.'); return false; }
      // Kalau dipilih dari daftar, formatnya "NISN - Nama". Kalau diketik bebas
      // (santri lama yang sudah lulus), seluruh isian dipakai sebagai nama.
      var nisn = '', nama = isiSantri;
      var pisah = isiSantri.split(' - ');
      if (pisah.length > 1 && daftarSantri.some(function(s){ return String(s.nisn) === pisah[0].trim(); })) {
        nisn = pisah[0].trim();
        nama = pisah.slice(1).join(' - ').trim();
      }
      var juz = m.querySelector('#rtfJuz').value.trim();
      if (!juz){ alert('Jumlah juz wajib diisi.'); return false; }

      return api('simpanRiwayatTasmi', {
        rowIndex: existing?existing.rowIndex:0,
        tanggal: m.querySelector('#rtfTgl').value,
        nisn: nisn, nama: nama,
        kelas: m.querySelector('#rtfKelas').value.trim(),
        juz: juz, rincian: m.querySelector('#rtfRincian').value.trim(),
        nilai: m.querySelector('#rtfNilai').value,
        pengampu: m.querySelector('#rtfPengampu').value.trim(),
        catatan: m.querySelector('#rtfCatatan').value.trim(),
        sumber: existing ? existing.sumber : 'Manual',
        oleh: STATE.user.nama
      }).then(function(r){
        if (!r.ok){ alert(r.error); throw new Error(r.error); }
        muatRiwayatTasmi();
      });
    });

    // Isi kelas otomatis saat santri dipilih dari daftar
    var elSantri = document.getElementById('rtfSantri');
    if (elSantri) elSantri.onchange = function(){
      var nisn = this.value.split(' - ')[0].trim();
      var s = daftarSantri.find(function(x){ return String(x.nisn) === nisn; });
      if (s && s.kelas) document.getElementById('rtfKelas').value = s.kelas;
    };
  }

  function eksporRiwayatTasmi(data){
    var bom = '\uFEFF';
    var baris = [['Tanggal','NISN','Nama Santri','Kelas','Jumlah Juz','Rincian Juz','Nilai','Pengampu','Sumber','Catatan']];
    data.forEach(function(x){
      baris.push([x.tanggal, x.nisn, x.nama, x.kelas, x.juz, x.rincian, x.nilai, x.pengampu, x.sumber, x.catatan]);
    });
    var csv = bom + baris.map(function(r){
      return r.map(function(v){
        var s = String(v == null ? '' : v);
        if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) s = '"'+s.replace(/"/g,'""')+'"';
        return s;
      }).join(',');
    }).join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Riwayat_Tasmi_' + todayStr() + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }


  // ---------------- WALI KELAS: KAS KELAS ----------------
  // Wali kelas menerima pembayaran santri (uang kas, rihlah, dll) langsung dari saldo
  // santri, dengan PIN santri sebagai persetujuan -- alur dan pengamanannya sama
  // dengan transaksi kantin.
  var JENIS_KAS_BAWAAN = ['Uang Kas', 'Uang Rihlah', 'Uang Kegiatan'];
  var _wkJenisAktif = 'Uang Kas';

  function wkKasKelas(){
    var kelas = wkGetKelas();
    var c = getContentEl();
    if (!kelas){
      c.innerHTML = '<div class="card">'+warnBox('Anda belum ditugaskan sebagai Wali Kelas di data Guru. Minta Admin mengisi kolom WaliKelas.')+'</div>';
      return;
    }
    c.innerHTML = '<div class="card"><p>Memuat data kas kelas...</p></div>';
    muatKasKelas(kelas);
  }

  function muatKasKelas(kelas){
    var c = getContentEl();
    api('getRekapKasKelas', {kelas: kelas, jenis: _wkJenisAktif}).then(function(res){
      if (!res.ok){ c.innerHTML = '<div class="card">'+errBox(res.error)+'</div>'; return; }

      // Gabungkan jenis bawaan dengan jenis yang sudah pernah dipakai di kelas ini
      var semuaJenis = JENIS_KAS_BAWAAN.slice();
      (res.daftarJenis || []).forEach(function(j){ if (semuaJenis.indexOf(j) === -1) semuaJenis.push(j); });

      var ringkasan = semuaJenis.map(function(j){
        var d = res.perJenis[j] || {masuk:0, keluar:0};
        var sisa = d.masuk - d.keluar;
        var aktif = (j === _wkJenisAktif);
        return '<div class="kas-kartu'+(aktif?' aktif':'')+'" data-jenis="'+esc(j)+'">' +
          '<div class="kas-nama">'+esc(j)+'</div>' +
          '<div class="kas-sisa">Rp'+sisa.toLocaleString('id-ID')+'</div>' +
          '<div class="kas-rinci">Masuk Rp'+d.masuk.toLocaleString('id-ID')+' &middot; Keluar Rp'+d.keluar.toLocaleString('id-ID')+'</div>' +
        '</div>';
      }).join('');

      // Status bayar santri untuk jenis yang sedang dipilih
      var sudah = res.daftarSantri.filter(function(s){ return s.sudahBayar > 0; });
      var belum = res.daftarSantri.filter(function(s){ return s.sudahBayar <= 0; });

      c.innerHTML =
        '<div class="card"><h3>&#128176; Kas Kelas &mdash; ' + esc(kelas) + '</h3>' +
          '<p class="muted">Klik kartu di bawah untuk berpindah jenis kas. Sisa = total masuk dikurangi pengeluaran.</p>' +
          '<div class="kas-grid">' + ringkasan + '</div>' +
          '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
            '<button id="btnTerimaKas">+ Terima Pembayaran</button>' +
            '<button class="secondary" id="btnKeluarKas">&minus; Catat Pengeluaran</button>' +
          '</div>' +
        '</div>' +

        '<div class="card"><h4>Status Pembayaran &mdash; ' + esc(_wkJenisAktif) + '</h4>' +
          '<p class="muted">Sudah bayar: <b style="color:#16a34a">'+sudah.length+'</b> santri &middot; Belum: <b style="color:#dc2626">'+belum.length+'</b> santri</p>' +
          (belum.length
            ? ('<details style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:600;color:#dc2626">Lihat '+belum.length+' santri yang belum bayar</summary>' +
               '<table style="margin-top:8px"><tr><th>Nama</th><th>Saldo</th><th>Aksi</th></tr>' +
               belum.map(function(s){
                 return '<tr><td>'+esc(s.nama)+'</td><td>Rp'+s.saldo.toLocaleString('id-ID')+'</td>' +
                   '<td><button class="small btnBayarCepat" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'">Terima</button></td></tr>';
               }).join('') + '</table></details>')
            : '<p class="muted">Semua santri sudah membayar.</p>') +
          (sudah.length
            ? ('<details><summary style="cursor:pointer;font-weight:600;color:#16a34a">Lihat '+sudah.length+' santri yang sudah bayar</summary>' +
               '<table style="margin-top:8px"><tr><th>Nama</th><th>Total Dibayar</th></tr>' +
               sudah.map(function(s){ return '<tr><td>'+esc(s.nama)+'</td><td>Rp'+s.sudahBayar.toLocaleString('id-ID')+'</td></tr>'; }).join('') +
               '</table></details>')
            : '') +
        '</div>' +

        '<div class="card"><h4>Riwayat Transaksi &mdash; ' + esc(_wkJenisAktif) + '</h4>' +
          (res.riwayat.length
            ? ('<table><tr><th>Tanggal</th><th>Santri</th><th>Nominal</th><th>Keterangan</th><th>Aksi</th></tr>' +
               res.riwayat.map(function(r){
                 var warna = r.tipe === 'Keluar' ? '#dc2626' : '#16a34a';
                 var tanda = r.tipe === 'Keluar' ? '-' : '+';
                 return '<tr><td>'+esc(r.tanggal)+'<br><span class="muted" style="font-size:11px">'+fmtWaktu(r.waktu)+'</span></td>' +
                   '<td>'+esc(r.nama || '<span class="muted">(pengeluaran)</span>')+'</td>' +
                   '<td style="color:'+warna+';font-weight:700">'+tanda+'Rp'+r.nominal.toLocaleString('id-ID')+'</td>' +
                   '<td>'+esc(r.keterangan||'-')+'</td>' +
                   '<td><button class="small danger btnHapusKas" data-row="'+r.rowIndex+'" data-tipe="'+esc(r.tipe)+'">Hapus</button></td></tr>';
               }).join('') + '</table>')
            : '<p class="muted">Belum ada transaksi untuk jenis ini.</p>') +
        '</div>';

      // Pindah jenis kas
      document.querySelectorAll('.kas-kartu').forEach(function(el){
        el.onclick = function(){ _wkJenisAktif = el.dataset.jenis; muatKasKelas(kelas); };
      });
      document.getElementById('btnTerimaKas').onclick = function(){ formTerimaKas(kelas, res.daftarSantri, null); };
      document.getElementById('btnKeluarKas').onclick = function(){ formPengeluaranKas(kelas); };
      document.querySelectorAll('.btnBayarCepat').forEach(function(btn){
        btn.onclick = function(){
          formTerimaKas(kelas, res.daftarSantri, {nisn: btn.dataset.nisn, nama: btn.dataset.nama});
        };
      });
      document.querySelectorAll('.btnHapusKas').forEach(function(btn){
        btn.onclick = function(){
          var pesan = btn.dataset.tipe === 'Masuk'
            ? 'Hapus catatan ini? Saldo santri akan DIKEMBALIKAN sebesar nominal tersebut.'
            : 'Hapus catatan pengeluaran ini?';
          if (!confirm(pesan)) return;
          api('hapusKasKelas', {rowIndex: Number(btn.dataset.row), oleh: STATE.user.nama}).then(function(r){
            if (!r.ok) { alert(r.error); return; }
            if (r.dikembalikan > 0) alert('Catatan dihapus. Saldo santri dikembalikan Rp' + r.dikembalikan.toLocaleString('id-ID') + '.');
            muatKasKelas(kelas);
          });
        };
      });
    });
  }

  function formTerimaKas(kelas, daftarSantri, santriTerpilih){
    var fields =
      fieldPilihSantri('kkSantri','Pilih Santri', daftarSantri, {tampilSaldo:true}) +
      '<label>Jenis Pembayaran</label><select id="kkJenis">' +
        JENIS_KAS_BAWAAN.map(function(j){ return '<option value="'+esc(j)+'"'+(j===_wkJenisAktif?' selected':'')+'>'+esc(j)+'</option>'; }).join('') +
        '<option value="__lain__">Lainnya (tulis sendiri)...</option>' +
      '</select>' +
      '<div id="kkWrapLain" style="display:none">' + fieldText('kkJenisLain','Tulis Jenis Pembayaran','') + '</div>' +
      '<label>Nominal (Rp)</label><input id="kkNominal" inputmode="numeric" placeholder="contoh: 5000">' +
      fieldText('kkKet','Keterangan (opsional)','') +
      '<div id="kkInfoSaldo" style="background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:10px"></div>' +
      '<label>PIN Transaksi Santri</label>' +
      '<input id="kkPin" type="password" inputmode="numeric" placeholder="Diisi oleh santri sendiri">' +
      '<p class="muted" style="margin-top:-6px">Minta santri memasukkan PIN-nya sendiri sebagai tanda persetujuan.</p>';

    var pilihKk = null;
    var modal = openModal('Terima Pembayaran Kas', fields, function(m){
      var santriDipilih = pilihKk.nilai();
      if (!santriDipilih) { alert('Pilih santri dulu dari daftar, atau pindai kartu QR-nya.'); return false; }
      var nisn = santriDipilih.nisn;
      var jenis = m.querySelector('#kkJenis').value;
      if (jenis === '__lain__') {
        jenis = m.querySelector('#kkJenisLain').value.trim();
        if (!jenis) { alert('Tulis jenis pembayarannya.'); return false; }
      }
      var nominal = Number(String(m.querySelector('#kkNominal').value).replace(/[^\d]/g,'')) || 0;
      if (nominal <= 0) { alert('Nominal wajib diisi dan lebih dari 0.'); return false; }
      var pin = m.querySelector('#kkPin').value.trim();
      if (!pin) { alert('PIN Transaksi santri wajib diisi.'); return false; }

      return api('terimaKasKelas', {
        nisn: nisn, pin: pin, kelas: kelas, jenis: jenis, nominal: nominal,
        keterangan: m.querySelector('#kkKet').value.trim(), oleh: STATE.user.nama
      }).then(function(r){
        if (!r.ok) { alert(r.error); throw new Error(r.error); }
        getarkanHp();
        alert('Berhasil. ' + r.namaSantri + ' membayar ' + r.jenis + ' Rp' + r.nominal.toLocaleString('id-ID') +
              '.\nSisa saldo: Rp' + r.saldoSekarang.toLocaleString('id-ID'));
        _wkJenisAktif = r.jenis;
        muatKasKelas(kelas);
      });
    });

    // Tampilkan sisa saldo setelah pembayaran, supaya wali kelas tahu cukup atau tidak
    function perbaruiInfoSaldo(){
      var s = pilihKk ? pilihKk.nilai() : null;
      var nominal = Number(String(modal.querySelector('#kkNominal').value).replace(/[^\d]/g,'')) || 0;
      var el = modal.querySelector('#kkInfoSaldo');
      if (!s) { el.innerHTML = '<span class="muted">Pilih santri untuk melihat saldonya.</span>'; return; }
      var sisa = s.saldo - nominal;
      el.innerHTML = 'Saldo ' + esc(s.nama) + ': <b>Rp' + s.saldo.toLocaleString('id-ID') + '</b>' +
        (nominal > 0
          ? ('<br>Sisa setelah bayar: <b style="color:' + (sisa < 0 ? '#dc2626' : '#0f766e') + '">Rp' + sisa.toLocaleString('id-ID') + '</b>' +
             (sisa < 0 ? ' <span style="color:#dc2626">(saldo tidak cukup)</span>' : ''))
          : '');
    }
    pilihKk = ikatPilihSantri(modal, 'kkSantri', daftarSantri, {
      tampilSaldo: true, onPilih: perbaruiInfoSaldo
    });
    if (santriTerpilih) pilihKk.pilih(santriTerpilih.nisn);
    modal.querySelector('#kkNominal').oninput = perbaruiInfoSaldo;
    modal.querySelector('#kkJenis').onchange = function(){
      modal.querySelector('#kkWrapLain').style.display = (this.value === '__lain__') ? 'block' : 'none';
    };
    perbaruiInfoSaldo();
  }

  function formPengeluaranKas(kelas){
    var fields =
      '<label>Jenis Kas</label><select id="kpJenis">' +
        JENIS_KAS_BAWAAN.map(function(j){ return '<option value="'+esc(j)+'"'+(j===_wkJenisAktif?' selected':'')+'>'+esc(j)+'</option>'; }).join('') +
      '</select>' +
      '<label>Nominal (Rp)</label><input id="kpNominal" inputmode="numeric" placeholder="contoh: 50000">' +
      fieldText('kpKet','Keterangan Pengeluaran (wajib)','');
    openModal('Catat Pengeluaran Kas', fields, function(m){
      var nominal = Number(String(m.querySelector('#kpNominal').value).replace(/[^\d]/g,'')) || 0;
      if (nominal <= 0) { alert('Nominal wajib diisi.'); return false; }
      var ket = m.querySelector('#kpKet').value.trim();
      if (!ket) { alert('Keterangan pengeluaran wajib diisi.'); return false; }
      return api('catatPengeluaranKasKelas', {
        kelas: kelas, jenis: m.querySelector('#kpJenis').value,
        nominal: nominal, keterangan: ket, oleh: STATE.user.nama
      }).then(function(r){

        muatKasKelas(kelas);
      });
    });
  }

  // Export Excel rapor santri
  function excelRaporSantri(d){
    var bom='\uFEFF';
    var rows=[
      [d.namaPesantren],
      ['LAPORAN HASIL BELAJAR SEMESTER'],
      ['Nama Santri',d.nama,'','Kelas',d.kelas],
      ['NISN',d.nisn,'','Wali Kelas',d.waliKelas],
      ['Tahun Ajaran',d.tahunAjaran,'','Semester','1 (Satu)'],
      [],
      ['No','Kompetensi / Mata Pelajaran','Pengetahuan','Keterampilan','Sikap']
    ];
    var no=0;
    d.kelompok.forEach(function(kg){
      rows.push([kg.kode+'. '+kg.nama,'','','','']);
      kg.mapel.forEach(function(m){
        no++;
        rows.push([no, m.nama, m.pengetahuan!==null?m.pengetahuan:'-', m.keterampilan!==null?m.keterampilan:'-', m.sikap!==null?m.sikap:'-']);
      });
    });
    rows.push([]);
    rows.push(['Keterangan: A=≥90 (Sangat Baik), B=80-89 (Baik), C=70-79 (Cukup), D=60-69 (Kurang), E=<60 (Sangat Kurang)']);

    var csv=bom+rows.map(function(r){
      return r.map(function(v){
        var s=String(v==null?'':v);
        if(s.includes(','))s='"'+s.replace(/"/g,'""')+'"';
        return s;
      }).join(',');
    }).join('\n');

    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='Rapor_'+d.nama.replace(/\s+/g,'_')+'_'+d.kelas+'_'+todayStr()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  // Layout sidebar responsif dipakai Dashboard Guru & Admin/Mudir.
  // Desktop: sidebar tetap tampil di kiri. Mobile (<=860px): sidebar tersembunyi,
  // dibuka lewat tombol hamburger sebagai panel geser dengan overlay gelap.
  // ---------------- SLIDE PENGUMUMAN (ringan, tanpa library luar) ----------------
  // Satu timer global saja (dibersihkan tiap kali dipanggil ulang) supaya tidak ada
  // banyak interval menumpuk & memberatkan aplikasi saat pindah halaman/tab berkali-kali.
  var SLIDE_TIMER = null;
  function renderSlideBar(containerId){
    var container = document.getElementById(containerId);
    if (!container) return;
    if (SLIDE_TIMER) { clearInterval(SLIDE_TIMER); SLIDE_TIMER = null; }
    Promise.all([api('getSlideAktif', {level: STATE.user.level}), api('getPengaturan', {})]).then(function(hasil){
      if (!document.getElementById(containerId)) return; // user sudah pindah tampilan
      var resSlide = hasil[0], resP = hasil[1];
      if (!resSlide.ok || !resSlide.data.length) { container.innerHTML = ''; return; }
      var slides = resSlide.data;
      var jeda = (resP.ok && resP.data.SlideJedaDetik) ? Number(resP.data.SlideJedaDetik) : 5;
      if (!jeda || jeda < 2) jeda = 5;
      var idx = 0;

      var html = '<div class="slidebar" id="'+containerId+'_box">';
      slides.forEach(function(s, i){
        var inner = '<img src="'+esc(s.gambar)+'" alt="'+esc(s.judul)+'" loading="'+(i===0?'eager':'lazy')+'">' +
          (s.judul ? '<div class="slidebar-caption">'+esc(s.judul)+'</div>' : '');
        html += '<div class="slidebar-slide'+(i===0?' active':'')+'" data-i="'+i+'">' +
          (s.tautan ? ('<a href="'+esc(s.tautan)+'" target="_blank" rel="noopener" style="display:block;width:100%;height:100%">'+inner+'</a>') : inner) +
          '</div>';
      });
      if (slides.length > 1) {
        html += '<button class="slidebar-arrow prev" id="'+containerId+'_prev" aria-label="Sebelumnya">&#8249;</button>';
        html += '<button class="slidebar-arrow next" id="'+containerId+'_next" aria-label="Berikutnya">&#8250;</button>';
        html += '<div class="slidebar-dots">' + slides.map(function(_,i){return '<span class="slidebar-dot'+(i===0?' active':'')+'" data-i="'+i+'"></span>';}).join('') + '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
      if (slides.length <= 1) return;

      function tampilkan(i){
        idx = (i + slides.length) % slides.length;
        var box = document.getElementById(containerId+'_box');
        if (!box) return;
        box.querySelectorAll('.slidebar-slide').forEach(function(el){ el.classList.toggle('active', Number(el.dataset.i)===idx); });
        box.querySelectorAll('.slidebar-dot').forEach(function(el){ el.classList.toggle('active', Number(el.dataset.i)===idx); });
      }
      function resetTimer(){
        if (SLIDE_TIMER) clearInterval(SLIDE_TIMER);
        SLIDE_TIMER = setInterval(function(){ tampilkan(idx+1); }, jeda*1000);
      }
      document.getElementById(containerId+'_prev').onclick = function(){ tampilkan(idx-1); resetTimer(); };
      document.getElementById(containerId+'_next').onclick = function(){ tampilkan(idx+1); resetTimer(); };
      container.querySelectorAll('.slidebar-dot').forEach(function(dot){
        dot.onclick = function(){ tampilkan(Number(dot.dataset.i)); resetTimer(); };
      });
      resetTimer();
    });
  }

        var el = document.getElementById('cpPoinPreview');
        if (!el) return;
        if (!pelObj && !presObj && !(modePelBaru && namaPelBaru)) { el.style.display='none'; return; }
        var poinPel = pelObj ? Number(pelObj.poin) : (modePelBaru ? poinPelBaru : 0);
        var net = (presObj ? Number(presObj.poin) : 0) - poinPel;
        el.style.display='block';
        el.innerHTML =
          (pelObj  ? 'Pelanggaran: <b style="color:#dc2626">-'+pelObj.poin+' poin</b><br>' :
           (modePelBaru && namaPelBaru) ? 'Pelanggaran baru "'+esc(namaPelBaru)+'": <b style="color:#dc2626">-'+poinPelBaru+' poin</b><br>' : '') +
          (presObj ? 'Prestasi: <b style="color:#16a34a">+'+presObj.poin+' poin</b><br>' : '') +
          'Bersih: <b style="color:'+(net>=0?'#16a34a':'#dc2626')+'">'+(net>=0?'+':'')+net+' poin</b>';
      }
      document.getElementById('cpPelanggaran').addEventListener('change', perbaruiPoinPreview);
      document.getElementById('cpPrestasi').addEventListener('change', perbaruiPoinPreview);
      document.getElementById('cpPelBaruNama').addEventListener('input', perbaruiPoinPreview);
      document.getElementById('cpPelBaruPoin').addEventListener('change', perbaruiPoinPreview);

      document.getElementById('btnSimpanPelanggaran').onclick = function(){
        var elPesan = document.getElementById('pesanCatatPelanggaran');
        var nisn = resolveSantriNisn(document.getElementById('cpSantri').value.trim(), daftarSantri);
        if (!nisn) { elPesan.innerHTML = errBox('Pilih santri dari saran yang muncul saat mengetik.'); return; }
        var santriObj = daftarSantri.find(function(s){ return String(s.nisn)===String(nisn); });

        var rawPres = document.getElementById('cpPrestasi').value.trim();
        var presObj = daftarPres.find(function(x){ return (x.nama+' (+'+x.poin+' poin)')===rawPres; });
        if (rawPres && !presObj) { elPesan.innerHTML = errBox('Prestasi tidak dikenali. Pilih dari saran yang muncul.'); return; }

        var pelObj = null;
        if (!modePelBaru) {
          var rawPel = document.getElementById('cpPelanggaran').value.trim();
          pelObj = daftarPel.find(function(x){ return (x.nama+' (-'+x.poin+' poin)')===rawPel; });
          if (rawPel && !pelObj) { elPesan.innerHTML = errBox('Pelanggaran tidak dikenali. Pilih dari saran yang muncul.'); return; }
          if (!pelObj && !presObj) { elPesan.innerHTML = errBox('Isi minimal satu Pelanggaran atau Prestasi.'); return; }
          lanjutkanSimpan(pelObj);
        } else {
          var namaBaru = document.getElementById('cpPelBaruNama').value.trim();
          if (!namaBaru) { elPesan.innerHTML = errBox('Tulis nama pelanggaran barunya, atau batalkan mode tambah baru.'); return; }
          // Cegah duplikat -- kalau nama sudah ada di daftar (huruf besar/kecil
          // diabaikan), arahkan untuk memilih dari daftar yang ada supaya poinnya
          // konsisten dan tidak ada dua entri untuk pelanggaran yang sama.
          var sudahAda = daftarPel.find(function(x){ return x.nama.toLowerCase() === namaBaru.toLowerCase(); });
          if (sudahAda) {
            elPesan.innerHTML = errBox('"'+namaBaru+'" sudah ada di daftar (poin: -'+sudahAda.poin+'). Batalkan mode tambah baru lalu pilih dari daftar.');
            return;
          }
          var poinBaru = Number(document.getElementById('cpPelBaruPoin').value);
          if (!(poinBaru >= 1 && poinBaru <= 5)) { elPesan.innerHTML = errBox('Poin harus antara 1 sampai 5.'); return; }

          var btn0 = document.getElementById('btnSimpanPelanggaran');
          loadingBtn(btn0, 'Menambah jenis baru...');
          // Jenis pelanggaran baru ditambahkan ke daftar master dulu, supaya langsung
          // bisa dipilih siapa pun untuk pencatatan berikutnya -- sesuai permintaan:
          // "guru, admin, mudir, pembina bisa menambahkan langsung dipilihan pelanggaran".
          api('saveMasterPelPrestasi', {jenis:'Pelanggaran', nama:namaBaru, poin:poinBaru}).then(function(rm){
            if (!rm.ok) { resetBtn(btn0, 'Simpan Pencatatan'); elPesan.innerHTML = errBox(rm.error || 'Gagal menambah jenis pelanggaran baru.'); return; }
            var objBaru = {nama:namaBaru, poin:poinBaru};
            daftarPel.push(objBaru); // supaya sesi ini langsung mengenalinya kalau dipakai lagi
            lanjutkanSimpan(objBaru);
          }).catch(function(){
            resetBtn(btn0, 'Simpan Pencatatan');
            elPesan.innerHTML = errBox('Gagal menambah jenis pelanggaran baru. Periksa koneksi lalu coba lagi.');
          });
        }

        function lanjutkanSimpan(pelObjFinal){
          if (!pelObjFinal && !presObj) { elPesan.innerHTML = errBox('Isi minimal satu Pelanggaran atau Prestasi.'); return; }
          var btn = document.getElementById('btnSimpanPelanggaran');
          loadingBtn(btn, 'Menyimpan...');
          api('savePencatatanPelanggaran', {
            tanggal: document.getElementById('cpTanggal').value,
            nisn: nisn, namaSantri: santriObj ? santriObj.nama : nisn,
            pelanggaran:   pelObjFinal ? pelObjFinal.nama : '', poinPelanggaran: pelObjFinal ? pelObjFinal.poin : 0,
            prestasi:      presObj ? presObj.nama : '', poinPrestasi:    presObj ? presObj.poin : 0,
            namaPencatat: STATE.user.nama
          }).then(function(res){
            resetBtn(btn, 'Simpan Pencatatan');
            if (!res.ok) { elPesan.innerHTML = errBox(res.error); return; }
            document.getElementById('cpSantri').value = '';
            document.getElementById('cpPelanggaran').value = '';
            document.getElementById('cpPrestasi').value = '';
            document.getElementById('cpPelBaruNama').value = '';
            if (modePelBaru) document.getElementById('btnTogglePelBaru').click(); // kembali ke mode pilih daftar
            var prev = document.getElementById('cpPoinPreview');
            if (prev) prev.style.display = 'none';
            elPesan.innerHTML =
              '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;font-size:13px;color:#16a34a;margin-top:8px">' +
              '&#9989; Tersimpan. Sisa poin <b>'+esc(santriObj ? santriObj.nama : nisn)+'</b>: <b>'+res.poinTerbaru+'</b> ('+esc(res.status)+').'+
              (res.status==='Habis' ? ' <b style="color:#dc2626">&#9888;&#65039; Poin habis — santri perlu pembinaan.</b>' : '') +
              '</div>';
          }).catch(function(){
            resetBtn(btn, 'Simpan Pencatatan');
            elPesan.innerHTML = errBox('Gagal menyimpan. Periksa koneksi lalu coba lagi.');
          });
        }
      };
    }).catch(function(err){
      if (c) c.innerHTML = errBox('Gagal memuat data: '+(err && err.message ? err.message : 'periksa koneksi.'));
    });
  }

      var activeMapel = mapelList[0];
      function renderTabMapel(selected){
        Promise.all([
          api('getModulAjarList', {mapel: selected.mapel, kelas: selected.kelas}),
          api('getRPPList', {mapel: selected.mapel, kelas: selected.kelas})
        ]).then(function(hasil){
          var resMA = hasil[0], resRPP = hasil[1];
          var html = '<div class="card">';
          // Tab mapel
          html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">' +
            mapelList.map(function(m){

            }).join('') + '</div>';

          html += '<h3>&#128218; '+esc(selected.mapel)+' &mdash; '+esc(selected.kelas)+'</h3>';

          // Tombol upload modul ajar (link ke Drive untuk upload)
          html += '<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">' +
            '<button class="secondary small" id="btnUploadModulAjar">&#128196; Upload Modul Ajar ke Drive</button>' +
            '<button class="secondary small" id="btnInputLinkModul">&#128279; Tambah via Link</button>' +

          // File-file modul ajar

                  '&#128196; '+esc(ma.namaFile)+'</button>';

          }

          // RPP Pertemuan
          if (resRPP.ok && resRPP.data.length) {
            html += '<h4 style="color:#0d9488;margin:10px 0 6px">RPP Pertemuan</h4>';
            html += '<div id="rppPertemuanWrap">';
            resRPP.data.forEach(function(r){
              html += '<div style="border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;overflow:hidden">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f8fafc;cursor:pointer" class="rppToggleHeader" data-id="'+r.rowIndex+'">' +

                (r.inti?'<p style="margin-top:10px"><b>Kegiatan Inti:</b></p><p style="white-space:pre-wrap;font-size:13px">'+esc(r.inti)+'</p>':'')+
                (r.penutup?'<p style="margin-top:10px"><b>Penutup:</b></p><p style="white-space:pre-wrap;font-size:13px">'+esc(r.penutup)+'</p>':'')+

                (r.linkSlide?'<a href="'+esc(r.linkSlide)+'" target="_blank"><button class="secondary small">&#128202; Slide PPT</button></a>':'')+
                (r.linkBukuAjar?'<a href="'+esc(r.linkBukuAjar)+'" target="_blank"><button class="secondary small">&#128214; Buku Ajar</button></a>':'')+
                '</div></div></div>';

            html += '<button class="secondary small" id="btnTambahRPPGuru">+ Tambah Pertemuan Baru</button>';

                '<label>Link Google Drive *</label><input id="maFileUrl" placeholder="https://drive.google.com/..." style="width:100%">'+
                '<label>Kategori</label>'+
                '<select id="maKategori" style="width:100%"><option value="Modul Ajar">Modul Ajar</option><option value="Bahan Ajar">Bahan Ajar</option><option value="LKPD">LKPD</option><option value="Media">Media Pembelajaran</option></select>',

                  var url  = modal.querySelector('#maFileUrl').value.trim();

                    if (!r.ok){ alert(r.error); throw new Error(r.error); }

          // Tombol input link modul (sama tapi lebih ringkas labelnya)
          var btnLink = document.getElementById('btnInputLinkModul');
          if (btnLink) btnLink.onclick = function(){ if(btnUpload) btnUpload.click(); };

          // Toggle accordion RPP
          c.querySelectorAll('.rppToggleHeader').forEach(function(header){

              var body = document.getElementById('rppBody'+header.dataset.id);
              var chevron = header.querySelector('.rppChevron');
              if (body.style.display==='none') {

              } else {

      clearTimeout(timeout);
      if (!getContentEl()) return;
      if (!res.ok){ c.innerHTML = '<div class="card">'+errBox(res.error)+'<button id="btnRetrySOP2">Coba Lagi</button></div>'; document.getElementById('btnRetrySOP2').onclick=guruSOP; return; }

      }
      var html = '<div class="card"><h3>&#128203; Standar Operasional Prosedur</h3>' +
        '<p class="muted">Panduan pelaksanaan tugas mengajar dan penanganan situasi di pesantren.</p></div>';
      var cats = {};
      res.data.forEach(function(s){ if(!cats[s.kategori]) cats[s.kategori]=[]; cats[s.kategori].push(s); });
      Object.keys(cats).forEach(function(cat){
        html += '<div class="card"><h4 style="color:#0d9488;margin-bottom:10px">'+esc(cat)+'</h4>';
        cats[cat].forEach(function(s){
          html += '<div style="margin-bottom:12px"><b>'+esc(s.judul)+'</b>' +
            '<pre style="background:#f8fafc;padding:12px;border-radius:8px;white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.7;margin-top:6px">'+esc(s.isi)+'</pre></div>';
        });
        html += '</div>';

          '<input placeholder="Keterangan (opsional)" class="ketInput">'+

      function toggleSikapRow(row){
        var status = row.querySelector('.statusSelect').value;
        var wrap = row.querySelector('.sikapWrap');
        if (wrap) wrap.style.display = (status === 'Hadir') ? '' : 'none';
      }
      document.querySelectorAll('#formAbsenSantri > div').forEach(function(row){

          items.push({

  // ---------------- KOMPONEN BERSAMA: grafik & panel rekap lengkap santri ----------------
  // Dipakai di dashboard Wali Santri, Admin/Mudir, dan Guru ("Santri Saya") supaya
  // konsisten -- tidak perlu tulis ulang logika yang sama 3 kali.

  // Grafik garis sederhana (SVG murni, tanpa library luar) menampilkan akumulasi
  // halaman hafalan baru dari waktu ke waktu.
  function buildLineChartSVG(data){
    if (!data || !data.length) return '<p class="muted">Belum ada data hafalan pada periode ini.</p>';
    var width = 640, height = 220, padding = 40;
    var maxY = Math.max.apply(null, data.map(function(d){return d.kumulatif;}));
    if (maxY <= 0) maxY = 1;
    var stepX = data.length > 1 ? (width - padding*2) / (data.length - 1) : 0;
    var points = data.map(function(d,i){
      var x = padding + i*stepX;
      var y = height - padding - (d.kumulatif / maxY) * (height - padding*2);
      return {x:x, y:y, d:d};
    });
    var pathD = points.map(function(p,i){ return (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var areaD = pathD + ' L' + points[points.length-1].x.toFixed(1) + ',' + (height-padding) + ' L' + points[0].x.toFixed(1) + ',' + (height-padding) + ' Z';
    var circles = points.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="#0d9488"><title>'+esc(p.d.tanggal)+': '+p.d.halamanHariItu+' halaman (total '+p.d.kumulatif+')</title></circle>'; }).join('');
    return '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;background:#fafafa;border-radius:8px">' +
      '<line x1="'+padding+'" y1="'+(height-padding)+'" x2="'+(width-padding)+'" y2="'+(height-padding)+'" stroke="#ccc"/>' +
      '<line x1="'+padding+'" y1="'+padding+'" x2="'+padding+'" y2="'+(height-padding)+'" stroke="#ccc"/>' +
      '<path d="'+areaD+'" fill="rgba(13,148,136,0.12)" stroke="none"/>' +
      '<path d="'+pathD+'" fill="none" stroke="#0d9488" stroke-width="2"/>' + circles +
      '<text x="'+padding+'" y="'+(height-8)+'" font-size="11" fill="#777">'+esc(data[0].tanggal)+'</text>' +
      '<text x="'+(width-padding-70)+'" y="'+(height-8)+'" font-size="11" fill="#777">'+esc(data[data.length-1].tanggal)+'</text>' +
      '<text x="'+padding+'" y="16" font-size="11" fill="#777">Total halaman baru pada periode ini: '+maxY+'</text>' +
      '</svg>';
  }

  // Panel: Kehadiran+Sikap, Progres Hafalan, Riwayat Hafalan (filter bulan), Grafik (filter semester/tahun ajaran)
  // Kecilkan & kompres gambar di browser (canvas) SEBELUM diunggah ke server, supaya
  // ukuran file kecil (cepat diunggah) dan slide tetap ringan dimuat semua pengguna.
  function resizeImageFile(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxWidth / img.width);
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        };
        img.onerror = function(){ reject(new Error('Gagal membaca gambar')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Gagal membaca file')); };
      reader.readAsDataURL(file);
    });
  }

  // ---------------- DRAFT OTOMATIS FORM HAFALAN ----------------
  // Melindungi dari kehilangan isian kalau terjadi error/reload/koneksi putus SEBELUM
  // sempat klik Simpan -- setiap perubahan pada form langsung disalin ke localStorage
  // (penyimpanan di HP/browser sendiri, bukan ke server), dan dipulihkan otomatis kalau
  // pengampu membuka lagi form yang sama (halaqoh+waktu+tanggal+pengampu yang sama persis).
  function draftHafalanKey(namaHalaqoh, waktu, tanggal, pengampu){
    return 'wasiatDraftHafalan|' + namaHalaqoh + '|' + waktu + '|' + tanggal + '|' + pengampu;
  }
  function simpanDraftHafalan(key){
    try {
      var data = {};
      var val = function(row, sel){ var el = row.querySelector(sel); return el ? el.value : ''; };
      document.querySelectorAll('#formHafalan > div').forEach(function(row){
        if (!row.dataset || !row.dataset.nisn) return;
        data[row.dataset.nisn] = {
          jenis: val(row, '.jenisSelect'),
          mode:  val(row, '.modeInput'),
          surah: val(row, '.surahInput'),
          ayatAwal: val(row, '.ayatAwalInput'),
          ayatAkhir: val(row, '.ayatAkhirInput'),
          juz: val(row, '.juzInput'),
          halamanAwal: val(row, '.halamanAwalInput'),
          halamanAkhir: val(row, '.halamanAkhirInput'),
          halPanelDari: val(row, '.halPanelDari'),
          halPanelSampai: val(row, '.halPanelSampai'),
          juzPanel: (function(){
            var checks = row.querySelectorAll('.juzCheck:checked');
            return Array.from(checks).map(function(c){return Number(c.value);});
          })(),
          multiSurah: (function(){
            var el = row.querySelector('.multiSurahPanel');
            if (!el) return [];
            return Array.from(el.selectedOptions).map(function(o){return o.value;});
          })(),
          nilai: val(row, '.nilaiSelect')
        };
      });
      localStorage.setItem(key, JSON.stringify({waktuSimpan: Date.now(), data: data}));
    } catch(e) { /* localStorage penuh/nonaktif -- diamkan */ }
  }
  function ambilDraftHafalan(key){
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return parsed && parsed.data ? parsed.data : null;
    } catch(e) { return null; }
  }
  function hapusDraftHafalan(key){
    try { localStorage.removeItem(key); } catch(e) {}
  }
  function debounce(fn, delay){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, delay);
    };
  }
  // Draft yang sudah lebih dari 3 hari dianggap tidak akan dilanjutkan lagi (misal sesi
  // hafalan hari itu sudah pindah tanggal) -- dibersihkan otomatis supaya tidak menumpuk
  // selamanya di penyimpanan HP. Dipanggil sekali saat aplikasi pertama dibuka.
  function bersihkanDraftHafalanLama(){
    try {
      var batasWaktu = Date.now() - (3*24*60*60*1000);
      var keysHapus = [];
      for (var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if (k && k.indexOf('wasiatDraftHafalan|') === 0) {
          try {
            var parsed = JSON.parse(localStorage.getItem(k));
            if (!parsed || !parsed.waktuSimpan || parsed.waktuSimpan < batasWaktu) keysHapus.push(k);
          } catch(e) { keysHapus.push(k); }
        }
      }
      keysHapus.forEach(function(k){ localStorage.removeItem(k); });
    } catch(e) { /* localStorage nonaktif -- diamkan */ }
  }

      html += '</div><button type="button" id="btnSimpanHafalan">Simpan Hafalan</button>' +
        '<button type="button" class="secondary" id="btnBatalHafalan">Batal</button><div id="pesanSimpanHafalan"></div>';
      wrap.innerHTML = html;

      function toggleDetail(row){
        var jenis = row.querySelector('.jenisSelect').value;
        var isSetor = JENIS_HAFALAN_SETOR.indexOf(jenis) !== -1;
        row.querySelector('.detailHafalan').style.display = isSetor ? 'block' : 'none';
        // Mode input selector juga di-hide untuk jenis non-setor
        var modeWrap = row.querySelector('.modeInputWrap');
        if (modeWrap) modeWrap.style.display = isSetor ? 'block' : 'none';
      }

      // Toggle panel input sesuai mode yang dipilih
      function togglePanelMode(row){
        var mode = row.querySelector('.modeInput').value;
        row.querySelector('.panelAyat').style.display    = mode === 'ayat'    ? '' : 'none';
        row.querySelector('.panelHalaman').style.display = mode === 'halaman' ? '' : 'none';
        row.querySelector('.panelJuz').style.display     = mode === 'juz'     ? '' : 'none';
        row.querySelector('.panelMulti').style.display   = mode === 'multi'   ? '' : 'none';
      }
      // Isi ulang seluruh field (surah/ayat/juz/halaman/nilai) sesuai riwayat TERAKHIR
      // untuk jenis hafalan yang sedang dipilih -- supaya pengampu tinggal mengubah
      // bagian yang berbeda saja (biasanya cuma Ayat/Halaman).
      function terapkanRiwayat(row, jenis){
        var santri = res.data.find(function(d){ return d.nisn === row.dataset.nisn; });
        var t = santri && santri.terakhirPerJenis ? santri.terakhirPerJenis[jenis] : null;
        var hintEl = row.querySelector('.hintHafalan');
        hintEl.textContent = t
          ? ('Terakhir ('+jenis+', '+t.tanggal+'): '+(t.surah||'-')+' ayat '+(t.ayat||'-')+', Juz '+(t.juz||'-')+', Hal. '+(t.halamanKe||'-')+(t.nilai!=null&&t.nilai!==''?(', Nilai '+t.nilai):''))
          : ('Belum ada riwayat "'+jenis+'" untuk santri ini.');
        if (JENIS_HAFALAN_SETOR.indexOf(jenis) === -1) return;
        var ayatRange = parseRange(t ? t.ayat : '');
        var halamanRange = parseRange(t ? t.halamanKe : '');
        row.querySelector('.surahInput').value = t ? (t.surah||'') : '';
        // Sinkron search box dengan nilai dari riwayat
        var cariEl = row.querySelector('.surahCari');
        if (cariEl && t && t.surah) {
          var opsi = row.querySelector('.surahInput').options;
          var found = Array.from(opsi).find(function(o){return o.value===t.surah;});
          cariEl.value = found ? found.text : t.surah;
          cariEl.style.borderColor = found ? '#0d9488' : '';
        } else if (cariEl) { cariEl.value = ''; cariEl.style.borderColor=''; }
        row.querySelector('.ayatAwalInput').value = ayatRange.awal;
        row.querySelector('.ayatAkhirInput').value = ayatRange.akhir;
        // Isi juz dan halaman dari riwayat, tapi kalau ada data surah baru langsung hitung otomatis
        var juzInput = row.querySelector('.juzInput');
        var halAwalInput = row.querySelector('.halamanAwalInput');
        var halAkhirInput = row.querySelector('.halamanAkhirInput');
        if (t && t.juz) juzInput.value = String(t.juz);
        if (halamanRange.awal) halAwalInput.value = halamanRange.awal;
        if (halamanRange.akhir) halAkhirInput.value = halamanRange.akhir;
        row.querySelector('.nilaiSelect').value = (t && t.nilai!=null && t.nilai!=='') ? String(t.nilai) : '';
      }

      // ---- Fungsi auto-isi Juz dan Halaman ----
      function autoIsiJuzHalaman(row) {
        var surah = row.querySelector('.surahInput').value.trim();
        var ayatAwal = row.querySelector('.ayatAwalInput').value;
        var ayatAkhir = row.querySelector('.ayatAkhirInput').value;
        if (!surah) return;
        var juzInput = row.querySelector('.juzInput');
        var halAwalInput = row.querySelector('.halamanAwalInput');
        var halAkhirInput = row.querySelector('.halamanAkhirInput');

        // Juz -- selalu PASTI (dihitung dari batas juz resmi)
        if (ayatAwal) {
          var juz = hitungJuzDariAyat(surah, ayatAwal);
          if (juz) { juzInput.value = juz; juzInput.style.color = '#0d9488'; }
        }
        // Halaman -- dihitung dari tabel eksak 604 halaman Mushaf Madinah
        if (ayatAwal) {
          var hA = hitungHalamanDariAyat(surah, ayatAwal);
          if (hA) {
            halAwalInput.value = hA;
            halAwalInput.style.color = '#0d9488';
            halAwalInput.title = 'Halaman Mushaf Madinah (604 halaman)';
          }
        }
        if (ayatAkhir) {
          var hZ = hitungHalamanDariAyat(surah, ayatAkhir);
          if (hZ) {
            halAkhirInput.value = hZ;
            halAkhirInput.style.color = '#0d9488';
            halAkhirInput.title = 'Halaman Mushaf Madinah (604 halaman)';
          }
        }
        var nota = row.querySelector('.notaHalaman');
        if (!nota) {
          nota = document.createElement('div');
          nota.className = 'notaHalaman';
          nota.style.cssText = 'font-size:10.5px;margin-top:2px';
          if (halAkhirInput && halAkhirInput.parentNode) halAkhirInput.parentNode.appendChild(nota);
        }
        nota.innerHTML = '<span style="color:#0d9488">&#10003; Juz &amp; halaman terisi otomatis (Mushaf Madinah 604 hal).</span>';
      }

      wrap.querySelectorAll('.santriRowHafalan').forEach(function(row){
        var jenisAwal = row.querySelector('.jenisSelect').value;
        toggleDetail(row);
        terapkanRiwayat(row, jenisAwal);

        // Auto-isi saat surah atau ayat berubah
        var surahEl = row.querySelector('.surahInput');
        var surahCari = row.querySelector('.surahCari');
        var ayatAwalEl = row.querySelector('.ayatAwalInput');
        var ayatAkhirEl = row.querySelector('.ayatAkhirInput');
        function onSurahAyatChange(){ autoIsiJuzHalaman(row); }

        // Search filter surah real-time
        if (surahCari) {
          surahCari.addEventListener('input', function(){
            var q = this.value.toLowerCase().trim();
            var opsi = surahEl.options;
            // Reset semua dulu
            for (var i=1;i<opsi.length;i++) opsi[i].hidden = false;
            if (!q) return; // kalau kosong, tampilkan semua

            var matches = [];
            for (var i=1;i<opsi.length;i++) {
              var teks = opsi[i].text.toLowerCase();
              var nilai = opsi[i].value.toLowerCase();
              var cocok =
                teks.indexOf(q) !== -1 ||
                teks.replace(/^\d+\.\s*/,'').indexOf(q) !== -1 ||
                nilai.indexOf(q) !== -1;
              opsi[i].hidden = !cocok;
              if (cocok) matches.push(i);
            }
            // Auto-pilih jika hanya 1 hasil cocok
            if (matches.length === 1) {
              surahEl.selectedIndex = matches[0];
              surahCari.style.borderColor = '#0d9488';
              surahCari.value = surahEl.options[matches[0]].text;
              onSurahAyatChange();
            } else {
              surahCari.style.borderColor = matches.length === 0 ? '#dc2626' : '';
            }
          });
        }

        // Saat pilih dari select, sinkron ke search box
        surahEl.addEventListener('change', function(){
          if (this.value && surahCari) {
            var terpilih = surahEl.options[surahEl.selectedIndex];
            surahCari.value = terpilih ? terpilih.text : '';
            surahCari.style.borderColor = '#0d9488';
            // Reset hidden semua option
            Array.from(surahEl.options).forEach(function(o){o.hidden=false;});
          }
          onSurahAyatChange();
        });

        ayatAwalEl.addEventListener('input', onSurahAyatChange);
        ayatAkhirEl.addEventListener('input', onSurahAyatChange);

        row.querySelector('.jenisSelect').onchange = function(){
          toggleDetail(row);
          terapkanRiwayat(row, row.querySelector('.jenisSelect').value);
        };
        // Toggle panel sesuai mode input
        row.querySelector('.modeInput').onchange = function(){
          togglePanelMode(row);
        };
        togglePanelMode(row); // set awal
      });

      // Pulihkan draft yang belum sempat tersimpan (kalau ada) -- didahulukan dari
      // isian riwayat otomatis di atas, karena draft berarti ada pekerjaan yang
      // sedang berjalan dan belum sempat diklik Simpan.
      var draftKey = draftHafalanKey(namaHalaqoh, waktu, tanggal, STATE.user.nama);
      var draft = ambilDraftHafalan(draftKey);
      if (draft) {
        wrap.querySelectorAll('.santriRowHafalan').forEach(function(row){
          var d = draft[row.dataset.nisn];
          if (!d) return;
          var setVal = function(sel, val){ var el = row.querySelector(sel); if (el) el.value = val || ''; };
          setVal('.jenisSelect', d.jenis);
          toggleDetail(row);
          // Pulihkan mode input (kalau draft lama tidak punya, default 'ayat')
          setVal('.modeInput', d.mode || 'ayat');
          togglePanelMode(row);
          // Mode Ayat (existing)
          setVal('.surahInput', d.surah);
          setVal('.ayatAwalInput', d.ayatAwal);
          setVal('.ayatAkhirInput', d.ayatAkhir);
          if (d.juz) setVal('.juzInput', d.juz);
          if (d.halamanAwal) setVal('.halamanAwalInput', d.halamanAwal);
          if (d.halamanAkhir) setVal('.halamanAkhirInput', d.halamanAkhir);
          // Mode Halaman
          setVal('.halPanelDari', d.halPanelDari);
          setVal('.halPanelSampai', d.halPanelSampai);
          // Mode Juz (array of juz numbers)
          if (d.juzPanel) {
            var juzList = Array.isArray(d.juzPanel) ? d.juzPanel :
                          (typeof d.juzPanel === 'string' && d.juzPanel ? [Number(d.juzPanel)] : []);
            row.querySelectorAll('.juzCheck').forEach(function(cb){
              cb.checked = juzList.indexOf(Number(cb.value)) !== -1;
            });
          }
          // Mode Multi-Surah
          if (d.multiSurah && d.multiSurah.length) {
            var multiEl = row.querySelector('.multiSurahPanel');
            if (multiEl) {
              Array.from(multiEl.options).forEach(function(o){
                o.selected = d.multiSurah.indexOf(o.value) !== -1;
              });
            }
          }
          setVal('.nilaiSelect', d.nilai);
        });
        document.getElementById('pesanSimpanHafalan').innerHTML = warnBox('Isian yang belum sempat tersimpan sebelumnya berhasil dipulihkan otomatis. Silakan lanjutkan dan klik Simpan.');
      }

      // Simpan draft otomatis ke localStorage tiap ada perubahan pada form (di-debounce
      // 500ms supaya tidak menulis berkali-kali tiap ketikan) -- ini TIDAK mengirim apa
      // pun ke server, murni tersimpan di perangkat sendiri sampai benar-benar diklik
      // "Simpan Hafalan".
      var simpanDraftDebounced = debounce(function(){ simpanDraftHafalan(draftKey); }, 500);
      document.getElementById('formHafalan').addEventListener('input', simpanDraftDebounced);
      document.getElementById('formHafalan').addEventListener('change', simpanDraftDebounced);

      document.getElementById('btnBatalHafalan').onclick = function(){ hapusDraftHafalan(draftKey); guruIsiHafalan(); };
      document.getElementById('btnSimpanHafalan').onclick = function(){
        var items = [];
        var adaError = false;
        var pesanError = '';
        document.querySelectorAll('#formHafalan > div').forEach(function(row){
          var jenis = row.querySelector('.jenisSelect').value;
          var it = {nisn: row.dataset.nisn, nama: row.dataset.nama, jenisHafalan: jenis};
          if (JENIS_HAFALAN_SETOR.indexOf(jenis) !== -1) {
            it.nilai = row.querySelector('.nilaiSelect').value;
            var mode = row.querySelector('.modeInput').value;
            // Nilai wajib untuk semua jenis setoran. Tanpa ini catatan hafalan
            // tersimpan tanpa nilai dan tidak berguna untuk rekap maupun rapor.
            if (!it.nilai) { adaError = true; pesanError = 'Nilai belum dipilih untuk ' + it.nama + '.'; }

            if (mode === 'ayat') {
              // MODE 1: Per Ayat (existing)
              var ayatAwal = row.querySelector('.ayatAwalInput').value.trim();
              var ayatAkhir = row.querySelector('.ayatAkhirInput').value.trim();
              if (ayatAwal && ayatAkhir && Number(ayatAkhir) < Number(ayatAwal)) { adaError = true; pesanError = 'Ayat "sampai" lebih kecil dari "dari".'; }
              it.surah = row.querySelector('.surahInput').value;
              it.ayat = ayatAwal && ayatAkhir ? (ayatAwal + ' - ' + ayatAkhir) : ayatAwal;
              it.juz = row.querySelector('.juzInput').value;
              var halamanAwal = row.querySelector('.halamanAwalInput').value;
              var halamanAkhir = row.querySelector('.halamanAkhirInput').value || halamanAwal;
              if (halamanAkhir && halamanAwal && Number(halamanAkhir) < Number(halamanAwal)) { adaError = true; pesanError = 'Halaman "sampai" lebih kecil dari "dari".'; }
              it.halamanKe = (!halamanAkhir || halamanAwal === halamanAkhir) ? halamanAwal : (halamanAwal + ' - ' + halamanAkhir);
              // Mode ini sebelumnya TIDAK punya validasi isi sama sekali -- akibatnya
              // catatan bisa tersimpan dengan surah, ayat, juz, dan halaman semuanya
              // kosong, lalu tampil sebagai ": , Juz , Hal" di akun santri.
              if (!String(it.surah||'').trim()) { adaError = true; pesanError = 'Surah belum dipilih untuk ' + it.nama + '.'; }
              else if (!String(it.ayat||'').trim() && !String(it.halamanKe||'').trim()) { adaError = true; pesanError = 'Isi ayat atau halaman untuk ' + it.nama + '.'; }

            } else if (mode === 'halaman') {
              // MODE 2: Per Rentang Halaman
              var halDari = row.querySelector('.halPanelDari').value.trim();
              var halSampai = row.querySelector('.halPanelSampai').value.trim() || halDari;
              if (!halDari) { adaError = true; pesanError = 'Halaman "dari" wajib diisi untuk mode Rentang Halaman.'; }
              if (halDari && halSampai && Number(halSampai) < Number(halDari)) { adaError = true; pesanError = 'Halaman "sampai" lebih kecil dari "dari".'; }
              it.halamanKe = (halDari === halSampai || !halSampai) ? halDari : (halDari + ' - ' + halSampai);
              // Auto-hitung juz dari halaman awal
              it.juz = hitungJuzDariHalaman(Number(halDari)) || '';
              it.surah = '';
              it.ayat = '';

            } else if (mode === 'juz') {
              // MODE 3: Per Juz Utuh (bisa multi)
              var juzTerpilih = Array.from(row.querySelectorAll('.juzCheck:checked')).map(function(cb){return Number(cb.value);}).sort(function(a,b){return a-b;});
              if (!juzTerpilih.length) { adaError = true; pesanError = 'Pilih minimal satu juz untuk mode Juz Utuh.'; }
              it.juz = juzTerpilih.join(',');
              it.surah = juzTerpilih.map(function(j){return 'Juz '+j;}).join(', ');
              it.ayat = '';
              // Bangun halamanKe: cek apakah juz berturutan
              if (juzTerpilih.length === 1) {
                var r0 = rentangHalamanJuz(juzTerpilih[0]);
                it.halamanKe = r0 ? (r0.awal + ' - ' + r0.akhir) : '';
              } else {
                // Kelompokkan juz yang berturutan
                var groups = [], cur = [juzTerpilih[0]];
                for (var k=1;k<juzTerpilih.length;k++) {
                  if (juzTerpilih[k] === juzTerpilih[k-1] + 1) cur.push(juzTerpilih[k]);
                  else { groups.push(cur); cur = [juzTerpilih[k]]; }
                }
                groups.push(cur);
                it.halamanKe = groups.map(function(g){
                  var rA = rentangHalamanJuz(g[0]);
                  var rB = rentangHalamanJuz(g[g.length-1]);
                  return rA && rB ? (rA.awal + ' - ' + rB.akhir) : '';
                }).filter(Boolean).join(', ');
              }

            } else if (mode === 'multi') {
              // MODE 4: Multi-Surah
              var opts = row.querySelector('.multiSurahPanel').selectedOptions;
              var surahDipilih = Array.from(opts).map(function(o){return o.value;});
              if (!surahDipilih.length) { adaError = true; pesanError = 'Pilih minimal satu surah untuk mode Multi-Surah.'; }
              it.surah = surahDipilih.join(' + ');
              it.ayat = '';
              it.juz = '';
              it.halamanKe = '';
            }
          }
          items.push(it);
        });
        if (adaError) { document.getElementById('pesanSimpanHafalan').innerHTML = errBox(pesanError || 'Ada isian yang salah. Periksa kembali sebelum menyimpan.'); return; }
        var btn = document.getElementById('btnSimpanHafalan'); btn.disabled = true; btn.innerText = 'Menyimpan...';
        api('submitHafalan', {tanggal: document.getElementById('hfTanggal').value, waktu: waktu, halaqoh: namaHalaqoh, pengampu: STATE.user.nama, items: items})
          .then(function(res2){
            if(!res2.ok){ document.getElementById('pesanSimpanHafalan').innerHTML = errBox(res2.error); btn.disabled=false; btn.innerText='Simpan Hafalan'; return; }
            if(res2.offline){ document.getElementById('pesanSimpanHafalan').innerHTML='<div style="background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:13px">'+res2.pesanOffline+'</div>'; btn.disabled=false; btn.innerText='Simpan Hafalan'; return; }
            if(res2.offline){ document.getElementById('pesanSimpanHafalan').innerHTML='<div style="background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:13px">'+res2.pesanOffline+'</div>'; btn.disabled=false; btn.innerText='Simpan Hafalan'; return; }
            hapusDraftHafalan(draftKey);
            alert('Hafalan tersimpan (baru: '+res2.ditambah+', diperbarui: '+res2.diupdate+').');
            guruIsiHafalan();
          });
      };
    });
  }

  // Modal untuk membetulkan kesalahan pencatatan hafalan (bukan menghapus & catat ulang)
  // Deteksi mode input dari data existing hafalan
  function deteksiModeHafalan(row){
    var surah = String(row.surah || '').trim();
    // Mode "juz" -- surah dimulai dengan "Juz " (baik single "Juz 5" maupun multi "Juz 1, Juz 2, Juz 3")
    if (/^Juz\s+\d+/i.test(surah)) return 'juz';
    // Mode "multi" -- surah mengandung " + " (surah pendek digabung dengan +)
    if (surah.indexOf(' + ') !== -1) return 'multi';
    // Mode "halaman" -- ada halaman tapi tidak ada surah atau ayat
    if (!surah && !row.ayat && row.halamanKe) return 'halaman';
    // Default: mode "ayat"
    return 'ayat';
  }

  function bukaEditHafalan(row, muatUlang){
    var ayatRange = parseRange(row.ayat);
    var halamanRange = parseRange(row.halamanKe);
    var modeAwal = deteksiModeHafalan(row);
    var juzListAwal = []; // array nomor juz kalau mode 'juz'
    var multiSurahAwal = [];
    if (modeAwal === 'juz') {
      // Extract SEMUA nomor juz dari string, contoh: "Juz 1, Juz 2, Juz 3"
      var matches = String(row.surah).match(/Juz\s+(\d+)/gi) || [];
      juzListAwal = matches.map(function(m){
        return Number(m.match(/\d+/)[0]);
      });
    } else if (modeAwal === 'multi') {
      multiSurahAwal = String(row.surah).split(/\s*\+\s*/).map(function(s){return s.trim();}).filter(Boolean);
    }

    var opsiJuz30 = Array.from({length:30},function(_,i){return i+1;});
    var opsiNilai = Array.from({length:10},function(_,i){return (i+1)*10;});
    var datalistHtml = '<datalist id="editDaftarSurah">' + DAFTAR_SURAH.map(function(s){return '<option value="'+esc(s)+'">';}).join('') + '</datalist>';

    var fieldsHtml = datalistHtml +
      fieldSelect('ehJenis','Jenis Hafalan', JENIS_HAFALAN_ALL, row.jenis) +

      // MODE INPUT SELECTOR (sama seperti form input)
      '<label class="muted">Mode Input</label>' +
      '<select id="ehMode" style="width:100%">' +
      '<option value="ayat"'+(modeAwal==='ayat'?' selected':'')+'>Per Ayat (isi surah + ayat)</option>' +
      '<option value="halaman"'+(modeAwal==='halaman'?' selected':'')+'>Per Rentang Halaman (isi halaman)</option>' +
      '<option value="juz"'+(modeAwal==='juz'?' selected':'')+'>Per Juz Utuh (pilih juz saja)</option>' +
      '<option value="multi"'+(modeAwal==='multi'?' selected':'')+'>Multi-Surah (beberapa surah sekaligus)</option>' +
      '</select>' +

      // === PANEL AYAT ===
      '<div id="ehPanelAyat" style="display:none">' +
      '<label class="muted">Nama Surah</label><input id="ehSurah" list="editDaftarSurah" value="'+esc(modeAwal==='ayat'?(row.surah||''):'')+'">' +
      '<div class="grid2">' +
      '<div><label class="muted">Ayat (dari - sampai)</label><div style="display:flex;align-items:center;gap:6px">' +
      '<input id="ehAyatAwal" type="number" min="1" style="flex:1" value="'+esc(ayatRange.awal||'')+'"><span>-</span><input id="ehAyatAkhir" type="number" min="1" style="flex:1" value="'+esc(ayatRange.akhir||'')+'"></div></div>' +
      '<div><label class="muted">Juz</label><select id="ehJuz"><option value="">--</option>' + opsiJuz30.map(function(j){return '<option value="'+j+'" '+(Number(row.juz)===j?'selected':'')+'>'+j+'</option>';}).join('') + '</select></div>' +
      '</div>' +
      '<label class="muted">Halaman (dari - sampai)</label><div style="display:flex;align-items:center;gap:6px">' +
      '<input id="ehHalAwal" type="number" min="1" max="604" style="flex:1" value="'+esc(modeAwal==='ayat'?(halamanRange.awal||''):'')+'"><span>-</span>' +
      '<input id="ehHalAkhir" type="number" min="1" max="604" style="flex:1" value="'+esc(modeAwal==='ayat'?(halamanRange.akhir||''):'')+'"></div>' +
      '</div>' +

      // === PANEL HALAMAN ===
      '<div id="ehPanelHalaman" style="display:none">' +
      '<div class="grid2">' +
      '<div><label class="muted">Halaman Dari</label><input id="ehHalPanelDari" type="number" min="1" max="604" placeholder="10" style="width:100%" value="'+esc(modeAwal==='halaman'?(halamanRange.awal||''):'')+'"></div>' +
      '<div><label class="muted">Halaman Sampai</label><input id="ehHalPanelSampai" type="number" min="1" max="604" placeholder="12" style="width:100%" value="'+esc(modeAwal==='halaman'?(halamanRange.akhir||''):'')+'"></div>' +
      '</div>' +
      '<p class="faded" style="font-size:11px">Juz akan dihitung otomatis dari halaman.</p>' +
      '</div>' +

      // === PANEL JUZ UTUH (multi) ===
      '<div id="ehPanelJuz" style="display:none">' +
      '<label class="muted">Pilih Juz (bisa pilih lebih dari satu)</label>' +
      '<div id="ehJuzGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px;padding:6px;border:1px solid #e2e8f0;border-radius:8px;max-height:160px;overflow-y:auto">' +
      opsiJuz30.map(function(j){
        var checked = juzListAwal.indexOf(j) !== -1 ? ' checked' : '';
        return '<label style="display:flex;align-items:center;gap:4px;padding:4px 6px;background:#f8fafc;border-radius:6px;cursor:pointer;font-size:12px">' +
          '<input type="checkbox" class="ehJuzCheck" value="'+j+'"'+checked+' style="margin:0">' +
          '<span>Juz '+j+'</span></label>';
      }).join('') + '</div>' +
      '<p class="faded" style="font-size:11px">Centang beberapa juz yang disetorkan sekaligus.</p>' +
      '</div>' +

      // === PANEL MULTI-SURAH ===
      '<div id="ehPanelMulti" style="display:none">' +
      '<label class="muted">Pilih beberapa surah (Ctrl/Cmd + klik untuk pilih banyak)</label>' +
      '<select id="ehMultiPanel" multiple size="8" style="width:100%">' +
      QURAN_DB.map(function(s){
        var sel = multiSurahAwal.indexOf(s[1]) !== -1 ? ' selected' : '';
        return '<option value="'+esc(s[1])+'"'+sel+'>'+s[0]+'. '+esc(s[1])+'</option>';
      }).join('') + '</select>' +
