      opsiNilai.map(function(n){return '<option value="'+n+'" '+(String(row.nilai)===String(n)?'selected':'')+'>'+n+'</option>';}).join('') + '</select>' +
      '</div>';

    var modal = openModal('Edit Riwayat Hafalan - '+row.nama, fieldsHtml, function(m){
      var jenisBaru = m.querySelector('#ehJenis').value;
      var payload = {rowIndex: row.rowIndex, jenisHafalan: jenisBaru};

      if (JENIS_HAFALAN_SETOR.indexOf(jenisBaru) !== -1) {
        var mode = m.querySelector('#ehMode').value;
        payload.nilai = m.querySelector('#ehNilai').value;

        if (mode === 'ayat') {
          payload.surah = m.querySelector('#ehSurah').value;
          var aAwal = m.querySelector('#ehAyatAwal').value, aAkhir = m.querySelector('#ehAyatAkhir').value;
          if (aAwal && aAkhir && Number(aAkhir) < Number(aAwal)) { alert('Ayat "sampai" lebih kecil dari "dari".'); return false; }
          payload.ayat = (aAwal && aAkhir) ? (aAwal+' - '+aAkhir) : aAwal;
          payload.juz = m.querySelector('#ehJuz').value;
          var hAwal = m.querySelector('#ehHalAwal').value, hAkhir = m.querySelector('#ehHalAkhir').value || hAwal;
          if (hAwal && hAkhir && Number(hAkhir) < Number(hAwal)) { alert('Halaman "sampai" lebih kecil dari "dari".'); return false; }
          payload.halamanKe = (!hAkhir || hAwal === hAkhir) ? hAwal : (hAwal+' - '+hAkhir);

        } else if (mode === 'halaman') {
          var hDari = m.querySelector('#ehHalPanelDari').value.trim();
          var hSampai = m.querySelector('#ehHalPanelSampai').value.trim() || hDari;
          if (!hDari) { alert('Halaman "dari" wajib diisi untuk mode Rentang Halaman.'); return false; }
          if (hSampai && Number(hSampai) < Number(hDari)) { alert('Halaman "sampai" lebih kecil dari "dari".'); return false; }
          payload.halamanKe = (hDari === hSampai) ? hDari : (hDari+' - '+hSampai);
          payload.juz = hitungJuzDariHalaman(Number(hDari)) || '';
          payload.surah = '';
          payload.ayat = '';

        } else if (mode === 'juz') {
          var juzArr = Array.from(m.querySelectorAll('.ehJuzCheck:checked')).map(function(cb){return Number(cb.value);}).sort(function(a,b){return a-b;});
          if (!juzArr.length) { alert('Pilih minimal satu juz untuk mode Juz Utuh.'); return false; }
          payload.juz = juzArr.join(',');
          payload.surah = juzArr.map(function(j){return 'Juz '+j;}).join(', ');
          payload.ayat = '';
          // Bangun halamanKe berdasarkan grup juz berturutan
          if (juzArr.length === 1) {
            var r0e = rentangHalamanJuz(juzArr[0]);
            payload.halamanKe = r0e ? (r0e.awal + ' - ' + r0e.akhir) : '';
          } else {
            var groupsE = [], curE = [juzArr[0]];
            for (var ke=1;ke<juzArr.length;ke++) {
              if (juzArr[ke] === juzArr[ke-1] + 1) curE.push(juzArr[ke]);
              else { groupsE.push(curE); curE = [juzArr[ke]]; }
            }
            groupsE.push(curE);
            payload.halamanKe = groupsE.map(function(g){
              var rA = rentangHalamanJuz(g[0]);
              var rB = rentangHalamanJuz(g[g.length-1]);
              return rA && rB ? (rA.awal + ' - ' + rB.akhir) : '';
            }).filter(Boolean).join(', ');
          }

        } else if (mode === 'multi') {
          var opts = m.querySelector('#ehMultiPanel').selectedOptions;
          var surahDipilih = Array.from(opts).map(function(o){return o.value;});
          if (!surahDipilih.length) { alert('Pilih minimal satu surah untuk mode Multi-Surah.'); return false; }
          payload.surah = surahDipilih.join(' + ');
          payload.ayat = '';
          payload.juz = '';
          payload.halamanKe = '';
        }
      } else {
        payload.surah=''; payload.ayat=''; payload.juz=''; payload.halamanKe=''; payload.nilai='';
      }
      api('updateHafalan', payload).then(function(r){ if(!r.ok) alert(r.error); else muatUlang(); });
    });

    function togglePanel(){
      var jenis = modal.querySelector('#ehJenis').value;
      var isSetor = JENIS_HAFALAN_SETOR.indexOf(jenis) !== -1;
      modal.querySelector('#ehDetailWrap').style.display = isSetor ? 'block' : 'none';
      if (!isSetor) return;
      var mode = modal.querySelector('#ehMode').value;
      modal.querySelector('#ehPanelAyat').style.display    = mode === 'ayat'    ? '' : 'none';
      modal.querySelector('#ehPanelHalaman').style.display = mode === 'halaman' ? '' : 'none';
      modal.querySelector('#ehPanelJuz').style.display     = mode === 'juz'     ? '' : 'none';
      modal.querySelector('#ehPanelMulti').style.display   = mode === 'multi'   ? '' : 'none';
    }
    modal.querySelector('#ehJenis').onchange = togglePanel;
    modal.querySelector('#ehMode').onchange = togglePanel;
    togglePanel();

    // Auto-isi Juz dan Halaman saat surah/ayat diubah di mode Per Ayat
    function autoIsiEditModal(){
      var surah = modal.querySelector('#ehSurah').value.trim();
      var ayatAwal = modal.querySelector('#ehAyatAwal').value;
      var ayatAkhir = modal.querySelector('#ehAyatAkhir').value;
      if (!surah) return;
      // Juz otomatis dari ayat awal
      if (ayatAwal) {
        var juz = hitungJuzDariAyat(surah, Number(ayatAwal));
        if (juz) {
          modal.querySelector('#ehJuz').value = juz;
        }
      }
      // Halaman dari otomatis -- tabel eksak 604 halaman Mushaf Madinah
      if (ayatAwal) {
        var hA = hitungHalamanDariAyat(surah, Number(ayatAwal));
        if (hA) {
          var el = modal.querySelector('#ehHalAwal');
          el.value = hA;
          el.style.color = '#0d9488';
          el.title = 'Halaman Mushaf Madinah (604 halaman)';
        }
      }
      // Halaman sampai otomatis
      if (ayatAkhir) {
        var hZ = hitungHalamanDariAyat(surah, Number(ayatAkhir));
        if (hZ) {
          var el2 = modal.querySelector('#ehHalAkhir');
          el2.value = hZ;
          el2.style.color = '#0d9488';
          el2.title = 'Halaman Mushaf Madinah (604 halaman)';
        }
      }
      // Nota kecil di bawah kolom halaman
      var nota = modal.querySelector('#ehNotaHalaman');
      if (!nota) {
        nota = document.createElement('div');
        nota.id = 'ehNotaHalaman';
        nota.style.cssText = 'font-size:10.5px;margin-top:3px';
        var panel = modal.querySelector('#ehPanelAyat');
        if (panel) panel.appendChild(nota);
      }
      nota.innerHTML = '<span style="color:#0d9488">&#10003; Juz &amp; halaman terisi otomatis (Mushaf Madinah 604 hal).</span>';
    }
    // Pasang listener ke surah, ayat dari, ayat sampai
    var ehSurahEl = modal.querySelector('#ehSurah');
    var ehAyatAwalEl = modal.querySelector('#ehAyatAwal');
    var ehAyatAkhirEl = modal.querySelector('#ehAyatAkhir');
    if (ehSurahEl)   ehSurahEl.addEventListener('input', autoIsiEditModal);
    if (ehSurahEl)   ehSurahEl.addEventListener('change', autoIsiEditModal);
    if (ehAyatAwalEl) ehAyatAwalEl.addEventListener('input', autoIsiEditModal);
    if (ehAyatAkhirEl) ehAyatAkhirEl.addEventListener('input', autoIsiEditModal);
  } // end bukaEditHafalan

                '</div></div>':
                '<p style="color:#16a34a;font-weight:600;margin-top:8px">&#10004; Semua santri sudah setor hari ini!</p>')+
              '</div>'+

              (rekap.length?
                '<div class="card"><h4>Rekap Progress Hafalan (Semua Waktu)</h4>'+
                '<table><tr><th>Nama Santri</th><th>Total Sesi</th><th>Setoran</th><th>Murojaah</th><th>Juz Terakhir</th><th>Surah Terakhir</th><th>Nilai Rata</th></tr>'+

  // Export Excel (CSV)
  function excelRaporNilai(data, mapel, kelas, maxT, maxK){
    var bom='\uFEFF';
    var header1=['NO','Nama Santri'];
    for(var i=1;i<=maxT;i++) header1.push('T'+i);
    header1.push('Rata-Rata','UTS','Kehadiran','UAS','NPR');
    for(var i=1;i<=maxK;i++) header1.push('K'+i);
    header1.push('NKR','Total Sikap','Nilai Sikap','Rata Sikap','Huruf');

    var rows=[header1];
    data.forEach(function(d,i){
      var row=[i+1,d.nama];
      for(var j=0;j<maxT;j++) row.push(d.tugas[j]!==undefined?d.tugas[j]:'');
      row.push(d.ratatugas,d.uts,d.kehadiran,d.uas,d.npr);
      for(var j=0;j<maxK;j++) row.push(d.keterampilan[j]!==undefined?d.keterampilan[j]:'');
      row.push(d.nkr, d.totalPoinSikap||0, d.nilaiMax||0, d.nilaiSikapRapor||0, d.huruf);
      rows.push(row);
    });
    // Info tambahan di bawah
    rows.push([]);
    rows.push(['Mapel',mapel,'','Kelas',kelas,'','Pengampu',STATE.user.nama]);
    rows.push(['Formula NPR','Rata-Rata x35% + UTS x25% + UAS x30% + Kehadiran x10%']);

    var csv=bom+rows.map(function(r){
      return r.map(function(v){
        var s=String(v==null?'':v);
        if(s.includes(','))s='"'+s.replace(/"/g,'""')+'"';
        return s;
      }).join(',');
    }).join('\n');

    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='Rekap_Nilai_'+mapel.replace(/\s+/g,'_')+'_'+kelas+'_'+todayStr()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function guruRiwayatNilai(){
    var c = getContentEl();
    c.innerHTML = '<p>Memuat...</p>';
    Promise.all([api('getMapelGuru', {pengampu: STATE.user.nama}), api('getSemuaSantri', {})]).then(function(hasil){
      var daftarMapel = hasil[0].ok ? hasil[0].data.map(function(m){return m.mapel;}) : [];
      var daftarSantri = hasil[1].ok ? hasil[1].data : [];
      c.innerHTML = '<div class="card"><h3>&#128203; Riwayat Nilai</h3>' +
        '<div class="grid2">' +
        '<div>' + fieldAutocomplete('filMapelN','Filter Mapel', daftarMapel, '', 'kosongkan utk semua') + '</div>' +
        '<div>' + fieldAutocomplete('filNisnN','Filter Santri', daftarSantri.map(labelSantri), '', 'kosongkan utk semua') + '</div></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">' +
        '<button id="btnCariRiwayatN">Cari</button>' +
        '<button class="secondary" id="btnModeList">Mode List</button>' +
        '<button class="secondary" id="btnExcelRN">📄 Export Excel</button>' +
        '</div>' +
        '<div id="riwayatNTable" style="margin-top:12px"></div></div>';

      var lastData = [];
      var modeTampilan = 'pivot'; // 'pivot' | 'list'

      function cari(){
        if (!setHtmlSafe('riwayatNTable', 'Memuat...')) return;
        var rawNisn = document.getElementById('filNisnN') ? document.getElementById('filNisnN').value : '';
        var nisnResolved = rawNisn ? (resolveSantriNisn(rawNisn, daftarSantri) || rawNisn) : '';
        var mapelFilter = document.getElementById('filMapelN') ? document.getElementById('filMapelN').value : '';
        api('getRiwayatNilai', {pengajar: STATE.user.nama, mapel: mapelFilter, nisn: nisnResolved})
          .then(function(res){
            if (!document.getElementById('riwayatNTable')) return;
            if(!res.ok){ setHtmlSafe('riwayatNTable', errBox(res.error)); return; }
            if(!res.data.length){ setHtmlSafe('riwayatNTable', '<p class="muted">Belum ada data.</p>'); return; }
            lastData = res.data;
            renderTable();
          });
      }

      function renderTable(){
        if (modeTampilan === 'list') renderModeList();
        else renderModePivot();
      }

      // Format tabel berbaris: setiap baris = 1 nilai (untuk edit/hapus per baris)
      function renderModeList(){
        var html = '<div style="overflow-x:auto"><table><tr>' +
          '<th>Tanggal</th><th>Mapel</th><th>Kelas</th><th>Nama</th><th>Jenis</th><th>Nilai</th><th>Aksi</th></tr>';
        lastData.forEach(function(r){
          html += '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.mapel)+'</td><td>'+esc(r.kelas)+'</td>' +
            '<td>'+esc(r.nama)+'</td><td>'+esc(r.jenisNilai)+'</td><td><b>'+esc(r.nilai)+'</b></td>' +
            '<td><button class="small btnEditN" data-row="'+r.rowIndex+'" data-nilai="'+esc(r.nilai)+'">Edit</button> ' +
            '<button class="small danger btnHapusN" data-row="'+r.rowIndex+'">Hapus</button></td></tr>';
        });
        html += '</table></div>';
        if (!setHtmlSafe('riwayatNTable', html)) return;
        bindEditHapus();
      }

      // Format pivot: baris per santri per mapel, kolom Tugas 1, Tugas 2, ...
      function renderModePivot(){
        // Kelompokkan: key = mapel+kelas+nisn
        var group = {};
        lastData.forEach(function(r){
          var key = r.mapel + '|' + r.kelas + '|' + r.nisn;
          if (!group[key]) {
            group[key] = {mapel:r.mapel, kelas:r.kelas, nisn:r.nisn, nama:r.nama,
                          tugas:[], keterampilan:[], uts:'', uas:''};
          }
          var g = group[key];
          if (r.jenisNilai === 'Tugas') g.tugas.push({nilai:r.nilai, rowIndex:r.rowIndex, tanggal:r.tanggal});
          else if (r.jenisNilai === 'Keterampilan') g.keterampilan.push({nilai:r.nilai, rowIndex:r.rowIndex, tanggal:r.tanggal});
          else if (r.jenisNilai === 'UTS') g.uts = {nilai:r.nilai, rowIndex:r.rowIndex};
          else if (r.jenisNilai === 'UAS') g.uas = {nilai:r.nilai, rowIndex:r.rowIndex};
        });
        // Urutkan tugas & keterampilan per tanggal (paling lama = Tugas 1)
        Object.values(group).forEach(function(g){
          g.tugas.sort(function(a,b){return String(a.tanggal).localeCompare(String(b.tanggal));});
          g.keterampilan.sort(function(a,b){return String(a.tanggal).localeCompare(String(b.tanggal));});
        });

        // Kelompokkan per mapel+kelas (tabel terpisah per mapel+kelas)
        var perMapel = {};
        Object.values(group).forEach(function(g){
          var mk = g.mapel + ' — ' + g.kelas;
          if (!perMapel[mk]) perMapel[mk] = [];
          perMapel[mk].push(g);
        });

        var htmlAll = '';
        Object.keys(perMapel).sort().forEach(function(mk){
          var rows = perMapel[mk].sort(function(a,b){return a.nama.localeCompare(b.nama,'id');});
          var maxT = Math.max.apply(null, rows.map(function(r){return r.tugas.length;}).concat([0]));
          var maxK = Math.max.apply(null, rows.map(function(r){return r.keterampilan.length;}).concat([0]));

          htmlAll += '<div style="margin-bottom:20px">' +
            '<h4 style="margin:8px 0;color:#0d9488">'+esc(mk)+'</h4>' +
            '<div style="overflow-x:auto"><table style="font-size:12px;border-collapse:collapse;min-width:600px">' +
            '<thead><tr style="background:#0d9488;color:#fff">' +
            '<th style="padding:6px 8px;text-align:center;width:36px">No</th>' +
            '<th style="padding:6px 8px;text-align:left">Nama Santri</th>';
          for (var i=1; i<=maxT; i++) htmlAll += '<th style="padding:6px 8px;text-align:center">Tugas '+i+'</th>';
          htmlAll += '<th style="padding:6px 8px;text-align:center;background:#0f766e">Rata Tugas</th>';
          htmlAll += '<th style="padding:6px 8px;text-align:center">UTS</th>';
          htmlAll += '<th style="padding:6px 8px;text-align:center">UAS</th>';
          for (var i=1; i<=maxK; i++) htmlAll += '<th style="padding:6px 8px;text-align:center">Ket '+i+'</th>';
          htmlAll += '<th style="padding:6px 8px;text-align:center;background:#0f766e">Rata Ket</th>';
          htmlAll += '</tr></thead><tbody>';

          rows.forEach(function(r, idx){
            var rataT = r.tugas.length ? Math.round(r.tugas.reduce(function(a,b){return a+Number(b.nilai||0);},0)/r.tugas.length) : '';
            var rataK = r.keterampilan.length ? Math.round(r.keterampilan.reduce(function(a,b){return a+Number(b.nilai||0);},0)/r.keterampilan.length) : '';
            htmlAll += '<tr style="background:'+(idx%2===0?'#fff':'#f8fafc')+'">' +
              '<td style="padding:5px 8px;text-align:center;color:#94a3b8">'+(idx+1)+'</td>' +
              '<td style="padding:5px 8px;font-weight:600">'+esc(r.nama)+'</td>';
            for (var i=0; i<maxT; i++) {
              var t = r.tugas[i];
              htmlAll += '<td style="padding:5px 8px;text-align:center">'+
                (t ? '<span class="editableNilai" data-row="'+t.rowIndex+'" data-nilai="'+esc(t.nilai)+'" style="cursor:pointer;color:#0d9488" title="Klik untuk edit">'+esc(t.nilai)+'</span>' : '-')+
                '</td>';
            }
            htmlAll += '<td style="padding:5px 8px;text-align:center;font-weight:700;background:#f0fdfa;color:#0f766e">'+(rataT||'-')+'</td>';
            htmlAll += '<td style="padding:5px 8px;text-align:center">'+(r.uts ? '<span class="editableNilai" data-row="'+r.uts.rowIndex+'" data-nilai="'+esc(r.uts.nilai)+'" style="cursor:pointer;color:#0d9488">'+esc(r.uts.nilai)+'</span>' : '-')+'</td>';
            htmlAll += '<td style="padding:5px 8px;text-align:center">'+(r.uas ? '<span class="editableNilai" data-row="'+r.uas.rowIndex+'" data-nilai="'+esc(r.uas.nilai)+'" style="cursor:pointer;color:#0d9488">'+esc(r.uas.nilai)+'</span>' : '-')+'</td>';
            for (var i=0; i<maxK; i++) {
              var k = r.keterampilan[i];
              htmlAll += '<td style="padding:5px 8px;text-align:center">'+
                (k ? '<span class="editableNilai" data-row="'+k.rowIndex+'" data-nilai="'+esc(k.nilai)+'" style="cursor:pointer;color:#0d9488" title="Klik untuk edit">'+esc(k.nilai)+'</span>' : '-')+
                '</td>';
            }
            htmlAll += '<td style="padding:5px 8px;text-align:center;font-weight:700;background:#f0fdfa;color:#0f766e">'+(rataK||'-')+'</td>';
            htmlAll += '</tr>';
          });
          htmlAll += '</tbody></table></div></div>';
        });

        htmlAll += '<p class="faded" style="font-size:11px">💡 Klik nilai berwarna hijau untuk mengeditnya. Klik <b>Mode List</b> untuk melihat riwayat berbaris + tombol hapus.</p>';
        if (!setHtmlSafe('riwayatNTable', htmlAll)) return;

        // Bind click untuk edit inline
        document.querySelectorAll('.editableNilai').forEach(function(el){
          el.onclick = function(){
            openModal('Edit Nilai', fieldText('editNilai','Nilai', el.dataset.nilai), function(modal){
              return api('updateNilai', {rowIndex:Number(el.dataset.row), nilai: modal.querySelector('#editNilai').value}).then(cari);
            });
          };
        });
      }

      function bindEditHapus(){
        document.querySelectorAll('.btnEditN').forEach(function(btn){
          btn.onclick = function(){
            openModal('Edit Nilai', fieldText('editNilai','Nilai', btn.dataset.nilai), function(modal){
              return api('updateNilai', {rowIndex:Number(btn.dataset.row), nilai: modal.querySelector('#editNilai').value}).then(cari);
            });
          };
        });
        document.querySelectorAll('.btnHapusN').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Hapus data nilai ini?')) return; api('deleteNilai', {rowIndex:Number(btn.dataset.row)}).then(cari); };
        });
      }

      document.getElementById('btnCariRiwayatN').onclick = cari;
      document.getElementById('btnModeList').onclick = function(){
        modeTampilan = (modeTampilan === 'list') ? 'pivot' : 'list';
        this.textContent = modeTampilan === 'list' ? 'Mode Pivot' : 'Mode List';
        renderTable();
      };
      document.getElementById('btnExcelRN').onclick = function(){
        if (!lastData.length) { alert('Tidak ada data untuk diekspor.'); return; }
        var bom = '\uFEFF';
        var header = ['Tanggal','Mapel','Kelas','NISN','Nama','Jenis Nilai','Nilai'];
        var rows = lastData.map(function(r){return [r.tanggal, r.mapel, r.kelas, r.nisn, r.nama, r.jenisNilai, r.nilai];});
        var csv = bom + [header].concat(rows).map(function(r){
          return r.map(function(v){ var s=String(v||''); return s.includes(',')?'"'+s+'"':s; }).join(',');
        }).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
        a.download = 'Riwayat_Nilai_'+todayStr()+'.csv';
        a.click();
      };
      cari();
    });
  }

  // =====================================================================
  // DASHBOARD WALI SANTRI
  // =====================================================================
  // Kartu ringkasan paling atas dashboard Wali Santri -- 4 info penting sekaligus
  // (saldo kantin, persentase kehadiran 7 hari, pelanggaran 7 hari, tunggakan SPP)
  // supaya orang tua langsung tahu kondisi anaknya tanpa perlu scroll.
  function muatRingkasanWali(nisn){
    var wrap = document.getElementById('dw-ringkasan');
    wrap.innerHTML = '<div class="ringkasan-grid">' +
      '<div class="ringkasan-tile"><div class="ico">&#128176;</div><div class="nilai">...</div><div class="label">Saldo Kantin</div></div>' +
      '<div class="ringkasan-tile"><div class="ico">&#128202;</div><div class="nilai">...</div><div class="label">Kehadiran 7 Hari</div></div>' +
      '<div class="ringkasan-tile"><div class="ico">&#9888;&#65039;</div><div class="nilai">...</div><div class="label">Pelanggaran 7 Hari</div></div>' +
      '<div class="ringkasan-tile"><div class="ico">&#128179;</div><div class="nilai">...</div><div class="label">Tunggakan SPP</div></div>' +
      '</div>';

    Promise.all([
      api('getSaldoSantriKantin', {nisn:nisn}),
      api('getNotifikasiMingguan', {nisn:nisn}),
      api('getRiwayatPelanggaranSantri', {nisn:nisn}),
      api('getSppSaya', {nisn:nisn})
    ]).then(function(hasil){
      var resSaldo = hasil[0], resAbsen = hasil[1], resPel = hasil[2], resSpp = hasil[3];

      // -- Saldo Kantin --
      var saldoHtml, saldoWarna = '';
      if (resSaldo.ok) {
        saldoHtml = 'Rp'+resSaldo.data.saldo.toLocaleString('id-ID');
      } else { saldoHtml = '-'; }

      // -- Persentase Kehadiran 7 hari terakhir --
      var persenHtml = '-', persenWarna = '', subKehadiran = '';
      if (resAbsen.ok) {
        var r = resAbsen.data.rekap;
        var total = (r.Hadir||0)+(r.Sakit||0)+(r.Izin||0)+(r.Alpa||0);
        var persen = total>0 ? Math.round((r.Hadir||0)/total*100) : 0;
        persenHtml = persen+'%';
        persenWarna = persen>=90 ? 'warna-hijau' : (persen>=75 ? 'warna-amber' : 'warna-merah');
        subKehadiran = 'Hadir '+(r.Hadir||0)+' dari '+total+' hari';
      }

      // -- Pelanggaran 7 hari terakhir --
      var jmlPelMingguIni = 0, pelWarna = 'warna-hijau';
      if (resPel.ok) {
        var batas7Hari = new Date(); batas7Hari.setDate(batas7Hari.getDate()-7);
        var batas7Str = todayStrDari(batas7Hari);
        jmlPelMingguIni = resPel.data.filter(function(x){ return x.pelanggaran!=='-' && x.tanggal >= batas7Str; }).length;
        pelWarna = jmlPelMingguIni > 0 ? 'warna-merah' : 'warna-hijau';
      }

      // -- Tunggakan SPP --
      var tunggakanHtml = '-', tunggakanSub = '', sppWarna = 'warna-hijau';
      if (resSpp.ok) {
        if (!resSpp.data.adaSpp) { tunggakanHtml = '-'; tunggakanSub = 'Belum terdaftar SPP'; }
        else if (resSpp.data.bulanTunggakan.length === 0) { tunggakanHtml = 'Rp0'; tunggakanSub = 'Semua lunas &#10003;'; sppWarna = 'warna-hijau'; }
        else { tunggakanHtml = 'Rp'+resSpp.data.totalTunggakan.toLocaleString('id-ID'); tunggakanSub = resSpp.data.bulanTunggakan.length+' bulan menunggak'; sppWarna = 'warna-merah'; }
      }

      wrap.innerHTML = '<div class="ringkasan-grid">' +
        '<div class="ringkasan-tile"><div class="ico">&#128176;</div><div class="nilai">'+saldoHtml+'</div><div class="label">Saldo Kantin</div></div>' +
        '<div class="ringkasan-tile '+persenWarna+'"><div class="ico">&#128202;</div><div class="nilai">'+persenHtml+'</div><div class="label">Kehadiran 7 Hari</div><div class="sub">'+subKehadiran+'</div></div>' +
        '<div class="ringkasan-tile '+pelWarna+'"><div class="ico">&#9888;&#65039;</div><div class="nilai">'+jmlPelMingguIni+'</div><div class="label">Pelanggaran 7 Hari</div></div>' +
        '<div class="ringkasan-tile '+sppWarna+'"><div class="ico">&#128179;</div><div class="nilai">'+tunggakanHtml+'</div><div class="label">Tunggakan SPP</div><div class="sub">'+tunggakanSub+'</div></div>' +
        '</div>';
    });
  }
  function todayStrDari(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  function muatRiwayatPelanggaranWali(nisn){
    var wrap = document.getElementById('dw-pelanggaran');
    wrap.innerHTML = '<div class="card"><h3>Riwayat Pelanggaran &amp; Prestasi</h3><p>Memuat...</p></div>';
    Promise.all([api('getRekapPoinSantri', {}), api('getRiwayatPelanggaranSantri', {nisn:nisn})]).then(function(hasil){
      var resRekap = hasil[0], resRiwayat = hasil[1];
      if (!resRiwayat.ok) { wrap.innerHTML = '<div class="card">'+errBox(resRiwayat.error)+'</div>'; return; }
      var statusSaya = resRekap.ok ? resRekap.data.data.find(function(s){return String(s.nisn)===String(nisn);}) : null;
      var html = '<div class="card"><h3>Riwayat Pelanggaran &amp; Prestasi</h3>';
      if (statusSaya) {
        html += '<p style="font-size:16px">Poin Bulan Ini: <b>'+statusSaya.poin+' / '+resRekap.data.modal+'</b> -- Status: '+(statusSaya.status==='Habis'?'&#9888;&#65039; Habis':'&#9989; Aktif')+'</p>';
      } else {
        html += '<p class="muted">Belum ada catatan poin bulan ini.</p>';
      }
      if (!resRiwayat.data.length) {
        html += '<p class="muted">Belum ada riwayat pelanggaran/prestasi.</p>';
      } else {
        html += '<table><tr><th>Tanggal</th><th>Pelanggaran</th><th>Prestasi</th><th>Pencatat</th></tr>' +
          resRiwayat.data.map(function(r){
            return '<tr><td>'+esc(r.tanggal)+'</td>' +
              '<td>'+(r.pelanggaran!=='-'?('<span style="color:#dc2626">'+esc(r.pelanggaran)+' (-'+r.poinPelanggaran+')</span>'):'-')+'</td>' +
              '<td>'+(r.prestasi!=='-'?('<span style="color:#16a34a">'+esc(r.prestasi)+' (+'+r.poinPrestasi+')</span>'):'-')+'</td>' +
              '<td>'+esc(r.pencatat)+'</td></tr>';
          }).join('') + '</table>';
      }
      html += '</div>';
      wrap.innerHTML = html;
    });
  }

  // ---------------- PERSETUJUAN SALDO (dipakai Bendahara & Admin/Mudir) ----------------
  function renderPersetujuanSaldo(containerId){
    var c = document.getElementById(containerId || STATE._contentId || 'db-content');
    if (!c) { console.error('renderPersetujuanSaldo: container tidak ditemukan:', containerId); return; }
    c.innerHTML = '<p>Memuat...</p>';
    Promise.all([api('getSemuaPengajuanTarik', {hanyaPending:true}), api('getSemuaPengajuanTopUp', {hanyaPending:true})]).then(function(hasil){
      var resTarik = hasil[0], resTopUp = hasil[1];
      c.innerHTML = '<div class="card"><h3>Pengajuan Tarik Saldo (Pemilik Barang)</h3><div id="listPengajuanTarik"></div></div>' +
        '<div class="card"><h3>Pengajuan Tambah Saldo (Wali Santri)</h3><div id="listPengajuanTopUp"></div></div>';

      function renderTarik(){
        if(!resTarik.ok){ document.getElementById('listPengajuanTarik').innerHTML = errBox(resTarik.error); return; }
        if(!resTarik.data.length){ document.getElementById('listPengajuanTarik').innerHTML = '<p class="muted">Tidak ada pengajuan menunggu.</p>'; return; }
        document.getElementById('listPengajuanTarik').innerHTML = '<table><tr><th>Tanggal</th><th>Pemilik</th><th>Nominal</th><th>Aksi</th></tr>' +
          resTarik.data.map(function(x){
            return '<tr><td>'+esc(x.tanggal)+' '+esc(x.waktu)+'</td><td>'+esc(x.pemilik)+'</td><td>Rp'+x.nominal.toLocaleString('id-ID')+'</td>' +
              '<td><button class="small btnSetujuiTarik" data-row="'+x.rowIndex+'">Setujui</button> <button class="small danger btnTolakTarik" data-row="'+x.rowIndex+'">Tolak</button></td></tr>';
          }).join('') + '</table>';
        document.querySelectorAll('.btnSetujuiTarik').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Setujui penarikan ini? Saldo pemilik akan langsung terpotong.')) return;
            api('setujuiPenarikan', {rowIndex:Number(btn.dataset.row), disetujuiOleh:STATE.user.nama}).then(function(r){ if(!r.ok) alert(r.error); else renderPersetujuanSaldo(containerId); }); };
        });
        document.querySelectorAll('.btnTolakTarik').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Tolak pengajuan ini?')) return;
            api('tolakPenarikan', {rowIndex:Number(btn.dataset.row), diprosesOleh:STATE.user.nama}).then(function(r){ if(!r.ok) alert(r.error); else renderPersetujuanSaldo(containerId); }); };
        });
      }
      function renderTopUp(){
        if(!resTopUp.ok){ document.getElementById('listPengajuanTopUp').innerHTML = errBox(resTopUp.error); return; }
        if(!resTopUp.data.length){ document.getElementById('listPengajuanTopUp').innerHTML = '<p class="muted">Tidak ada pengajuan menunggu.</p>'; return; }
        document.getElementById('listPengajuanTopUp').innerHTML = '<table><tr><th>Tanggal</th><th>Santri</th><th>Nominal</th><th>Aksi</th></tr>' +
          resTopUp.data.map(function(x){
            return '<tr><td>'+esc(x.tanggal)+' '+esc(x.waktu)+'</td><td>'+esc(x.namaSantri)+'</td><td>Rp'+x.nominal.toLocaleString('id-ID')+'</td>' +
              '<td><button class="small btnSetujuiTopUp" data-row="'+x.rowIndex+'">Setujui</button> <button class="small danger btnTolakTopUp" data-row="'+x.rowIndex+'">Tolak</button></td></tr>';
          }).join('') + '</table>';
        document.querySelectorAll('.btnSetujuiTopUp').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Setujui tambah saldo ini? Pastikan bukti transfer sudah diterima.')) return;
            api('setujuiTopUp', {rowIndex:Number(btn.dataset.row), disetujuiOleh:STATE.user.nama}).then(function(r){ if(!r.ok) alert(r.error); else renderPersetujuanSaldo(containerId); }); };
        });
        document.querySelectorAll('.btnTolakTopUp').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Tolak pengajuan ini?')) return;
            api('tolakTopUp', {rowIndex:Number(btn.dataset.row), diprosesOleh:STATE.user.nama}).then(function(r){ if(!r.ok) alert(r.error); else renderPersetujuanSaldo(containerId); }); };
        });
      }
      renderTarik(); renderTopUp();
    });
  }

  // ---------------- SPP SANTRI (dipakai Bendahara & Admin/Mudir) ----------------
  var BULAN_SINGKAT_SPP = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  function labelBulanSingkatSpp(idx, tahunMasuk){
    // Bulan 1 = Juli tahun ajaran (bukan Januari)
    var totalBulanKalender = 6 + (idx - 1);
    var yearOffset = Math.floor(totalBulanKalender / 12);
    var mi = totalBulanKalender % 12;
    return BULAN_SINGKAT_SPP[mi] + " '" + String(parseInt(tahunMasuk)+yearOffset).slice(2);
  }
  function bulanJatuhTempoSppFE(tahunMasuk){
    // Bulan 1 = Juli tahun ajaran (bukan Januari)
    var today = new Date(); var max = 0;
    for (var m=1; m<=36; m++){
      var totalBulanKalender = 6 + (m - 1);
      var yearOffset = Math.floor(totalBulanKalender / 12);
      var monthIdx = totalBulanKalender % 12;
      var d = new Date(parseInt(tahunMasuk) + yearOffset, monthIdx, 1);
      if (d <= today) max = m; else break;
    }
    return max;
  }

  // Cetak kuitansi pembayaran SPP
  // ============================================================
  // KUITANSI SPP — gambar Canvas bergaya struk mobile banking
  // ============================================================
  function cetakKuitansiSPP(santri, bulan, tanggalLunas){
    var namaSekolah = STATE.pengaturan.NamaPesantren || 'Pondok Pesantren';
    var labelBulan  = labelBulanSingkatSpp(bulan, santri.tahunMasuk);
    var noRef = 'SPP-' + santri.nisn + '-' + bulan + '-' + todayStr().replace(/-/g,'');
    var tgl   = todayStr();
    var jam   = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    var nominal = 'Rp '+Number(santri.biaya).toLocaleString('id-ID');
    var noWaOrtu = santri.noWa || '';

    // Buat gambar struk via Canvas
    function buatGambarStruk(callback){
      var W = 600, pad = 36;
      var canvas = document.createElement('canvas');
      canvas.width = W;
      // Hitung tinggi
      var H = 520;
      canvas.height = H;
      var ctx = canvas.getContext('2d');

      // Background putih
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,W,H);

      // Header gradient
      var grad = ctx.createLinearGradient(0,0,W,100);
      grad.addColorStop(0,'#0d9488');
      grad.addColorStop(1,'#0891b2');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(W,0); ctx.lineTo(W,90); ctx.lineTo(0,90);
      ctx.fill();

      // Garis bergelombang
      ctx.beginPath();
      ctx.moveTo(0,90);
      for(var xi=0;xi<=W;xi+=20){
        ctx.quadraticCurveTo(xi+10,80,xi+20,90);
      }
      ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
      ctx.fillStyle='#ffffff';
      ctx.fill();

      var cy = 20;
      function txt(str,x,sy,size,color,align,bold){
        ctx.font=(bold?'bold ':'')+size+'px Arial, sans-serif';
        ctx.fillStyle=color||'#1e293b';
        ctx.textAlign=align||'left';
        ctx.fillText(str,x,sy);
        ctx.textAlign='left';
      }
      function dashedLine(sy){
        ctx.setLineDash([6,5]);
        ctx.strokeStyle='#e2e8f0';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(pad,sy); ctx.lineTo(W-pad,sy);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      function solidLine(sy){
        ctx.setLineDash([]);
        ctx.strokeStyle='#e2e8f0';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(pad,sy); ctx.lineTo(W-pad,sy);
        ctx.stroke();
      }

      function renderIsiStruk(){
        cy = 108;
        // Nominal besar
        txt('NOMINAL PEMBAYARAN', W/2, cy+20, 11, '#94a3b8', 'center', false); cy+=28;
        txt(nominal, W/2, cy+46, 46, '#0d9488', 'center', true); cy+=60;

        // Badge LUNAS
        var bw=120, bh=34, bx=(W-bw)/2;
        ctx.fillStyle='#f0fdf4';
        _roundRect(ctx,bx,cy,bw,bh,8);
        ctx.fillStyle='#16a34a';
        ctx.font='bold 14px Arial';
        ctx.textAlign='center';
        ctx.fillText('\u2713  LUNAS',W/2,cy+22);
        ctx.textAlign='left';
        cy+=50;

        dashedLine(cy); cy+=20;

        function rowData(label,val){
          txt(label,pad,cy+20,12,'#64748b');
          if(val.length>28){
            txt(val.substring(0,28),W-pad,cy+12,12,'#1e293b','right',true);
            txt(val.substring(28),W-pad,cy+26,12,'#1e293b','right',true);
            cy+=44;
          } else {
            txt(val,W-pad,cy+20,13,'#1e293b','right',true);
            cy+=44;
          }
          solidLine(cy-8);
        }

        rowData('Tanggal Bayar', tgl+' '+jam);
        rowData('No. Referensi', noRef);
        dashedLine(cy); cy+=16;
        rowData('Nama Santri', santri.nama);
        rowData('NISN', santri.nisn);
        rowData('Keterangan', 'SPP '+labelBulan);
        dashedLine(cy); cy+=16;
        rowData('Status Pembayaran', 'LUNAS \u2713');

        cy+=16;
        txt('Terima kasih telah membayar tepat waktu', W/2, cy+16, 11, '#94a3b8', 'center');
        cy+=28;
        txt(noRef+' \u2022 WASIAT', W/2, cy, 10, '#cbd5e1', 'center');
        ctx.font='bold 11px Arial';
        ctx.fillStyle='#e2e8f0';
        ctx.textAlign='right';
        ctx.fillText('WASIAT \u00A9 '+namaSekolah, W-pad, H-12);
        ctx.textAlign='left';

        callback(canvas.toDataURL('image/png'));
      }

      // Render header + logo
      var logoUrl = STATE.pengaturan && STATE.pengaturan.LogoURL ? STATE.pengaturan.LogoURL : '';

      function renderHeader(logoImg){
        // Teks subtitle kecil
        ctx.fillStyle='rgba(255,255,255,0.75)';
        ctx.font='10px Arial';
        ctx.textAlign='center';
        ctx.fillText('BUKTI PEMBAYARAN SPP', W/2, 20);

        if (logoImg) {
          // Gambar logo bulat di tengah header
          var lSize = 44;
          var lx = (W - lSize) / 2, ly = 24;
          // Lingkaran putih transparan di belakang logo
          ctx.save();
          ctx.beginPath();
          ctx.arc(W/2, ly+lSize/2, lSize/2+4, 0, Math.PI*2);
          ctx.fillStyle='rgba(255,255,255,0.2)';
          ctx.fill();
          // Clip lingkaran untuk logo
          ctx.beginPath();
          ctx.arc(W/2, ly+lSize/2, lSize/2, 0, Math.PI*2);
          ctx.clip();
          var ratio = logoImg.naturalWidth/logoImg.naturalHeight;
          var lw = ratio>=1 ? lSize : lSize*ratio;
          var lh = ratio>=1 ? lSize/ratio : lSize;
          ctx.drawImage(logoImg, (W-lw)/2, ly+(lSize-lh)/2, lw, lh);
          ctx.restore();
          // Nama pesantren di bawah logo
          ctx.fillStyle='#ffffff';
          ctx.font='bold 13px Arial';
          ctx.textAlign='center';
          ctx.fillText(namaSekolah, W/2, ly+lSize+16);
        } else {
          // Tanpa logo -- nama pesantren lebih besar di tengah
          ctx.fillStyle='#ffffff';
          ctx.font='bold 16px Arial';
          ctx.textAlign='center';
          ctx.fillText(namaSekolah, W/2, 52);
        }
        ctx.textAlign='left';
        renderIsiStruk();
      }

      if (logoUrl) {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function(){ renderHeader(img); };
        img.onerror = function(){ renderHeader(null); };
        img.src = logoUrl;
      } else {
        renderHeader(null);
      }
    }


    function _roundRect(ctx,x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
      ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
      ctx.closePath();ctx.fill();
    }

    // Buat gambar, lalu tampilkan modal
    buatGambarStruk(function(dataUrl){

        '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'+

      document.body.appendChild(overlay);

          '<style>body{margin:0;display:flex;justify-content:center;align-items:flex-start;padding:8px}img{max-width:300px;width:100%}@media print{@page{margin:4mm;size:80mm auto}body{margin:0}}</style></head><body>'+

            );

                text: '✅ Bukti pembayaran SPP '+labelBulan+' sebesar '+nominal+' atas nama *'+santri.nama+'* telah diterima. Terima kasih 🙏'

        if (navigator.share) {
          fetch(dataUrl)
            .then(function(r){ return r.blob(); })
            .then(function(blob){
              var file = new File([blob], 'Struk_SPP_'+santri.nama.replace(/\s+/g,'_')+'.png', {type:'image/png'});

                files: [file]
              };
              // Cek apakah file bisa di-share
              if (navigator.canShare && navigator.canShare(shareData)) {
                return navigator.share(shareData);

              // Kalau file tidak bisa, share teks saja
              return navigator.share({
                title: 'Bukti Pembayaran SPP - '+santri.nama,

              });
            })
            .catch(function(err){
              // User cancel atau browser tidak support -- fallback ke wa.me
              if (err && err.name !== 'AbortError') bukaWALink(noWA);
            });
        } else {
          // Browser tidak support Web Share API -- buka wa.me langsung
          bukaWALink(noWA);
        }

        function bukaWALink(no){
          if (!no) {
            no = prompt('Masukkan no. WA orang tua (contoh: 081234567890):','');

          window.open('https://wa.me/'+noBersih+'?text='+encodeURIComponent(pesan),'_blank');
        }
      };
    });

  function renderSppSantri(containerId){
    var c = document.getElementById(containerId || STATE._contentId || 'db-content');
    if (!c) { console.error('renderSppSantri: container tidak ditemukan:', containerId); return; }
    c.innerHTML = '<p>Memuat data SPP...</p>';
    // Cek apakah ini dashboard Bendahara (tampilkan tab tambahan)
    var userRoles = STATE.user.roles || [STATE.user.level];
    var isBendahara = STATE.user && (
      userRoles.indexOf('Bendahara') !== -1 ||
      userRoles.indexOf('Admin') !== -1 ||
      userRoles.indexOf('Mudir') !== -1
    );

    Promise.all([api('getSppList', {}), api('getSantriUntukTransaksiKantin', {}), api('getTunggakanSantri',{})]).then(function(hasil){
      var res = hasil[0], resSantri = hasil[1], resTg = hasil[2];
      if(!res.ok){ c.innerHTML = errBox(res.error); return; }
      var data = res.data;
      var daftarSantri = resSantri.ok ? resSantri.data : [];
      var tunggakan = resTg.ok ? resTg.data : [];

      var totalSantri = data.length, totalDue = 0, totalPaid = 0, totalTunggakanRp = 0;
      data.forEach(function(s){
        if (s.bebas) return; // santri dibebaskan tidak dihitung sebagai wajib bayar
        var due = bulanJatuhTempoSppFE(s.tahunMasuk);
        for (var m=1; m<=due; m++){ totalDue++; if (s.months[m-1]) totalPaid++; else totalTunggakanRp += s.biaya; }
      });
      var pct = totalDue>0 ? Math.round((totalPaid/totalDue)*100) : 0;

      // Tab navigasi SPP -- dideklarasikan sebelum binding
      var sppTabAktif = 'ringkasan';
      function renderSppTab(tab){
        sppTabAktif = tab;
        ['ringkasan','tunggakan','tabel','import','biaya'].forEach(function(t){
          var el = document.getElementById('sppTab_'+t);
          if(el) el.style.cssText = t===tab
            ? 'background:#0d9488;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap'
            : 'background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;white-space:nowrap';
        });
        ['ringkasan','tunggakan','tabel','import','biaya'].forEach(function(s){
          var el = document.getElementById('sppSeksi_'+s);
          if(el) el.style.display = s===tab ? '' : 'none';
        });
      }

      var html = '<div class="card" style="padding:12px">' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">' +
        '<button id="sppTab_ringkasan">&#128200; Ringkasan</button>' +

        '<button id="sppTab_tabel">&#128204; Tabel 36 Bulan</button>' +
        (isBendahara ? '<button id="sppTab_import">&#128196; Import Data</button>' : '') +
        (isBendahara ? '<button id="sppTab_biaya">&#9881;&#65039; Atur Biaya</button>' : '') +
        '</div></div>' +

        '<div id="sppSeksi_ringkasan"><div class="card"><h3>SPP Santri</h3>' +
        warnBox('Klik sel bulan pada tabel untuk menandai LUNAS / batalkan. WA konfirmasi otomatis terkirim ke wali santri.') +
        '<div class="ringkasan-grid" style="margin-top:10px">' +
        '<div class="ringkasan-tile warna-hijau"><div class="ico">&#128101;</div><div class="nilai">'+totalSantri+'</div><div class="label">Terdaftar SPP</div></div>' +
        '<div class="ringkasan-tile '+(pct>=80?'warna-hijau':'warna-amber')+'"><div class="ico">&#9989;</div><div class="nilai">'+pct+'%</div><div class="label">Lunas Bulan Berjalan</div></div>' +
        '<div class="ringkasan-tile warna-merah"><div class="ico">&#9888;&#65039;</div><div class="nilai">'+tunggakan.length+'</div><div class="label">Santri Menunggak</div></div>' +
        '<div class="ringkasan-tile warna-merah"><div class="ico">&#128179;</div><div class="nilai">'+rupiah(totalTunggakanRp)+'</div><div class="label">Total Tunggakan</div></div>' +
        '</div></div>';

      // Panel tunggakan dengan kirim WA (khusus Bendahara/Admin/Mudir)

              else{ row.push(''); tunggak++; }
            }
            row.push(lunas*s.biaya, tunggak*s.biaya, tunggak);
            rows.push(row);
          });
          var csv=bom+rows.map(function(r){
            return r.map(function(v){
              var s=String(v==null?'':v);
              if(s.includes(','))s='"'+s.replace(/"/g,'""')+'"';
              return s;
            }).join(',');
          }).join('\n');
          var a=document.createElement('a');
          a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
          a.download='SPP_'+todayStr()+'.csv';
          a.click();
          URL.revokeObjectURL(a.href);
        };
      }
    });
  }

  // ---------------- TARIK SALDO PEMILIK BARANG MANUAL (Bendahara/Admin/Mudir) ----------------
  // Untuk kasus pemilik menerima uangnya langsung/tunai tanpa lewat alur pengajuan.
  // Dicatat di sini supaya saldo di sistem tetap cocok dengan uang fisik yang sudah
  // diserahkan, dan jejaknya tetap masuk Riwayat Saldo Pemilik untuk audit.
  function tarikSaldoPemilikManual(){
    var c = getContentEl();
    c.innerHTML = '<p>Memuat data saldo pemilik...</p>';
    api('getDaftarSaldoPemilik', {}).then(function(res){
      if (!res.ok){ c.innerHTML = errBox(res.error); return; }
      var daftar = res.data || [];
      if (!daftar.length){
        c.innerHTML = '<div class="card"><h3>&#127974; Tarik Saldo Pemilik Barang</h3>' +
          warnBox('Belum ada data saldo pemilik barang. Saldo terbentuk otomatis setelah ada penjualan di kantin.') + '</div>';
        return;
      }
      var totalSemua = daftar.reduce(function(s,x){ return s + x.saldo; }, 0);

      c.innerHTML = '<div class="card"><h3>&#127974; Tarik Saldo Pemilik Barang (Manual)</h3>' +
        warnBox('Dipakai saat pemilik barang menerima uangnya langsung/tunai tanpa lewat pengajuan. Saldo akan dikurangi dan tercatat di Riwayat Saldo Pemilik. Pemilik otomatis dapat notifikasi WhatsApp bila nomornya terdaftar.') +
        '<label>Pilih Pemilik Barang</label><select id="tpPemilik"><option value="">-- pilih pemilik --</option>' +
        daftar.map(function(d,i){
          return '<option value="'+i+'">'+esc(d.pemilik)+' &mdash; Saldo: Rp'+d.saldo.toLocaleString('id-ID')+'</option>';
        }).join('') + '</select>' +
        '<div id="tpInfoSaldo" style="background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:9px 12px;font-size:13px;margin:8px 0;display:none"></div>' +
        fieldText('tpNominal','Nominal Penarikan (Rp)','') +
        '<label>Keterangan</label><select id="tpKet">' +
          '<option value="Diserahkan tunai">Diserahkan tunai</option>' +
          '<option value="Transfer bank">Transfer bank</option>' +
          '<option value="Potong kewajiban ke pondok">Potong kewajiban ke pondok</option>' +
          '<option value="__lain__">Tulis sendiri...</option>' +
        '</select>' +
        '<div id="tpWrapLain" style="display:none">'+fieldText('tpKetLain','Tulis Keterangan','')+'</div>' +
        '<button id="btnTarikPemilik" style="margin-top:10px">Catat Penarikan</button>' +
        '<div id="pesanTarikPemilik"></div></div>' +

        '<div class="card"><h4>Saldo Semua Pemilik</h4>' +
        '<p class="muted">Total saldo tertahan di sistem: <b style="color:#0d9488">Rp'+totalSemua.toLocaleString('id-ID')+'</b></p>' +
        '<div style="overflow-x:auto"><table><tr><th>Pemilik</th><th>No WA</th><th>Saldo</th></tr>' +
        daftar.map(function(d){
          return '<tr><td>'+esc(d.pemilik)+'</td><td>'+(d.noWa?esc(d.noWa):'<span class="muted">-</span>')+'</td>' +
            '<td><b>Rp'+d.saldo.toLocaleString('id-ID')+'</b></td></tr>';
        }).join('') + '</table></div></div>';

      // Tampilkan sisa saldo setelah penarikan, dan cegah lebih awal kalau kurang
      function perbaruiInfo(){
        var idx = document.getElementById('tpPemilik').value;
        var el = document.getElementById('tpInfoSaldo');
        if (idx === ''){ el.style.display='none'; return; }
        var d = daftar[Number(idx)];
        var nom = Number(String(document.getElementById('tpNominal').value).replace(/[^\d]/g,'')) || 0;
        var sisa = d.saldo - nom;
        el.style.display = 'block';
        el.innerHTML = 'Saldo <b>'+esc(d.pemilik)+'</b>: <b>Rp'+d.saldo.toLocaleString('id-ID')+'</b>' +
          (nom > 0
            ? '<br>Sisa setelah ditarik: <b style="color:'+(sisa<0?'#dc2626':'#0f766e')+'">Rp'+sisa.toLocaleString('id-ID')+'</b>' +
              (sisa < 0 ? ' <span style="color:#dc2626">(saldo tidak cukup)</span>' : '')
            : '') +
          (d.noWa ? '' : '<br><span class="muted" style="font-size:12px">No WA belum terdaftar &mdash; notifikasi tidak akan terkirim.</span>');
      }
      document.getElementById('tpPemilik').onchange = perbaruiInfo;
      document.getElementById('tpNominal').oninput = perbaruiInfo;
      document.getElementById('tpKet').onchange = function(){
        document.getElementById('tpWrapLain').style.display = (this.value === '__lain__') ? 'block' : 'none';
      };

      document.getElementById('btnTarikPemilik').onclick = function(){
        var elPesan = document.getElementById('pesanTarikPemilik');
        var idx = document.getElementById('tpPemilik').value;
        if (idx === ''){ elPesan.innerHTML = errBox('Pilih pemilik barang dulu.'); return; }
        var d = daftar[Number(idx)];
        var nominal = Number(String(document.getElementById('tpNominal').value).replace(/[^\d]/g,'')) || 0;
        if (nominal <= 0){ elPesan.innerHTML = errBox('Isi nominal yang valid.'); return; }
        // Dicegah di sini supaya petugas tahu sebelum menekan, bukan setelah bolak-balik ke server
        if (nominal > d.saldo){
          elPesan.innerHTML = errBox('Saldo '+d.pemilik+' hanya Rp'+d.saldo.toLocaleString('id-ID')+', tidak cukup untuk menarik Rp'+nominal.toLocaleString('id-ID')+'.');
          return;
        }
        var ket = document.getElementById('tpKet').value;
        if (ket === '__lain__'){
          ket = document.getElementById('tpKetLain').value.trim();
          if (!ket){ elPesan.innerHTML = errBox('Tulis keterangannya.'); return; }
        }
        if (!confirm('Catat penarikan saldo?\n\nPemilik: '+d.pemilik+'\nNominal: Rp'+nominal.toLocaleString('id-ID')+'\nSisa setelah ini: Rp'+(d.saldo-nominal).toLocaleString('id-ID')+'\nKeterangan: '+ket)) return;

        var btn = document.getElementById('btnTarikPemilik');
        loadingBtn(btn, 'Memproses...');
        api('tarikSaldoPemilikManual', {pemilik: d.pemilik, nominal: nominal, keterangan: ket, oleh: STATE.user.nama}).then(function(r){
          resetBtn(btn, 'Catat Penarikan');
          if (!r.ok){ elPesan.innerHTML = errBox(r.error); return; }
          elPesan.innerHTML = '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:8px;font-size:13px">' +
            '&#10004; Berhasil. Saldo <b>'+esc(r.pemilik)+'</b> berkurang Rp'+r.nominal.toLocaleString('id-ID')+'.<br>' +
            'Saldo sebelum: Rp'+r.saldoSebelum.toLocaleString('id-ID')+' &rarr; sekarang: <b>Rp'+r.saldoSekarang.toLocaleString('id-ID')+'</b>' +
            (r.waKirim ? '<br><span style="font-size:11.5px;opacity:.85">&#10004; Notifikasi WA terkirim ke pemilik</span>' : '') +
            '</div>';
          // Muat ulang supaya daftar saldo menampilkan angka terbaru -- mencegah
          // penarikan kedua memakai saldo lama yang sudah tidak berlaku
          setTimeout(tarikSaldoPemilikManual, 1800);
        }).catch(function(){
          resetBtn(btn, 'Catat Penarikan');
          elPesan.innerHTML = errBox('Gagal memproses. Coba lagi.');
        });
      };
    }).catch(function(){
      c.innerHTML = errBox('Gagal memuat data. Periksa koneksi lalu coba lagi.');
    });
  }

        var s2 = pilihTs.nilai();
        var nom = Number(String(document.getElementById('tsNominal').value).replace(/[^\d]/g,''))||0;

        if(!s2 || nom<=0){ el.innerHTML=''; return; }

          (sisa<0?' <span style="color:#dc2626">(saldo tidak cukup)</span>':'');
      }
      document.getElementById('tsNominal').oninput = perbaruiSisa;
      // Dipasang lewat JS, bukan atribut onchange di HTML -- handler global lewat
      // atribut mudah patah kalau halaman dirender ulang.
      document.getElementById('tsKetDropdown').onchange=function(){

        // permintaan bolak-balik ke server.
        if(nominal > found.saldo){
          document.getElementById('pesanTarik').innerHTML=errBox('Saldo '+found.nama+' hanya '+rupiah(found.saldo)+', tidak cukup untuk menarik '+rupiah(nominal)+'.');
          return;
        }
        var ketDropdown=document.getElementById('tsKetDropdown').value;
        var ket=ketDropdown==='Lainnya'?document.getElementById('tsKetTulis').value.trim():ketDropdown;
        if(!ket){document.getElementById('pesanTarik').innerHTML=errBox('Isi keterangan.');return;}
        if(!confirm('Tarik saldo '+found.nama+' sebesar '+rupiah(nominal)+'?\nKeterangan: '+ket)) return;
        var btn=document.getElementById('btnTarikSaldo');
        loadingBtn(btn,'Memproses...');
        api('tarikSaldoSantriBendahara',{nisn:found.nisn,nominal:nominal,keterangan:ket,oleh:STATE.user.nama})
          .then(function(r){
            resetBtn(btn,'Tarik Saldo');
            if(!r.ok){document.getElementById('pesanTarik').innerHTML=errBox(r.error);return;}
            document.getElementById('pesanTarik').innerHTML=
              '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:8px">'+
              '&#10004; Berhasil! Saldo <b>'+esc(r.nama)+'</b> berkurang '+rupiah(nominal)+'.<br>'+
              'Saldo sebelum: '+rupiah(r.saldoSebelum)+' &rarr; Saldo sekarang: <b>'+rupiah(r.saldoSekarang)+'</b>'+
              '</div>';
            // Segarkan saldo di daftar supaya penarikan berikutnya memakai angka
            // terbaru -- sebelumnya daftar tetap memakai saldo lama sampai halaman
            // dibuka ulang, sehingga pemeriksaan "cukup/tidak" bisa keliru.
            found.saldo = r.saldoSekarang;
            pilihTs.pilih(found.nisn);
            document.getElementById('tsNominal').value='';
            perbaruiSisa();
          }).catch(function(){
            resetBtn(btn,'Tarik Saldo');
            document.getElementById('pesanTarik').innerHTML=errBox('Gagal memproses. Coba lagi.');
          });
      };
    });

      warnBox('Menampilkan semua transaksi penambahan dan penarikan saldo, dari semua santri.') +

      '<div><label class="muted">Dari Tanggal</label><input type="date" id="bmsDari"></div>' +
      '<div><label class="muted">Sampai Tanggal</label><input type="date" id="bmsSampai"></div></div>' +

      '<input id="bmsNama" placeholder="Nama santri..." style="width:100%"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +

      '<button class="secondary" id="btnExportBMS">📄 Export Excel</button></div>' +
      '<div id="bmsTable">Silakan klik Cari untuk menampilkan data.</div></div>';

    var lastData = [];

    function muat(){
      document.getElementById('bmsTable').innerHTML = 'Memuat...';
      var tglMulai = document.getElementById('bmsDari').value;
      var tglAkhir = document.getElementById('bmsSampai').value;
      var namaFilter = document.getElementById('bmsNama').value.trim().toLowerCase();

      // Ambil dari TransaksiKantin langsung via getAllTransaksiSantri dengan filter kategori
      api('getRiwayatMutasiSaldoAdmin', {tglMulai:tglMulai, tglAkhir:tglAkhir}).then(function(res){
        if (!document.getElementById('bmsTable')) return;
        if (!res.ok){ document.getElementById('bmsTable').innerHTML = errBox(res.error); return; }
        var data = res.data;
        if (namaFilter) data = data.filter(function(r){ return r.namaSantri.toLowerCase().indexOf(namaFilter) !== -1 || r.nisn.indexOf(namaFilter) !== -1; });
        lastData = data;
        if (!data.length){ document.getElementById('bmsTable').innerHTML = '<p class="muted">Tidak ada data pada filter ini.</p>'; return; }

        var totalTambah = data.filter(function(r){return r.kategori==='Top Up Saldo';}).reduce(function(a,r){return a+r.nominal;},0);
        var totalTarik  = data.filter(function(r){return r.kategori==='Penarikan';}).reduce(function(a,r){return a+r.nominal;},0);

        var html = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
          '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 14px;font-size:13px;flex:1">💰 Total Tambah: <b style="color:#16a34a">+'+rupiah(totalTambah)+'</b></div>' +

          '</div>' +
          '<div style="overflow-x:auto"><table style="font-size:12px">' +
          '<tr><th>Tanggal</th><th>Santri</th><th>Jenis</th><th>Keterangan</th><th>Dicatat Oleh</th>' +
          '<th style="text-align:right">Nominal</th><th style="text-align:right">Saldo Sebelum</th>' +
          '<th style="text-align:right;background:#f0fdf4">Sisa Saldo</th></tr>';
        data.forEach(function(r){
          var isTopUp = r.kategori==='Top Up Saldo';
          var warna = isTopUp ? '#16a34a' : '#dc2626';
          var prefix = isTopUp ? '+' : '-';
          var ikon = isTopUp ? '💰' : '🏧';
          html += '<tr>' +
            '<td style="white-space:nowrap">'+esc(r.tanggal)+'<br><span class="muted" style="font-size:10px">'+fmtWaktu(r.waktu)+'</span></td>' +
            '<td><b>'+esc(r.namaSantri)+'</b><br><span class="muted" style="font-size:10px">'+esc(r.nisn)+'</span></td>' +
            '<td style="color:'+warna+';font-weight:600;white-space:nowrap">'+ikon+' '+(isTopUp?'Tambah':'Tarik')+'</td>' +
            '<td style="font-size:11px;color:#475569">'+esc(r.keterangan||'-')+'</td>' +
            '<td style="font-size:11px;color:#94a3b8">'+esc(r.dicatatOleh||'-')+'</td>' +
            '<td style="color:'+warna+';font-weight:700;text-align:right;white-space:nowrap">'+prefix+rupiah(r.nominal)+'</td>' +
            '<td style="text-align:right;color:#64748b;white-space:nowrap">'+rupiah(r.saldoSebelum)+'</td>' +
            '<td style="text-align:right;font-weight:800;color:#0f766e;background:#f0fdf4;white-space:nowrap">'+rupiah(r.saldoSekarang)+'</td>' +
            '</tr>';
        });
        html += '</table></div>';
        document.getElementById('bmsTable').innerHTML = html;
      });
    }

    document.getElementById('btnCariBMS').onclick = muat;
    document.getElementById('btnExportBMS').onclick = function(){
      if (!lastData.length){ alert('Tidak ada data.'); return; }
      var bom = '\uFEFF';
      var header = ['Tanggal','Waktu','NISN','Nama Santri','Jenis','Keterangan','Dicatat Oleh','Nominal','Saldo Sebelum','Sisa Saldo'];
      var rows = lastData.map(function(r){
        return [r.tanggal, r.waktu, r.nisn, r.namaSantri,
                r.kategori==='Top Up Saldo'?'Tambah Saldo':'Tarik Saldo',
                r.keterangan||'', r.dicatatOleh||'', r.nominal, r.saldoSebelum, r.saldoSekarang];
      });
      var csv = bom+[header].concat(rows).map(function(r){
        return r.map(function(v){var s=String(v||'');return s.includes(',')?'"'+s+'"':s;}).join(',');
      }).join('\n');
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
      a.download='RiwayatMutasiSaldo_'+todayStr()+'.csv'; a.click();
    };
  }

      if (!res.ok){ c.innerHTML = errBox(res.error); return; }
      var daftar = res.data;
      c.innerHTML = '<div class="card"><h3>&#128176; Tambah Saldo Santri</h3>' +
        warnBox('Bendahara dapat langsung menambah saldo santri tanpa menunggu pengajuan orang tua. Notifikasi otomatis terkirim ke orang tua setelah saldo ditambahkan.') +
        // Pemilih santri yang sama dengan kasir: daftar langsung terlihat, bisa
        // dicari, bisa dipindai QR. Datalist sebelumnya sering tidak memunculkan
        // saran di HP sehingga santri terasa "tidak bisa dipilih".
        fieldPilihSantri('tsaNama','Pilih Santri', daftar, {tampilSaldo:true}) +
        fieldText('tsaNominal','Nominal Tambah Saldo (Rp)', '') +
        '<div id="tsaSesudah" style="margin:-4px 0 10px;font-size:13px"></div>' +
        '<label>Keterangan</label>' +
        '<select id="tsaKetDropdown">' +
        '<option value="Top-Up Saldo Kantin">Top-Up Saldo Kantin</option>' +
        '<option value="Kiriman Orang Tua">Kiriman Orang Tua</option>' +
        '<option value="Beasiswa / Bantuan Pondok">Beasiswa / Bantuan Pondok</option>' +
        '<option value="Koreksi Saldo">Koreksi Saldo</option>' +
        '<option value="Lainnya">Tulis Sendiri...</option>' +
        '</select>' +
        '<input id="tsaKetTulis" placeholder="Tulis keterangan..." style="display:none;margin-top:6px">' +
        '<button id="btnTambahSaldaBend" style="margin-top:12px">&#128176; Tambah Saldo</button>' +
        '<div id="pesanTambahSaldo"></div></div>';

      var pilihTsa = ikatPilihSantri(document, 'tsaNama', daftar, {
        tampilSaldo:true, onPilih: perbaruiSesudah
      });

      function perbaruiSesudah(){
        var s2 = pilihTsa.nilai();
        var nom = Number(String(document.getElementById('tsaNominal').value).replace(/[^\d]/g,''))||0;
        var el = document.getElementById('tsaSesudah');
        if(!s2 || nom<=0){ el.innerHTML=''; return; }
        el.innerHTML = 'Saldo setelah ditambah: <b style="color:#0f766e">'+rupiah(s2.saldo + nom)+'</b>';
      }
      document.getElementById('tsaNominal').oninput = perbaruiSesudah;
      document.getElementById('tsaKetDropdown').onchange = function(){
        document.getElementById('tsaKetTulis').style.display = this.value === 'Lainnya' ? 'block' : 'none';
      };

      document.getElementById('btnTambahSaldaBend').onclick = function(){
        var found = pilihTsa.nilai();
        if (!found){ document.getElementById('pesanTambahSaldo').innerHTML = errBox('Pilih santri dulu dari daftar, atau pindai kartu QR-nya.'); return; }
        var nominal = Number(String(document.getElementById('tsaNominal').value).replace(/[^\d]/g,''))||0;
        if (nominal <= 0){ document.getElementById('pesanTambahSaldo').innerHTML = errBox('Isi nominal yang valid.'); return; }
        var ketDropdown = document.getElementById('tsaKetDropdown').value;
        var ket = ketDropdown === 'Lainnya' ? (document.getElementById('tsaKetTulis').value.trim() || 'Top-Up Manual') : ketDropdown;
        if (!confirm('Tambah saldo '+found.nama+' sebesar '+rupiah(nominal)+'?\nKeterangan: '+ket)) return;
        var btn = document.getElementById('btnTambahSaldaBend');
        loadingBtn(btn, 'Menyimpan...');
        api('tambahSaldoSantriManual', {nisn: found.nisn, nominal: nominal, keterangan: ket, oleh: STATE.user.nama}).then(function(r){
          resetBtn(btn, '&#128176; Tambah Saldo');
          if (!r.ok){ document.getElementById('pesanTambahSaldo').innerHTML = errBox(r.error); return; }
          document.getElementById('pesanTambahSaldo').innerHTML =
            '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;font-size:13px;color:#16a34a">' +
            '&#10003; Saldo <b>'+esc(r.nama)+'</b> berhasil ditambah <b>'+rupiah(nominal)+'</b>.<br>' +
            'Saldo sebelum: '+rupiah(r.saldoSebelum)+' &nbsp;&rarr;&nbsp; Saldo baru: <b>'+rupiah(r.saldoBaru)+'</b>' +
            (r.waKirim ? '<br><span style="font-size:11px;opacity:.8">&#10003; Notifikasi WA terkirim ke orang tua</span>' : '') +
            '</div>';
          // Segarkan saldo di daftar supaya penambahan berikutnya memakai angka terbaru
          found.saldo = r.saldoBaru;
          pilihTsa.pilih(found.nisn);
          document.getElementById('tsaNominal').value = '';
          perbaruiSesudah();
        }).catch(function(){
          resetBtn(btn, '&#128176; Tambah Saldo');
          document.getElementById('pesanTambahSaldo').innerHTML = errBox('Gagal menyimpan. Coba lagi.');
        });
      };
    });
  }

        '<div class="grid2">' +
        '<div><label>Jenis</label><select id="trJenis" onchange="updateKatOptions()"><option value="Pemasukan">Pemasukan</option><option value="Pengeluaran">Pengeluaran</option></select></div>' +

        fieldText('trNominal','Nominal (Rp)','') +
        '</div>' +
        fieldText('trUraian','Uraian / Keterangan','') +
        '<div class="grid2">' +
        fieldText('trKelas','Kelas Santri (opsional, untuk SPP/DSP)','') +
        fieldText('trDicatatOleh','Dicatat Oleh', STATE.user.nama) +
        '</div>' +
        '<button id="btnSimpanTransaksi">Simpan Transaksi</button><div id="pesanTransaksi"></div></div>' +

        '<div style="display:flex;gap:6px;margin-bottom:10px">' +
        '<select id="trFilterBulan">'+BULAN_INDO_B.map(function(b,i){return '<option value="'+(i+1)+'" '+(i+1===bt.bulan?'selected':'')+'>'+b+'</option>';}).join('')+'</select>' +
        '<select id="trFilterTahun">'+[bt.tahun-1,bt.tahun].map(function(t){return '<option value="'+t+'" '+(t===bt.tahun?'selected':'')+'>'+t+'</option>';}).join('')+'</select>' +

        document.getElementById('trKategori').innerHTML='<option value="">-- pilih --</option>'+
          list.map(function(k){return '<option value="'+esc(k.nama)+'">'+esc(k.nama)+'</option>';}).join('');

      function muatListTransaksi(){
        var bulan=document.getElementById('trFilterBulan').value;
        var tahun=document.getElementById('trFilterTahun').value;
        document.getElementById('listTransaksi').innerHTML='<p>Memuat...</p>';
        api('getKasUmumList',{bulan:bulan,tahun:tahun}).then(function(r){
          if(!r.ok){document.getElementById('listTransaksi').innerHTML=errBox(r.error);return;}
          if(!r.data.length){document.getElementById('listTransaksi').innerHTML='<p class="muted">Belum ada transaksi pada periode ini.</p>';return;}
          var totalMasuk=0,totalKeluar=0;
          r.data.forEach(function(t){ if(t.jenis==='Pemasukan')totalMasuk+=t.nominal; else totalKeluar+=t.nominal; });
          document.getElementById('listTransaksi').innerHTML='<div style="display:flex;gap:10px;margin-bottom:8px;font-size:13px">' +
            '<span style="color:#16a34a;font-weight:600">&#11014; '+rupiah(totalMasuk)+'</span>' +
            '<span style="color:#dc2626;font-weight:600">&#11015; '+rupiah(totalKeluar)+'</span>' +
            '<span style="font-weight:600">Saldo: '+rupiah(totalMasuk-totalKeluar)+'</span></div>' +
            '<table><tr><th>Tgl</th><th>Jenis</th><th>Kategori</th><th>Uraian</th><th>Nominal</th><th>No. Ref</th><th>Aksi</th></tr>' +
            r.data.map(function(t){
              return '<tr><td>'+esc(t.tanggal)+'</td>' +
                '<td><span style="color:'+(t.jenis==='Pemasukan'?'#16a34a':'#dc2626')+';font-weight:600">'+esc(t.jenis)+'</span></td>' +
                '<td>'+esc(t.kategori)+'</td><td>'+esc(t.uraian)+'</td>' +
                '<td style="font-weight:600">'+rupiah(t.nominal)+'</td>' +
                '<td class="muted" style="font-size:11px">'+esc(t.noRef)+'</td>' +
                '<td><button class="small danger btnHapusTr" data-row="'+t.rowIndex+'">Hapus</button>' +
                ' <button class="small btnKwitansi" data-noref="'+esc(t.noRef)+'" data-row="'+t.rowIndex+'">Kwitansi</button></td></tr>';
            }).join('')+'</table>';
          document.querySelectorAll('.btnHapusTr').forEach(function(btn){
            btn.onclick=function(){ if(!confirm('Hapus transaksi ini?'))return; api('hapusTransaksiKas',{rowIndex:btn.dataset.row}).then(function(r){ if(r.ok)muatListTransaksi(); else alert(r.error); }); };
          });
          document.querySelectorAll('.btnKwitansi').forEach(function(btn){
            var tr=r.data.find(function(t){return t.rowIndex===Number(btn.dataset.row);});
            btn.onclick=function(){ if(tr) cetakKwitansi(tr); };
          });
        });
      }
      muatListTransaksi();
      document.getElementById('btnFilterTransaksi').onclick=muatListTransaksi;

      document.getElementById('btnSimpanTransaksi').onclick=function(){
        var nominal=document.getElementById('trNominal').value.trim();
        var uraian=document.getElementById('trUraian').value.trim();
        var kat=document.getElementById('trKategori').value;
        if(!nominal||!uraian||!kat){document.getElementById('pesanTransaksi').innerHTML=errBox('Isi semua field wajib.');return;}
        var btn=document.getElementById('btnSimpanTransaksi'); btn.disabled=true; btn.textContent='Menyimpan...';
        api('tambahTransaksiKas',{
          tanggal:document.getElementById('trTanggal').value,
          jenis:document.getElementById('trJenis').value,
