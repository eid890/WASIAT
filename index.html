<style>

  /* ---- tabel: digeser ke samping, TIDAK ADA teks bertumpuk/wrap ---- */

  #absensi-app .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand{display:flex;align-items:center;gap:10px}

  #absensi-app .err{background:#fef2f2;border:1px solid #fca5a5;padding:10px;border-radius:8px;color:#b91c1c;font-size:13px}

  #absensi-app .overlay{position:fixed;inset:0;background:rgba(15,42,40,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
  #absensi-app .modal{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}

  #absensi-app .santriRowAbsen{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .santriRowHafalan{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .juzchip{display:inline-block;background:var(--tema);color:#fff;border-radius:20px;padding:4px 10px;margin:2px;font-size:12px}
  #absensi-app .juzchip.proses{background:#f59e0b}

  /* ---- slide pengumuman (ringan, tanpa library luar) ---- */
  #absensi-app .slidebar{position:relative;width:100%;aspect-ratio:16/6;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#e2e8f0;box-shadow:0 2px 10px rgba(15,118,110,.12)}
  #absensi-app .slidebar-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;}
  #absensi-app .slidebar-slide.active{opacity:1;z-index:1}
  #absensi-app .slidebar-slide img{width:100%;height:100%;object-fit:cover;display:block}
  #absensi-app .slidebar-caption{position:absolute;left:0;right:0;bottom:0;padding:10px 46px 10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;font-weight:600}
  #absensi-app .slidebar-dots{position:absolute;bottom:9px;right:10px;display:flex;gap:5px;z-index:2}
  #absensi-app .slidebar-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
  #absensi-app .slidebar-dot.active{background:#fff}
  #absensi-app .slidebar-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;margin:0;padding:0}
  #absensi-app .slidebar-arrow:hover{background:rgba(0,0,0,.55)}
  #absensi-app .slidebar-arrow.prev{left:8px}
  #absensi-app .slidebar-arrow.next{right:8px}
  @media (max-width:560px){ #absensi-app .slidebar{aspect-ratio:16/9} }
</style>

<script>
(function(){
  // >>>>>>>>>>>>>> WAJIB DIISI SETELAH DEPLOY APPS SCRIPT <<<<<<<<<<<<<<
  var WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx3DiCwWU3Q7zoisVi0AaHgM9rvicPKyVYMfovCeH-ge1iYcMiVakuHlrGaSEarZxL_/exec";
  // ======================================================================

  var WAKTU_HALAQOH = ['Subuh','Duha','Ashar','Maghrib','Isya'];
  var HARI_LIST = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu'];
  function hariDariTanggal(tglStr){
    if (!tglStr) return '';
    var parts = tglStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    return HARI_LIST[d.getDay()];
  }
  var JENIS_HAFALAN_ALL = ['Sabaq','Sabqi','Manzil','Murojaah','Tahsin','Tidak Setor','Izin','Sakit','Ghaib'];
  var JENIS_HAFALAN_SETOR = ['Sabaq','Sabqi','Manzil','Murojaah','Tahsin'];
  var DAFTAR_SURAH = ["Al-Fatihah","Al-Baqarah","Ali 'Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Taubah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Taha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Asy-Syu'ara","An-Naml","Al-Qasas","Al-'Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Yasin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Asy-Syura","Az-Zukhruf","Ad-Dukhan","Al-Jasiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Az-Zariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadalah","Al-Hasyr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Tagabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddassir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Insyiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Gasyiyah","Al-Fajr","Al-Balad","Asy-Syams","Al-Lail","Ad-Duha","Asy-Syarh","At-Tin","Al-'Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-'Adiyat","Al-Qari'ah","At-Takasur","Al-'Asr","Al-Humazah","Al-Fil","Quraisy","Al-Ma'un","Al-Kausar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];

  var root = document.getElementById('absensi-app');
  var STATE = { user: null, pengaturan: {NamaPesantren:'Pondok Pesantren', LogoURL:'', WarnaTema:'#0d9488'} };

  // ---------------- MODE OFFLINE: antrian & auto-sinkron ----------------
  // Aksi "menyimpan data" boleh diantre saat offline dan otomatis dikirim ulang
  // begitu koneksi kembali. Aksi "membaca data" (getX) TIDAK diantre -- kalau
  // offline, cukup tampilkan pesan gagal seperti biasa (data tidak mungkin dibaca
  // tanpa jaringan sama sekali, jadi tidak ada gunanya diantre).
  var AKSI_BISA_OFFLINE = ['submitAbsensi','submitHafalan','submitNilai'];
  var OUTBOX_KEY = 'wasiatOutboxV1';
  function getOutbox(){ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch(e){ return []; } }
  function setOutbox(arr){ localStorage.setItem(OUTBOX_KEY, JSON.stringify(arr)); perbaruiLencanaOutbox(); }
  function perbaruiLencanaOutbox(){
    var n = getOutbox().length;
    var el = document.getElementById('outboxBadge');
    if (el) el.style.display = n > 0 ? 'flex' : 'none';
    var elN = document.getElementById('outboxCount');
    if (elN) elN.textContent = n;
  }

  function apiJaringan(action, payload){
    if (!WEBAPP_URL || WEBAPP_URL.indexOf('PASTE_URL_WEBAPP') === 0) {
      return Promise.resolve({ok:false, error:'URL Web App belum diisi. Buka index.html dan isi WEBAPP_URL.'});
    }
    return fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify({action:action, payload:payload||{}}) })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(txt){ try { return JSON.parse(txt); } catch(e){ throw new Error('Respon server tidak valid'); } })
      .catch(function(err){ return {ok:false, error: 'Gagal terhubung ke server: ' + err.message, _jaringanGagal:true}; });
  }

  function api(action, payload){
    var bisaDiantre = AKSI_BISA_OFFLINE.indexOf(action) !== -1;
    if (bisaDiantre && !navigator.onLine) {
      var outbox = getOutbox();
      outbox.push({action:action, payload:payload, waktu:new Date().toISOString()});
      setOutbox(outbox);
      return Promise.resolve({ok:true, offline:true, ditambah:(payload && payload.items ? payload.items.length : 0), diupdate:0,
        pesanOffline:'Sedang offline -- data disimpan di perangkat ini dan akan otomatis terkirim begitu internet tersambung lagi.'});
    }
    return apiJaringan(action, payload).then(function(res){
      if (bisaDiantre && !res.ok && res._jaringanGagal) {
        var outbox2 = getOutbox();
        outbox2.push({action:action, payload:payload, waktu:new Date().toISOString()});
        setOutbox(outbox2);
        return {ok:true, offline:true, ditambah:(payload && payload.items ? payload.items.length : 0), diupdate:0,
          pesanOffline:'Sedang offline -- data disimpan di perangkat ini dan akan otomatis terkirim begitu internet tersambung lagi.'};
      }
      return res;
    });
  }

  // Kirim ulang semua data yang tertunda, satu-satu berurutan, berhenti kalau ada
  // yang masih gagal (dicoba lagi nanti saat online lagi / dipicu manual).
  var SEDANG_SINKRON = false;
  function sinkronkanOutbox(){
    if (SEDANG_SINKRON) return;
    var sisa = getOutbox();
    if (!sisa.length) return;
    SEDANG_SINKRON = true;
    function prosesSatu(){
      if (!sisa.length) { setOutbox(sisa); SEDANG_SINKRON = false; return; }
      var item = sisa[0];
      apiJaringan(item.action, item.payload).then(function(res){
        if (res.ok) { sisa.shift(); setOutbox(sisa); prosesSatu(); }
        else { setOutbox(sisa); SEDANG_SINKRON = false; }
      }).catch(function(){ setOutbox(sisa); SEDANG_SINKRON = false; });
    }
    prosesSatu();
  }
  window.addEventListener('online', sinkronkanOutbox);
  window.addEventListener('load', function(){ perbaruiLencanaOutbox(); if (navigator.onLine) sinkronkanOutbox(); });

  function render(html){ root.innerHTML = html; }
  function setHtmlSafe(id, html){ var el = document.getElementById(id); if (el) el.innerHTML = html; return !!el; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function errBox(msg){ return '<div class="err">⚠️ ' + esc(msg) + '</div>'; }
  function warnBox(msg){ return '<div class="warn">ℹ️ ' + esc(msg) + '</div>'; }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  function openModal(title, fieldsHtml, onSubmit){
    var wrap = document.createElement('div');
    wrap.className = 'overlay';
    wrap.innerHTML = '<div class="modal"><h3>'+esc(title)+'</h3><div id="modalBody">'+fieldsHtml+'</div>' +
      '<button id="modalSimpan">Simpan</button><button class="secondary" id="modalBatal">Batal</button></div>';
    root.appendChild(wrap);
    wrap.querySelector('#modalBatal').onclick = function(){ root.removeChild(wrap); };
    wrap.querySelector('#modalSimpan').onclick = function(){ var ok = onSubmit(wrap); if (ok !== false) root.removeChild(wrap); };
    return wrap;
  }
  function fieldText(id, label, value){ return '<label>'+esc(label)+'</label><input id="'+id+'" value="'+esc(value||'')+'">'; }
  function fieldSelect(id, label, options, value){
    return '<label>'+esc(label)+'</label><select id="'+id+'">' +
      options.map(function(o){ return '<option value="'+esc(o)+'" '+(o===value?'selected':'')+'>'+esc(o)+'</option>'; }).join('') + '</select>';
  }
  // Input search-autocomplete (datalist) generik, dipakai untuk semua pemilihan nama
  // Santri/Guru/Mapel supaya konsisten dan datanya selalu diambil dari database aktif.
  function fieldAutocomplete(id, label, options, value, placeholder){
    var listId = id + '_dl';
    var dl = '<datalist id="'+listId+'">' + options.map(function(o){ return '<option value="'+esc(o)+'">'; }).join('') + '</datalist>';
    return '<label>'+esc(label)+'</label><input id="'+id+'" list="'+listId+'" autocomplete="off" placeholder="'+esc(placeholder||'Ketik untuk mencari...')+'" value="'+esc(value||'')+'">' + dl;
  }
  // Cocokkan input santri (format tampilan "NISN - Nama") kembali ke NISN yang valid.
  // Menerima juga jika user hanya mengetik NISN saja atau nama persis.
  function resolveSantriNisn(raw, santriList){
    raw = String(raw||'').trim();
    if (!raw) return null;
    var m = santriList.find(function(s){ return (s.nisn+' - '+s.nama) === raw; });
    if (m) return m.nisn;
    m = santriList.find(function(s){ return s.nisn === raw; });
    if (m) return m.nisn;
    m = santriList.find(function(s){ return s.nama.toLowerCase() === raw.toLowerCase(); });
    return m ? m.nisn : null;
  }
  function labelSantri(s){ return s.nisn + ' - ' + s.nama; }
  // Ayat maupun Halaman disimpan sebagai teks rentang "dari - sampai" (contoh: "2 - 21").
  // Fungsi generik ini memecah nilai lama (baik format rentang maupun angka tunggal)
  // jadi {awal, akhir} supaya form Isi Hafalan bisa menampilkan kembali sebagai dua kolom.
  function parseRange(raw){
    raw = String(raw==null?'':raw).trim();
    if (!raw) return {awal:'', akhir:''};
    var parts = raw.split('-').map(function(x){return x.trim();});
    if (parts.length >= 2 && parts[0] !== '' && parts[1] !== '') return {awal: parts[0], akhir: parts[1]};
    return {awal: parts[0], akhir: ''};
  }
  // Cocokkan nama guru persis dengan daftar Guru (strict) -- penting karena nama ini
  // dipakai untuk mencocokkan akun login guru di banyak fitur (jadwal, halaqoh, dll).
  function resolveGuruExact(raw, guruNames){
    raw = String(raw||'').trim();
    var m = guruNames.find(function(g){ return g === raw; });
    return m || null;
  }

  // Layout sidebar responsif dipakai Dashboard Guru & Admin/Mudir.
  // Desktop: sidebar tetap tampil di kiri. Mobile (<=860px): sidebar tersembunyi,
  // dibuka lewat tombol hamburger sebagai panel geser dengan overlay gelap.
  // ---------------- SLIDE PENGUMUMAN (ringan, tanpa library luar) ----------------
  // Satu timer global saja (dibersihkan tiap kali dipanggil ulang) supaya tidak ada
  // banyak interval menumpuk & memberatkan aplikasi saat pindah halaman/tab berkali-kali.
  var SLIDE_TIMER = null;
  function renderSlideBar(containerId){
    var container = document.getElementById(containerId);
    if (!container) return;
    if (SLIDE_TIMER) { clearInterval(SLIDE_TIMER); SLIDE_TIMER = null; }
    Promise.all([api('getSlideAktif', {level: STATE.user.level}), api('getPengaturan', {})]).then(function(hasil){
      if (!document.getElementById(containerId)) return; // user sudah pindah tampilan
      var resSlide = hasil[0], resP = hasil[1];
      if (!resSlide.ok || !resSlide.data.length) { container.innerHTML = ''; return; }
      var slides = resSlide.data;
      var jeda = (resP.ok && resP.data.SlideJedaDetik) ? Number(resP.data.SlideJedaDetik) : 5;
      if (!jeda || jeda < 2) jeda = 5;
      var idx = 0;

      var html = '<div class="slidebar" id="'+containerId+'_box">';
      slides.forEach(function(s, i){
        var inner = '<img src="'+esc(s.gambar)+'" alt="'+esc(s.judul)+'" loading="'+(i===0?'eager':'lazy')+'">' +
          (s.judul ? '<div class="slidebar-caption">'+esc(s.judul)+'</div>' : '');
        html += '<div class="slidebar-slide'+(i===0?' active':'')+'" data-i="'+i+'">' +
          (s.tautan ? ('<a href="'+esc(s.tautan)+'" target="_blank" rel="noopener" style="display:block;width:100%;height:100%">'+inner+'</a>') : inner) +
          '</div>';
      });
      if (slides.length > 1) {
        html += '<button class="slidebar-arrow prev" id="'+containerId+'_prev" aria-label="Sebelumnya">&#8249;</button>';
        html += '<button class="slidebar-arrow next" id="'+containerId+'_next" aria-label="Berikutnya">&#8250;</button>';
        html += '<div class="slidebar-dots">' + slides.map(function(_,i){return '<span class="slidebar-dot'+(i===0?' active':'')+'" data-i="'+i+'"></span>';}).join('') + '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
      if (slides.length <= 1) return;

      function tampilkan(i){
        idx = (i + slides.length) % slides.length;
        var box = document.getElementById(containerId+'_box');
        if (!box) return;
        box.querySelectorAll('.slidebar-slide').forEach(function(el){ el.classList.toggle('active', Number(el.dataset.i)===idx); });
        box.querySelectorAll('.slidebar-dot').forEach(function(el){ el.classList.toggle('active', Number(el.dataset.i)===idx); });
      }
      function resetTimer(){
        if (SLIDE_TIMER) clearInterval(SLIDE_TIMER);
        SLIDE_TIMER = setInterval(function(){ tampilkan(idx+1); }, jeda*1000);
      }
      document.getElementById(containerId+'_prev').onclick = function(){ tampilkan(idx-1); resetTimer(); };
      document.getElementById(containerId+'_next').onclick = function(){ tampilkan(idx+1); resetTimer(); };
      container.querySelectorAll('.slidebar-dot').forEach(function(dot){
        dot.onclick = function(){ tampilkan(Number(dot.dataset.i)); resetTimer(); };
      });
      resetTimer();
    });
  }

  // ---------------- KOMPONEN BERSAMA: grafik & panel rekap lengkap santri ----------------
  // Dipakai di dashboard Wali Santri, Admin/Mudir, dan Guru ("Santri Saya") supaya
  // konsisten -- tidak perlu tulis ulang logika yang sama 3 kali.

  // Grafik garis sederhana (SVG murni, tanpa library luar) menampilkan akumulasi
  // halaman hafalan baru dari waktu ke waktu.
  function buildLineChartSVG(data){
    if (!data || !data.length) return '<p class="muted">Belum ada data hafalan pada periode ini.</p>';
    var width = 640, height = 220, padding = 40;
    var maxY = Math.max.apply(null, data.map(function(d){return d.kumulatif;}));
    if (maxY <= 0) maxY = 1;
    var stepX = data.length > 1 ? (width - padding*2) / (data.length - 1) : 0;
    var points = data.map(function(d,i){
      var x = padding + i*stepX;
      var y = height - padding - (d.kumulatif / maxY) * (height - padding*2);
      return {x:x, y:y, d:d};
    });
    var pathD = points.map(function(p,i){ return (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var areaD = pathD + ' L' + points[points.length-1].x.toFixed(1) + ',' + (height-padding) + ' L' + points[0].x.toFixed(1) + ',' + (height-padding) + ' Z';
    var circles = points.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="#0d9488"><title>'+esc(p.d.tanggal)+': '+p.d.halamanHariItu+' halaman (total '+p.d.kumulatif+')</title></circle>'; }).join('');
    return '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;background:#fafafa;border-radius:8px">' +
      '<line x1="'+padding+'" y1="'+(height-padding)+'" x2="'+(width-padding)+'" y2="'+(height-padding)+'" stroke="#ccc"/>' +
      '<line x1="'+padding+'" y1="'+padding+'" x2="'+padding+'" y2="'+(height-padding)+'" stroke="#ccc"/>' +
      '<path d="'+areaD+'" fill="rgba(13,148,136,0.12)" stroke="none"/>' +
      '<path d="'+pathD+'" fill="none" stroke="#0d9488" stroke-width="2"/>' + circles +
      '<text x="'+padding+'" y="'+(height-8)+'" font-size="11" fill="#777">'+esc(data[0].tanggal)+'</text>' +
      '<text x="'+(width-padding-70)+'" y="'+(height-8)+'" font-size="11" fill="#777">'+esc(data[data.length-1].tanggal)+'</text>' +
      '<text x="'+padding+'" y="16" font-size="11" fill="#777">Total halaman baru pada periode ini: '+maxY+'</text>' +
      '</svg>';
  }

  // Panel: Kehadiran+Sikap, Progres Hafalan, Riwayat Hafalan (filter bulan), Grafik (filter semester/tahun ajaran)
  // Kecilkan & kompres gambar di browser (canvas) SEBELUM diunggah ke server, supaya
  // ukuran file kecil (cepat diunggah) dan slide tetap ringan dimuat semua pengguna.
  function resizeImageFile(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxWidth / img.width);
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        };
        img.onerror = function(){ reject(new Error('Gagal membaca gambar')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Gagal membaca file')); };
      reader.readAsDataURL(file);
    });
  }

      var datalistHtml = '<datalist id="daftarSurah">' + DAFTAR_SURAH.map(function(s){return '<option value="'+esc(s)+'">';}).join('') + '</datalist>';
      var opsiHalaman = Array.from({length:22},function(_,i){return i+1;});
      var opsiNilai = Array.from({length:10},function(_,i){return (i+1)*10;});
      var html = datalistHtml + '<h4>Halaqoh: '+esc(namaHalaqoh)+' (' + esc(waktu) + ')</h4>' +
        warnBox('Isian akan otomatis terisi mengikuti riwayat terakhir santri untuk jenis hafalan yang dipilih -- tinggal ubah bagian yang berbeda saja (misalnya Ayat).') +
        '<div id="formHafalan">';
      res.data.forEach(function(s){
        html += '<div class="santriRowHafalan" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'">' +
          '<b>'+esc(s.nama)+'</b> <span class="muted">('+esc(s.nisn)+')</span><br>' +
          '<p class="faded hintHafalan">Memuat riwayat...</p>' +
          '<label class="muted">Jenis Hafalan</label>' +
          '<select class="jenisSelect">' + JENIS_HAFALAN_ALL.map(function(j){return '<option value="'+j+'">'+j+'</option>';}).join('') + '</select>' +
          '<div class="detailHafalan">' +
          '<label class="muted">Nama Surah</label><input class="surahInput" list="daftarSurah">' +
          '<div class="grid2">' +
          '<div><label class="muted">Ayat (dari - sampai, contoh: 1 - 39)</label>' +
          '<div style="display:flex;align-items:center;gap:6px">' +
          '<input class="ayatAwalInput" type="number" min="1" placeholder="1" style="flex:1">' +
          '<span>-</span>' +
          '<input class="ayatAkhirInput" type="number" min="1" placeholder="39" style="flex:1">' +
          '</div></div>' +
          '<div><label class="muted">Juz</label><select class="juzSelect">' + Array.from({length:30},function(_,i){return i+1;}).map(function(j){return '<option value="'+j+'">'+j+'</option>';}).join('') + '</select></div>' +
          '</div>' +
          '<label class="muted">Halaman (dari - sampai, isi sama kalau cuma 1 halaman)</label>' +
          '<div style="display:flex;align-items:center;gap:6px">' +
          '<select class="halamanAwalSelect">' + opsiHalaman.map(function(h){return '<option value="'+h+'">'+h+'</option>';}).join('') + '</select>' +
          '<span>-</span>' +
          '<select class="halamanAkhirSelect">' + opsiHalaman.map(function(h){return '<option value="'+h+'">'+h+'</option>';}).join('') + '</select>' +
          '</div>' +
          '<label class="muted">Nilai Hafalan</label>' +
          '<select class="nilaiSelect"><option value="">-- Pilih Nilai --</option>' + opsiNilai.map(function(n){return '<option value="'+n+'">'+n+'</option>';}).join('') + '</select>' +
          '</div></div>';
      });
      html += '</div><button type="button" id="btnSimpanHafalan">Simpan Hafalan</button>' +
        '<button type="button" class="secondary" id="btnBatalHafalan">Batal</button><div id="pesanSimpanHafalan"></div>';
      wrap.innerHTML = html;

      function toggleDetail(row){
        var jenis = row.querySelector('.jenisSelect').value;
        row.querySelector('.detailHafalan').style.display = JENIS_HAFALAN_SETOR.indexOf(jenis) === -1 ? 'none' : 'block';
      }
      // Isi ulang seluruh field (surah/ayat/juz/halaman/nilai) sesuai riwayat TERAKHIR
      // untuk jenis hafalan yang sedang dipilih -- supaya pengampu tinggal mengubah
      // bagian yang berbeda saja (biasanya cuma Ayat/Halaman).
      function terapkanRiwayat(row, jenis){
        var santri = res.data.find(function(d){ return d.nisn === row.dataset.nisn; });
        var t = santri && santri.terakhirPerJenis ? santri.terakhirPerJenis[jenis] : null;
        var hintEl = row.querySelector('.hintHafalan');
        hintEl.textContent = t
          ? ('Terakhir ('+jenis+', '+t.tanggal+'): '+(t.surah||'-')+' ayat '+(t.ayat||'-')+', Juz '+(t.juz||'-')+', Hal. '+(t.halamanKe||'-')+(t.nilai!=null&&t.nilai!==''?(', Nilai '+t.nilai):''))
          : ('Belum ada riwayat "'+jenis+'" untuk santri ini.');
        if (JENIS_HAFALAN_SETOR.indexOf(jenis) === -1) return;
        var ayatRange = parseRange(t ? t.ayat : '');
        var halamanRange = parseRange(t ? t.halamanKe : '');
        row.querySelector('.surahInput').value = t ? (t.surah||'') : '';
        row.querySelector('.ayatAwalInput').value = ayatRange.awal;
        row.querySelector('.ayatAkhirInput').value = ayatRange.akhir;
        if (t && t.juz) row.querySelector('.juzSelect').value = String(t.juz);
        if (halamanRange.awal) row.querySelector('.halamanAwalSelect').value = halamanRange.awal;
        if (halamanRange.akhir) row.querySelector('.halamanAkhirSelect').value = halamanRange.akhir;
        row.querySelector('.nilaiSelect').value = (t && t.nilai!=null && t.nilai!=='') ? String(t.nilai) : '';
      }
      wrap.querySelectorAll('.santriRowHafalan').forEach(function(row){
        var jenisAwal = row.querySelector('.jenisSelect').value;
        toggleDetail(row);
        terapkanRiwayat(row, jenisAwal);
        row.querySelector('.jenisSelect').onchange = function(){
          toggleDetail(row);
          terapkanRiwayat(row, row.querySelector('.jenisSelect').value);
        };
      });

      document.getElementById('btnBatalHafalan').onclick = guruIsiHafalan;
      document.getElementById('btnSimpanHafalan').onclick = function(){
        var items = [];
        var adaError = false;
        document.querySelectorAll('#formHafalan > div').forEach(function(row){
          var jenis = row.querySelector('.jenisSelect').value;
          var it = {nisn: row.dataset.nisn, nama: row.dataset.nama, jenisHafalan: jenis};
          if (JENIS_HAFALAN_SETOR.indexOf(jenis) !== -1) {
            var ayatAwal = row.querySelector('.ayatAwalInput').value.trim();
            var ayatAkhir = row.querySelector('.ayatAkhirInput').value.trim();
            if (ayatAwal && ayatAkhir && Number(ayatAkhir) < Number(ayatAwal)) { adaError = true; }
            it.surah = row.querySelector('.surahInput').value;
            it.ayat = ayatAwal && ayatAkhir ? (ayatAwal + ' - ' + ayatAkhir) : ayatAwal;
            it.juz = row.querySelector('.juzSelect').value;
            it.nilai = row.querySelector('.nilaiSelect').value;
            var halamanAwal = row.querySelector('.halamanAwalSelect').value;
            var halamanAkhir = row.querySelector('.halamanAkhirSelect').value;
            if (Number(halamanAkhir) < Number(halamanAwal)) { adaError = true; }
            it.halamanKe = halamanAwal === halamanAkhir ? halamanAwal : (halamanAwal + ' - ' + halamanAkhir);
          }
          items.push(it);
        });
        if (adaError) { document.getElementById('pesanSimpanHafalan').innerHTML = errBox('Ada isian rentang yang terbalik (nilai "sampai" lebih kecil dari "dari"). Periksa kembali Ayat dan Halaman sebelum menyimpan.'); return; }
        var btn = document.getElementById('btnSimpanHafalan'); btn.disabled = true; btn.innerText = 'Menyimpan...';
        api('submitHafalan', {tanggal: document.getElementById('hfTanggal').value, waktu: waktu, halaqoh: namaHalaqoh, pengampu: STATE.user.nama, items: items})
          .then(function(res2){
            if(!res2.ok){ document.getElementById('pesanSimpanHafalan').innerHTML = errBox(res2.error); btn.disabled=false; btn.innerText='Simpan Hafalan'; return; }
            alert('Hafalan tersimpan (baru: '+res2.ditambah+', diperbarui: '+res2.diupdate+').');
            guruIsiHafalan();
          });
      };
    });
  }

            var html = '<table><tr><th>Tanggal</th><th>Waktu</th><th>Nama</th><th>Jenis</th><th>Surah/Ayat/Juz/Hal</th><th>Nilai</th><th>Aksi</th></tr>';

                '<td><button class="small danger btnHapusH" data-row="'+r.rowIndex+'">Hapus</button></td></tr>';
            });
            html += '</table>';
            if (!setHtmlSafe('riwayatHTable', html)) return;
            document.querySelectorAll('.btnHapusH').forEach(function(btn){
              btn.onclick = function(){ if(!confirm('Hapus catatan hafalan ini?')) return; api('deleteHafalan', {rowIndex: Number(btn.dataset.row)}).then(cari); };
            });
          });
      }
      document.getElementById('btnCariRiwayatH').onclick = cari;
      cari();
    });
  }

          if(!rowSantri) return;
          api('saveMasterRow', {sheet:'Santri', rowIndex: rowSantri.rowIndex,

          }).then(function(res4){ document.getElementById('pesanKontak').innerHTML = res4.ok ? '<p class="muted">Tersimpan.</p>' : errBox(res4.error); });
        });
      };
    });
  }

      reader.onload = function(e){
        try {
          var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
          var ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, {defval:''});
          var payload = rows.map(function(r){
            return { nisn: String(r['NISN']||'').trim(), nama: String(r['Nama']||'').trim(), tahunMasuk: String(r['Tahun Masuk']||'').trim(),

          document.getElementById('hasilImport').innerHTML = '<p class="muted">Mengimpor '+payload.length+' baris...</p>';

            if(!res.ok){ document.getElementById('hasilImport').innerHTML = errBox(res.error); return; }
            var html = '<p>Berhasil ditambah: <b>'+res.ditambah+'</b>, dilewati: <b>'+res.dilewati+'</b></p>';
            if(res.errors && res.errors.length){ html += '<div class="warn">' + res.errors.map(esc).join('<br>') + '</div>'; }
            document.getElementById('hasilImport').innerHTML = html;
            muatTabelSantri();
          });
        } catch(err){ document.getElementById('hasilImport').innerHTML = errBox('Gagal membaca file: ' + err.message); }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    };

    document.getElementById('btnExportSantri').onclick = function(){
      api('getSemuaSantri', {}).then(function(res){
        if(!res.ok){ alert(res.error); return; }
        var data = [['NISN','Nama','Tahun Masuk','Jenis Kelamin','No WA Ortu','Kelas Saat Ini','Halaqoh Saat Ini']];
        res.data.forEach(function(s){ data.push([s.nisn, s.nama, s.tahunMasuk, s.jenisKelamin, s.noWaOrtu, s.kelasSaatIni, s.halaqohSaatIni]); });
        var ws = XLSX.utils.aoa_to_sheet(data);
        var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data Santri'); XLSX.writeFile(wb, 'Data_Santri_Export.xlsx');
      });

    function muatTabelSantri(){
      api('getSemuaSantri', {}).then(function(res){
        if(!res.ok){ document.getElementById('tabelSantri').innerHTML = errBox(res.error); return; }
        var html = '<table><tr><th>NISN</th><th>Nama</th><th>Tahun Masuk</th><th>Gender</th><th>No WA Ortu</th><th>Kelas</th><th>Halaqoh</th></tr>';
        res.data.forEach(function(s){
          html += '<tr><td>'+esc(s.nisn)+'</td><td>'+esc(s.nama)+'</td><td>'+esc(s.tahunMasuk)+'</td><td>'+esc(s.jenisKelamin)+'</td><td>'+esc(s.noWaOrtu)+'</td><td>'+esc(s.kelasSaatIni)+'</td><td>'+esc(s.halaqohSaatIni)+'</td></tr>';

  // ---------------- DATA MASTER LAIN ----------------
  function adminDataMaster(){
    var c = document.getElementById('da-content');
    var sheets = ['Guru','MataPelajaran','RoleAkses','JamPelajaran'];
    c.innerHTML = '<div class="card"><h3>Kelola Data Master</h3>' +
      '<select id="pilihSheet">' + sheets.map(function(s){return '<option value="'+s+'">'+(s==='JamPelajaran'?'Jam Pelajaran (acuan rekap jam mengajar)':s)+'</option>';}).join('') + '</select>' +
      '<div id="tabelMaster">Memuat...</div></div>';

    function muat(){
      var sheet = document.getElementById('pilihSheet').value;
      var fetchGuru = (sheet==='MataPelajaran') ? api('getMasterData', {sheet:'Guru'}) : Promise.resolve({ok:true,data:{data:[]}});
      var fetchKelas = (sheet==='MataPelajaran') ? api('getDaftarKelasRombel',{}) : Promise.resolve({ok:true,data:[]});
      var fetchSantri = (sheet==='RoleAkses') ? api('getSemuaSantri', {}) : Promise.resolve({ok:true,data:[]});
      Promise.all([api('getMasterData', {sheet:sheet}), fetchKelas, fetchGuru, fetchSantri])
        .then(function(hasil){
          var res = hasil[0], resKelas = hasil[1], resGuru = hasil[2], resSantri = hasil[3];
          if(!res.ok){ document.getElementById('tabelMaster').innerHTML = errBox(res.error); return; }
          var header = res.data.header;
          var daftarKelas = resKelas.data.map(function(k){return k.kelas;});
          var daftarNamaGuru = resGuru.ok ? resGuru.data.data.map(function(g){return g.Nama;}) : [];
          var daftarNamaMapel = []; var seenMapel = {};
          res.data.data.forEach(function(row){ var nm = row['Nama Mapel']; if(nm && !seenMapel[nm]){ seenMapel[nm]=true; daftarNamaMapel.push(nm); } });
          var daftarSantri = resSantri.ok ? resSantri.data : [];
          var html = '<table><tr>' + header.map(function(h){return '<th>'+esc(h)+'</th>';}).join('') + '<th>Aksi</th></tr>';
          res.data.data.forEach(function(row){
            html += '<tr>' + header.map(function(h){return '<td>'+esc(row[h]!==undefined?row[h]:'')+'</td>';}).join('') +
              '<td><button class="small btnEditM" data-row="'+row.rowIndex+'">Edit</button> <button class="small danger btnDelM" data-row="'+row.rowIndex+'">Hapus</button></td></tr>';
          });
          html += '</table><button id="btnTambahRow">+ Tambah Data</button>';
          document.getElementById('tabelMaster').innerHTML = html;

          function bukaForm(existing){
            var fieldsHtml = header.map(function(h){
              if(sheet==='MataPelajaran' && h==='Kelas') return fieldSelect('f_'+h,h,daftarKelas, existing?existing[h]:(daftarKelas[0]||''));
              if(sheet==='MataPelajaran' && h==='Hari') return fieldSelect('f_'+h,h,['Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu','Minggu'], existing?existing[h]:'Senin');
              if(sheet==='MataPelajaran' && h==='Pengampu') return fieldAutocomplete('f_'+h,h,daftarNamaGuru, existing?existing[h]:'', 'Ketik nama guru...');
              if(sheet==='MataPelajaran' && h==='Nama Mapel') return fieldAutocomplete('f_'+h,h,daftarNamaMapel, existing?existing[h]:'', 'Ketik nama mapel (boleh baru)...');
              if(sheet==='RoleAkses' && h==='Level') return fieldSelect('f_'+h,h,['Guru','Admin','Mudir','WaliSantri'], existing?existing[h]:'Guru');
              if(sheet==='RoleAkses' && h==='NISN Anak') return fieldAutocomplete('f_'+h,h,daftarSantri.map(labelSantri), existing?existing[h]:'', 'Ketik NISN/nama santri (khusus WaliSantri, kosongkan jika bukan)');
              if(sheet==='JamPelajaran' && h==='Jenis') return fieldSelect('f_'+h,h,['Halaqoh','Mapel'], existing?existing[h]:'Halaqoh');
              if(sheet==='JamPelajaran' && h==='Nama') return fieldText('f_'+h,'Nama (untuk Halaqoh isi nama Waktu: Subuh/Duha/Maghrib dst; untuk Mapel isi nama mata pelajaran)', existing?existing[h]:'');
              if(sheet==='JamPelajaran' && h==='Jumlah Jam') return fieldText('f_'+h,h, existing?existing[h]:'');
              return fieldText('f_'+h, h, existing?existing[h]:'');
            }).join('');
            openModal(existing? 'Edit Data' : 'Tambah Data', fieldsHtml, function(modal){
              var values = {}; var gagal = null;
              header.forEach(function(h){
                var raw = modal.querySelector('#f_'+h).value;
                if (sheet==='MataPelajaran' && h==='Pengampu') {
                  var pengampuValid = resolveGuruExact(raw, daftarNamaGuru);
                  if (!pengampuValid) { gagal = 'Nama guru pada Pengampu tidak dikenali. Pilih salah satu saran yang muncul saat mengetik.'; return; }
                  values[h] = pengampuValid;
                } else if (sheet==='RoleAkses' && h==='NISN Anak') {
                  if (!raw) { values[h] = ''; }
                  else {
                    var nisnValid = resolveSantriNisn(raw, daftarSantri);
                    if (!nisnValid) { gagal = 'Santri pada NISN Anak tidak ditemukan. Pilih salah satu saran yang muncul saat mengetik, atau kosongkan.'; return; }
                    values[h] = nisnValid;
                  }
                } else { values[h] = raw; }
              });
              if (gagal) { alert(gagal); return false; }
              api('saveMasterRow', {sheet:sheet, rowIndex: existing? existing.rowIndex : 0, values: values}).then(function(r){ if(!r.ok) alert(r.error); else muat(); });
            });
          }
          document.getElementById('btnTambahRow').onclick = function(){ bukaForm(null); };
          document.querySelectorAll('.btnEditM').forEach(function(btn){ btn.onclick = function(){ bukaForm(res.data.data.find(function(r){return r.rowIndex===Number(btn.dataset.row);})); }; });
          document.querySelectorAll('.btnDelM').forEach(function(btn){ btn.onclick = function(){ if(!confirm('Hapus baris ini?')) return; api('deleteMasterRow', {sheet:sheet, rowIndex:Number(btn.dataset.row)}).then(muat); }; });
        });
    }
    document.getElementById('pilihSheet').onchange = muat;
    muat();
  }

          api('generatePDF', {judul:'Rekap Jam Mengajar - '+lastLabel, kolom:['Tanggal','Jenis','Keterangan','Jam'],

            baris: lastHasil.daftar.map(function(r){return [r.pengampu,r.totalJam];})
          }).then(unduhPdf);
        }
      };
    });

        api('generatePDF', {judul:'Rapor Akademik - '+(lastNama||lastNisn), kolom:['Mapel','Tugas','Kehadiran%','UTS','UAS','Pengetahuan','Sikap','Keterampilan'],
          baris: lastRapor.map(function(r){return [r.mapel, r.rataTugas, r.persenKehadiran, r.nilaiUTS, r.nilaiUAS, r.nilaiPengetahuan, r.rataSikap, r.rataKeterampilan];})
        }).then(unduhPdf);
      };
      document.getElementById('btnKirimRaporOrtu').onclick = function(){
        if(!lastRapor || !lastNisn) return alert('Tampilkan rapor dulu.');
        api('getMasterData', {sheet:'Santri'}).then(function(res){
          if(!res.ok) return alert(res.error);
          var s = res.data.data.find(function(x){return String(x.NISN)===String(lastNisn);});
          if(!s) return alert('Santri tidak ditemukan');
          var ringkas = lastRapor.map(function(r){return r.mapel+': '+(r.nilaiPengetahuan!=null?r.nilaiPengetahuan:'-');}).join(', ');
          var pesan = 'Rapor Akademik '+s.Nama+' - ' + ringkas;
          api('getWaLink', {noWa: s['No WA Ortu'], pesan: pesan}).then(function(res2){ if(!res2.ok) return alert(res2.error); window.open(res2.data, '_blank'); });
        });
      };
    });
  }

  // ---------------- TAMPILAN / LOGO ----------------
  // ---------------- KELOLA SLIDE PENGUMUMAN ----------------
  function adminSlide(){
    var c = document.getElementById('da-content');
    c.innerHTML = '<p>Memuat...</p>';
    api('getPengaturan', {}).then(function(resP){
      var jeda = (resP.ok && resP.data.SlideJedaDetik) ? resP.data.SlideJedaDetik : '5';
      c.innerHTML = '<div class="card"><h3>Pengaturan Slide</h3>' +
        '<label>Jeda Antar Slide (detik)</label><input id="slJeda" value="'+esc(jeda)+'" style="max-width:150px">' +
        '<button id="btnSimpanJeda">Simpan Jeda</button><div id="pesanJeda"></div></div>' +
        '<div class="card"><h3>Daftar Slide Pengumuman</h3>' +
        warnBox('Slide tampil di bagian atas aplikasi untuk role Admin, Mudir, Guru, dan Wali Santri. Tiap slide bisa diatur tampil untuk semua role atau hanya role tertentu. Jumlah slide tidak dibatasi.') +
        '<button class="small" id="btnTambahSlide">+ Tambah Slide</button><div id="daftarSlideWrap">Memuat...</div></div>';

      document.getElementById('btnSimpanJeda').onclick = function(){
        var v = document.getElementById('slJeda').value.trim() || '5';
        api('simpanPengaturan', {key:'SlideJedaDetik', value:v}).then(function(res){
          document.getElementById('pesanJeda').innerHTML = res.ok ? '<p class="muted">Tersimpan.</p>' : errBox(res.error);
        });
      };

      function bukaFormSlide(existing, muatUlang){
        var rolesTerpilih = existing && existing.tampilUntuk !== 'Semua' ? existing.tampilUntuk.split(',') : [];
        var semuaDipilih = !existing || existing.tampilUntuk === 'Semua';
        var previewAwal = existing && existing.gambar ? '<img src="'+esc(existing.gambar)+'" style="height:60px;border-radius:6px;margin-top:4px;display:block">' : '';
        var fieldsHtml =
          fieldText('slJudul','Judul (opsional, tampil di bawah gambar)', existing?existing.judul:'') +
          '<label>Gambar Slide</label>' +
          '<input type="file" id="slFile" accept="image/*">' +
          '<p class="muted" style="margin-top:-6px">Pilih foto dari HP/komputer -- otomatis dikecilkan &amp; diunggah supaya aplikasi tetap ringan. Atau isi manual URL gambar di bawah.</p>' +
          fieldText('slGambar','URL Gambar (terisi otomatis setelah unggah, atau isi manual)', existing?existing.gambar:'') +
          '<div id="slUploadStatus">'+previewAwal+'</div>' +
          fieldText('slTautan','Tautan saat diklik (opsional)', existing?existing.tautan:'') +
          '<label>Tampil Untuk</label>' +
          '<div style="margin-bottom:10px">' +
          '<label style="display:inline-flex;align-items:center;gap:5px;font-weight:400"><input type="checkbox" id="slSemua" style="width:auto;margin:0" '+(semuaDipilih?'checked':'')+'> Semua Role</label>' +
          '<div id="slRoleWrap" style="'+(semuaDipilih?'display:none':'display:block')+';margin-top:6px">' +
          ['Admin','Mudir','Guru','WaliSantri'].map(function(r){
            return '<label style="display:inline-flex;align-items:center;gap:5px;font-weight:400;margin-right:12px;margin-bottom:4px"><input type="checkbox" class="slRoleChk" value="'+r+'" style="width:auto;margin:0" '+(rolesTerpilih.indexOf(r)!==-1?'checked':'')+'> '+r+'</label>';
          }).join('') + '</div></div>' +
          fieldText('slUrutan','Urutan (angka kecil tampil duluan)', existing?String(existing.urutan):'0') +
          '<label style="display:inline-flex;align-items:center;gap:5px"><input type="checkbox" id="slAktif" style="width:auto;margin:0" '+(!existing||existing.aktif?'checked':'')+'> Aktifkan slide ini</label>';
        var modal = openModal(existing?'Edit Slide':'Tambah Slide', fieldsHtml, function(m){
          var gambar = m.querySelector('#slGambar').value.trim();
          if (!gambar) { alert('Pilih gambar dari perangkat atau isi URL Gambar terlebih dahulu.'); return false; }
          var semua = m.querySelector('#slSemua').checked;
          var roles = semua ? 'Semua' : Array.prototype.map.call(m.querySelectorAll('.slRoleChk:checked'), function(el){return el.value;}).join(',');
          if (!semua && !roles) { alert('Pilih minimal satu role, atau centang Semua Role.'); return false; }
          api('saveSlide', {rowIndex: existing?existing.rowIndex:0, judul:m.querySelector('#slJudul').value.trim(),
            gambar:gambar, tautan:m.querySelector('#slTautan').value.trim(), tampilUntuk:roles,
            urutan:m.querySelector('#slUrutan').value.trim(), aktif:m.querySelector('#slAktif').checked}).then(function(r){
              if(!r.ok) alert(r.error); else muatUlang();
            });
        });
        modal.querySelector('#slSemua').onchange = function(){
          modal.querySelector('#slRoleWrap').style.display = this.checked ? 'none' : 'block';
        };
        modal.querySelector('#slFile').onchange = function(e){
          var file = e.target.files[0];
          if (!file) return;
          var statusEl = modal.querySelector('#slUploadStatus');
          statusEl.innerHTML = '<p class="muted">Memproses gambar...</p>';
          resizeImageFile(file, 1200, 0.8).then(function(hasil){
            statusEl.innerHTML = '<p class="muted">Mengunggah...</p>';
            api('uploadSlideImage', {base64: hasil.base64, mimeType: hasil.mimeType, fileName: file.name}).then(function(res){
              if(!res.ok){ statusEl.innerHTML = errBox(res.error); return; }
              modal.querySelector('#slGambar').value = res.url;
              statusEl.innerHTML = '<p class="muted">Berhasil diunggah.</p><img src="'+esc(res.url)+'" style="height:60px;border-radius:6px;margin-top:4px;display:block">';
            });
          }).catch(function(){
            statusEl.innerHTML = errBox('Gagal memproses gambar. Coba file lain.');
          });
        };
      }

      function muatDaftar(){
        api('getSlideList', {}).then(function(res){
          if(!res.ok){ document.getElementById('daftarSlideWrap').innerHTML = errBox(res.error); return; }
          document.getElementById('btnTambahSlide').onclick = function(){ bukaFormSlide(null, muatDaftar); };
          if(!res.data.length){ document.getElementById('daftarSlideWrap').innerHTML = '<p class="muted">Belum ada slide. Klik "+ Tambah Slide" untuk membuat pengumuman pertama.</p>'; return; }
          var html = '<table><tr><th>Preview</th><th>Judul</th><th>Tampil Untuk</th><th>Urutan</th><th>Status</th><th>Aksi</th></tr>';
          res.data.forEach(function(s){
            html += '<tr><td><img src="'+esc(s.gambar)+'" style="width:70px;height:40px;object-fit:cover;border-radius:4px;display:block"></td>' +
              '<td>'+esc(s.judul||'-')+'</td><td>'+esc(s.tampilUntuk)+'</td><td>'+s.urutan+'</td>' +
              '<td>'+(s.aktif ? '&#9989; Aktif' : '&#9208;&#65039; Nonaktif')+'</td>' +
              '<td><button class="small btnEditSlide" data-row="'+s.rowIndex+'">Edit</button> <button class="small danger btnHapusSlide" data-row="'+s.rowIndex+'">Hapus</button></td></tr>';
          });
          html += '</table>';
          document.getElementById('daftarSlideWrap').innerHTML = html;
          document.querySelectorAll('.btnEditSlide').forEach(function(btn){
            btn.onclick = function(){ bukaFormSlide(res.data.find(function(s){return s.rowIndex===Number(btn.dataset.row);}), muatDaftar); };
          });
          document.querySelectorAll('.btnHapusSlide').forEach(function(btn){
            btn.onclick = function(){ if(!confirm('Hapus slide ini?')) return; api('deleteSlide', {rowIndex:Number(btn.dataset.row)}).then(muatDaftar); };
          });
        });
      }
      muatDaftar();
    });
  }

  function adminTampilan(){
    var c = document.getElementById('da-content');
    c.innerHTML = '<p>Memuat pengaturan...</p>';
    api('getPengaturan', {}).then(function(resP){
      var p = resP.ok ? resP.data : {};
      c.innerHTML = '<div class="card"><h3>Kustomisasi Tampilan</h3>' +
        '<label>Nama Pesantren</label><input id="tpNama" value="'+esc(STATE.pengaturan.NamaPesantren)+'">' +
        '<label>URL Logo (opsional)</label><input id="tpLogo" value="'+esc(STATE.pengaturan.LogoURL)+'" placeholder="https://... (kosongkan untuk pakai logo bawaan)">' +
        '<label>Warna Tema (kode hex)</label><input id="tpWarna" value="'+esc(STATE.pengaturan.WarnaTema)+'">' +

        '<p class="muted">Pratinjau logo yang tampil saat ini'+(STATE.pengaturan.LogoURL?'':' (logo bawaan, karena URL Logo belum diisi)')+':</p><img src="'+esc(logoSrc())+'" style="height:60px">' + '</div>' +

        '<div class="card"><h3>Saldo & Transaksi Kantin</h3>' +
        warnBox('Fitur ini menampilkan sisa saldo dan riwayat transaksi santri kepada Wali Santri & Admin/Mudir, dibaca langsung (real-time) dari spreadsheet Kantin terpisah. Spreadsheet itu WAJIB di-share (minimal akses "Viewer") ke akun Google yang dipakai men-deploy Apps Script ini.') +
        '<label>ID Spreadsheet Kantin</label><input id="tpKantinId" value="'+esc(p.KantinSpreadsheetId||'')+'" placeholder="contoh: 1PaTAnCXt-pTK05V8XmI9DHxPO3dJbbKC7uWzCLTqrRI">' +
        '<div class="grid2"><div><label>Nama Sheet Data Santri</label><input id="tpKantinSheetSantri" value="'+esc(p.KantinSheetSantri||'Data Santri')+'"></div>' +

        '<div class="card"><h3>Izin Ganti Tanggal Absen &amp; Hafalan</h3>' +

        '<button id="btnSimpanIzinTanggal">Simpan</button><div id="pesanIzinTanggal"></div></div>';

      document.getElementById('btnSimpanTampilan').onclick = function(){
        var nama = document.getElementById('tpNama').value.trim();
        var logo = document.getElementById('tpLogo').value.trim();
        var warna = document.getElementById('tpWarna').value.trim() || '#0d9488';
        Promise.all([api('simpanPengaturan', {key:'NamaPesantren', value:nama}), api('simpanPengaturan', {key:'LogoURL', value:logo}), api('simpanPengaturan', {key:'WarnaTema', value:warna})])
          .then(function(hasil){
            var gagal = hasil.find(function(h){ return !h.ok; });
            if(gagal){ document.getElementById('pesanTampilan').innerHTML = errBox(gagal.error); return; }
            STATE.pengaturan = {NamaPesantren:nama, LogoURL:logo, LogoDataUriDefault: STATE.pengaturan.LogoDataUriDefault, WarnaTema:warna};
            root.style.setProperty('--tema', warna);
            document.getElementById('pesanTampilan').innerHTML = '<p class="muted">Tersimpan. Menyegarkan tampilan...</p>';
            dashboardAdmin('tampilan');
          });
      };

      document.getElementById('btnSimpanKantin').onclick = function(){
        var id = document.getElementById('tpKantinId').value.trim();
        var sheetSantri = document.getElementById('tpKantinSheetSantri').value.trim() || 'Data Santri';

        Promise.all([api('simpanPengaturan', {key:'KantinSpreadsheetId', value:id}), api('simpanPengaturan', {key:'KantinSheetSantri', value:sheetSantri}), api('simpanPengaturan', {key:'KantinSheetTransaksi', value:sheetTrx})])
          .then(function(hasil){
            var gagal = hasil.find(function(h){ return !h.ok; });
            document.getElementById('pesanKantin').innerHTML = gagal ? errBox(gagal.error) : '<p class="muted">Tersimpan.</p>';

      document.getElementById('btnSimpanIzinTanggal').onclick = function(){
        var val = document.getElementById('tpIzinTanggal').value;
        api('simpanPengaturan', {key:'IzinkanGantiTanggal', value:val}).then(function(res){

        api('getDaftarSheetKantin', {spreadsheetId:id}).then(function(res){
          if(!res.ok){ document.getElementById('pesanKantin').innerHTML = errBox(res.error); return; }

        });

  loadPengaturanLaluTampilkanLogin();
})();

<script>
  // ============ PWA: daftarkan service worker ============
  // Dibungkus try/catch + .catch() supaya kalau gagal (misal dibuka lewat pratinjau
  // file yang bukan hosting asli/production), aplikasi tetap jalan normal -- cuma
  // fitur offline-nya saja yang tidak aktif di konteks itu, bukan error yang mengganggu.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      try {
        navigator.serviceWorker.register('/sw.js').catch(function(err){
          console.warn('Service worker tidak aktif di konteks ini (wajar kalau bukan domain hosting asli):', err.message || err);
        });
      } catch (err) { /* abaikan, bukan fitur wajib */ }
    });
  }

  // ============ PWA: tombol Install ============
  // Sinyal "beforeinstallprompt" dari browser TIDAK SELALU bisa diandalkan untuk
  // MENAMPILKAN tombol (kadang lambat/tidak muncul walau aplikasinya sebenarnya
  // sudah siap diinstal). Jadi sekarang tombol TAMPIL DEFAULT, dan HANYA
  // disembunyikan kalau ada sinyal yang PASTI aplikasi memang sudah terpasang:
  // - sedang berjalan dalam mode standalone (dibuka dari ikon Layar Utama), atau
  // - event "appinstalled" baru saja terjadi (baru selesai diinstal).
  var _deferredInstallPrompt = null;
  var _isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  var _sudahStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function _tampilkanTombolInstall(){
    var btn = document.getElementById('btnInstallPWA');
    if (!btn || _sudahStandalone) return;
    btn.style.display = 'block';
  }
  function _sembunyikanTombolInstall(){
    var btn = document.getElementById('btnInstallPWA');
    if (btn) btn.style.display = 'none';
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    _deferredInstallPrompt = e; // simpan supaya tombol bisa pakai prompt instal ASLI bawaan browser
  });
  window.addEventListener('appinstalled', function(){
    _sudahStandalone = true;
    _deferredInstallPrompt = null;
    _sembunyikanTombolInstall();
  });

  document.getElementById('btnInstallPWA').addEventListener('click', function(){
    if (_deferredInstallPrompt) {
      _deferredInstallPrompt.prompt();
      _deferredInstallPrompt.userChoice.then(function(res){
        _deferredInstallPrompt = null;
        if (res && res.outcome === 'accepted') _sembunyikanTombolInstall();
      });
      return;
    }
    if (_isIOS) {
      alert('Cara install di iPhone/iPad:\n\n1. Tap ikon Share/Bagikan (kotak dengan panah ke atas) di bagian bawah layar Safari.\n2. Pilih "Add to Home Screen" / "Tambah ke Layar Utama".\n3. Tap "Add" / "Tambah" di pojok kanan atas.\n\nIkon WASIAT akan muncul di layar utama HP Anda seperti aplikasi biasa.');
      return;
    }
    alert('Cara install aplikasi ini:\n\nDi Android (Chrome): tap menu titik tiga (\u22EE) di pojok kanan atas browser, lalu pilih "Install app" atau "Tambah ke layar Utama".\n\nDi komputer (Chrome/Edge): cari ikon install (gambar layar dengan panah, atau tanda +) di sebelah kanan kolom alamat browser, lalu klik.\n\nKalau tidak menemukan opsi ini dalam beberapa detik, coba muat ulang halaman ini sekali.');
  });

  // Tampilkan default. Kalau ternyata sedang berjalan sebagai app terpasang
  // (standalone), _tampilkanTombolInstall() otomatis tidak melakukan apa-apa.
  _tampilkanTombolInstall();

  // ============ Alat diagnosa: cek kenapa install tidak/belum bisa jalan ============
  // Mengecek satu-satu syarat yang WAJIB dipenuhi browser (Chrome/Edge) supaya PWA
  // dianggap "siap diinstal" (memicu beforeinstallprompt). Hasilnya ditampilkan
  // dalam Bahasa Indonesia supaya mudah dipahami tanpa perlu buka DevTools.
  document.getElementById('btnCekPWA').addEventListener('click', function(){
    var hasil = [];
    hasil.push('=== HASIL CEK STATUS INSTALASI ===\n');
    hasil.push('URL saat ini: ' + location.href);
    hasil.push('HTTPS aktif: ' + (location.protocol === 'https:' ? 'YA (baik)' : 'TIDAK (harus HTTPS supaya bisa diinstal!)'));
    hasil.push('Sudah berjalan sebagai app terpasang: ' + (_sudahStandalone ? 'YA' : 'TIDAK'));
    hasil.push('Browser sudah kirim izin instal (beforeinstallprompt): ' + (_deferredInstallPrompt ? 'YA (tombol Instal seharusnya berfungsi penuh)' : 'BELUM diterima'));

    var cekManifest = fetch('/manifest.json').then(function(r){
      return r.ok ? r.json().then(function(j){ return 'OK (nama: "'+(j.name||'-')+'", '+(j.icons?j.icons.length:0)+' ikon terdaftar)'; })
                  : 'GAGAL - status HTTP ' + r.status + ' (file manifest.json tidak ditemukan di server!)';
    }).catch(function(){ return 'GAGAL total diambil (cek koneksi atau file tidak ada)'; });

    var cekIkon192 = fetch('/icons/icon-192.png').then(function(r){ return r.ok ? 'OK' : 'GAGAL - status HTTP ' + r.status + ' (file tidak ada di server!)'; }).catch(function(){ return 'GAGAL total diambil'; });
    var cekIkon512 = fetch('/icons/icon-512.png').then(function(r){ return r.ok ? 'OK' : 'GAGAL - status HTTP ' + r.status + ' (file tidak ada di server!)'; }).catch(function(){ return 'GAGAL total diambil'; });
    var cekSW = ('serviceWorker' in navigator)
      ? navigator.serviceWorker.getRegistration().then(function(reg){ return reg ? ('Terdaftar (status: ' + (reg.active?'aktif':'belum aktif') + ')') : 'BELUM terdaftar'; })
      : Promise.resolve('Browser ini tidak mendukung Service Worker');

    Promise.all([cekManifest, cekIkon192, cekIkon512, cekSW]).then(function(r){
      hasil.push('\nmanifest.json: ' + r[0]);
      hasil.push('icons/icon-192.png: ' + r[1]);
      hasil.push('icons/icon-512.png: ' + r[2]);
      hasil.push('Service Worker: ' + r[3]);
      hasil.push('\nKalau ada tulisan "GAGAL" di atas, itu penyebab pastinya -- biasanya file belum ter-upload dengan benar ke GitHub/Vercel. Kalau semua "OK" tapi tombol Instal masih tampilan tutorial, coba tutup & buka lagi browsernya sekali.');
      alert(hasil.join('\n'));
    });
  });
</script>
