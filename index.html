<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WASIAT - Wihdatul Ummah Poso</title>
<meta name="description" content="Aplikasi Absensi & Hafalan Santri Pondok Pesantren Wihdatul Ummah Poso">

<!-- ============ PWA: manifest, ikon, warna tema ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASIAT">
</head>
<body style="margin:0;padding:0">

<!-- Tombol Install PWA (tersembunyi default -- hanya muncul kalau terdeteksi belum terpasang) -->
<button id="btnInstallPWA" style="display:none;position:fixed;left:14px;bottom:14px;z-index:99999;background:#0d9488;color:#fff;border:none;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(15,118,110,.35);cursor:pointer;font-family:'Segoe UI',Arial,sans-serif">
  &#128241; Instal Aplikasi WASIAT
</button>

<!-- Lencana status data offline (mengambang, hanya tampil kalau ada data belum tersinkron) -->
<div id="outboxBadge" style="display:none;position:fixed;right:14px;bottom:14px;z-index:99999;background:#f59e0b;color:#fff;padding:10px 14px;border-radius:24px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);align-items:center;gap:8px;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer"></div>

<!--
  ====================================================================
  WASIAT - Aplikasi Absensi & Hafalan Santri
  Pondok Pesantren Wihdatul Ummah Poso, Sulawesi Tengah
  Versi PWA (dihosting mandiri di Vercel) -- lihat README.md untuk cara deploy.
  ====================================================================
-->
<div id="absensi-app">
  <div style="text-align:center;padding:60px 20px;font-family:'Segoe UI',Arial,sans-serif;color:#0f766e">Memuat aplikasi...</div>
</div>

<script src="/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  #absensi-app{
    max-width:1300px;margin:0 auto;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;
    --tema:#0d9488;--tema-dark:#0f766e;--tema-light:#ccfbf1;--sidebar-bg:#134e4a;background:#f1f5f9;
    overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  #absensi-app *{box-sizing:border-box;max-width:100%}
  #absensi-app img{max-width:100%;height:auto}

  /* ---- layout shell: sidebar geser (tersembunyi default) + konten utama ---- */
  #absensi-app .app-shell{display:flex;min-height:100vh;position:relative}
  #absensi-app .sidebar{
    width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar-bg),#0a2e2c);color:#e2f5f3;
    display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;overflow-y:auto;
    transform:translateX(-100%);transition:transform .25s ease;z-index:1000;box-shadow:2px 0 16px rgba(0,0,0,.25);
  }
  #absensi-app .sidebar.open{transform:translateX(0)}
  #absensi-app .sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  #absensi-app .sidebar-brand img{height:38px;width:38px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;flex-shrink:0}
  #absensi-app .sidebar-brand .nm{font-size:13px;font-weight:600;line-height:1.3}
  #absensi-app .sidebar-nav{flex:1;padding:10px 8px}
  #absensi-app .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;
    color:#c9e8e4;font-size:13.5px;margin-bottom:2px;white-space:nowrap;
  }
  #absensi-app .nav-item .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
  #absensi-app .nav-item:hover{background:rgba(255,255,255,.08)}
  #absensi-app .nav-item.active{background:var(--tema);color:#fff;font-weight:600}
  #absensi-app .sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
  #absensi-app .sidebar-user .nm{font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #absensi-app .sidebar-user .lvl{color:#9fd8d2;margin-bottom:8px}
  #absensi-app .sidebar-user button{width:100%;background:rgba(255,255,255,.14);margin:0}
  #absensi-app .sidebar-user button:hover{background:rgba(255,255,255,.24)}
  #absensi-app .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999}
  #absensi-app .sidebar-overlay.show{display:block}
  #absensi-app .main-content{flex:1;min-width:0;padding:0 22px 40px}
  #absensi-app .mobile-topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:sticky;top:0;background:#f1f5f9;padding:10px 0;z-index:50}
  #absensi-app .hamburger-btn{background:var(--tema);color:#fff;border:none;width:38px;height:38px;border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;margin:0}
  #absensi-app .mobile-title{font-size:15px;font-weight:600;color:var(--tema-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (max-width:860px){
    #absensi-app .main-content{padding:0 12px 32px}
  }

  /* ---- kartu, form, tombol ---- */
  #absensi-app .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,118,110,.07)}
  #absensi-app h2{margin:0 0 10px;color:#0f2f2d}
  #absensi-app h3{margin:0 0 10px;color:#0f2f2d;font-size:16px}
  #absensi-app h4{margin:10px 0 6px;color:#134e4a;font-size:13.5px}
  #absensi-app label{display:block;font-size:12.5px;color:#475569;margin-bottom:3px;font-weight:500}
  #absensi-app input,#absensi-app select,#absensi-app textarea{
    width:100%;padding:9px 10px;margin:0 0 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff;color:#1e293b;
  }
  #absensi-app input:focus,#absensi-app select:focus,#absensi-app textarea:focus{outline:none;border-color:var(--tema);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  #absensi-app button{background:var(--tema);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;margin-right:6px;margin-bottom:6px;transition:background .15s}
  #absensi-app button:hover{background:var(--tema-dark)}
  #absensi-app button.secondary{background:#64748b}
  #absensi-app button.secondary:hover{background:#475569}
  #absensi-app button.danger{background:#dc2626}
  #absensi-app button.danger:hover{background:#b91c1c}
  #absensi-app button.small{padding:6px 11px;font-size:12px}
  #absensi-app button:disabled{opacity:.55;cursor:not-allowed}

  /* ---- tabel: digeser ke samping, TIDAK ADA teks bertumpuk/wrap ---- */
  #absensi-app table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;white-space:nowrap}
  #absensi-app th,#absensi-app td{border:1px solid #e2e8f0;padding:7px 9px;text-align:left;white-space:nowrap}
  #absensi-app th{background:var(--tema-light);color:#0f4c4c;font-weight:600}

  #absensi-app .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  #absensi-app .tab-btn{background:#eef2f7;color:#334155;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap}
  #absensi-app .tab-btn.active{background:var(--tema);color:#fff}

  #absensi-app .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand{display:flex;align-items:center;gap:10px}
  #absensi-app .brand img{height:42px;width:42px;object-fit:contain;border-radius:8px}

  #absensi-app .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap}
  #absensi-app .badge.Hadir{background:#0d9488}
  #absensi-app .badge.Sakit{background:#f59e0b}
  #absensi-app .badge.Izin{background:#2563eb}
  #absensi-app .badge.Alpa{background:#dc2626}
  #absensi-app .badge-hafalan{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap}
  #absensi-app .badge-hafalan.sabaq{background:#0d9488}
  #absensi-app .badge-hafalan.sabqi{background:#0891b2}
  #absensi-app .badge-hafalan.manzil{background:#7c3aed}
  #absensi-app .badge-hafalan.murojaah{background:#0284c7}
  #absensi-app .badge-hafalan.tahsin{background:#16a34a}
  #absensi-app .badge-hafalan.tasmi{background:#b45309}
  #absensi-app .badge-hafalan.tidaksetor{background:#64748b}
  #absensi-app .badge-hafalan.izin{background:#2563eb}
  #absensi-app .badge-hafalan.sakit{background:#f59e0b}
  #absensi-app .badge-hafalan.ghaib{background:#dc2626}
  #absensi-app .badge-hafalan.hadir{background:#16a34a}
  #absensi-app .badge-hafalan.alpa{background:#dc2626}
  #absensi-app .badge-hafalan.pulang{background:#ea580c}
  #absensi-app .progress{background:#e2e8f0;border-radius:8px;overflow:hidden;height:14px;width:100%}
  #absensi-app .progress-bar{background:var(--tema);height:14px}

  #absensi-app .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #absensi-app .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  @media (max-width:560px){
    #absensi-app .grid2{grid-template-columns:1fr}
    #absensi-app .grid4{grid-template-columns:repeat(2,1fr)}
  }

  #absensi-app .muted{color:#64748b;font-size:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #absensi-app .faded{color:#94a3b8;font-size:11px;font-style:italic}
  #absensi-app .warn{background:#fffbeb;border:1px solid #fcd34d;padding:10px;border-radius:8px;color:#92400e;font-size:13px}
  #absensi-app .err{background:#fef2f2;border:1px solid #fca5a5;padding:10px;border-radius:8px;color:#b91c1c;font-size:13px}

  #absensi-app .overlay{position:fixed;inset:0;background:rgba(15,42,40,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
  #absensi-app .modal{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}

  #absensi-app .santriRowAbsen{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .santriRowHafalan{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .juzchip{display:inline-block;background:var(--tema);color:#fff;border-radius:20px;padding:4px 10px;margin:2px;font-size:12px}
  #absensi-app .juzchip.proses{background:#f59e0b}

  /* ---- slide pengumuman (ringan, tanpa library luar) ---- */
  #absensi-app .slidebar{position:relative;width:100%;aspect-ratio:16/6;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#e2e8f0;box-shadow:0 2px 10px rgba(15,118,110,.12)}
  #absensi-app .slidebar-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;}
  #absensi-app .slidebar-slide.active{opacity:1;z-index:1}
  #absensi-app .slidebar-slide img{width:100%;height:100%;object-fit:cover;display:block}
  #absensi-app .slidebar-caption{position:absolute;left:0;right:0;bottom:0;padding:10px 46px 10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;font-weight:600}
  #absensi-app .slidebar-dots{position:absolute;bottom:9px;right:10px;display:flex;gap:5px;z-index:2}
  #absensi-app .slidebar-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
  #absensi-app .slidebar-dot.active{background:#fff}
  #absensi-app .slidebar-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;margin:0;padding:0}
  #absensi-app .slidebar-arrow:hover{background:rgba(0,0,0,.55)}
  #absensi-app .slidebar-arrow.prev{left:8px}
  #absensi-app .slidebar-arrow.next{right:8px}
  @media (max-width:560px){ #absensi-app .slidebar{aspect-ratio:16/9} }

  /* ---- website depan (beranda publik) ---- */
  #absensi-app .site-nav{position:sticky;top:0;z-index:600;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand2{display:flex;align-items:center;gap:9px;flex-shrink:0;min-width:0}
  #absensi-app .brand2 img{height:42px;width:42px;min-width:42px;flex-shrink:0;display:block;object-fit:contain;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 2px 6px rgba(0,0,0,.08);background:#fff;padding:2px}
  #absensi-app .brand2 span{font-weight:800;color:#0f766e;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
  #absensi-app .site-nav-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #absensi-app .site-nav-links a{color:#334155;font-size:13.5px;font-weight:600;cursor:pointer}
  #absensi-app .site-nav-links a:hover{color:#0d9488}
  @media(min-width:480px){ #absensi-app .brand2 img{height:46px;width:46px;min-width:46px} #absensi-app .brand2 span{font-size:15px;max-width:none;white-space:normal} }
  #absensi-app .btn-masuk{background:var(--tema);color:#fff;border:none;padding:9px 20px;border-radius:20px;font-weight:700;cursor:pointer;font-size:13px;margin:0;width:auto}
  #absensi-app .hero{background:linear-gradient(150deg,#0f766e,#134e4a 65%,#0a2e2c);color:#fff;padding:50px 20px;text-align:center}
  #absensi-app .hero img{height:84px;width:84px;object-fit:contain;margin-bottom:14px;border-radius:14px;background:#fff;padding:8px}
  #absensi-app .hero h1{font-size:23px;margin-bottom:8px}
  #absensi-app .hero p{opacity:.92;max-width:560px;margin:0 auto;font-size:14px;line-height:1.6}
  #absensi-app .site-section{padding:36px 18px;max-width:900px;margin:0 auto}
  #absensi-app .site-section h2{font-size:19px;color:#0f766e;margin-bottom:14px;text-align:center}
  #absensi-app .artikel-grid{display:grid;grid-template-columns:1fr;gap:16px}
  #absensi-app .artikel-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s}
  #absensi-app .artikel-card:hover{transform:translateY(-3px)}
  #absensi-app .artikel-card img{width:100%;height:150px;object-fit:cover;display:block;background:#e2e8f0}
  #absensi-app .artikel-card-body{padding:13px}
  #absensi-app .artikel-card-kat{display:inline-block;background:rgba(13,148,136,.1);color:#0d9488;font-size:10px;font-weight:700;padding:2px 9px;border-radius:12px;margin-bottom:6px}
  #absensi-app .artikel-card h4{font-size:14px;margin-bottom:4px;color:#1e293b}
  #absensi-app .artikel-card p{font-size:12px;color:#64748b;margin:0}
  #absensi-app .site-footer{background:#0f172a;color:#94a3b8;padding:24px 18px;text-align:center;font-size:12px;line-height:1.8}

  /* ====== KAS KELAS ====== */
  #absensi-app .kas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
  #absensi-app .kas-kartu{border:1px solid #e2e8f0;border-radius:12px;padding:12px;cursor:pointer;background:#fff;transition:all .18s}
  #absensi-app .kas-kartu:hover{border-color:#5eead4}
  #absensi-app .kas-kartu.aktif{border-color:var(--tema);background:#f0fdfa;box-shadow:0 0 0 2px rgba(13,148,136,.15)}
  #absensi-app .kas-nama{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
  #absensi-app .kas-sisa{font-size:19px;font-weight:800;color:#0f766e;margin:3px 0}
  #absensi-app .kas-rinci{font-size:11px;color:#94a3b8}

  /* ====== MENU KANTIN (kartu produk berfoto) ====== */
  #absensi-app .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){ #absensi-app .menu-grid{grid-template-columns:repeat(3,1fr);gap:12px} }
  @media(min-width:980px){ #absensi-app .menu-grid{grid-template-columns:repeat(4,1fr)} }
  #absensi-app .menu-kartu{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  /* aspect-ratio menjaga tinggi kartu tetap sama SEBELUM foto selesai dimuat, supaya
     tata letak tidak melompat-lompat saat foto masuk satu per satu */
  #absensi-app .menu-kartu img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f1f5f9}
  #absensi-app .menu-noimg{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#f1f5f9;font-size:30px}
  #absensi-app .menu-isi{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
  #absensi-app .menu-isi b{font-size:13.5px;line-height:1.35;color:#0f172a}
  #absensi-app .menu-harga{font-size:14px;font-weight:800;color:#0d9488}
  #absensi-app .menu-isi button{margin-top:auto;width:100%}

  /* Mode daftar: tanpa foto, paling ringan dan paling cepat untuk kasir sibuk */
  #absensi-app .menu-list{display:flex;flex-direction:column;gap:6px}
  #absensi-app .menu-item-teks{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;background:#fff}
  #absensi-app .menu-item-teks b{font-size:14px}
  #absensi-app .menu-item-teks .menu-harga{font-size:13px}
  #absensi-app .menu-item-teks button{min-width:44px}

  /* ====== HALAMAN DEPAN: bagian tambahan (statistik, tentang, video, galeri) ====== */
  /* Animasi halus saat bagian halaman masuk ke layar -- memberi kesan modern tanpa
     library tambahan. Kalau JS gagal jalan, elemen tetap terlihat (kelas .tampil
     ditambahkan JS; default-nya sudah opacity 1 lewat aturan .no-anim di bawah). */
  #absensi-app .rhb-putar{width:34px;height:34px;margin:0 auto;border:4px solid #e2e8f0;border-top-color:var(--tema);border-radius:50%;animation:rhbPutar .9s linear infinite}
  @keyframes rhbPutar{to{transform:rotate(360deg)}}
  #absensi-app table.rhb-tabel{display:table;white-space:normal}
  #absensi-app table.rhb-tabel th,#absensi-app table.rhb-tabel td{white-space:normal}
  @media(max-width:480px){ #absensi-app table.rhb-tabel{font-size:12.5px!important} #absensi-app table.rhb-tabel th,#absensi-app table.rhb-tabel td{padding:6px 4px!important} }
  #absensi-app .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
  #absensi-app .reveal.tampil{opacity:1;transform:none}
  #absensi-app .no-anim .reveal{opacity:1;transform:none}

  #absensi-app .site-section.lebar{max-width:1100px}
  #absensi-app .sec-head{text-align:center;margin-bottom:22px}
  #absensi-app .sec-eyebrow{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0d9488;background:rgba(13,148,136,.09);padding:5px 14px;border-radius:20px;margin-bottom:10px}
  #absensi-app .sec-head h2{margin-bottom:6px}
  #absensi-app .sec-head p{font-size:13.5px;color:#64748b;max-width:560px;margin:0 auto;line-height:1.7}

  /* Statistik angka */
  #absensi-app .stat-band{background:linear-gradient(135deg,#0f766e,#134e4a);padding:30px 18px}
  #absensi-app .stat-grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media(min-width:768px){ #absensi-app .stat-grid{grid-template-columns:repeat(4,1fr)} }
  #absensi-app .stat-item{text-align:center;color:#fff}
  #absensi-app .stat-item .angka{font-size:30px;font-weight:800;line-height:1.1;color:#5eead4}

  /* ---- hero lebih menonjol, mengacu referensi desain sekolah modern ---- */
  #absensi-app .hero{padding:64px 20px 56px;background-size:cover;background-position:center;position:relative}
  #absensi-app .hero.ada-gambar{background-image:linear-gradient(rgba(15,23,26,.62),rgba(10,46,44,.72))}
  #absensi-app .hero-tagline{display:inline-block;background:rgba(255,255,255,.14);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:14px;text-transform:uppercase}
  #absensi-app .hero-cta{display:inline-block;margin-top:18px;background:#fff;color:#0f766e;padding:11px 26px;border-radius:24px;font-weight:700;font-size:13.5px;cursor:pointer;border:none;text-decoration:none}
  #absensi-app .hero-samar{opacity:.45;transition:opacity .25s ease}
  #absensi-app .hero-samar:hover,#absensi-app .hero-samar:active,#absensi-app .hero-samar:focus{opacity:1}

  /* ---- kartu ikon/foto (Program Unggulan / Fasilitas) ---- */
  #absensi-app .fitur-grid{display:grid;grid-template-columns:1fr;gap:14px}
  #absensi-app .ringkasan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  @media(min-width:640px){ #absensi-app .ringkasan-grid{grid-template-columns:repeat(4,1fr)} }
  #absensi-app .ringkasan-tile{background:#fff;border-radius:14px;padding:16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);border-left:4px solid var(--tema);text-align:left}
  #absensi-app .ringkasan-tile.warna-merah{border-left-color:#dc2626}
  #absensi-app .ringkasan-tile.warna-hijau{border-left-color:#16a34a}
  #absensi-app .ringkasan-tile.warna-amber{border-left-color:#d97706}
  #absensi-app .ringkasan-tile .ico{font-size:22px;margin-bottom:6px}
  #absensi-app .ringkasan-tile .nilai{font-size:22px;font-weight:800;color:#0f172a;line-height:1.15}
  #absensi-app .ringkasan-tile .label{font-size:11.5px;color:#64748b;text-transform:uppercase;letter-spacing:.03em;margin-top:3px}
  #absensi-app .ringkasan-tile .sub{font-size:11.5px;color:#94a3b8;margin-top:4px}
  #absensi-app .fitur-card{background:#fff;border-radius:12px;padding:20px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #eef2f6;overflow:hidden}
  #absensi-app .fitur-card.punya-foto{padding:0 0 16px}
  #absensi-app .fitur-card img{width:100%;height:130px;object-fit:cover;display:block;margin-bottom:12px}
  #absensi-app .fitur-card.punya-foto h4,#absensi-app .fitur-card.punya-foto p{padding-left:16px;padding-right:16px}
  #absensi-app .fitur-icon{width:52px;height:52px;border-radius:14px;background:rgba(13,148,136,.1);color:#0d9488;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
  #absensi-app .fitur-card h4{font-size:14.5px;color:#1e293b;margin-bottom:6px}
  #absensi-app .fitur-card p{font-size:12.5px;color:#64748b;line-height:1.6;margin:0}
  @media(min-width:768px){ #absensi-app .fitur-grid{grid-template-columns:repeat(3,1fr)} }
  #absensi-app .fitur-grid.fasilitas{grid-template-columns:repeat(2,1fr)}
  @media(min-width:768px){ #absensi-app .fitur-grid.fasilitas{grid-template-columns:repeat(4,1fr)} }

  /* ---- Visi & Misi ---- */
  #absensi-app .visimisi-wrap{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:768px){ #absensi-app .visimisi-wrap{grid-template-columns:1fr 1fr} }
  #absensi-app .visimisi-card{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:12px;padding:20px}
  #absensi-app .visimisi-card h4{color:#0f766e;font-size:14px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  #absensi-app .visimisi-card p{color:#334155;font-size:13.5px;line-height:1.7;white-space:pre-line;margin:0}

  /* ---- pita berjalan (marquee) ---- */

  #absensi-app .kontak-grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:768px){ #absensi-app .kontak-grid{grid-template-columns:repeat(3,1fr)} }
  #absensi-app .kontak-card{background:#fff;border:1px solid #eef2f6;border-radius:12px;padding:18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}

  #absensi-app .wa-float{position:fixed;left:14px;bottom:118px;z-index:400;background:#25D366;color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #absensi-app .menu-ibadah-float{position:fixed;right:14px;bottom:14px;z-index:400;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  #absensi-app .menu-ibadah-btn{width:48px;height:48px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;opacity:.5;transition:opacity .2s ease}
  #absensi-app .menu-ibadah-btn:hover,#absensi-app .menu-ibadah-btn:active,#absensi-app .menu-ibadah-btn:focus{opacity:1}
  #absensi-app .menu-ibadah-btn .tip{position:absolute;right:56px;top:50%;transform:translateY(-50%);background:#0f172a;color:#fff;font-size:11px;padding:4px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
  #absensi-app .menu-ibadah-btn:hover .tip{opacity:1}

  @media(min-width:768px){
    #absensi-app .hero h1{font-size:30px}
    #absensi-app .artikel-grid{grid-template-columns:repeat(3,1fr)}
  }
  /* =====================================================================
     BERANDA v2 (navy & emas) -- HANYA berlaku untuk halaman depan publik.
     Semua aturan dibatasi di dalam ".bv2" dan memakai nama class baru ("bv-"),
     jadi dashboard, kasir, absensi, dll. sama sekali tidak tersentuh.
     Warna halaman depan sengaja tetap navy-emas; Warna Tema dari Admin tetap
     dipakai untuk dashboard seperti biasa.
     ===================================================================== */
  #absensi-app .bv2{
    --navy:#0b2c5f;--navy-tua:#071d40;--emas:#f2b705;--tinta:#0f1b33;--redup:#5b6779;
    --garis:#dfe5ee;--latar-alt:#f3f6fa;--wa:#25d366;
    --tema:#0b2c5f;--tema-dark:#071d40;
    --bv-font:'Plus Jakarta Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-family:var(--bv-font);color:var(--tinta);background:#fff;line-height:1.6;overflow-x:clip
  }
  #absensi-app .bv2 .bv-isi{max-width:1120px;margin:0 auto;padding-left:20px;padding-right:20px}
  #absensi-app .bv2 h1,#absensi-app .bv2 h2,#absensi-app .bv2 h3,#absensi-app .bv2 h4{font-family:var(--bv-font);color:var(--tinta)}
  #absensi-app .bv2 .bv-label{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--navy);margin-bottom:12px}
  #absensi-app .bv2 .bv-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--emas);flex:none}
  #absensi-app .bv2 .bv-gelap .bv-label{color:#cfd9ea}

  /* Navigasi */
  /* Menu atas menempel di layar saat digulir. Pakai fixed (bukan sticky) karena wadah
     aplikasi memakai overflow-x:hidden yang membuat sticky tidak bekerja. */
  #absensi-app .bv2{padding-top:71px}
  #absensi-app .bv2 .bv-nav{position:fixed;top:0;left:0;right:0;max-width:1300px;margin:0 auto;z-index:600;background:#fff;border-bottom:1px solid var(--garis)}
  #absensi-app .bv2 .bv-sec{scroll-margin-top:71px}
  #absensi-app .bv2 .bv-nav>.bv-isi{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:12px;padding-bottom:12px}
  #absensi-app .bv2 .bv-brand{display:flex;align-items:center;gap:12px;min-width:0}
  #absensi-app .bv2 .bv-brand .bv-logo{width:46px;height:46px;flex:none;display:grid;place-items:center;background:#fff;padding:2px}
  #absensi-app .bv2 .bv-brand .bv-logo img{width:100%;height:100%;object-fit:contain;display:block}
  #absensi-app .bv2 .bv-brand .bv-nama{display:flex;flex-direction:column;min-width:0}
  #absensi-app .bv2 .bv-brand b{font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (min-width:901px){ #absensi-app .bv2 .bv-brand b{white-space:normal;letter-spacing:.08em;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical} }
  /* Laci login yang tersembunyi di luar layar tidak perlu bayangan (dulu tampak garis abu di tepi kanan) */
  #absensi-app .bv2 .login-drawer:not(.show){box-shadow:none}
  #absensi-app .bv2 .bv-brand small{font-size:10px;font-weight:600;line-height:1.3;margin-bottom:2px;letter-spacing:.28em;text-transform:uppercase;color:var(--redup);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #absensi-app .bv2 .bv-links{display:flex;align-items:center;gap:6px}
  #absensi-app .bv2 .bv-links a.bv-tautan{font-size:13px;font-weight:600;color:var(--tinta);text-decoration:none;padding:8px 10px;cursor:pointer}
  #absensi-app .bv2 .bv-links a.bv-tautan:hover{color:var(--navy)}
  #absensi-app .bv2 .bv-tombol-baris{display:flex;gap:6px;align-items:center}
  #absensi-app .bv2 .bv-btn{font:700 12.5px var(--bv-font);letter-spacing:.04em;border:1px solid transparent;border-radius:2px;padding:9px 14px;margin:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:#fff;background:var(--navy);width:auto}
  #absensi-app .bv2 .bv-btn:hover{background:var(--navy-tua);color:#fff}
  #absensi-app .bv2 .bv-btn.garis{background:#fff;color:var(--navy);border-color:var(--garis)}
  #absensi-app .bv2 .bv-btn.garis:hover{border-color:var(--navy)}
  #absensi-app .bv2 .bv-btn.emas{background:var(--emas);color:var(--navy-tua)}
  #absensi-app .bv2 .bv-menu-btn{display:none;width:44px;height:44px;border:0;background:none;cursor:pointer;padding:10px;margin:0;flex:none;border-radius:0}
  #absensi-app .bv2 .bv-menu-btn:hover{background:none}
  #absensi-app .bv2 .bv-menu-btn span{display:block;height:3px;margin:5px 0;background:var(--navy)}
  #absensi-app .bv2 .bv-menu-btn span:nth-child(2){background:var(--emas);width:70%}
  #absensi-app .bv2 .bv-menu-btn span:nth-child(3){width:45%}
  @media (max-width:900px){
    #absensi-app .bv2 .bv-menu-btn{display:block}
    #absensi-app .bv2 .bv-links{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--garis);flex-direction:column;align-items:stretch;padding:8px 20px 16px;box-shadow:0 12px 24px rgba(11,44,95,.08)}
    #absensi-app .bv2 .bv-nav.buka .bv-links{display:flex}
    #absensi-app .bv2 .bv-links a.bv-tautan{padding:12px 0;border-bottom:1px solid var(--garis)}
    #absensi-app .bv2 .bv-links .bv-btn{padding:12px}
    #absensi-app .bv2 .bv-tombol-baris{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  }

  /* Hero */
  #absensi-app .bv2 .bv-hero{position:relative;background:linear-gradient(180deg,#fff 0%,var(--latar-alt) 100%);border-bottom:1px solid var(--garis);overflow:hidden}
  #absensi-app .bv2 .bv-hero>.bv-isi{padding-top:56px;padding-bottom:64px;position:relative;z-index:1}
  #absensi-app .bv2 .bv-hero::after{content:"";position:absolute;right:-60px;top:-40px;width:340px;height:340px;border:1px solid var(--garis);transform:rotate(45deg);opacity:.7}
  #absensi-app .bv2 .bv-hero.ada-gambar{background-size:cover;background-position:center;border-bottom:0}
  /* Foto sampul dibiarkan terlihat: lapisan gelap hanya tipis di atas dan menebal di bawah
     tempat judul berada, supaya tulisan tetap terbaca tanpa menutupi foto. */
  #absensi-app .bv2 .bv-hero.ada-gambar::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,29,64,.15) 0%,rgba(7,29,64,.35) 45%,rgba(7,29,64,.85) 100%)}
  #absensi-app .bv2 .bv-hero.ada-gambar{min-height:clamp(240px,56vw,560px);display:flex;align-items:flex-end}
  #absensi-app .bv2 .bv-hero.ada-gambar>.bv-isi{width:100%;padding-top:40px;padding-bottom:26px}
  #absensi-app .bv2 .bv-hero.ada-gambar::before{background:linear-gradient(180deg,rgba(7,29,64,0) 0%,rgba(7,29,64,0) 55%,rgba(7,29,64,.65) 100%)}
  #absensi-app .bv2 .bv-sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
  #absensi-app .bv2 .bv-hero.ada-gambar h1{text-shadow:0 2px 14px rgba(0,0,0,.35)}
  #absensi-app .bv2 .bv-hero.ada-gambar .bv-garis-emas{margin-bottom:0}
  #absensi-app .bv2 .bv-hero.ada-gambar p{margin:16px 0 0}
  #absensi-app .bv2 .bv-hero.ada-gambar::after{border-color:rgba(255,255,255,.18)}
  #absensi-app .bv2 .bv-tagline{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--garis);background:#fff;padding:10px 18px;font-size:11.5px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--navy)}
  #absensi-app .bv2 .bv-tagline::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--emas);flex:none}
  #absensi-app .bv2 .bv-hero h1{font-weight:800;font-size:clamp(32px,7vw,62px);line-height:1.08;letter-spacing:-.01em;margin:22px 0 0;max-width:16ch}
  #absensi-app .bv2 .bv-hero h1 em{font-style:normal;color:var(--navy)}
  #absensi-app .bv2 .bv-garis-emas{width:72px;height:3px;background:var(--navy);margin:22px 0;position:relative}
  #absensi-app .bv2 .bv-garis-emas::after{content:"";position:absolute;left:100%;top:0;width:18px;height:3px;background:var(--emas)}
  #absensi-app .bv2 .bv-hero p{font-size:16.5px;color:var(--redup);max-width:58ch;margin:0 0 28px;white-space:pre-line}
  #absensi-app .bv2 .bv-hero.ada-gambar .bv-tagline{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:#fff}
  #absensi-app .bv2 .bv-hero.ada-gambar h1,#absensi-app .bv2 .bv-hero.ada-gambar h1 em{color:#fff}
  #absensi-app .bv2 .bv-hero.ada-gambar .bv-garis-emas{background:#fff}
  #absensi-app .bv2 .bv-hero.ada-gambar p{color:#dfe6f1}
  #absensi-app .bv2 .bv-aksi{display:flex;gap:12px;flex-wrap:wrap}
  #absensi-app .bv2 .bv-cta{font:700 12px var(--bv-font);letter-spacing:.12em;text-transform:uppercase;padding:12px 20px;margin:0;border-radius:2px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:auto}
  #absensi-app .bv2 .bv-cta:hover{background:var(--navy-tua);color:#fff}
  #absensi-app .bv2 .bv-cta.garis{background:#fff;color:var(--navy);border-color:var(--garis)}
  #absensi-app .bv2 .bv-cta.garis::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--emas)}
  #absensi-app .bv2 .bv-cta.emas{background:var(--emas);border-color:var(--emas);color:var(--navy-tua)}
  /* Tombol hero: ukuran ringkas. Kalau ada foto sampul, tombol dipindah ke pita putih di
     BAWAH foto (bv-aksi-bar) supaya foto tidak tertutup. */

<script>
  // ============ PWA: daftarkan service worker ============
  // Dibungkus try/catch + .catch() supaya kalau gagal (misal dibuka lewat pratinjau
  // file yang bukan hosting asli/production), aplikasi tetap jalan normal -- cuma
  // fitur offline-nya saja yang tidak aktif di konteks itu, bukan error yang mengganggu.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      try {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {

          // Cek kalau ada SW baru yang menunggu (misal user buka tab lama setelah deploy)
          if (reg.waiting) {
            tampilkanNotifUpdate(reg.waiting);
          }

          // SW baru ditemukan — menunggu untuk aktif
          reg.addEventListener('updatefound', function() {
            var swBaru = reg.installing;
            if (!swBaru) return;
            swBaru.addEventListener('statechange', function() {
              if (swBaru.state === 'installed' && navigator.serviceWorker.controller) {
                tampilkanNotifUpdate(swBaru);
              }
            });
          });

        }).catch(function(err) {
          console.warn('Service worker tidak aktif:', err.message || err);
        });

        // Terima pesan dari SW (misal: SW_UPDATED setelah activate)
        navigator.serviceWorker.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'SW_UPDATED') {
            tampilkanNotifUpdate(null); // sudah aktif, langsung minta reload
          }
        });

        // Kalau SW controller berubah (versi baru aktif) → reload otomatis
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) { refreshing = true; window.location.reload(); }
        });

      } catch (err) { /* bukan fitur wajib */ }
    });
  }

  // Tampilkan banner di atas halaman: "Versi baru tersedia — Perbarui Sekarang"
  function tampilkanNotifUpdate(swMenunggu) {
    // Jangan tampilkan dua kali
    if (document.getElementById('bannerUpdate')) return;
    var banner = document.createElement('div');
    banner.id = 'bannerUpdate';
    banner.style.cssText = [
      'position:fixed;top:0;left:0;right:0;z-index:99999',
      'background:#0d9488;color:#fff',
      'padding:10px 16px',
      'display:flex;align-items:center;justify-content:space-between',
      'font-family:\'Segoe UI\',Arial,sans-serif;font-size:13px;font-weight:500',
      'box-shadow:0 2px 8px rgba(0,0,0,.25)'
    ].join(';');
    banner.innerHTML =
      '<span>&#127381; Versi baru WASIAT tersedia!</span>' +
      '<div style="display:flex;gap:8px">' +
      '<button id="btnUpdateSekarang" style="background:#fff;color:#0d9488;border:none;padding:5px 12px;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px">Perbarui Sekarang</button>' +
      '<button id="btnTutupBannerUpdate" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px">Nanti</button>' +
      '</div>';
    document.body.prepend(banner);

    document.getElementById('btnUpdateSekarang').onclick = function() {
      if (swMenunggu) {
        // Perintahkan SW yang menunggu untuk langsung aktif
        swMenunggu.postMessage({ type: 'SKIP_WAITING' });
        // controllerchange event akan reload otomatis
      } else {
        window.location.reload();
      }
    };
    document.getElementById('btnTutupBannerUpdate').onclick = function() {
      banner.remove();
    };
  }

  // ============ PWA: tombol Install ============
  // Sinyal "beforeinstallprompt" dari browser TIDAK SELALU bisa diandalkan untuk
  // MENAMPILKAN tombol (kadang lambat/tidak muncul walau aplikasinya sebenarnya
  // sudah siap diinstal). Jadi sekarang tombol TAMPIL DEFAULT, dan HANYA
  // disembunyikan kalau ada sinyal yang PASTI aplikasi memang sudah terpasang:
  // - sedang berjalan dalam mode standalone (dibuka dari ikon Layar Utama), atau
  // - event "appinstalled" baru saja terjadi (baru selesai diinstal).
  var _deferredInstallPrompt = null;
  var _isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  var _sudahStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function _tampilkanTombolInstall(){
    var btn = document.getElementById('btnInstallPWA');
    if (!btn || _sudahStandalone) return;
    btn.style.display = 'block';
  }
  function _sembunyikanTombolInstall(){
    var btn = document.getElementById('btnInstallPWA');
    if (btn) btn.style.display = 'none';
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    _deferredInstallPrompt = e; // simpan supaya tombol bisa pakai prompt instal ASLI bawaan browser
  });
  window.addEventListener('appinstalled', function(){
    _sudahStandalone = true;
    _deferredInstallPrompt = null;
    _sembunyikanTombolInstall();
  });

  document.getElementById('btnInstallPWA').addEventListener('click', function(){
    if (_deferredInstallPrompt) {
      _deferredInstallPrompt.prompt();
      _deferredInstallPrompt.userChoice.then(function(res){
        _deferredInstallPrompt = null;
        if (res && res.outcome === 'accepted') _sembunyikanTombolInstall();
      });
      return;
    }
    if (_isIOS) {
      alert('Cara install di iPhone/iPad:\n\n1. Tap ikon Share/Bagikan (kotak dengan panah ke atas) di bagian bawah layar Safari.\n2. Pilih "Add to Home Screen" / "Tambah ke Layar Utama".\n3. Tap "Add" / "Tambah" di pojok kanan atas.\n\nIkon WASIAT akan muncul di layar utama HP Anda seperti aplikasi biasa.');
      return;
    }
    alert('Cara install aplikasi ini:\n\nDi Android (Chrome): tap menu titik tiga (\u22EE) di pojok kanan atas browser, lalu pilih "Install app" atau "Tambah ke layar Utama".\n\nDi komputer (Chrome/Edge): cari ikon install (gambar layar dengan panah, atau tanda +) di sebelah kanan kolom alamat browser, lalu klik.\n\nKalau tidak menemukan opsi ini dalam beberapa detik, coba muat ulang halaman ini sekali.');
  });

  // Tampilkan default. Kalau ternyata sedang berjalan sebagai app terpasang
  // (standalone), _tampilkanTombolInstall() otomatis tidak melakukan apa-apa.
  _tampilkanTombolInstall();
</script>
