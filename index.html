<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WASIAT - Wihdatul Ummah Poso</title>
<meta name="description" content="Aplikasi Absensi & Hafalan Santri Pondok Pesantren Wihdatul Ummah Poso">

<!-- ============ PWA: manifest, ikon, warna tema ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASIAT">
</head>
<body style="margin:0;padding:0">

<!-- Tombol Install PWA (tersembunyi default -- hanya muncul kalau terdeteksi belum terpasang) -->
<button id="btnInstallPWA" style="display:none;position:fixed;left:14px;bottom:14px;z-index:99999;background:#0d9488;color:#fff;border:none;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(15,118,110,.35);cursor:pointer;font-family:'Segoe UI',Arial,sans-serif">
  &#128241; Instal Aplikasi WASIAT
</button>

<!-- Lencana status data offline (mengambang, hanya tampil kalau ada data belum tersinkron) -->
<div id="outboxBadge" style="display:none;position:fixed;right:14px;bottom:14px;z-index:99999;background:#f59e0b;color:#fff;padding:10px 14px;border-radius:24px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);align-items:center;gap:8px;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer" onclick="sinkronkanOutbox()">
  &#9203; <span id="outboxCount">0</span> data belum tersinkron -- tap untuk coba lagi
</div>

<!--
  ====================================================================
  WASIAT - Aplikasi Absensi & Hafalan Santri
  Pondok Pesantren Wihdatul Ummah Poso, Sulawesi Tengah
  Versi PWA (dihosting mandiri di Vercel) -- lihat README.md untuk cara deploy.
  ====================================================================
-->
<div id="absensi-app">
  <div style="text-align:center;padding:60px 20px;font-family:'Segoe UI',Arial,sans-serif;color:#0f766e">Memuat aplikasi...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  #absensi-app{
    max-width:1300px;margin:0 auto;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;
    --tema:#0d9488;--tema-dark:#0f766e;--tema-light:#ccfbf1;--sidebar-bg:#134e4a;background:#f1f5f9;
    overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  #absensi-app *{box-sizing:border-box;max-width:100%}
  #absensi-app img{max-width:100%;height:auto}

  /* ---- layout shell: sidebar geser (tersembunyi default) + konten utama ---- */
  #absensi-app .app-shell{display:flex;min-height:100vh;position:relative}
  #absensi-app .sidebar{
    width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar-bg),#0a2e2c);color:#e2f5f3;
    display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;overflow-y:auto;
    transform:translateX(-100%);transition:transform .25s ease;z-index:1000;box-shadow:2px 0 16px rgba(0,0,0,.25);
  }
  #absensi-app .sidebar.open{transform:translateX(0)}
  #absensi-app .sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  #absensi-app .sidebar-brand img{height:38px;width:38px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;flex-shrink:0}
  #absensi-app .sidebar-brand .nm{font-size:13px;font-weight:600;line-height:1.3}
  #absensi-app .sidebar-nav{flex:1;padding:10px 8px}
  #absensi-app .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;
    color:#c9e8e4;font-size:13.5px;margin-bottom:2px;white-space:nowrap;
  }
  #absensi-app .nav-item .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
  #absensi-app .nav-item:hover{background:rgba(255,255,255,.08)}
  #absensi-app .nav-item.active{background:var(--tema);color:#fff;font-weight:600}
  #absensi-app .sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
  #absensi-app .sidebar-user .nm{font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #absensi-app .sidebar-user .lvl{color:#9fd8d2;margin-bottom:8px}
  #absensi-app .sidebar-user button{width:100%;background:rgba(255,255,255,.14);margin:0}
  #absensi-app .sidebar-user button:hover{background:rgba(255,255,255,.24)}
  #absensi-app .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999}
  #absensi-app .sidebar-overlay.show{display:block}
  #absensi-app .main-content{flex:1;min-width:0;padding:0 22px 40px}
  #absensi-app .mobile-topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:sticky;top:0;background:#f1f5f9;padding:10px 0;z-index:50}
  #absensi-app .hamburger-btn{background:var(--tema);color:#fff;border:none;width:38px;height:38px;border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;margin:0}
  #absensi-app .mobile-title{font-size:15px;font-weight:600;color:var(--tema-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (max-width:860px){
    #absensi-app .main-content{padding:0 12px 32px}
  }

  /* ---- kartu, form, tombol ---- */
  #absensi-app .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,118,110,.07)}
  #absensi-app h2{margin:0 0 10px;color:#0f2f2d}
  #absensi-app h3{margin:0 0 10px;color:#0f2f2d;font-size:16px}
  #absensi-app h4{margin:10px 0 6px;color:#134e4a;font-size:13.5px}
  #absensi-app label{display:block;font-size:12.5px;color:#475569;margin-bottom:3px;font-weight:500}
  #absensi-app input,#absensi-app select,#absensi-app textarea{
    width:100%;padding:9px 10px;margin:0 0 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff;color:#1e293b;
  }
  #absensi-app input:focus,#absensi-app select:focus,#absensi-app textarea:focus{outline:none;border-color:var(--tema);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  #absensi-app button{background:var(--tema);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;margin-right:6px;margin-bottom:6px;transition:background .15s}
  #absensi-app button:hover{background:var(--tema-dark)}
  #absensi-app button.secondary{background:#64748b}
  #absensi-app button.secondary:hover{background:#475569}
  #absensi-app button.danger{background:#dc2626}
  #absensi-app button.danger:hover{background:#b91c1c}
  #absensi-app button.small{padding:6px 11px;font-size:12px}
  #absensi-app button:disabled{opacity:.55;cursor:not-allowed}

  /* ---- tabel: digeser ke samping, TIDAK ADA teks bertumpuk/wrap ---- */
  #absensi-app table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;white-space:nowrap}
  #absensi-app th,#absensi-app td{border:1px solid #e2e8f0;padding:7px 9px;text-align:left;white-space:nowrap}
  #absensi-app th{background:var(--tema-light);color:#0f4c4c;font-weight:600}

  #absensi-app .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  #absensi-app .tab-btn{background:#eef2f7;color:#334155;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap}
  #absensi-app .tab-btn.active{background:var(--tema);color:#fff}

  #absensi-app .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand{display:flex;align-items:center;gap:10px}
  #absensi-app .brand img{height:42px;width:42px;object-fit:contain;border-radius:8px}

  #absensi-app .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap}
  #absensi-app .badge.Hadir{background:#0d9488}
  #absensi-app .badge.Sakit{background:#f59e0b}
  #absensi-app .badge.Izin{background:#2563eb}
  #absensi-app .badge.Alpa{background:#dc2626}
  #absensi-app .badge-hafalan{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap}
  #absensi-app .badge-hafalan.sabaq{background:#0d9488}
  #absensi-app .badge-hafalan.sabqi{background:#0891b2}
  #absensi-app .badge-hafalan.manzil{background:#7c3aed}
  #absensi-app .badge-hafalan.murojaah{background:#0284c7}
  #absensi-app .badge-hafalan.tahsin{background:#16a34a}
  #absensi-app .badge-hafalan.tidaksetor{background:#64748b}
  #absensi-app .badge-hafalan.izin{background:#2563eb}
  #absensi-app .badge-hafalan.sakit{background:#f59e0b}
  #absensi-app .badge-hafalan.ghaib{background:#dc2626}
  #absensi-app .progress{background:#e2e8f0;border-radius:8px;overflow:hidden;height:14px;width:100%}
  #absensi-app .progress-bar{background:var(--tema);height:14px}

  #absensi-app .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #absensi-app .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  @media (max-width:560px){
    #absensi-app .grid2{grid-template-columns:1fr}
    #absensi-app .grid4{grid-template-columns:repeat(2,1fr)}
  }

  #absensi-app .muted{color:#64748b;font-size:12px}
  #absensi-app .faded{color:#94a3b8;font-size:11px;font-style:italic}
  #absensi-app .warn{background:#fffbeb;border:1px solid #fcd34d;padding:10px;border-radius:8px;color:#92400e;font-size:13px}
  #absensi-app .err{background:#fef2f2;border:1px solid #fca5a5;padding:10px;border-radius:8px;color:#b91c1c;font-size:13px}

  #absensi-app .overlay{position:fixed;inset:0;background:rgba(15,42,40,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
  #absensi-app .modal{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}

  #absensi-app .santriRowAbsen{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .santriRowHafalan{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .juzchip{display:inline-block;background:var(--tema);color:#fff;border-radius:20px;padding:4px 10px;margin:2px;font-size:12px}
  #absensi-app .juzchip.proses{background:#f59e0b}

  /* ---- slide pengumuman (ringan, tanpa library luar) ---- */
  #absensi-app .slidebar{position:relative;width:100%;aspect-ratio:16/6;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#e2e8f0;box-shadow:0 2px 10px rgba(15,118,110,.12)}
  #absensi-app .slidebar-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;}
  #absensi-app .slidebar-slide.active{opacity:1;z-index:1}
  #absensi-app .slidebar-slide img{width:100%;height:100%;object-fit:cover;display:block}
  #absensi-app .slidebar-caption{position:absolute;left:0;right:0;bottom:0;padding:10px 46px 10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;font-weight:600}
  #absensi-app .slidebar-dots{position:absolute;bottom:9px;right:10px;display:flex;gap:5px;z-index:2}
  #absensi-app .slidebar-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
  #absensi-app .slidebar-dot.active{background:#fff}
  #absensi-app .slidebar-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;margin:0;padding:0}
  #absensi-app .slidebar-arrow:hover{background:rgba(0,0,0,.55)}
  #absensi-app .slidebar-arrow.prev{left:8px}
  #absensi-app .slidebar-arrow.next{right:8px}
  @media (max-width:560px){ #absensi-app .slidebar{aspect-ratio:16/9} }

  /* ---- website depan (beranda publik) ---- */
  #absensi-app .site-nav{position:sticky;top:0;z-index:600;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand2{display:flex;align-items:center;gap:11px}
  #absensi-app .brand2 img{height:46px;width:46px;object-fit:contain;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 2px 6px rgba(0,0,0,.08);background:#fff;padding:2px}
  #absensi-app .brand2 span{font-weight:800;color:#0f766e;font-size:15px;line-height:1.25}
  #absensi-app .site-nav-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #absensi-app .site-nav-links a{color:#334155;font-size:13.5px;font-weight:600;cursor:pointer}
  #absensi-app .site-nav-links a:hover{color:#0d9488}
  #absensi-app .btn-masuk{background:var(--tema);color:#fff;border:none;padding:9px 20px;border-radius:20px;font-weight:700;cursor:pointer;font-size:13px;margin:0;width:auto}
  #absensi-app .hero{background:linear-gradient(150deg,#0f766e,#134e4a 65%,#0a2e2c);color:#fff;padding:50px 20px;text-align:center}
  #absensi-app .hero img{height:84px;width:84px;object-fit:contain;margin-bottom:14px;border-radius:14px;background:#fff;padding:8px}
  #absensi-app .hero h1{font-size:23px;margin-bottom:8px}
  #absensi-app .hero p{opacity:.92;max-width:560px;margin:0 auto;font-size:14px;line-height:1.6}
  #absensi-app .site-section{padding:36px 18px;max-width:900px;margin:0 auto}
  #absensi-app .site-section h2{font-size:19px;color:#0f766e;margin-bottom:14px;text-align:center}
  #absensi-app .artikel-grid{display:grid;grid-template-columns:1fr;gap:16px}
  #absensi-app .artikel-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s}
  #absensi-app .artikel-card:hover{transform:translateY(-3px)}
  #absensi-app .artikel-card img{width:100%;height:150px;object-fit:cover;display:block;background:#e2e8f0}
  #absensi-app .artikel-card-body{padding:13px}
  #absensi-app .artikel-card-kat{display:inline-block;background:rgba(13,148,136,.1);color:#0d9488;font-size:10px;font-weight:700;padding:2px 9px;border-radius:12px;margin-bottom:6px}
  #absensi-app .artikel-card h4{font-size:14px;margin-bottom:4px;color:#1e293b}
  #absensi-app .artikel-card p{font-size:12px;color:#64748b;margin:0}
  #absensi-app .site-footer{background:#0f172a;color:#94a3b8;padding:24px 18px;text-align:center;font-size:12px;line-height:1.8}
  #absensi-app .login-drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998;display:none}
  #absensi-app .login-drawer-bg.show{display:block}
  #absensi-app .login-drawer{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:88vw;background:#fff;z-index:9999;box-shadow:-6px 0 24px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .25s ease;padding:26px 22px;overflow-y:auto}
  #absensi-app .login-drawer.show{transform:translateX(0)}
  #absensi-app .login-drawer-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:24px;cursor:pointer;color:#64748b;width:auto;margin:0;padding:2px 6px}

  /* ---- hero lebih menonjol, mengacu referensi desain sekolah modern ---- */
  #absensi-app .hero{padding:64px 20px 56px;background-size:cover;background-position:center;position:relative}
  #absensi-app .hero.ada-gambar{background-image:linear-gradient(rgba(15,23,26,.62),rgba(10,46,44,.72))}
  #absensi-app .hero-tagline{display:inline-block;background:rgba(255,255,255,.14);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:14px;text-transform:uppercase}
  #absensi-app .hero-cta{display:inline-block;margin-top:18px;background:#fff;color:#0f766e;padding:11px 26px;border-radius:24px;font-weight:700;font-size:13.5px;cursor:pointer;border:none;text-decoration:none}

  /* ---- kartu ikon/foto (Program Unggulan / Fasilitas) ---- */
  #absensi-app .fitur-grid{display:grid;grid-template-columns:1fr;gap:14px}
  #absensi-app .fitur-card{background:#fff;border-radius:12px;padding:20px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #eef2f6;overflow:hidden}
  #absensi-app .fitur-card.punya-foto{padding:0 0 16px}
  #absensi-app .fitur-card img{width:100%;height:130px;object-fit:cover;display:block;margin-bottom:12px}
  #absensi-app .fitur-card.punya-foto h4,#absensi-app .fitur-card.punya-foto p{padding-left:16px;padding-right:16px}
  #absensi-app .fitur-icon{width:52px;height:52px;border-radius:14px;background:rgba(13,148,136,.1);color:#0d9488;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
  #absensi-app .fitur-card h4{font-size:14.5px;color:#1e293b;margin-bottom:6px}
  #absensi-app .fitur-card p{font-size:12.5px;color:#64748b;line-height:1.6;margin:0}
  @media(min-width:768px){ #absensi-app .fitur-grid{grid-template-columns:repeat(3,1fr)} }
  #absensi-app .fitur-grid.fasilitas{grid-template-columns:repeat(2,1fr)}
  @media(min-width:768px){ #absensi-app .fitur-grid.fasilitas{grid-template-columns:repeat(4,1fr)} }

  /* ---- Visi & Misi ---- */
  #absensi-app .visimisi-wrap{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:768px){ #absensi-app .visimisi-wrap{grid-template-columns:1fr 1fr} }
  #absensi-app .visimisi-card{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:12px;padding:20px}
  #absensi-app .visimisi-card h4{color:#0f766e;font-size:14px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  #absensi-app .visimisi-card p{color:#334155;font-size:13.5px;line-height:1.7;white-space:pre-line;margin:0}

  /* ---- pita berjalan (marquee) ---- */
  #absensi-app .marquee-band{background:#134e4a;overflow:hidden;padding:14px 0;white-space:nowrap}
  #absensi-app .marquee-track{display:inline-block;animation:spMarquee 22s linear infinite;color:#5eead4;font-weight:800;font-size:20px;letter-spacing:2px}
  @keyframes spMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* ---- Kontak / WA ---- */
  #absensi-app .kontak-grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:768px){ #absensi-app .kontak-grid{grid-template-columns:repeat(3,1fr)} }
  #absensi-app .kontak-card{background:#fff;border:1px solid #eef2f6;border-radius:12px;padding:18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  #absensi-app .kontak-card .fitur-icon{margin-bottom:10px}
  #absensi-app .kontak-card a{color:#0d9488;font-weight:700;text-decoration:none;font-size:13.5px}
  #absensi-app .kontak-card p{font-size:13px;color:#475569;margin:0}
  #absensi-app .wa-float{position:fixed;left:14px;bottom:118px;z-index:400;background:#25D366;color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #absensi-app .menu-ibadah-float{position:fixed;right:14px;bottom:14px;z-index:400;display:flex;flex-direction:column;gap:10px;align-items:flex-end}

  // ---------------- MODE OFFLINE: antrian & auto-sinkron ----------------
  // Aksi "menyimpan data" boleh diantre saat offline dan otomatis dikirim ulang
  // begitu koneksi kembali. Aksi "membaca data" (getX) TIDAK diantre -- kalau
  // offline, cukup tampilkan pesan gagal seperti biasa (data tidak mungkin dibaca
  // tanpa jaringan sama sekali, jadi tidak ada gunanya diantre).
  var AKSI_BISA_OFFLINE = ['submitAbsensi','submitHafalan','submitNilai'];
  var OUTBOX_KEY = 'wasiatOutboxV1';
  function getOutbox(){ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch(e){ return []; } }
  function setOutbox(arr){ localStorage.setItem(OUTBOX_KEY, JSON.stringify(arr)); perbaruiLencanaOutbox(); }
  function perbaruiLencanaOutbox(){
    var n = getOutbox().length;
    var el = document.getElementById('outboxBadge');
    if (el) el.style.display = n > 0 ? 'flex' : 'none';
    var elN = document.getElementById('outboxCount');
    if (elN) elN.textContent = n;
  }

  function apiJaringan(action, payload){
    if (!WEBAPP_URL || WEBAPP_URL.indexOf('PASTE_URL_WEBAPP') === 0) {
      return Promise.resolve({ok:false, error:'URL Web App belum diisi. Buka index.html dan isi WEBAPP_URL.'});
    }
    return fetch(WEBAPP_URL, { method:'POST', body: JSON.stringify({action:action, payload:payload||{}}) })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(txt){ try { return JSON.parse(txt); } catch(e){ throw new Error('Respon server tidak valid'); } })
      .catch(function(err){ return {ok:false, error: 'Gagal terhubung ke server: ' + err.message, _jaringanGagal:true}; });
  }

  function api(action, payload){
    var bisaDiantre = AKSI_BISA_OFFLINE.indexOf(action) !== -1;
    if (bisaDiantre && !navigator.onLine) {
      var outbox = getOutbox();
      outbox.push({action:action, payload:payload, waktu:new Date().toISOString()});
      setOutbox(outbox);
      return Promise.resolve({ok:true, offline:true, ditambah:(payload && payload.items ? payload.items.length : 0), diupdate:0,
        pesanOffline:'Sedang offline -- data disimpan di perangkat ini dan akan otomatis terkirim begitu internet tersambung lagi.'});
    }
    return apiJaringan(action, payload).then(function(res){
      if (bisaDiantre && !res.ok && res._jaringanGagal) {
        var outbox2 = getOutbox();
        outbox2.push({action:action, payload:payload, waktu:new Date().toISOString()});
        setOutbox(outbox2);
        return {ok:true, offline:true, ditambah:(payload && payload.items ? payload.items.length : 0), diupdate:0,
          pesanOffline:'Sedang offline -- data disimpan di perangkat ini dan akan otomatis terkirim begitu internet tersambung lagi.'};
      }
      return res;
    });
  }

  // Kirim ulang semua data yang tertunda, satu-satu berurutan, berhenti kalau ada
  // yang masih gagal (dicoba lagi nanti saat online lagi / dipicu manual).
  var SEDANG_SINKRON = false;
  function sinkronkanOutbox(){
    if (SEDANG_SINKRON) return;
    var sisa = getOutbox();
    if (!sisa.length) return;
    SEDANG_SINKRON = true;
    function prosesSatu(){
      if (!sisa.length) { setOutbox(sisa); SEDANG_SINKRON = false; return; }
      var item = sisa[0];
      apiJaringan(item.action, item.payload).then(function(res){
        if (res.ok) { sisa.shift(); setOutbox(sisa); prosesSatu(); }
        else { setOutbox(sisa); SEDANG_SINKRON = false; }
      }).catch(function(){ setOutbox(sisa); SEDANG_SINKRON = false; });
    }
    prosesSatu();
  }
  window.addEventListener('online', sinkronkanOutbox);
  window.addEventListener('load', function(){ perbaruiLencanaOutbox(); if (navigator.onLine) sinkronkanOutbox(); });

  function render(html){ root.innerHTML = html; }

  function errBox(msg){ return '<div class="err">⚠️ ' + esc(msg) + '</div>'; }

  // Santri/Guru/Mapel supaya konsisten dan datanya selalu diambil dari database aktif.
  function fieldAutocomplete(id, label, options, value, placeholder){

    return '<label>'+esc(label)+'</label><input id="'+id+'" list="'+listId+'" autocomplete="off" placeholder="'+esc(placeholder||'Ketik untuk mencari...')+'" value="'+esc(value||'')+'">' + dl;
  }
  // Cocokkan input santri (format tampilan "NISN - Nama") kembali ke NISN yang valid.
  // Menerima juga jika user hanya mengetik NISN saja atau nama persis.
  function resolveSantriNisn(raw, santriList){
    raw = String(raw||'').trim();
    if (!raw) return null;
    var m = santriList.find(function(s){ return (s.nisn+' - '+s.nama) === raw; });
    if (m) return m.nisn;
    m = santriList.find(function(s){ return s.nisn === raw; });
    if (m) return m.nisn;
    m = santriList.find(function(s){ return s.nama.toLowerCase() === raw.toLowerCase(); });
    return m ? m.nisn : null;
  }
  function labelSantri(s){ return s.nisn + ' - ' + s.nama; }
  // Ayat maupun Halaman disimpan sebagai teks rentang "dari - sampai" (contoh: "2 - 21").
  // Fungsi generik ini memecah nilai lama (baik format rentang maupun angka tunggal)
  // jadi {awal, akhir} supaya form Isi Hafalan bisa menampilkan kembali sebagai dua kolom.
  function parseRange(raw){
    raw = String(raw==null?'':raw).trim();
    if (!raw) return {awal:'', akhir:''};
    var parts = raw.split('-').map(function(x){return x.trim();});
    if (parts.length >= 2 && parts[0] !== '' && parts[1] !== '') return {awal: parts[0], akhir: parts[1]};
    return {awal: parts[0], akhir: ''};
  }
  // Cocokkan nama guru persis dengan daftar Guru (strict) -- penting karena nama ini
  // dipakai untuk mencocokkan akun login guru di banyak fitur (jadwal, halaqoh, dll).
  function resolveGuruExact(raw, guruNames){
    raw = String(raw||'').trim();
    var m = guruNames.find(function(g){ return g === raw; });
    return m || null;
  }

      wrap.innerHTML = res.data.map(function(a,i){
        var gambarHtml = a.gambar ? '<img src="'+esc(a.gambar)+'" loading="lazy">' : '<div style="height:150px;background:#e2e8f0"></div>';
        var excerpt = (a.konten||'').replace(/\s+/g,' ').trim();
        if (excerpt.length > 80) excerpt = excerpt.substring(0,80) + '...';
        return '<div class="artikel-card" data-i="'+i+'">'+gambarHtml+'<div class="artikel-card-body"><span class="artikel-card-kat">'+esc(a.kategori)+'</span><h4>'+esc(a.judul)+'</h4><p>'+esc(excerpt)+'</p></div></div>';
      }).join('');
      wrap.querySelectorAll('.artikel-card').forEach(function(el){
        el.onclick = function(){ bukaDetailArtikel(res.data[Number(el.dataset.i)]); };
      });
    });

    api('getFiturBerandaList', {}).then(function(res){
      var wrapProgram = document.getElementById('berandaProgramWrap');
      var wrapFasilitas = document.getElementById('berandaFasilitasWrap');
      if (!res.ok || !res.data.length) {
        if (wrapProgram) wrapProgram.innerHTML = '<p class="muted" style="text-align:center;grid-column:1/-1">Belum diatur.</p>';
        if (wrapFasilitas) wrapFasilitas.innerHTML = '<p class="muted" style="text-align:center;grid-column:1/-1">Belum diatur.</p>';
        return;
      }
      var program = res.data.filter(function(f){ return f.kategori === 'Program'; });
      var fasilitas = res.data.filter(function(f){ return f.kategori === 'Fasilitas'; });
      if (wrapProgram) wrapProgram.innerHTML = program.length ? program.map(kartuFitur).join('') : '<p class="muted" style="text-align:center;grid-column:1/-1">Belum ada.</p>';
      if (wrapFasilitas) wrapFasilitas.innerHTML = fasilitas.length ? fasilitas.map(kartuFitur).join('') : '<p class="muted" style="text-align:center;grid-column:1/-1">Belum ada.</p>';
    });

  // Layout sidebar responsif dipakai Dashboard Guru & Admin/Mudir.
  // Desktop: sidebar tetap tampil di kiri. Mobile (<=860px): sidebar tersembunyi,
  // dibuka lewat tombol hamburger sebagai panel geser dengan overlay gelap.
  // ---------------- SLIDE PENGUMUMAN (ringan, tanpa library luar) ----------------
  // Satu timer global saja (dibersihkan tiap kali dipanggil ulang) supaya tidak ada
  // banyak interval menumpuk & memberatkan aplikasi saat pindah halaman/tab berkali-kali.
  var SLIDE_TIMER = null;
  function renderSlideBar(containerId){
    var container = document.getElementById(containerId);
    if (!container) return;
    if (SLIDE_TIMER) { clearInterval(SLIDE_TIMER); SLIDE_TIMER = null; }
    Promise.all([api('getSlideAktif', {level: STATE.user.level}), api('getPengaturan', {})]).then(function(hasil){
      if (!document.getElementById(containerId)) return; // user sudah pindah tampilan
      var resSlide = hasil[0], resP = hasil[1];
      if (!resSlide.ok || !resSlide.data.length) { container.innerHTML = ''; return; }
      var slides = resSlide.data;
      var jeda = (resP.ok && resP.data.SlideJedaDetik) ? Number(resP.data.SlideJedaDetik) : 5;
      if (!jeda || jeda < 2) jeda = 5;
      var idx = 0;

      var html = '<div class="slidebar" id="'+containerId+'_box">';
      slides.forEach(function(s, i){
        var inner = '<img src="'+esc(s.gambar)+'" alt="'+esc(s.judul)+'" loading="'+(i===0?'eager':'lazy')+'">' +
          (s.judul ? '<div class="slidebar-caption">'+esc(s.judul)+'</div>' : '');
        html += '<div class="slidebar-slide'+(i===0?' active':'')+'" data-i="'+i+'">' +
          (s.tautan ? ('<a href="'+esc(s.tautan)+'" target="_blank" rel="noopener" style="display:block;width:100%;height:100%">'+inner+'</a>') : inner) +
          '</div>';
      });
      if (slides.length > 1) {
        html += '<button class="slidebar-arrow prev" id="'+containerId+'_prev" aria-label="Sebelumnya">&#8249;</button>';
        html += '<button class="slidebar-arrow next" id="'+containerId+'_next" aria-label="Berikutnya">&#8250;</button>';
        html += '<div class="slidebar-dots">' + slides.map(function(_,i){return '<span class="slidebar-dot'+(i===0?' active':'')+'" data-i="'+i+'"></span>';}).join('') + '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
      if (slides.length <= 1) return;

      function tampilkan(i){
        idx = (i + slides.length) % slides.length;
        var box = document.getElementById(containerId+'_box');
        if (!box) return;
        box.querySelectorAll('.slidebar-slide').forEach(function(el){ el.classList.toggle('active', Number(el.dataset.i)===idx); });
        box.querySelectorAll('.slidebar-dot').forEach(function(el){ el.classList.toggle('active', Number(el.dataset.i)===idx); });
      }
      function resetTimer(){
        if (SLIDE_TIMER) clearInterval(SLIDE_TIMER);
        SLIDE_TIMER = setInterval(function(){ tampilkan(idx+1); }, jeda*1000);
      }
      document.getElementById(containerId+'_prev').onclick = function(){ tampilkan(idx-1); resetTimer(); };
      document.getElementById(containerId+'_next').onclick = function(){ tampilkan(idx+1); resetTimer(); };
      container.querySelectorAll('.slidebar-dot').forEach(function(dot){
        dot.onclick = function(){ tampilkan(Number(dot.dataset.i)); resetTimer(); };
      });
      resetTimer();
    });
  }

  // ---------------- KOMPONEN BERSAMA: grafik & panel rekap lengkap santri ----------------
  // Dipakai di dashboard Wali Santri, Admin/Mudir, dan Guru ("Santri Saya") supaya
  // konsisten -- tidak perlu tulis ulang logika yang sama 3 kali.

  // Grafik garis sederhana (SVG murni, tanpa library luar) menampilkan akumulasi
  // halaman hafalan baru dari waktu ke waktu.
  function buildLineChartSVG(data){
    if (!data || !data.length) return '<p class="muted">Belum ada data hafalan pada periode ini.</p>';
    var width = 640, height = 220, padding = 40;
    var maxY = Math.max.apply(null, data.map(function(d){return d.kumulatif;}));
    if (maxY <= 0) maxY = 1;
    var stepX = data.length > 1 ? (width - padding*2) / (data.length - 1) : 0;
    var points = data.map(function(d,i){
      var x = padding + i*stepX;
      var y = height - padding - (d.kumulatif / maxY) * (height - padding*2);
      return {x:x, y:y, d:d};
    });
    var pathD = points.map(function(p,i){ return (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var areaD = pathD + ' L' + points[points.length-1].x.toFixed(1) + ',' + (height-padding) + ' L' + points[0].x.toFixed(1) + ',' + (height-padding) + ' Z';
    var circles = points.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="#0d9488"><title>'+esc(p.d.tanggal)+': '+p.d.halamanHariItu+' halaman (total '+p.d.kumulatif+')</title></circle>'; }).join('');
    return '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;background:#fafafa;border-radius:8px">' +
      '<line x1="'+padding+'" y1="'+(height-padding)+'" x2="'+(width-padding)+'" y2="'+(height-padding)+'" stroke="#ccc"/>' +
      '<line x1="'+padding+'" y1="'+padding+'" x2="'+padding+'" y2="'+(height-padding)+'" stroke="#ccc"/>' +
      '<path d="'+areaD+'" fill="rgba(13,148,136,0.12)" stroke="none"/>' +
      '<path d="'+pathD+'" fill="none" stroke="#0d9488" stroke-width="2"/>' + circles +
      '<text x="'+padding+'" y="'+(height-8)+'" font-size="11" fill="#777">'+esc(data[0].tanggal)+'</text>' +
      '<text x="'+(width-padding-70)+'" y="'+(height-8)+'" font-size="11" fill="#777">'+esc(data[data.length-1].tanggal)+'</text>' +
      '<text x="'+padding+'" y="16" font-size="11" fill="#777">Total halaman baru pada periode ini: '+maxY+'</text>' +
      '</svg>';
  }

  // Panel: Kehadiran+Sikap, Progres Hafalan, Riwayat Hafalan (filter bulan), Grafik (filter semester/tahun ajaran)
  // Kecilkan & kompres gambar di browser (canvas) SEBELUM diunggah ke server, supaya
  // ukuran file kecil (cepat diunggah) dan slide tetap ringan dimuat semua pengguna.
  function resizeImageFile(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxWidth / img.width);
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        };
        img.onerror = function(){ reject(new Error('Gagal membaca gambar')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Gagal membaca file')); };
      reader.readAsDataURL(file);
    });
  }

  // ---------------- DRAFT OTOMATIS FORM HAFALAN ----------------
  // Melindungi dari kehilangan isian kalau terjadi error/reload/koneksi putus SEBELUM
  // sempat klik Simpan -- setiap perubahan pada form langsung disalin ke localStorage
  // (penyimpanan di HP/browser sendiri, bukan ke server), dan dipulihkan otomatis kalau
  // pengampu membuka lagi form yang sama (halaqoh+waktu+tanggal+pengampu yang sama persis).
  function draftHafalanKey(namaHalaqoh, waktu, tanggal, pengampu){
    return 'wasiatDraftHafalan|' + namaHalaqoh + '|' + waktu + '|' + tanggal + '|' + pengampu;
  }
  function simpanDraftHafalan(key){
    try {
      var data = {};
      document.querySelectorAll('#formHafalan > div').forEach(function(row){
        data[row.dataset.nisn] = {
          jenis: row.querySelector('.jenisSelect').value,
          surah: row.querySelector('.surahInput').value,
          ayatAwal: row.querySelector('.ayatAwalInput').value,
          ayatAkhir: row.querySelector('.ayatAkhirInput').value,
          juz: row.querySelector('.juzSelect').value,
          halamanAwal: row.querySelector('.halamanAwalSelect').value,
          halamanAkhir: row.querySelector('.halamanAkhirSelect').value,
          nilai: row.querySelector('.nilaiSelect').value
        };
      });
      localStorage.setItem(key, JSON.stringify({waktuSimpan: Date.now(), data: data}));
    } catch(e) { /* localStorage penuh/nonaktif -- diamkan, jangan sampai mengganggu pengisian */ }
  }
  function ambilDraftHafalan(key){
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return parsed && parsed.data ? parsed.data : null;
    } catch(e) { return null; }
  }
  function hapusDraftHafalan(key){
    try { localStorage.removeItem(key); } catch(e) {}
  }
  function debounce(fn, delay){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, delay);
    };
  }
  // Draft yang sudah lebih dari 3 hari dianggap tidak akan dilanjutkan lagi (misal sesi
  // hafalan hari itu sudah pindah tanggal) -- dibersihkan otomatis supaya tidak menumpuk
  // selamanya di penyimpanan HP. Dipanggil sekali saat aplikasi pertama dibuka.
  function bersihkanDraftHafalanLama(){
    try {
      var batasWaktu = Date.now() - (3*24*60*60*1000);
      var keysHapus = [];
      for (var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if (k && k.indexOf('wasiatDraftHafalan|') === 0) {
          try {
            var parsed = JSON.parse(localStorage.getItem(k));
            if (!parsed || !parsed.waktuSimpan || parsed.waktuSimpan < batasWaktu) keysHapus.push(k);
          } catch(e) { keysHapus.push(k); }
        }
      }
      keysHapus.forEach(function(k){ localStorage.removeItem(k); });
    } catch(e) { /* localStorage nonaktif -- diamkan */ }
  }

  function muatFormHafalan(namaHalaqoh, waktu, tanggal){
    var wrap = document.getElementById('formHafalanWrap');
    wrap.innerHTML = '<p>Memuat santri halaqoh '+esc(namaHalaqoh)+'...</p>';
    api('getSantriUntukHafalan', {namaHalaqoh: namaHalaqoh, waktu: waktu, tanggal: tanggal, pengampu: STATE.user.nama}).then(function(res){
      if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
      if(!res.data.length){ wrap.innerHTML = warnBox(res.peringatan); return; }
      var datalistHtml = '<datalist id="daftarSurah">' + DAFTAR_SURAH.map(function(s){return '<option value="'+esc(s)+'">';}).join('') + '</datalist>';
      var opsiHalaman = Array.from({length:22},function(_,i){return i+1;});
      var opsiNilai = Array.from({length:10},function(_,i){return (i+1)*10;});
      var html = datalistHtml + '<h4>Halaqoh: '+esc(namaHalaqoh)+' (' + esc(waktu) + ')</h4>' +
        warnBox('Isian akan otomatis terisi mengikuti riwayat terakhir santri untuk jenis hafalan yang dipilih -- tinggal ubah bagian yang berbeda saja (misalnya Ayat).') +
        '<div id="formHafalan">';
      res.data.forEach(function(s){
        html += '<div class="santriRowHafalan" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'">' +
          '<b>'+esc(s.nama)+'</b> <span class="muted">('+esc(s.nisn)+')</span><br>' +
          '<p class="faded hintHafalan">Memuat riwayat...</p>' +
          '<label class="muted">Jenis Hafalan</label>' +
          '<select class="jenisSelect">' + JENIS_HAFALAN_ALL.map(function(j){return '<option value="'+j+'">'+j+'</option>';}).join('') + '</select>' +
          '<div class="detailHafalan">' +
          '<label class="muted">Nama Surah</label><input class="surahInput" list="daftarSurah">' +
          '<div class="grid2">' +
          '<div><label class="muted">Ayat (dari - sampai, contoh: 1 - 39)</label>' +
          '<div style="display:flex;align-items:center;gap:6px">' +
          '<input class="ayatAwalInput" type="number" min="1" placeholder="1" style="flex:1">' +
          '<span>-</span>' +
          '<input class="ayatAkhirInput" type="number" min="1" placeholder="39" style="flex:1">' +
          '</div></div>' +
          '<div><label class="muted">Juz</label><select class="juzSelect">' + Array.from({length:30},function(_,i){return i+1;}).map(function(j){return '<option value="'+j+'">'+j+'</option>';}).join('') + '</select></div>' +
          '</div>' +
          '<label class="muted">Halaman (dari - sampai, isi sama kalau cuma 1 halaman)</label>' +
          '<div style="display:flex;align-items:center;gap:6px">' +
          '<select class="halamanAwalSelect">' + opsiHalaman.map(function(h){return '<option value="'+h+'">'+h+'</option>';}).join('') + '</select>' +
          '<span>-</span>' +
          '<select class="halamanAkhirSelect">' + opsiHalaman.map(function(h){return '<option value="'+h+'">'+h+'</option>';}).join('') + '</select>' +
          '</div>' +
          '<label class="muted">Nilai Hafalan</label>' +
          '<select class="nilaiSelect"><option value="">-- Pilih Nilai --</option>' + opsiNilai.map(function(n){return '<option value="'+n+'">'+n+'</option>';}).join('') + '</select>' +
          '</div></div>';
      });
      html += '</div><button type="button" id="btnSimpanHafalan">Simpan Hafalan</button>' +
        '<button type="button" class="secondary" id="btnBatalHafalan">Batal</button><div id="pesanSimpanHafalan"></div>';
      wrap.innerHTML = html;

      function toggleDetail(row){
        var jenis = row.querySelector('.jenisSelect').value;
        row.querySelector('.detailHafalan').style.display = JENIS_HAFALAN_SETOR.indexOf(jenis) === -1 ? 'none' : 'block';
      }
      // Isi ulang seluruh field (surah/ayat/juz/halaman/nilai) sesuai riwayat TERAKHIR
      // untuk jenis hafalan yang sedang dipilih -- supaya pengampu tinggal mengubah
      // bagian yang berbeda saja (biasanya cuma Ayat/Halaman).
      function terapkanRiwayat(row, jenis){
        var santri = res.data.find(function(d){ return d.nisn === row.dataset.nisn; });
        var t = santri && santri.terakhirPerJenis ? santri.terakhirPerJenis[jenis] : null;
        var hintEl = row.querySelector('.hintHafalan');
        hintEl.textContent = t
          ? ('Terakhir ('+jenis+', '+t.tanggal+'): '+(t.surah||'-')+' ayat '+(t.ayat||'-')+', Juz '+(t.juz||'-')+', Hal. '+(t.halamanKe||'-')+(t.nilai!=null&&t.nilai!==''?(', Nilai '+t.nilai):''))
          : ('Belum ada riwayat "'+jenis+'" untuk santri ini.');
        if (JENIS_HAFALAN_SETOR.indexOf(jenis) === -1) return;
        var ayatRange = parseRange(t ? t.ayat : '');
        var halamanRange = parseRange(t ? t.halamanKe : '');
        row.querySelector('.surahInput').value = t ? (t.surah||'') : '';
        row.querySelector('.ayatAwalInput').value = ayatRange.awal;
        row.querySelector('.ayatAkhirInput').value = ayatRange.akhir;
        if (t && t.juz) row.querySelector('.juzSelect').value = String(t.juz);
        if (halamanRange.awal) row.querySelector('.halamanAwalSelect').value = halamanRange.awal;
        if (halamanRange.akhir) row.querySelector('.halamanAkhirSelect').value = halamanRange.akhir;
        row.querySelector('.nilaiSelect').value = (t && t.nilai!=null && t.nilai!=='') ? String(t.nilai) : '';
      }
      wrap.querySelectorAll('.santriRowHafalan').forEach(function(row){
        var jenisAwal = row.querySelector('.jenisSelect').value;
        toggleDetail(row);
        terapkanRiwayat(row, jenisAwal);
        row.querySelector('.jenisSelect').onchange = function(){
          toggleDetail(row);
          terapkanRiwayat(row, row.querySelector('.jenisSelect').value);
        };
      });

      // Pulihkan draft yang belum sempat tersimpan (kalau ada) -- didahulukan dari
      // isian riwayat otomatis di atas, karena draft berarti ada pekerjaan yang
      // sedang berjalan dan belum sempat diklik Simpan.
      var draftKey = draftHafalanKey(namaHalaqoh, waktu, tanggal, STATE.user.nama);
      var draft = ambilDraftHafalan(draftKey);
      if (draft) {
        wrap.querySelectorAll('.santriRowHafalan').forEach(function(row){
          var d = draft[row.dataset.nisn];
          if (!d) return;
          row.querySelector('.jenisSelect').value = d.jenis;
          toggleDetail(row);
          row.querySelector('.surahInput').value = d.surah || '';
          row.querySelector('.ayatAwalInput').value = d.ayatAwal || '';
          row.querySelector('.ayatAkhirInput').value = d.ayatAkhir || '';
          if (d.juz) row.querySelector('.juzSelect').value = d.juz;
          if (d.halamanAwal) row.querySelector('.halamanAwalSelect').value = d.halamanAwal;
          if (d.halamanAkhir) row.querySelector('.halamanAkhirSelect').value = d.halamanAkhir;
          row.querySelector('.nilaiSelect').value = d.nilai || '';
        });
        document.getElementById('pesanSimpanHafalan').innerHTML = warnBox('Isian yang belum sempat tersimpan sebelumnya berhasil dipulihkan otomatis. Silakan lanjutkan dan klik Simpan.');
      }

      // Simpan draft otomatis ke localStorage tiap ada perubahan pada form (di-debounce
      // 500ms supaya tidak menulis berkali-kali tiap ketikan) -- ini TIDAK mengirim apa
      // pun ke server, murni tersimpan di perangkat sendiri sampai benar-benar diklik
      // "Simpan Hafalan".
      var simpanDraftDebounced = debounce(function(){ simpanDraftHafalan(draftKey); }, 500);
      document.getElementById('formHafalan').addEventListener('input', simpanDraftDebounced);
      document.getElementById('formHafalan').addEventListener('change', simpanDraftDebounced);

      document.getElementById('btnBatalHafalan').onclick = function(){ hapusDraftHafalan(draftKey); guruIsiHafalan(); };
      document.getElementById('btnSimpanHafalan').onclick = function(){
        var items = [];
        var adaError = false;
        document.querySelectorAll('#formHafalan > div').forEach(function(row){
          var jenis = row.querySelector('.jenisSelect').value;
          var it = {nisn: row.dataset.nisn, nama: row.dataset.nama, jenisHafalan: jenis};
          if (JENIS_HAFALAN_SETOR.indexOf(jenis) !== -1) {
            var ayatAwal = row.querySelector('.ayatAwalInput').value.trim();
            var ayatAkhir = row.querySelector('.ayatAkhirInput').value.trim();
            if (ayatAwal && ayatAkhir && Number(ayatAkhir) < Number(ayatAwal)) { adaError = true; }
            it.surah = row.querySelector('.surahInput').value;
            it.ayat = ayatAwal && ayatAkhir ? (ayatAwal + ' - ' + ayatAkhir) : ayatAwal;
            it.juz = row.querySelector('.juzSelect').value;
            it.nilai = row.querySelector('.nilaiSelect').value;
            var halamanAwal = row.querySelector('.halamanAwalSelect').value;
            var halamanAkhir = row.querySelector('.halamanAkhirSelect').value;
            if (Number(halamanAkhir) < Number(halamanAwal)) { adaError = true; }
            it.halamanKe = halamanAwal === halamanAkhir ? halamanAwal : (halamanAwal + ' - ' + halamanAkhir);
          }
          items.push(it);
        });
        if (adaError) { document.getElementById('pesanSimpanHafalan').innerHTML = errBox('Ada isian rentang yang terbalik (nilai "sampai" lebih kecil dari "dari"). Periksa kembali Ayat dan Halaman sebelum menyimpan.'); return; }
        var btn = document.getElementById('btnSimpanHafalan'); btn.disabled = true; btn.innerText = 'Menyimpan...';
        api('submitHafalan', {tanggal: document.getElementById('hfTanggal').value, waktu: waktu, halaqoh: namaHalaqoh, pengampu: STATE.user.nama, items: items})
          .then(function(res2){
            if(!res2.ok){ document.getElementById('pesanSimpanHafalan').innerHTML = errBox(res2.error); btn.disabled=false; btn.innerText='Simpan Hafalan'; return; }
            hapusDraftHafalan(draftKey);
            alert('Hafalan tersimpan (baru: '+res2.ditambah+', diperbarui: '+res2.diupdate+').');
            guruIsiHafalan();
          });
      };
    });
  }

  // Modal untuk membetulkan kesalahan pencatatan hafalan (bukan menghapus & catat ulang)
  function bukaEditHafalan(row, muatUlang){
    var ayatRange = parseRange(row.ayat);
    var halamanRange = parseRange(row.halamanKe);
    var opsiHalaman = Array.from({length:22},function(_,i){return i+1;});
    var datalistHtml = '<datalist id="editDaftarSurah">' + DAFTAR_SURAH.map(function(s){return '<option value="'+esc(s)+'">';}).join('') + '</datalist>';
    var fieldsHtml = datalistHtml +
      fieldSelect('ehJenis','Jenis Hafalan', JENIS_HAFALAN_ALL, row.jenis) +
      '<div id="ehDetailWrap">' +
      '<label class="muted">Nama Surah</label><input id="ehSurah" list="editDaftarSurah" value="'+esc(row.surah||'')+'">' +
      '<div class="grid2">' +
      '<div><label class="muted">Ayat (dari - sampai)</label><div style="display:flex;align-items:center;gap:6px">' +
      '<input id="ehAyatAwal" type="number" min="1" style="flex:1" value="'+esc(ayatRange.awal)+'"><span>-</span><input id="ehAyatAkhir" type="number" min="1" style="flex:1" value="'+esc(ayatRange.akhir)+'"></div></div>' +
      '<div><label class="muted">Juz</label><select id="ehJuz">' + Array.from({length:30},function(_,i){return i+1;}).map(function(j){return '<option value="'+j+'" '+(Number(row.juz)===j?'selected':'')+'>'+j+'</option>';}).join('') + '</select></div>' +
      '</div>' +
      '<label class="muted">Halaman (dari - sampai)</label><div style="display:flex;align-items:center;gap:6px">' +
      '<select id="ehHalAwal">' + opsiHalaman.map(function(h){return '<option value="'+h+'" '+(String(h)===halamanRange.awal?'selected':'')+'>'+h+'</option>';}).join('') + '</select>' +
      '<span>-</span>' +
      '<select id="ehHalAkhir">' + opsiHalaman.map(function(h){return '<option value="'+h+'" '+(String(h)===halamanRange.akhir?'selected':'')+'>'+h+'</option>';}).join('') + '</select>' +
      '</div>' +
      '<label class="muted">Nilai Hafalan</label><select id="ehNilai"><option value="">-- Tidak diisi --</option>' +
      Array.from({length:10},function(_,i){return (i+1)*10;}).map(function(n){return '<option value="'+n+'" '+(String(row.nilai)===String(n)?'selected':'')+'>'+n+'</option>';}).join('') + '</select>' +
      '</div>';
    var modal = openModal('Edit Riwayat Hafalan - '+row.nama, fieldsHtml, function(m){
      var jenisBaru = m.querySelector('#ehJenis').value;
      var payload = {rowIndex: row.rowIndex, jenisHafalan: jenisBaru};
      if (JENIS_HAFALAN_SETOR.indexOf(jenisBaru) !== -1) {
        payload.surah = m.querySelector('#ehSurah').value;
        var aAwal = m.querySelector('#ehAyatAwal').value, aAkhir = m.querySelector('#ehAyatAkhir').value;
        payload.ayat = (aAwal && aAkhir) ? (aAwal+' - '+aAkhir) : aAwal;
        payload.juz = m.querySelector('#ehJuz').value;
        var hAwal = m.querySelector('#ehHalAwal').value, hAkhir = m.querySelector('#ehHalAkhir').value;
        payload.halamanKe = (hAwal === hAkhir) ? hAwal : (hAwal+' - '+hAkhir);
        payload.nilai = m.querySelector('#ehNilai').value;
      } else {
        payload.surah=''; payload.ayat=''; payload.juz=''; payload.halamanKe=''; payload.nilai='';
      }
      api('updateHafalan', payload).then(function(r){ if(!r.ok) alert(r.error); else muatUlang(); });
    });
    function toggleDetail(){
      var jenis = modal.querySelector('#ehJenis').value;
      modal.querySelector('#ehDetailWrap').style.display = JENIS_HAFALAN_SETOR.indexOf(jenis)===-1 ? 'none' : 'block';
    }
    modal.querySelector('#ehJenis').onchange = toggleDetail;
    toggleDetail();
  }

  // ---------------- PERSETUJUAN SALDO (dipakai Bendahara & Admin/Mudir) ----------------
  function renderPersetujuanSaldo(containerId){
    var c = document.getElementById(containerId);
    c.innerHTML = '<p>Memuat...</p>';
    Promise.all([api('getSemuaPengajuanTarik', {hanyaPending:true}), api('getSemuaPengajuanTopUp', {hanyaPending:true})]).then(function(hasil){
      var resTarik = hasil[0], resTopUp = hasil[1];
      c.innerHTML = '<div class="card"><h3>Pengajuan Tarik Saldo (Pemilik Barang)</h3><div id="listPengajuanTarik"></div></div>' +
        '<div class="card"><h3>Pengajuan Tambah Saldo (Wali Santri)</h3><div id="listPengajuanTopUp"></div></div>';

      function renderTarik(){
        if(!resTarik.ok){ document.getElementById('listPengajuanTarik').innerHTML = errBox(resTarik.error); return; }
        if(!resTarik.data.length){ document.getElementById('listPengajuanTarik').innerHTML = '<p class="muted">Tidak ada pengajuan menunggu.</p>'; return; }
        document.getElementById('listPengajuanTarik').innerHTML = '<table><tr><th>Tanggal</th><th>Pemilik</th><th>Nominal</th><th>Aksi</th></tr>' +
          resTarik.data.map(function(x){
            return '<tr><td>'+esc(x.tanggal)+' '+esc(x.waktu)+'</td><td>'+esc(x.pemilik)+'</td><td>Rp'+x.nominal.toLocaleString('id-ID')+'</td>' +
              '<td><button class="small btnSetujuiTarik" data-row="'+x.rowIndex+'">Setujui</button> <button class="small danger btnTolakTarik" data-row="'+x.rowIndex+'">Tolak</button></td></tr>';
          }).join('') + '</table>';
        document.querySelectorAll('.btnSetujuiTarik').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Setujui penarikan ini? Saldo pemilik akan langsung terpotong.')) return;
            api('setujuiPenarikan', {rowIndex:Number(btn.dataset.row), disetujuiOleh:STATE.user.nama}).then(function(r){ if(!r.ok) alert(r.error); else renderPersetujuanSaldo(containerId); }); };
        });
        document.querySelectorAll('.btnTolakTarik').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Tolak pengajuan ini?')) return;
            api('tolakPenarikan', {rowIndex:Number(btn.dataset.row), diprosesOleh:STATE.user.nama}).then(function(r){ if(!r.ok) alert(r.error); else renderPersetujuanSaldo(containerId); }); };
        });
      }
      function renderTopUp(){
        if(!resTopUp.ok){ document.getElementById('listPengajuanTopUp').innerHTML = errBox(resTopUp.error); return; }
        if(!resTopUp.data.length){ document.getElementById('listPengajuanTopUp').innerHTML = '<p class="muted">Tidak ada pengajuan menunggu.</p>'; return; }
        document.getElementById('listPengajuanTopUp').innerHTML = '<table><tr><th>Tanggal</th><th>Santri</th><th>Nominal</th><th>Aksi</th></tr>' +
          resTopUp.data.map(function(x){
            return '<tr><td>'+esc(x.tanggal)+' '+esc(x.waktu)+'</td><td>'+esc(x.namaSantri)+'</td><td>Rp'+x.nominal.toLocaleString('id-ID')+'</td>' +
              '<td><button class="small btnSetujuiTopUp" data-row="'+x.rowIndex+'">Setujui</button> <button class="small danger btnTolakTopUp" data-row="'+x.rowIndex+'">Tolak</button></td></tr>';
          }).join('') + '</table>';
        document.querySelectorAll('.btnSetujuiTopUp').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Setujui tambah saldo ini? Pastikan bukti transfer sudah diterima.')) return;
            api('setujuiTopUp', {rowIndex:Number(btn.dataset.row), disetujuiOleh:STATE.user.nama}).then(function(r){ if(!r.ok) alert(r.error); else renderPersetujuanSaldo(containerId); }); };
        });
        document.querySelectorAll('.btnTolakTopUp').forEach(function(btn){
          btn.onclick = function(){ if(!confirm('Tolak pengajuan ini?')) return;
            api('tolakTopUp', {rowIndex:Number(btn.dataset.row), diprosesOleh:STATE.user.nama}).then(function(r){ if(!r.ok) alert(r.error); else renderPersetujuanSaldo(containerId); }); };
        });
      }
      renderTarik(); renderTopUp();
    });
  }

  function pemilikKasir(){
    var c = document.getElementById('dp-content');
    c.innerHTML = '<p>Memuat menu...</p>';
    kantinCart = [];
    api('getBarangSaya', {pemilik: STATE.user.nama}).then(function(res){
      if(!res.ok){ c.innerHTML = errBox(res.error); return; }
      var tombolCekSantri = '<div class="card"><button class="secondary" id="btnCekAkunSantri">&#128100; Cek Akun Santri</button>' +
        '<p class="muted" style="margin-top:6px">Pinjamkan layar ini ke santri untuk cek saldo/riwayatnya sendiri (pakai PIN Transaksi miliknya).</p></div>';
      if(!res.data.length){ c.innerHTML = tombolCekSantri + '<div class="card">'+warnBox('Anda belum punya barang jualan. Minta Admin menambahkan lewat menu Kelola Barang Kantin.')+'</div>'; ikatCekAkunSantri(); return; }
      var barangList = res.data;
      c.innerHTML = tombolCekSantri + '<div class="card"><h3>Menu Jualan Saya</h3><div class="fitur-grid">' +
        barangList.map(function(b,i){
          return '<div class="fitur-card"><h4>'+esc(b.nama)+'</h4><p style="font-size:16px;font-weight:700;color:#0d9488;margin:4px 0">Rp'+b.harga.toLocaleString('id-ID')+'</p>' +
            '<button class="small btnTambahKantinCart" data-i="'+i+'">+ Keranjang</button></div>';
        }).join('') + '</div></div>' +
        '<div class="card" id="kantinCartWrap" style="display:none"><h3>Keranjang</h3><div id="kantinCartList"></div>' +
        '<p style="font-size:18px;font-weight:700;text-align:right;margin-top:8px">Total: <span id="kantinCartTotal">Rp0</span></p>' +
        '<button id="btnBayarKantin">Proses Pembayaran</button> <button class="secondary" id="btnKosongkanKantin">Kosongkan</button></div>';
      ikatCekAkunSantri();

      function renderCart(){
        var wrap = document.getElementById('kantinCartWrap');
        if (!kantinCart.length) { wrap.style.display = 'none'; return; }
        wrap.style.display = 'block';
        var total = 0;
        document.getElementById('kantinCartList').innerHTML = kantinCart.map(function(it,idx){
          var sub = it.harga*it.jumlah; total += sub;
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e2e8f0">' +
            '<span>'+esc(it.nama)+' x'+it.jumlah+'</span><span>Rp'+sub.toLocaleString('id-ID')+' <button class="small danger btnHapusKantinItem" data-idx="'+idx+'">&times;</button></span></div>';
        }).join('');
        document.getElementById('kantinCartTotal').textContent = 'Rp'+total.toLocaleString('id-ID');
        document.querySelectorAll('.btnHapusKantinItem').forEach(function(btn){
          btn.onclick = function(){ kantinCart.splice(Number(btn.dataset.idx),1); renderCart(); };
        });
      }
      document.querySelectorAll('.btnTambahKantinCart').forEach(function(btn){
        btn.onclick = function(){
          var b = barangList[Number(btn.dataset.i)];
          var existing = kantinCart.find(function(x){return x.nama===b.nama;});
          if (existing) existing.jumlah++;
          else kantinCart.push({nama:b.nama, harga:b.harga, potongan:b.potongan, jumlah:1});
          renderCart();
        };
      });
      document.getElementById('btnKosongkanKantin').onclick = function(){ kantinCart = []; renderCart(); };
      document.getElementById('btnBayarKantin').onclick = function(){
        if (!kantinCart.length) return;
        api('getSantriUntukTransaksiKantin', {}).then(function(resSantri){
          if(!resSantri.ok){ alert(resSantri.error); return; }
          var daftarSantri = resSantri.data;
          var fieldsHtml = fieldAutocomplete('ktSantri','Nama Santri', daftarSantri.map(function(s){return s.nisn+' - '+s.nama;}), '', 'Ketik nama/NISN santri...') +
            '<label>PIN Transaksi Santri</label><input type="password" id="ktPin" placeholder="PIN">';
          openModal('Konfirmasi Pembayaran', fieldsHtml, function(m){
            var raw = m.querySelector('#ktSantri').value.trim();
            var found = daftarSantri.find(function(s){ return (s.nisn+' - '+s.nama) === raw; });
            if (!found) { alert('Pilih santri dari saran yang muncul saat mengetik.'); return false; }
            var pin = m.querySelector('#ktPin').value.trim();
            if (!pin) { alert('PIN Transaksi wajib diisi.'); return false; }
            api('prosesTransaksiKantin', {nisn: found.nisn, pinTransaksi: pin, pemilik: STATE.user.nama, noWaPemilik: STATE.user.noWa, items: kantinCart}).then(function(res){
              if(!res.ok){ alert(res.error); return; }
              alert('Pembayaran berhasil!\nSantri: '+res.namaSantri+'\nTotal: Rp'+res.total.toLocaleString('id-ID')+'\nSisa saldo santri: Rp'+res.saldoSekarang.toLocaleString('id-ID'));
              pemilikKasir();
            });
          });
        });
      };
      renderCart();
    });
  }

  // Tombol "Cek Akun Santri" -- santri masuk pakai PIN Transaksi miliknya sendiri
  // (bukan PIN login orang tua), lalu layar sepenuhnya berpindah ke Akun Santri.
  function ikatCekAkunSantri(){
    var btn = document.getElementById('btnCekAkunSantri');
    if (!btn) return;
    btn.onclick = function(){
      api('getSantriUntukTransaksiKantin', {}).then(function(resSantri){
        if(!resSantri.ok){ alert(resSantri.error); return; }
        var daftarSantri = resSantri.data;
        var fieldsHtml = fieldAutocomplete('casSantri','Nama Santri', daftarSantri.map(function(s){return s.nisn+' - '+s.nama;}), '', 'Ketik nama/NISN santri...') +
          '<label>PIN Transaksi Santri</label><input type="password" id="casPin" placeholder="PIN">';
        openModal('Masuk Akun Santri', fieldsHtml, function(m){
          var raw = m.querySelector('#casSantri').value.trim();
          var found = daftarSantri.find(function(s){ return (s.nisn+' - '+s.nama) === raw; });
          if (!found) { alert('Pilih santri dari saran yang muncul saat mengetik.'); return false; }
          var pin = m.querySelector('#casPin').value.trim();
          if (!pin) { alert('PIN Transaksi wajib diisi.'); return false; }
          api('validasiPinTransaksiSantri', {nisn: found.nisn, pin: pin}).then(function(res){
            if(!res.ok){ alert(res.error); return; }
            tampilkanAkunSantri(found.nisn, res.nama);
          });
        });
      });
    };
  }

  function pemilikRiwayat(){
    var c = document.getElementById('dp-content');

      '<div class="grid2"><div><label>Dari Tanggal</label><input type="date" id="rtDari"></div><div><label>Sampai Tanggal</label><input type="date" id="rtSampai"></div></div>' +
      '<button id="btnCariRiwayatKantin">Cari</button><div id="riwayatKantinWrap"></div></div>';
    function cari(){
      document.getElementById('riwayatKantinWrap').innerHTML = 'Memuat...';
      api('getRiwayatTransaksiPemilik', {pemilik: STATE.user.nama, tglMulai: document.getElementById('rtDari').value, tglAkhir: document.getElementById('rtSampai').value}).then(function(res){
        if(!res.ok){ document.getElementById('riwayatKantinWrap').innerHTML = errBox(res.error); return; }
        if(!res.data.length){ document.getElementById('riwayatKantinWrap').innerHTML = '<p class="muted">Belum ada transaksi.</p>'; return; }
        var hariIni = todayStr(); var totalHariIni = 0;
        var html = '<table><tr><th>Tanggal</th><th>Waktu</th><th>Santri</th><th>Barang</th><th>Jml</th><th>Nominal</th><th>Masuk ke Saya</th></tr>';

          html += '<tr><td>'+esc(r.tanggal)+'</td><td>'+esc(r.waktu)+'</td><td>'+esc(r.namaSantri)+'</td><td>'+esc(r.namaBarang)+'</td><td>'+r.jumlah+'</td><td>Rp'+r.nominal.toLocaleString('id-ID')+'</td><td>Rp'+r.masuk.toLocaleString('id-ID')+'</td></tr>';
        });
        html += '</table>';
        document.getElementById('riwayatKantinWrap').innerHTML = '<p style="font-weight:700;margin-bottom:8px">Total Masuk Hari Ini: Rp'+totalHariIni.toLocaleString('id-ID')+'</p>' + html;
      });
    }
    document.getElementById('btnCariRiwayatKantin').onclick = cari;
    cari();
  }

  function muatKantinWali(nisn){
    var wrap = document.getElementById('dw-kantin');
    wrap.innerHTML = '<div class="card"><h3>Saldo Kantin</h3><p>Memuat...</p></div>';
    Promise.all([api('getSaldoSantriKantin', {nisn:nisn}), api('getRiwayatTransaksiSantriKantin', {nisn:nisn})]).then(function(hasil){
      var resSaldo = hasil[0], resRiwayat = hasil[1];
      var saldo = resSaldo.ok ? resSaldo.data.saldo : 0;
      var limit = resSaldo.ok ? resSaldo.data.limit : 0;
      var namaSantri = resSaldo.ok ? resSaldo.data.nama : '';
      var html = '<div class="card"><h3>Saldo Kantin</h3>' +
        '<p style="font-size:28px;font-weight:800;color:#0d9488;margin:6px 0">Rp'+saldo.toLocaleString('id-ID')+'</p>' +
        '<button id="btnTambahSaldoWali">+ Tambah Saldo</button><div id="pesanTambahSaldo"></div></div>' +
        '<div class="card"><h3>Limit Belanja Harian</h3>' +
        warnBox('Batasi berapa banyak anak Anda boleh belanja di kantin per hari. Kosongkan atau isi 0 untuk tanpa batas.') +
        '<label>Limit Harian (Rp)</label><input type="number" id="limitHarianWali" value="'+(limit>0?limit:'')+'" placeholder="Tanpa batas">' +
        '<button id="btnSimpanLimit">Simpan Limit</button><div id="pesanLimit"></div></div>' +
        '<div class="card"><h3>Riwayat Transaksi Kantin</h3><div id="riwayatKantinWaliWrap"></div></div>';
      wrap.innerHTML = html;

      document.getElementById('btnSimpanLimit').onclick = function(){
        var nilai = document.getElementById('limitHarianWali').value.trim();
        api('setLimitHarianSantri', {nisn:nisn, limit: nilai || 0}).then(function(res){
          document.getElementById('pesanLimit').innerHTML = res.ok ? '<p class="muted">Tersimpan.</p>' : errBox(res.error);
        });
      };

      if (!resRiwayat.ok || !resRiwayat.data.length) {
        document.getElementById('riwayatKantinWaliWrap').innerHTML = '<p class="muted">Belum ada transaksi.</p>';
      } else {
        document.getElementById('riwayatKantinWaliWrap').innerHTML = '<table><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Nominal</th><th>Saldo</th></tr>' +
          resRiwayat.data.map(function(r){
            var isTopUp = r.kategori === 'Top Up Saldo';
            return '<tr><td>'+esc(r.tanggal)+' '+esc(r.waktu)+'</td><td>'+(isTopUp?'Tambah Saldo':'Belanja')+'</td><td>'+esc(r.namaBarang)+'</td>' +
              '<td style="color:'+(isTopUp?'#16a34a':'#dc2626')+'">'+(isTopUp?'+':'-')+'Rp'+r.nominal.toLocaleString('id-ID')+'</td><td>Rp'+r.saldoSekarang.toLocaleString('id-ID')+'</td></tr>';
          }).join('') + '</table>';
      }

      document.getElementById('btnTambahSaldoWali').onclick = function(){
        var fieldsHtml = '<label>Nominal yang ingin ditambahkan (Rp)</label><input type="number" id="tsNominal" placeholder="Contoh: 50000">' +
          '<p class="muted" style="margin-top:8px">Setelah diisi, pesan WhatsApp ke Bendahara akan otomatis tersusun -- Anda tinggal kirim.</p>';
        var modal = openModal('Tambah Saldo Kantin', fieldsHtml, function(m){
          var nominal = Number(m.querySelector('#tsNominal').value.trim());
          if (!nominal || nominal <= 0) { alert('Isi nominal yang valid.'); return false; }
          var btn = modal.querySelector('#modalSimpan'); btn.disabled = true; btn.innerText = 'Mengirim...';
          api('ajukanTopUpSaldo', {nisn:nisn, namaSantri:namaSantri, nominal:nominal, noWaWali:STATE.user.noWa}).then(function(res){
            if(!res.ok){ alert(res.error); btn.disabled=false; btn.innerText='Kirim WA ke Bendahara'; return false; }
            if (res.noWaBendahara) {
              var noWa = res.noWaBendahara.replace(/[^0-9]/g,''); if (noWa.charAt(0)==='0') noWa = '62'+noWa.substring(1);
              var pesan = 'Assalamualaikum, saya ingin mengajukan tambah saldo kantin.\n\nNama Santri: '+namaSantri+'\nNominal: Rp'+nominal.toLocaleString('id-ID')+'\n\nBukti transfer akan segera saya kirimkan. Terima kasih.';
              window.open('https://wa.me/'+noWa+'?text='+encodeURIComponent(pesan), '_blank');
            }
            root.removeChild(modal);
            document.getElementById('pesanTambahSaldo') && (document.getElementById('pesanTambahSaldo').innerHTML = '<p class="muted">Pengajuan terkirim, menunggu persetujuan Bendahara.</p>');
          });
          return false; // biarkan modal ditutup manual lewat root.removeChild di atas (setelah proses selesai)
        });
        modal.querySelector('#modalSimpan').textContent = 'Kirim WA ke Bendahara';
      };
    });
  }

    api('getNotifikasiMingguan', {nisn:nisn}).then(function(res){
      if(!res.ok){ document.getElementById('dw-notif').innerHTML = errBox(res.error); return; }

      document.getElementById('dw-notif').innerHTML = '<h3>Rekap 7 Hari Terakhir ('+esc(d.periode)+')</h3>' +
        '<p>Hadir: <b>'+(d.rekap.Hadir||0)+'</b> | Sakit: '+(d.rekap.Sakit||0)+' | Izin: '+(d.rekap.Izin||0)+' | Alpa: '+(d.rekap.Alpa||0)+'</p>';
    });

    document.getElementById('dw-jadwal').innerHTML = '<p>Memuat data anak...</p>';
    api('getJadwalSantri', {nisn:nisn}).then(function(res){
      if(!res.ok || res.data.error){ document.getElementById('dw-jadwal').innerHTML = errBox(res.data ? res.data.error : res.error); return; }
      var d = res.data;
      var infoRombel = d.belumMasukRombel ? warnBox('Santri ini belum dimasukkan ke rombel manapun oleh Admin.') : '';
      var jadwalHtml = d.jadwal.length ? ('<table><tr><th>Hari</th><th>Jam</th><th>Mapel</th><th>Pengampu</th></tr>' +
        d.jadwal.map(function(j){return '<tr><td>'+esc(j.hari)+'</td><td>'+esc(j.jamKe)+'</td><td>'+esc(j.mapel)+'</td><td>'+esc(j.pengampu)+'</td></tr>';}).join('') + '</table>') : '<p class="muted">Belum ada jadwal.</p>';
      document.getElementById('dw-jadwal').innerHTML = '<div class="card"><h3>'+esc(d.nama)+' - Kelas: '+esc(d.kelas)+(d.halaqoh?(' | Halaqoh: '+esc(d.halaqoh)):'')+'</h3>' + infoRombel + '<h4>Jadwal Pelajaran</h4>'+jadwalHtml+'</div>';

      renderRekapLengkapSantri('dw-rekap', nisn, {showSaldo:false});
      renderRaporCard('dw-rapor', nisn, d.nama);

        document.querySelectorAll('.btnLihatRombel').forEach(function(b){ b.onclick=function(){ tampilkanDetailRombel(b.dataset.kelas); }; });
        document.querySelectorAll('.btnEditWali').forEach(function(b){
          b.onclick = function(){
            openModal('Edit Wali Kelas untuk '+b.dataset.kelas, fieldAutocomplete('waliBaru','Wali Kelas', daftarNamaGuru, b.dataset.wali, 'Ketik nama guru...'), function(modal){
              api('editWaliKelas', {kelas:b.dataset.kelas, waliKelasBaru: modal.querySelector('#waliBaru').value}).then(muatDaftar);
            });

        document.querySelectorAll('.btnHapusRombel').forEach(function(b){
          b.onclick = function(){
            if(!confirm('Hapus rombel "'+b.dataset.kelas+'" beserta semua keanggotaan santrinya? (Data santri di sheet Santri tidak akan terhapus)')) return;
            api('hapusRombel', {kelas:b.dataset.kelas}).then(function(){ document.getElementById('detailRombelWrap').innerHTML=''; muatDaftar(); });
          };
        });
      });
    }

    function tampilkanDetailRombel(kelas){
      var wrap = document.getElementById('detailRombelWrap');
      wrap.innerHTML = '<div class="card"><h3>Santri di '+esc(kelas)+'</h3><p>Memuat...</p></div>';
      Promise.all([api('getDetailRombel', {kelas:kelas}), api('getDaftarKelasRombel', {})]).then(function(hasil){
        var res = hasil[0], resKelas = hasil[1];
        if(!res.ok){ wrap.innerHTML = '<div class="card">'+errBox(res.error)+'</div>'; return; }
        var daftarKelasLain = resKelas.data.map(function(k){return k.kelas;});
        var html = '<div class="card"><h3>Santri di '+esc(kelas)+'</h3><button class="small" id="btnTambahSantriRombel">+ Tambah Santri ke Rombel Ini</button>';
        if(!res.data.length){ html += warnBox('Belum ada santri di rombel ini.'); }
        else {
          html += '<table><tr><th>NISN</th><th>Nama</th><th>Aksi</th></tr>';
          res.data.forEach(function(s){
            html += '<tr><td>'+esc(s.nisn)+'</td><td>'+esc(s.nama)+'</td>' +
              '<td><button class="small btnPindah" data-nisn="'+esc(s.nisn)+'">Pindah Rombel</button> ' +
              '<button class="small danger btnKeluarkan" data-nisn="'+esc(s.nisn)+'">Keluarkan</button></td></tr>';
          });
          html += '</table>';
        }
        html += '</div>';
        wrap.innerHTML = html;

        document.getElementById('btnTambahSantriRombel').onclick = function(){
          api('getSemuaSantri', {}).then(function(resSantri){
            if(!resSantri.ok){ alert(resSantri.error); return; }
            var opsi = resSantri.data.map(labelSantri);
            openModal('Tambah Santri ke '+kelas,
              fieldAutocomplete('cariSantriRombel','Cari Santri (ketik NISN atau nama)', opsi, '', 'Ketik NISN atau nama santri...'),
              function(modal){
                var raw = modal.querySelector('#cariSantriRombel').value;
                var nisn = resolveSantriNisn(raw, resSantri.data);
                if (!nisn) { alert('Santri tidak ditemukan. Pilih salah satu saran yang muncul saat mengetik.'); return false; }
                api('tambahSantriKeRombel', {nisn: nisn, kelas:kelas}).then(function(r){ if(!r.ok) alert(r.error); else tampilkanDetailRombel(kelas); });
              });
          });

        wrap.querySelectorAll('.btnPindah').forEach(function(b){
          b.onclick = function(){
            openModal('Pindah Rombel', fieldSelect('kelasTujuan','Pindah ke Kelas', daftarKelasLain, kelas), function(modal){
              api('pindahSantriRombel', {nisn:b.dataset.nisn, kelasBaru: modal.querySelector('#kelasTujuan').value}).then(function(r){ if(!r.ok) alert(r.error); else tampilkanDetailRombel(kelas); });
            });
          };
        });
        wrap.querySelectorAll('.btnKeluarkan').forEach(function(b){
          b.onclick = function(){ if(!confirm('Keluarkan santri ini dari rombel?')) return; api('hapusSantriDariRombel', {nisn:b.dataset.nisn}).then(function(){ tampilkanDetailRombel(kelas); }); };
        });
      });
    }

    document.getElementById('btnBuatRombel').onclick = function(){
      var kelas = document.getElementById('namaRombelBaru').value.trim();
      var wali = document.getElementById('waliRombelBaru').value.trim();
      if(!kelas) return;
      api('buatRombelBaru', {kelas:kelas, waliKelas:wali}).then(function(res){
        if(!res.ok){ document.getElementById('pesanRombel').innerHTML = errBox(res.error); return; }
        document.getElementById('namaRombelBaru').value=''; document.getElementById('waliRombelBaru').value='';
        document.getElementById('pesanRombel').innerHTML = ''; muatDaftar();
      });
    };
    muatDaftar();
  }

  // ---------------- GURU PENGGANTI ----------------
  function adminPenggantian(){
    var c = document.getElementById('da-content');
    c.innerHTML = '<p>Memuat...</p>';
    api('getMasterData', {sheet:'Guru'}).then(function(resGuru){
      var daftarNamaGuru = resGuru.ok ? resGuru.data.data.map(function(g){return g.Nama;}) : [];
      c.innerHTML = '<div class="card"><h3>Catat Guru Pengganti</h3>' +
        warnBox('Isi kalau ada guru berhalangan hadir dan digantikan guru lain, HANYA untuk tanggal yang dipilih. Setelah dicatat: sesi ini otomatis hilang dari jadwal guru asli pada tanggal itu saja (besok normal lagi), dan muncul di jadwal guru pengganti (ditandai "Menggantikan"). Jam mengajarnya otomatis tercatat milik guru pengganti di Rekap Guru.') +
        '<label>Tanggal</label><input type="date" id="pgTanggal" value="'+todayStr()+'">' +
        '<label>Jenis Sesi</label><select id="pgJenis"><option value="Mapel">Mata Pelajaran</option><option value="Halaqoh">Halaqoh (Tahfidz)</option></select>' +
        fieldAutocomplete('pgGuruAsli','Guru Asli (yang berhalangan)', daftarNamaGuru, '', 'Ketik nama guru...') +
        '<div id="pgSesiWrap"><p class="muted">Ketik nama Guru Asli dulu untuk melihat jadwalnya.</p></div>' +
        fieldAutocomplete('pgGuruPengganti','Guru Pengganti', daftarNamaGuru, '', 'Ketik nama guru...') +
        fieldText('pgKeterangan','Keterangan (opsional)', '') +
        '<button id="btnSimpanPengganti">Simpan</button><div id="pesanPengganti"></div></div>' +
        '<div class="card"><h3>Daftar Guru Pengganti Tercatat</h3><div id="daftarPenggantiWrap">Memuat...</div></div>';

      function muatFormSesi(){
        var jenis = document.getElementById('pgJenis').value;
        var guruAsli = resolveGuruExact(document.getElementById('pgGuruAsli').value.trim(), daftarNamaGuru);
        var wrap = document.getElementById('pgSesiWrap');
        if (!guruAsli) { wrap.innerHTML = '<p class="muted">Ketik nama Guru Asli yang valid dulu (pilih dari saran).</p>'; return; }
        wrap.innerHTML = '<p>Memuat jadwal...</p>';
        if (jenis === 'Mapel') {
          api('getMasterData', {sheet:'MataPelajaran'}).then(function(res){
            if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
            var daftar = res.data.data.filter(function(m){ return m.Pengampu === guruAsli; });
            if(!daftar.length){ wrap.innerHTML = warnBox('Guru ini tidak punya jadwal mata pelajaran.'); return; }
            window.__pgDaftarSesi = daftar;
            wrap.innerHTML = '<label>Pilih Sesi yang Digantikan</label><select id="pgSesiPilihan">' +
              daftar.map(function(m,i){ return '<option value="'+i+'">'+esc(m['Nama Mapel'])+' - '+esc(m.Kelas)+' ('+esc(m.Hari)+', Jam ke-'+esc(m['Jam Ke'])+')</option>'; }).join('') + '</select>';
          });
        } else {
          api('getHalaqohList', {}).then(function(res){
            if(!res.ok){ wrap.innerHTML = errBox(res.error); return; }
            var daftar = res.data.filter(function(h){ return h.pengampuList && h.pengampuList.indexOf(guruAsli) !== -1; });
            if(!daftar.length){ wrap.innerHTML = warnBox('Guru ini tidak punya jadwal halaqoh.'); return; }
            window.__pgDaftarSesi = daftar;
            wrap.innerHTML = '<label>Pilih Halaqoh yang Digantikan</label><select id="pgSesiPilihan">' +
              daftar.map(function(h,i){ return '<option value="'+i+'">'+esc(h.namaHalaqoh)+' ('+esc(h.waktu)+')</option>'; }).join('') + '</select>';
          });
        }
      }
      document.getElementById('pgJenis').onchange = muatFormSesi;
      document.getElementById('pgGuruAsli').addEventListener('input', muatFormSesi);

      function muatDaftarPengganti(){
        document.getElementById('daftarPenggantiWrap').innerHTML = 'Memuat...';
        api('getDaftarPenggantian', {}).then(function(res){
          if(!res.ok){ document.getElementById('daftarPenggantiWrap').innerHTML = errBox(res.error); return; }
          if(!res.data.length){ document.getElementById('daftarPenggantiWrap').innerHTML = '<p class="muted">Belum ada catatan guru pengganti.</p>'; return; }
          var html = '<table><tr><th>Tanggal</th><th>Jenis</th><th>Sesi</th><th>Guru Asli</th><th>Guru Pengganti</th><th>Ket</th><th>Aksi</th></tr>';
          res.data.sort(function(a,b){ return b.tanggal.localeCompare(a.tanggal); }).forEach(function(p){
            var sesiLabel = p.jenisSesi === 'Mapel' ? (p.mapel+' - '+p.kelas+' (Jam ke-'+p.jamKe+')') : (p.halaqoh+' ('+p.waktu+')');
            html += '<tr><td>'+esc(p.tanggal)+'</td><td>'+esc(p.jenisSesi)+'</td><td>'+esc(sesiLabel)+'</td><td>'+esc(p.guruAsli)+'</td><td>'+esc(p.guruPengganti)+'</td><td>'+esc(p.keterangan||'-')+'</td>' +
              '<td><button class="small danger btnHapusPengganti" data-row="'+p.rowIndex+'">Hapus</button></td></tr>';
          });
          html += '</table>';
          document.getElementById('daftarPenggantiWrap').innerHTML = html;
          document.querySelectorAll('.btnHapusPengganti').forEach(function(btn){
            btn.onclick = function(){ if(!confirm('Hapus catatan penggantian ini?')) return; api('hapusPenggantian', {rowIndex:Number(btn.dataset.row)}).then(muatDaftarPengganti); };
          });
        });
      }

      document.getElementById('btnSimpanPengganti').onclick = function(){
        var tanggal = document.getElementById('pgTanggal').value;
        var jenis = document.getElementById('pgJenis').value;
        var guruAsli = resolveGuruExact(document.getElementById('pgGuruAsli').value.trim(), daftarNamaGuru);
        var guruPengganti = resolveGuruExact(document.getElementById('pgGuruPengganti').value.trim(), daftarNamaGuru);
        var sesiSelect = document.getElementById('pgSesiPilihan');
        if (!tanggal || !guruAsli || !guruPengganti || !sesiSelect) { document.getElementById('pesanPengganti').innerHTML = errBox('Lengkapi semua isian, termasuk pilih sesi yang digantikan (nama guru harus dipilih dari saran).'); return; }
        if (guruAsli === guruPengganti) { document.getElementById('pesanPengganti').innerHTML = errBox('Guru Pengganti tidak boleh sama dengan Guru Asli.'); return; }
        var sesi = window.__pgDaftarSesi[Number(sesiSelect.value)];
        var payload = {tanggal:tanggal, jenisSesi:jenis, guruAsli:guruAsli, guruPengganti:guruPengganti, keterangan: document.getElementById('pgKeterangan').value.trim()};
        if (jenis === 'Mapel') { payload.mapel = sesi['Nama Mapel']; payload.kelas = sesi.Kelas; payload.jamKe = sesi['Jam Ke']; }
