          document.getElementById('maKelasPreview').innerHTML = kelasList.map(function(k){
            return '<span style="background:#0d9488;color:#fff;border-radius:12px;padding:3px 10px;font-size:12px">'+esc(k)+'</span>';
          }).join('');
        };

        // Preview file yang dipilih
        document.getElementById('maFiles').onchange = function(){
          var files = Array.from(this.files);
          document.getElementById('maFileList').innerHTML = files.length ?
            '<div style="background:#f8fafc;border-radius:8px;padding:10px;font-size:13px">'+
            '<b>'+files.length+' file dipilih:</b><ul style="margin:6px 0 0 16px;padding:0">'+
            files.map(function(f){ return '<li>'+esc(f.name)+' <span class="muted">('+Math.round(f.size/1024)+'KB)</span></li>'; }).join('')+
            '</ul></div>' : '';
        };

        // Upload batch
        document.getElementById('btnUploadMA').onclick = function(){
          var files = Array.from(document.getElementById('maFiles').files);
          var mapel = document.getElementById('maMapel').value.trim();
          var kelasList = document.getElementById('maKelas').value.split(',').map(function(k){return k.trim();}).filter(Boolean);
          var kurikulum = document.getElementById('maKurikulum').value;
          var kategoriGlobal = document.getElementById('maKategori').value.trim();

          if (!files.length){ alert('Pilih minimal satu file.'); return; }
          if (!mapel){ alert('Isi Mata Pelajaran terlebih dahulu.'); return; }
          if (!kelasList.length){ alert('Isi Kelas Tujuan terlebih dahulu.'); return; }

          var btn = document.getElementById('btnUploadMA');
          btn.disabled = true;
          document.getElementById('maProgressWrap').style.display = 'block';

          var totalPekerjaan = files.length * kelasList.length;
          var selesai = 0;

          function updateProgress(pesan){
            selesai++;
            var pct = Math.round(selesai/totalPekerjaan*100);
            document.getElementById('maProgressBar').style.width = pct+'%';
            document.getElementById('maProgressText').textContent = pesan+' ('+selesai+'/'+totalPekerjaan+')';
          }

          // Proses file satu per satu secara berurutan
          function prosesFile(fileIdx){
            if (fileIdx >= files.length){
              btn.disabled = false;
              document.getElementById('maUploadStatus').innerHTML =
                '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin-top:8px">'+
                '&#10004; Semua file berhasil diupload ke '+kelasList.length+' kelas!<br>'+
                '<span class="muted" style="font-size:12.5px">Total: '+files.length+' file × '+kelasList.length+' kelas = '+totalPekerjaan+' entri. Ringkasan AI sedang diproses di server.</span></div>';
              muat();
              return;
            }
            var file = files[fileIdx];
            var namaFile = file.name.replace(/\.[^.]+$/, ''); // Hapus ekstensi
            var kategori = kategoriGlobal || namaFile;

            // Baca file sebagai base64
            var reader = new FileReader();
            reader.onload = function(e){
              var base64 = e.target.result.split(',')[1];
              var mimeType = file.type || 'application/octet-stream';

              // Upload ke Drive sekali
              api('uploadFileKeDrive', {base64:base64, mimeType:mimeType, fileName:file.name}).then(function(resUp){
                if (!resUp.ok){
                  document.getElementById('maUploadStatus').innerHTML = errBox('Gagal upload '+file.name+': '+(resUp.error||'error'));
                  btn.disabled = false;
                  return;
                }
                var fileId = (resUp.url||'').match(/\/d\/([\w-]+)/);
                fileId = fileId ? fileId[1] : '';
                var urlAsli = resUp.url || '';

                // Daftarkan ke setiap kelas
                var promsKelas = kelasList.map(function(kelas){
                  return api('saveModulAjar',{
                    mapel:mapel, kelas:kelas, kurikulum:kurikulum,
                    kategori:kategori, namaFile:namaFile+' - '+kelas,
                    urlAsli:urlAsli, diuploadOleh:STATE.user.nama
                  }).then(function(resSave){
                    updateProgress('Mendaftarkan '+namaFile+' → Kelas '+kelas);
                    // Proses ringkasan AI (tidak tunggu selesai)
                    if (fileId && resSave.ok) {
                      api('prosesTeksModulAjar',{rowIndex:resSave.rowIndex, fileId:fileId}).catch(function(){});
                    }
                  });
                });

                Promise.all(promsKelas).then(function(){
                  prosesFile(fileIdx + 1);
                });
              });
            };
            reader.readAsDataURL(file);
          }

          prosesFile(0);
        };

        // Filter tabel modul ajar
        function filterMA(){
          var q1 = document.getElementById('maFilterMapel').value.toLowerCase();
          var q2 = document.getElementById('maFilterKelas').value.toLowerCase();
          document.querySelectorAll('.maRow').forEach(function(row){
            var ok = (!q1 || row.dataset.mapel.includes(q1)) && (!q2 || row.dataset.kelas.includes(q2));
            row.style.display = ok ? '' : 'none';
          });
        }
        document.getElementById('maFilterMapel').oninput = filterMA;
        document.getElementById('maFilterKelas').oninput = filterMA;

        // Tombol Lihat dan Hapus
        if (resMA.ok){
          document.querySelectorAll('.btnLihatMA').forEach(function(btn){
            var ma = resMA.data.find(function(m){return m.rowIndex===Number(btn.dataset.row);});
            btn.onclick = function(){ if(ma) tampilkanModulAjar(ma); };
          });
          document.querySelectorAll('.btnHapusMA').forEach(function(btn){
            btn.onclick = function(){
              if(!confirm('Hapus file ini?')) return;
              api('deleteModulAjar',{rowIndex:Number(btn.dataset.row)}).then(muat);
            };
          });
        }

        document.getElementById('btnTambahRPP').onclick = function(){ bukaFormRPP(null, resRPP.ok?resRPP.data:[], muat); };
        if (resRPP.ok){
          document.querySelectorAll('.btnEditRPP').forEach(function(btn){
            btn.onclick = function(){ bukaFormRPP(resRPP.data.find(function(r){return r.rowIndex===Number(btn.dataset.row);}), resRPP.data, muat); };
          });
          document.querySelectorAll('.btnHapusRPP').forEach(function(btn){
            btn.onclick = function(){ if(!confirm('Hapus pertemuan ini?')) return; api('deleteRPP',{rowIndex:Number(btn.dataset.row)}).then(muat); };
          });
        }
      });
    }
    muat();
  }

            '</div>' +

              '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>'+

  }

  function toggleSwitchStyle(aktif){

<script>
  // ============ PWA: daftarkan service worker ============
  // Dibungkus try/catch + .catch() supaya kalau gagal (misal dibuka lewat pratinjau
  // file yang bukan hosting asli/production), aplikasi tetap jalan normal -- cuma
  // fitur offline-nya saja yang tidak aktif di konteks itu, bukan error yang mengganggu.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      try {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {

          // Cek kalau ada SW baru yang menunggu (misal user buka tab lama setelah deploy)
          if (reg.waiting) {
            tampilkanNotifUpdate(reg.waiting);
          }

          // SW baru ditemukan — menunggu untuk aktif
          reg.addEventListener('updatefound', function() {
            var swBaru = reg.installing;
            if (!swBaru) return;
            swBaru.addEventListener('statechange', function() {
              if (swBaru.state === 'installed' && navigator.serviceWorker.controller) {
                tampilkanNotifUpdate(swBaru);
              }
            });
          });

        }).catch(function(err) {
          console.warn('Service worker tidak aktif:', err.message || err);
        });

        // Terima pesan dari SW (misal: SW_UPDATED setelah activate)
        navigator.serviceWorker.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'SW_UPDATED') {
            tampilkanNotifUpdate(null); // sudah aktif, langsung minta reload
          }
        });

        // Kalau SW controller berubah (versi baru aktif) → reload otomatis
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) { refreshing = true; window.location.reload(); }
        });

      } catch (err) { /* bukan fitur wajib */ }
    });
  }

  // Tampilkan banner di atas halaman: "Versi baru tersedia — Perbarui Sekarang"
  function tampilkanNotifUpdate(swMenunggu) {
    // Jangan tampilkan dua kali
    if (document.getElementById('bannerUpdate')) return;
    var banner = document.createElement('div');
    banner.id = 'bannerUpdate';
    banner.style.cssText = [
      'position:fixed;top:0;left:0;right:0;z-index:99999',
      'background:#0d9488;color:#fff',
      'padding:10px 16px',
      'display:flex;align-items:center;justify-content:space-between',
      'font-family:\'Segoe UI\',Arial,sans-serif;font-size:13px;font-weight:500',
      'box-shadow:0 2px 8px rgba(0,0,0,.25)'
    ].join(';');
    banner.innerHTML =
      '<span>&#127381; Versi baru WASIAT tersedia!</span>' +
      '<div style="display:flex;gap:8px">' +
      '<button id="btnUpdateSekarang" style="background:#fff;color:#0d9488;border:none;padding:5px 12px;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px">Perbarui Sekarang</button>' +
      '<button id="btnTutupBannerUpdate" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px">Nanti</button>' +
      '</div>';
    document.body.prepend(banner);

    document.getElementById('btnUpdateSekarang').onclick = function() {
      if (swMenunggu) {
        // Perintahkan SW yang menunggu untuk langsung aktif
        swMenunggu.postMessage({ type: 'SKIP_WAITING' });
        // controllerchange event akan reload otomatis
      } else {
        window.location.reload();
      }
    };
    document.getElementById('btnTutupBannerUpdate').onclick = function() {
      banner.remove();
    };
  }

  // ============ PWA: tombol Install ============
  // Sinyal "beforeinstallprompt" dari browser TIDAK SELALU bisa diandalkan untuk
  // MENAMPILKAN tombol (kadang lambat/tidak muncul walau aplikasinya sebenarnya
  // sudah siap diinstal). Jadi sekarang tombol TAMPIL DEFAULT, dan HANYA
  // disembunyikan kalau ada sinyal yang PASTI aplikasi memang sudah terpasang:
  // - sedang berjalan dalam mode standalone (dibuka dari ikon Layar Utama), atau
  // - event "appinstalled" baru saja terjadi (baru selesai diinstal).
  var _deferredInstallPrompt = null;
  var _isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  var _sudahStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function _tampilkanTombolInstall(){
    var btn = document.getElementById('btnInstallPWA');
    if (!btn || _sudahStandalone) return;
    btn.style.display = 'block';
  }
  function _sembunyikanTombolInstall(){
    var btn = document.getElementById('btnInstallPWA');
    if (btn) btn.style.display = 'none';
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    _deferredInstallPrompt = e; // simpan supaya tombol bisa pakai prompt instal ASLI bawaan browser
  });
  window.addEventListener('appinstalled', function(){
    _sudahStandalone = true;
    _deferredInstallPrompt = null;
    _sembunyikanTombolInstall();
  });

  document.getElementById('btnInstallPWA').addEventListener('click', function(){
    if (_deferredInstallPrompt) {
      _deferredInstallPrompt.prompt();
      _deferredInstallPrompt.userChoice.then(function(res){
        _deferredInstallPrompt = null;
        if (res && res.outcome === 'accepted') _sembunyikanTombolInstall();
      });
      return;
    }
    if (_isIOS) {
      alert('Cara install di iPhone/iPad:\n\n1. Tap ikon Share/Bagikan (kotak dengan panah ke atas) di bagian bawah layar Safari.\n2. Pilih "Add to Home Screen" / "Tambah ke Layar Utama".\n3. Tap "Add" / "Tambah" di pojok kanan atas.\n\nIkon WASIAT akan muncul di layar utama HP Anda seperti aplikasi biasa.');
      return;
    }
