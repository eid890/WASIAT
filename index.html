<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WASIAT - Wihdatul Ummah Poso</title>
<meta name="description" content="Aplikasi Absensi & Hafalan Santri Pondok Pesantren Wihdatul Ummah Poso">

<!-- ============ PWA: manifest, ikon, warna tema ============ -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASIAT">
</head>
<body style="margin:0;padding:0">

<!-- Tombol Install PWA (tersembunyi default -- hanya muncul kalau terdeteksi belum terpasang) -->
<button id="btnInstallPWA" style="display:none;position:fixed;left:14px;bottom:14px;z-index:99999;background:#0d9488;color:#fff;border:none;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(15,118,110,.35);cursor:pointer;font-family:'Segoe UI',Arial,sans-serif">
  &#128241; Instal Aplikasi WASIAT
</button>

<!-- Lencana status data offline (mengambang, hanya tampil kalau ada data belum tersinkron) -->
<div id="outboxBadge" style="display:none;position:fixed;right:14px;bottom:14px;z-index:99999;background:#f59e0b;color:#fff;padding:10px 14px;border-radius:24px;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);align-items:center;gap:8px;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer" onclick="sinkronkanOutbox()">
  &#9203; <span id="outboxCount">0</span> data belum tersinkron -- tap untuk coba lagi
</div>

<!--
  ====================================================================
  WASIAT - Aplikasi Absensi & Hafalan Santri
  Pondok Pesantren Wihdatul Ummah Poso, Sulawesi Tengah
  Versi PWA (dihosting mandiri di Vercel) -- lihat README.md untuk cara deploy.
  ====================================================================
-->
<div id="absensi-app">
  <div style="text-align:center;padding:60px 20px;font-family:'Segoe UI',Arial,sans-serif;color:#0f766e">Memuat aplikasi...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  #absensi-app{
    max-width:1300px;margin:0 auto;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;
    --tema:#0d9488;--tema-dark:#0f766e;--tema-light:#ccfbf1;--sidebar-bg:#134e4a;background:#f1f5f9;
    overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  #absensi-app *{box-sizing:border-box;max-width:100%}
  #absensi-app img{max-width:100%;height:auto}

  /* ---- layout shell: sidebar geser (tersembunyi default) + konten utama ---- */
  #absensi-app .app-shell{display:flex;min-height:100vh;position:relative}
  #absensi-app .sidebar{
    width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar-bg),#0a2e2c);color:#e2f5f3;
    display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;overflow-y:auto;
    transform:translateX(-100%);transition:transform .25s ease;z-index:1000;box-shadow:2px 0 16px rgba(0,0,0,.25);
  }
  #absensi-app .sidebar.open{transform:translateX(0)}
  #absensi-app .sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  #absensi-app .sidebar-brand img{height:38px;width:38px;object-fit:contain;border-radius:8px;background:#fff;padding:2px;flex-shrink:0}
  #absensi-app .sidebar-brand .nm{font-size:13px;font-weight:600;line-height:1.3}
  #absensi-app .sidebar-nav{flex:1;padding:10px 8px}
  #absensi-app .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;
    color:#c9e8e4;font-size:13.5px;margin-bottom:2px;white-space:nowrap;
  }
  #absensi-app .nav-item .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
  #absensi-app .nav-item:hover{background:rgba(255,255,255,.08)}
  #absensi-app .nav-item.active{background:var(--tema);color:#fff;font-weight:600}
  #absensi-app .sidebar-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
  #absensi-app .sidebar-user .nm{font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #absensi-app .sidebar-user .lvl{color:#9fd8d2;margin-bottom:8px}
  #absensi-app .sidebar-user button{width:100%;background:rgba(255,255,255,.14);margin:0}
  #absensi-app .sidebar-user button:hover{background:rgba(255,255,255,.24)}
  #absensi-app .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999}
  #absensi-app .sidebar-overlay.show{display:block}
  #absensi-app .main-content{flex:1;min-width:0;padding:0 22px 40px}
  #absensi-app .mobile-topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:sticky;top:0;background:#f1f5f9;padding:10px 0;z-index:50}
  #absensi-app .hamburger-btn{background:var(--tema);color:#fff;border:none;width:38px;height:38px;border-radius:8px;font-size:18px;cursor:pointer;flex-shrink:0;margin:0}
  #absensi-app .mobile-title{font-size:15px;font-weight:600;color:var(--tema-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (max-width:860px){
    #absensi-app .main-content{padding:0 12px 32px}
  }

  /* ---- kartu, form, tombol ---- */
  #absensi-app .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(15,118,110,.07)}
  #absensi-app h2{margin:0 0 10px;color:#0f2f2d}
  #absensi-app h3{margin:0 0 10px;color:#0f2f2d;font-size:16px}
  #absensi-app h4{margin:10px 0 6px;color:#134e4a;font-size:13.5px}
  #absensi-app label{display:block;font-size:12.5px;color:#475569;margin-bottom:3px;font-weight:500}
  #absensi-app input,#absensi-app select,#absensi-app textarea{
    width:100%;padding:9px 10px;margin:0 0 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff;color:#1e293b;
  }
  #absensi-app input:focus,#absensi-app select:focus,#absensi-app textarea:focus{outline:none;border-color:var(--tema);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  #absensi-app button{background:var(--tema);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;margin-right:6px;margin-bottom:6px;transition:background .15s}
  #absensi-app button:hover{background:var(--tema-dark)}
  #absensi-app button.secondary{background:#64748b}
  #absensi-app button.secondary:hover{background:#475569}
  #absensi-app button.danger{background:#dc2626}
  #absensi-app button.danger:hover{background:#b91c1c}
  #absensi-app button.small{padding:6px 11px;font-size:12px}
  #absensi-app button:disabled{opacity:.55;cursor:not-allowed}

  /* ---- tabel: digeser ke samping, TIDAK ADA teks bertumpuk/wrap ---- */
  #absensi-app table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;white-space:nowrap}
  #absensi-app th,#absensi-app td{border:1px solid #e2e8f0;padding:7px 9px;text-align:left;white-space:nowrap}
  #absensi-app th{background:var(--tema-light);color:#0f4c4c;font-weight:600}

  #absensi-app .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  #absensi-app .tab-btn{background:#eef2f7;color:#334155;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap}
  #absensi-app .tab-btn.active{background:var(--tema);color:#fff}

  #absensi-app .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand{display:flex;align-items:center;gap:10px}
  #absensi-app .brand img{height:42px;width:42px;object-fit:contain;border-radius:8px}

  #absensi-app .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap}
  #absensi-app .badge.Hadir{background:#0d9488}
  #absensi-app .badge.Sakit{background:#f59e0b}
  #absensi-app .badge.Izin{background:#2563eb}
  #absensi-app .badge.Alpa{background:#dc2626}
  #absensi-app .badge-hafalan{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;color:#fff;white-space:nowrap}
  #absensi-app .badge-hafalan.sabaq{background:#0d9488}
  #absensi-app .badge-hafalan.sabqi{background:#0891b2}
  #absensi-app .badge-hafalan.manzil{background:#7c3aed}
  #absensi-app .badge-hafalan.murojaah{background:#0284c7}
  #absensi-app .badge-hafalan.tahsin{background:#16a34a}
  #absensi-app .badge-hafalan.tidaksetor{background:#64748b}
  #absensi-app .badge-hafalan.izin{background:#2563eb}
  #absensi-app .badge-hafalan.sakit{background:#f59e0b}
  #absensi-app .badge-hafalan.ghaib{background:#dc2626}
  #absensi-app .progress{background:#e2e8f0;border-radius:8px;overflow:hidden;height:14px;width:100%}
  #absensi-app .progress-bar{background:var(--tema);height:14px}

  #absensi-app .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #absensi-app .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  @media (max-width:560px){
    #absensi-app .grid2{grid-template-columns:1fr}
    #absensi-app .grid4{grid-template-columns:repeat(2,1fr)}
  }

  #absensi-app .muted{color:#64748b;font-size:12px}
  #absensi-app .faded{color:#94a3b8;font-size:11px;font-style:italic}
  #absensi-app .warn{background:#fffbeb;border:1px solid #fcd34d;padding:10px;border-radius:8px;color:#92400e;font-size:13px}
  #absensi-app .err{background:#fef2f2;border:1px solid #fca5a5;padding:10px;border-radius:8px;color:#b91c1c;font-size:13px}

  #absensi-app .overlay{position:fixed;inset:0;background:rgba(15,42,40,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
  #absensi-app .modal{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}

  #absensi-app .santriRowAbsen{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .santriRowHafalan{border-bottom:1px solid #eef2f7;padding:12px 0}
  #absensi-app .juzchip{display:inline-block;background:var(--tema);color:#fff;border-radius:20px;padding:4px 10px;margin:2px;font-size:12px}
  #absensi-app .juzchip.proses{background:#f59e0b}

  /* ---- slide pengumuman (ringan, tanpa library luar) ---- */
  #absensi-app .slidebar{position:relative;width:100%;aspect-ratio:16/6;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#e2e8f0;box-shadow:0 2px 10px rgba(15,118,110,.12)}
  #absensi-app .slidebar-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;}
  #absensi-app .slidebar-slide.active{opacity:1;z-index:1}
  #absensi-app .slidebar-slide img{width:100%;height:100%;object-fit:cover;display:block}
  #absensi-app .slidebar-caption{position:absolute;left:0;right:0;bottom:0;padding:10px 46px 10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;font-weight:600}
  #absensi-app .slidebar-dots{position:absolute;bottom:9px;right:10px;display:flex;gap:5px;z-index:2}
  #absensi-app .slidebar-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
  #absensi-app .slidebar-dot.active{background:#fff}
  #absensi-app .slidebar-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;margin:0;padding:0}
  #absensi-app .slidebar-arrow:hover{background:rgba(0,0,0,.55)}
  #absensi-app .slidebar-arrow.prev{left:8px}
  #absensi-app .slidebar-arrow.next{right:8px}
  @media (max-width:560px){ #absensi-app .slidebar{aspect-ratio:16/9} }

  /* ---- website depan (beranda publik) ---- */
  #absensi-app .site-nav{position:sticky;top:0;z-index:600;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap;gap:8px}
  #absensi-app .brand2{display:flex;align-items:center;gap:9px;flex-shrink:0;min-width:0}
  #absensi-app .brand2 img{height:42px;width:42px;min-width:42px;flex-shrink:0;display:block;object-fit:contain;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 2px 6px rgba(0,0,0,.08);background:#fff;padding:2px}
  #absensi-app .brand2 span{font-weight:800;color:#0f766e;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
  #absensi-app .site-nav-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #absensi-app .site-nav-links a{color:#334155;font-size:13.5px;font-weight:600;cursor:pointer}
  #absensi-app .site-nav-links a:hover{color:#0d9488}
  @media(min-width:480px){ #absensi-app .brand2 img{height:46px;width:46px;min-width:46px} #absensi-app .brand2 span{font-size:15px;max-width:none;white-space:normal} }
  #absensi-app .btn-masuk{background:var(--tema);color:#fff;border:none;padding:9px 20px;border-radius:20px;font-weight:700;cursor:pointer;font-size:13px;margin:0;width:auto}
  #absensi-app .hero{background:linear-gradient(150deg,#0f766e,#134e4a 65%,#0a2e2c);color:#fff;padding:50px 20px;text-align:center}
  #absensi-app .hero img{height:84px;width:84px;object-fit:contain;margin-bottom:14px;border-radius:14px;background:#fff;padding:8px}
  #absensi-app .hero h1{font-size:23px;margin-bottom:8px}
  #absensi-app .hero p{opacity:.92;max-width:560px;margin:0 auto;font-size:14px;line-height:1.6}
  #absensi-app .site-section{padding:36px 18px;max-width:900px;margin:0 auto}
  #absensi-app .site-section h2{font-size:19px;color:#0f766e;margin-bottom:14px;text-align:center}
  #absensi-app .artikel-grid{display:grid;grid-template-columns:1fr;gap:16px}
  #absensi-app .artikel-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s}
  #absensi-app .artikel-card:hover{transform:translateY(-3px)}
  #absensi-app .artikel-card img{width:100%;height:150px;object-fit:cover;display:block;background:#e2e8f0}
  #absensi-app .artikel-card-body{padding:13px}
  #absensi-app .artikel-card-kat{display:inline-block;background:rgba(13,148,136,.1);color:#0d9488;font-size:10px;font-weight:700;padding:2px 9px;border-radius:12px;margin-bottom:6px}
  #absensi-app .artikel-card h4{font-size:14px;margin-bottom:4px;color:#1e293b}
  #absensi-app .artikel-card p{font-size:12px;color:#64748b;margin:0}
  #absensi-app .site-footer{background:#0f172a;color:#94a3b8;padding:24px 18px;text-align:center;font-size:12px;line-height:1.8}
  #absensi-app .login-drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998;display:none}
  #absensi-app .login-drawer-bg.show{display:block}
  #absensi-app .login-drawer{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:88vw;background:#fff;z-index:9999;box-shadow:-6px 0 24px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .25s ease;padding:26px 22px;overflow-y:auto}
  #absensi-app .login-drawer.show{transform:translateX(0)}
  #absensi-app .login-drawer-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:24px;cursor:pointer;color:#64748b;width:auto;margin:0;padding:2px 6px}

  /* ---- hero lebih menonjol, mengacu referensi desain sekolah modern ---- */
  #absensi-app .hero{padding:64px 20px 56px;background-size:cover;background-position:center;position:relative}
  #absensi-app .hero.ada-gambar{background-image:linear-gradient(rgba(15,23,26,.62),rgba(10,46,44,.72))}
  #absensi-app .hero-tagline{display:inline-block;background:rgba(255,255,255,.14);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:14px;text-transform:uppercase}
  #absensi-app .hero-cta{display:inline-block;margin-top:18px;background:#fff;color:#0f766e;padding:11px 26px;border-radius:24px;font-weight:700;font-size:13.5px;cursor:pointer;border:none;text-decoration:none}
  #absensi-app .hero-samar{opacity:.45;transition:opacity .25s ease}
  #absensi-app .hero-samar:hover,#absensi-app .hero-samar:active,#absensi-app .hero-samar:focus{opacity:1}

  /* ---- kartu ikon/foto (Program Unggulan / Fasilitas) ---- */
  #absensi-app .fitur-grid{display:grid;grid-template-columns:1fr;gap:14px}
  #absensi-app .ringkasan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  @media(min-width:640px){ #absensi-app .ringkasan-grid{grid-template-columns:repeat(4,1fr)} }
  #absensi-app .ringkasan-tile{background:#fff;border-radius:14px;padding:16px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);border-left:4px solid var(--tema);text-align:left}
  #absensi-app .ringkasan-tile.warna-merah{border-left-color:#dc2626}
  #absensi-app .ringkasan-tile.warna-hijau{border-left-color:#16a34a}
  #absensi-app .ringkasan-tile.warna-amber{border-left-color:#d97706}
  #absensi-app .ringkasan-tile .ico{font-size:22px;margin-bottom:6px}
  #absensi-app .ringkasan-tile .nilai{font-size:22px;font-weight:800;color:#0f172a;line-height:1.15}
  #absensi-app .ringkasan-tile .label{font-size:11.5px;color:#64748b;text-transform:uppercase;letter-spacing:.03em;margin-top:3px}
  #absensi-app .ringkasan-tile .sub{font-size:11.5px;color:#94a3b8;margin-top:4px}
  #absensi-app .fitur-card{background:#fff;border-radius:12px;padding:20px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #eef2f6;overflow:hidden}
  #absensi-app .fitur-card.punya-foto{padding:0 0 16px}
  #absensi-app .fitur-card img{width:100%;height:130px;object-fit:cover;display:block;margin-bottom:12px}
  #absensi-app .fitur-card.punya-foto h4,#absensi-app .fitur-card.punya-foto p{padding-left:16px;padding-right:16px}
  #absensi-app .fitur-icon{width:52px;height:52px;border-radius:14px;background:rgba(13,148,136,.1);color:#0d9488;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
  #absensi-app .fitur-card h4{font-size:14.5px;color:#1e293b;margin-bottom:6px}
  #absensi-app .fitur-card p{font-size:12.5px;color:#64748b;line-height:1.6;margin:0}
  @media(min-width:768px){ #absensi-app .fitur-grid{grid-template-columns:repeat(3,1fr)} }
  #absensi-app .fitur-grid.fasilitas{grid-template-columns:repeat(2,1fr)}
  @media(min-width:768px){ #absensi-app .fitur-grid.fasilitas{grid-template-columns:repeat(4,1fr)} }

  /* ---- Visi & Misi ---- */
  #absensi-app .visimisi-wrap{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:768px){ #absensi-app .visimisi-wrap{grid-template-columns:1fr 1fr} }
  #absensi-app .visimisi-card{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:12px;padding:20px}
  #absensi-app .visimisi-card h4{color:#0f766e;font-size:14px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  #absensi-app .visimisi-card p{color:#334155;font-size:13.5px;line-height:1.7;white-space:pre-line;margin:0}

  /* ---- pita berjalan (marquee) ---- */
  #absensi-app .marquee-band{background:#134e4a;overflow:hidden;padding:14px 0;white-space:nowrap}
  #absensi-app .marquee-track{display:inline-block;animation:spMarquee 22s linear infinite;color:#5eead4;font-weight:800;font-size:20px;letter-spacing:2px}

  // Cari data surah dari nama (toleran terhadap variasi penulisan)
  function cariDataSurah(namaSurah) {
    if (!namaSurah) return null;
    var q = namaSurah.trim().toLowerCase();
    // Cek alias dulu
    if (ALIAS_SURAH[q]) q = ALIAS_SURAH[q].toLowerCase();
    // Cari exact match (case-insensitive)
    for (var i=0;i<QURAN_DB.length;i++) {
      if (QURAN_DB[i][1].toLowerCase() === q) return QURAN_DB[i];
    }
    // Cari partial match
    for (var i=0;i<QURAN_DB.length;i++) {
      if (QURAN_DB[i][1].toLowerCase().indexOf(q) === 0) return QURAN_DB[i];
    }
    // Cari tanpa "al-" / "asy-" / "an-" / "at-" / "as-" / "az-" / "ad-"
    var qTanpaAwalan = q.replace(/^(al|asy|an|at|as|az|ad|ar)-?\s*/,'');
    for (var i=0;i<QURAN_DB.length;i++) {
      var namaTanpaAwalan = QURAN_DB[i][1].toLowerCase().replace(/^(al|asy|an|at|as|az|ad|ar)['-]?\s*/,'');
      if (namaTanpaAwalan === qTanpaAwalan) return QURAN_DB[i];
    }
    return null;
  }

  // Hitung juz dari nama surah + nomor ayat
  function hitungJuzDariAyat(namaSurah, noAyat) {
    var surah = cariDataSurah(namaSurah);
    if (!surah) return null;
    var noSurah = surah[0];
    noAyat = Number(noAyat);
    for (var i=0;i<BATAS_JUZ.length;i++) {
      var juz = BATAS_JUZ[i][0], batasSurah = BATAS_JUZ[i][1], batasAyat = BATAS_JUZ[i][2];
      if (noSurah < batasSurah) return juz;
      if (noSurah === batasSurah && noAyat <= batasAyat) return juz;
    }
    return 30;
  }

  // Hitung halaman dari nama surah + nomor ayat (perkiraan mushaf pojok 604 hal)
  // Cara: halaman_mulai_surah + estimasi posisi ayat dalam surah
  function hitungHalamanDariAyat(namaSurah, noAyat) {
    var surah = cariDataSurah(namaSurah);
    if (!surah) return null;
    var no = surah[0], totalAyat = surah[2], halMulai = surah[4];
    noAyat = Math.max(1, Number(noAyat)||1);
    // Hitung halaman surah berikutnya (atau 605 kalau surah terakhir)
    var halAkhir = (no < 114) ? QURAN_DB[no][4] : 605;
    var totalHalaman = halAkhir - halMulai;
    if (totalHalaman <= 0) return halMulai;
    // Estimasi proporsional berdasarkan posisi ayat
    var rasio = (noAyat - 1) / totalAyat;
    return Math.min(halMulai + Math.floor(rasio * totalHalaman), halAkhir - 1);
  }

  function perbaruiLencanaOutbox(){
    var box = getOutbox();
    var n = box.length;

    if (el) {
      el.style.display = n > 0 ? 'flex' : 'none';

  function api(action, payload){
    var bisaDiantre = AKSI_BISA_OFFLINE.indexOf(action) !== -1;

    // Offline: langsung antre
    if (bisaDiantre && typeof navigator !== 'undefined' && navigator.onLine === false) {
      return _antrePesan(action, payload, 'offline');
    }

    return apiJaringan(action, payload).then(function(res){
      // Gagal karena jaringan (bukan error logika): antre kalau bisa
      if (bisaDiantre && !res.ok && res._jaringanGagal) {
        return _antrePesan(action, payload, 'jaringan_gagal');
      }
      return res;
    });
  }

  function _antrePesan(action, payload, alasan){
    var outbox = getOutbox();
    outbox.push({
      action:action, payload:payload,
      waktu:new Date().toISOString(),
      alasan:alasan, retryCount:0
    });
    setOutbox(outbox);
    var jumlah = payload && payload.items ? payload.items.length : 1;
    return Promise.resolve({
      ok:true, offline:true,
      ditambah:jumlah, diupdate:0,
      pesanOffline:'&#128225; Sedang offline — '+jumlah+' data tersimpan di perangkat dan akan otomatis dikirim saat online kembali.'
    });
  }

  // Kirim ulang semua data tertunda — dipanggil otomatis saat online
  var SEDANG_SINKRON = false;
  function sinkronkanOutbox(){
    if (SEDANG_SINKRON || !navigator.onLine) return;
    var sisa = getOutbox();
    if (!sisa.length) return;
    SEDANG_SINKRON = true;

    // Update badge — tampilkan progress
    var elBadge = document.getElementById('outboxBadge');
    if (elBadge) {
      elBadge.innerHTML = '&#9203; Mengirim '+sisa.length+' data tersimpan...';
      elBadge.style.display = 'flex';
      elBadge.style.background = '#2563eb';
    }

    function prosesSatu(arr, berhasil, gagal){
      if (!arr.length){
        // Selesai
        SEDANG_SINKRON = false;
        // Simpan yang masih gagal
        var sisaGagal = gagal.map(function(x){
          x.retryCount = (x.retryCount||0)+1;
          return x;
        }).filter(function(x){ return x.retryCount < 5; }); // hapus kalau sudah 5x gagal
        setOutbox(sisaGagal);
        if (berhasil > 0) {
          // Tampilkan notif sukses singkat
          var elB = document.getElementById('outboxBadge');
          if (elB) {
            elB.innerHTML = '&#10003; '+berhasil+' data berhasil dikirim!';
            elB.style.background = '#16a34a';
            elB.style.display = 'flex';
            setTimeout(function(){ perbaruiLencanaOutbox(); }, 3000);
          }
        } else {
          perbaruiLencanaOutbox();
        }
        return;
      }
      var item = arr[0];
      var sisa2 = arr.slice(1);
      apiJaringan(item.action, item.payload).then(function(res){
        if (res.ok) prosesSatu(sisa2, berhasil+1, gagal);
        else prosesSatu(sisa2, berhasil, gagal.concat([item]));
      }).catch(function(){
        SEDANG_SINKRON = false;
        // Koneksi putus lagi saat sinkron -- simpan sisa dan berhenti
        setOutbox(arr.concat(gagal));
        perbaruiLencanaOutbox();
      });
    }
    prosesSatu(sisa, 0, []);
  }

          if (wrap.parentNode) root.removeChild(wrap);

          btnSimpan.disabled = false;

          statusEl.innerHTML = '<p style="color:#dc2626;margin:6px 0">&#9888;&#65039; Gagal: '+esc(String(e))+'</p>';

  // Input search-autocomplete (datalist) generik, dipakai untuk semua pemilihan nama
  // Santri/Guru/Mapel supaya konsisten dan datanya selalu diambil dari database aktif.
  function fieldAutocomplete(id, label, options, value, placeholder){
    var listId = id + '_dl';
    var dl = '<datalist id="'+listId+'">' + options.map(function(o){ return '<option value="'+esc(o)+'">'; }).join('') + '</datalist>';
    return '<label>'+esc(label)+'</label><input id="'+id+'" list="'+listId+'" autocomplete="off" placeholder="'+esc(placeholder||'Ketik untuk mencari...')+'" value="'+esc(value||'')+'">' + dl;

  // Cocokkan input santri (format tampilan "NISN - Nama") kembali ke NISN yang valid.
  // Menerima juga jika user hanya mengetik NISN saja atau nama persis.
  function resolveSantriNisn(raw, santriList){
    raw = String(raw||'').trim();
    if (!raw) return null;
    var m = santriList.find(function(s){ return (s.nisn+' - '+s.nama) === raw; });
    if (m) return m.nisn;
    m = santriList.find(function(s){ return s.nisn === raw; });
    if (m) return m.nisn;
    m = santriList.find(function(s){ return s.nama.toLowerCase() === raw.toLowerCase(); });
    return m ? m.nisn : null;
  }
  function labelSantri(s){ return s.nisn + ' - ' + s.nama; }
  // Ayat maupun Halaman disimpan sebagai teks rentang "dari - sampai" (contoh: "2 - 21").
  // Fungsi generik ini memecah nilai lama (baik format rentang maupun angka tunggal)
  // jadi {awal, akhir} supaya form Isi Hafalan bisa menampilkan kembali sebagai dua kolom.
  function parseRange(raw){
    raw = String(raw==null?'':raw).trim();
    if (!raw) return {awal:'', akhir:''};
    var parts = raw.split('-').map(function(x){return x.trim();});
    if (parts.length >= 2 && parts[0] !== '' && parts[1] !== '') return {awal: parts[0], akhir: parts[1]};
    return {awal: parts[0], akhir: ''};
  }
  // Cocokkan nama guru persis dengan daftar Guru (strict) -- penting karena nama ini
  // dipakai untuk mencocokkan akun login guru di banyak fitur (jadwal, halaqoh, dll).
  function resolveGuruExact(raw, guruNames){
    raw = String(raw||'').trim();
    var m = guruNames.find(function(g){ return g === raw; });
    return m || null;
  }

      // Kalau gagal (offline), biarkan sesi lama — tidak logout paksa saat offline
      if (navigator.onLine) {
        api('cekSesiAktif', {nama: sesiTersimpan.nama, noWa: sesiTersimpan.noWa}).then(function(res){

  function lanjutkanKeDashboard(){

  // ---- Dashboard Multi-Role (sistem TAB) ----
  function dashboardMultiRole(roles, activeRoleTab, activeMenuKey){
    var validRoles = roles.filter(function(r){ return r !== 'WaliSantri' && MENU_PER_ROLE[r]; });
    if (!validRoles.length){ showBeranda(true,'Tidak ada role yang valid. Hubungi Admin.'); return; }

    activeRoleTab = activeRoleTab || validRoles[0];
    STATE._contentId = 'multi-content';
    var menuAktif = MENU_PER_ROLE[activeRoleTab] || [];
    activeMenuKey = activeMenuKey || (menuAktif[0] && menuAktif[0].key) || '';

    // Bangun sidebar menu
    var navHtml = menuAktif.map(function(n){
      return '<div class="nav-item'+(n.key===activeMenuKey?' active':'')+'" data-key="'+n.key+'">'+
        '<span class="ic">'+n.icon+'</span><span>'+esc(n.label)+'</span></div>';
    }).join('');

    // Bangun tab role (hanya kalau lebih dari 1 role)
    var tabHtml = '';
    if (validRoles.length > 1) {
      tabHtml = '<div style="display:flex;gap:0;background:#f1f5f9;border-bottom:2px solid #e2e8f0;padding:0 12px;overflow-x:auto">'+
        validRoles.map(function(r){
          var aktif = r === activeRoleTab;
          return '<button data-role="'+r+'" style="padding:10px 16px;border:none;cursor:pointer;font-size:13px;font-weight:600;'+
            'white-space:nowrap;background:'+(aktif?'#fff':'transparent')+';'+
            'color:'+(aktif?'#0d9488':'#64748b')+';'+
            'border-bottom:'+(aktif?'2px solid #0d9488':'2px solid transparent')+';'+
            'margin-bottom:-2px;border-radius:0">'+esc(labelRole(r))+'</button>';
        }).join('')+'</div>';
    }

    // Gunakan renderSidebarShell yang sudah ada
    var navItems = menuAktif;
    render(
      '<div class="app-shell">'+
        '<div class="sidebar-overlay" id="sbOverlay"></div>'+
        '<nav class="sidebar" id="sbNav">'+
          '<div class="sidebar-brand">'+
            (logoSrc()?'<img src="'+esc(logoSrc())+'" style="height:38px;border-radius:8px;margin-right:8px">':'')+
            '<div class="nm">'+esc(STATE.pengaturan.NamaPesantren||'WASIAT')+'</div>'+
          '</div>'+
          (validRoles.length>1?
            '<div style="padding:4px 10px 0">'+
              validRoles.map(function(r){
                var aktif=r===activeRoleTab;
                var s='display:block;width:100%;text-align:left;padding:7px 10px;margin-bottom:3px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;border:1px solid '+(aktif?'#0d9488':'#e2e8f0')+';background:'+(aktif?'#0d9488':'#fff')+';color:'+(aktif?'#fff':'#475569');
                return '<button data-role="'+r+'" class="tab-role-btn" style="'+s+'">'+esc(labelRole(r))+'</button>';
              }).join('')+
            '</div><hr style="margin:8px 0;border-color:#e2e8f0">':'')+
          '<div class="sidebar-nav" id="sidebarNav">'+navHtml+'</div>'+
          '<div class="sidebar-user">'+
            '<div class="nm">'+esc(STATE.user.nama)+'</div>'+
            '<div class="lvl">'+esc(validRoles.map(labelRole).join(', '))+'</div>'+
            '<button class="small" id="sbLogout">Keluar</button>'+
          '</div>'+
        '</nav>'+
        '<div class="main-content">'+
          '<div class="mobile-topbar">'+
            '<button class="hamburger-btn" id="btnHamburger">&#9776;</button>'+
            '<span class="mobile-title">'+esc(labelRole(activeRoleTab))+'</span>'+
          '</div>'+
          '<div id="slideBarWrap"></div>'+
          '<div id="multi-content"></div>'+
        '</div>'+
      '</div>'
    );

    renderSlideBar('slideBarWrap');

    // Binding logout
    document.getElementById('sbLogout').onclick = function(){ STATE.user=null; hapusSesiTersimpan(); showBeranda(); };

    // Hamburger
    var sidebar=document.getElementById('sbNav'), overlay=document.getElementById('sbOverlay');
    var btnH=document.getElementById('btnHamburger');
    if (btnH) {
      btnH.onclick = function(){
        var open=sidebar.classList.toggle('open');
        overlay.classList.toggle('show',open);
        btnH.innerHTML=open?'&#10005;':'&#9776;';
      };
    }
    if (overlay) overlay.onclick=function(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); if(btnH)btnH.innerHTML='&#9776;'; };

    // Binding tab role di sidebar
    document.querySelectorAll('.tab-role-btn').forEach(function(btn){
      btn.onclick = function(){
        var r = btn.dataset.role;
        var firstKey = MENU_PER_ROLE[r] && MENU_PER_ROLE[r][0] && MENU_PER_ROLE[r][0].key;
        dashboardMultiRole(roles, r, firstKey);
      };
    });

    // Binding menu sidebar
    var mapFn = getMapFungsi(activeRoleTab);
    document.getElementById('sidebarNav').querySelectorAll('.nav-item[data-key]').forEach(function(li){
      li.onclick = function(){
        document.getElementById('sidebarNav').querySelectorAll('.nav-item').forEach(function(x){x.classList.remove('active');});
        li.classList.add('active');
        var fn = mapFn[li.dataset.key];
        if (fn) fn();
      };
    });

    // Jalankan menu aktif pertama
    var fn = mapFn[activeMenuKey];
    if (fn) fn();

    setTimeout(muatNotifBadge, 800);
  }

  function renderRaporLengkap(d){
    var kontainer = document.getElementById('raporContent');
    if (!kontainer) return;

    var hurufFn=function(n){return n===null?'-':n>=90?'A':n>=80?'B':n>=70?'C':n>=60?'D':'E';};
    var tdN=function(v){

  // Export Excel rapor santri
  function excelRaporSantri(d){
    var bom='\uFEFF';
    var rows=[
      [d.namaPesantren],
      ['LAPORAN HASIL BELAJAR SEMESTER'],
      ['Nama Santri',d.nama,'','Kelas',d.kelas],
      ['NISN',d.nisn,'','Wali Kelas',d.waliKelas],
      ['Tahun Ajaran',d.tahunAjaran,'','Semester','1 (Satu)'],
      [],
      ['No','Kompetensi / Mata Pelajaran','Pengetahuan','Keterampilan','Sikap']
    ];
    var no=0;
    d.kelompok.forEach(function(kg){
      rows.push([kg.kode+'. '+kg.nama,'','','','']);
      kg.mapel.forEach(function(m){
        no++;
        rows.push([no, m.nama, m.pengetahuan!==null?m.pengetahuan:'-', m.keterampilan!==null?m.keterampilan:'-', m.sikap!==null?m.sikap:'-']);
      });
    });
    rows.push([]);
    rows.push(['Keterangan: A=≥90 (Sangat Baik), B=80-89 (Baik), C=70-79 (Cukup), D=60-69 (Kurang), E=<60 (Sangat Kurang)']);

    var csv=bom+rows.map(function(r){
      return r.map(function(v){
        var s=String(v==null?'':v);
        if(s.includes(','))s='"'+s.replace(/"/g,'""')+'"';
        return s;
      }).join(',');
    }).join('\n');

    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='Rapor_'+d.nama.replace(/\s+/g,'_')+'_'+d.kelas+'_'+todayStr()+'.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  // Layout sidebar responsif dipakai Dashboard Guru & Admin/Mudir.
  // Desktop: sidebar tetap tampil di kiri. Mobile (<=860px): sidebar tersembunyi,
  // dibuka lewat tombol hamburger sebagai panel geser dengan overlay gelap.
  // ---------------- SLIDE PENGUMUMAN (ringan, tanpa library luar) ----------------
  // Satu timer global saja (dibersihkan tiap kali dipanggil ulang) supaya tidak ada
  // banyak interval menumpuk & memberatkan aplikasi saat pindah halaman/tab berkali-kali.
  var SLIDE_TIMER = null;
  function renderSlideBar(containerId){
    var container = document.getElementById(containerId);
    if (!container) return;
    if (SLIDE_TIMER) { clearInterval(SLIDE_TIMER); SLIDE_TIMER = null; }
    Promise.all([api('getSlideAktif', {level: STATE.user.level}), api('getPengaturan', {})]).then(function(hasil){
      if (!document.getElementById(containerId)) return; // user sudah pindah tampilan
      var resSlide = hasil[0], resP = hasil[1];
      if (!resSlide.ok || !resSlide.data.length) { container.innerHTML = ''; return; }
      var slides = resSlide.data;
      var jeda = (resP.ok && resP.data.SlideJedaDetik) ? Number(resP.data.SlideJedaDetik) : 5;
      if (!jeda || jeda < 2) jeda = 5;
      var idx = 0;

      var html = '<div class="slidebar" id="'+containerId+'_box">';
      slides.forEach(function(s, i){
        var inner = '<img src="'+esc(s.gambar)+'" alt="'+esc(s.judul)+'" loading="'+(i===0?'eager':'lazy')+'">' +
          (s.judul ? '<div class="slidebar-caption">'+esc(s.judul)+'</div>' : '');
        html += '<div class="slidebar-slide'+(i===0?' active':'')+'" data-i="'+i+'">' +
          (s.tautan ? ('<a href="'+esc(s.tautan)+'" target="_blank" rel="noopener" style="display:block;width:100%;height:100%">'+inner+'</a>') : inner) +
          '</div>';
      });
      if (slides.length > 1) {
        html += '<button class="slidebar-arrow prev" id="'+containerId+'_prev" aria-label="Sebelumnya">&#8249;</button>';
        html += '<button class="slidebar-arrow next" id="'+containerId+'_next" aria-label="Berikutnya">&#8250;</button>';
        html += '<div class="slidebar-dots">' + slides.map(function(_,i){return '<span class="slidebar-dot'+(i===0?' active':'')+'" data-i="'+i+'"></span>';}).join('') + '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
      if (slides.length <= 1) return;

      function tampilkan(i){
        idx = (i + slides.length) % slides.length;
        var box = document.getElementById(containerId+'_box');
        if (!box) return;
        box.querySelectorAll('.slidebar-slide').forEach(function(el){ el.classList.toggle('active', Number(el.dataset.i)===idx); });
        box.querySelectorAll('.slidebar-dot').forEach(function(el){ el.classList.toggle('active', Number(el.dataset.i)===idx); });
      }
      function resetTimer(){
        if (SLIDE_TIMER) clearInterval(SLIDE_TIMER);
        SLIDE_TIMER = setInterval(function(){ tampilkan(idx+1); }, jeda*1000);
      }
      document.getElementById(containerId+'_prev').onclick = function(){ tampilkan(idx-1); resetTimer(); };
      document.getElementById(containerId+'_next').onclick = function(){ tampilkan(idx+1); resetTimer(); };
      container.querySelectorAll('.slidebar-dot').forEach(function(dot){
        dot.onclick = function(){ tampilkan(Number(dot.dataset.i)); resetTimer(); };
      });
      resetTimer();
    });
  }

  function renderFormCatatPelanggaran(containerId){
    var c = document.getElementById(containerId);
    c.innerHTML = '<p>Memuat...</p>';
    Promise.all([api('getSemuaSantri', {}), api('getMasterPelanggaran', {}), api('getMasterPrestasi', {})]).then(function(hasil){
      var daftarSantri = hasil[0].ok ? hasil[0].data : [];
      var daftarPel = hasil[1].ok ? hasil[1].data : [];
      var daftarPres = hasil[2].ok ? hasil[2].data : [];
      if (!hasil[1].ok) { c.innerHTML = errBox(hasil[1].error); return; }
      c.innerHTML = '<div class="card"><h3>Catat Pelanggaran / Prestasi Santri</h3>' +
        '<label>Tanggal</label><input type="date" id="cpTanggal" value="'+todayStr()+'">' +
        fieldAutocomplete('cpSantri','Nama Santri', daftarSantri.map(labelSantri), '', 'Ketik nama/NISN santri...') +
        '<div class="grid2">' +
        '<div>' + fieldAutocomplete('cpPelanggaran','Pelanggaran (opsional)', daftarPel.map(function(x){return x.nama+' (-'+x.poin+' poin)';}), '', 'Ketik pelanggaran...') + '</div>' +
        '<div>' + fieldAutocomplete('cpPrestasi','Prestasi (opsional)', daftarPres.map(function(x){return x.nama+' (+'+x.poin+' poin)';}), '', 'Ketik prestasi...') + '</div>' +
        '</div>' +
        '<button id="btnSimpanPelanggaran">Simpan Pencatatan</button><div id="pesanCatatPelanggaran"></div></div>';

      document.getElementById('btnSimpanPelanggaran').onclick = function(){
        var nisn = resolveSantriNisn(document.getElementById('cpSantri').value.trim(), daftarSantri);
        if (!nisn) { document.getElementById('pesanCatatPelanggaran').innerHTML = errBox('Pilih santri yang valid dari saran yang muncul.'); return; }
        var santriObj = daftarSantri.find(function(s){ return String(s.nisn)===String(nisn); });
        var rawPel = document.getElementById('cpPelanggaran').value.trim();
        var rawPres = document.getElementById('cpPrestasi').value.trim();
        var pelObj = daftarPel.find(function(x){ return (x.nama+' (-'+x.poin+' poin)') === rawPel; });
        var presObj = daftarPres.find(function(x){ return (x.nama+' (+'+x.poin+' poin)') === rawPres; });
        if (rawPel && !pelObj) { document.getElementById('pesanCatatPelanggaran').innerHTML = errBox('Pelanggaran tidak dikenali, pilih dari saran yang muncul.'); return; }
        if (rawPres && !presObj) { document.getElementById('pesanCatatPelanggaran').innerHTML = errBox('Prestasi tidak dikenali, pilih dari saran yang muncul.'); return; }
        if (!pelObj && !presObj) { document.getElementById('pesanCatatPelanggaran').innerHTML = errBox('Isi minimal satu Pelanggaran atau Prestasi.'); return; }
        var btn = document.getElementById('btnSimpanPelanggaran'); btn.disabled = true; btn.innerText = 'Menyimpan...';
        api('savePencatatanPelanggaran', {
          tanggal: document.getElementById('cpTanggal').value, nisn: nisn, namaSantri: santriObj.nama,
          pelanggaran: pelObj ? pelObj.nama : '', poinPelanggaran: pelObj ? pelObj.poin : 0,
          prestasi: presObj ? presObj.nama : '', poinPrestasi: presObj ? presObj.poin : 0,
          namaPencatat: STATE.user.nama
        }).then(function(res){
          btn.disabled = false; btn.innerText = 'Simpan Pencatatan';
          if (!res.ok) { document.getElementById('pesanCatatPelanggaran').innerHTML = errBox(res.error); return; }
          document.getElementById('cpSantri').value=''; document.getElementById('cpPelanggaran').value=''; document.getElementById('cpPrestasi').value='';
          document.getElementById('pesanCatatPelanggaran').innerHTML = '<p class="muted">Tersimpan. Sisa poin '+santriObj.nama+' bulan ini: '+res.poinTerbaru+' ('+res.status+').</p>';
        });
      };
    });
  }

  // ---- Santri Saya: daftar semua santri lintas kelas & halaqoh yang diajar guru ini ----
  // ---- Modul Ajar & RPP (khusus mapel yang diajarkan guru ini) ----
  function guruModulAjar(){
    var c = document.getElementById(STATE._contentId||'dg-content');
    c.innerHTML = '<p>Memuat...</p>';
    // Ambil daftar mapel yang diajarkan guru ini dari jadwal
    api('getJadwalGuru', {pengampu: STATE.user.nama}).then(function(resJadwal){
      var mapelSet = {};
      if (resJadwal.ok) resJadwal.data.forEach(function(j){ mapelSet[j.mapel+'|'+j.kelas] = {mapel:j.mapel, kelas:j.kelas}; });
      var mapelList = Object.values(mapelSet);

      if (!mapelList.length) {
        c.innerHTML = '<div class="card">'+warnBox('Anda belum punya jadwal mengajar aktif. Hubungi Admin untuk menambahkan mata pelajaran.')+'</div>';
        return;
      }

      // Tampilkan daftar mapel sebagai tab, lalu muat konten tab pertama
      var activeMapel = mapelList[0];
      function renderTabMapel(selected){
        Promise.all([
          api('getModulAjarList', {mapel: selected.mapel, kelas: selected.kelas}),
          api('getRPPList', {mapel: selected.mapel, kelas: selected.kelas})
        ]).then(function(hasil){
          var resMA = hasil[0], resRPP = hasil[1];
          var html = '<div class="card">';
          // Tab mapel
          html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">' +
            mapelList.map(function(m){
              var isActive = m.mapel===selected.mapel && m.kelas===selected.kelas;
              return '<button class="'+(isActive?'':'secondary ')+' small btnTabMapel" data-mapel="'+esc(m.mapel)+'" data-kelas="'+esc(m.kelas)+'">'+esc(m.mapel)+' ('+esc(m.kelas)+')</button>';
            }).join('') + '</div>';

          html += '<h3>&#128218; '+esc(selected.mapel)+' &mdash; '+esc(selected.kelas)+'</h3>';

          // File-file modul ajar
          if (resMA.ok && resMA.data.length) {
            html += '<h4 style="color:#0d9488;margin:10px 0 6px">File Modul Ajar</h4>' +
              '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">' +
              resMA.data.map(function(ma){
                return '<button class="secondary small btnLihatMAGuru2" data-row="'+ma.rowIndex+'" style="display:flex;align-items:center;gap:5px">'+
                  '&#128196; '+esc(ma.namaFile)+'</button>';
              }).join('') + '</div>';
          } else {
            html += warnBox('Belum ada file modul ajar untuk mapel ini. Minta Admin untuk mengunggahnya.');
          }

          // RPP Pertemuan
          if (resRPP.ok && resRPP.data.length) {
            html += '<h4 style="color:#0d9488;margin:10px 0 6px">RPP Pertemuan</h4>';
            html += '<div id="rppPertemuanWrap">';
            resRPP.data.forEach(function(r){
              html += '<div style="border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;overflow:hidden">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f8fafc;cursor:pointer" class="rppToggleHeader" data-id="'+r.rowIndex+'">' +
                '<div><b>Pertemuan '+r.noPertemuan+' &mdash; '+esc(r.topik)+'</b>' +
                (r.namaBab?'<span class="muted" style="font-size:11.5px;margin-left:8px">'+esc(r.namaBab)+'</span>':'')+
                '</div><span class="rppChevron" style="transition:transform .2s">&#9660;</span></div>' +
                '<div class="rppBody" id="rppBody'+r.rowIndex+'" style="display:none;padding:14px">' +
                (r.pendahuluan?'<p><b>Pendahuluan:</b></p><p style="white-space:pre-wrap;font-size:13px">'+esc(r.pendahuluan)+'</p>':'')+
                (r.inti?'<p style="margin-top:10px"><b>Kegiatan Inti:</b></p><p style="white-space:pre-wrap;font-size:13px">'+esc(r.inti)+'</p>':'')+
                (r.penutup?'<p style="margin-top:10px"><b>Penutup:</b></p><p style="white-space:pre-wrap;font-size:13px">'+esc(r.penutup)+'</p>':'')+
                '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">' +
                (r.linkVideo?'<a href="'+esc(r.linkVideo)+'" target="_blank"><button class="secondary small">&#127909; Video</button></a>':'')+
                (r.linkSlide?'<a href="'+esc(r.linkSlide)+'" target="_blank"><button class="secondary small">&#128202; Slide PPT</button></a>':'')+
                (r.linkBukuAjar?'<a href="'+esc(r.linkBukuAjar)+'" target="_blank"><button class="secondary small">&#128214; Buku Ajar</button></a>':'')+
                '</div></div></div>';
            });
            html += '</div>';

            // Guru bisa tambah/edit RPP miliknya sendiri
            html += '<button class="secondary small" id="btnTambahRPPGuru" style="margin-top:8px">+ Tambah Pertemuan Baru</button>';
          } else {
            html += warnBox('Belum ada RPP pertemuan untuk mapel ini. Klik "+ Tambah Pertemuan" untuk mulai.');
            html += '<button class="secondary small" id="btnTambahRPPGuru">+ Tambah Pertemuan Baru</button>';
          }
          html += '</div>';
          c.innerHTML = html;

          // Binding tab mapel
          c.querySelectorAll('.btnTabMapel').forEach(function(btn){
            btn.onclick = function(){ renderTabMapel({mapel:btn.dataset.mapel, kelas:btn.dataset.kelas}); };
          });

          // Toggle accordion RPP
          c.querySelectorAll('.rppToggleHeader').forEach(function(header){
            header.onclick = function(){
              var body = document.getElementById('rppBody'+header.dataset.id);
              var chevron = header.querySelector('.rppChevron');
              if (body.style.display==='none') {
                body.style.display='block';
                chevron.style.transform='rotate(180deg)';
              } else {
                body.style.display='none';
                chevron.style.transform='';
              }
            };
          });

          // Tombol lihat modul ajar
          if (resMA.ok) {
            c.querySelectorAll('.btnLihatMAGuru2').forEach(function(btn){
              var ma = resMA.data.find(function(m){ return m.rowIndex===Number(btn.dataset.row); });
              btn.onclick = function(){ if(ma) tampilkanModulAjar(ma); };
            });
          }

          // Tombol tambah pertemuan (guru bisa input RPP miliknya sendiri)
          var btnTambah = document.getElementById('btnTambahRPPGuru');
          if (btnTambah) {
            btnTambah.onclick = function(){
              bukaFormRPP(null, resRPP.ok?resRPP.data:[], function(){ guruModulAjar(); });
              // Isi mapel & kelas otomatis berdasarkan yang sedang dilihat
              setTimeout(function(){
                var elMapel = document.getElementById('rMapel');
                var elKelas = document.getElementById('rKelas');
                if (elMapel) elMapel.value = selected.mapel;
                if (elKelas) elKelas.value = selected.kelas;
                if (elMapel) elMapel.disabled = true;
                if (elKelas) elKelas.disabled = true;
              }, 100);
            };
          }
        });
      }
      renderTabMapel(activeMapel);
    });
  }

        '<p class="muted">Hari ini: <b>'+hariIni+'</b>. Jadwal hari ini aktif (bisa diisi absen). Jadwal hari lain ditampilkan samar.</p></div>';

      // Jadwal hari ini -- AKTIF dan mencolok
      if (jadwalHariIni.length) {
        html += '<div class="card" style="border:2px solid #0d9488"><h4 style="color:#0d9488;margin-top:0">&#9989; Jadwal Hari Ini ('+hariIni+')</h4>';
        jadwalHariIni.forEach(function(j, idx) {
          var labelJam = j.jamKeList.length > 1 ? ('Jam ke-'+j.jamKeList.join(' & ')) : ('Jam ke-'+(j.jamKeList[0]||'?'));
          var badgePengganti = j.pengganti ?
            '<span style="background:#7c3aed;color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;margin-left:6px">Menggantikan: '+esc(j.guruAsli)+'</span>' : '';
          var idxGlobal = res.data.indexOf(j);
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e2e8f0">'+
            '<div><b style="font-size:15px">'+esc(j.mapel)+'</b> &mdash; '+esc(j.kelas)+'<br>'+
            '<span class="muted" style="font-size:12px">'+labelJam+' &bull; '+esc(j.hari)+'</span>'+badgePengganti+'</div>'+
            '<button class="btnIsiAbsen" data-idx="'+idxGlobal+'" style="white-space:nowrap">&#9999;&#65039; Isi Absensi</button>'+
            '</div>';
        });
        html += '</div>';
      } else {
        html += '<div class="card" style="border:2px solid #e2e8f0;opacity:.7">'+
          '<h4 style="color:#64748b;margin-top:0">&#128197; Jadwal Hari Ini ('+hariIni+')</h4>'+
          '<p class="muted">Tidak ada jadwal mengajar hari ini.</p></div>';
      }

      // Jadwal hari lain -- SAMAR, tidak bisa diklik
      if (jadwalLain.length) {
        // Kelompokkan per hari
        var perHari = {};
        var urutanHariList = ['Senin','Selasa','Rabu','Kamis',"Jum'at",'Jumat','Sabtu','Ahad',''];
        jadwalLain.forEach(function(j){
          var h = j.hari || '(Hari belum diisi)';
          if (!perHari[h]) perHari[h] = [];
          perHari[h].push(j);
        });

        html += '<div class="card" style="opacity:0.55;pointer-events:none;user-select:none">'+
          '<h4 style="color:#94a3b8;margin-top:0">&#128337; Jadwal Hari Lain</h4>';

        urutanHariList.forEach(function(hari){
          var namaHariTampil = hari || '(Hari belum diisi)';
          if (!perHari[namaHariTampil] && !perHari[hari]) return;
          var list = perHari[namaHariTampil] || perHari[hari] || [];
          html += '<div style="margin-bottom:10px"><div style="font-weight:600;color:#64748b;font-size:13px;margin-bottom:4px">'+
            (hari==='(Hari belum diisi)'?'&#9888;&#65039; ':'')+esc(namaHariTampil)+'</div>';
          list.forEach(function(j){
            var labelJam = j.jamKeList && j.jamKeList.length ? ('Jam ke-'+j.jamKeList.join(' & ')) : '';
            html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e2e8f0;font-size:13px">'+
              '<span><b>'+esc(j.mapel)+'</b> &mdash; '+esc(j.kelas)+'</span>'+
              '<span class="muted">'+esc(labelJam)+'</span>'+
              '</div>';
          });
          html += '</div>';
        });

        if (perHari['(Hari belum diisi)']) {
          html += '<div style="background:#fef9c3;border-radius:6px;padding:8px;font-size:12px;color:#92400e">'+
            '&#9888;&#65039; Beberapa jadwal belum memiliki hari/jam. Minta Admin melengkapi di menu Kelola Mata Pelajaran.</div>';
        }
        html += '</div>';
      }

      c.innerHTML = html;
      window.__jadwalGuru = res.data;
      c.querySelectorAll('.btnIsiAbsen').forEach(function(btn){
        btn.onclick = function(){ formAbsen(window.__jadwalGuru[Number(btn.dataset.idx)]); };
      });
    });
  }

  function formAbsen(j){
    var c = document.getElementById(STATE._contentId||'dg-content');
    c.innerHTML = '<p>Memuat...</p>';
    Promise.all([
      api('getSantriUntukAbsen', {kelas: j.kelas}),
      api('getRPPList', {mapel: j.mapel, kelas: j.kelas}),
      api('getModulAjarList', {mapel: j.mapel, kelas: j.kelas}),
      api('getSOPList', {kategori: 'Mengajar'}),
      api('getJurnalHariIni', {tanggal: todayStr(), pengampu: STATE.user.nama})
    ]).then(function(hasil){
      var resSantri = hasil[0], resRPP = hasil[1], resMA = hasil[2], resSOP = hasil[3], resJurnal = hasil[4];
      if(!resSantri.ok){ c.innerHTML = errBox(resSantri.error) + '<button id="btnBalikJadwal">Kembali</button>'; document.getElementById('btnBalikJadwal').onclick = guruJadwal; return; }
      if(!resSantri.data.length){ c.innerHTML = '<div class="card">'+warnBox(resSantri.peringatan||('Belum ada santri di kelas "'+j.kelas+'".'))+'<button id="btnBalikJadwal2">Kembali</button></div>'; document.getElementById('btnBalikJadwal2').onclick = guruJadwal; return; }
      var rppList = resRPP.ok ? resRPP.data : [];
      var rppAktif = rppList.length ? rppList[0] : null;
      var rppSebelum = rppAktif && rppList.length > 1 ? null : null;
      var rppBerikut = rppAktif ? rppList.find(function(r){ return r.noPertemuan === rppAktif.noPertemuan+1; }) : null;

      // -- Panel RPP --
      var htmlRPP = '<div class="card">';
      htmlRPP += '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<h3>&#128218; '+esc(j.mapel)+' &mdash; '+esc(j.kelas)+'</h3>'+
        (resMA.ok&&resMA.data.length ? '<button class="secondary small" id="btnBukaModul">Buka Modul Ajar</button>' : '')+'</div>';
      if(rppAktif){
        htmlRPP += '<div style="background:#f0fdf4;border-radius:10px;padding:14px;margin-top:10px">'+
          '<b>Pertemuan '+rppAktif.noPertemuan+' ('+rppAktif.alokasiJP+' JP) &mdash; '+esc(rppAktif.topik)+'</b>'+
          (rppAktif.namaBab ? '<p class="muted" style="margin:2px 0">'+esc(rppAktif.namaBab)+'</p>' : '')+
          '<button class="secondary small" id="btnExpandRPP" style="margin-top:6px">Lihat Langkah Kegiatan</button>'+
          '<div id="detailRPP" style="display:none;margin-top:10px">'+
          '<p><b>Pendahuluan:</b></p><p style="white-space:pre-wrap;font-size:13px">'+esc(rppAktif.pendahuluan)+'</p>'+
          '<p style="margin-top:8px"><b>Kegiatan Inti:</b></p><p style="white-space:pre-wrap;font-size:13px">'+esc(rppAktif.inti)+'</p>'+
          '<p style="margin-top:8px"><b>Penutup:</b></p><p style="white-space:pre-wrap;font-size:13px">'+esc(rppAktif.penutup)+'</p></div>'+
          (rppBerikut ? '<div style="margin-top:8px"><button class="secondary small" id="btnRPPBerikut">Pertemuan Berikutnya &#8594;</button></div>' : '')+
          (rppAktif.linkVideo||rppAktif.linkSlide||rppAktif.linkBukuAjar ? '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">'+
            (rppAktif.linkVideo ? '<a href="'+esc(rppAktif.linkVideo)+'" target="_blank"><button class="secondary small">&#127909; Video</button></a>' : '')+
            (rppAktif.linkSlide ? '<a href="'+esc(rppAktif.linkSlide)+'" target="_blank"><button class="secondary small">&#128202; Slide</button></a>' : '')+
            (rppAktif.linkBukuAjar ? '<a href="'+esc(rppAktif.linkBukuAjar)+'" target="_blank"><button class="secondary small">&#128214; Buku Ajar</button></a>' : '')+
            '</div>' : '') + '</div>';
      } else { htmlRPP += warnBox('Belum ada RPP untuk mapel ini. Admin bisa menambahkan lewat menu Modul Ajar & RPP.'); }
      if(resSOP.ok&&resSOP.data.length){
        htmlRPP += '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:#64748b">&#128203; Lihat SOP Mengajar</summary>'+
          resSOP.data.map(function(s){ return '<pre style="background:#f8fafc;padding:10px;border-radius:8px;white-space:pre-wrap;font-family:inherit;font-size:12.5px;margin-top:8px">'+esc(s.isi)+'</pre>'; }).join('')+'</details>';
      }
      htmlRPP += '</div>';

      // -- Form Absensi --
      var labelJam = j.jamKeList.length>1 ? ('Jam ke-'+j.jamKeList.join(' & ')) : ('Jam ke-'+j.jamKeList[0]);
      var htmlAbsen = '<div class="card"><h3>Absensi '+esc(j.mapel)+' - '+esc(j.kelas)+' ('+labelJam+')</h3>'+
        (j.jamKeList.length>1 ? warnBox('Tercatat untuk '+j.jamKeList.length+' jam pelajaran sekaligus.') : '')+
        '<label class="muted">Tanggal</label><input type="date" id="absenTanggal" value="'+todayStr()+'" '+(STATE.pengaturan.IzinkanGantiTanggal?'':'disabled')+ '>'+
        (STATE.pengaturan.IzinkanGantiTanggal ? '' : '<p class="faded">Tanggal terkunci ke hari ini.</p>')+
        '<div id="formAbsenSantri">';
      resSantri.data.forEach(function(s){
        htmlAbsen += '<div class="santriRowAbsen" data-nisn="'+esc(s.nisn)+'" data-nama="'+esc(s.nama)+'">'+
          '<b>'+esc(s.nama)+'</b> <span class="muted">('+esc(s.nisn)+')</span><br>'+
          '<select class="statusSelect">'+['Hadir','Sakit','Izin','Alpa'].map(function(st){return '<option value="'+st+'">'+st+'</option>';}).join('')+'</select>'+
          '<input placeholder="Keterangan (opsional)" class="ketInput">'+
          '<div class="grid4">'+['Kedisiplinan','Kesopanan','Keaktifan','Tanggung Jawab'].map(function(lbl,i){
            return '<div><span class="muted" style="font-size:10px">'+lbl+'</span><select class="sikapSelect">'+[1,2,3,4].map(function(v){return '<option value="'+v+'" '+(v===4?'selected':'')+'>'+v+'</option>';}).join('')+'</select></div>';
          }).join('')+'</div></div>';
      });
      htmlAbsen += '</div><button type="button" id="btnSimpanAbsen">Simpan Absensi</button>'+
        '<button type="button" class="secondary" id="btnBatalAbsen">Batal</button>'+
        '<div id="pesanSimpanAbsen"></div></div>';

      c.innerHTML = htmlRPP + htmlAbsen;

      if(document.getElementById('btnExpandRPP')){
        document.getElementById('btnExpandRPP').onclick = function(){
          var d=document.getElementById('detailRPP'),btn=document.getElementById('btnExpandRPP');
          d.style.display=d.style.display==='none'?'block':'none';
          btn.textContent=d.style.display==='block'?'Tutup Langkah':'Lihat Langkah Kegiatan';
        };
      }
      if(document.getElementById('btnRPPBerikut')&&rppBerikut){
        document.getElementById('btnRPPBerikut').onclick = function(){ rppAktif=rppBerikut; formAbsen(j); };
      }
      if(document.getElementById('btnBukaModul')&&resMA.ok){
        document.getElementById('btnBukaModul').onclick = function(){ tampilkanDaftarModulAjar(resMA.data, j.mapel); };
      }
      document.getElementById('btnBatalAbsen').onclick = guruJadwal;
      document.getElementById('btnSimpanAbsen').onclick = function(){
        var items = [];
        document.querySelectorAll('#formAbsenSantri > div').forEach(function(row){
          var sikapEls = row.querySelectorAll('.sikapSelect');
          items.push({nisn:row.dataset.nisn, nama:row.dataset.nama, status:row.querySelector('.statusSelect').value,
            keterangan:row.querySelector('.ketInput').value,
            sikap1:Number(sikapEls[0].value), sikap2:Number(sikapEls[1].value), sikap3:Number(sikapEls[2].value), sikap4:Number(sikapEls[3].value)});
        });
        var btn=document.getElementById('btnSimpanAbsen'); btn.disabled=true; btn.innerText='Menyimpan...';
        var tanggalDipakai=(document.getElementById('absenTanggal').value)||todayStr();
        api('submitAbsensi',{tanggal:tanggalDipakai, hari:hariDariTanggal(tanggalDipakai)||j.hari, jamKeList:j.jamKeList, mapel:j.mapel, kelas:j.kelas, pengampu:STATE.user.nama, items:items})
          .then(function(res2){
            if(!res2.ok){ document.getElementById('pesanSimpanAbsen').innerHTML=errBox(res2.error); btn.disabled=false; btn.innerText='Simpan Absensi'; return; }
            if(res2.offline){ document.getElementById('pesanSimpanAbsen').innerHTML='<div style="background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:13px">'+res2.pesanOffline+'</div>'; btn.disabled=false; btn.innerText='Simpan Absensi'; return; }
            tampilkanFormJurnal(j, rppAktif, tanggalDipakai, resJurnal.ok?resJurnal.data.find(function(jr){return jr.mapel===j.mapel&&jr.kelas===j.kelas;}):null);
          });
      };
    });
  }

  // Tampilkan daftar file modul ajar untuk satu mapel (dipanggil dari panel RPP)
  function tampilkanDaftarModulAjar(daftar, mapel){
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = '<div class="modal" style="max-width:480px"><h3>&#128218; Modul Ajar &mdash; '+esc(mapel)+'</h3>' +
      '<p class="muted">Klik nama file untuk melihat ringkasan & isi lengkap</p>' +
      daftar.map(function(ma){
        return '<div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center">' +
          '<div><b>'+esc(ma.namaFile)+'</b><br><span class="muted" style="font-size:11.5px">'+esc(ma.kategori)+' | '+esc(ma.kurikulum)+'</span></div>' +
          '<button class="small btnLihatMAGuru" data-row="'+ma.rowIndex+'">Buka</button></div>';
      }).join('') +
      '<button class="secondary" style="margin-top:14px;width:100%" id="btnTutupDaftarMA">Tutup</button></div>';
    root.appendChild(overlay);
    overlay.querySelector('#btnTutupDaftarMA').onclick = function(){ root.removeChild(overlay); };
    overlay.querySelectorAll('.btnLihatMAGuru').forEach(function(btn){
      var ma = daftar.find(function(m){ return m.rowIndex===Number(btn.dataset.row); });
      btn.onclick = function(){ root.removeChild(overlay); tampilkanModulAjar(ma); };
    });
  }

  // Form jurnal mengajar WAJIB setelah simpan absensi berhasil
  function tampilkanFormJurnal(j, rppAktif, tanggal, jurnalExisting){
    var c = document.getElementById(STATE._contentId||'dg-content');
    api('getDefaultJurnal', {mapel: j.mapel}).then(function(resDefault){
      var teksDefault = resDefault.ok ? resDefault.data : 'Pembelajaran berlangsung sesuai RPP.';
      var isEdit = !!jurnalExisting;
      var idRPPRef = rppAktif ? (rppAktif.id+'|'+rppAktif.noPertemuan) : '';
      c.innerHTML = '<div class="card">' +
        '<div style="background:#0d9488;color:#fff;border-radius:10px;padding:14px;margin-bottom:14px">' +
        '<h3 style="margin:0;color:#fff">&#128221; Jurnal Mengajar</h3>' +
        '<p style="margin:4px 0 0;opacity:.85;font-size:13px">Wajib diisi sebelum meninggalkan kelas</p></div>' +
        (rppAktif ? '<p class="muted" style="margin-bottom:10px">Pertemuan '+rppAktif.noPertemuan+' &mdash; '+esc(rppAktif.topik)+'</p>' : '') +
        '<label>Materi yang Disampaikan <span style="color:#dc2626">*</span></label>' +
        '<textarea id="jMateri" rows="4" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit">'+esc(isEdit ? jurnalExisting.materiDisampaikan : teksDefault)+'</textarea>' +
        '<label>Metode Pembelajaran</label>' +
        '<input id="jMetode" value="'+esc(isEdit ? jurnalExisting.metode : 'Ceramah, Tanya Jawab, Latihan')+'">' +
        '<label>Hambatan / Kendala</label>' +
        '<input id="jHambatan" value="'+esc(isEdit ? jurnalExisting.hambatan : '-')+'">' +
        '<label>Tindak Lanjut</label>' +
        '<input id="jTindak" value="'+esc(isEdit ? jurnalExisting.tindakLanjut : '-')+'">' +
        '<label>Catatan Tambahan (opsional)</label>' +
        '<textarea id="jCatatan" rows="2" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit">'+esc(isEdit ? jurnalExisting.catatanTambahan : '')+'</textarea>' +
        '<div id="pesanJurnal" style="margin-top:8px"></div>' +
        '<button id="btnSimpanJurnal" style="margin-top:10px">&#128190; Simpan Jurnal & Selesai</button> ' +
        '<button class="secondary" id="btnCetakSesi">&#128424; Cetak Rekap Sesi</button></div>';

      document.getElementById('btnSimpanJurnal').onclick = function(){
        var materi = document.getElementById('jMateri').value.trim();
        if (!materi){ document.getElementById('pesanJurnal').innerHTML = errBox('Isi materi yang disampaikan.'); return; }
        var btn = document.getElementById('btnSimpanJurnal'); btn.disabled=true; btn.textContent='Menyimpan...';
        api('simpanJurnal', {
          tanggal:tanggal, hari:hariDariTanggal(tanggal)||j.hari, mapel:j.mapel, kelas:j.kelas,
          jamKe:j.jamKeList.join(','), pengampu:STATE.user.nama, idRPP:idRPPRef,
          materiDisampaikan:materi, metode:document.getElementById('jMetode').value,
          hambatan:document.getElementById('jHambatan').value,
          tindakLanjut:document.getElementById('jTindak').value,
          catatanTambahan:document.getElementById('jCatatan').value,
          statusJurnal:'Diisi Guru'
        }).then(function(res){
          if(!res.ok){ document.getElementById('pesanJurnal').innerHTML = errBox(res.error); btn.disabled=false; btn.textContent='&#128190; Simpan Jurnal & Selesai'; return; }
          alert('Jurnal tersimpan. Sesi mengajar selesai.');
          guruJadwal();
        });
      };

      document.getElementById('btnCetakSesi').onclick = function(){
        cetakRekapSesi(j, rppAktif, tanggal,
          document.getElementById('jMateri').value,
          document.getElementById('jMetode').value);
      };
    });
  }

  // Cetak rekap sesi mengajar (RPP + Absensi + Jurnal) langsung dari browser
  function cetakRekapSesi(j, rppAktif, tanggal, materi, metode){
    var namaSekolah = STATE.pengaturan.NamaPesantren || 'Pondok Pesantren';
    var santriRows = document.querySelectorAll('.santriRowAbsen');
    var jmlHadir=0, jmlSakit=0, jmlIzin=0, jmlAlpa=0;

      var st=row.querySelector('.statusSelect').value;
      if(st==='Hadir')jmlHadir++;else if(st==='Sakit')jmlSakit++;else if(st==='Izin')jmlIzin++;else jmlAlpa++;
    });
    var win = window.open('','_blank');
    win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rekap Sesi</title>' +
      '<style>body{font-family:Arial,sans-serif;max-width:700px;margin:20px auto;font-size:13px}' +
      'h1{font-size:16px;text-align:center;margin-bottom:4px}h2{font-size:13px;border-bottom:2px solid #000;padding-bottom:3px;margin-top:14px}' +
      'table{width:100%;border-collapse:collapse;margin-top:6px}td,th{border:1px solid #999;padding:5px 8px;font-size:12px}th{background:#eee}' +
      '@media print{body{margin:10px}}</style></head><body>' +
      '<h1>REKAP SESI MENGAJAR<br><small>'+esc(namaSekolah)+'</small></h1>' +

      '<table><tr><td width="35%"><b>Mata Pelajaran</b></td><td>'+esc(j.mapel)+'</td></tr>' +
      '<tr><td><b>Kelas</b></td><td>'+esc(j.kelas)+'</td></tr>' +
      '<tr><td><b>Tanggal</b></td><td>'+esc(tanggal)+'</td></tr>' +
      '<tr><td><b>Jam Ke</b></td><td>'+esc(j.jamKeList.join(', '))+'</td></tr>' +
      '<tr><td><b>Pengampu</b></td><td>'+esc(STATE.user.nama)+'</td></tr>' +
      (rppAktif ? '<tr><td><b>Pertemuan RPP</b></td><td>'+rppAktif.noPertemuan+' &mdash; '+esc(rppAktif.topik)+'</td></tr>' : '') +
      '</table>' +
      (rppAktif && rppAktif.pendahuluan ?
        '<h2>RPP Pertemuan</h2>' +
        '<table><tr><td width="25%"><b>Pendahuluan</b></td><td style="white-space:pre-wrap">'+esc(rppAktif.pendahuluan)+'</td></tr>' +
        '<tr><td><b>Kegiatan Inti</b></td><td style="white-space:pre-wrap">'+esc(rppAktif.inti)+'</td></tr>' +
        '<tr><td><b>Penutup</b></td><td style="white-space:pre-wrap">'+esc(rppAktif.penutup)+'</td></tr></table>' : '') +
      '<h2>Daftar Hadir Santri</h2>' +
      '<table><tr><th>No</th><th>Nama</th><th>Status</th><th>Keterangan</th></tr>' +
      Array.from(santriRows).map(function(row,i){
        return '<tr><td>'+(i+1)+'</td><td>'+esc(row.dataset.nama)+'</td>' +
          '<td>'+esc(row.querySelector('.statusSelect').value)+'</td>' +
          '<td>'+esc(row.querySelector('.ketInput').value)+'</td></tr>';
      }).join('') +
      '<tr style="font-weight:bold"><td colspan="2">Ringkasan</td><td colspan="2">' +
      'Hadir:'+jmlHadir+' | Sakit:'+jmlSakit+' | Izin:'+jmlIzin+' | Alpa:'+jmlAlpa+'</td></tr></table>' +
      '<h2>Jurnal Mengajar</h2>' +
      '<table><tr><td width="30%"><b>Materi Disampaikan</b></td><td style="white-space:pre-wrap">'+esc(materi)+'</td></tr>' +
      '<tr><td><b>Metode</b></td><td>'+esc(metode)+'</td></tr></table>' +
      '<br><table><tr>' +
      '<td style="width:50%;padding:28px;text-align:center;border:1px solid #999">Mengetahui,<br>Kepala Pesantren<br><br><br><br>(__________________)</td>' +
      '<td style="width:50%;padding:28px;text-align:center;border:1px solid #999">Guru Pengampu,<br><br><br><br>'+esc(STATE.user.nama)+'</td>' +
      '</tr></table>' +
      '<script>setTimeout(function(){window.print();},400);<\/script></body></html>');
    win.document.close();
  }

  function guruRiwayat(){

  // ---------------- KOMPONEN BERSAMA: grafik & panel rekap lengkap santri ----------------
  // Dipakai di dashboard Wali Santri, Admin/Mudir, dan Guru ("Santri Saya") supaya

  // Grafik garis sederhana (SVG murni, tanpa library luar) menampilkan akumulasi
  // halaman hafalan baru dari waktu ke waktu.
  function buildLineChartSVG(data){
    if (!data || !data.length) return '<p class="muted">Belum ada data hafalan pada periode ini.</p>';
    var width = 640, height = 220, padding = 40;
    var maxY = Math.max.apply(null, data.map(function(d){return d.kumulatif;}));
    if (maxY <= 0) maxY = 1;
    var stepX = data.length > 1 ? (width - padding*2) / (data.length - 1) : 0;
    var points = data.map(function(d,i){
      var x = padding + i*stepX;
      var y = height - padding - (d.kumulatif / maxY) * (height - padding*2);
      return {x:x, y:y, d:d};
    });
    var pathD = points.map(function(p,i){ return (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
    var areaD = pathD + ' L' + points[points.length-1].x.toFixed(1) + ',' + (height-padding) + ' L' + points[0].x.toFixed(1) + ',' + (height-padding) + ' Z';
    var circles = points.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="#0d9488"><title>'+esc(p.d.tanggal)+': '+p.d.halamanHariItu+' halaman (total '+p.d.kumulatif+')</title></circle>'; }).join('');
    return '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;background:#fafafa;border-radius:8px">' +
      '<line x1="'+padding+'" y1="'+(height-padding)+'" x2="'+(width-padding)+'" y2="'+(height-padding)+'" stroke="#ccc"/>' +
      '<line x1="'+padding+'" y1="'+padding+'" x2="'+padding+'" y2="'+(height-padding)+'" stroke="#ccc"/>' +
      '<path d="'+areaD+'" fill="rgba(13,148,136,0.12)" stroke="none"/>' +
      '<path d="'+pathD+'" fill="none" stroke="#0d9488" stroke-width="2"/>' + circles +
      '<text x="'+padding+'" y="'+(height-8)+'" font-size="11" fill="#777">'+esc(data[0].tanggal)+'</text>' +
      '<text x="'+(width-padding-70)+'" y="'+(height-8)+'" font-size="11" fill="#777">'+esc(data[data.length-1].tanggal)+'</text>' +
      '<text x="'+padding+'" y="16" font-size="11" fill="#777">Total halaman baru pada periode ini: '+maxY+'</text>' +
      '</svg>';
  }

  // Panel: Kehadiran+Sikap, Progres Hafalan, Riwayat Hafalan (filter bulan), Grafik (filter semester/tahun ajaran)
  // Kecilkan & kompres gambar di browser (canvas) SEBELUM diunggah ke server, supaya
  // ukuran file kecil (cepat diunggah) dan slide tetap ringan dimuat semua pengguna.
  function resizeImageFile(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxWidth / img.width);
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        };
        img.onerror = function(){ reject(new Error('Gagal membaca gambar')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Gagal membaca file')); };
      reader.readAsDataURL(file);
    });
  }

  function formatRupiah(n){

  // ---------------- DRAFT OTOMATIS FORM HAFALAN ----------------
  // Melindungi dari kehilangan isian kalau terjadi error/reload/koneksi putus SEBELUM
  // sempat klik Simpan -- setiap perubahan pada form langsung disalin ke localStorage
  // (penyimpanan di HP/browser sendiri, bukan ke server), dan dipulihkan otomatis kalau
  // pengampu membuka lagi form yang sama (halaqoh+waktu+tanggal+pengampu yang sama persis).
  function draftHafalanKey(namaHalaqoh, waktu, tanggal, pengampu){
    return 'wasiatDraftHafalan|' + namaHalaqoh + '|' + waktu + '|' + tanggal + '|' + pengampu;
  }
  function simpanDraftHafalan(key){
    try {
      var data = {};
      document.querySelectorAll('#formHafalan > div').forEach(function(row){
        data[row.dataset.nisn] = {
          jenis: row.querySelector('.jenisSelect').value,
          surah: row.querySelector('.surahInput').value,
          ayatAwal: row.querySelector('.ayatAwalInput').value,
          ayatAkhir: row.querySelector('.ayatAkhirInput').value,
          juz: row.querySelector('.juzInput').value,
          halamanAwal: row.querySelector('.halamanAwalInput').value,
          halamanAkhir: row.querySelector('.halamanAkhirInput').value,
          nilai: row.querySelector('.nilaiSelect').value
        };
      });
      localStorage.setItem(key, JSON.stringify({waktuSimpan: Date.now(), data: data}));
    } catch(e) { /* localStorage penuh/nonaktif -- diamkan, jangan sampai mengganggu pengisian */ }
  }
  function ambilDraftHafalan(key){
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return parsed && parsed.data ? parsed.data : null;
    } catch(e) { return null; }
  }
  function hapusDraftHafalan(key){
    try { localStorage.removeItem(key); } catch(e) {}
  }
  function debounce(fn, delay){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, delay);
    };
  }
  // Draft yang sudah lebih dari 3 hari dianggap tidak akan dilanjutkan lagi (misal sesi
  // hafalan hari itu sudah pindah tanggal) -- dibersihkan otomatis supaya tidak menumpuk
  // selamanya di penyimpanan HP. Dipanggil sekali saat aplikasi pertama dibuka.
  function bersihkanDraftHafalanLama(){
    try {
      var batasWaktu = Date.now() - (3*24*60*60*1000);
      var keysHapus = [];
      for (var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if (k && k.indexOf('wasiatDraftHafalan|') === 0) {
          try {
            var parsed = JSON.parse(localStorage.getItem(k));
            if (!parsed || !parsed.waktuSimpan || parsed.waktuSimpan < batasWaktu) keysHapus.push(k);
          } catch(e) { keysHapus.push(k); }
        }
      }
      keysHapus.forEach(function(k){ localStorage.removeItem(k); });
    } catch(e) { /* localStorage nonaktif -- diamkan */ }
  }

  function muatFormHafalan(namaHalaqoh, waktu, tanggal){
